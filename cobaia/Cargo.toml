# cobaia — the rust version envelope crate of the family (the cargo channel).
# The crate carries the version constant the metadata lockstep stamps (the
# cobaia.java precedent: the registry lanes reference it, never compile it
# locally), the lane builds with `cargo package --no-verify --allow-dirty`
# and stamps the version before building.
[package]
name = "wenathlan-cobaia"
version = "2.0.176"
edition = "2021"
description = "The monetization surface — the plans, the support rails and the honest advertisement slots"
license = "GPL-3.0-only"
repository = "https://github.com/wenathlan/devthink"
authors = ["wenathlan"]

[lib]
name = "cobaia"
path = "cobaia.rs"
