# the vulnerability overrides of the family security gate (the devthink
# override contract): pnpm 12 reads overrides here, the lockfile regenerates
# against these pins and the OSV scan of the committed lockfile answers clean.
overrides:
  undici: ^7.30.1
  zod: ^4.6.7
  follow-redirects: ^1.16.1
  fast-uri: ^3.1.9
  body-parser: ^2.4.0
  esbuild: ^0.28.2
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1

# the freshly published security fixes install before they age: pnpm 12
# verifies the supply-chain age by default and these four corrections ride
# the exclusion so the family heals now, not after the waiting window.
minimumReleaseAgeExclude:
  - body-parser@2.4.0
  - fast-uri@3.1.9
  - follow-redirects@1.16.1
  - zod@4.6.6
  - '@biomejs/biome@2.6.3 || 2.6.4'
  - '@biomejs/cli-android-arm64@2.6.3 || 2.6.4'
  - '@biomejs/cli-android-x64@2.6.3 || 2.6.4'
  - '@biomejs/cli-darwin-arm64@2.6.3 || 2.6.4'
  - '@biomejs/cli-darwin-x64@2.6.3 || 2.6.4'
  - '@biomejs/cli-linux-arm64-musl@2.6.3 || 2.6.4'
  - '@biomejs/cli-linux-arm64@2.6.3 || 2.6.4'
  - '@biomejs/cli-linux-x64-musl@2.6.3 || 2.6.4'
  - '@biomejs/cli-linux-x64@2.6.3 || 2.6.4'
  - '@biomejs/cli-win32-arm64@2.6.3 || 2.6.4'
  - '@biomejs/cli-win32-x64@2.6.3 || 2.6.4'
  - '@types/node@26.6.6'
  - '@capacitor/android@8.6.0'
  - '@capacitor/cli@8.6.0'
  - '@capacitor/core@8.6.0'
  - '@capacitor/ios@8.6.0'
  - '@opencode-ai/sdk@1.19.5'
  - react-resizable-panels@4.15.1

# the pnpm settings live here since pnpm 12 (the package.json pnpm field is
# no longer read, and onlyBuiltDependencies died in pnpm 11 — the map below
# is allowBuilds). the honest-site surface builds exactly the engines its db
# layer and toolchain ride on; nothing else is granted a build script.
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
dangerouslyAllowAllBuilds: false
