# getry docker-compose — the two-service deploy of the gateway face: the
# static theme served by the getry-face nginx door beside the /api/* proxy lane
# that carries every platform call to the getry engine. until this file the
# app rode the registry image alone: no compose seated the pair, and every
# /api call of the face answered the away rehearsal. this file wires the
# pair the vault compose law standardizes:
#
#   getry-engine  the getry site container the publish lane builds from the staged
#           family context (the app nested under app/ with the saddle,
#           devthink, debonair and vault siblings the gateway map carries);
#           the gateway transport (server.ts) rides the os image the family
#           ships (COPY getry /getry — the deployable gateway law)
#   getry-face  the nginx surface: the family conf (nginx.conf) mounted over
#           the default conf — the resolver law, the security header law,
#           the gzip and cache law, the /api/* proxy lane to the engine,
#           the spa rewrite as try_files, host 8088 published on 8080.
#
# the engine image is the one the registry lane publishes (ghcr.io/wenathlan/getry:<version>
# — the publish matrix); the publish matrix builds the same image from the staged family context (the app nested under app/ with the saddle, devthink, debonair and vault siblings the gateway map carries):
#
#   rm -rf familybuildctx && mkdir -p familybuildctx/app
#   cp -a getry/. familybuildctx/app/
#   cp -a vault/. familybuildctx/vault/ && rm -rf familybuildctx/vault/node_modules
#   docker build -f getry/Dockerfile familybuildctx
#
# the /api lane carries the platform calls same-origin: the face proxies
# them to the getry container, and the data lanes the browser contract
# demands ride the configured gateway base the build stamps (the https law
# the modules carry).

services:
  getry-engine:
    image: "ghcr.io/wenathlan/getry:${GETRY_VERSION:-2.0.167}"
    # the engine never publishes a port by default: the face proxies it on
    # the private compose network (the vault precedent). uncomment to serve
    # the engine lane directly behind your own door:
    # ports:
    #   - "3218:8080"
    # the healthcheck rides the image (wget -qO- http://127.0.0.1:8080/ —
    # the listen probe the site container carries): the face gates on it below.
    init: true
    restart: unless-stopped

  getry-face:
    image: "ghcr.io/wenathlan/getry:${GETRY_VERSION:-2.0.167}"
    volumes:
      # the family conf over the default site conf: the resolver law, the
      # security headers, the gzip and cache law, the /api proxy lane.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # the face starts only when the engine health lane answered — the
      # proxy upstream is live before the first /api/* call arrives.
      getry-engine:
        condition: service_healthy
    ports:
      # the public door: host 8088 → the unprivileged nginx on 8080.
      # remap freely ("8089:8080") when another service owns the host.
      - "8088:8080"
    restart: unless-stopped
