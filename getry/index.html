<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* the typed-URL law: the address typed straight at this app's subpath
         lands INSIDE the os — the boot redirects to the os panel with the
         arrive handoff before anything paints (the power clip then opens
         the app window, the same window the desktop double click opens);
         ?independent keeps this presentation site and the embedded boots
         (self != top) never redirect */
      (function () {
        try {
          if (window.self !== window.top) return;
          if (/[?&]independent\b/.test(window.location.search)) return;
          var os = new URL("../panel", window.location.href);
          os.searchParams.set("arrive", "getry");
          window.location.replace(os.href);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="getry is the AI gateway of the wenathlan family: five provider gateways (v1 zai, v2 babel, v3 nvidia, v4 opencode+kilo, v5 openrouter) serving 35 OpenAI-compatible routes with the 7-level thinking system and the session store."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the trylle triad: Inter Variable rides every surface, Geist Mono rides
         micro-labels and the numbers (display=swap, never FOUT-blocked) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Geist+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>getry</title>
    <meta property="og:title" content="getry" />
    <link rel="stylesheet" href="./Sol/sol.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./App.tsx"></script>
  </body>
</html>
