# the vulnerability overrides of the family security gate (the devthink
# override contract): pnpm 12 reads overrides here, the lockfile regenerates
# against these pins and the OSV scan of the committed lockfile answers clean.
overrides:
  undici: ^7.30.1
  zod: ^4.6.7
  follow-redirects: ^1.16.1
  fast-uri: ^3.1.9
  body-parser: ^2.4.0
  esbuild: ^0.28.2
  deepmerge-ts: ^8.0.0
  mysql2: ^3.24.6
  uuid: ^11.1.1
  postcss-selector-parser: ^7.1.6
  source-map-js: 1.2.2
  katex: ^0.18.2
  proxy-addr: 2.0.8

# the pnpm settings live here since pnpm 12 (the package.json pnpm field is
# application policy: getry
# no longer read): the build scripts the dependency tree may run, every
# other script stays ignored.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - cpu-features
  - esbuild
  - prisma
  - protobufjs
  - ssh2
  - workerd
dangerouslyAllowAllBuilds: true
minimumReleaseAgeExclude:
  - zod@4.6.6 || 4.6.7
  - follow-redirects@1.16.1
  - fast-uri@3.1.9
  - body-parser@2.4.0
  - '@opencode-ai/sdk@1.18.34 || 1.19.5'
  - framer-motion@13.5.0
  - motion-dom@13.5.0
  - motion-utils@13.5.0
  - vite@8.3.2
  - react-hook-form@7.91.0
  - '@biomejs/biome@2.6.3 || 2.6.4'
  - '@biomejs/cli-android-arm64@2.6.3 || 2.6.4'
  - '@biomejs/cli-android-x64@2.6.3 || 2.6.4'
