# getry — the rust version envelope crate of the family (the cargo channel).
# The crate carries the version constant the metadata lockstep stamps (the
# getry.java precedent: the registry lanes reference it, never compile it
# locally), the lane builds with `cargo package --no-verify --allow-dirty`
# and stamps the version before building.
[package]
name = "wenathlan-getry"
version = "2.0.168"
edition = "2021"
description = "The AI gateway — five provider gateways serving 35 OpenAI-compatible routes"
license = "GPL-3.0-only"
repository = "https://github.com/wenathlan/devthink"
authors = ["wenathlan"]

[lib]
name = "getry"
path = "getry.rs"
