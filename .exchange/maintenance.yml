# saddled adaptation draft — applies to wenathlan/saddle
# The DevThink maintenance ladder (the automated dependency ladder of the
# R3 restoration), adapted to the saddle repository: the npm layout of
# the saddle tree, the web/package.json mirror doctrine ("the same set,
# the same numbers"), the workflow action pins of the saddle lane family,
# and the twenty-plus carrier lockstep the saddle version bump stamps by
# literal replacement (the repository carries no restamp script, so the
# ladder performs the stamp the manual bump loop always performed).
name: saddle maintenance

on:
  workflow_run:
    # the security pipeline completion keeps the ladder proposals fresh
    # (the DevThink trigger scheme; the saddle security workflow answers
    # under the plain name "security").
    workflows: [security]
    types: [completed]
  schedule:
    # the weekly proposal window and the daily cache retention window
    - cron: "37 4 * * 1"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      allow_major_updates:
        description: Permit explicitly reviewed breaking updates for dependencies, Node and GitHub Actions.
        required: true
        default: false
        type: boolean
      apply_cache_cleanup:
        description: Delete qualifying caches; false only reports candidates.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: saddle-maintain-versions
  cancel-in-progress: false

# The automated dependency ladder of the saddle repository: every run
# applies every non-breaking update available at run time (the npm
# dependency set through npm-check-updates bounded at minor, the mirrored
# web/package.json numbers kept in lockstep with the root set, and the
# versioned GitHub Actions references of the workflow family), derives
# the next patch number of the ladder with plain arithmetic on
# package.json (the current rung plus one - never a hardcoded number),
# lands the complete bump across the saddle carrier lockstep (package
# manifests, config envelopes, registry envelopes, web carriers and the
# changelog section) and validates the whole battery before anything
# touches main.
#
# The landing path (the DevThink ladder doctrine): the change set rides a
# dated automation branch, an archive tag preserves it
# (archive/automation/<branch>), the pull request runs the CI battery,
# and the squash merge lands it on main with linear history - the branch
# is deleted after the merge, and when the pipeline answers red the pull
# request is closed and its branch deleted so no rung ever stays open.
#
# Because pushes performed with the workflow GITHUB_TOKEN never fire
# other workflows, the run performs the release validation auto-tag work
# itself - the battery, the envelope lockstep gate, the tag, the
# changelog-body release and the source archive - and then dispatches
# every publish lane explicitly on the tag (the release published event
# the ladder's GITHUB_TOKEN creates never cascades either, and the
# workflow_run cascade of the saddle publish lanes requires the release
# validation workflow to have been triggered by a push, which the
# GITHUB_TOKEN squash merge never is). The explicit dispatch loop is the
# saddle mapping of the single release dispatch the DevThink ladder
# performs.
jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout the full saddle history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node for the proposal
        uses: actions/setup-node@v7.0.0
        with:
          node-version: node
      - name: Install the dependency tree
        run: npm ci --no-audit --no-fund
      - name: Propose latest non-breaking npm dependency updates
        # the npm layout mapping of the DevThink dependency:updates step:
        # npm-check-updates bounded at minor keeps every specifier inside
        # its semver-compatible range (the saddle doctrine "the
        # semver-compatible ladder"), and the majors stay behind the
        # allow_major_updates gate.
        run: |
          set -euo pipefail
          if [ "${{ inputs.allow_major_updates }}" = "true" ]; then
            npx --yes npm-check-updates --upgrade --target latest
          else
            npx --yes npm-check-updates --upgrade --target minor
          fi
          npm install --no-audit --no-fund
      - name: Keep the web package mirror in lockstep
        # the saddle mirror doctrine: the root devDependency numbers roll
        # in lockstep across the mirrored web/package.json - the same
        # set, the same numbers.
        run: |
          set -euo pipefail
          node <<'MIRROR'
          const fs = require("node:fs");
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const webpath = "web/package.json";
          const web = JSON.parse(fs.readFileSync(webpath, "utf8"));
          const rootspec = { ...(root.dependencies ?? {}), ...(root.devDependencies ?? {}) };
          const webspec = { ...(web.dependencies ?? {}), ...(web.devDependencies ?? {}) };
          let mirrored = 0;
          for (const name of Object.keys(webspec)) {
            if (rootspec[name] !== undefined && webspec[name] !== rootspec[name]) {
              webspec[name] = rootspec[name];
              mirrored += 1;
            }
          }
          for (const section of ["dependencies", "devDependencies"]) {
            if (web[section] === undefined) continue;
            for (const name of Object.keys(web[section])) {
              if (webspec[name] !== undefined) web[section][name] = webspec[name];
            }
          }
          if (mirrored > 0) {
            fs.writeFileSync(webpath, JSON.stringify(web, null, 2) + "\n");
            console.log(`mirrored ${mirrored} root numbers into web/package.json`);
          } else {
            console.log("the web package mirror already carries the root numbers");
          }
          MIRROR
      - name: Update versioned GitHub Actions references
        # the DevThink workflow:updates ladder inlined for the saddle
        # action family (the repository carries no workflowupdates script
        # yet; the one-workflow-file standard keeps the updater here).
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_MAJORS: ${{ inputs.allow_major_updates }}
        run: |
          set -euo pipefail
          node <<'PINS'
          const { readdir, readFile, writeFile } = require("node:fs/promises");
          const allowed = new Set([
            "actions/checkout", "actions/setup-node", "actions/setup-java", "actions/setup-dotnet", "actions/setup-python", "actions/setup-ruby", "actions/upload-artifact", "actions/download-artifact", "actions/dependency-review-action", "actions/attest", "actions/configure-pages", "actions/upload-pages-artifact", "actions/deploy-pages",
            "oven-sh/setup-bun", "denoland/setup-deno", "pnpm/action-setup", "ruby/setup-ruby", "browser-actions/setup-chrome", "reviewdog/action-actionlint", "android-actions/setup-android",
            "docker/setup-qemu-action", "docker/setup-buildx-action", "docker/login-action", "docker/metadata-action", "docker/build-push-action",
            "github/codeql-action/init", "github/codeql-action/analyze", "github/codeql-action/upload-sarif",
            "trufflesecurity/trufflehog", "anchore/sbom-action", "aquasecurity/trivy-action", "goodwithtech/dockle-action", "ossf/scorecard-action"
          ]);
          const allowmajors = process.env.ALLOW_MAJORS === "true";
          const headers = { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GH_TOKEN}` };
          const latest = new Map();
          const versionfor = async action => {
            if (!latest.has(action)) {
              const response = await fetch(`https://api.github.com/repos/${action}/releases/latest`, { headers });
              if (!response.ok) throw new Error(`GitHub releases for ${action} returned ${response.status}`);
              const tag = (await response.json()).tag_name;
              if (!/^v\d+(?:\.\d+){0,2}$/.test(tag ?? "")) throw new Error(`${action} has an unsupported latest tag: ${tag}`);
              latest.set(action, tag);
            }
            return latest.get(action);
          };
          for (const file of (await readdir(".github/workflows")).filter(entry => /\.ya?ml$/i.test(entry)).sort()) {
            const path = `.github/workflows/${file}`;
            const current = await readFile(path, "utf8");
            let next = current;
            for (const match of current.matchAll(/uses:\s*([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)@(v\d+(?:\.\d+){0,2})/g)) {
              const [, action, pinned] = match;
              if (!allowed.has(action)) continue;
              const version = await versionfor(action);
              const currentmajor = Number(pinned.slice(1).split(".")[0]);
              const latestmajor = Number(version.slice(1).split(".")[0]);
              if (latestmajor > currentmajor && !allowmajors) continue;
              if (version !== pinned) next = next.replace(`uses: ${action}@${pinned}`, `uses: ${action}@${version}`);
            }
            if (next !== current) {
              await writeFile(path, next);
              console.log(`updated the action pins of ${file}`);
            }
          }
          console.log(JSON.stringify({ allowmajors, checked: allowed.size }));
          PINS
      - name: Stop when no maintenance updates are available
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No maintenance updates are available; the ladder stays on $(node -p "require('./package.json').version")."
            echo "STOPPED=true" >> "$GITHUB_ENV"
          else
            echo "Maintenance updates detected:"
            git diff --stat
          fi
      - name: Derive the next rung of the ladder with plain arithmetic
        if: env.STOPPED != 'true'
        id: rung
        run: |
          set -euo pipefail
          # the ladder mathematics: the next rung is the current patch
          # number plus one, derived from package.json at run time — no
          # hardcoded version lives anywhere in this workflow.
          NEXT="$(node -p "const p=require('./package.json'); const v=p.version.split('.').map(Number); v[2]+=1; v.join('.')")"
          PREVIOUS="$(node -p "require('./package.json').version")"
          test -n "$NEXT" && test "$NEXT" != "$PREVIOUS"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "The ladder moves ${PREVIOUS} -> ${NEXT} (patch arithmetic over package.json)."
      - name: Stamp the rung across the saddle carrier lockstep
        # the DevThink stamp step mapped onto the saddle lockstep: the
        # repository carries no restamp script, so the ladder performs
        # the literal stamp the manual bump loop always performed — the
        # package manifests, the config envelopes, the registry
        # envelopes, the web carriers and the Dockerfile recipes all
        # carry the same literal, and the changelog gains the section
        # the release body gate extracts.
        if: env.STOPPED != 'true'
        env:
          NEXT: ${{ steps.rung.outputs.next }}
          PREVIOUS: ${{ steps.rung.outputs.previous }}
        run: |
          set -euo pipefail
          UPDATE_SUMMARY="$(git diff --no-color --unified=0 -- package.json web/package.json .nvmrc Dockerfile .github/workflows | grep -E '^[+-][^+-]' | sed 's/^[+-]//' | sed 's/^[[:space:]]*//' | grep -v '^$' | sort -u | head -40 | sed 's/^/- /' || true)"
          NOTE="This release is the automated maintenance rung of the ladder: the saddle maintenance workflow applied every non-breaking update available at run time — the npm dependency set, the mirrored web/package.json numbers and the versioned GitHub Actions references — derived the next patch number with plain arithmetic over package.json (${PREVIOUS} plus one rung) and stamped it across the whole saddle carrier lockstep before the pull request below ran the complete verification battery. The updates of this rung: ${UPDATE_SUMMARY}. The version stamp ${NEXT} lands across the package manifests, the config envelopes, the registry envelopes and the web carriers, and the ladder keeps no long-lived branch behind: the automation branch of this rung squashes onto main when the verification battery answers green — and closes with its branch deleted when it answers red — so the repository keeps exactly one long-lived branch and the archive tag carries the rung either way."
          NEXT="$NEXT" PREVIOUS="$PREVIOUS" NOTE="$NOTE" node <<'STAMP'
          const fs = require("node:fs");
          const next = process.env.NEXT;
          const previous = process.env.PREVIOUS;
          const note = process.env.NOTE;
          if (!/^\d+\.\d+\.\d+$/.test(next)) throw new Error("The derived rung must be plain SemVer.");
          const stamped = { ...JSON.parse(fs.readFileSync("package.json", "utf8")), version: next };
          fs.writeFileSync("package.json", JSON.stringify(stamped, null, 2) + "\n");
          const carriers = [
            "package.json", "web/package.json", "web/manifest.json", "web/sandbox.ts", "web/server.ts", "web/readme.md",
            "pom.xml", "saddle.csproj", "saddle.gemspec", "tauri.conf.json", "Dockerfile",
            "docker.config", "qemu.config", "mttg.config", "passage.config", "gpus.json", "processors.json", "cores.json", "boards.json", "virtualhardware.json", "vm.config.json"
          ];
          for (const carrier of carriers) {
            const text = fs.readFileSync(carrier, "utf8");
            if (!text.includes(previous)) throw new Error(`${carrier} does not carry the current version ${previous}; the lockstep is broken before the stamp.`);
            fs.writeFileSync(carrier, text.split(previous).join(next));
          }
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          if (changelog.includes(`\n## ${next}\n`)) throw new Error(`CHANGELOG.md already carries a ${next} section.`);
          const head = /^# saddle release notes\n\n/.exec(changelog);
          if (head === null) throw new Error("CHANGELOG.md must open with the # saddle release notes heading.");
          const section = `## ${next} — the automated maintenance rung of the ladder\n\n### Changed\n\n| Area | Change |\n| --- | --- |\n| The dependency ladder | ${note} |\n`;
          fs.writeFileSync("CHANGELOG.md", changelog.replace(/^# saddle release notes\n\n/, `# saddle release notes\n\n${section}\n`));
          console.log("Stamped " + next + " across " + (carriers.length + 1) + " carriers (package.json counted once, package-lock.json refreshes through npm install).");
          STAMP
      - name: Refresh the lockfile with the stamped version
        # package-lock.json never takes the literal stamp: the @ionic
        # tarball resolution URL of the dependency tree carries numbers of
        # its own, so the lockfile refreshes through npm itself.
        if: env.STOPPED != 'true'
        run: npm install --no-audit --no-fund
      - name: Validate with the proposed Node version
        if: env.STOPPED != 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate the complete proposed update
        if: env.STOPPED != 'true'
        run: |
          set -euo pipefail
          npm run check && npm run formatcheck && npm test && npm run pack:check
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          envelope_files="docker.config qemu.config mttg.config gpus.json processors.json cores.json virtualhardware.json vm.config.json"
          for f in ${envelope_files}; do
            reported=$(node -e "
              const fs = require('fs');
              const text = fs.readFileSync('${f}', 'utf8');
              try {
                const data = JSON.parse(text);
                const v = data.version || (data.meta && data.meta.version) || (data.metadata && data.metadata.version);
                if (v) { process.stdout.write(v); process.exit(0); }
              } catch { /* plain payload: fall through */ }
              const m = text.match(/\"version\"\s*:\s*\"([^\"]+)\"/);
              process.stdout.write(m ? m[1] : '');
            ")
            if [ "${reported}" != "${version}" ]; then
              echo "::error file=${f}::version envelope is '${reported}' but the release is ${version}; keep the metadata in lockstep." >&2
              exit 1
            fi
          done
          web_pkg_version=$(node -e "const data = JSON.parse(require('fs').readFileSync('web/package.json', 'utf8')); process.stdout.write(data.version || '');")
          if [ "${web_pkg_version}" != "${version}" ]; then
            echo "::error file=web/package.json::version envelope is '${web_pkg_version}' but the release is ${version}; keep the web deploy manifest in lockstep." >&2
            exit 1
          fi
          server_version=$(node -e "const text = require('fs').readFileSync('web/server.ts', 'utf8'); const m = text.match(/const version = '([^']+)'/); process.stdout.write(m ? m[1] : '');")
          if [ "${server_version}" != "${version}" ]; then
            echo "::error file=web/server.ts::version envelope is '${server_version}' but the release is ${version}; keep the api version literal in lockstep." >&2
            exit 1
          fi
          sandbox_version=$(node -e "const text = require('fs').readFileSync('web/sandbox.ts', 'utf8'); const m = text.match(/SADDLE_VERSION: '([^']+)'/); process.stdout.write(m ? m[1] : '');")
          if [ "${sandbox_version}" != "${version}" ]; then
            echo "::error file=web/sandbox.ts::version envelope is '${sandbox_version}' but the release is ${version}; keep the sandbox engine stamp in lockstep." >&2
            exit 1
          fi
          git diff --check
          echo "the proposed rung answered the complete battery at ${version}"
      - name: Land the rung on main through the archive-tagged automation branch
        if: env.STOPPED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.rung.outputs.next }}
        run: |
          set -euo pipefail
          BRANCH="automation/maintenance-$(date -u +%Y%m%d-%H%M%S)"
          git switch -C "$BRANCH"
          git config user.name "Nathlan Bros"
          git config user.email "263045985+wenathlan@users.noreply.github.com"
          git add package.json package-lock.json web/package.json web/manifest.json web/sandbox.ts web/server.ts web/readme.md pom.xml saddle.csproj saddle.gemspec tauri.conf.json Dockerfile docker.config qemu.config mttg.config passage.config gpus.json processors.json cores.json boards.json virtualhardware.json vm.config.json CHANGELOG.md .nvmrc .github/workflows
          git commit -m "chore: land the automated maintenance rung v${NEXT}"
          # the archive tag preserves the automation branch verbatim before
          # the squash merge replaces it, so the ladder keeps its history
          # without keeping its branches.
          git tag "archive/${BRANCH}"
          git push --force-with-lease origin "$BRANCH" "refs/tags/archive/${BRANCH}"
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "chore: land the automated maintenance rung v${NEXT}" --body "Automated rung of the saddle dependency ladder. This pull request carries every non-breaking maintenance update available at run time (npm dependencies, the mirrored web/package.json numbers, the versioned GitHub Actions references), the next patch rung derived by arithmetic over package.json and the complete carrier-lockstep stamp. The CI battery below is the gate: when it answers green the rung squashes onto main, the automation branch is archived under its tag and deleted, and the release is cut and dispatched on the new version tag; when it answers red the pull request closes and the branch is deleted, so no rung ever stays open.")"
          echo "Pull request: ${PR_URL}"
          # watch the verification battery of the pull request to its end —
          # the squash merge only happens over a fully green run, and a red
          # run closes the pull request and deletes its branch so the
          # ladder never leaves a proposal open.
          if ! gh pr checks "$BRANCH" --watch --interval 30; then
            echo "The verification battery failed on the automation branch; closing the rung and keeping the archive tag." >&2
            gh pr close "$BRANCH" --delete-branch
            exit 1
          fi
          gh pr merge "$BRANCH" --squash --delete-branch --subject "chore: land the automated maintenance rung v${NEXT}"
      - name: Cut the release and dispatch every publish lane on the tag
        # the auto-tag work performed explicitly (the DevThink ladder
        # dispatches its single release workflow; the saddle release
        # validation lane answers pushes only, and the GITHUB_TOKEN squash
        # merge never fires it): the battery already ran above and in the
        # pull request, so the run tags the landed main, extracts the
        # changelog section as the release body (the release body gate),
        # attaches the source archive and dispatches the publish lanes.
        if: env.STOPPED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.rung.outputs.next }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          MAINSHA="$(git rev-parse origin/main)"
          git tag "v${NEXT}" "$MAINSHA"
          git push origin "refs/tags/v${NEXT}"
          # the release body gate: the curated notes live in the CHANGELOG
          # section of the version; a version without a section refuses to
          # ship (the stamp step wrote it).
          awk -v ver="## ${NEXT}" '
            BEGIN { insection = 0 }
            /^## / {
              if (insection) exit
              if (index($0, ver) == 1) { insection = 1; next }
            }
            insection { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          {
            echo "# saddle v${NEXT}"
            echo
            cat release-notes.md
            echo
            echo '---'
            echo
            echo '<!-- the APK, IPA, container, desktop and extension assets are attached by their own dispatched lanes; the SHA256SUMS umbrella is rebuilt by the release validation checksums job and its re-runs -->'
          } > release-body.md
          git archive --format=zip -9 -o "saddle-v${NEXT}-source.zip" "$MAINSHA"
          sha256sum "saddle-v${NEXT}-source.zip"
          gh release create "v${NEXT}" \
            --title "v${NEXT}" \
            --notes-file release-body.md \
            --verify-tag \
            "saddle-v${NEXT}-source.zip"
          # the release published event this GITHUB_TOKEN creates never
          # cascades, and the workflow_run cascade of the saddle publish
          # lanes requires a push-triggered release validation run: the
          # ladder dispatches every lane explicitly on the tag instead.
          for lane in publishnpmjs publishgithubnpm publishmaven publishnuget publishrubygems publishghcr publishghcrvhe; do
            gh workflow run "${lane}.yml" --ref "v${NEXT}" || echo "the ${lane} lane carries no dispatch input; it resolves the latest release"
          done
          for lane in container desktop mobile buildextension targets; do
            gh workflow run "${lane}.yml" --ref "v${NEXT}" -f release_tag="v${NEXT}" || echo "the ${lane} lane was dispatched without its release tag input"
          done
          echo "The rung v${NEXT} landed on ${MAINSHA:0:8}; the release was cut and every publish lane was dispatched on the tag."
  cachecleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_REF: refs/heads/main
      NONDEFAULT_MAX_AGE_HOURS: "24"
      APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply_cache_cleanup == true }}
    steps:
      - name: Retain bounded repository caches automatically
        shell: bash
        run: |
          set -euo pipefail
          cutoff_epoch="$(date --utc --date="-${NONDEFAULT_MAX_AGE_HOURS} hours" +%s)"
          declare -A retained
          cachelimit() {
            case "$1" in
              codeql) printf '%s' 3 ;;
              node) printf '%s' 2 ;;
              java) printf '%s' 1 ;;
              *) printf '%s' 1 ;;
            esac
          }
          cachefamily() {
            case "$1" in
              codeql-*) printf '%s' codeql ;;
              node-cache-*) printf '%s' node ;;
              Linux-jdk*) printf '%s' java ;;
              *) printf '%s' other ;;
            esac
          }
          while IFS=$'\t' read -r cache_id accessed_at ref key; do
            test -n "$cache_id" || continue
            family="$(cachefamily "$key")"
            delete_reason=""
            if [ "$ref" = "$DEFAULT_REF" ]; then
              retained_count="${retained[$family]:-0}"
              if [ "$retained_count" -lt "$(cachelimit "$family")" ]; then
                retained[$family]=$((retained_count + 1))
                continue
              fi
              delete_reason="exceeds-${family}-limit-on-default-ref"
            else
              accessed_epoch="$(date --utc --date="$accessed_at" +%s)"
              if [ "$accessed_epoch" -gt "$cutoff_epoch" ]; then
                continue
              fi
              delete_reason="aged-nondefault-ref"
            fi
            printf 'candidate id=%s ref=%s family=%s reason=%s key=%s\n' "$cache_id" "$ref" "$family" "$delete_reason" "$key"
            if [ "$APPLY" = "true" ]; then
              gh api --method DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" || echo "cache id=${cache_id} was already unavailable"
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100&sort=last_accessed_at&direction=desc" --jq '.actions_caches[] | [.id, .last_accessed_at, .ref, .key] | @tsv')
          if [ "$APPLY" != "true" ]; then
            echo "Dry run complete; no cache was deleted."
          fi
