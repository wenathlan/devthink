# cadria — the rust version envelope crate of the family (the cargo channel).
# The crate carries the version constant the metadata lockstep stamps (the
# cadria.java precedent: the registry lanes reference it, never compile it
# locally), the lane builds with `cargo package --no-verify --allow-dirty`
# and stamps the version before building.
[package]
name = "wenathlan-cadria"
version = "2.0.166"
edition = "2021"
description = "The video and image player, editor and studio; it houses the versawase engine at the folder root"
license = "GPL-3.0-only"
repository = "https://github.com/wenathlan/devthink"
authors = ["wenathlan"]

[lib]
name = "cadria"
path = "cadria.rs"
