<!doctype html>
<!-- web entry of the theme: the only html file in Sol. the entry is the
     SOURCE (./App.tsx) — vite rewrites it into the hashed bundle at build
     time (the hashed emit is gitignored; the pages workflow rebuilds) — and
     the icon/manifest faces are the canonical unhashed files beside it, so
     dev, preview and every deploy mount resolve without committed artifacts.
     after a local `pnpm build`, restore this source face with `pnpm
     restore:entry` — the deploy hosts rewrite it inside their own build. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cadria — video, image and 3D studio of the DevThink OS</title>
    <meta name="description" content="cadria is the video, image and 3D studio of the DevThink OS: a multi-format player, a layer editor and a rack of creative anchors on the versawase engine. Like After Effects × Photoshop × Figma × Blender." />
    <meta property="og:title" content="cadria" />
    <meta property="og:description" content="Player, editor and studio for video, image and 3D — on the versawase engine." />
    <meta name="theme-color" content="#0d0a0e" />
    <link rel="icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the family type triad: Bricolage Grotesque rides display, Outfit rides
         the UI voice, JetBrains Mono rides micro-labels and numbers (display=swap,
         never FOUT-blocked) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./App.tsx"></script>
  </body>
</html>
