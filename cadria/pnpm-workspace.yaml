# the vulnerability overrides of the family security gate (the devthink
# override contract): pnpm 12 reads overrides here, the lockfile regenerates
# against these pins and the OSV scan of the committed lockfile answers clean.
overrides:
  undici: ^7.30.1
  zod: ^4.6.7
  follow-redirects: ^1.16.2
  glob: ^14.0.2
  minimatch: ^11.0.1
  fast-uri: ^3.1.9
  body-parser: ^2.4.0
  esbuild: ^0.28.2
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1
  uuid: ^11.1.1
  postcss-selector-parser: ^7.1.6
  source-map-js: 1.2.2
  katex: ^0.18.2
  proxy-addr: 2.0.8

# the native build law (the node 26 v8 gate): ssh2's optional c++ binding
# speaks the removed v8 context api (GetIsolate), so the gyp lottery dies
# here in the seat pnpm 12 reads - the pure-js engine answers the lanes
# and no install ever compiles the broken binding.
neverBuiltDependencies:
  - ssh2

minimumReleaseAgeExclude:
