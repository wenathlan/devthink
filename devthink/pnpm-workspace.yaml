# the vulnerability overrides of the family security gate: pnpm 12 reads
# overrides here, the pnpm lockfile regenerates against these pins and the
# OSV scan of the committed lockfile answers clean. The bun install of the
# workbench reads the same pins from the package.json overrides block.
overrides:
  undici: ^7.30.1
  zod: ^4.6.7
  follow-redirects: ^1.16.2
  glob: ^14.0.2
  minimatch: ^11.0.1
  fast-uri: ^3.1.9
  body-parser: ^2.4.0
  esbuild: ^0.28.2
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1
  uuid: ^11.1.1
  postcss-selector-parser: ^7.1.6
  source-map-js: 1.2.2
  shell-quote: ^1.11.0
  katex: ^0.18.2
  proxy-addr: 2.0.8

# the freshly published security fixes install before they age: pnpm 12
# verifies the supply-chain age by default and these corrections ride the
# exclusion so the family heals now, not after the waiting window.
# the native build law (the node 26 v8 gate): ssh2's optional c++ binding
# speaks the removed v8 context api (GetIsolate), so the gyp lottery dies
# here in the seat pnpm 12 reads - the pure-js engine answers the lanes
# and no install ever compiles the broken binding.
neverBuiltDependencies:
  - ssh2

minimumReleaseAgeExclude:
  - zod@4.6.6 || 4.6.7
  - body-parser@2.4.0
  - fast-uri@3.1.9
  - follow-redirects@1.16.1
