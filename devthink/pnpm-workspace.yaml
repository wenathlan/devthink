# the vulnerability overrides of the family security gate: pnpm 12 reads
# overrides here, the pnpm lockfile regenerates against these pins and the
# OSV scan of the committed lockfile answers clean. The bun install of the
# workbench reads the same pins from the package.json overrides block.
overrides:
  esbuild: ^0.28.2
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1
  uuid: ^11.1.1
  postcss-selector-parser: ^7.1.6
  source-map-js: 1.2.2
  shell-quote: ^1.11.0

# the freshly published security fixes install before they age: pnpm 12
# verifies the supply-chain age by default and these four corrections ride
# the exclusion so the family heals now, not after the waiting window.
minimumReleaseAgeExclude:
  - body-parser@2.4.0
  - fast-uri@3.1.9
  - follow-redirects@1.16.1
  - zod@4.6.6
  katex: ^0.18.2
  proxy-addr: 2.0.8
