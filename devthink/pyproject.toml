# devthink — the python adapter envelope of the family (the pypi channel).
# Ships the same envelope the gem face packs: the README — the runner
# adapter seat the gemspec also declares has no folder in the app root.
# Built by the publish lane with `python -m build` (PEP 517); the version
# rides the DEVTHINK_VERSION environment the metadata lockstep stamps — the
# pyproject table cannot fetch an environment the gemspec reads, so the
# static version below is the fallback the lane sed-stamps before building.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wenathlan-devthink"
version = "2.0.175"
authors = [{name = "wenathlan"}]
description = "Builds explicit local DevThink CLI invocations without storing provider credentials"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.11"

# The envelope carries no python code — the empty package list keeps the
# build honest while the MANIFEST.in packs the envelope files.
[tool.setuptools]
packages = []
