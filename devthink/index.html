        var size = 64, idx = 0, pngs = [];
        var canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        function setIcon(url) {
          var l = document.getElementById('devthink-favicon');
          if (!l) { l = document.createElement('link'); l.id = 'devthink-favicon'; l.rel = 'icon'; document.head.appendChild(l); }
          l.type = 'image/png'; l.sizes = '64x64';
          l.setAttribute('href', url + '?t=' + Date.now());
          l.style.display = 'block';
        }
        function raster(svg, cb) {
          var img = new Image();
          img.onload = function () { ctx.clearRect(0, 0, size, size); ctx.drawImage(img, 0, 0, size, size); cb(canvas.toDataURL('image/png')); };
          img.onerror = function () { cb(null); };
          img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }
        function step(n) {
          if (n >= frames.length) {
            if (!pngs.length) { setIcon('/favicon.ico'); return; }
            setIcon(pngs[0]);
            setInterval(function () { idx = (idx + 1) % pngs.length; setIcon(pngs[idx]); }, 700);
            return;
          }
          raster(frames[n], function (url) { if (url) pngs.push(url); step(n + 1); });
        }
        function run() { step(0); }
        if (document.readyState !== 'loading') { setTimeout(run, 50); } else { document.addEventListener('DOMContentLoaded', run); }
