# devthink docker-compose — the two-service deploy of the os face: the
# static theme served by the devthink-face nginx door beside the /api/* proxy lane
# that carries every platform call to the devthink engine. until this file the
# app rode the registry image alone: no compose seated the pair, and every
# /api call of the face answered the away rehearsal. this file wires the
# pair the vault compose law standardizes:
#
#   devthink-engine  the devthink runner (node container.mjs — the http surface the
#           heredoc embeds): the platform routes, the /healthz probe, the
#           relay upgrade and the mcp child, one process on one port
#   devthink-face  the nginx surface: the family conf (nginx.conf) mounted over
#           the default conf — the resolver law, the security header law,
#           the gzip and cache law, the /api/* proxy lane to the engine,
#           the spa rewrite as try_files, host 8085 published on 8080.
#
# the engine builds from the repository root context (the family context law the os Dockerfile reads). boot the pair from this directory:
#
#   docker compose up -d --build
#
# the /api lane carries the platform calls same-origin to the engine; the
# state home rides the runner law (the memory engine keeps ram, no seat).
# remap the host port freely when another service owns the host.

services:
  devthink-engine:
    build:
      context: ..
      dockerfile: devthink/Dockerfile
      args:
        DEVTHINK_VERSION: "${DEVTHINK_VERSION:-2.0.166}"
    image: "ghcr.io/wenathlan/devthink-engine:${DEVTHINK_VERSION:-2.0.166}"
    environment:
      DEVTHINK_HTTP_BIND: "0.0.0.0"
      DEVTHINK_HTTP_PORT: "8080"
    # the runner keeps its state in ram (DEVTHINK_MEMORY_ENGINE=ram the image
    # pins): no data volume rides this pair — the memory engine law.
    # the engine never publishes a port by default: the face proxies it on
    # the private compose network (the vault precedent). uncomment to serve
    # the engine lane directly behind your own door:
    # ports:
    #   - "3215:8080"
    # the healthcheck rides the image (node fetch /healthz — the runner's
    # own health surface, body.ok must be true): the face gates on it below.
    init: true
    restart: unless-stopped

  devthink-face:
    image: "nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6"
    volumes:
      # the family conf over the default site conf: the resolver law, the
      # security headers, the gzip and cache law, the /api proxy lane.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # the staged static build: the web build the operator runs stages the
      # hashed bundles at the application root (the family root-emit law —
      # run the devthink web build before compose up); the conf seals the
      # source faces the platform lanes never publish.
      - ./:/usr/share/nginx/html:ro
    depends_on:
      # the face starts only when the engine health lane answered — the
      # proxy upstream is live before the first /api/* call arrives.
      devthink-engine:
        condition: service_healthy
    ports:
      # the public door: host 8085 → the unprivileged nginx on 8080.
      # remap freely ("8086:8080") when another service owns the host.
      - "8085:8080"
    restart: unless-stopped
