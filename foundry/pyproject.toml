# foundry — the python documentation envelope of the family (the pypi channel).
# Ships the same envelope the gem face packs: README, docs and tests.
# Built by the publish lane with `python -m build` (PEP 517); the version
# rides the FOUNDRY_VERSION environment the metadata lockstep stamps — the
# pyproject table cannot fetch an environment the gemspec reads, so the
# static version below is the fallback the lane sed-stamps before building.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wenathlan-foundry"
version = "2.0.181"
authors = [{name = "wenathlan"}]
description = "The e2b and docker clone interface — sandboxes and images while the engine lives in saddle"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.11"

# The envelope carries no python code — the empty package list keeps the
# build honest while the MANIFEST.in packs the envelope files.
# the lost-dependency recovery union (the additive mirror law)
