# foundry — the rust version envelope crate of the family (the cargo channel).
# The crate carries the version constant the metadata lockstep stamps (the
# foundry.java precedent: the registry lanes reference it, never compile it
# locally), the lane builds with `cargo package --no-verify --allow-dirty`
# and stamps the version before building.
[package]
name = "wenathlan-foundry"
version = "2.0.176"
edition = "2021"
description = "The e2b and docker clone interface — sandboxes and images while the engine lives in saddle"
license = "GPL-3.0-only"
repository = "https://github.com/wenathlan/devthink"
authors = ["wenathlan"]

[lib]
name = "foundry"
path = "foundry.rs"
