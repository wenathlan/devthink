# the vulnerability overrides of the family security gate (the devthink
# override contract): pnpm 12 reads overrides here, the lockfile regenerates
# against these pins and the OSV scan of the committed lockfile answers clean.
overrides:
  undici: ^7.30.1
  zod: ^4.6.7
  follow-redirects: ^1.16.1
  fast-uri: ^3.1.9
  body-parser: ^2.4.0
  esbuild: ^0.28.2
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1
  uuid: ^11.1.1
  postcss-selector-parser: ^7.1.6
  source-map-js: 1.2.2
  katex: ^0.18.2
  proxy-addr: 2.0.8

minimumReleaseAgeExclude:
  - zod@4.6.6
  - follow-redirects@1.16.1
  - fast-uri@3.1.9
  - body-parser@2.4.0
  - '@opencode-ai/sdk@1.18.34'
  - framer-motion@13.5.0
  - motion-dom@13.5.0
  - motion-utils@13.5.0
  - vite@8.3.2
  - react-hook-form@7.91.0
# the pnpm settings live here since pnpm 12 (the package.json pnpm field is
# no longer read, and onlyBuiltDependencies died in pnpm 11 — the map below
# is allowBuilds). ssh2 answers false on purpose: the native accelerator
# refuses to compile on the runner node (v8 GetIsolate) and the pure js
# fallback carries the line. everything else builds as the tree expects.
allowBuilds:
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  pnpm: false
  prisma: true
  protobufjs: true
  ssh2: false
  workerd: true
dangerouslyAllowAllBuilds: false
