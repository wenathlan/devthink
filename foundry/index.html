<!doctype html>
<!-- web entry of the theme -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      /* the typed-URL law: the address typed straight at this app's subpath
         lands INSIDE the os — the boot redirects to the os panel with the
         arrive handoff before anything paints (the power clip then opens
         the app window, the same window the desktop double click opens);
         ?independent keeps this presentation site and the embedded boots
         (self != top) never redirect */
      (function () {
        try {
          if (window.self !== window.top) return;
          if (/[?&]independent\b/.test(window.location.search)) return;
          var os = new URL("../panel", window.location.href);
          os.searchParams.set("arrive", "foundry");
          window.location.replace(os.href);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="foundry is the pipeline application of the DevThink OS: the e2b and docker clone interface driving sandboxes and images while the engine lives in saddle." />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the family type triad (the trylle ruler): Inter Variable rides every
         surface, Geist Mono rides micro-labels and numbers (display=swap,
         never FOUT-blocked) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./Sol/sol.css" />
    <title>foundry</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./App.tsx"></script>
  </body>
</html>
