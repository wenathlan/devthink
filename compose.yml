services:
  devthink:
    build:
      context: .
      dockerfile: ${DEVTHINK_DOCKERFILE:-Dockerfile}
    image: ${DEVTHINK_IMAGE:-devthink:latest}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${DEVTHINK_PIDS_LIMIT:-512}
    tmpfs:
      - /tmp:size=${DEVTHINK_TMPFS_SIZE:-2G},mode=1777
    network_mode: ${DEVTHINK_NETWORK_MODE:-none}
    environment:
      DEVTHINK_MEMORY_ENGINE: ${DEVTHINK_MEMORY_ENGINE:-ram}
      DEVTHINK_PLATFORM: ${DEVTHINK_PLATFORM:-}
      DEVTHINK_CDN_URL: ${DEVTHINK_CDN_URL:-}
