name: resolve DevThink release version
description: Resolve a DevThink release tag and verify that it matches package metadata.

inputs:
  package:
    description: Package metadata file to validate.
    required: false
    default: package.json
  checkout_tag:
    description: Check out the matching release tag after validation.
    required: false
    default: "true"

outputs:
  tag:
    description: Validated release tag.
    value: ${{ steps.resolve.outputs.tag }}
  version:
    description: Validated release version without the leading v.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        RELEASE_TAG: ${{ env.RELEASE_TAG }}
        PACKAGE_FILE: ${{ inputs.package }}
        CHECKOUT_TAG: ${{ inputs.checkout_tag }}
      run: |
        set -euo pipefail
        tag="${RELEASE_TAG:-}"
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "A semantic release tag such as v1.1.1 is required." >&2
          exit 1
        fi
        git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
        if [[ "$CHECKOUT_TAG" == "true" ]]; then
          git checkout --detach "$tag"
        fi
        package_version=$(node -p "require('./${PACKAGE_FILE}').version")
        if [[ "$package_version" != "${tag#v}" ]]; then
          echo "Release tag ${tag} does not match package version ${package_version}." >&2
          exit 1
        fi
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
