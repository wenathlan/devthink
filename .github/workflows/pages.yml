name: Family Pages

# The universal interface deploy of the monorepo (the owner doctrine: one
# theme per application, the Sol folder serves web, OS, TV, mobile, desktop
# and the extension — only the conversion workflow differs). This lane builds
# every family theme and ships ONE GitHub Pages site where each application
# answers under its own subpath: /devthink/, /argan/, /cadria/, /debonair/,
# /forge/, /foundry/, /saddle/, /stealhead/, /vault/ and /getry/. Every vite
# theme installs from its committed lockfile through the package manager its
# manifest pins (the matrix carries the manager per application) and builds
# straight at the application root — the hashed bundles emit flat beside the
# entry html, with no dist, no public and no assets folder — under the
# VITE_BASE_PATH the subpath dictates. The staging copies the delivered web
# surface (the entry, the fallback, the hashed bundles and the static web
# files) out of the root by type. The devthink leg keeps the boot smoke and
# the delivered html well-formedness lint: a bundle whose entry cannot serve
# never reaches the Pages deploy.

on:
  push:
    branches: [main]
    paths:
      - "devthink/**"
      - "argan/**"
      - "cadria/**"
      - "debonair/**"
      - "forge/**"
      - "foundry/**"
      - "saddle/**"
      - "stealhead/**"
      - "vault/**"
      - "getry/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: family-pages
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned boot smoke port (inside the e2ugh family documented
      # 30000-59999 band).
      SMOKE_PORT: "39417"
    strategy:
      fail-fast: false
      matrix:
        # the canonical family pass order (the owner doctrine): the nine
        # applications first - devthink, argan, cadria, debonair, forge,
        # foundry, stealhead, vault, getry - and saddle always last, the
        # heaviest leg of the pass.
        include:
          - { app: devthink, pm: bun }
          - { app: argan, pm: pnpm }
          - { app: cadria, pm: pnpm }
          - { app: debonair, pm: pnpm }
          - { app: forge, pm: pnpm }
          - { app: foundry, pm: pnpm }
          - { app: stealhead, pm: pnpm }
          - { app: vault, pm: pnpm }
          - { app: getry, pm: pnpm }
          - { app: saddle, pm: npm }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.9.1
      - name: Set up Node (pnpm leg)
        if: matrix.pm == 'pnpm'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Set up Node (npm leg)
        if: matrix.pm == 'npm'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0
      - name: Set up Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
          cache: false
      - name: Install and build the theme (bun leg)
        if: matrix.pm == 'bun'
        # the application pins bun: the install reads the committed bun.lock
        # and the build answers straight at the application root (the entry
        # html and the hashed bundles beside the sources, no dist, no public).
        run: |
          set -euo pipefail
          cd devthink
          bun install --frozen-lockfile
          # a project Pages site lives under /<repo>/: the entry answers at the
          # site root and the absolute base keeps the hashed bundles resolvable
          # on every host without hardcoding the repository name
          VITE_BASE_PATH="/${{ github.event.repository.name }}/" bun run build:web
          test -f index.html
          test -n "$(ls *.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
      - name: Install and build the theme (pnpm leg)
        if: matrix.pm == 'pnpm'
        # the theme root is the application root: one package.json, the entry
        # html at the folder root, the build answering at the root beside the
        # engine logic the vite build reads.
        run: |
          set -euo pipefail
          pnpm --dir "${{ matrix.app }}" install --frozen-lockfile
          VITE_BASE_PATH="./" pnpm --dir "${{ matrix.app }}" run build
          test -f "${{ matrix.app }}/index.html"
          test -n "$(ls "${{ matrix.app }}"/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
      - name: Install and build the theme (npm leg)
        if: matrix.pm == 'npm'
        # the application pins npm: the install reads the committed
        # package-lock.json and the build answers straight at the root.
        run: |
          set -euo pipefail
          npm --prefix saddle ci
          VITE_BASE_PATH="./" npm --prefix saddle run web:build:pages
          test -f saddle/index.html
          test -n "$(ls saddle/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
      - name: Prepare the SPA fallback page
        # the static host answers deep links with the delivered 404.html:
        # the build emits the entry alone at the application root, so the
        # fallback page rides beside it as the exact copy of the entry the
        # boot smoke and the html lint verify.
        if: matrix.app == 'devthink'
        run: |
          set -euo pipefail
          cp devthink/index.html devthink/404.html
      - name: Stage the theme under its subpath
        # the OS answers at the SITE ROOT (the visitor opens the platform
        # directly — no landing gate), so the devthink leg stages the entry,
        # the fallback and the hashed bundles straight at the staging root;
        # every other application answers under /<app>/ and the staging
        # copies the delivered web surface out of the root by type — the
        # sources and the toolchain files never reach the artifact. the
        # artifact already carries the folder so the assemble job merges
        # the ten trees by name.
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          if [ "${app}" = "devthink" ]; then
            # the site root of a project Pages host serves _site/ under the
            # repository URL: the entry answers at _site/ and its absolute
            # /<repo>/... asset URLs resolve to the same staging root
            mkdir -p staging
            cp "${app}/index.html" staging/
            cp "${app}/404.html" staging/ 2>/dev/null || true
            for kind in js css webmanifest xml txt svg png ico woff woff2 webp; do
              cp "${app}"/*."${kind}" staging/ 2>/dev/null || true
            done
            touch staging/.nojekyll
          else
            mkdir -p "staging/${app}"
            cp "${app}/index.html" "staging/${app}/"
            cp "${app}/404.html" "staging/${app}/" 2>/dev/null || true
            for kind in js css webmanifest xml txt svg png ico woff woff2 webp; do
              cp "${app}"/*."${kind}" "staging/${app}/" 2>/dev/null || true
            done
            # the static asset folder the theme references by relative path
            # (the folder rides beside the sources; only the applications that
            # carry one copy it)
            if [ -d "${app}/assets" ]; then
              cp -r "${app}/assets" "staging/${app}/assets"
            fi
            touch "staging/${app}/.nojekyll"
          fi
      - name: Boot smoke test (SPA entry and fallback page on a pinned port)
        if: matrix.app == 'devthink'
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          python3 -m http.server "${SMOKE_PORT}" --bind 127.0.0.1 > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 "http://127.0.0.1:${SMOKE_PORT}/" > entry.html 2>/dev/null; then
              healthy=1
              break
            fi
            echo "  waiting for the SPA entry (attempt ${attempt}/30)"
            sleep 1
          done
          if [ "${healthy}" -ne 1 ]; then
            echo '::error::The static workbench did not answer the SPA entry within 30 seconds. Boot log:'
            cat server.log
            exit 1
          fi
          grep -qF "<title>" entry.html
          echo "the SPA entry answered with content ($(wc -c < entry.html) bytes)"
          fallback_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${SMOKE_PORT}/404.html")"
          if [ "${fallback_code}" != "200" ]; then
            echo "::error::Expected HTTP 200 on the fallback page but received ${fallback_code}. Boot log:"
            cat server.log
            exit 1
          fi
          echo 'boot smoke passed: SPA entry 200 and fallback page 200'
      - name: Lint the delivered html pages (python html.parser well-formedness)
        if: matrix.app == 'devthink'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          import sys

          VOID = {
              'area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input',
              'link', 'meta', 'param', 'source', 'track', 'wbr',
          }

          class WellFormedChecker(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.stack = []
                  self.failures = []

              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append((tag, self.getpos()))

              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack:
                      self.failures.append(
                          f'{self.path}:{self.getpos()[0]}: closing </{tag}> with no open tag')
                      return
                  open_tag, open_pos = self.stack.pop()
                  if open_tag != tag:
                      self.failures.append(
                          f'{self.path}:{self.getpos()[0]}: </{tag}> closes <{open_tag}> '
                          f'opened at line {open_pos[0]}')

          pages = ['staging/index.html', 'staging/404.html']
          failures = []
          for page in pages:
              try:
                  with open(page, encoding='utf-8') as handle:
                      text = handle.read()
              except OSError as error:
                  failures.append(f'{page}: cannot read ({error})')
                  continue
              checker = WellFormedChecker(page)
              checker.feed(text)
              checker.close()
              for tag, pos in checker.stack:
                  failures.append(f'{page}:{pos[0]}: <{tag}> opened but never closed')
              failures.extend(checker.failures)
              if not any(f.startswith(page) for f in failures):
                  print(f'{page}: well-formed ({len(text)} bytes)')

          if failures:
              for failure in failures:
                  print(f'::error::{failure}')
              sys.exit(1)
          print('html lint passed for all delivered pages')
          PY
      - name: Upload the theme artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pages-${{ matrix.app }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Merge the ten themes into the one Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge every theme artifact under its subpath
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: pages-*
          path: _site
          merge-multiple: true
      - name: Write the deep-link dispatcher
        # GitHub Pages answers every miss with the site-root 404 page. The
        # OS answers at the site root, so the dispatcher sorts the miss: a
        # family application walks to its own subpath, every other root
        # level path parks the deep route under sessionStorage and lands on
        # the OS root; the theme anchor replays the parked route once the
        # router mounts. The repository name rides the runtime context —
        # nothing about the host or the domain is hardcoded.
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cat > _site/404.html <<DISPATCHER_EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="robots" content="noindex" />
              <title>DevThink — opening</title>
            </head>
            <body>
              <script>
                (function () {
                  var repo = "${REPO_NAME}";
                  var family = ["saddle", "argan", "cadria", "debonair", "stealhead", "forge", "foundry", "vault", "getry"];
                  var parts = location.pathname.split("/").filter(Boolean);
                  if (parts[0] === repo) parts = parts.slice(1);
                  var head = parts[0] || "";
                  if (family.indexOf(head) !== -1) {
                    location.replace("/" + head + "/" + location.search);
                    return;
                  }
                  try {
                    if (parts.length > 0 && !/\.[a-z0-9]+$/i.test(parts[parts.length - 1])) {
                      sessionStorage.setItem("dt.deep.route", "/" + parts.join("/"));
                    }
                  } catch (storageUnavailable) {
                    /* the dispatcher still lands on the OS root */
                  }
                  location.replace("/" + repo + "/" + location.search);
                })();
              </script>
            </body>
          </html>
          DISPATCHER_EOF
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy the family Pages site
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
