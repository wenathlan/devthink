name: Family Pages

# The universal interface deploy of the monorepo (the owner doctrine: one
# theme per application, the Sol folder serves web, OS, TV, mobile, desktop
# and the extension — only the conversion workflow differs). This lane builds
# every family theme and ships ONE GitHub Pages site where each application
# answers under its own subpath: /devthink/, /argan/, /cadria/, /debonair/,
# /forge/, /foundry/, /saddle/, /stealhead/, /vault/ and /getry/. Every vite
# theme installs from its committed pnpm lockfile and builds with the
# VITE_BASE_PATH the subpath dictates; getry (the born-Next gateway) builds
# through the PAGES_EXPORT gate of its next.config (static export + base
# path) so its standalone deploy target stays untouched. The devthink leg
# keeps the boot smoke and the delivered html well-formedness lint: a bundle
# whose entry cannot serve never reaches the Pages deploy.

on:
  push:
    branches: [main]
    paths:
      - "devthink/**"
      - "argan/**"
      - "cadria/**"
      - "debonair/**"
      - "forge/**"
      - "foundry/**"
      - "saddle/**"
      - "stealhead/**"
      - "vault/**"
      - "getry/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: family-pages
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned boot smoke port (inside the e2ugh family documented
      # 30000-59999 band).
      SMOKE_PORT: "39417"
    strategy:
      fail-fast: false
      matrix:
        app: [devthink, argan, cadria, debonair, forge, foundry, saddle, stealhead, vault, getry]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        if: matrix.app != 'getry'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.8.1
      - name: Set up Node
        if: matrix.app != 'getry'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Set up Bun
        if: matrix.app == 'getry'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
          cache: false
      - name: Install and build the theme (vite apps)
        if: matrix.app != 'getry'
        # the theme root is the application root now: one package.json, the
        # entry html at the folder root, the build answering dist/public
        # beside the engine logic the vite build reads.
        run: |
          set -euo pipefail
          pnpm --dir "${{ matrix.app }}" install --frozen-lockfile
          VITE_BASE_PATH="/${{ matrix.app }}/" pnpm --dir "${{ matrix.app }}" run ${{ matrix.app == 'devthink' && 'build:web' || 'build' }}
      - name: Install and build the theme (getry static export)
        if: matrix.app == 'getry'
        env:
          PAGES_EXPORT: "1"
          NEXT_BASE_PATH: "/getry"
        run: |
          set -euo pipefail
          cd getry
          bun install --frozen-lockfile
          # the prisma client generates before the next build: the gateway
          # routes import @prisma/client and the page data collection dies
          # without the generated .prisma tree.
          bunx prisma generate --config prisma.config.ts
          # the static export builds through next directly: the standalone
          # copy steps of the package build script answer the standalone
          # deploy target, not the pages export.
          bunx next build
      - name: Prepare the SPA fallback page
        # the static host answers deep links with the delivered 404.html:
        # the vite build emits the entry alone, so the fallback page rides
        # beside it as the exact copy of the entry the boot smoke and the
        # html lint verify.
        if: matrix.app == 'devthink'
        run: |
          set -euo pipefail
          cp devthink/dist/public/index.html devthink/dist/public/404.html
      - name: Boot smoke test (SPA entry and fallback page on a pinned port)
        if: matrix.app == 'devthink'
        shell: bash
        run: |
          set -euo pipefail
          cd devthink/dist/public
          python3 -m http.server "${SMOKE_PORT}" --bind 127.0.0.1 > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 "http://127.0.0.1:${SMOKE_PORT}/" > entry.html 2>/dev/null; then
              healthy=1
              break
            fi
            echo "  waiting for the SPA entry (attempt ${attempt}/30)"
            sleep 1
          done
          if [ "${healthy}" -ne 1 ]; then
            echo '::error::The static workbench did not answer the SPA entry within 30 seconds. Boot log:'
            cat server.log
            exit 1
          fi
          grep -qF "<title>" entry.html
          echo "the SPA entry answered with content ($(wc -c < entry.html) bytes)"
          fallback_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${SMOKE_PORT}/404.html")"
          if [ "${fallback_code}" != "200" ]; then
            echo "::error::Expected HTTP 200 on the fallback page but received ${fallback_code}. Boot log:"
            cat server.log
            exit 1
          fi
          echo 'boot smoke passed: SPA entry 200 and fallback page 200'
      - name: Lint the delivered html pages (python html.parser well-formedness)
        if: matrix.app == 'devthink'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          import sys

          VOID = {
              'area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input',
              'link', 'meta', 'param', 'source', 'track', 'wbr',
          }

          class WellFormedChecker(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.stack = []
                  self.failures = []

              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append((tag, self.getpos()))

              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack:
                      self.failures.append(
                          f'{self.path}:{self.getpos()[0]}: closing </{tag}> with no open tag')
                      return
                  open_tag, open_pos = self.stack.pop()
                  if open_tag != tag:
                      self.failures.append(
                          f'{self.path}:{self.getpos()[0]}: </{tag}> closes <{open_tag}> '
                          f'opened at line {open_pos[0]}')

          pages = ['devthink/dist/public/index.html', 'devthink/dist/public/404.html']
          failures = []
          for page in pages:
              try:
                  with open(page, encoding='utf-8') as handle:
                      text = handle.read()
              except OSError as error:
                  failures.append(f'{page}: cannot read ({error})')
                  continue
              checker = WellFormedChecker(page)
              checker.feed(text)
              checker.close()
              for tag, pos in checker.stack:
                  failures.append(f'{page}:{pos[0]}: <{tag}> opened but never closed')
              failures.extend(checker.failures)
              if not any(f.startswith(page) for f in failures):
                  print(f'{page}: well-formed ({len(text)} bytes)')

          if failures:
              for failure in failures:
                  print(f'::error::{failure}')
              sys.exit(1)
          print('html lint passed for all delivered pages')
          PY
      - name: Stage the theme under its subpath
        # each application answers the one Pages site under /<app>/; the
        # artifact already carries the folder so the assemble job merges the
        # ten trees by name.
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          mkdir -p "staging/${app}"
          if [ "${app}" = "getry" ]; then
            cp -r getry/out/. "staging/${app}/"
          else
            cp -r "${app}/dist/public/." "staging/${app}/"
          fi
          touch "staging/${app}/.nojekyll"
      - name: Upload the theme artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pages-${{ matrix.app }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Merge the ten themes into the one Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge every theme artifact under its subpath
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: pages-*
          path: _site
          merge-multiple: true
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy the family Pages site
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
