name: Family Pages

# The universal interface deploy of the monorepo (the owner doctrine: one
# theme per application, the Sol folder serves web, OS, TV, mobile, desktop
# and the extension — only the conversion workflow differs). This lane builds
# every family theme and ships ONE GitHub Pages site where each application
# answers under its own subpath: /devthink/, /argan/, /cadria/, /debonair/,
# /forge/, /foundry/, /saddle/, /stealhead/, /vault/ and /getry/. Every vite
# theme installs from its committed lockfile through the package manager its
# manifest pins (the matrix carries the manager per application) and builds
# straight at the application root — the hashed bundles emit flat beside the
# entry html, with no dist, no public and no assets folder — under the
# VITE_BASE_PATH the subpath dictates. The staging copies the delivered web
# surface (the entry, the fallback, the hashed bundles and the static web
# files) out of the root by type. The devthink leg keeps the boot smoke and
# the delivered html well-formedness lint: a bundle whose entry cannot serve
# never reaches the Pages deploy.

on:
  push:
    branches: [main]
    paths:
      - "devthink/**"
      - "argan/**"
      - "cadria/**"
      - "debonair/**"
      - "forge/**"
      - "foundry/**"
      - "saddle/**"
      - "stealhead/**"
      - "vault/**"
      - "getry/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: family-pages
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned boot smoke port (inside the e2ugh family documented
      # 30000-59999 band).
      SMOKE_PORT: "39417"
    strategy:
      fail-fast: false
      matrix:
        # the canonical family pass order (the owner doctrine): the nine
        # applications first - devthink, argan, cadria, debonair, forge,
        # foundry, stealhead, vault, getry - and saddle always last, the
        # heaviest leg of the pass.
        include:
          - { app: devthink, pm: bun }
          - { app: argan, pm: pnpm }
          - { app: cadria, pm: pnpm }
          - { app: debonair, pm: pnpm }
          - { app: forge, pm: pnpm }
          - { app: foundry, pm: pnpm }
          - { app: stealhead, pm: pnpm }
          - { app: vault, pm: pnpm }
          - { app: getry, pm: pnpm }
          - { app: saddle, pm: npm }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.8.1
      - name: Set up Node (pnpm leg)
        if: matrix.pm == 'pnpm'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Set up Node (npm leg)
        if: matrix.pm == 'npm'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0
      - name: Set up Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
          cache: false
      - name: Install and build the theme (bun leg)
        if: matrix.pm == 'bun'
        # the application pins bun: the install reads the committed bun.lock
        # and the build answers straight at the application root (the entry
        # html and the hashed bundles beside the sources, no dist, no public).
        run: |
          set -euo pipefail
          cd devthink
          bun install --frozen-lockfile
          VITE_BASE_PATH="./" bun run build:web
          test -f index.html
          test -n "$(ls *.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
      - name: Install and build the theme (pnpm leg)
        if: matrix.pm == 'pnpm'
        # the theme root is the application root: one package.json, the entry
        # html at the folder root, the build answering at the root beside the
        # engine logic the vite build reads.
        run: |
          set -euo pipefail
          pnpm --dir "${{ matrix.app }}" install --frozen-lockfile
          VITE_BASE_PATH="./" pnpm --dir "${{ matrix.app }}" run build
          test -f "${{ matrix.app }}/index.html"
          test -n "$(ls "${{ matrix.app }}"/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
      - name: Install and build the theme (npm leg)
        if: matrix.pm == 'npm'
        # the application pins npm: the install reads the committed
        # package-lock.json and the build answers straight at the root.
        run: |
          set -euo pipefail
          npm --prefix saddle ci
          VITE_BASE_PATH="./" npm --prefix saddle run web:build:pages
          test -f saddle/index.html
          test -n "$(ls saddle/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
      - name: Prepare the SPA fallback page
        # the static host answers deep links with the delivered 404.html:
        # the build emits the entry alone at the application root, so the
        # fallback page rides beside it as the exact copy of the entry the
        # boot smoke and the html lint verify.
        if: matrix.app == 'devthink'
        run: |
          set -euo pipefail
          cp devthink/index.html devthink/404.html
      - name: Stage the theme under its subpath
        # each application answers the one Pages site under /<app>/; the
        # build answers at the application root, so the staging copies the
        # delivered web surface (the entry, the fallback, the hashed bundles
        # and the static web files) out of the root by type — the sources
        # and the toolchain files never reach the artifact. the artifact
        # already carries the folder so the assemble job merges the ten
        # trees by name.
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          mkdir -p "staging/${app}"
          cp "${app}/index.html" "staging/${app}/"
          cp "${app}/404.html" "staging/${app}/" 2>/dev/null || true
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp "${app}"/*."${kind}" "staging/${app}/" 2>/dev/null || true
          done
          touch "staging/${app}/.nojekyll"
      - name: Boot smoke test (SPA entry and fallback page on a pinned port)
        if: matrix.app == 'devthink'
        shell: bash
        run: |
          set -euo pipefail
          cd staging/devthink
          python3 -m http.server "${SMOKE_PORT}" --bind 127.0.0.1 > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 "http://127.0.0.1:${SMOKE_PORT}/" > entry.html 2>/dev/null; then
              healthy=1
              break
            fi
            echo "  waiting for the SPA entry (attempt ${attempt}/30)"
            sleep 1
          done
          if [ "${healthy}" -ne 1 ]; then
            echo '::error::The static workbench did not answer the SPA entry within 30 seconds. Boot log:'
            cat server.log
            exit 1
          fi
          grep -qF "<title>" entry.html
          echo "the SPA entry answered with content ($(wc -c < entry.html) bytes)"
          fallback_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${SMOKE_PORT}/404.html")"
          if [ "${fallback_code}" != "200" ]; then
            echo "::error::Expected HTTP 200 on the fallback page but received ${fallback_code}. Boot log:"
            cat server.log
            exit 1
          fi
          echo 'boot smoke passed: SPA entry 200 and fallback page 200'
      - name: Lint the delivered html pages (python html.parser well-formedness)
        if: matrix.app == 'devthink'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          import sys

          VOID = {
              'area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input',
              'link', 'meta', 'param', 'source', 'track', 'wbr',
          }

          class WellFormedChecker(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.stack = []
                  self.failures = []

              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append((tag, self.getpos()))

              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack:
                      self.failures.append(
                          f'{self.path}:{self.getpos()[0]}: closing </{tag}> with no open tag')
                      return
                  open_tag, open_pos = self.stack.pop()
                  if open_tag != tag:
                      self.failures.append(
                          f'{self.path}:{self.getpos()[0]}: </{tag}> closes <{open_tag}> '
                          f'opened at line {open_pos[0]}')

          pages = ['staging/devthink/index.html', 'staging/devthink/404.html']
          failures = []
          for page in pages:
              try:
                  with open(page, encoding='utf-8') as handle:
                      text = handle.read()
              except OSError as error:
                  failures.append(f'{page}: cannot read ({error})')
                  continue
              checker = WellFormedChecker(page)
              checker.feed(text)
              checker.close()
              for tag, pos in checker.stack:
                  failures.append(f'{page}:{pos[0]}: <{tag}> opened but never closed')
              failures.extend(checker.failures)
              if not any(f.startswith(page) for f in failures):
                  print(f'{page}: well-formed ({len(text)} bytes)')

          if failures:
              for failure in failures:
                  print(f'::error::{failure}')
              sys.exit(1)
          print('html lint passed for all delivered pages')
          PY
      - name: Upload the theme artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pages-${{ matrix.app }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Merge the ten themes into the one Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge every theme artifact under its subpath
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: pages-*
          path: _site
          merge-multiple: true
      - name: Write the site landing page
        # GitHub serves one Pages site per repository, so the site root
        # answers the navigation page the owner doctrine asks for: the
        # visitor lands once and walks into every application under its own
        # subpath (devthink, the supreme OS, first — the family follows).
        # The design follows the Sol theme grammar: the slate #17191f dark,
        # the Space Grotesk display against the IBM Plex Mono detail face,
        # one signal ember for the chrome, one raised card in the directory
        # rail, one page-load entrance choreography and the reduced-motion
        # opt-out. The ten links are the architecture; the design serves it.
        run: |
          set -euo pipefail
          cat > _site/index.html <<'LANDING_EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <meta name="robots" content="noindex" />
              <meta name="theme-color" content="#17191f" />
              <title>DevThink Family — the home of the applications</title>
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
              <style>
                /* The family console: slate dark, one ember signal, one raised
                   card, one entrance choreography. Tokens mirror the Sol theme
                   of the ten applications. Fluent glass on the cards: alpha
                   fill, blur + saturation (with the -webkit- pair), hairline
                   edge, inset highlight and a diffuse elevation shadow. */
                :root {
                  --dt-base: #17191f;
                  --dt-panel: rgb(255 255 255 / 3%);
                  --dt-panel-strong: rgb(255 255 255 / 6%);
                  --dt-edge: rgb(255 255 255 / 9%);
                  --dt-edge-strong: rgb(255 255 255 / 16%);
                  --dt-text: #edf0f6;
                  --dt-muted: #9aa3b5;
                  --dt-faint: #6b7383;
                  --dt-orange: #ff5f00;
                  --dt-ember: #ff7d33;
                  --dt-blue: #8ab4f8;
                  --dt-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
                  --dt-sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
                  --dt-ease: cubic-bezier(.23, 1, .32, 1);
                  --dt-spring: cubic-bezier(.2, 1.2, .4, 1);
                  /* z-index bands (documented): atmosphere 0 · content 10 · float 20 · bar 50 · modal 200 */
                  --z-atmosphere: 0;
                  --z-content: 10;
                  --z-float: 20;
                  --z-bar: 50;
                  --z-modal: 200;
                  color-scheme: dark;
                }
                * { box-sizing: border-box; }
                body {
                  margin: 0;
                  min-height: 100dvh;
                  display: flex;
                  flex-direction: column;
                  background:
                    radial-gradient(900px 480px at 82% -12%, rgb(255 95 0 / 10%), transparent 62%),
                    linear-gradient(rgb(255 255 255 / 2%) 1px, transparent 1px) 0 0 / 100% 44px,
                    var(--dt-base);
                  color: var(--dt-text);
                  font-family: var(--dt-sans);
                  line-height: 1.55;
                  -webkit-font-smoothing: antialiased;
                }
                a { color: inherit; text-decoration: none; }
                a:focus-visible { outline: 2px solid var(--dt-orange); outline-offset: 3px; border-radius: 10px; box-shadow: 0 0 0 5px rgb(255 95 0 / 18%); }
                .console { width: min(1120px, calc(100% - 40px)); margin: 0 auto; flex: 1; }
                /* masthead — left-aligned, no pyramid, no decorative dot: one
                   eyebrow, one display, one lede (anti-vibe: the eyebrow text
                   alone carries the line) */
                .masthead { padding: clamp(48px, 9vw, 108px) 0 clamp(28px, 5vw, 48px); border-bottom: 1px solid var(--dt-edge); }
                .masthead .eyebrow {
                  display: inline-flex; align-items: center; gap: 9px;
                  margin: 0 0 18px;
                  color: var(--dt-ember);
                  font: 600 10px var(--dt-mono);
                  letter-spacing: .18em;
                  text-transform: uppercase;
                }
                .masthead h1 {
                  margin: 0;
                  max-width: 720px;
                  font: 700 clamp(2.4rem, 6.4vw, 4.6rem)/1.02 var(--dt-sans);
                  letter-spacing: -.045em;
                  text-wrap: balance;
                }
                .masthead h1 em { font-style: normal; color: var(--dt-ember); }
                .masthead .lede { max-width: 560px; margin: 20px 0 0; color: var(--dt-muted); font-size: 1.02rem; text-wrap: pretty; }
                /* directory rail — one raised card (the OS), the family follows */
                .rail {
                  display: grid;
                  grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
                  gap: 12px;
                  padding: clamp(28px, 5vw, 52px) 0 20px;
                }
                .rail a {
                  position: relative;
                  display: flex;
                  flex-direction: column;
                  gap: 10px;
                  min-height: 132px;
                  padding: 18px 18px 16px;
                  background: linear-gradient(160deg, var(--dt-panel-strong), var(--dt-panel));
                  border: 1px solid var(--dt-edge);
                  border-radius: 14px;
                  backdrop-filter: blur(16px) saturate(140%);
                  -webkit-backdrop-filter: blur(16px) saturate(140%);
                  box-shadow: 0 20px 50px -15px rgb(0 0 0 / 55%), inset 0 1px 0 rgb(255 255 255 / 12%);
                  transition: transform 160ms var(--dt-ease), border-color 160ms var(--dt-ease), box-shadow 160ms var(--dt-ease);
                  animation: riseIn .6s var(--dt-ease) backwards;
                }
                .rail a:nth-child(1) { animation-delay: 40ms; }
                .rail a:nth-child(2) { animation-delay: 100ms; }
                .rail a:nth-child(3) { animation-delay: 160ms; }
                .rail a:nth-child(4) { animation-delay: 220ms; }
                .rail a:nth-child(5) { animation-delay: 280ms; }
                .rail a:nth-child(6) { animation-delay: 340ms; }
                .rail a:nth-child(7) { animation-delay: 400ms; }
                .rail a:nth-child(8) { animation-delay: 460ms; }
                .rail a:nth-child(9) { animation-delay: 520ms; }
                .rail a:nth-child(10) { animation-delay: 580ms; }
                .rail a:hover { transform: translateY(-3px); border-color: var(--dt-edge-strong); box-shadow: 0 20px 50px -15px rgb(0 0 0 / 60%), inset 0 1px 0 rgb(255 255 255 / 14%); }
                .rail a:active { transform: translateY(-1px) scale(.98); }
                .rail a .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
                .rail a .top strong { font: 700 1.02rem var(--dt-sans); letter-spacing: -.02em; }
                .rail a .top small { font: 500 9px var(--dt-mono); letter-spacing: .08em; color: var(--dt-faint); }
                .rail a p { margin: 0; color: var(--dt-muted); font-size: .84rem; line-height: 1.55; flex: 1; }
                .rail a .signal { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--sig, var(--dt-orange)); box-shadow: 0 0 10px var(--sig, var(--dt-orange)); }
                .rail a .go { display: inline-flex; align-items: center; gap: 6px; color: var(--dt-faint); font: 600 10px var(--dt-mono); letter-spacing: .08em; text-transform: lowercase; transition: color 160ms var(--dt-ease); }
                .rail a:hover .go { color: var(--dt-ember); }
                /* the one raised card: devthink, the supreme OS */
                .rail a.is-os {
                  grid-column: span 2;
                  min-height: 168px;
                  margin-top: -6px;
                  background: linear-gradient(160deg, rgb(255 95 0 / 12%), rgb(255 95 0 / 4%) 46%, var(--dt-panel));
                  border-color: rgb(255 125 59 / 34%);
                  box-shadow: 0 0 0 1px rgb(255 95 0 / 24%), 0 20px 50px -15px rgb(0 0 0 / 60%), inset 0 1px 0 rgb(255 251 235 / 12%);
                }
                .rail a.is-os .top strong { font-size: 1.2rem; }
                .rail a.is-os .go { color: var(--dt-ember); }
                @media (max-width: 560px) { .rail a.is-os { grid-column: span 1; margin-top: 0; } }
                /* footer meta */
                .meta {
                  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
                  width: min(1120px, calc(100% - 40px));
                  margin: 0 auto;
                  padding: 18px 0 22px;
                  border-top: 1px solid var(--dt-edge);
                  color: var(--dt-faint);
                  font: 500 10px var(--dt-mono);
                  letter-spacing: .06em;
                  font-variant-numeric: tabular-nums;
                }
                .meta span + span::before { content: "·"; margin-right: 18px; color: var(--dt-edge-strong); }
                @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
                @media (prefers-reduced-motion: reduce) {
                  .rail a { animation: none; transition: none; }
                }
                @media (prefers-reduced-transparency: reduce) {
                  .rail a {
                    background: var(--dt-panel-strong);
                    backdrop-filter: none;
                    -webkit-backdrop-filter: none;
                  }
                }
              </style>
            </head>
            <body>
              <main class="console">
                <header class="masthead">
                  <p class="eyebrow">DEVTHINK FAMILY · GITHUB PAGES</p>
                  <h1>One operating system.<br /><em>Nine instruments.</em></h1>
                  <p class="lede">The home of the devthink applications — each one answers under its own path on this site. Start at the supreme OS: the local workbench with the gateway, sessions and the family applications.</p>
                </header>
                <nav class="rail" aria-label="Family applications">
                  <a class="is-os" href="devthink/" style="--sig:#ff5f00">
                    <span class="top"><strong>DevThink</strong><small>/devthink</small><span class="signal" aria-hidden="true"></span></span>
                    <p>the supreme OS: workbench, gateway, sessions and the family applications</p>
                    <span class="go">open the OS →</span>
                  </a>
                  <a href="argan/" style="--sig:#34d8a8">
                    <span class="top"><strong>Argan</strong><small>/argan</small><span class="signal" aria-hidden="true"></span></span>
                    <p>the family DNS and gateway: zones, DNSSEC and the devthink.pro apex</p>
                    <span class="go">open →</span>
                  </a>
                  <a href="cadria/" style="--sig:#e858c7">
                    <span class="top"><strong>Cadria</strong><small>/cadria</small><span class="signal" aria-hidden="true"></span></span>
                    <p>video, image and 3D studio on the versawase engine</p>
                    <span class="go">open →</span>
                  </a>
                  <a href="debonair/" style="--sig:#d9962e">
                    <span class="top"><strong>Debonair</strong><small>/debonair</small><span class="signal" aria-hidden="true"></span></span>
                    <p>audio DAW: prompt-to-arrangement and katexis mastering</p>
                    <span class="go">open →</span>
                  </a>
                  <a href="forge/" style="--sig:#d6f74b">
                    <span class="top"><strong>Forge</strong><small>/forge</small><span class="signal" aria-hidden="true"></span></span>
                    <p>CI and builds: sandboxed runners with logs and results</p>
                    <span class="go">open →</span>
                  </a>
                  <a href="foundry/" style="--sig:#1e6ff2">
                    <span class="top"><strong>Foundry</strong><small>/foundry</small><span class="signal" aria-hidden="true"></span></span>
                    <p>sandbox and image pipeline — the e2b/docker interface</p>
                    <span class="go">open →</span>
                  </a>
                  <a href="saddle/" style="--sig:#e86f2d">
                    <span class="top"><strong>Saddle</strong><small>/saddle</small><span class="signal" aria-hidden="true"></span></span>
                    <p>distributed storage that becomes publishable compute memory</p>
                    <span class="go">open →</span>
                  </a>
                  <a href="stealhead/" style="--sig:#e8563f">
                    <span class="top"><strong>Stealhead</strong><small>/stealhead</small><span class="signal" aria-hidden="true"></span></span>
                    <p>FPS platform: matches, ranking and the arsenal</p>
                    <span class="go">open →</span>
                  </a>
                  <a href="vault/" style="--sig:#7dd8ff">
                    <span class="top"><strong>Vault</strong><small>/vault</small><span class="signal" aria-hidden="true"></span></span>
                    <p>the network safe: family databases and backups</p>
                    <span class="go">open →</span>
                  </a>
                  <a href="getry/" style="--sig:#8b5cf6">
                    <span class="top"><strong>Getry</strong><small>/getry</small><span class="signal" aria-hidden="true"></span></span>
                    <p>AI gateway: five providers, seven thinking levels and sessions</p>
                    <span class="go">open →</span>
                  </a>
                </nav>
              </main>
              <footer class="meta">
                <span>wenathlan · devthink family</span>
                <span>one theme per application · the Sol folder serves web, OS, TV, mobile, desktop and the extension</span>
              </footer>
            </body>
          </html>
          LANDING_EOF
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy the family Pages site
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
