# Verifies GitHub Actions syntax, expressions, action inputs and reusable
# workflow calls across every workflow file of the repository. A malformed
# workflow must never reach main, so the gate fails on errors. The actions
# ride version tags instead of hard coded commit digests: the supply chain
# review tracks the tag through the release lane, and no internal
# cryptographic pin lives baked inside a workflow file (the family policy).
# The lint runs on every pull request and every push that touches the
# workflows folder - no composite actions folder exists anymore (the
# one-workflow-file standard retired it), so the path filter covers the
# workflows folder only.
name: workflow lint

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflowlint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: workflow syntax and policy lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: lint workflows
        # actionlint validates GitHub Actions workflow syntax, expression
        # contexts, action inputs and reusable workflow call graphs; the
        # check reporter answers both the pull request and the push lanes
        # (the pr-check reporter has no pull request to annotate on a push)
        # and the shellcheck noise the house deliberately carries (the
        # single-quoted node scripts, the typed copy loops) stays out
        # through .github/actionlint.yaml.
        uses: reviewdog/action-actionlint@v1.73.4
        with:
          reporter: github-check
          fail_level: error
          actionlint_flags: -config .github/workflows/actionlint-config.yaml
