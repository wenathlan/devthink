# Verifies GitHub Actions syntax, expressions, action inputs and reusable workflow calls.
name: workflow lint

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  lint:
    name: workflow syntax and policy lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: lint workflows
        uses: reviewdog/action-actionlint@v1.73.2
        with:
          reporter: github-pr-check
          fail_level: error
