# NuGet publication for the DevThink library: packs the rich content
# distribution (devthink.csproj — the netstandard profile carrying the
# library bundles, the cli, headless and mcp entries, the declarations,
# the extension zip and the sample fixtures as contentFiles) and pushes
# it to the GitHub Packages NuGet registry with the job token.
#
# The assembly prerequisite: the content package rides the dist set the
# build generator emits (node tests/build.mjs — the same generator the
# release lane runs), so the lane installs the locked dependencies and
# builds dist/ before dotnet packs the contentFiles from it.

name: publish nuget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing DevThink tag to publish.
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  detect-nuget-source:
    name: detect NuGet source
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.nuget.outputs.present }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: nuget
        shell: bash
        run: |
          if test -f devthink.csproj; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  publish:
    name: publish the rich NuGet content package
    needs: detect-nuget-source
    if: needs.detect-nuget-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.2
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: install locked dependencies
        run: bun install --frozen-lockfile
      - name: assemble the rich dist set the content package carries
        run: node tests/build.mjs
      - name: setup dotnet
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: latest
      - name: pack the rich content distribution
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          dotnet pack devthink.csproj --configuration Release --output ./nuget -p:PackageVersion="${VERSION}"
          # the content package carries the bundles, the entries, the declarations, the fixtures and the extension zip
          test -f "nuget/devthink.${VERSION}.nupkg"
      - name: publish package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          pushed=false
          for attempt in 1 2 3; do
            if dotnet nuget push "nuget/devthink.${VERSION}.nupkg" --api-key "${{ github.token }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate; then pushed=true; break; fi
            echo "The nuget push attempt ${attempt} failed; the bounded retry policy retries inside three attempts."
            sleep "$((attempt * 5))"
          done
          test "$pushed" = true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-nuget-${{ steps.release.outputs.version }}
          path: nuget/*.nupkg
          if-no-files-found: error
          retention-days: 90
