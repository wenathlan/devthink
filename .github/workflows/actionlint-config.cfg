# The actionlint policy of the workflow house: the shellcheck rules that
# fire on the deliberate single-quoted node scripts (the house guard keeps
# the shell expansion off the JS template literals) and on the typed copy
# loops stay out of the findings, and every other finding answers the lint.
shellcheck:
  exclude:
    - SC2016
    - SC2035

# the custom intel macos seat (macos-15-intel) the desktop and the tauri lanes pin: the actionlint label table predates the runner, so the seat declares here the way the actionlint message prescribes for custom labels.
self-hosted-runner: { labels: [macos-15-intel] }
