# The actionlint policy of the workflow house. The current actionlint config
# schema (1.7.x) carries the path-scoped ignore rules: the shellcheck rules
# that fire on the deliberate single-quoted node scripts (the house guard
# keeps the shell expansion off the JS template literals), on the typed
# copy loops and on the step-env uppercase names the vhe lanes pass
# (SC2153 fires its case-similarity heuristic on PROFILE while the env
# block of the step assigns it - an info note, never a defect) stay out
# of the findings, and every other finding answers the lint. The retired
# `shellcheck.exclude` key of the older schema never reached the current
# actionlint builds - the rules below restore the documented exclusion
# the workflow lint lane always intended.
paths:
  .github/workflows/*.yml:
    ignore:
      - "shellcheck reported issue in this script: SC2016:"
      - "shellcheck reported issue in this script: SC2035:"
      - "shellcheck reported issue in this script: SC2153:"

# the custom intel macos seat (macos-15-intel) the desktop and the tauri lanes pin: the actionlint label table predates the runner, so the seat declares here the way the actionlint message prescribes for custom labels.
self-hosted-runner: { labels: [macos-15-intel] }
