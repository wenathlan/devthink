          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/mobile/ipa/* --clobber

  devthink-container:
    name: container release archive
    needs: release-resolve
    # the lane builds the tar.gz release archive from THE Dockerfile (the
    # one container file of the repository): the default runtime target -
    # the multi stage build whose builder validated the whole chain and
    # whose smoke boot proved every surface - saved as the portable
    # archive an operator loads with `docker load` beside the registry
    # image the publishghcr lane pushes.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the build.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    concurrency:
      group: devthink-publish-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # every job carries its own ceiling (the family contract): the archive
    # lane builds the same runtime target the security battery scans under
    # its own 30-minute container ceiling.
    timeout-minutes: 30
    # least-privilege: the job's own write (the e2ugh job-permission
    # doctrine) — the 2.0.184 scorecard closure trimmed the contents
    # write: the archive attach below rides the owner pat, so the github
    # token answers read alone.
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          # the automatic workflow_run path resolves the latest release and
          # detaches the working tree onto its tag (the publishghcr
          # resolver mold), so the archive always builds the tagged source.
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: build container
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.releaseversion.outputs.version }}
        # the context is THE REPOSITORY ROOT (the family-context law the
        # Dockerfile header records): the dependency union pins the vault
        # sibling as file:../vault, the flat test village owns the build
        # engine and the suite, and the config bridges resolve the getry
        # and saddle engines onto their sibling owners, so the image
        # builds from the checkout geometry it mirrors.
        run: |
          archive="devthink.container.${{ steps.releaseversion.outputs.version }}.tar.gz"
          docker build \
            --target runtime \
            --build-arg DEVTHINK_VERSION="${{ steps.releaseversion.outputs.version }}" \
            --build-arg DEVTHINK_REVISION="${{ steps.releaseversion.outputs.revision }}" \
            --tag "$IMAGE" -f devthink/Dockerfile .
          docker save "$IMAGE" | gzip -9 > "$archive"
      - name: checksum and manifest
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          archive="devthink.container.${version}.tar.gz"
          checksums="sha256.container.${version}"
          manifest="manifest.container.${version}.json"
          sha256sum "$archive" > "$checksums"
          printf '{\n  "version": "%s",\n  "platform": "container",\n  "image": "ghcr.io/%s:%s",\n  "archive": "%s",\n  "signing": "caller-owned"\n}\n' "$version" "${{ github.repository }}" "$version" "$archive" > "$manifest"
          ! find . -maxdepth 1 -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .
      - name: upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.container.${{ steps.releaseversion.outputs.version }}
          path: |
            devthink.container.${{ steps.releaseversion.outputs.version }}.tar.gz
            sha256.container.${{ steps.releaseversion.outputs.version }}
            manifest.container.${{ steps.releaseversion.outputs.version }}.json
          if-no-files-found: error
      - name: attach release assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag)
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          # least-privilege (the 2.0.184 scorecard closure): the asset
          # upload rides the owner pat — the github token standing in when
          # the secret does not — so the job answers read alone above.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "devthink.container.${{ steps.releaseversion.outputs.version }}.tar.gz" "sha256.container.${{ steps.releaseversion.outputs.version }}" "manifest.container.${{ steps.releaseversion.outputs.version }}.json" --clobber

  cleanup:
    # THE HOUSE CLEANUP LAW (the owner cache directive, 2026-11-18): every
    # process cleans the caches it created the moment it ends - the run
    # reuses its caches while it works (the registry buildcache image the
    # container lanes carry rides GHCR storage, not the gha quota), the
    # vacuum closes the run so the gha storage the 10GB ceiling polices
    # never clogs the machine pool the family queue rides (the maintenance
    # ladder's daily retention pass stays the deep sweep; this job is the
    # per-run hygiene the security lane modeled first - the sweep-vhe
    # precedent the standalone era carried rides house-level now).
    needs: [deploy, devthink-container, saddle-vhe-cleanup, webpackseats]
    if: always()
    name: Clean this run's caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # least-privilege (the 2.0.184 scorecard closure): the cache deletes
    # below ride the owner pat, so the github token answers read alone.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Delete the caches this pipeline created
        env:
          # least-privilege (the 2.0.184 scorecard closure): the deletes
          # ride the owner pat — the github token standing in when the
          # secret does not — and every delete answers best-effort below.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # best-effort law (the 2.0.184 closure): a cache the delete
          # refuses (a 403/404, the token answering no actions write)
          # logs an honest notice and the loop walks on — the lane never
          # reddens on the cleanup, the seven-day cache auto-eviction the
          # backstop that keeps the storage bounded either way. The tool
          # families these lanes create (buildkit stragglers, the setup
          # node/java/dotnet/go legs) are the sweep scope; the codeql
          # overlays stay with the security lane.
          deleted=0
          while IFS=$'\t' read -r cache_id cache_key; do
            test -n "$cache_id" || continue
            if gh api --method DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" 2>/dev/null; then
              deleted=$((deleted + 1))
              echo "deleted cache id=${cache_id} key=${cache_key}"
            else
              echo "::notice::cache id=${cache_id} key=${cache_key} refused the delete; the seven-day cache auto-eviction is the backstop."
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | test("^(buildkit|bun-|node-cache-|Linux-(node|jdk|dotnet|go)-)")) | [.id, .key] | @tsv')
          echo "run ${RUN_ID} cleanup: deleted ${deleted} gha caches."
