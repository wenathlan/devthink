    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-resolve.outputs.tag }}

      - name: Set up Node (the version resolution step)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      - name: Resolve the saddle version and the base digest (GitHub-computed)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic release tag such as v1.2.14 is required." >&2
            exit 1
          fi
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "$tag"
          version=$(node -p "JSON.parse(require('fs').readFileSync('saddle/package.json','utf8')).version")
          if [[ "v${version}" != "$tag" ]]; then
            echo "Release tag ${tag} does not match the saddle manifest version ${version}." >&2
            exit 1
          fi
          # the digest-never-hardcoded law (the owner rule): no 64-hex
          # digest ever lands in a source file - the node base digest
          # resolves on this GitHub runner at build time and rides the
          # build-args, the same bases idiom the publish workflow's vhe
          # resolver carries (the bare-hex law: the Dockerfile composes
          # name@sha256:${NODE_BASE_DIGEST} itself).
          token="$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull" | jq -r .token)"
          node_digest="$(curl -fsSI -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/node/manifests/26.13.0-slim" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')"
          if ! [[ "${node_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "the node base digest resolved to an unexpected shape: ${node_digest}" >&2; exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "nodedigest=${node_digest#sha256:}"
          } >> "$GITHUB_OUTPUT"
          echo "the saddle ${version} lanes ride the node base digest ${node_digest} resolved at build time."

      - name: wait for the family envelopes on npmjs
        # THE REGISTRY GATE (the containerlanes heal, the app-containers
        # law the same): the release event fires this wave the moment
        # the tag publishes while the family npmjs envelopes land minutes
        # later - the v2.0.172 race reddened the saddle lanes the same
        # way (the base install resolves the @wenathlan sibling seats the
        # production closure carries). The gate polls the public npmjs
        # registry until the ten sibling envelopes answer the release
        # version (the devthink os seat stays off the list: the
        # distpackage lane publishes it a rung late by doctrine), bounded
        # to a 60 minute patience window, 30 seconds apart.
        #
        # THE MIRROR FALLBACK (the npmjs outage window heal, the same
        # law the app-containers gate carries): the public npmjs mirror
        # stopped answering at 2.0.181 when the NPM_TOKEN secret died -
        # the family mirror on npm.pkg.github.com carries the same
        # envelopes the githubnpm lanes publish, so the gate accepts an
        # envelope that answers EITHER source (the public mirror heals
        # when the owner rotates the secret; the log says which source
        # answered).
        shell: bash
        env:
          WAIT_VERSION: ${{ steps.resolve.outputs.version }}
          MIRROR_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
        run: |
          set -euo pipefail
          packages=(argan cadria cobaia debonair forge foundry getry saddle stealthhead vault)
          probe_mirror() {
            # the family mirror carries no version-scoped REST door (the
            # 405 the version URL answers): the package document lists
            # the versions - the token reads the org packages the same
            # repo owns.
            curl -fsSL --max-time 20 \
              -H "Authorization: Bearer ${MIRROR_TOKEN}" \
              -H "Accept: application/json" \
              "https://npm.pkg.github.com/@wenathlan%2F${1}" 2>/dev/null \
              | grep -q "\"${WAIT_VERSION}\"" 2>/dev/null
          }
          deadline=$(( $(date +%s) + 3600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            missing=0
            mirror_only=0
            for pkg in "${packages[@]}"; do
              public=""
              mirror=""
              if curl -fsSL --max-time 20 "https://registry.npmjs.org/@wenathlan%2F${pkg}/${WAIT_VERSION}" >/dev/null 2>&1; then
                public=1
              elif probe_mirror "${pkg}"; then
                mirror=1
              fi
              if [ -z "$public" ] && [ -z "$mirror" ]; then
                missing=1
                echo "still waiting: @wenathlan/${pkg}@${WAIT_VERSION} (neither the public npmjs mirror nor the family mirror answers)"
              elif [ -z "$public" ]; then
                mirror_only=1
                echo "@wenathlan/${pkg}@${WAIT_VERSION} answers the family mirror (the npmjs public mirror heals when the NPM_TOKEN secret rotates)"
              fi
            done
            if [ "$missing" -eq 0 ]; then
              if [ "$mirror_only" -eq 1 ]; then
                echo "all ten sibling envelopes answer ${WAIT_VERSION} on the family mirror (npmjs public propagation pending the NPM_TOKEN rotation)"
              else
                echo "all ten sibling envelopes answer ${WAIT_VERSION} on npmjs"
              fi
              exit 0
            fi
            sleep 30
          done
          echo "the family envelopes never answered ${WAIT_VERSION} on npmjs or the family mirror within the patience window" >&2
          exit 1

      - name: Set up QEMU (the emulated legs of the build index)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # the build index minus the native amd64 leg: every platform
          # the amd64 runner cannot execute installs its binfmt handler
          # here (the family pin - only the emulated legs: 386, arm/v6,
          # arm/v7, arm64, ppc64le, riscv64 and s390x).
          platforms: linux/386,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the lane tag (the per-leg guard)
        # the per-leg guard of the partial-publish freeze fix: a re-run
        # that follows a partial family skips only the leg whose tag
        # already answers on the registry, so the re-run completes
        # exactly the missing lanes (the seat stamping below stays
        # idempotent - a seat tag re-created over the same digest
        # content is a registry no-op).
        id: meta
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          SUFFIX: ${{ matrix.suffix }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          suffix="${SUFFIX}"
          echo "tag=${img}:${ver}${suffix}" >> "$GITHUB_OUTPUT"
          echo "resolved lane tag: ${img}:${ver}${suffix}"
          leg_out="$(gh api "/users/${OWNER,,}/packages/container/saddle/versions" --jq "[.[] | select(.metadata.container.tags[]? | . == \"${ver}${suffix}\")] | length" 2>/dev/null || true)"
          case "${leg_out}" in
            ''|*[!0-9]*) leg_out=0 ;;
          esac
          if [ "${leg_out}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag ${ver}${suffix} already ships on the registry; this leg will skip the build (the seat stamping still completes)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the saddle build context (the engine-ownership sibling)
        # the label store law rides the sibling import: the saddle labels
        # resolve ../vault/labelstore.ts, so the vault rides the context
        # beside the saddle the way the vhe lanes of the publish
        # workflow stage it (sources only - the build never installs the
        # sibling, the vite step reads the .ts file directly).
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          # the routerbase sibling the family law carries: the saddle
          # solbuild stage COPYs devthink/ at /devthink where the
          # routerbase re-export resolves (sources only, never
          # installed - the same law the vault sibling rides).
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist \
                 saddlebuildctx/vault/test \
                 saddlebuildctx/devthink/.git saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/devthink/dist saddlebuildctx/devthink/build
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' 'devthink/node_modules' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: Build and push the multi-arch lane image
        # the per-leg guard: a leg whose tag already ships on the
        # registry skips the build (the partial-publish freeze fix - the
        # re-run completes only the missing lanes of the family).
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          # the lane target the matrix names (max, balanced, lite - the
          # profile variant stages - or the thirty-three os-distribution
          # flavor stages the 11×3 standardization carries: oslinux,
          # oslinux-balanced, oslinux-lite beside their ten sibling
          # distributions, every tier its own stage): the same variant
          # stages the Dockerfile documents.
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            SADDLE_VERSION=${{ steps.resolve.outputs.version }}
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
            NODE_BASE_TAG=node:26.13.0-slim
            NODE_BASE_DIGEST=${{ steps.resolve.outputs.nodedigest }}
          labels: |
            org.opencontainers.image.title=saddle (the master virtualization engine, the ${{ matrix.profile }} lane of the containerlanes wave)
            org.opencontainers.image.description=the ninety modalities the self-hosted edge answers (the ${{ matrix.osprofile && format('{0} {1}', matrix.osprofile, matrix.profile) || matrix.profile }} lane, the fifteen-plus docker distribution law)
            org.opencontainers.image.version=${{ steps.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max
          provenance: mode=max
          sbom: true

      - name: Stamp the per-architecture seat tags (the arch-seat lanes of the profile legs)
        # THE SEAT LANES (the twelve-lane arch law's primary half):
        # every profile leg of the matrix (max, balanced, lite) stamps
        # its eight per-architecture seat tags off the published index -
        # the seat resolves exactly the per-arch manifest digest the
        # multi-arch push shipped through docker buildx imagetools (the
        # variant-aware lookup the family job's seat step carries, so
        # the arm/v6 and arm/v7 seats resolve their arm-variant
        # manifests), so `docker pull
        # --platform linux/arm64 saddle:<version>-max-linux-arm64`
        # answers the arm64 image of the max profile (never a rebuild,
        # never a placeholder). twenty-four seat lanes beside the three
        # profile umbrellas and the thirty-three os-distribution flavor
        # lanes of the 11×3 standardization: sixty distinct published
        # tags, the more-than-fifteen directive answered.
        if: matrix.seatprefix != ''
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          SEATPREFIX: ${{ matrix.seatprefix }}
          SUFFIX: ${{ matrix.suffix }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          index="$(docker buildx imagetools inspect --raw "${img}:${ver}${SUFFIX}")"
          for platform in ${PLATFORMS//,/ }; do
            slug="${platform//\//-}"
            arch="${platform#linux/}"
            digest="$(printf '%s' "${index}" | jq -r --arg a "${arch}" 'first(.manifests[] | select(.platform.os == "linux" and (.platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)) == $a) | .digest) // ""')"
            if [ -z "${digest}" ]; then
              echo "::warning::the ${platform} seat never answered on the ${SEATPREFIX} index; the seat stays documented, the wave continues."
              continue
            fi
            docker buildx imagetools create -t "${img}:${ver}-${SEATPREFIX}-${slug}" "${img}@${digest}"
            echo "the ${SEATPREFIX} ${platform} seat ships as ${img}:${ver}-${SEATPREFIX}-${slug}"
          done

      - name: Build the documented best-effort lanes (fail closed, never block the wave)
        # the honest best-effort half of the twelve-lane arch law: the
        # arches buildx supports whose pinned node base carries no
        # manifest today (arm/v5, mips64le, mips64 and loong64). each
        # lane builds its own per-arch seat tag with this lane's own
        # target and profile build-args over the same context, file and
        # target the main build step of this job carries - the seat
        # grammar mirrors the seat-tag step above (the version, the
        # seatprefix, the arch slug: <version>-max-linux-arm-v5); the
        # os-distribution lanes carry no seatprefix, so their stem is
        # the lane tag itself (the version plus the matrix suffix:
        # <version>-archlinux-balanced-linux-mips64le). a lane whose
        # base cannot resolve fails closed with a warning - the lane
        # stays documented in the census, the wave never reddens on an
        # arch no base ships (continue-on-error rides the step for the
        # same law the family job carries).
        if: steps.meta.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        env:
          EXOTIC: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          SEATPREFIX: ${{ matrix.seatprefix }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
          PROFILE_CPU: ${{ matrix.profilecpu }}
          PROFILE_VCPUS: ${{ matrix.profilevcpus }}
          PROFILE_THREADS: ${{ matrix.profilethreads }}
          PROFILE_RAM_GB: ${{ matrix.profileram }}
          PROFILE_GPU: ${{ matrix.profilegpu }}
          PROFILE_GPUS: ${{ matrix.profilegpus }}
          NODE_BASE_TAG: node:26.13.0-slim
          NODE_BASE_DIGEST: ${{ steps.resolve.outputs.nodedigest }}
        run: |
          set -uo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          for arch in ${EXOTIC//,/ }; do
            slug="${arch//\//-}"
            if [ -n "${SEATPREFIX}" ]; then
              seatstem="${ver}-${SEATPREFIX}"
            else
              seatstem="${ver}${SUFFIX}"
            fi
            echo "--- best-effort lane ${arch} (documented: no pinned node base carries this manifest today) ---"
            if docker buildx build \
              --platform "${arch}" \
              --target "${TARGET}" \
              --build-arg "SADDLE_VERSION=${ver}" \
              --build-arg "VHE_PROFILE_CPU=${PROFILE_CPU}" \
              --build-arg "VHE_PROFILE_VCPUS=${PROFILE_VCPUS}" \
              --build-arg "VHE_PROFILE_THREADS=${PROFILE_THREADS}" \
              --build-arg "VHE_PROFILE_RAM_GB=${PROFILE_RAM_GB}" \
              --build-arg "VHE_PROFILE_GPU=${PROFILE_GPU}" \
              --build-arg "VHE_PROFILE_GPUS=${PROFILE_GPUS}" \
              --build-arg "NODE_BASE_TAG=${NODE_BASE_TAG}" \
              --build-arg "NODE_BASE_DIGEST=${NODE_BASE_DIGEST}" \
              --tag "${img}:${seatstem}-${slug}" \
              --push "./saddlebuildctx" "--file=./saddlebuildctx/saddle/Dockerfile"; then
              echo "the best-effort lane ${arch} answered - a base variant carries it now; the lane ships as :${seatstem}-${slug}."
            else
              echo "::warning::the best-effort lane ${arch} failed closed - the pinned node base carries no ${arch} manifest; the lane stays documented in the census, the wave continues."
            fi
          done

      - name: The lane census line (the sixty-tag family)
        # the lane census the twelve-lane law charges: every saddle
        # distribution lane carries twelve arch lanes - the eight
        # primary legs the pinned node base honestly answers plus the
        # four documented best-effort exotic lanes - and the census
        # computes the count off the matrix strings (never a hand-typed
        # guess), asserts at least twelve arch lanes per lane and names
        # the family total honestly.
        shell: bash
        env:
          PLATFORMS: ${{ matrix.platforms }}
          EXOTIC: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
        run: |
          set -euo pipefail
          ver="${{ steps.resolve.outputs.version }}"
          primary="$(printf '%s' "${PLATFORMS}" | tr ',' '\n' | wc -l)"
          exotic="$(printf '%s' "${EXOTIC}" | tr ',' '\n' | wc -l)"
          archlanes=$((primary + exotic))
          seats=$((3 * primary))
          lanes=$((3 + seats + 33))
          test "${archlanes}" -ge 12
          echo "the saddle ${ver} container family answers ${lanes} lanes: the three profile umbrellas (${ver}, ${ver}-balanced, ${ver}-lite), the ${seats} architecture seats (-max-linux-*, -balanced-linux-*, -lite-linux-* on the eight primary arches), the thirty-three os-distribution flavor lanes (eleven distributions - linux, omarchy, vanillaos, android, archlinux, alpine, debian, fedora, nixos, void, postmarketos - each on its max, balanced and lite tier) and the ${exotic} documented best-effort lanes beside every one of them (arm/v5, mips64le, mips64, loong64 - fail closed, never blocking the wave): ${archlanes} arch lanes every distribution and every profile, more than fifteen docker distributions, the owner's twelve-lane law answered."

  saddle-vhe-validate:
    # THE SADDLE LANES (the split the half-megabyte law answered, folded
    # into the containers wave by the consolidation pass - the publish
    # workflow grew past the half-megabyte line the github push
    # validation carries and every push answered the phantom zero-job
    # failure: the saddle vhe lane family - the tier-grid catalog, the
    # verify grid, the publish lanes, the scan, the validate gate, the
    # cleanup and the saddle-container archive - rides the merged
    # containers workflow the same triggers and the same gates answer,
    # the resolver and the approval seats riding beside them the way
    # the containers wave always carried its own.
    # THE TWELVE-LANE LAW the owner's latest breath ordered rides the whole
    # family: every distribution — the profile lanes, the os-distribution
    # flavors, the catalog seats (grapheneos, maruos, archlinux, alpine,
    # debian, nixos, void, fedora and the rest) — carries the twelve arch
    # lanes (the eight primary legs the pinned node base answers beside the
    # four documented best-effort arches), and the NORMAL distribution owns
    # its dedicated closing job: the bare version tag without the v trace
    # (never the -vhe trace the stale 2.1.6 era carried), published as the
    # top stamp of every rung — the seat the owner named to ride above
    # grapheneos, the standard the plain docker pull resolves.
    name: Validate saddle vhe image (${{ matrix.profile }}, ${{ matrix.platform }})
    # the saddle vhe validation lane of the standalone board, folded in
    # dispatch-only: the deep validation it carries (the multi-architecture
    # matrix and the saddle docker contexts) stays a dispatch-shaped probe
    # (the saddle container law opens the publish chain - the resolver, the
    # scan, the registry push, the verify and the archive - to the release
    # wave; the twelve-leg validation matrix (PR15: 3 profiles x the
    # four build legs of the container-carried seats the pinned node base answers of the
    # eleven-architecture standard) answers the maintenance dispatch
    # alone, where its
    # cost belongs). The grand-merge era validated a spoofed /proc the
    # from-source mesa stages carried; the family doctrine ships the
    # console the webserver serves, so the legs validate the boot, the
    # health route, the modality catalog and the profile stamp.
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: devthink-saddlelanes-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 240 min: a cold-cache emulated arm64 leg (QEMU) still rides past a
    # short ceiling on lockfile churn. The warm registry cache
    # keeps the legs far under this; the ceiling only matters on
    # cold-cache rebuilds after Dockerfile/lockfile churn.
    timeout-minutes: 240
    permissions:
      # the mesa mirror healing the grand-merge era carried retired with
      # the from-source stages: the read-only doctrine answers again, and
      # packages stays write for the registry buildcache legs.
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # THE ELEVEN-ARCH CONTAINER LAW (PR15): the standard covers the
        # eleven architecture seats of saddle/containerarch.ts (linux-x64,
        # darwin-arm64, windows-x64, linux-arm64, darwin-x64,
        # windows-arm64, linux-x64-musl, linux-riscv64, wasm32,
        # darwin-arm64-v8, windows-x64-gnu) and the build legs follow the
        # container-carried seats the pinned node base honestly answers:
        # the native amd64 leg that serves linux-x64 and linux-x64-musl
        # beside the arm64, ppc64le and s390x legs under QEMU emulation
        # on the amd64 runner. The linux-riscv64 seat the containerarch
        # standard carries on the bash:5 driver base answers the honest
        # coded absence here (the node engine base ships no riscv64
        # manifest), and the six target seats (the darwin and windows
        # seats and wasm32) answer ARCH_TARGET_NOT_CONTAINER, never a
        # pretended build leg. 3 profiles x 4 build legs = 12 validation
        # legs.
        platform: [linux/amd64, linux/arm64, linux/ppc64le, linux/s390x]
        profile: [max, balanced, lite]
        include:
          - profile: max
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve arch slug
        id: slug
        run: echo "slug=$(echo '${{ matrix.platform }}' | cut -d/ -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (the emulated legs of the build index)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # the build index minus the native amd64 leg: every platform
          # the amd64 runner cannot execute installs its binfmt handler
          # here (the family pin - the seven emulated legs of the
          # twelve-lane law: 386, arm/v6, arm/v7, arm64, ppc64le,
          # riscv64 and s390x).
          platforms: linux/386,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (registry cache)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the saddle build context (the engine-ownership sibling)
        # the label store law rides the sibling import: the saddle labels
        # resolve ../vault/labelstore.ts (the node-side fork reads the
        # source file raw), so the vault rides the context beside the
        # saddle the way the cadria container stages the debonair engine
        # (the family context fix) - and the routerbase law lands the
        # devthink sibling beside them: saddle/routerbase.ts re-exports
        # the family routerBase from ../devthink/routerbase.ts, so the
        # devthink sources ride the context the same containers.yml
        # staging law carries (the buildx seat that died on the missing
        # /devthink). sources only - the build never installs the
        # siblings, the vite step reads the .ts files directly.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: Resolve the node base digest (the local-build lane)
        # the digest-never-hardcoded law, the probe shape: this dispatch-only
        # lane carries no needs edge (it never rides the release chain), so
        # it resolves the manifest-list digest the same way the Dockerfile's
        # digest-law comment documents for local builds - on the runner, at
        # build time, the one-workflow-file standard every lane's own steps
        # carry. the release chain's resolver stays the single source the
        # publish legs read; this is the probe's own copy of the same lane.
        id: nodebase
        run: |
          set -euo pipefail
          token="$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull" | jq -r .token)"
          digest="$(curl -fsSI -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/node/manifests/26.13.0-slim" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')"
          case "${digest}" in
            sha256:*) ;;
            *) echo "the node base digest resolved to an unexpected shape: ${digest}" >&2; exit 1 ;;
          esac
          # the bare-hex digest law: the saddle Dockerfile composes
          # name@sha256:${NODE_BASE_DIGEST} itself, so the build-arg
          # carries the hex without the sha256: prefix (the doubled
          # prefix parsed no stage and reddened the validation legs).
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Build image (dry run, loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          # the profile target the variant matrix names (max, balanced or
          # lite) - the same targets the publish legs build; the mesa and
          # distro args of the grand-merge era retired with the from-source
          # stages that never built green. the base rides the digest the
          # probe's own resolve step above answers (this lane carries no
          # needs edge - the release chain's resolver stays the source the
          # publish legs read).
          target: ${{ matrix.profile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: saddle-vhe-validate:${{ steps.slug.outputs.slug }}-${{ matrix.profile }}
          build-args: |
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
            NODE_BASE_TAG=node:26.13.0-slim
            NODE_BASE_DIGEST=${{ steps.nodebase.outputs.digest }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max

      - name: Validate the console boot (health, catalog, profile stamp)
        # the grand-merge era validated a spoofed /proc (cpuinfo model
        # names, meminfo windows, clinfo rusticl, vulkaninfo lavapipe,
        # glxinfo llvmpipe) the from-source mesa stages carried; those
        # stages never built green, so the validation answers what the
        # family doctrine ships: the console boots per platform, the
        # health route answers, the modality catalog answers the ninety
        # law and the profile stamp rides the image config.
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          PROFILE: ${{ matrix.profile }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          image="saddle-vhe-validate:${SLUG}-${PROFILE}"
          echo "--- console boot (${PROFILE} on ${PLATFORM}) ---"
          cid="$(docker run -d --rm --platform "${PLATFORM}" --memory-swap=-1 "${image}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          up=1
          for i in $(seq 1 60); do
            if docker exec "${cid}" node -e "fetch('http://127.0.0.1:8080/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" 2>/dev/null; then
              up=0
              echo "health route green after $((i*2))s"
              break
            fi
            sleep 2
          done
          if [ "${up}" -ne 0 ]; then
            echo "::error::the ${PROFILE} console never answered /health on ${PLATFORM}."
            docker logs "${cid}" || true
            exit 1
          fi
          plan="$(docker exec "${cid}" node -e "fetch('http://127.0.0.1:8080/api/v1/modalities').then((r)=>r.json()).then((j)=>{console.log(JSON.stringify(j));process.exit(j.plancount===90?0:1)})")"
          echo "${plan}"
          profile="$(docker image inspect "${image}" --format '{{ index .Config.Env }}')"
          grep -q "SADDLE_PROFILE=${PROFILE}" <<< "${profile}"
          echo "the ${PROFILE} profile on ${PLATFORM}: health green, the ninety modalities answer, the profile stamp rides the config."

  saddle-vhe-resolve:
    name: Resolve saddle vhe release version
    # the vhe chain answers the same gate the registry lanes carry (the
    # approval gate repair): the multi-arch vhe push the publish leg below
    # owns is a registry publish, and no registry publish of the wave rides
    # around the approval gate - the whole chain resolves, scans, publishes
    # and archives behind the one review the gate asks for.
    needs: [release-resolve, release-approval]
    # the release resolver of the vhe lane answering the release law (the
    # saddle container law): the version answers the saddle manifest of the
    # checked out source (the deleted saddle-v* tag resolver never runs
    # again) and the proceed gate keeps duplicate firings no-op. The lane
    # fires beside every application
    # lane of the publish wave - the release published firing, the
    # successful workflow_run completion of the release ladder and the
    # maintenance dispatch - so the saddle container answers the same
    # release every sibling lane answers (the standalone era kept the
    # lane dispatch-only and the container never published with the
    # family: the gap the owner's law closes).
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    concurrency:
      group: devthink-saddlelanes-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # every job carries its own ceiling (the family contract): the
    # resolver leg rides the rubygems resolver's own 15-minute value
    # (the same resolve role this workflow already gates).
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      proceed: ${{ steps.resolve.outputs.proceed }}
      ubunturef: ${{ steps.bases.outputs.ubuntu }}
      pythonref: ${{ steps.bases.outputs.python }}
      noderef: ${{ steps.bases.outputs.node }}
      nodedigest: ${{ steps.bases.outputs.nodedigest }}
    permissions:
      # least-privilege (the 2.0.184 scorecard closure): the resolver
      # reads alone — the release view, the tagged source and the ghcr
      # versions list — so the github token answers read (the stale
      # contents write the retired mesa era left behind never served a
      # write this job performs; the sums umbrella the old comment named
      # lives in the saddle-container lane below and the publish sums
      # lane).
      contents: read
      # packages: read is required to query the GHCR container package
      # versions list (the pre-deploy existence check). The publish,
      # scan, verify jobs below escalate to packages: write / id-token.
      packages: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the release firings resolve the tagged source (the ghcr
          # resolver mold): the saddle manifest the version reads must
          # answer the tag the release carries, not the moving head.
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node (reproducible version-resolution step)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      - id: resolve
        name: Resolve and verify the saddle release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REQUESTED_TAG: ${{ needs.release-resolve.outputs.tag || inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # the release-law resolver (the ghcr lane mold): the release and
          # dispatch firings carry their tag; the workflow_run completion
          # resolves the LATEST release (the firing main may already carry
          # the next rung's manifest, and the vhe lane must answer the
          # release the ladder just cut, not the moving head).
          tag="${REQUESTED_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic release tag such as v1.2.14 is required." >&2
            exit 1
          fi
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "$tag"
          version=$(node -p "JSON.parse(require('fs').readFileSync('saddle/package.json','utf8')).version")
          if [[ "v${version}" != "$tag" ]]; then
            echo "Release tag ${tag} does not match the saddle manifest version ${version}." >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "proceed=false"
          } >> "$GITHUB_OUTPUT"

          if ! gh api "repos/${GH_REPO}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "No published GitHub release for ${tag}." >&2
            exit 0
          fi
          # Pre-deploy existence check: a duplicate dispatch that escapes
          # the concurrency group would attempt to re-publish the same
          # multi-arch manifest list. The GHCR container registry tolerates
          # re-pushes of the same tag (it overwrites), but a duplicate
          # publish wastes 60+ minutes of QEMU build time and risks racing
          # the in-flight build. Query the container package versions list;
          # if the version is already published, exit 0 (proceed=false) so
          # the duplicate firing no-ops cleanly.
          #
          # Robustness note: gh api writes error JSON to STDOUT (not stderr)
          # on 401/403/404, so `2>/dev/null` alone cannot suppress it. The
          # `|| true` ensures the subshell exits 0, then the case statement
          # validates the captured string is a pure non-negative integer;
          # anything else (error JSON, empty, etc.) is treated as "not
          # published yet" so a transient API failure does not silently
          # skip a publish. The saddle family owns the saddle container
          # package (the ghcr.io/wenathlan/saddle lane the family law
          # names): the max profile carries the bare ${version} tag and
          # balanced/lite carry the profile suffix.
          #
          # The partial-publish freeze fix: the no-op used to count ANY
          # profile tag of the version as "published", so a run that
          # landed only the max leg before failing froze balanced and
          # lite out of every re-run (the duplicate no-op answered forever
          # while the family stayed incomplete). The complete-family law:
          # the resolve only no-ops when ALL ELEVEN lane tags of the
          # version are live (the three profile tags — ${version},
          # ${version}-balanced, ${version}-lite — beside the four
          # os-distribution flavor lanes of the tier grid — ${version}-linux,
          # ${version}-omarchy, ${version}-vanillaos, ${version}-android
          # beside their balanced and lite twins — and the four catalog
          # lanes — ${version}-grapheneos,
          # ${version}-maruos, ${version}-v, ${version}-windows) — a
          # partial family always re-proceeds, and the per-leg guard
          # inside the publish matrix skips only the legs that already
          # ship, so a re-run completes exactly the missing lanes.
          api_out="$(gh api "/users/${OWNER}/packages/container/saddle/versions" --jq "[.[] | select(.metadata.container.tags[]? | . == \"${version}\" or . == \"${version}-balanced\" or . == \"${version}-lite\" or . == \"${version}-linux\" or . == \"${version}-omarchy\" or . == \"${version}-vanillaos\" or . == \"${version}-android\" or . == \"${version}-balanced-linux\" or . == \"${version}-lite-linux\" or . == \"${version}-balanced-omarchy\" or . == \"${version}-lite-omarchy\" or . == \"${version}-balanced-vanillaos\" or . == \"${version}-lite-vanillaos\" or . == \"${version}-balanced-android\" or . == \"${version}-lite-android\" or . == \"${version}-grapheneos\" or . == \"${version}-maruos\" or . == \"${version}-v\" or . == \"${version}-windows\" or . == \"${version}-postmarketos\" or . == \"${version}-lineageos\" or . == \"${version}-calyxos\" or . == \"${version}-archlinux\" or . == \"${version}-alpine\" or . == \"${version}-debian\" or . == \"${version}-fedora\" or . == \"${version}-nixos\" or . == \"${version}-void\")] | length" 2>/dev/null || true)"
          case "${api_out}" in
            ''|*[!0-9]*) api_out=0 ;;
          esac
          if [ "${api_out}" = "28" ]; then
            echo "GHCR container ${OWNER}/saddle carries the complete ${version} family (the three profile lanes, the four os-distribution flavor lanes and the thirteen catalog lanes); the duplicate dispatch will no-op."
            exit 0
          fi
          if [ "${api_out}" != "0" ]; then
            echo "GHCR container ${OWNER}/saddle carries a partial ${version} family (${api_out} of 11 tags); proceeding so the missing lanes ship (the per-leg guard skips the published legs)."
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - id: bases
        name: Resolve the base image digests (GitHub-computed)
        run: |
          set -euo pipefail
          # the digest-never-hardcoded law (the owner rule): no 64-hex
          # digest ever lands in a source file — the base image digests
          # are resolved on this GitHub runner at build time (the same
          # doctrine the mesa digest carries) and handed to the docker
          # builds as build-args, so every published fetch is byte-honest
          # while the Dockerfile keeps its bare-tag defaults for local
          # builds. the manifest-list digest serves the whole build
          # matrix (the registry resolves it per platform).
          resolve_ref() {
            local repo="$1" tag="$2"
            local token
            token="$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | jq -r .token)"
            curl -fsSI -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://registry-1.docker.io/v2/${repo}/manifests/${tag}" \
              | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}'
          }
          ubuntu_digest="$(resolve_ref library/ubuntu 24.04)"
          python_digest="$(resolve_ref library/python 3.14.7-slim)"
          node_digest="$(resolve_ref library/node 26.13.0-slim)"
          for pair in "ubuntu:${ubuntu_digest}" "python:${python_digest}" "node:${node_digest}"; do
            name="${pair%%:*}"; digest="${pair#*:}"
            if ! [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "the ${name} base digest resolved to an unexpected shape: ${digest}" >&2; exit 1
            fi
          done
          {
            echo "ubuntu=ubuntu:24.04@${ubuntu_digest}"
            echo "python=python:3.14.7-slim@${python_digest}"
            echo "node=node:26.13.0-slim@${node_digest}"
            # the bare-hex digest law: the saddle Dockerfile composes
            # name@sha256:${NODE_BASE_DIGEST} itself, so the build-arg
            # carries the hex without the prefix - the prefixed form the
            # lane emitted before doubled the sha256: into an invalid
            # stage reference and reddened every saddle vhe leg.
            echo "nodedigest=${node_digest#sha256:}"
          } >> "$GITHUB_OUTPUT"
          echo "base digests resolved at build time: ubuntu ${ubuntu_digest} / python ${python_digest} / node ${node_digest}"

  saddle-vhe-scan:
    name: Saddle vhe security gate (Trivy on the release image)
    needs: saddle-vhe-resolve
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    concurrency:
      group: devthink-saddlelanes-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}

      - name: Set up QEMU (the emulated legs of the build index)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # the build index minus the native amd64 leg: every platform
          # the amd64 runner cannot execute installs its binfmt handler
          # here (the family pin - the seven emulated legs of the
          # twelve-lane law: 386, arm/v6, arm/v7, arm64, ppc64le,
          # riscv64 and s390x).
          platforms: linux/386,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (registry cache)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the saddle build context (the engine-ownership sibling)
        # the label store law rides the sibling import: the saddle labels
        # resolve ../vault/labelstore.ts (the node-side fork reads the
        # source file raw), so the vault rides the context beside the
        # saddle the way the cadria container stages the debonair engine
        # (the family context fix) - and the routerbase law lands the
        # devthink sibling beside them: saddle/routerbase.ts re-exports
        # the family routerBase from ../devthink/routerbase.ts, so the
        # devthink sources ride the context the same containers.yml
        # staging law carries (the buildx seat that died on the missing
        # /devthink). sources only - the build never installs the
        # siblings, the vite step reads the .ts files directly.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: Build image for the security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          # the scan must cover the image this pipeline publishes: the max
          # profile target (the same target the publish legs build); the
          # from-source mesa stages the old scan carried retired with the
          # grand-merge era that never built green.
          target: max
          platforms: linux/amd64
          push: false
          load: true
          tags: saddle-vhe-release-scan:${{ needs.saddle-vhe-resolve.outputs.version }}
          build-args: |
            VHE_PROFILE_CPU=epyc9965
            VHE_PROFILE_VCPUS=192
            VHE_PROFILE_THREADS=384
            VHE_PROFILE_RAM_GB=1024
            VHE_PROFILE_GPU=b200
            VHE_PROFILE_GPUS=8
            NODE_BASE_TAG=node:26.13.0-slim
            NODE_BASE_DIGEST=${{ needs.saddle-vhe-resolve.outputs.nodedigest }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max

      - name: Install trivy (the redirector bypass lane)
        # get.trivy.dev DNS dies on the hosted runners (curl exit six,
        # three strikes across fresh runners and reruns); the release
        # tarball rides the github.com lane the tag resolve itself proved
        # alive - the retry loop rides the curl flags and the explicit
        # version pin (the supply chain doctrine the action pin carried).
        run: |
          set -euo pipefail
          if command -v trivy >/dev/null 2>&1; then trivy --version; exit 0; fi
          for i in 1 2 3 4 5 6; do
            curl -sfL --retry 5 --retry-delay 10 --retry-all-errors \
              "https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz" \
              -o /tmp/trivy.tar.gz && break
            echo "trivy download attempt ${i} failed; sleeping before the next ride"
            sleep 15
          done
          test -s /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan the release image
        # the vex seat answers both trees the gate can scan (the trivyvex
        # law): the resolve lane checks out the frozen tag tree, and the
        # frozen 2.0.175 tag predates the committed saddle/.trivyignore
        # the later rungs carry - the gate reddened FATAL on the missing
        # file and stranded the rung whole. the fallback below writes the
        # same fifteen-vulnid notice the committed seat carries when the
        # checkout answers no file, so every tree the gate scans finds
        # the notice beside it. the fifteen HIGH findings all live in the
        # one go binary the image carries - the native tsc compiler of
        # @typescript/typescript-linux-x64 7.0.2 (the language-typescript
        # modality seat), every one an embedded Go stdlib CVE the
        # upstream stable pin cannot heal yet - while the gate keeps
        # every tooth it owns: any other HIGH or CRITICAL finding, in
        # any other library, binary or package, still reddens the lane
        # with exit-code 1.
        run: |
          if [ ! -f saddle/.trivyignore ]; then
            cat > saddle/.trivyignore <<'VEX'
          # the tsgo seat - the offline compiler binary's embedded Go
          # stdlib CVEs ride the documented notice; drop each entry the
          # day a patched stable typescript ships.
          CVE-2026-56851
          CVE-2026-56852
          CVE-2026-56853
          CVE-2026-56858
          CVE-2026-56859
          CVE-2026-56860
          CVE-2026-56862
          CVE-2026-111943
          CVE-2026-33818
          CVE-2026-39821
          CVE-2026-39822
          CVE-2026-46600
          CVE-2026-78667
          CVE-2026-78669
          CVE-2026-97031
          VEX
            sed -i 's/^[[:space:]]*//' saddle/.trivyignore
          fi
          trivy image saddle-vhe-release-scan:${{ needs.saddle-vhe-resolve.outputs.version }} \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile saddle/.trivyignore \
            --exit-code 1

  saddle-vhe-publish:
    name: Publish saddle vhe lane ${{ matrix.profile }}${{ matrix.osprofile && format('-{0}', matrix.osprofile) || '' }} to GHCR (the lane family of the standard's base-carried legs)
    needs: [saddle-vhe-resolve, saddle-vhe-scan]
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    concurrency:
      group: devthink-saddlelanes-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 330 min: the build index (PR15) carries the seven emulated legs
    # (386, arm/v6, arm/v7, arm64, ppc64le, riscv64 and s390x) under
    # QEMU beside the native amd64 leg - the cold-cache publish legs ran
    # past the old 180-minute ceiling and were killed by the timeout.
    # 5.5h stays under the 6h hosted-runner job cap with headroom for
    # mirror races; the warm registry cache completes the legs far under
    # the ceiling (a cold-cache QEMU pass can still redden on rare
    # mirror races - the registry cache the rerun answers completes the
    # leg).
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # THE TWELVE-LANE LAW BESIDE THE OS-DISTRIBUTION LANE AXIS (the
        # owner's container-lane law in its latest breath: every
        # distribution carries the TWELVE arch lanes): the profile and
        # flavor lanes here ship the eight primary legs the pinned node
        # base honestly answers (the native amd64 leg beside the 386,
        # arm/v6, arm/v7, arm64, ppc64le, riscv64 and s390x legs under
        # QEMU emulation) — every lane x 8 primary legs, plus the four
        # exotic best-effort lanes (arm/v5, mips64le, mips64, loong64)
        # the step below documents per arch — twelve arch lanes every
        # lane. beside them the os-distribution axis rides the tier grid
        # the owner's standardization directive charged: twelve flavor
        # lanes (linux, omarchy, vanillaos, android — every distribution
        # carrying its max, balanced and lite twins) stamp their
        # OSDISTRIBUTIONS catalog profile into the image config
        # (SADDLE_OS_PROFILE + the OCI labels), and the catalog lanes the
        # saddle-vhe-catalog job owns (grapheneos, maruos, v, windows,
        # postmarketos, lineageos, calyxos, archlinux, alpine, debian,
        # fedora, nixos, void) complete the family on the same
        # twelve-arch law. the NORMAL distribution — the bare version
        # tag without the v trace, the max profile the saddle-vhe-normal
        # job owns — rides its own seat as the closing top stamp of the
        # rung (above every os-specific seat, grapheneos included).
        # One tag per version, no rolling aliases.
        include:
          - profile: balanced
            target: balanced
            suffix: "-balanced"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: lite
            suffix: "-lite"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
          # the os-distribution flavor lanes: the same engine graph on the
          # same honest base legs with the catalog profile stamped — the
          # linux seat is the baseline flavor, omarchy the arch-based
          # desktop seat, vanillaos the ubuntu-based atomic seat and
          # android the mobile seat the grapheneos hardening builds on
          # - every flavor answers EVERY tier now (the standardization
          # grid: the balanced and lite twins ride beside each max
          # flavor, nothing removed, every prior lane keeps its tag).
          - profile: max
            target: oslinux
            osprofile: linux
            suffix: "-linux"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            target: oslinux
            osprofile: linux
            suffix: "-balanced-linux"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: oslinux
            osprofile: linux
            suffix: "-lite-linux"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
          - profile: max
            target: osomarchy
            osprofile: omarchy
            suffix: "-omarchy"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            target: osomarchy
            osprofile: omarchy
            suffix: "-balanced-omarchy"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: osomarchy
            osprofile: omarchy
            suffix: "-lite-omarchy"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
          - profile: max
            target: osvanillaos
            osprofile: vanillaos
            suffix: "-vanillaos"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            target: osvanillaos
            osprofile: vanillaos
            suffix: "-balanced-vanillaos"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: osvanillaos
            osprofile: vanillaos
            suffix: "-lite-vanillaos"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
          - profile: max
            target: osandroid
            osprofile: android
            suffix: "-android"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            target: osandroid
            osprofile: android
            suffix: "-balanced-android"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: osandroid
            osprofile: android
            suffix: "-lite-android"
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}

      - name: Set up QEMU (the emulated legs of the build index)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # the build index minus the native amd64 leg: every platform
          # the amd64 runner cannot execute installs its binfmt handler
          # here (the family pin - the seven emulated legs of the
          # twelve-lane law: 386, arm/v6, arm/v7, arm64, ppc64le,
          # riscv64 and s390x).
          platforms: linux/386,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the single version tag
        id: meta
        env:
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          PROFILE: ${{ matrix.profile }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          suffix="${{ matrix.suffix }}"
          # ONE tag per version on the saddle container package
          # (ghcr.io/wenathlan/saddle): the saddle name isolates the engine
          # image family from the devthink node-engine image the ghcr lane
          # owns, so the bare version tag answers the max profile with no
          # prefix. No latest, no major.minor, no rolling alias.
          echo "tag=${img}:${ver}${suffix}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${img}:${ver}${suffix}"
          # the per-leg guard of the partial-publish freeze fix: a re-run
          # that follows a partial family (max shipped, balanced/lite
          # missing) skips only the leg whose tag already answers on the
          # registry, so the re-run completes exactly the missing profiles
          # instead of re-pushing the emulated legs that already
          # ship (60+ minutes of build time each, cold cache).
          leg_out="$(gh api "/users/${OWNER,,}/packages/container/saddle/versions" --jq "[.[] | select(.metadata.container.tags[]? | . == \"${ver}${suffix}\")] | length" 2>/dev/null || true)"
          case "${leg_out}" in
            ''|*[!0-9]*) leg_out=0 ;;
          esac
          if [ "${leg_out}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag ${ver}${suffix} already ships on the registry; this leg will skip (the missing siblings still build)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the saddle build context (the engine-ownership sibling)
        # the label store law rides the sibling import: the saddle labels
        # resolve ../vault/labelstore.ts (the node-side fork reads the
        # source file raw), so the vault rides the context beside the
        # saddle the way the cadria container stages the debonair engine
        # (the family context fix) - and the routerbase law lands the
        # devthink sibling beside them: saddle/routerbase.ts re-exports
        # the family routerBase from ../devthink/routerbase.ts, so the
        # devthink sources ride the context the same containers.yml
        # staging law carries (the buildx seat that died on the missing
        # /devthink). sources only - the build never installs the
        # siblings, the vite step reads the .ts files directly.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: Build and push the multi-arch image
        # the per-leg guard: a leg whose tag already ships on the registry
        # skips (the partial-publish freeze fix - the re-run completes only
        # the missing profile siblings of the -vhe family).
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          # the lane target the matrix names (max, balanced, lite — the
          # profile variant stages — or oslinux, osomarchy, osvanillaos,
          # osandroid — the os-distribution flavor stages): the same
          # variant stages the Dockerfile documents.
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            SADDLE_VERSION=${{ needs.saddle-vhe-resolve.outputs.version }}
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
            NODE_BASE_TAG=node:26.13.0-slim
            NODE_BASE_DIGEST=${{ needs.saddle-vhe-resolve.outputs.nodedigest }}
          labels: |
            org.opencontainers.image.title=saddle (the master virtualization engine)
            org.opencontainers.image.description=the ninety modalities the self-hosted edge answers (the ${{ matrix.profile }} profile)
            org.opencontainers.image.version=${{ needs.saddle-vhe-resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max
          provenance: mode=max
          sbom: true

      - name: build the documented best-effort lanes (fail closed, never block the wave)
        # the exotic half of the twelve-lane law the owner's breath
        # ordered: the arches buildx supports whose pinned runtime base
        # carries no manifest today. each lane builds its own per-arch
        # tag off the lane's version tag, and a lane whose base cannot
        # resolve fails closed with a warning - the lane stays
        # documented in the census, the wave never reddens on an arch
        # no base ships (continue-on-error rides the step for the same
        # law the family container lane carries).
        if: steps.meta.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        env:
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          ver="${VERSION}"
          suffix="${SUFFIX}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/saddle"
          for arch in linux/arm/v5 linux/mips64le linux/mips64 linux/loong64; do
            slug="${arch//\//-}"
            echo "--- best-effort lane ${arch} (documented: no pinned base carries this manifest today) ---"
            if docker buildx build \
              --platform "${arch}" \
              --target ${{ matrix.target }} \
              --build-arg SADDLE_VERSION="${ver}" \
              --build-arg VHE_PROFILE_CPU=${{ matrix.profilecpu }} \
              --build-arg VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }} \
              --build-arg VHE_PROFILE_THREADS=${{ matrix.profilethreads }} \
              --build-arg VHE_PROFILE_RAM_GB=${{ matrix.profileram }} \
              --build-arg VHE_PROFILE_GPU=${{ matrix.profilegpu }} \
              --build-arg VHE_PROFILE_GPUS=${{ matrix.profilegpus }} \
              --build-arg NODE_BASE_TAG=node:26.13.0-slim \
              --build-arg NODE_BASE_DIGEST=${{ needs.saddle-vhe-resolve.outputs.nodedigest }} \
              --tag "${image}:${ver}${suffix}-${slug}" \
              --push ./saddlebuildctx --file=./saddlebuildctx/saddle/Dockerfile; then
              echo "the best-effort lane ${arch} answered - a base variant carries it now; the lane ships as :${ver}${suffix}-${slug}."
            else
              echo "::warning::the best-effort lane ${arch} failed closed - the pinned runtime base carries no ${arch} manifest; the lane stays documented in the census, the wave continues."
            fi
          done

  saddle-vhe-catalog:
    name: Publish the saddle os-distribution catalog lane ${{ matrix.osprofile }} to GHCR
    # THE CATALOG LANES OF THE OS-DISTRIBUTION AXIS (the owner's
    # container-lane law, the exotic half): the os profiles with NO
    # runnable container base — grapheneos and maru os are android
    # firmware seats, the v seat is the vlang platform target and the
    # windows seat is the guest vocabulary the exe seats execute — never
    # pretend a runnable image. the lane publishes the profile itself as
    # an image manifest: a scratch-based image whose config carries the
    # SADDLE_OS_PROFILE stamp, the OCI labels and the profile row the
    # osprofiles catalog answers (rendered to json at build time), so the
    # operator reading the registry finds every seat the owner's law
    # names — honest, documented, still a real published lane.
    needs: [saddle-vhe-resolve, saddle-vhe-scan]
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    concurrency:
