            profilegpus: 1
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-resolve.outputs.tag }}

      - name: Set up Node (the version resolution step)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Resolve the saddle version and the base digest (GitHub-computed)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic release tag such as v1.2.14 is required." >&2
            exit 1
          fi
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "$tag"
          version=$(node -p "JSON.parse(require('fs').readFileSync('saddle/package.json','utf8')).version")
          if [[ "v${version}" != "$tag" ]]; then
            echo "Release tag ${tag} does not match the saddle manifest version ${version}." >&2
            exit 1
          fi
          # the digest-never-hardcoded law (the owner rule): no 64-hex
          # digest ever lands in a source file - the node base digest
          # resolves on this GitHub runner at build time and rides the
          # build-args, the same bases idiom the publish workflow's vhe
          # resolver carries (the bare-hex law: the Dockerfile composes
          # name@sha256:${NODE_BASE_DIGEST} itself).
          token="$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull" | jq -r .token)"
          node_digest="$(curl -fsSI -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/node/manifests/26.13.0-slim" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')"
          if ! [[ "${node_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "the node base digest resolved to an unexpected shape: ${node_digest}" >&2; exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "nodedigest=${node_digest#sha256:}"
          } >> "$GITHUB_OUTPUT"
          echo "the saddle ${version} lanes ride the node base digest ${node_digest} resolved at build time."

      - name: wait for the family envelopes on npmjs
        # THE REGISTRY GATE (the containerlanes heal, the app-containers
        # law the same): the release event fires this wave the moment
        # the tag publishes while the family npmjs envelopes land minutes
        # later - the v2.0.172 race reddened the saddle lanes the same
        # way (the base install resolves the @wenathlan sibling seats the
        # production closure carries). The gate polls the public npmjs
        # registry until the ten sibling envelopes answer the release
        # version (the devthink os seat stays off the list: the
        # distpackage lane publishes it a rung late by doctrine), bounded
        # to a 60 minute patience window, 30 seconds apart.
        shell: bash
        env:
          WAIT_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          packages=(argan cadria cobaia debonair forge foundry getry saddle stealthhead vault)
          deadline=$(( $(date +%s) + 3600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            missing=0
            for pkg in "${packages[@]}"; do
              if ! curl -fsSL --max-time 20 "https://registry.npmjs.org/@wenathlan%2F${pkg}/${WAIT_VERSION}" >/dev/null 2>&1; then
                missing=1
                echo "still waiting: @wenathlan/${pkg}@${WAIT_VERSION}"
              fi
            done
            if [ "$missing" -eq 0 ]; then
              echo "all ten sibling envelopes answer ${WAIT_VERSION} on npmjs"
              exit 0
            fi
            sleep 30
          done
          echo "the family envelopes never answered ${WAIT_VERSION} on npmjs within the patience window" >&2
          exit 1

      - name: Set up QEMU (the emulated legs of the build index)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # the build index minus the native amd64 leg: every platform
          # the amd64 runner cannot execute installs its binfmt handler
          # here (the family pin - only the emulated legs: 386, arm/v6,
          # arm/v7, arm64, ppc64le, riscv64 and s390x).
          platforms: linux/386,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the lane tag (the per-leg guard)
        # the per-leg guard of the partial-publish freeze fix: a re-run
        # that follows a partial family skips only the leg whose tag
        # already answers on the registry, so the re-run completes
        # exactly the missing lanes (the seat stamping below stays
        # idempotent - a seat tag re-created over the same digest
        # content is a registry no-op).
        id: meta
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          SUFFIX: ${{ matrix.suffix }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          suffix="${SUFFIX}"
          echo "tag=${img}:${ver}${suffix}" >> "$GITHUB_OUTPUT"
          echo "resolved lane tag: ${img}:${ver}${suffix}"
          leg_out="$(gh api "/users/${OWNER,,}/packages/container/saddle/versions" --jq "[.[] | select(.metadata.container.tags[]? | . == \"${ver}${suffix}\")] | length" 2>/dev/null || true)"
          case "${leg_out}" in
            ''|*[!0-9]*) leg_out=0 ;;
          esac
          if [ "${leg_out}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag ${ver}${suffix} already ships on the registry; this leg will skip the build (the seat stamping still completes)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the saddle build context (the engine-ownership sibling)
        # the label store law rides the sibling import: the saddle labels
        # resolve ../vault/labelstore.ts, so the vault rides the context
        # beside the saddle the way the vhe lanes of the publish
        # workflow stage it (sources only - the build never installs the
        # sibling, the vite step reads the .ts file directly).
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          # the routerbase sibling the family law carries: the saddle
          # solbuild stage COPYs devthink/ at /devthink where the
          # routerbase re-export resolves (sources only, never
          # installed - the same law the vault sibling rides).
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist \
                 saddlebuildctx/vault/test \
                 saddlebuildctx/devthink/.git saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/devthink/dist saddlebuildctx/devthink/build
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' 'devthink/node_modules' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: Build and push the multi-arch lane image
        # the per-leg guard: a leg whose tag already ships on the
        # registry skips the build (the partial-publish freeze fix - the
        # re-run completes only the missing lanes of the family).
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          # the lane target the matrix names (max, balanced, lite - the
          # profile variant stages - or the thirty-three os-distribution
          # flavor stages the 11×3 standardization carries: oslinux,
          # oslinux-balanced, oslinux-lite beside their ten sibling
          # distributions, every tier its own stage): the same variant
          # stages the Dockerfile documents.
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            SADDLE_VERSION=${{ steps.resolve.outputs.version }}
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
            NODE_BASE_TAG=node:26.13.0-slim
            NODE_BASE_DIGEST=${{ steps.resolve.outputs.nodedigest }}
          labels: |
            org.opencontainers.image.title=saddle (the master virtualization engine, the ${{ matrix.profile }} lane of the containerlanes wave)
            org.opencontainers.image.description=the ninety modalities the self-hosted edge answers (the ${{ matrix.osprofile && format('{0} {1}', matrix.osprofile, matrix.profile) || matrix.profile }} lane, the fifteen-plus docker distribution law)
            org.opencontainers.image.version=${{ steps.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max
          provenance: mode=max
          sbom: true

      - name: Stamp the per-architecture seat tags (the arch-seat lanes of the profile legs)
        # THE SEAT LANES (the twelve-lane arch law's primary half):
        # every profile leg of the matrix (max, balanced, lite) stamps
        # its eight per-architecture seat tags off the published index -
        # the seat resolves exactly the per-arch manifest digest the
        # multi-arch push shipped through docker buildx imagetools (the
        # variant-aware lookup the family job's seat step carries, so
        # the arm/v6 and arm/v7 seats resolve their arm-variant
        # manifests), so `docker pull
        # --platform linux/arm64 saddle:<version>-max-linux-arm64`
        # answers the arm64 image of the max profile (never a rebuild,
        # never a placeholder). twenty-four seat lanes beside the three
        # profile umbrellas and the thirty-three os-distribution flavor
        # lanes of the 11×3 standardization: sixty distinct published
        # tags, the more-than-fifteen directive answered.
        if: matrix.seatprefix != ''
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          SEATPREFIX: ${{ matrix.seatprefix }}
          SUFFIX: ${{ matrix.suffix }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          index="$(docker buildx imagetools inspect --raw "${img}:${ver}${SUFFIX}")"
          for platform in ${PLATFORMS//,/ }; do
            slug="${platform//\//-}"
            arch="${platform#linux/}"
            digest="$(printf '%s' "${index}" | jq -r --arg a "${arch}" 'first(.manifests[] | select(.platform.os == "linux" and (.platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)) == $a) | .digest) // ""')"
            if [ -z "${digest}" ]; then
              echo "::warning::the ${platform} seat never answered on the ${SEATPREFIX} index; the seat stays documented, the wave continues."
              continue
            fi
            docker buildx imagetools create -t "${img}:${ver}-${SEATPREFIX}-${slug}" "${img}@${digest}"
            echo "the ${SEATPREFIX} ${platform} seat ships as ${img}:${ver}-${SEATPREFIX}-${slug}"
          done

      - name: Build the documented best-effort lanes (fail closed, never block the wave)
        # the honest best-effort half of the twelve-lane arch law: the
        # arches buildx supports whose pinned node base carries no
        # manifest today (arm/v5, mips64le, mips64 and loong64). each
        # lane builds its own per-arch seat tag with this lane's own
        # target and profile build-args over the same context, file and
        # target the main build step of this job carries - the seat
        # grammar mirrors the seat-tag step above (the version, the
        # seatprefix, the arch slug: <version>-max-linux-arm-v5); the
        # os-distribution lanes carry no seatprefix, so their stem is
        # the lane tag itself (the version plus the matrix suffix:
        # <version>-archlinux-balanced-linux-mips64le). a lane whose
        # base cannot resolve fails closed with a warning - the lane
        # stays documented in the census, the wave never reddens on an
        # arch no base ships (continue-on-error rides the step for the
        # same law the family job carries).
        if: steps.meta.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        env:
          EXOTIC: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          SEATPREFIX: ${{ matrix.seatprefix }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
          PROFILE_CPU: ${{ matrix.profilecpu }}
          PROFILE_VCPUS: ${{ matrix.profilevcpus }}
          PROFILE_THREADS: ${{ matrix.profilethreads }}
          PROFILE_RAM_GB: ${{ matrix.profileram }}
          PROFILE_GPU: ${{ matrix.profilegpu }}
          PROFILE_GPUS: ${{ matrix.profilegpus }}
          NODE_BASE_TAG: node:26.13.0-slim
          NODE_BASE_DIGEST: ${{ steps.resolve.outputs.nodedigest }}
        run: |
          set -uo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          for arch in ${EXOTIC//,/ }; do
            slug="${arch//\//-}"
            if [ -n "${SEATPREFIX}" ]; then
              seatstem="${ver}-${SEATPREFIX}"
            else
              seatstem="${ver}${SUFFIX}"
            fi
            echo "--- best-effort lane ${arch} (documented: no pinned node base carries this manifest today) ---"
            if docker buildx build \
              --platform "${arch}" \
              --target "${TARGET}" \
              --build-arg "SADDLE_VERSION=${ver}" \
              --build-arg "VHE_PROFILE_CPU=${PROFILE_CPU}" \
              --build-arg "VHE_PROFILE_VCPUS=${PROFILE_VCPUS}" \
              --build-arg "VHE_PROFILE_THREADS=${PROFILE_THREADS}" \
              --build-arg "VHE_PROFILE_RAM_GB=${PROFILE_RAM_GB}" \
              --build-arg "VHE_PROFILE_GPU=${PROFILE_GPU}" \
              --build-arg "VHE_PROFILE_GPUS=${PROFILE_GPUS}" \
              --build-arg "NODE_BASE_TAG=${NODE_BASE_TAG}" \
              --build-arg "NODE_BASE_DIGEST=${NODE_BASE_DIGEST}" \
              --tag "${img}:${seatstem}-${slug}" \
              --push "./saddlebuildctx" "--file=./saddlebuildctx/saddle/Dockerfile"; then
              echo "the best-effort lane ${arch} answered - a base variant carries it now; the lane ships as :${seatstem}-${slug}."
            else
              echo "::warning::the best-effort lane ${arch} failed closed - the pinned node base carries no ${arch} manifest; the lane stays documented in the census, the wave continues."
            fi
          done

      - name: The lane census line (the sixty-tag family)
        # the lane census the twelve-lane law charges: every saddle
        # distribution lane carries twelve arch lanes - the eight
        # primary legs the pinned node base honestly answers plus the
        # four documented best-effort exotic lanes - and the census
        # computes the count off the matrix strings (never a hand-typed
        # guess), asserts at least twelve arch lanes per lane and names
        # the family total honestly.
        shell: bash
        env:
          PLATFORMS: ${{ matrix.platforms }}
          EXOTIC: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
        run: |
          set -euo pipefail
          ver="${{ steps.resolve.outputs.version }}"
          primary="$(printf '%s' "${PLATFORMS}" | tr ',' '\n' | wc -l)"
          exotic="$(printf '%s' "${EXOTIC}" | tr ',' '\n' | wc -l)"
          archlanes=$((primary + exotic))
          seats=$((3 * primary))
          lanes=$((3 + seats + 33))
          test "${archlanes}" -ge 12
          echo "the saddle ${ver} container family answers ${lanes} lanes: the three profile umbrellas (${ver}, ${ver}-balanced, ${ver}-lite), the ${seats} architecture seats (-max-linux-*, -balanced-linux-*, -lite-linux-* on the eight primary arches), the thirty-three os-distribution flavor lanes (eleven distributions - linux, omarchy, vanillaos, android, archlinux, alpine, debian, fedora, nixos, void, postmarketos - each on its max, balanced and lite tier) and the ${exotic} documented best-effort lanes beside every one of them (arm/v5, mips64le, mips64, loong64 - fail closed, never blocking the wave): ${archlanes} arch lanes every distribution and every profile, more than fifteen docker distributions, the owner's twelve-lane law answered."
