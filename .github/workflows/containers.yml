name: DevThink Containers

# THE ELEVEN CONTAINER LANES OF THE REGISTRY STANDARD (the containerlanes
# wave, the owner's law: "as 11 lanes do docker não foram publicadas e
# padronizadas em todos os aplicativos, e saddle não tem +15 distribuições
# no docker"): every application of the eleven answers its own
# ghcr.io/wenathlan/<app> container package - the ten sibling lanes
# (argan, cadria, cobaia, debonair, devthink, forge, foundry, getry,
# stealthhead and the self-contained vault engine) riding the
# app-containers matrix with the same multi-arch index, the same
# per-architecture seat tags, the same documented best-effort lanes and
# the same idempotent publish the family-ghcr mirror of the publish
# workflow proved, while the saddle engine walks its own saddle-containers
# lane set under the TWELVE-LANE LAW the owner's latest breath ordered
# (every distribution and every profile carrying the twelve arch lanes:
# the eight primary legs the pinned node base honestly answers - 386,
# amd64, arm/v6, arm/v7, arm64, ppc64le, riscv64 and s390x, the
# emulated legs under QEMU - beside the four exotic best-effort lanes
# - arm/v5, mips64le, mips64 and loong64, documented and fail-closed -
# across the three profile umbrellas and the thirty-three
# os-distribution flavor lanes of the eleven distributions on the max,
# balanced and lite tiers, the 11x3 standardization, sixty distinct
# published tags, every one a real buildx product). the standalone file
# answers the gap the registry census recorded (the ghcr package page
# answered only the saddle package beside its buildcache: the sibling
# containers never published, because the publish mirror rides the
# workflow_run dual trigger the release ladder completion gates and
# the dispatch firing never carried the sibling lanes) - this workflow
# fires on the release published event AND the workflow_dispatch lane,
# so an operator standardizing the registry answers every container
# with one dispatch.
#
# Every job keeps its own conclusion guard (the saddle family pattern,
# Regra 56b), the one resolver seat (the rate-limit heal: one api call
# per wave, every lane reads the job output), the idempotent publish
# (a version tag is immutable content - a re-run over an already
# published index skips the build and only completes the missing seat
# tags) and the least-privilege job permissions the publish lanes carry
# (contents: read beside packages: write, the id-token and attestations
# seats only where the provenance signature rides).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing DevThink tag to publish the container lanes for; empty resolves the latest release.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # the event-scoped group (the family concurrency doctrine, Regra 52):
  # the release published and dispatch firings are distinct lanes that
  # never cancel one another; only a superseded firing of the SAME event
  # and ref waits behind the running one (cancel-in-progress stays false
  # so no publish leg is ever cancelled mid-push).
  group: devthink-containers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  REGISTRY: ghcr.io
  # the saddle lane family caches its multi-profile layers in the same
  # registry cache image the publish workflow's vhe block carries (the
  # one buildcache package the ghcr census already answers).
  CACHE_IMAGE: ghcr.io/${{ github.repository }}-buildcache

jobs:
  release-resolve:
    name: release resolve
    # THE ONE RESOLVER SEAT (the rate-limit heal the publish wave owns):
    # one api call resolves the tag a single time and every lane below
    # reads the job output, so the container wave costs one api call
    # instead of one per lane - the same doctrine the publish mirror
    # consolidated its thirty-one resolvers into.
    if: >-
      github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: resolve the release tag once for the whole wave
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            # the bounded retry the rate-limit window taught: the single
            # remaining api call the wave makes tolerates the transient
            # 403 with the linear backoff before it reddens the wave.
            attempt=0
            until [ "$attempt" -ge 3 ]; do
              attempt=$((attempt + 1))
              tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" && break
              echo "the release resolve attempt ${attempt}/3 failed; retrying with backoff."
              sleep "$((attempt * 20))"
            done
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  app-containers:
    name: Publish the ${{ matrix.app }} container lanes to GHCR (the eleven-container standard)
    needs: [release-resolve]
    # the conclusion guard (the saddle family pattern, Regra 56b): a
    # release firing whose tag carries no v-prefix never reaches the
    # container lanes, and a dispatch without a resolvable release
    # reddens the resolver above before any build starts.
    if: >-
      needs.release-resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      # one application failing its publish must not kill the sibling
      # legs - every folder answers its own container lane to the end.
      fail-fast: false
      matrix:
        # THE ELEVEN CONTAINER LANES (the owner's law, the standardized
        # half): the ten sibling applications ride this matrix while the
        # saddle engine walks its own saddle-containers job below (the
        # fifteen-plus distribution law demands the profile seats a
        # plain matrix leg cannot carry) - together the eleven
        # application containers of the monorepo, every one published
        # under ghcr.io/wenathlan/<app>.
        #
        # THE TWELVE-LANE-PLUS AXIS PER APP (the owner's sentence "nem os
        # outros apps que deveriam ter 11+"): every app container answers
        # the version tag, the latest alias, the per-architecture seat
        # tags of every base-carried arch (one real tag per arch, stamped
        # off the published index) and the documented best-effort lanes
        # (the buildx-supported arches whose pinned base carries no
        # manifest today - the lanes stay named, fail closed and never
        # block the wave). the site homes answer the eight arches their
        # pinned nginxinc/nginx-unprivileged:1.29-alpine runtime base
        # honestly resolves (verified against the live registry manifest
        # list: 386, amd64, arm/v6, arm/v7, arm64, ppc64le, riscv64,
        # s390x), the workbench engine answers the five arches the
        # verified node 26 tarballs and the debian trixie base honestly
        # carry (amd64, arm64, ppc64le, s390x, riscv64) and the vault
        # engine compiles its better-sqlite3 seat per-arch inside the
        # node:26-alpine base, so its carried set is the amd64 and arm64
        # legs the base answers - 8+4, 5+7 or 2+10 beside the version
        # tag and the latest alias: fourteen lanes every app, honestly
        # counted, more than eleven.
        app: [argan, cadria, cobaia, debonair, devthink, forge, foundry, getry, stealthhead, vault]
        include:
          - app: argan
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            versionarg: ARGAN_VERSION
          - app: cadria
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            versionarg: CADRIA_VERSION
          - app: cobaia
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            versionarg: COBAIA_VERSION
          - app: debonair
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            versionarg: DEBONAIR_VERSION
          - app: devthink
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64
            exotic: linux/386,linux/arm/v5,linux/arm/v6,linux/arm/v7,linux/mips64le,linux/mips64,linux/loong64
            versionarg: DEVTHINK_VERSION
          - app: forge
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            versionarg: FORGE_VERSION
          - app: foundry
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            versionarg: FOUNDRY_VERSION
          - app: getry
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            versionarg: GETRY_VERSION
          - app: stealthhead
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            versionarg: STEALTHHEAD_VERSION
          - app: vault
            platforms: linux/amd64,linux/arm64
            exotic: linux/386,linux/arm/v5,linux/arm/v6,linux/arm/v7,linux/mips64le,linux/mips64,linux/ppc64le,linux/riscv64,linux/s390x,linux/loong64
            versionarg: VAULT_VERSION
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.app }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.app }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: wait for the family envelopes on npmjs
        # THE REGISTRY GATE (the containerlanes heal): the release event
        # fires the container lanes the moment the tag publishes, but the
        # family npmjs envelopes land minutes later (the publish wave
        # walks its own lane beside this one) - the v2.0.172 run raced
        # exactly this way (the release event at 21:13, the envelopes on
        # npmjs at 21:49) and every lane that installs @wenathlan seats
        # reddened resolving versions the registry never carried yet
        # (ERR_MODULE_NOT_FOUND on the doors the late envelopes ship, the
        # stale-resolve walks). The gate polls the public npmjs registry
        # until the ten sibling envelopes answer the release version (the
        # devthink os seat stays off the list: the distpackage lane
        # publishes it a rung late by doctrine and every manifest pins
        # its already-published floor), bounded to a 60 minute patience
        # window, 30 seconds apart - then every install walks against
        # envelopes that truly exist.
        shell: bash
        env:
          WAIT_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          packages=(argan cadria cobaia debonair forge foundry getry saddle stealthhead vault)
          deadline=$(( $(date +%s) + 3600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            missing=0
            for pkg in "${packages[@]}"; do
              if ! curl -fsSL --max-time 20 "https://registry.npmjs.org/@wenathlan%2F${pkg}/${WAIT_VERSION}" >/dev/null 2>&1; then
                missing=1
                echo "still waiting: @wenathlan/${pkg}@${WAIT_VERSION}"
              fi
            done
            if [ "$missing" -eq 0 ]; then
              echo "all ten sibling envelopes answer ${WAIT_VERSION} on npmjs"
              exit 0
            fi
            sleep 30
          done
          echo "the family envelopes never answered ${WAIT_VERSION} on npmjs within the patience window" >&2
          exit 1
      - name: login ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: setup qemu
        # multi-arch emulation for the non-native architectures of the
        # per-app index: every platform the amd64 runner cannot execute
        # installs its binfmt handler here (the family pin - only the
        # emulated legs the base-carried axis names).
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/386,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
      - name: setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: check published image state
        # the idempotent publish: a version tag is immutable content, so a
        # re-run over an already published app container skips the build
        # and the push and only completes the seat tags below (a missing
        # or partial index rebuilds and completes the push).
        id: published
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          image_ref="ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${version}"
          if docker buildx imagetools inspect --raw "${image_ref,,}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "the ${image_ref,,} is already published; the seat stamping below stays idempotent."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: stage the site build context for the container install
        # the same staged familybuildctx shape the family-ghcr mirror of
        # the publish workflow proved: the application rides the context
        # nested under app/ (the uniform shape the site Dockerfiles
        # read), the pnpm supply-chain release-age window pins to zero
        # for the container install (the frozen lockfile keeps answering
        # the same integrity-checked versions), the copy-law vault
        # sibling rides every family context beside the app (the
        # @wenathlan/vault/labelstore bridge resolves the ../vault vite
        # aliases) and the engine-ownership sibling map stages the
        # cross-app consumers each home declares (the single place a new
        # sibling registers). the workbench builds from the repository
        # root (the family-context law its Dockerfile header records)
        # and the self-contained vault engine keeps its own folder.
        if: steps.published.outputs.skip != 'true' && matrix.app != 'devthink'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = "vault" ]; then
            # the vault closure heal: the vault engine owned its own
            # folder until the routerbase consolidation seated the
            # family routerBase re-export inside devthink/routerbase.ts,
            # so the closure now rides beside the devthink sources the
            # same sibling law every family home answers (vault at the
            # context root - the shape the vault Dockerfile COPYs read -
            # and the devthink sources nested under devthink/, never
            # installed, the .ts re-export read directly).
            rm -rf vaultbuildctx
            mkdir -p vaultbuildctx/devthink
            cp -a vault/. vaultbuildctx/
            cp -a devthink/. vaultbuildctx/devthink/
            # the foundry pipeline and the saddle modality siblings the
            # vault imports resolve (the ../foundry and ../saddle lanes
            # the tsroot wave seated at the app roots)
            mkdir -p vaultbuildctx/foundry vaultbuildctx/saddle
            cp -a foundry/. vaultbuildctx/foundry/
            cp -a saddle/. vaultbuildctx/saddle/
            rm -rf vaultbuildctx/devthink/.git \
                   vaultbuildctx/devthink/node_modules \
                   vaultbuildctx/devthink/dist \
                   vaultbuildctx/devthink/build \
                   vaultbuildctx/foundry/node_modules \
                   vaultbuildctx/foundry/dist \
                   vaultbuildctx/foundry/build \
                   vaultbuildctx/saddle/node_modules \
                   vaultbuildctx/saddle/dist \
                   vaultbuildctx/saddle/build
            printf '%s\n' 'devthink/.git' 'devthink/node_modules' 'foundry/node_modules' 'saddle/node_modules' '**/node_modules' > vaultbuildctx/.dockerignore
            exit 0
          fi
          rm -rf familybuildctx
          mkdir -p familybuildctx/app
          cp -a "${{ matrix.app }}/." familybuildctx/app/
          printf '\nminimumReleaseAge: 0\n' >> familybuildctx/app/pnpm-workspace.yaml
          mkdir -p familybuildctx/vault
          cp -a vault/. familybuildctx/vault/
          rm -rf familybuildctx/vault/node_modules \
                 familybuildctx/vault/dist \
                 familybuildctx/vault/build
          # the routerbase sibling every family home answers: each app's
          # routerbase.ts re-exports the family routerBase from
          # ../devthink/routerbase.ts, so the devthink sources ride the
          # base context beside the app and the vault (sources only -
          # the same never-installed law the vault sibling carries).
          mkdir -p familybuildctx/devthink
          cp -a devthink/. familybuildctx/devthink/
          rm -rf familybuildctx/devthink/node_modules \
                 familybuildctx/devthink/dist \
                 familybuildctx/devthink/build
          case "${{ matrix.app }}" in
            argan)
              # the engine-ownership map: argan resolves the debonair
              # audio engine through the ../debonair import lanes beside
              # the saddle workload law the ../saddle aliases own
              mkdir -p familybuildctx/debonair familybuildctx/saddle
              cp -a debonair/. familybuildctx/debonair/
              cp -a saddle/. familybuildctx/saddle/
              rm -rf familybuildctx/debonair/node_modules familybuildctx/debonair/dist familybuildctx/debonair/build \
                     familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build
              ;;
            cobaia|stealthhead)
              # the saddle modality registry the ../saddle aliases resolve
              # (the tsroot wave seated the cross-app imports these homes
              # now read beside the copy-law vault pair the base answers)
              mkdir -p familybuildctx/saddle
              cp -a saddle/. familybuildctx/saddle/
              rm -rf familybuildctx/saddle/node_modules \
                     familybuildctx/saddle/dist \
                     familybuildctx/saddle/build
              ;;
            cadria)
              # the engine-ownership sibling map: cadria resolves the
              # debonair audio engine through the ../debonair vite
              # aliases and the argan dns law through the cleanurl
              # bridge (the ../argan import the tsroot wave seated), so
              # both siblings ride the context whole (sources only - the
              # build never installs them)
              mkdir -p familybuildctx/debonair familybuildctx/argan
              cp -a debonair/. familybuildctx/debonair/
              cp -a argan/. familybuildctx/argan/
              rm -rf familybuildctx/debonair/node_modules familybuildctx/debonair/dist familybuildctx/debonair/build \
                     familybuildctx/argan/node_modules familybuildctx/argan/dist familybuildctx/argan/build
              ;;
            debonair)
              # the symmetric engine-ownership map: debonair resolves the
              # cadria synth palette and the saddle workload law through
              # the ../cadria and ../saddle aliases, and the argan dns
              # law through the ../argan import lanes, so all three
              # siblings ride the context whole
              mkdir -p familybuildctx/cadria familybuildctx/saddle familybuildctx/argan
              cp -a cadria/. familybuildctx/cadria/
              cp -a saddle/. familybuildctx/saddle/
              cp -a argan/. familybuildctx/argan/
              rm -rf familybuildctx/cadria/node_modules familybuildctx/cadria/dist familybuildctx/cadria/build \
                     familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build \
                     familybuildctx/argan/node_modules familybuildctx/argan/dist familybuildctx/argan/build
              ;;
            forge)
              # the vault copy law plus the saddle engine ownership (the
              # modes and sandbox bridges the ../saddle aliases own) and
              # the foundry pipeline the ../foundry imports resolve
              mkdir -p familybuildctx/saddle familybuildctx/foundry
              cp -a saddle/. familybuildctx/saddle/
              cp -a foundry/. familybuildctx/foundry/
              rm -rf familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build \
                     familybuildctx/foundry/node_modules familybuildctx/foundry/dist familybuildctx/foundry/build
              ;;
            foundry)
              # the vault copy law plus the saddle engine ownership (the
              # modes and sandbox bridges the ../saddle aliases own)
              mkdir -p familybuildctx/saddle
              cp -a saddle/. familybuildctx/saddle/
              rm -rf familybuildctx/saddle/node_modules \
                     familybuildctx/saddle/dist \
                     familybuildctx/saddle/build
              ;;
            getry)
              # the gateway sibling map: the vault copy law, the saddle
              # modality registry and the debonair route table ride the
              # context whole (the devthink config bridges the gateway
              # aliases resolve answer the base staging every family
              # home now carries - the duplicated devthink seat the
              # routerbase heal retired)
              mkdir -p familybuildctx/saddle familybuildctx/debonair
              cp -a saddle/. familybuildctx/saddle/
              cp -a debonair/. familybuildctx/debonair/
              rm -rf familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build \
                     familybuildctx/debonair/node_modules familybuildctx/debonair/dist familybuildctx/debonair/build
              ;;
          esac
      - name: resolve the context shape
        # the workbench owns the repository-root context the family law
        # records, the vault engine rides the staged vaultbuildctx
        # closure (the devthink sibling the routerbase law charges),
        # while every site home answers the staged familybuildctx shape
        id: resolve-context
        if: steps.published.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.app }}" in
            devthink) echo "context=." >> "$GITHUB_OUTPUT" ;;
            vault) echo "context=vaultbuildctx" >> "$GITHUB_OUTPUT" ;;
            *) echo "context=familybuildctx" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: resolve the build args (the version and revision stamps)
        # the version stamp answers the per-app ARG every Dockerfile
        # declares, and the revision stamp rides the workbench engine
        # alone (the site homes pin no revision ARG, so the args block
        # never carries an empty line the builder would read).
        id: buildargs
        if: steps.published.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "args<<ARGS"
            echo "${{ matrix.versionarg }}=${{ steps.release.outputs.version }}"
            if [ "${{ matrix.app }}" = "devthink" ]; then
              echo "DEVTHINK_REVISION=${{ steps.release.outputs.revision }}"
            fi
            echo "ARGS"
          } >> "$GITHUB_OUTPUT"
      - name: build and push the app container
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.resolve-context.outputs.context }}
          file: ./${{ matrix.app }}/Dockerfile
          # the runner stage is the explicit target of the workbench
          # engine (the single-binary stages of the same file stay
          # behind their own --target)
          target: ${{ matrix.app == 'devthink' && 'runtime' || '' }}
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: ${{ steps.buildargs.outputs.args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:latest
      - name: stamp the per-architecture seat tags (the arch-lane axis)
        # THE SEAT LANES (the standardized distribution surface the
        # owner's "11+" demands): every base-carried arch of the
        # published index answers its own real tag - the seat is stamped
        # off the per-arch manifest digest of the just-published index
        # through docker buildx imagetools, so `docker pull --platform
        # linux/arm64 <app>:<version>-linux-arm64` resolves exactly the
        # arm64 image the multi-arch push shipped (never a rebuild, never
        # a placeholder - the digest is the registry's own answer). the
        # stamping stays idempotent: a re-run re-creates the same seat
        # tag over the same digest content.
        shell: bash
        env:
          PLATFORMS: ${{ matrix.platforms }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.app }}"
          image_ref="${image}:${version}"
          index="$(docker buildx imagetools inspect --raw "${image_ref}")"
          for platform in ${PLATFORMS//,/ }; do
            slug="${platform//\//-}"
            arch="${platform#linux/}"
            digest="$(printf '%s' "${index}" | jq -r --arg a "${arch}" 'first(.manifests[] | select(.platform.os == "linux" and (.platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)) == $a) | .digest) // ""')"
            if [ -z "${digest}" ]; then
              echo "::warning::the ${platform} seat never answered on the published index; the seat stays documented, the wave continues."
              continue
            fi
            docker buildx imagetools create -t "${image}:${version}-${slug}" "${image}@${digest}"
            echo "the ${platform} seat ships as ${image}:${version}-${slug}"
          done
      - name: build the documented best-effort lanes (fail closed, never block the wave)
        # the honest best-effort half of the lane axis: the arches
        # buildx supports whose pinned runtime base carries no manifest
        # today. each lane builds its own per-arch tag, and a lane whose
        # base cannot resolve fails closed with a warning - the lane
        # stays documented in the census, the wave never reddens on an
        # arch no base ships (continue-on-error rides the step for the
        # same law).
        if: steps.published.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        env:
          EXOTIC: ${{ matrix.exotic }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          version="${{ steps.release.outputs.version }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.app }}"
          context="${{ steps.resolve-context.outputs.context || '.' }}"
          file="./${{ matrix.app }}/Dockerfile"
          targetargs=""
          if [ "${{ matrix.app }}" = "devthink" ]; then
            context="."
            targetargs="--target runtime"
          fi
          for arch in ${EXOTIC//,/ }; do
            slug="${arch//\//-}"
            echo "--- best-effort lane ${arch} (documented: no pinned base carries this manifest today) ---"
            if docker buildx build \
              --platform "${arch}" \
              ${targetargs} \
              --build-arg "${{ matrix.versionarg }}=${version}" \
              --tag "${image}:${version}-${slug}" \
              --push "${context}" "--file=${file}"; then
              echo "the best-effort lane ${arch} answered - a base variant carries it now; the lane ships as :${version}-${slug}."
            else
              echo "::warning::the best-effort lane ${arch} failed closed - the pinned runtime base carries no ${arch} manifest; the lane stays documented in the census, the wave continues."
            fi
          done
      - name: verify the published lane set (the eleven-plus census)
        # the lane census the owner's law charges: the published index
        # must carry every arch the pinned base resolves, the seat tags
        # must answer per arch and the census line names the lane count -
        # the version tag, the latest alias, the per-arch seats and the
        # documented best-effort lanes, more than eleven every app,
        # every one honestly named.
        shell: bash
        env:
          PLATFORMS: ${{ matrix.platforms }}
          EXOTIC: ${{ matrix.exotic }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.app }}"
          docker buildx imagetools inspect --raw "${image}:${version}" | jq -e '[.manifests[] | select(.platform.os == "linux")] | length > 0'
          carried="$(printf '%s' "${PLATFORMS}" | tr ',' '\n' | wc -l)"
          exotic="$(printf '%s' "${EXOTIC}" | tr ',' '\n' | wc -l)"
          seats=0
          for platform in ${PLATFORMS//,/ }; do
            slug="${platform//\//-}"
            if docker buildx imagetools inspect --raw "${image}:${version}-${slug}" >/dev/null 2>&1; then
              seats=$((seats + 1))
            fi
          done
          lanes=$((1 + 1 + carried + exotic))
          test "${lanes}" -gt 11
          echo "the ${{ matrix.app }} container answers ${lanes} lanes (the version tag, the latest alias, ${carried} base-carried arches with ${seats} live seat tags + ${exotic} documented best-effort lanes): more than eleven, the container-lane law answered."

  saddle-containers:
    name: Publish the saddle ${{ matrix.profile }}${{ matrix.osprofile && format('-{0}', matrix.osprofile) || '' }} container lanes to GHCR (the fifteen-plus law)
    needs: [release-resolve]
    if: >-
      needs.release-resolve.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 330 min: the build index carries the seven emulated legs (386,
    # arm/v6, arm/v7, arm64, ppc64le, riscv64 and s390x) under QEMU
    # beside the native amd64 leg - the same ceiling the saddle vhe
    # lane of the publish workflow carries (a cold-cache QEMU pass can
    # redden on rare mirror races; the registry cache the rerun answers
    # completes the leg).
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # THE FIFTEEN-PLUS DOCKER DISTRIBUTION LAW (the owner's sentence
        # "saddle não tem +15 distribuições no docker") — THE 11×3
        # STANDARDIZATION UNDER THE TWELVE-LANE ARCH LAW: the three
        # profile lanes ship the build legs of the container-carried
        # seats the pinned node base honestly answers - eight primary
        # arches (the native amd64 leg beside the 386, arm/v6, arm/v7,
        # arm64, ppc64le, riscv64 and s390x legs under QEMU emulation) -
        # and every profile leg stamps its eight per-architecture seat
        # tags off the published index (<version>-max-linux-386,
        # -max-linux-amd64, -max-linux-arm-v6, -max-linux-arm-v7,
        # -max-linux-arm64, -max-linux-ppc64le, -max-linux-riscv64,
        # -max-linux-s390x, the balanced and lite seats beside them:
        # twenty-four arch-seat lanes) beside the four documented
        # best-effort exotic lanes (arm/v5, mips64le, mips64 and
        # loong64 - fail closed, never blocking the wave): twelve arch
        # lanes every profile leg. beside them the
        # os-distribution flavor axis rides ELEVEN distributions - linux,
        # omarchy, vanillaos, android, archlinux, alpine, debian, fedora,
        # nixos, void and postmarketos - and EVERY flavor walks the full
        # three-tier axis (max, balanced, lite: the 11×3 geometry the
        # master's standardization charges, thirty-three flavor lanes)
        # on the same twelve arch lanes (the eight primary legs the
        # pinned node base answers plus the four exotic best-effort
        # lanes), so the saddle tag census answers SIXTY distinct
        # published tags - the three profile umbrellas (<version> for
        # max, -balanced, -lite), the twenty-four architecture seats
        # and the
        # thirty-three os-distribution flavor lanes (eleven -<seat> tags
        # beside their -<seat>-balanced and -<seat>-lite siblings) - more
        # than fifteen, every one a real buildx product the registry
        # answers. the os-distribution flavor lanes stamp their
        # OSDISTRIBUTIONS catalog profile into the image config the same
        # way the vhe lane family of the publish workflow stamps it.
