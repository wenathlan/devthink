    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}

      - name: Set up Node (the type-stripping read of the catalog)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the lane tag (the per-leg guard)
        id: meta
        env:
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          PROFILE: ${{ matrix.osprofile }}
          SUFFIX: ${{ matrix.suffix }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          echo "tag=${img}:${ver}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "resolved catalog lane tag: ${img}:${ver}${SUFFIX}"
          leg_out="$(gh api "/users/${OWNER,,}/packages/container/saddle/versions" --jq "[.[] | select(.metadata.container.tags[]? | . == \"${ver}${SUFFIX}\")] | length" 2>/dev/null || true)"
          case "${leg_out}" in
            ''|*[!0-9]*) leg_out=0 ;;
          esac
          if [ "${leg_out}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "catalog lane ${ver}${SUFFIX} already ships on the registry; this leg will skip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the saddle build context and render the profile config
        # the same staged tree the runnable lanes build (the saddle nested
        # under saddle/ with the vault and devthink sources beside it) plus
        # the rendered osprofiles json the catalog stages COPY: the profile
        # rows the osprofiles catalog answers, one json per seat, generated
        # from the tagged source the lane checks out (never a placeholder).
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore
          cat > osprofile-dump.ts <<'DUMP'
          import { mkdirSync, writeFileSync } from "node:fs";
          import { OSPROFILES } from "./saddlebuildctx/saddle/osprofiles.ts";
          mkdirSync("saddlebuildctx/osprofiles", { recursive: true });
          for (const profile of OSPROFILES) {
            writeFileSync(`saddlebuildctx/osprofiles/${profile.id}.json`, JSON.stringify(profile, null, 2) + "\n");
          }
          console.log(`the os profile catalog answered ${OSPROFILES.length} seats`);
          DUMP
          node osprofile-dump.ts
          rm -f osprofile-dump.ts
          test -s "saddlebuildctx/osprofiles/${{ matrix.osprofile }}.json"

      - name: Build and push the catalog lane
        # the scratch target of the profile: no runnable base (the digest
        # law rides trivially — a scratch stage pins no base at all),
        # the profile config and the stamps the config carries. THE
        # TWELVE-LANE LAW the owner's breath ordered rides the manifest
        # index itself: the scratch seat carries nothing to execute, so
        # the full twelve-platform index (the eight primary legs beside
        # the four exotic arches) builds without emulation and every
        # os-distribution — grapheneos, maruos, archlinux, alpine,
        # debian, nixos and the whole catalog family — answers the same
        # twelve arch lanes the runnable lanes stamp.
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          target: os${{ matrix.osprofile }}
          platforms: linux/386,linux/amd64,linux/arm/v5,linux/arm/v6,linux/arm/v7,linux/arm64,linux/mips64le,linux/mips64,linux/loong64,linux/ppc64le,linux/riscv64,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            SADDLE_VERSION=${{ needs.saddle-vhe-resolve.outputs.version }}
            SADDLE_OS_PROFILE=${{ matrix.osprofile }}
            SADDLE_TIER=${{ matrix.tier }}
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
          labels: |
            org.opencontainers.image.title=saddle (the ${{ matrix.osprofile }} os-distribution catalog lane, the ${{ matrix.tier }} tier)
            org.opencontainers.image.description=the ${{ matrix.osprofile }} os-distribution seat the osprofiles catalog carries on the ${{ matrix.tier }} virtual hardware plan — no runnable container base exists for this seat, the lane publishes the profile config the engine reads.
            org.opencontainers.image.version=${{ needs.saddle-vhe-resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  saddle-vhe-normal:
    name: Publish the saddle normal distribution lane to GHCR (the closing top stamp)
    # THE NORMAL DISTRIBUTION (the owner's latest breath): the standard
    # seat — the bare version tag WITHOUT the v trace (and never the
    # -vhe trace the stale 2.1.6 era carried), the max profile the
    # operator resolves with a plain docker pull. the lane rides its own
    # dedicated job as the CLOSING TOP STAMP of every rung: it completes
    # after the profile, flavor and catalog lanes, so the registry
    # version list answers the normal seat above every os-specific
    # distribution — grapheneos included, the seat the owner named as
    # the most recent today — while the pull the operator runs lands the
    # twelve-lane index the law stamps (the eight primary legs plus the
    # four documented best-effort lanes).
    needs: [saddle-vhe-resolve, saddle-vhe-scan, saddle-vhe-publish, saddle-vhe-catalog]
    if: >-
      always() &&
      needs.saddle-vhe-resolve.result == 'success' &&
      needs.saddle-vhe-resolve.outputs.proceed == 'true' &&
      needs.saddle-vhe-scan.result == 'success'
    concurrency:
      group: devthink-saddlelanes-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # the same ceiling the publish legs carry (the closing stamp walks
    # the same heavy index the max profile always built).
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}

      - name: Set up QEMU (the emulated legs of the build index)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # the build index minus the native amd64 leg: every platform
          # the amd64 runner cannot execute installs its binfmt handler
          # here (the family pin - the seven emulated legs of the
          # twelve-lane law: 386, arm/v6, arm/v7, arm64, ppc64le,
          # riscv64 and s390x).
          platforms: linux/386,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the single normal version tag
        id: meta
        env:
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          # THE NORMAL TAG: the bare version without the v trace (never
          # the -vhe trace the stale 2.1.6 era carried) — the standard
          # seat the owner's law names, one tag per version, no rolling
          # alias, no profile suffix.
          echo "tag=${img}:${ver}" >> "$GITHUB_OUTPUT"
          echo "resolved normal tag: ${img}:${ver}"
          # the per-leg guard the publish legs carry: a re-run that
          # follows a partial rung skips only when the tag already
          # answers on the registry.
          leg_out="$(gh api "/users/${OWNER,,}/packages/container/saddle/versions" --jq "[.[] | select(.metadata.container.tags[]? | . == \"${ver}\")] | length" 2>/dev/null || true)"
          case "${leg_out}" in
            ''|*[!0-9]*) leg_out=0 ;;
          esac
          if [ "${leg_out}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag ${ver} already ships on the registry; the normal stamp will skip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the saddle build context (the engine-ownership sibling)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: Build and push the normal multi-arch image
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          # the max profile the normal seat always answered (the same
          # variant stage the publish legs build).
          target: max
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            SADDLE_VERSION=${{ needs.saddle-vhe-resolve.outputs.version }}
            VHE_PROFILE_CPU=epyc9965
            VHE_PROFILE_VCPUS=192
            VHE_PROFILE_THREADS=384
            VHE_PROFILE_RAM_GB=1024
            VHE_PROFILE_GPU=b200
            VHE_PROFILE_GPUS=8
            NODE_BASE_TAG=node:26.13.0-slim
            NODE_BASE_DIGEST=${{ needs.saddle-vhe-resolve.outputs.nodedigest }}
          labels: |
            org.opencontainers.image.title=saddle (the master virtualization engine)
            org.opencontainers.image.description=the ninety modalities the self-hosted edge answers (the normal distribution - the standard seat)
            org.opencontainers.image.version=${{ needs.saddle-vhe-resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max
          provenance: mode=max
          sbom: true

      - name: build the documented best-effort lanes (fail closed, never block the wave)
        # the exotic half of the twelve-lane law the normal seat answers
        # too: the four documented arches beside the eight primary legs,
        # per-arch tags off the bare version, fail closed.
        if: steps.meta.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        env:
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          ver="${VERSION}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/saddle"
          for arch in linux/arm/v5 linux/mips64le linux/mips64 linux/loong64; do
            slug="${arch//\//-}"
            echo "--- best-effort lane ${arch} (documented: no pinned base carries this manifest today) ---"
            if docker buildx build \
              --platform "${arch}" \
              --target max \
              --build-arg SADDLE_VERSION="${ver}" \
              --build-arg VHE_PROFILE_CPU=epyc9965 \
              --build-arg VHE_PROFILE_VCPUS=192 \
              --build-arg VHE_PROFILE_THREADS=384 \
              --build-arg VHE_PROFILE_RAM_GB=1024 \
              --build-arg VHE_PROFILE_GPU=b200 \
              --build-arg VHE_PROFILE_GPUS=8 \
              --build-arg NODE_BASE_TAG=node:26.13.0-slim \
              --build-arg NODE_BASE_DIGEST=${{ needs.saddle-vhe-resolve.outputs.nodedigest }} \
              --tag "${image}:${ver}-${slug}" \
              --push ./saddlebuildctx --file=./saddlebuildctx/saddle/Dockerfile; then
              echo "the best-effort lane ${arch} answered - a base variant carries it now; the lane ships as :${ver}-${slug}."
            else
              echo "::warning::the best-effort lane ${arch} failed closed - the pinned runtime base carries no ${arch} manifest; the lane stays documented in the census, the wave continues."
            fi
          done

  saddle-vhe-verify:
    name: Verify published saddle vhe image (${{ matrix.profile }})
    needs: [saddle-vhe-resolve, saddle-vhe-publish, saddle-vhe-catalog, saddle-vhe-normal]
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    concurrency:
      group: devthink-saddlelanes-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
