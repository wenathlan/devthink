    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect index and smoke test the console (the runnable lanes)
        if: matrix.mode == 'runnable'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/saddle
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          PROFILE: ${{ matrix.profile }}
          EXPECTOSPROFILE: ${{ matrix.expectosprofile }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE,,}:${VERSION}${SUFFIX}"
          # Every published profile index must carry the build surface of
          # the eleven-arch standard (PR15: the four container-carried
          # legs the pinned node base honestly answers - the native amd64
          # leg that serves linux-x64 and linux-x64-musl beside the
          # arm64, ppc64le and s390x legs under QEMU; the linux-riscv64
          # seat the bash:5 driver base carries answers the honest coded
          # absence on the node engine base, and the six target seats
          # answer ARCH_TARGET_NOT_CONTAINER, never a pretended build
          # leg).
          echo "inspecting ${image_ref}"
          docker buildx imagetools inspect --raw "${image_ref}" | jq -e '
            [
              .manifests[]
              | select(.platform.os == "linux")
              | if .platform.variant then "\(.platform.architecture)/\(.platform.variant)" else .platform.architecture end
            ]
            | sort
            | . == ["amd64", "arm64", "ppc64le", "s390x"]
          '
          docker pull --quiet --platform linux/amd64 "${image_ref}"
          actual_version="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "${actual_version}" = "${VERSION}"
          # the console smoke the family doctrine ships (the grand-merge
          # era asserted a spoofed /proc the from-source stages carried):
          # the published image boots, the health route answers and the
          # modality catalog answers the ninety law.
          cid="$(docker run -d --rm --platform linux/amd64 "${image_ref}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          up=1
          for _ in $(seq 1 30); do
            if docker exec "${cid}" node -e "fetch('http://127.0.0.1:8080/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" 2>/dev/null; then
              up=0
              break
            fi
            sleep 2
          done
          if [ "${up}" -ne 0 ]; then
            echo "::error::the published ${image_ref} never answered /health."
            docker logs "${cid}" || true
            exit 1
          fi
          plan="$(docker exec "${cid}" node -e "fetch('http://127.0.0.1:8080/api/v1/modalities').then((r)=>r.json()).then((j)=>{console.log(JSON.stringify(j));process.exit(j.plancount===90?0:1)})")"
          echo "${plan}"
          profile="$(docker image inspect "${image_ref}" --format '{{ index .Config.Env }}')"
          grep -q "SADDLE_PROFILE=${PROFILE}" <<< "${profile}"
          # the os-distribution flavor lanes stamp their catalog seat beside
          # the plan profile (SADDLE_OS_PROFILE): the flavor legs assert it,
          # the bare profile lanes carry no seat stamp.
          if [ -n "${EXPECTOSPROFILE}" ]; then
            grep -q "SADDLE_OS_PROFILE=${EXPECTOSPROFILE}" <<< "${profile}"
          fi
          echo "published ${image_ref} verified: the four base-carried legs of the eleven-arch index (${PROFILE}${EXPECTOSPROFILE:+, the ${EXPECTOSPROFILE} os-distribution seat}), version label ${VERSION}, health green, the ninety modalities answer, the profile stamps ride the config"

      - name: Verify the catalog lane (the no-base os-distribution seats)
        # the scratch manifest lanes never pretend a boot: the verify reads
        # the published config — the catalog labels, the version stamp and
        # the embedded profile row the osprofiles catalog answers (id,
        # kind, base, archs) — through docker image inspect and the
        # extracted json, the honest grammar a profile with no runnable
        # container base carries.
        if: matrix.mode == 'catalog'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/saddle
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          EXPECTOSPROFILE: ${{ matrix.expectosprofile }}
          EXPECTTIER: ${{ matrix.expecttier }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE,,}:${VERSION}${SUFFIX}"
          echo "inspecting the catalog lane ${image_ref} (the ${EXPECTTIER} tier)"
          docker pull --quiet "${image_ref}"
          actual_version="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "${actual_version}" = "${VERSION}"
          title="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')"
          grep -q "catalog lane" <<< "${title}"
          cid="$(docker create "${image_ref}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/saddle/osprofile.json" ./osprofile.json
          jq -e --arg seat "${EXPECTOSPROFILE}" '.id == $seat and (.kind | length > 0) and (.base | length > 0) and (.archs | length > 0)' ./osprofile.json
          stamp="$(docker image inspect "${image_ref}" --format '{{ index .Config.Env }}')"
          grep -q "SADDLE_OS_PROFILE=${EXPECTOSPROFILE}" <<< "${stamp}"
          grep -q "SADDLE_PROFILE=${EXPECTTIER}" <<< "${stamp}"
          echo "published ${image_ref} verified: the ${EXPECTOSPROFILE} catalog lane carries the profile row (kind, base, archs), the version label ${VERSION}, the seat stamp and the ${EXPECTTIER} tier stamp — no runnable base pretended."

  saddle-vhe-cleanup:
    name: Clean the saddle vhe run caches
    needs: [saddle-vhe-validate]
    # the cache sweeper of the validation lane: the dispatch is the only
    # event the validate legs answer. The vhe lanes cache in the registry
    # buildcache image (cache-to: type=registry on every build leg), so
    # the buildkit-prefixed gha caches this sweeper walks are the
    # standalone-era stragglers - the sweep stays the honest hygiene the
    # consolidated house keeps beside the dispatch probe, never a gate
    # the publish chain depends on.
    if: always() && github.event_name == 'workflow_dispatch'
    concurrency:
      group: devthink-saddlelanes-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    # least-privilege (the 2.0.184 scorecard closure): the cache deletes
    # below ride the owner pat, so the github token answers read alone.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Delete the caches this pipeline created
        env:
          # least-privilege (the 2.0.184 scorecard closure): the deletes
          # ride the owner pat — the github token standing in when the
          # secret does not — and every delete answers best-effort below.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # best-effort law (the 2.0.184 closure): a cache the delete
          # refuses (a 403/404, the token answering no actions write)
          # logs an honest notice and the loop walks on — the lane never
          # reddens on the sweep, the seven-day cache auto-eviction the
          # backstop that keeps the storage bounded either way.
          deleted=0
          while IFS=$'\t' read -r cache_id cache_key; do
            test -n "$cache_id" || continue
            if gh api --method DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" 2>/dev/null; then
              deleted=$((deleted + 1))
              echo "deleted cache id=${cache_id} key=${cache_key}"
            else
              echo "::notice::cache id=${cache_id} key=${cache_key} refused the delete; the seven-day cache auto-eviction is the backstop."
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | startswith("buildkit")) | [.id, .key] | @tsv')
          echo "cleanup: deleted ${deleted} buildkit gha caches."

  saddle-container:
    name: saddle container release archive
    # THE SADDLE CONTAINER LAW (the asset parity the owner demands): the
    # saddle vhe image answers the same release the devthink container
    # archive answers - the standalone era left the saddle container
    # without a release asset (the registry push alone, and dispatch-only
    # at that), so the person who downloads the release could load every
    # sibling container except the saddle one. The lane builds the max
    # profile image the registry lane publishes (the same profile target,
    # the same args the publish legs answer), saves the portable tar.gz
    # an operator loads with `docker load`, and rides behind the security
    # gate the registry push answers (a FAILED trivy scan never ships an
    # archive).
    needs: [saddle-vhe-resolve, saddle-vhe-scan]
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    concurrency:
      group: devthink-saddlelanes-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # the native amd64 leg answers the archive pass after the QEMU
    # builds, riding the same 90-minute ceiling the family container
    # archive carries scaled to the node graph the runtime bakes.
    timeout-minutes: 90
    # least-privilege (the 2.0.184 scorecard closure): the archive attach
    # and the sums umbrella patch below ride the owner pat, so the github
    # token answers read alone.
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}
      - name: Stage the saddle build context (the engine-ownership sibling)
        # the same staged tree the vhe lanes build: the saddle nested under
        # saddle/ with the vault and devthink sources beside it (the
        # node-side label import resolves ../vault/labelstore.ts and the
        # routerbase re-export resolves ../devthink/routerbase.ts inside
        # the build).
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: build the saddle vhe container
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/saddle:${{ needs.saddle-vhe-resolve.outputs.version }}
        # the max profile the registry lane publishes (the Dockerfile
        # defaults bake the same constants; the args stay explicit the
        # saddle family way) and the same context the vhe lanes build
        # (the saddle application folder with the vault and devthink
        # siblings).
        run: |
          set -euo pipefail
          archive="saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}.tar.gz"
          docker build \
            --target max \
            --build-arg SADDLE_VERSION="${{ needs.saddle-vhe-resolve.outputs.version }}" \
            --build-arg VHE_PROFILE_CPU="epyc9965" \
            --build-arg VHE_PROFILE_VCPUS="192" \
            --build-arg VHE_PROFILE_THREADS="384" \
            --build-arg VHE_PROFILE_RAM_GB="1024" \
            --build-arg VHE_PROFILE_GPU="b200" \
            --build-arg VHE_PROFILE_GPUS="8" \
            --build-arg NODE_BASE_TAG="node:26.13.0-slim" \
            --build-arg NODE_BASE_DIGEST="${{ needs.saddle-vhe-resolve.outputs.nodedigest }}" \
            --tag "$IMAGE" -f saddlebuildctx/saddle/Dockerfile saddlebuildctx
          docker save "$IMAGE" | gzip -9 > "$archive"
      - name: checksum and manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.saddle-vhe-resolve.outputs.version }}"
          archive="saddle.container.${version}.tar.gz"
          checksums="sha256.saddle.container.${version}"
          manifest="manifest.saddle.container.${version}.json"
          sha256sum "$archive" > "$checksums"
          printf '{\n  "version": "%s",\n  "platform": "container",\n  "image": "ghcr.io/%s:%s",\n  "archive": "%s",\n  "signing": "caller-owned"\n}\n' \
            "$version" "${{ github.repository_owner }}/saddle" "$version" "$archive" > "$manifest"
      - name: upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}
          path: |
            saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}.tar.gz
            sha256.saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}
            manifest.saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}.json
          if-no-files-found: error
      - name: attach release assets
        env:
          # least-privilege (the 2.0.184 scorecard closure): the asset
          # upload rides the owner pat — the github token standing in when
          # the secret does not — so the job answers read alone above.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          RELEASE_TAG: ${{ needs.saddle-vhe-resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${{ needs.saddle-vhe-resolve.outputs.version }}"
          gh release upload "$RELEASE_TAG" \
            "saddle.container.${version}.tar.gz" \
            "sha256.saddle.container.${version}" \
            "manifest.saddle.container.${version}.json" --clobber
      - name: Patch the SHA256SUMS umbrella with the archive seat
        # the half-megabyte split moved this archive off the publish
        # workflow's sums umbrella — the row answers here instead: the
        # existing umbrella downloads, the old row for this asset
        # retires, the fresh checksum rides the re-upload (the umbrella
        # keeps the full coverage the split never loses).
        env:
          # least-privilege (the 2.0.184 scorecard closure): the umbrella
          # download reads the release while the re-upload writes it — the
          # owner pat carries the whole seat (the github token standing in
          # when the secret does not), the job answering read alone above.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
        run: |
          set -euo pipefail
          asset="saddle.container.${VERSION}.tar.gz"
          sha="$(sha256sum "$asset" | awk '{print $1}')"
          if gh release view -R "$GITHUB_REPOSITORY" "${{ needs.saddle-vhe-resolve.outputs.tag }}" --json assets --jq '.[].name' | grep -qx 'SHA256SUMS'; then
            gh release download -R "$GITHUB_REPOSITORY" "${{ needs.saddle-vhe-resolve.outputs.tag }}" -p SHA256SUMS -O SHA256SUMS.prev || echo "" > SHA256SUMS.prev
          else
            echo "" > SHA256SUMS.prev
          fi
          grep -v " ${asset}$" SHA256SUMS.prev > SHA256SUMS || true
          printf '%s  %s\n' "$sha" "$asset" >> SHA256SUMS
          gh release upload -R "$GITHUB_REPOSITORY" "${{ needs.saddle-vhe-resolve.outputs.tag }}" SHA256SUMS --clobber

  desktop:
    # The universal desktop artifact lane of the family: every member
    # application of the family builds the tauri desktop shell from the same
    # workflow — the matrix crosses the application axis with the seven
    # platform entries the saddle recipe validated. A manual run answers one
    # chosen application across every desktop target; a published release
    # answers the whole member family at once (the nine sibling applications —
    # argan through vault — because the devthink application rides its own
    # publish lane on releases and the family lane never duplicates the os
    # assets the publish lane already ships), which is the doctrine the owner
    # pinned: every application holds the same desktop rights the os holds,
    # and only the iso stays os exclusive. The identity (productName,
    # identifier, version) is read from the tauri.conf.json and the
    # package.json each application tracks, never hardcoded; the vite build
    # answers straight at the application root; the runner stages the
    # delivered surface under build/web and the scaffold aims its
    # frontendDist at that staging; and the rust envelope stays runner-side
    # toolchain output (materialized under build/native/desktop, never
    # committed). Every job attaches its own assets to the release and
    # attests them (the signed by GitHub provenance the release machinery
    # carries family wide).
    name: desktop ${{ matrix.app }} ${{ matrix.platform }}
    if: github.event_name != 'push'
    concurrency:
      group: family-desktop-${{ github.event_name }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      # the artifact attestation the lane owns — the release attachment
      # rides the owner pat the attach step carries (the 2.0.184 scorecard
      # closure), so the github token answers read alone beside it.
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # the application axis: a published release walks the nine member
        # applications (the os rides the publish lane and never duplicates
        # itself here), a manual dispatch walks the one chosen application
        app: ${{ github.event_name == 'release' && fromJSON('["argan","cadria","debonair","forge","foundry","getry","saddle","stealthhead","vault"]') || fromJSON(format('["{0}"]', inputs.app)) }}
        platform: [linux-x64, linux-arm64, windows-x86, windows-x64, windows-arm64, macos-x64, macos-arm64]
        include:
          - { platform: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "deb,rpm,appimage", architecture: x64 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bundles: "deb,rpm,appimage", architecture: arm64 }
          - { platform: windows-x86, os: windows-2025, target: i686-pc-windows-msvc, bundles: "nsis,msi", architecture: x86 }
          - { platform: windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc, bundles: "nsis,msi", architecture: x64 }
          - { platform: windows-arm64, os: windows-2025, target: aarch64-pc-windows-msvc, bundles: "nsis,msi", architecture: arm64 }
          - { platform: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin, bundles: "app,dmg", architecture: x64 }
          - { platform: macos-arm64, os: macos-14, target: aarch64-apple-darwin, bundles: "app,dmg", architecture: arm64 }
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: resolve the application version
        id: appversion
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./${{ matrix.app }}/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Set up Bun
        if: ${{ matrix.app == 'devthink' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Set up pnpm
        if: ${{ matrix.app != 'devthink' && matrix.app != 'saddle' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: install linux webkit dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf rpm
      - name: install the dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.app }}" in
            devthink) cd "$APP" && bun install --frozen-lockfile --ignore-scripts ;;
            saddle) npm --prefix "$APP" ci --ignore-scripts ;;
            *) pnpm --dir "$APP" install --no-frozen-lockfile --ignore-scripts ;;
          esac
      - name: build and stage the web surface
        # the build answers straight at the application root: the staging
        # copies the entry and the hashed bundles into build/web, the folder
        # the tauri scaffold aims its frontendDist at (the runner-side
        # toolchain area, never committed).
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP"
          case "${{ matrix.app }}" in
            devthink) npm run build:web ;;
            saddle) npm run web:build:pages ;;
            *) pnpm run build ;;
          esac
          test -f index.html
          mkdir -p build/web
          cp index.html build/web/
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp *.${kind} build/web/ 2>/dev/null || true
          done
          test -f build/web/index.html
      - name: install the rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: scaffold the desktop rust shell
        # the runner-side scaffold (the native wrapper doctrine): the cargo
        # manifest, the entry sources and the copied tauri config with
        # runner-relative paths live under build/native/desktop, three
        # levels below the application root.
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP"
          mkdir -p build/native/desktop
          cd build/native/desktop
          cat > Cargo.toml <<'CARGO_EOF'
          [package]
          name = "family-desktop-shell"
          version = "0.0.0"
          authors = ["wenathlan"]
          edition = "2021"
          license = "GPL-3.0-only"
          build = "build.rs"

          [lib]
          name = "family_desktop_shell"
          path = "lib.rs"
          crate-type = ["staticlib", "cdylib", "rlib"]

          [[bin]]
          name = "family-desktop-shell"
          path = "main.rs"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          CARGO_EOF
          cat > main.rs <<'MAIN_EOF'
          fn main() {
              family_desktop_shell::run()
          }
          MAIN_EOF
          cat > lib.rs <<'LIB_EOF'
          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("failed to run the family desktop shell")
          }
          LIB_EOF
          cat > build.rs <<'BUILD_EOF'
          fn main() {
              tauri_build::build()
          }
          BUILD_EOF
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("../../../tauri.conf.json", "utf8"));
            config.build.frontendDist = "../../../build/web";
            config.build.beforeDevCommand = "echo the runner builds the web surface through the staging lane";
            fs.writeFileSync("tauri.conf.json", `${JSON.stringify(config, null, 2)}\n`);
            console.log("copied the tracked tauri.conf.json into the scaffold with runner-relative paths");
          '
      - name: stamp the scaffold version
        shell: bash
        env:
          APP_VERSION: ${{ steps.appversion.outputs.version }}
        run: |
          set -euo pipefail
          cd "$APP"
          # shellcheck disable=SC2016
          node -e 'const fs=require("node:fs"); const version=process.env.APP_VERSION; const config=JSON.parse(fs.readFileSync("build/native/desktop/tauri.conf.json","utf8")); config.version=version; fs.writeFileSync("build/native/desktop/tauri.conf.json", `${JSON.stringify(config, null, 2)}\n`); const cargo=fs.readFileSync("build/native/desktop/Cargo.toml","utf8").replace(/^version = ".*"$/m, `version = "${version}"`); fs.writeFileSync("build/native/desktop/Cargo.toml", cargo);'
      - name: generate platform icons
        shell: bash
        run: cd "$APP" && npx --yes @tauri-apps/cli@2.11.4 icon icon.svg --output build/native/desktop/icons
      - name: configure desktop signing status
        # the caller-owned certificate when the platform secrets exist, the
        # unsigned path (skipped sign and notarize steps) otherwise - the
        # manifest records which.
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "${WINDOWS_CERTIFICATE_BASE64:-}" ] && [ -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "FAMILY_SIGNING=caller-owned" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "FAMILY_SIGNING=caller-owned" >> "$GITHUB_ENV"
          else
            echo "FAMILY_SIGNING=unsigned" >> "$GITHUB_ENV"
          fi
      - name: configure macos signing keychain
        if: runner.os == 'macOS' && env.FAMILY_SIGNING == 'caller-owned'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/family-desktop.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/family-desktop.p12"
          security import "$RUNNER_TEMP/family-desktop.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          echo "APPLE_SIGNING_IDENTITY_EXPORTED=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: build desktop bundles
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP/build/native/desktop"
          if [ "${FAMILY_SIGNING}" = "caller-owned" ]; then
            npx --yes @tauri-apps/cli@2.11.4 build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          else
            npx --yes @tauri-apps/cli@2.11.4 build --ci --no-sign --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          fi
      - name: sign windows installers
        if: runner.os == 'Windows' && env.FAMILY_SIGNING == 'caller-owned'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\family-code-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          Get-ChildItem "$env:APP\build\native\desktop\target\${{ matrix.target }}\release\bundle" -Recurse -Include *.exe,*.msi | ForEach-Object {
            signtool sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /f "$env:RUNNER_TEMP\family-code-signing.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
            signtool verify /pa /all $_.FullName
          }
      - name: notarize macos installers
        if: runner.os == 'macOS' && env.FAMILY_SIGNING == 'caller-owned'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for dmg in "$APP"/build/native/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
          done
      - name: collect desktop artifacts
        shell: bash
        env:
          APP_VERSION: ${{ steps.appversion.outputs.version }}
        run: |
          set -euo pipefail
          cd "$APP"
          version="${APP_VERSION}"
          mkdir -p build/release-assets/desktop
          collected=0
          while IFS= read -r -d '' bundle; do
            [ -f "$bundle" ] || continue
            case "$bundle" in
              *.deb|*.rpm|*.AppImage|*.exe|*.msi|*.dmg)
                ext="${bundle##*.}"
                [ "$ext" = "AppImage" ] && ext="appimage"
                asset="${{ matrix.app }}.desktop.${version}.${{ matrix.platform }}.${ext}"
                cp "$bundle" "build/release-assets/desktop/${asset}"
                collected=$((collected + 1))
                ;;
              *.app)
                asset="${{ matrix.app }}.desktop.${version}.${{ matrix.platform }}.app.zip"
                ditto -c -k --sequesterRsrc --keepParent "$bundle" "build/release-assets/desktop/${asset}"
                collected=$((collected + 1))
                ;;
            esac
          done < <(find "build/native/desktop/target/${{ matrix.target }}/release/bundle" -print0 2>/dev/null)
          test "$collected" -gt 0
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum build/release-assets/desktop/* | sed 's#build/release-assets/desktop/##' > "build/release-assets/desktop/${{ matrix.app }}.sha256.desktop.${{ matrix.platform }}.${version}"
          else
            shasum -a 256 build/release-assets/desktop/* | sed 's#build/release-assets/desktop/##' > "build/release-assets/desktop/${{ matrix.app }}.sha256.desktop.${{ matrix.platform }}.${version}"
          fi
          printf '{\n  "version": "%s",\n  "application": "%s",\n  "platform": "desktop-tauri",\n  "target": "%s",\n  "bundles": "%s",\n  "signing": "%s",\n  "notarization": "%s"\n}\n' "$version" "${{ matrix.app }}" "${{ matrix.target }}" "${{ matrix.bundles }}" "${FAMILY_SIGNING:-unsigned}" "${FAMILY_NOTARIZATION:-none}" > "build/release-assets/desktop/${{ matrix.app }}.manifest.desktop.${{ matrix.platform }}.${version}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}.desktop.${{ matrix.platform }}.${{ steps.appversion.outputs.version }}
          path: ${{ matrix.app }}/build/release-assets/desktop
          if-no-files-found: error
      - name: attach desktop assets to the release
        # the doctrine the owner pinned: every member application ships its
        # desktop lanes on the release the os ships (the capacitor, the
        # installers, the checksums - the same rights, only the iso stays
        # os exclusive), and the lane attaches its own assets the moment it
        # builds them (--clobber keeps a re-run idempotent over its own
        # names, which carry the application prefix and never collide with
        # another lane's grammar)
        if: github.event_name == 'release'
        env:
          # least-privilege (the 2.0.184 scorecard closure): the asset
          # upload rides the owner pat — the github token standing in when
          # the secret does not — so the job answers read alone above.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.app }}/build/release-assets/desktop/*" --clobber
      - name: attest the desktop assets
        # the signed by GitHub provenance the release machinery carries
        # family wide: every artifact this lane ships answers the workflow
        # identity the same way the os release assets answer it
        if: github.event_name == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.app }}/build/release-assets/desktop/*
          show-snippet: false

  android:
    # The universal mobile artifact lane of the family (the owner doctrine: one
    # theme per application, and every application answers android and ios from
    # the same workflow). The matrix carries every vite application with the
    # package manager its manifest pins; the identity (appId, appName) is read
    # from the capacitor.config.ts the application tracks, never hardcoded; the
    # vite build answers straight at the application root; the runner stages the
    # delivered surface under build/web and aims the tracked capacitor config at
    # it on the runner only; and the native shells stay runner-side toolchain
    # output (materialized under <app>/android and <app>/ios on the runner,
    # never committed). The android leg signs with the caller-owned keystore
    # when the production secrets exist and with the clearly labeled ci-test-key
    # on automatic events; the ios leg only runs when the FAMILY_IOS_ENABLED
    # repository variable is true or the dispatch carries build_ios.
    name: android ${{ matrix.app }}
    if: github.event_name != 'push'
    concurrency:
      group: family-mobile
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # the artifact attestation the lane owns — the release attachment
      # rides the owner pat the attach step carries (the 2.0.184 scorecard
      # closure), so the github token answers read alone beside it.
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # the application axis answers the event: a published release walks
        # the nine member applications (the os rides its own publish lane
        # and never duplicates itself here), every other firing walks the
        # full matrix the lane always served, devthink included
        include: ${{ github.event_name == 'release' && fromJson('[{"app":"argan","pm":"pnpm"},{"app":"cadria","pm":"pnpm"},{"app":"debonair","pm":"pnpm"},{"app":"forge","pm":"pnpm"},{"app":"foundry","pm":"pnpm"},{"app":"getry","pm":"pnpm"},{"app":"saddle","pm":"npm"},{"app":"stealthhead","pm":"pnpm"},{"app":"vault","pm":"pnpm"}]') || fromJson('[{"app":"devthink","pm":"bun"},{"app":"argan","pm":"pnpm"},{"app":"cadria","pm":"pnpm"},{"app":"debonair","pm":"pnpm"},{"app":"forge","pm":"pnpm"},{"app":"foundry","pm":"pnpm"},{"app":"getry","pm":"pnpm"},{"app":"saddle","pm":"npm"},{"app":"stealthhead","pm":"pnpm"},{"app":"vault","pm":"pnpm"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: resolve the application version
        # every application carries its own version: the artifacts stamp the
        # version the application manifest declares, never a foreign tag
        id: appversion
        run: |
          set -euo pipefail
          version="$(node -p "require('./${{ matrix.app }}/package.json').version")"
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          {
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Set up Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Set up pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # the explicit platform-tools package: the action default answers
          # the retired `tools` package that the sdk no longer carries.
          packages: platform-tools
      - name: accept the android sdk licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: install android sdk packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: install the dependencies (bun leg)
        if: matrix.pm == 'bun'
        run: cd "${{ matrix.app }}" && bun install --frozen-lockfile --ignore-scripts
      - name: install the dependencies (pnpm leg)
        if: matrix.pm == 'pnpm'
        run: pnpm --dir "${{ matrix.app }}" install --no-frozen-lockfile --ignore-scripts
      - name: install the dependencies (npm leg)
        if: matrix.pm == 'npm'
        run: npm --prefix "${{ matrix.app }}" ci --ignore-scripts
      - name: build the web surface (bun leg)
        if: matrix.pm == 'bun'
        run: cd "${{ matrix.app }}" && npm run build:web
      - name: build the web surface (pnpm leg)
        if: matrix.pm == 'pnpm'
        run: pnpm --dir "${{ matrix.app }}" run build
      - name: build the web surface (npm leg)
        if: matrix.pm == 'npm'
        run: npm --prefix "${{ matrix.app }}" run web:build:pages
      - name: stage the web surface and aim the capacitor config
        # the build answers straight at the application root: the staging
        # copies the entry and the hashed bundles into build/web, and the
        # tracked capacitor.config.ts aims its webDir at that staging on the
        # runner (the cli prefers the ts source; the tracked file never
        # carries the runner path once the release commit is cut).
        run: |
          set -euo pipefail
          cd "${{ matrix.app }}"
          mkdir -p build/web
          cp index.html build/web/
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp *.${kind} build/web/ 2>/dev/null || true
          done
          test -f build/web/index.html
          node -e 'const fs=require("node:fs");const file="capacitor.config.ts";const source=fs.readFileSync(file,"utf8");const rewritten=source.replace(/webDir:\s*"[^"]*"/,`webDir: "build/web"`);if(rewritten===source)throw new Error("the capacitor config carries no webDir to aim");fs.writeFileSync(file,rewritten);'
      - name: generate and synchronize the android wrapper
        # the wrapper patch the publish android lane healed rides the family
        # leg too (the one law both lanes walk): the stock template wrapper
        # carries the 10s default network timeout that reddened the lane on
        # a slow services.gradle.org answer, the 8.6 template seats
        # networkTimeout=10000 itself (so the patch replaces whatever
        # default rode the wrapper, appending only when the line never
        # rode it), and the -all to -bin swap rides the version-agnostic
        # suffix the plain-dot patterns answer before any gradlew walk.
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          wrapper="android/gradle/wrapper/gradle-wrapper.properties"
          test -f "$wrapper"
          sed -i 's#-all\.zip#-bin.zip#' "$wrapper"
          if grep -q '^networkTimeout=' "$wrapper"; then
            sed -i 's#^networkTimeout=.*#networkTimeout=180000#' "$wrapper"
          else
            printf 'networkTimeout=180000\n' >> "$wrapper"
          fi
          grep -q 'distributionUrl=.*bin\.zip' "$wrapper"
          grep -q '^networkTimeout=180000$' "$wrapper"
      - name: generate Android icons
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2.11.4 icon icon.svg --output build/generated-icons
          resroot=android/app/src/main/res
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "build/generated-icons/android/mipmap-${density}/ic_launcher.png" "$resroot/mipmap-${density}/ic_launcher.png"
            cp "build/generated-icons/android/mipmap-${density}/ic_launcher_foreground.png" "$resroot/mipmap-${density}/ic_launcher_foreground.png"
            cp "build/generated-icons/android/mipmap-${density}/ic_launcher_round.png" "$resroot/mipmap-${density}/ic_launcher_round.png"
          done
      - name: stamp generated android release config
        # the generated @capacitor/android template carries versionCode 1 /
        # versionName "1.0", no signing configuration and no shrinking; the
        # runner stamps the release identity, the keystore.properties loader
        # (written by the signing step below), the r8/resource-shrinking
        # release buildType and the abi splits block (the asset parity
        # expansion: one standalone apk per abi beside the universal build -
        # armeabi-v7a, arm64-v8a, x86, x86_64 - the legacy splits dsl answers
        # fully installable apks, never the bundletool split artifacts that
        # need a base) into the generated wrapper beside the config — the
        # same release contract the saddle recipe carries.
        shell: bash
        env:
          APP_VERSION: ${{ steps.appversion.outputs.version }}
          APP_VERSION_CODE: ${{ steps.appversion.outputs.version_code }}
        run: |
          set -euo pipefail
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const file = "${{ matrix.app }}/android/app/build.gradle";
            let gradle = fs.readFileSync(file, "utf8");
            const version = process.env.APP_VERSION;
            const versioncode = process.env.APP_VERSION_CODE;
            if (!version || !versioncode) {
              throw new Error("APP_VERSION and APP_VERSION_CODE must be exported before stamping");
            }
            const plainrelease = [
              "    buildTypes {",
              "        release {",
              "            minifyEnabled false",
              "            proguardFiles getDefaultProguardFile(\x27proguard-android.txt\x27), \x27proguard-rules.pro\x27",
              "        }",
              "    }"
            ].join("\n");
            if (!gradle.includes("versionCode 1") || !gradle.includes(`versionName "1.0"`) || !gradle.includes(plainrelease)) {
              throw new Error(`generated android template drifted: the defaultConfig/release blocks were not found in ${file}`);
            }
            gradle = gradle.replace("versionCode 1", `versionCode ${versioncode}`);
            gradle = gradle.replace(`versionName "1.0"`, `versionName "${version}"`);
            const stampedrelease = [
              "    signingConfigs {",
              "        if (keystorePropertiesFile.exists()) {",
              "            release {",
              "                keyAlias keystoreProperties[\x27keyAlias\x27]",
              "                keyPassword keystoreProperties[\x27keyPassword\x27]",
              "                storeFile file(keystoreProperties[\x27storeFile\x27])",
              "                storePassword keystoreProperties[\x27storePassword\x27]",
              "            }",
              "        }",
              "    }",
              "",
              "    buildTypes {",
              "        release {",
              "            minifyEnabled true",
              "            shrinkResources true",
              "            proguardFiles getDefaultProguardFile(\x27proguard-android-optimize.txt\x27), \x27proguard-rules.pro\x27",
              "            if (keystorePropertiesFile.exists()) {",
              "                signingConfig signingConfigs.release",
              "            }",
              "        }",
              "    }"
            ].join("\n");
            const splitrelease = [
              "    splits {",
              "        abi {",
              // the bundle collision law (issuetracker.google.com/402800800,
              // the same seat the publish android lane carries): a bundle
              // task never rides the same invocation as the abi splits -
              // the shrunk-resources stage answers one file per split and
              // buildReleasePreBundle refuses the many - so the splits
              // answer the assemble invocations alone and the bundle lane
              // runs its own invocation with the splits asleep (the
              // per-abi apks, the universal apk and the aab all ship)
              "            enable gradle.startParameter.taskNames.any { it.toLowerCase().contains(\x27assemble\x27) } && !gradle.startParameter.taskNames.any { it.toLowerCase().contains(\x27bundle\x27) }",
              "            reset()",
              "            include \x27armeabi-v7a\x27, \x27arm64-v8a\x27, \x27x86\x27, \x27x86_64\x27",
              "            universalApk true",
              "        }",
              "    }",
              "",
              ""
            ].join("\n");
            gradle = gradle.replace(plainrelease, splitrelease + stampedrelease);
            const keystoreloader = [
              "apply plugin: \x27com.android.application\x27",
              "",
              "import java.io.FileInputStream",
              "import java.util.Properties",
              "",
              "def keystorePropertiesFile = rootProject.file(\x27keystore.properties\x27)",
              "def keystoreProperties = new Properties()",
              "if (keystorePropertiesFile.exists()) {",
              "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))",
              "}"
            ].join("\n");
            gradle = gradle.replace("apply plugin: \x27com.android.application\x27", keystoreloader);
            if (!gradle.includes(`versionCode ${versioncode}`) || !gradle.includes(`versionName "${version}"`) || !gradle.includes("signingConfig signingConfigs.release") || !gradle.includes("universalApk true")) {
              throw new Error("the stamp did not land");
            }
            fs.writeFileSync(file, gradle);
            console.log(`stamped ${file}: versionName ${version}, versionCode ${versioncode}, the signed optimized release block`);
          '
      - name: configure android signing
        # the signing three-way: the caller-owned keystore when the
        # production secrets exist; the clearly labeled ci-test-key when a
        # release (or a manual build that allows it) fires without them; a
        # hard fail otherwise. the manifest records which path answered.
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          production_ready=false
          if [ -n "${ANDROID_KEY_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_STORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            production_ready=true
          fi
          if [ "$production_ready" = true ]; then
            printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/app-upload.jks"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/app-upload.jks"
              printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > "${{ matrix.app }}/android/keystore.properties"
            echo "FAMILY_SIGNING=caller-owned" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.allow_test_signing }}" = "true" ]; then
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/family-test.jks" -storepass changeit -keypass changeit -alias family-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Family CI Test,O=DevThink Family,C=US"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/family-test.jks"
              printf 'storePassword=changeit\n'
              printf 'keyAlias=family-test\n'
              printf 'keyPassword=changeit\n'
            } > "${{ matrix.app }}/android/keystore.properties"
            echo "FAMILY_SIGNING=ci-test-key" >> "$GITHUB_ENV"
          else
            echo "Manual Android builds require production signing secrets or allow_test_signing=true."
            exit 1
          fi
      - name: build optimized android release
        working-directory: ${{ matrix.app }}/android
        # the bundle collision law (issuetracker.google.com/402800800):
        # the splits answer the assemble invocation alone and the bundle
        # lane walks its own invocation with the splits asleep - the same
        # two-invocation seat the publish android lane carries, so the
        # shrunk-resources stage never answers the plural directory the
        # combined invocation died on (the per-abi apks, the universal
        # apk and the aab all ship).
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          ./gradlew --no-daemon --stacktrace bundleRelease
      - name: collect android artifacts
        shell: bash
        env:
          APP_VERSION: ${{ steps.appversion.outputs.version }}
        run: |
          set -euo pipefail
          cd "${{ matrix.app }}"
          version="${APP_VERSION}"
          mkdir -p build/mobile/android
          apk="${{ matrix.app }}.android.${version}.apk"
          aab="${{ matrix.app }}.android.${version}.aab"
          aab_source="$(find android/app/build/outputs/bundle/release -type f \( -name 'android-release*.aab' -o -name 'app-release*.aab' \) -print -quit)"
          test -n "$aab_source"
          cp "$aab_source" "build/mobile/android/${aab}"
          # the abi split collect (the asset parity expansion): every apk the
          # splits dsl emitted lands under its public name - the universal
          # build keeps the plain apk name the lane always shipped, and every
          # abi answers beside it with dots only (the public naming carries
          # no underscore, so x86_64 ships as x64).
          collected=0
          while IFS= read -r -d '' apk_source; do
            [ -f "$apk_source" ] || continue
            base="$(basename "$apk_source")"
            case "$base" in
              *armeabi-v7a*) out="${{ matrix.app }}.android.${version}.armeabi.v7a.apk" ;;
              *arm64-v8a*) out="${{ matrix.app }}.android.${version}.arm64.v8a.apk" ;;
              *x86_64*) out="${{ matrix.app }}.android.${version}.x64.apk" ;;
              *x86*) out="${{ matrix.app }}.android.${version}.x86.apk" ;;
              *) out="${{ matrix.app }}.android.${version}.apk" ;;
            esac
            cp "$apk_source" "build/mobile/android/${out}"
            collected=$((collected + 1))
          done < <(find android/app/build/outputs/apk/release -type f -name '*.apk' -print0 | sort -z)
          test "$collected" -ge 5
          test -f "build/mobile/android/${{ matrix.app }}.android.${version}.apk"
          test -f "build/mobile/android/${{ matrix.app }}.android.${version}.armeabi.v7a.apk"
          test -f "build/mobile/android/${{ matrix.app }}.android.${version}.arm64.v8a.apk"
          test -f "build/mobile/android/${{ matrix.app }}.android.${version}.x86.apk"
          test -f "build/mobile/android/${{ matrix.app }}.android.${version}.x64.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x -print 2>/dev/null | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          for apk_path in build/mobile/android/*.apk; do
            "$apksigner_path" verify --verbose "$apk_path"
          done
          jarsigner -verify -verbose -certs "build/mobile/android/${aab}" >/dev/null
          sha256sum build/mobile/android/*.apk "build/mobile/android/${aab}" | sed 's#build/mobile/android/##' > "build/mobile/android/${{ matrix.app }}.sha256.android.${version}"
          printf '{\n  "version": "%s",\n  "platform": "android",\n  "signing": "%s",\n  "optimization": "r8-and-resource-shrinking",\n  "appId": "%s",\n  "files": ["%s", "%s.android.%s.armeabi.v7a.apk", "%s.android.%s.arm64.v8a.apk", "%s.android.%s.x86.apk", "%s.android.%s.x64.apk", "%s"]\n}\n' "$version" "${FAMILY_SIGNING:-unknown}" "$(node -p "JSON.parse(require('node:fs').readFileSync('./capacitor.config.json','utf8')).appId")" "$apk" "${{ matrix.app }}" "$version" "${{ matrix.app }}" "$version" "${{ matrix.app }}" "$version" "${{ matrix.app }}" "$version" "$aab" > "build/mobile/android/${{ matrix.app }}.manifest.android.${version}.json"
      - name: validate public asset names
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.app }}"
          find build/mobile/android -type f | while IFS= read -r asset; do
            base="$(basename "$asset")"
            case "$base" in
              *_*) echo "The asset ${base} carries an underscore; the public naming carries none." >&2; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}.android.${{ steps.appversion.outputs.version }}
          path: ${{ matrix.app }}/build/mobile/android
          if-no-files-found: error
      - name: attach android assets to the release
        # the doctrine the owner pinned: every member application ships its
        # mobile lanes on the release the os ships (the capacitor apk and
        # aab, the checksums and the manifest - the same rights), and the
        # lane attaches its own assets the moment it builds them (--clobber
        # keeps a re-run idempotent over its own names, which carry the
        # application prefix and never collide with another lane's grammar)
        if: github.event_name == 'release'
        env:
          # least-privilege (the 2.0.184 scorecard closure): the asset
          # upload rides the owner pat — the github token standing in when
          # the secret does not — so the job answers read alone above.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.app }}/build/mobile/android/*" --clobber
      - name: attest the android assets
        # the signed by GitHub provenance the release machinery carries
        # family wide: every artifact this lane ships answers the workflow
        # identity the same way the os release assets answer it
        if: github.event_name == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.app }}/build/mobile/android/*
          show-snippet: false

  ios:
    name: ios ipa ${{ matrix.app }}
    # the signed ios leg: the real ipa archive with the caller's Apple
    # distribution certificate and provisioning profile. the lane only runs
    # on explicit dispatch (build_ios: true) or the FAMILY_IOS_ENABLED
    # repository variable - the provisioning profile binds the bundle id
    # every application carries, so the secrets stay shared and the choice
    # stays explicit.
    if: ${{ github.event_name != 'push' && ((github.event_name == 'workflow_dispatch' && inputs.build_ios == true) || vars.FAMILY_IOS_ENABLED == 'true') }}
    concurrency:
      group: family-mobile
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      # the artifact attestation the lane owns — the release attachment
      # rides the owner pat the attach step carries (the 2.0.184 scorecard
      # closure), so the github token answers read alone beside it.
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: devthink, pm: bun }
          - { app: argan, pm: pnpm }
          - { app: cadria, pm: pnpm }
          - { app: debonair, pm: pnpm }
          - { app: forge, pm: pnpm }
          - { app: foundry, pm: pnpm }
          - { app: getry, pm: pnpm }
          - { app: saddle, pm: npm }
          - { app: stealthhead, pm: pnpm }
          - { app: vault, pm: pnpm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: resolve the application version
        id: appversion
        run: |
          set -euo pipefail
          version="$(node -p "require('./${{ matrix.app }}/package.json').version")"
          version_code="$(node -p "require('./${{ matrix.app }}/package.json').version.split('.').reduce((code, part) => code * 1000 + Number(part), 0)")"
          {
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Set up Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Set up pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: install the dependencies (bun leg)
        if: matrix.pm == 'bun'
        run: cd "${{ matrix.app }}" && bun install --frozen-lockfile --ignore-scripts
      - name: install the dependencies (pnpm leg)
        if: matrix.pm == 'pnpm'
        run: pnpm --dir "${{ matrix.app }}" install --no-frozen-lockfile --ignore-scripts
      - name: install the dependencies (npm leg)
        if: matrix.pm == 'npm'
        run: npm --prefix "${{ matrix.app }}" ci --ignore-scripts
      - name: build the web surface (bun leg)
        if: matrix.pm == 'bun'
        run: cd "${{ matrix.app }}" && npm run build:web
      - name: build the web surface (pnpm leg)
        if: matrix.pm == 'pnpm'
        run: pnpm --dir "${{ matrix.app }}" run build
      - name: build the web surface (npm leg)
        if: matrix.pm == 'npm'
        run: npm --prefix "${{ matrix.app }}" run web:build:pages
      - name: stage the web surface and aim the capacitor config
        run: |
          set -euo pipefail
          cd "${{ matrix.app }}"
          mkdir -p build/web
          cp index.html build/web/
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp *.${kind} build/web/ 2>/dev/null || true
          done
          test -f build/web/index.html
          node -e 'const fs=require("node:fs");const file="capacitor.config.ts";const source=fs.readFileSync(file,"utf8");const rewritten=source.replace(/webDir:\s*"[^"]*"/,`webDir: "build/web"`);if(rewritten===source)throw new Error("the capacitor config carries no webDir to aim");fs.writeFileSync(file,rewritten);'
      - name: generate and synchronize the ios wrapper
        working-directory: ${{ matrix.app }}
        run: |
          set -euo pipefail
          npx cap add ios
          npx cap sync ios
      - name: configure Apple signing
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          for value in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD IOS_PROVISIONING_PROFILE_NAME; do
            test -n "${!value:-}" || { echo "$value is required when iOS packaging is enabled."; exit 1; }
          done
          keychain="$RUNNER_TEMP/family-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/family-distribution.p12"
          security import "$RUNNER_TEMP/family-distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROVISIONING_PROFILE_NAME}.mobileprovision"
      - name: configure ios export options
        env:
          IOS_EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_EXPORT_OPTIONS_BASE64:-}" ]; then
            echo "IOS_EXPORT_OPTIONS_BASE64 is required when iOS packaging is enabled."
            exit 1
          fi
          printf '%s' "$IOS_EXPORT_OPTIONS_BASE64" | base64 --decode > "$RUNNER_TEMP/FamilyExportOptions.plist"
      - name: archive ios app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "${{ matrix.app }}/ios/App/App.xcodeproj" -scheme App -configuration Release -archivePath "$RUNNER_TEMP/app.xcarchive" archive MARKETING_VERSION="${{ steps.appversion.outputs.version }}" CURRENT_PROJECT_VERSION="${{ steps.appversion.outputs.version_code }}"
      - name: export ipa
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/FamilyExportOptions.plist" -exportPath "$RUNNER_TEMP/FamilyExport"
      - name: collect ios artifacts
        shell: bash
        env:
          APP_VERSION: ${{ steps.appversion.outputs.version }}
        run: |
          set -euo pipefail
          cd "${{ matrix.app }}"
          version="${APP_VERSION}"
          mkdir -p build/mobile/ipa
          ipa="$(find "$RUNNER_TEMP/FamilyExport" -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          cp "$ipa" "build/mobile/ipa/${{ matrix.app }}.ios.${version}.ipa"
          app="$(find "$RUNNER_TEMP/app.xcarchive/Products/Applications" -type d -name '*.app' -print -quit)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/mobile/ipa/${{ matrix.app }}.ios.${version}.app.zip"
          shasum -a 256 "build/mobile/ipa/${{ matrix.app }}.ios.${version}.ipa" "build/mobile/ipa/${{ matrix.app }}.ios.${version}.app.zip" | sed 's#build/mobile/ipa/##' > "build/mobile/ipa/${{ matrix.app }}.sha256.iosipa.${version}"
          printf '{\n  "version": "%s",\n  "platform": "ios",\n  "signing": "caller-configured",\n  "appId": "%s",\n  "files": ["%s.ios.%s.ipa", "%s.ios.%s.app.zip"]\n}\n' "$version" "$(node -p "JSON.parse(require('node:fs').readFileSync('./capacitor.config.json','utf8')).appId")" "${{ matrix.app }}" "$version" "${{ matrix.app }}" "$version" > "build/mobile/ipa/${{ matrix.app }}.manifest.iosipa.${version}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}.iosipa.${{ steps.appversion.outputs.version }}
          path: ${{ matrix.app }}/build/mobile/ipa
          if-no-files-found: error
      - name: attach ios assets to the release
        if: github.event_name == 'release'
        env:
          # least-privilege (the 2.0.184 scorecard closure): the asset
          # upload rides the owner pat — the github token standing in when
          # the secret does not — so the job answers read alone above.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.app }}/build/mobile/ipa/*" --clobber
      - name: attest the ios assets
        # the signed by GitHub provenance beside the ipa lane the same way
        # the android lane carries it
        if: github.event_name == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.app }}/build/mobile/ipa/*
          show-snippet: false

  webpackseats:
    # the webpack distribution workflow of the house — the owner doctrine the
    # corridor clarified and the fusion order the latest breath sealed: the
    # webpack the platform speaks is THE WORKFLOW THAT CREATES THE WEBPACK
    # DISTRIBUTION (the github actions seat, never a file naming flavor),
    # the reason every application envelope carries the webpack and
    # webpack-cli dependencies beside the esbuild carrier the transpile
    # rides. the wave bundles every one of the eleven applications through
    # the webpack CLI into the single-file distribution seat (the esbuild
    # carrier walks the typescript sources to the plain script the webpack
    # CLI bundles, the packages staying external the way the envelope
    # dependency blocks already answer) and attaches the bundle beside its
    # checksum to the release — the visible distribution the owner law
    # names. the registry publication of that bundle rides the ORIGINAL
    # packages alone: the publish workflow's family lanes embed the
    # <app>.webpack.cjs seat inside the normal envelopes they already ship
    # (the @wenathlan/<app> npm envelope carrying the bundle in its files,
    # the com.wenathlan.<app> maven artifact the normal name — forge,
    # cadria and the eleven — carrying the webpack classifier, the gradle
    # module, the nuget package and the rubygem the same embed), so the
    # variant seats the older wave published under the .webpack names —
    # @wenathlan/<app>.webpack, com.wenathlan.<app>.webpack, the
    # <app>.webpack nuget and gem flavors — are dead by the owner order
    # (canceled, excluded from every registry, the feature embedded in the
    # original that never carried the webpack trace in the name). the asset
    # grammar rides the dotted law (<app>.webpack.<version>.cjs and the
    # sha256 twin) and never an underscore, the asset lane stays outside the
    # release-approval gate the registry lanes answer, and the bundle
    # compiles once per rung for every consumer the fusion seats.
    name: webpack ${{ matrix.package }}
    if: github.event_name != 'push'
    concurrency:
      group: devthink-webpack-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    # the bundle lane: every application walks the esbuild carrier (the
    # typescript sources to the plain commonjs script, the packages
    # external the way the envelope dependency blocks already answer)
    # and the webpack CLI bundles the carrier into the single-file
    # distribution seat — the one build the release carries and the
    # publish workflow's family lanes consume (the embed the fusion law
    # seats: the original envelopes re-run the same carrier when they
    # pack their own bundle seat, the variant registry lanes the older
    # wave owned are dead by the owner order).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # least-privilege (the 2.0.184 scorecard closure): the bundle attach
    # below rides the owner pat, so the github token answers read alone.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # the eleven applications the webpack law covers — the envelope
        # beside the ten siblings, the canonical alphabetical pass order.
        package: [argan, cadria, cobaia, debonair, devthink, forge, foundry, getry, saddle, stealthhead, vault]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: bundle the webpack distribution seat
        # the carrier law the corridor clarified: the webpack CLI and the
        # webpack dependencies the envelopes carry exist FOR this seat —
        # the esbuild carrier transpiles the typescript entry (the cli
        # logic every application root owns) to the esm script with the
        # packages external (the top level await the saddle scripts carry
        # and the import.meta the entries read answer through the esm
        # form) and the webpack CLI bundles it through the generated
        # config into the single-file distribution (the config the seat
        # generates answers the variadic target flag the webpack cli
        # grammar cannot carry on the command line, the externals law
        # keeps every package a runtime require the envelope dependency
        # blocks already answer and the parser url switch keeps the
        # runtime file reads the devthink caps seat carries runtime reads
        # instead of build time assets), the node target under
        # production, the commonjs2 library riding the .cjs extension so
        # the bundle answers both the direct node run and the require of
        # the envelopes the registry lanes publish (the type:module
        # trees never break the commonjs seat).
        run: |
          set -euo pipefail
          PKG="${{ matrix.package }}"
          VERSION="${{ steps.release.outputs.version }}"
          cd "${PKG}"
          bun install --frozen-lockfile --ignore-scripts
          npx esbuild cli.ts --bundle --platform=node --format=esm --packages=external --outfile=webpacksrc.mjs
          cat > webpack.config.cjs <<CFG
          "use strict";
          const path = require("node:path");
          module.exports = {
            mode: "production",
            target: "node",
            entry: "./webpacksrc.mjs",
            output: {
              path: path.resolve(__dirname, "webpackdist"),
              filename: "${PKG}.webpack.cjs",
              library: { type: "commonjs2" }
            },
            externals: [
              function externallaw({ request }, callback) {
                if (request.startsWith(".") || request.startsWith("node:") || path.isAbsolute(request)) return callback();
                return callback(null, "commonjs " + request);
              }
            ],
            module: { parser: { javascript: { url: false } } },
            devtool: false
          };
          CFG
          npx webpack --config webpack.config.cjs
          test -s "webpackdist/${PKG}.webpack.cjs"
          mv "webpackdist/${PKG}.webpack.cjs" "../${PKG}.webpack.${VERSION}.cjs"
          cd ..
          rm -rf "${PKG}/webpackdist" "${PKG}/webpacksrc.mjs" "${PKG}/webpack.config.cjs"
          sha256sum "${PKG}.webpack.${VERSION}.cjs" > "${PKG}.sha256.webpack.${VERSION}"
          test -s "${PKG}.sha256.webpack.${VERSION}"
          # the family asset naming gate: no underscore ever rides a
          # published asset (the two names the seat attaches answer the
          # check, never the whole repository root).
          ! printf '%s\n' \
            "${PKG}.webpack.${VERSION}.cjs" \
            "${PKG}.sha256.webpack.${VERSION}" | grep -q "_"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-webpack-${{ matrix.package }}-${{ steps.release.outputs.version }}
          path: |
            ${{ matrix.package }}.webpack.${{ steps.release.outputs.version }}.cjs
            ${{ matrix.package }}.sha256.webpack.${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        # the release event path attaches the bundle beside its checksum
        # (the dispatch path answers the same attach once the tag rides
        # the input), and --clobber keeps the re-run idempotent over its
        # own names, which carry the application prefix and never
        # collide with another lane's grammar.
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          # least-privilege (the 2.0.184 scorecard closure): the asset
          # upload rides the owner pat — the github token standing in when
          # the secret does not — so the job answers read alone above.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.package }}.webpack.${VERSION}.cjs" \
            "${{ matrix.package }}.sha256.webpack.${VERSION}" --clobber


  build:
    # The universal interface deploy of the monorepo (the owner doctrine: one
    # theme per application, the sol folder serves web, OS, TV, mobile, desktop
    # and the extension — only the conversion workflow differs). This lane builds
    # every family theme and ships ONE GitHub Pages site where each application
    # answers under its own subpath: /devthink/, /argan/, /cadria/, /debonair/,
    # /forge/, /foundry/, /saddle/, /stealthhead/, /vault/, /getry/ and /cobaia/.
    # Every vite
    # theme installs from its committed lockfile through the package manager its
    # manifest pins (the matrix carries the manager per application) and builds
    # straight at the application root — the hashed bundles emit flat beside the
    # entry html, with no dist, no public and no assets folder — under the
    # VITE_BASE_PATH the subpath dictates. The staging copies the delivered web
    # surface (the entry, the fallback, the hashed bundles and the static web
    # files) out of the root by type. The devthink leg keeps the boot smoke and
    # the delivered html well-formedness lint: a bundle whose entry cannot serve
    # never reaches the Pages deploy.
    name: build ${{ matrix.app }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      # the Pages effective set the standalone file declared at the
      # workflow level (contents read beside the pages write and the
      # deploy id token) rides the job level the merger carries.
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: family-pages-${{ github.event_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # the family pages saddle ceiling heal (PR #646): the saddle npm ci the
    # old twenty-minute ceiling orphaned answers its real weight — the seat
    # walks twenty to sixty.
    timeout-minutes: 60
    env:
      # Pinned boot smoke port (inside the e2ugh family documented
      # 30000-59999 band).
      SMOKE_PORT: "39417"
    strategy:
      fail-fast: false
      matrix:
        # the canonical family pass order (the owner doctrine): the ten
        # applications first - devthink, argan, cadria, debonair, forge,
        # foundry, stealthhead, vault, getry, cobaia - and saddle always
        # last, the heaviest leg of the pass.
        include:
          - { app: devthink, pm: bun }
          - { app: argan, pm: pnpm }
          - { app: cadria, pm: pnpm }
          - { app: debonair, pm: pnpm }
          - { app: forge, pm: pnpm }
          - { app: foundry, pm: pnpm }
          - { app: stealthhead, pm: pnpm }
          - { app: vault, pm: pnpm }
          - { app: getry, pm: pnpm }
          - { app: cobaia, pm: pnpm }
          - { app: saddle, pm: npm }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node (pnpm leg)
        if: matrix.pm == 'pnpm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: "**/bun.lock"
      - name: Set up Node (npm leg)
        if: matrix.pm == 'npm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Set up Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          cache: false
      - name: Set up Bun for the owner installs
        # the dedup law rides the builds: the sibling sources re-export the
        # owner modules (argan/reveal.ts answers ../devthink/reveal.ts, and
        # the devthink owner imports react), so the per-app legs resolve
        # modules the app's own tree never carries. the owner installs ride
        # bun on every leg (every family app tracks a bun.lock), a ~5s
        # binary the pnpm and npm legs borrow for this step alone.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          cache: false
      - name: Install the owner dependencies of the cross-app imports
        # the owner geometry the checkout keeps: this step walks the app's
        # ROOT sources (the dedup re-exports and the vite config aliases —
        # the places a ../<app>/ specifier means the sibling beside the
        # app, never the intra-app relatives the sol tree carries) and
        # installs every owner's frozen lockfile beside the app, so the
        # vite builds resolve the owner sources' own imports (react of the
        # reveal owner, the labelstore owner's graph) exactly the way the
        # checkout does — the per-app legs installed only the app tree and
        # the owner sources died on the resolve (the dedup-wave regression
        # this step heals).
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          owners="$(grep -hoE '[\"'\'']\.\./[a-z]+/' "$app"/*.ts "$app"/*.tsx 2>/dev/null \
            | sort -u | sed 's|^[\"'\'']\.\./||; s|/$||' || true)"
          for owner in $owners; do
            if [ -f "$owner/bun.lock" ]; then
              echo "installing the $owner owner lockfile for the $app build"
              (cd "$owner" && bun install --frozen-lockfile --ignore-scripts)
            else
              echo "::warning::the $app build references $owner sources but $owner tracks no bun.lock"
            fi
          done
      - name: Install and build the theme (bun leg)
        if: matrix.pm == 'bun'
        # the application pins bun: the install reads the committed bun.lock
        # and the build answers straight at the application root (the entry
        # html and the hashed bundles beside the sources, no dist, no public).
        # VITE_DT_TARGET picks the intro variant of the ONE interface (the
        # owner doctrine: what changes per build target is the type of intro):
        # the public site plays the SaaS intro — the other targets stay
        # available for their own lanes: "installer" (Windows boot, straight
        # to the OS desktop), "android" (app bounce), "extension".
        env:
          VITE_DT_TARGET: "web"
          # VITE_DT_TARGET: "installer"
          # VITE_DT_TARGET: "android"
          # VITE_DT_TARGET: "extension"
        run: |
          set -euo pipefail
          cd devthink
          # the web lane never touches the native sqlite binding (the
          # owner-run control-plane tool that imports it lives outside the
          # browser surface): the scripts stay off so the frozen install
          # never rides the prebuild mirror or the broken bunx node-gyp
          # fallback — the leg had no setup-node, answered the runner's
          # default node and died red in the gyp configure.
          bun install --frozen-lockfile --ignore-scripts
          # a project Pages site lives under /<repo>/: the entry answers at the
          # site root and the absolute base keeps the hashed bundles resolvable
          # on every host without hardcoding the repository name
          VITE_BASE_PATH="/${{ github.event.repository.name }}/" bun run build:web
          test -f index.html
          test -n "$(ls *.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
      - name: Install and build the theme (pnpm leg)
        if: matrix.pm == 'pnpm'
        # the theme root is the application root: one package.json, the entry
        # html at the folder root, the build answering at the root beside the
        # engine logic the vite build reads.
        run: |
          set -euo pipefail
          pnpm --dir "${{ matrix.app }}" install --no-frozen-lockfile --ignore-scripts
          # the family theme answers under its own subpath of the project
          # pages site: the absolute base declares the mount to the vite
          # build and to the wouter router (a relative base leaves the
          # router baseless and every subroute falls to the 404 catch-all)
          VITE_BASE_PATH="/${{ github.event.repository.name }}/${{ matrix.app }}/" pnpm --dir "${{ matrix.app }}" run build
          test -f "${{ matrix.app }}/index.html"
          test -n "$(ls "${{ matrix.app }}"/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
      - name: Install and build the theme (npm leg)
        if: matrix.pm == 'npm'
        # the application pins npm: the install reads the committed
        # package-lock.json and the build answers straight at the root. the
        # scripts stay off the install the way every family lane keeps them
        # (the better-sqlite3 gyp lottery): no built surface of the pages
        # leg rides the native binding, so the frozen install never answers
        # the postinstall mirror or the gyp rebuild.
        run: |
          set -euo pipefail
          npm --prefix saddle ci --ignore-scripts
          # the same subpath declaration of the pnpm leg: the base declares
          # the mount the router serves under
          VITE_BASE_PATH="/${{ github.event.repository.name }}/saddle/" npm --prefix saddle run web:build:pages
          test -f saddle/index.html
          test -n "$(ls saddle/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
      - name: Prepare the SPA fallback page
        # the static host answers deep links with the delivered 404.html:
        # the build emits the entry alone at the application root, so the
        # fallback page rides beside it as the exact copy of the entry the
        # boot smoke and the html lint verify.
        if: matrix.app == 'devthink'
        run: |
          set -euo pipefail
          cp devthink/index.html devthink/404.html
      - name: Stage the theme under its subpath
        # the OS answers at the SITE ROOT (the visitor opens the platform
        # directly — no landing gate), so the devthink leg stages the entry,
        # the fallback and the hashed bundles straight at the staging root;
        # every other application answers under /<app>/ and the staging
        # copies the delivered web surface out of the root by type — the
        # sources and the toolchain files never reach the artifact. the
        # artifact already carries the folder so the assemble job merges
        # the ten trees by name.
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          if [ "${app}" = "devthink" ]; then
            # the site root of a project Pages host serves _site/ under the
            # repository URL: the entry answers at _site/ and its absolute
            # /<repo>/... asset URLs resolve to the same staging root
            mkdir -p staging
            cp "${app}/index.html" staging/
            cp "${app}/404.html" staging/ 2>/dev/null || true
            for kind in js css webmanifest xml txt svg icon png ico woff woff2 webp; do
              cp "${app}"/*."${kind}" staging/ 2>/dev/null || true
            done
            touch staging/.nojekyll
          else
            mkdir -p "staging/${app}"
            cp "${app}/index.html" "staging/${app}/"
            cp "${app}/404.html" "staging/${app}/" 2>/dev/null || true
            for kind in js css webmanifest xml txt svg icon png ico woff woff2 webp; do
              cp "${app}"/*."${kind}" "staging/${app}/" 2>/dev/null || true
            done
            # the static asset folder the theme references by relative path
            # (the folder rides beside the sources; only the applications that
            # carry one copy it)
            if [ -d "${app}/assets" ]; then
              cp -r "${app}/assets" "staging/${app}/assets"
            fi
            touch "staging/${app}/.nojekyll"
          fi
      - name: Boot smoke test (SPA entry and fallback page on a pinned port)
        if: matrix.app == 'devthink'
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          python3 -m http.server "${SMOKE_PORT}" --bind 127.0.0.1 > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 "http://127.0.0.1:${SMOKE_PORT}/" > entry.html 2>/dev/null; then
              healthy=1
              break
            fi
            echo "  waiting for the SPA entry (attempt ${attempt}/30)"
            sleep 1
          done
          if [ "${healthy}" -ne 1 ]; then
            echo '::error::The static workbench did not answer the SPA entry within 30 seconds. Boot log:'
            cat server.log
            exit 1
          fi
          grep -qF "<title>" entry.html
          echo "the SPA entry answered with content ($(wc -c < entry.html) bytes)"
          fallback_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${SMOKE_PORT}/404.html")"
          if [ "${fallback_code}" != "200" ]; then
            echo "::error::Expected HTTP 200 on the fallback page but received ${fallback_code}. Boot log:"
            cat server.log
            exit 1
          fi
          echo 'boot smoke passed: SPA entry 200 and fallback page 200'
      - name: Lint the delivered html pages (python html.parser well-formedness)
        if: matrix.app == 'devthink'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          import sys

          VOID = {
              'area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input',
              'link', 'meta', 'param', 'source', 'track', 'wbr',
          }

          class WellFormedChecker(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.stack = []
                  self.failures = []

              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append((tag, self.getpos()))

              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack:
                      self.failures.append(
                          f'{self.path}:{self.getpos()[0]}: closing </{tag}> with no open tag')
                      return
                  open_tag, open_pos = self.stack.pop()
                  if open_tag != tag:
                      self.failures.append(
                          f'{self.path}:{self.getpos()[0]}: </{tag}> closes <{open_tag}> '
                          f'opened at line {open_pos[0]}')

          pages = ['staging/index.html', 'staging/404.html']
          failures = []
          for page in pages:
              try:
                  with open(page, encoding='utf-8') as handle:
                      text = handle.read()
              except OSError as error:
                  failures.append(f'{page}: cannot read ({error})')
                  continue
              checker = WellFormedChecker(page)
              checker.feed(text)
              checker.close()
              for tag, pos in checker.stack:
                  failures.append(f'{page}:{pos[0]}: <{tag}> opened but never closed')
              failures.extend(checker.failures)
              if not any(f.startswith(page) for f in failures):
                  print(f'{page}: well-formed ({len(text)} bytes)')

          if failures:
              for failure in failures:
                  print(f'::error::{failure}')
              sys.exit(1)
          print('html lint passed for all delivered pages')
          PY
      - name: Upload the theme artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-${{ matrix.app }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Merge the ten themes into the one Pages site
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      # the Pages effective set the standalone file declared at the
      # workflow level (contents read beside the pages write and the
      # deploy id token) rides the job level the merger carries.
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: family-pages-${{ github.event_name }}
      cancel-in-progress: true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge every theme artifact under its subpath
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pages-*
          path: _site
          merge-multiple: true
      - name: Write the deep-link dispatcher
        # GitHub Pages answers every miss with the site-root 404 page. The
        # OS answers at the site root, so the dispatcher sorts the miss: a
        # family application walks to its own subpath, every other root
        # level path parks the deep route under sessionStorage and lands on
        # the OS root; the theme anchor replays the parked route once the
        # router mounts. The repository name rides the runtime context —
        # nothing about the host or the domain is hardcoded.
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cat > _site/404.html <<DISPATCHER_EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="robots" content="noindex" />
              <title>DevThink — opening</title>
            </head>
            <body>
              <script>
                (function () {
                  var repo = "${REPO_NAME}";
                  var parts = location.pathname.split("/").filter(Boolean);
                  if (parts[0] === repo) parts = parts.slice(1);
                  try {
                    if (parts.length > 0 && !/\.[a-z0-9]+$/i.test(parts[parts.length - 1])) {
                      sessionStorage.setItem("dt.deep.route", "/" + parts.join("/"));
                    }
                  } catch (storageUnavailable) {
                    /* the dispatcher still lands on the OS root */
                  }
                  location.replace("/" + repo + "/" + location.search);
                })();
              </script>
            </body>
          </html>
          DISPATCHER_EOF
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy the family Pages site
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      # the Pages effective set the standalone file declared at the
      # workflow level (contents read beside the pages write and the
      # deploy id token) rides the job level the merger carries.
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: family-pages-${{ github.event_name }}
      cancel-in-progress: true
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  devthink-desktop:
    # THE PLATFORM ARTIFACT LANES (the publish shed): the six platform
    # artifact jobs the publish workflow shed ride here renamed
    # devthink-* (their old ids collided with the family lanes above),
    # answering the release, workflow_run and dispatch firings exactly
    # the publish wave always answered them - the push firing of the
    # app folders the Pages deploy owns never reaches them.
    name: desktop ${{ matrix.name }}
    needs: release-resolve
    # the desktop lane of the merged repository wires to reality: the
    # merged product carries no tauri envelope (the retired lane gated on
    # desktop/Cargo.toml and desktop/tauri.conf.json, which the merge does
    # not carry - the dead gate never ran), and the desktop surface the
    # repository actually ships is the compiled workbench binary - "one
    # product, one binary, one metadata". the lane gates on the real
    # binary sources (build.ts + devthink.ts), compiles the full desktop
    # matrix through the same bun build --compile recipe the release lane
    # uses (cross compiled from the linux runner), stamps the checksums on
    # the runner and attaches the per-platform binaries to the release.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the matrix.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: bun-linux-x64
            extension: ""
            runnable: true
          - name: linux-arm64
            target: bun-linux-arm64
            extension: ""
            runnable: false
          - name: darwin-x64
            target: bun-darwin-x64
            extension: ""
            runnable: false
          - name: darwin-arm64
            target: bun-darwin-arm64
            extension: ""
            runnable: false
          - name: windows-x64
            target: bun-windows-x64
            extension: ".exe"
            runnable: false
          # the musl legs of the compiled binary surface (the asset parity
          # expansion): the alpine and the musl-native hosts install the
          # same standalone workbench binary the glibc hosts do, and the
          # bun compile target list answers both musl architectures.
          - name: linux-x64-musl
            target: bun-linux-x64-musl
            extension: ""
            runnable: false
          - name: linux-arm64-musl
            target: bun-linux-arm64-musl
            extension: ""
            runnable: false
    concurrency:
      group: devthink-publish-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # every job carries its own ceiling (the family contract): the
    # compiled-binary leg rides the same bun build --compile recipe the
    # release assemble lane carries its 30-minute ceiling for.
    timeout-minutes: 30
    # least-privilege: the job's own write (the e2ugh job-permission
    # doctrine) — the 2.0.184 scorecard closure trimmed the contents
    # write: the binary attach below rides the owner pat, so the github
    # token answers read alone.
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: resolve release version
        id: releaseversion
        # bash on every platform: the windows runners default to pwsh and
        # the shared resolver is a bash script (the saddle lane lesson).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # the automatic workflow_run path resolves the latest release and
          # detaches the working tree onto its tag (the publishghcr
          # resolver mold), so the matrix always compiles the tagged source.
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      # the reality gate: the binary sources of the merged repository. the
      # lane always builds (no detect-and-skip: the sources the product
      # ships are the sources the lane gates on).
      - name: gate the desktop binary sources
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          test -f build.ts
          test -f devthink.ts

      - name: install dependencies
        shell: bash
        # the setup node registry url leaves the github package redirect in
        # the home npmrc: the install neutralizes it so bun resolves the
        # public npmjs mirror the family publishes.
        run: |
          cd devthink
          rm -f "$HOME/.npmrc"
          git checkout -- .npmrc
          bun install --frozen-lockfile --ignore-scripts

      # the prisma client the compiled binary embeds: the @prisma/client
      # package re-exports the generated .prisma/client/default module, so a
      # fresh checkout without generation answers the bundle with an
      # unresolvable require (the "Bundle failed" the lane carried since the
      # merge — the sandbox builds passed by resolving a parent project's
      # generated client, the runner never had one). the generate step the
      # root script owns materializes the client from schema.prisma
      # before the compile reads it.
      - name: generate the prisma client the binary embeds
        shell: bash
        run: cd devthink && bun run db:generate

      # the gateway sibling the compiled binary bridges into: the bundle's
      # module graph reaches ../getry/engine.ts through the getry bridge
      # family (the thinking ladder the os consumes as a library), and the
      # engine's lazy z-ai-web-dev-sdk singleton resolves from the getry
      # tree's own node_modules — the devthink install alone leaves the
      # sibling bare and the compile answers "Bundle failed" on the
      # unresolved dynamic import (the same fresh-checkout law the prisma
      # generate step carries: the sandbox builds passed by resolving a
      # sibling's installed tree, the runner never had one).
      - name: install the gateway sibling the binary bridges into
        shell: bash
        run: |
          cd getry
          rm -f "$HOME/.npmrc"
          git checkout -- .npmrc 2>/dev/null || true
          bun install --frozen-lockfile --ignore-scripts

      - name: compile the desktop binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p release
          bun run build.ts binary --target "${{ matrix.target }}" --outfile "release/devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}${{ matrix.extension }}"
          test -f "release/devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}${{ matrix.extension }}"

      # the runnable smoke: the compiled binary answers the version command
      # on the leg whose target the linux runner can execute (the cross
      # compiled darwin and windows binaries ship through the same recipe
      # the release lane compiles them with).
      - name: smoke test the compiled binary
        if: matrix.runnable
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          # the binary name carries two expansions; the quoted word keeps the
          # globbing discipline the release lane preaches.
          actual_version="$(./release/"devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}" --version)"
          test "${actual_version}" = "${RELEASE_VERSION}"

      - name: collect desktop artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          version="${RELEASE_VERSION}"
          mkdir -p build/release-assets/desktop
          binary="devthink.desktop.${version}.${{ matrix.name }}${{ matrix.extension }}"
          cp "release/${binary}" "build/release-assets/desktop/${binary}"
          checksums="sha256.desktop.${{ matrix.name }}.${version}"
          manifest="manifest.desktop.${{ matrix.name }}.${version}.json"
          sha256sum "build/release-assets/desktop/${binary}" | sed 's#build/release-assets/desktop/##' > "build/release-assets/desktop/${checksums}"
          printf '{\n  "version": "%s",\n  "platform": "desktop",\n  "target": "%s",\n  "binary": "%s",\n  "signing": "caller-owned"\n}\n' "$version" "${{ matrix.target }}" "$binary" > "build/release-assets/desktop/${manifest}"
          ! find build/release-assets/desktop -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .

      - name: upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.desktop.${{ matrix.name }}.${{ steps.releaseversion.outputs.version }}
          path: devthink/build/release-assets/desktop
          if-no-files-found: error

      - name: attach release assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag)
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        shell: bash
        env:
          # least-privilege (the 2.0.184 scorecard closure): the asset
          # upload rides the owner pat — the github token standing in when
          # the secret does not — so the job answers read alone above.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/release-assets/desktop/* --clobber

  devthink-desktop-tauri:
    name: desktop tauri ${{ matrix.platform }}-${{ matrix.architecture }}
    needs: release-resolve
    # the tauri lane of the saddle desktop surface (the GUI shell beside
    # the compiled binary lane above): a desktop application is not a
    # virtualization surface - the whole lane ports. the rust shell is
    # runner-side scaffold (the native wrapper doctrine: a toolchain
    # output generated and stamped on the runner, never tracked), the
    # tracked root tauri.conf.json carries the identity and the window
    # contract, and the icons derive from the web/icon.svg source through
    # the pinned tauri cli on every leg.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the matrix.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: windows
            architecture: x86
            runner: windows-2025
            target: i686-pc-windows-msvc
            bundles: nsis,msi
          - platform: windows
            architecture: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: windows
            architecture: arm64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            bundles: nsis,msi
          - platform: macos
            architecture: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: macos
            architecture: arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
    concurrency:
      group: devthink-publish-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner }}
    # every job carries its own ceiling (the family contract): the rust
    # compile lane rides the family desktop lane's own 60-minute value
    # (the same tauri matrix the family desktop lane above gates).
    timeout-minutes: 60
    # least-privilege: the job's own write (the e2ugh job-permission
    # doctrine) — the 2.0.184 scorecard closure trimmed the contents
    # write: the installer attach below rides the owner pat, so the
    # github token answers read alone.
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: resolve release version
        id: releaseversion
        # bash on every platform: the windows runners default to pwsh and
        # the shared resolver is a bash script (the saddle lane lesson).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: devthink/.nvmrc
      - name: setup pnpm
        # standalone: the desktop lane is the family's only macos pnpm
        # consumer, and the self-installer of pnpm 11 verifies its native
        # binary against the lockfile of the checkout - the web lockfile
        # carries no @pnpm/exe.darwin entries, so the identity check
        # refuses the runner. the standalone mode installs the pinned
        # pnpm straight from the npm registry and skips the lockfile
        # identity gate.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # the standalone @pnpm/exe binary answers a Node.js SEA bug on
          # the Intel macOS runners (the upstream issue the pnpm error
          # names: no working darwin-x64 binary), so the intel leg falls
          # back to the npm-managed install the workaround documents while
          # every other leg keeps the self-contained binary.
          standalone: ${{ matrix.runner != 'macos-15-intel' }}
      - name: set up bun
        # the devthink application pins bun (packageManager bun@1.4.2), so the
        # pnpm invocations that touch it delegate to this exact bun build.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: setup rust
        # the saddle lane rides the stable channel (the family runtime
        # doctrine, Regra 54/125: the toolchain the tauri lane compiles
        # answers the same channel every leg resolves). The ref is the
        # `stable` branch the action publishes - the `vstable` spelling the
        # first real publish run carried resolved no version and killed the
        # whole matrix at the Set up job step.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: add target toolchain
        run: rustup target add "${{ matrix.target }}"

      - name: install linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf rpm

      # the reality gate: the tauri envelope the repository tracks (the
      # root config and the icon source the cli derives every density from).
      - name: gate the tauri sources
        shell: bash
        run: |
          set -euo pipefail
          test -f devthink/tauri.conf.json
          test -f devthink/icon.svg
          test -f devthink/package.json

      - name: build shared web surface
        # the single static UI source (the same build the mobile lane
        # wraps): the vite build answers straight at the application root —
        # no dist, no public — and the staging below frames the delivered
        # surface the shell bundles.
        shell: bash
        run: |
          set -euo pipefail
          (cd devthink && bun install --frozen-lockfile --ignore-scripts)
          (cd devthink && npm run build:web)
          test -f devthink/index.html
          test -n "$(ls devthink/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
          mkdir -p devthink/build/web
          cp devthink/index.html devthink/build/web/
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp devthink/*.${kind} devthink/build/web/ 2>/dev/null || true
          done
          test -f devthink/build/web/index.html

      - name: scaffold desktop rust shell
        # the runner-side scaffold (the native wrapper doctrine): the
        # cargo manifest, the entry sources and the copied tauri config
        # with runner-relative paths live under build/native/desktop,
        # three levels below the app root - the same geometry the
        # saddle lane scaffolds.
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p build/native/desktop
          cd build/native/desktop
          cat > Cargo.toml <<'CARGO_EOF'
          [package]
          name = "devthink-desktop"
          version = "0.0.0"
          description = "DevThink desktop workbench shell"
          authors = ["wenathlan"]
          edition = "2021"
          license = "GPL-3.0-only"
          build = "build.rs"

          [lib]
          name = "devthink_desktop"
          path = "lib.rs"
          crate-type = ["staticlib", "cdylib", "rlib"]

          [[bin]]
          name = "devthink-desktop"
          path = "main.rs"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          CARGO_EOF
          cat > main.rs <<'MAIN_EOF'
          fn main() {
              devthink_desktop::run()
          }
          MAIN_EOF
          cat > lib.rs <<'LIB_EOF'
          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("failed to run DevThink desktop workbench")
          }
          LIB_EOF
          cat > build.rs <<'BUILD_EOF'
          fn main() {
              tauri_build::build()
          }
          BUILD_EOF
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("../../../tauri.conf.json", "utf8"));
            config.build.frontendDist = "../../../build/web";
            config.build.beforeDevCommand = "pnpm dev";
            fs.writeFileSync("tauri.conf.json", `${JSON.stringify(config, null, 2)}\n`);
            console.log("copied the tauri.conf.json into the scaffold with runner-relative paths");
          '

      - name: synchronize desktop version metadata
        # stamps tauri.conf.json version + Cargo.toml version on the scaffold
        # copy (the tracked root file moves with release bumps, never with
        # runner builds).
        shell: bash
        env:
          DEVTHINK_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e 'const fs=require("node:fs"); const version=process.env.DEVTHINK_VERSION; const config=JSON.parse(fs.readFileSync("build/native/desktop/tauri.conf.json","utf8")); config.version=version; fs.writeFileSync("build/native/desktop/tauri.conf.json", `${JSON.stringify(config, null, 2)}\n`); const cargo=fs.readFileSync("build/native/desktop/Cargo.toml","utf8").replace(/^version = ".*"$/m, `version = "${version}"`); fs.writeFileSync("build/native/desktop/Cargo.toml", cargo);'

      - name: generate platform icons
        # the icon source the repository tracks (icon.svg, the 1024px
        # mark) derives every density the bundles declare - nothing is
        # committed pre-rendered.
        shell: bash
        run: cd devthink && npx --yes @tauri-apps/cli@2.11.4 icon icon.svg --output build/native/desktop/icons

      - name: configure desktop signing status
        # the saddle signing surface: the caller-owned certificate when the
        # platform's secrets exist, the unsigned path (skipped sign and
        # notarize steps below) otherwise - the manifest records which.
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows" ] && [ -n "${WINDOWS_CERTIFICATE_BASE64:-}" ] && [ -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "DEVTHINK_SIGNING=caller-owned" >> "$GITHUB_ENV"
          elif [ "${{ matrix.platform }}" = "macos" ] && [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "DEVTHINK_SIGNING=caller-owned" >> "$GITHUB_ENV"
          else
            echo "DEVTHINK_SIGNING=unsigned" >> "$GITHUB_ENV"
          fi

      - name: configure macos signing keychain
        if: matrix.platform == 'macos' && env.DEVTHINK_SIGNING == 'caller-owned'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/devthink-desktop.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/devthink-desktop.p12"
          security import "$RUNNER_TEMP/devthink-desktop.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          echo "APPLE_SIGNING_IDENTITY_EXPORTED=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: build desktop bundles
        shell: bash
        # the bounded retry the bundler-downloads taught: the tauri
        # bundler fetches its own tool seats (linuxdeploy appimages, the
        # nsis toolchain) from github release assets, and the transient
        # 503 the cdn served two lanes in a row reddened full rust
        # compiles that never needed to repeat - the retry walks the
        # same build command (the bundler's own cache reuses every
        # asset the prior attempt landed) before the lane gives up.
        run: |
          set -euo pipefail
          cd devthink/build/native/desktop
          attempt=0
          until [ "$attempt" -ge 3 ]; do
            attempt=$((attempt + 1))
            if [ "${DEVTHINK_SIGNING}" = "caller-owned" ]; then
              npx --yes @tauri-apps/cli@2.11.4 build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" && break
            else
              npx --yes @tauri-apps/cli@2.11.4 build --ci --no-sign --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" && break
            fi
            echo "the tauri bundle attempt ${attempt}/3 failed; the bundler cache reuses every landed asset on the retry."
            [ "$attempt" -ge 3 ] && exit 1
            sleep "$((attempt * 30))"
          done

      - name: sign windows installers
        # the saddle signtool recipe: the caller's certificate signs every
        # installer the bundle emitted, with the timestamp counter-signature
        # the repository variable names.
        if: matrix.platform == 'windows' && env.DEVTHINK_SIGNING == 'caller-owned'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\devthink-code-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          Get-ChildItem "devthink\build\native\desktop\target\${{ matrix.target }}\release\bundle" -Recurse -Include *.exe,*.msi | ForEach-Object {
            signtool sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /f "$env:RUNNER_TEMP\devthink-code-signing.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
            signtool verify /pa /all $_.FullName
          }

      - name: notarize macos installers
        # the saddle notarytool recipe: the dmg images submit to Apple's
        # notary service and staple the ticket the response issues.
        if: matrix.platform == 'macos' && env.DEVTHINK_SIGNING == 'caller-owned'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for dmg in devthink/build/native/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
          done

      - name: collect desktop artifacts
        shell: bash
        env:
          DEVTHINK_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          version="${DEVTHINK_VERSION}"
          mkdir -p build/release-assets/tauri
          # the find walk replaces the globstar sweep the macOS bash 3.2
          # cannot answer: `shopt: globstar: invalid shell option name`
          # killed the 2.0.14 macos legs at the shopt line itself, before
          # the first bundle ever answered — globstar is a bash 4 option
          # and the macos runners carry the bash 3.2 the system ships.
          # find carries the recursive walk on every platform the matrix
          # builds and the nullglob semantics ride the read itself (an
          # empty bundle tree answers nothing and the collected assertion
          # below fails the leg honestly). the -f guard beside the loop
          # keeps the exact filtering the globstar sweep carried.
          collected=0
          while IFS= read -r -d '' bundle; do
            [ -f "$bundle" ] || continue
            case "$bundle" in
              *.deb|*.rpm|*.AppImage|*.exe|*.msi|*.dmg)
                ext="${bundle##*.}"
                [ "$ext" = "AppImage" ] && ext="appimage"
                asset="devthink.desktop.${version}.${{ matrix.platform }}-${{ matrix.architecture }}.${ext}"
                cp "$bundle" "build/release-assets/tauri/${asset}"
                collected=$((collected + 1))
                ;;
              *.app)
                asset="devthink.desktop.${version}.${{ matrix.platform }}-${{ matrix.architecture }}.app.zip"
                ditto -c -k --sequesterRsrc --keepParent "$bundle" "build/release-assets/tauri/${asset}" 2>/dev/null || (cd "$(dirname "$bundle")" && zip -qr "$OLDPWD/build/release-assets/tauri/${asset}" "$(basename "$bundle")")
                collected=$((collected + 1))
                ;;
            esac
          done < <(find "build/native/desktop/target/${{ matrix.target }}/release/bundle" -print0 2>/dev/null)
          test "$collected" -gt 0
          # the portable digest: the macOS runners carry no sha256sum
          # binary (the 2.0.15 macos legs died at the checksum line), so
          # the lane answers shasum -a 256 there — the same coreutils wire
          # format sha256sum emits, and the digest files stay identical
          # across the matrix.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum build/release-assets/tauri/* | sed 's#build/release-assets/tauri/##' > "build/release-assets/tauri/sha256.desktop.${{ matrix.platform }}-${{ matrix.architecture }}.${version}"
          else
            shasum -a 256 build/release-assets/tauri/* | sed 's#build/release-assets/tauri/##' > "build/release-assets/tauri/sha256.desktop.${{ matrix.platform }}-${{ matrix.architecture }}.${version}"
          fi
          printf '{\n  "version": "%s",\n  "platform": "desktop-tauri",\n  "target": "%s",\n  "bundles": "%s",\n  "signing": "%s",\n  "notarization": "%s"\n}\n' "$version" "${{ matrix.target }}" "${{ matrix.bundles }}" "${DEVTHINK_SIGNING:-unsigned}" "${DEVTHINK_NOTARIZATION:-none}" > "build/release-assets/tauri/manifest.desktop.${{ matrix.platform }}-${{ matrix.architecture }}.${version}.json"
          ! find build/release-assets/tauri -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .

      - name: upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.desktop.tauri.${{ matrix.platform }}-${{ matrix.architecture }}.${{ steps.releaseversion.outputs.version }}
          path: devthink/build/release-assets/tauri
          if-no-files-found: error

      - name: attach release assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag)
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        shell: bash
        env:
          # least-privilege (the 2.0.184 scorecard closure): the asset
          # upload rides the owner pat — the github token standing in when
          # the secret does not — so the job answers read alone above.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/release-assets/tauri/* --clobber

  devthink-android:
    name: android release artifacts
    needs: release-resolve
    # the mobile lane folds to the saddle pattern: the workbench at the
    # application root is the single static UI source (the mobile shell
    # doctrine of the repository), the lane builds it with the workspace's
    # own frozen lockfile, relocates the DevThink mobile identity the
    # repository carries (devthink/capacitor.config.ts - appId
    # im.devthink.app) onto the app root on the runner (a native wrapper
    # is toolchain output, generated and stamped on the runner, never
    # tracked), and runs the capacitor add/sync from working-directory:
    # devthink. the lane gates on the real locations (devthink/package.json,
    # devthink/vite.config.ts and the mobile identity config) - it always
    # builds. the release lane is
    # the saddle signing surface: the caller-owned keystore when the
    # production secrets exist, the clearly labeled ci-test-key when a
    # release fires without them, and a hard fail on manual dispatch
    # that carries neither.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the wrapper.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    concurrency:
      group: devthink-publish-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # every job carries its own ceiling (the family contract): the mobile
    # shell lane rides the family mobile lane's own 45-minute value
    # (the family mobile lanes above gate the android legs the same).
    timeout-minutes: 45
    # least-privilege: the job's own write (the e2ugh job-permission
    # doctrine) — the 2.0.184 scorecard closure trimmed the contents
    # write: the asset attach below rides the owner pat, so the github
    # token answers read alone.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # the automatic workflow_run path resolves the latest release and
          # detaches the working tree onto its tag (the publishghcr
          # resolver mold), so the wrapper always builds the tagged source.
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # the reality gate: the merged workbench and the mobile identity the
      # repository actually carries (no detect-and-skip - the sources the
      # product ships are the sources the lane gates on).
      - name: gate the merged mobile surface
        shell: bash
        run: |
          set -euo pipefail
          test -f devthink/package.json
          test -f devthink/vite.config.ts
          test -f devthink/capacitor.config.ts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
        # THE PACKAGEMANAGER LAW (the 2026-11-18 cure): the version input
        # stays empty so the packageManager stamp the root manifest carries
        # is the single source of truth - the immutable tag envelopes (the
        # 2.0.185 rung cut before the pnpm ladder walked) and the main head
        # both answer their own stamp without the multiple-versions conflict
        # the action-setup refused (version input vs packageManager key).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: set up bun
        # the devthink application pins bun (packageManager bun@1.4.2), so the
        # pnpm invocations that touch it delegate to this exact bun build.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # the explicit platform-tools package: the action default answers
          # the retired `tools` package that the sdk no longer carries.
          packages: platform-tools
      - name: accept the android sdk licenses
        # the runner image refresh resets the accepted license set: the
        # sdkmanager answers its own prompt through the yes pipe before the
        # package install reads it.
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: install android sdk packages
        # the release lane's r8 and build-tools surface (the saddle recipe):
        # the debug lane inherited the runner's preinstalled set, the
        # release build asks for the platform and build tools explicitly.
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: build the static workbench
        # the single static UI source: the vite build answers straight at
        # the application root (no dist, no public), the staging inside the
        # same step frames the delivered surface, and the webDir below aims
        # the capacitor shell at that staging.
        shell: bash
        run: |
          set -euo pipefail
          (cd devthink && bun install --frozen-lockfile --ignore-scripts)
          (cd devthink && npm run build:web)
          test -f devthink/index.html
          test -n "$(ls devthink/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
          mkdir -p devthink/build/web
          cp devthink/index.html devthink/build/web/
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp devthink/*.${kind} devthink/build/web/ 2>/dev/null || true
          done
          test -f devthink/build/web/index.html

      - name: relocate the mobile identity onto the web root
        # the saddle native wrapper doctrine: the shell is runner-side
        # toolchain output. the lane reads the DevThink mobile identity the
        # repository carries (appId im.devthink.app, appName DevThink) and
        # writes it at the app root with the webDir aimed at the staged
        # workbench output, so the capacitor add/sync below runs with
        # working-directory: devthink exactly like the saddle mobile lane.
        # the identity is read from the tracked config, never hardcoded
        # here: the one config of the family lives at the app root as the
        # ts source the capacitor cli 8.5 resolves from its cwd, and the
        # derived json rides beside it for every consumer that prefers the
        # plain shape.
        shell: bash
        run: |
          set -euo pipefail
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync("devthink/capacitor.config.ts", "utf8");
            const appid = /appId:\s*"([^"]+)"/.exec(source);
            if (!appid || appid[1].trim() === "") throw new Error("The mobile identity config carries no appId.");
            const appname = /appName:\s*"([^"]+)"/.exec(source);
            const config = { appId: appid[1], appName: appname ? appname[1] : "DevThink", webDir: "build/web", bundledWebRuntime: false };
            fs.writeFileSync("devthink/capacitor.config.json", `${JSON.stringify(config, null, 2)}\n`);
            console.log(`derived the DevThink mobile identity (${config.appId}) at the web root (webDir ${config.webDir})`);
          '
          # the cli resolves capacitor.config.ts ahead of the derived json,
          # and the tracked ts answers webDir "." - a value the capacitor
          # 8.5 line refuses on the sync path (the first real publish run
          # red the ios leg on "is not a valid value for webDir"). The
          # runner aims the tracked ts at the staged build/web the same way
          # the family mobile lane does: the tracked file never carries the
          # runner path once the release commit is cut.
          node -e 'const fs=require("node:fs");const file="devthink/capacitor.config.ts";const source=fs.readFileSync(file,"utf8");const rewritten=source.replace(/webDir:\s*"[^"]*"/,`webDir: "build/web"`);if(rewritten===source)throw new Error("the capacitor config carries no webDir to aim");fs.writeFileSync(file,rewritten);'

      - name: generate and synchronize the android wrapper
        # the capacitor cli the mobile shell declares; cap add materializes
        # the android template inside the application and sync copies the
        # built workbench output into its assets. the wrapper patch rides
        # beside the generation: the stock template wrapper carries the 10s
        # default network timeout that reddened the lane on a slow
        # services.gradle.org answer (the 8.14.3-all timeout flake), so the
        # patch seats networkTimeout=180000 and the -bin distribution (the
        # smaller artifact the same checksum lane verifies) before any
        # gradlew walk ever runs. the 8.6 template heal walks two seats the
        # 8.5-era law broke: the template now carries networkTimeout=10000
        # itself, so the append-only seat died at the final gate (the patch
        # now replaces whatever default rode the wrapper), and the escaped
        # double backslashes the single-quoted literal block carried never
        # matched a single real dot (the sed and the bin gate searched for
        # literal backslashes the wrapper never answers), so the patterns
        # walk the plain dots and the -all swap rides the version-agnostic
        # suffix a template rung bump can never strand.
        working-directory: devthink
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          wrapper="android/gradle/wrapper/gradle-wrapper.properties"
          test -f "$wrapper"
          sed -i 's#-all\.zip#-bin.zip#' "$wrapper"
          if grep -q '^networkTimeout=' "$wrapper"; then
            sed -i 's#^networkTimeout=.*#networkTimeout=180000#' "$wrapper"
          else
            printf 'networkTimeout=180000\n' >> "$wrapper"
          fi
          grep -q 'distributionUrl=.*bin\.zip' "$wrapper"
          grep -q '^networkTimeout=180000$' "$wrapper"

      - name: derive android version values
        # the saddle release lane recipe: the version and the derived
        # versionCode (major*1000000 + minor*1000 + patch) ride the env so
        # the stamp and the collect steps share one source of truth.
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "DEVTHINK_VERSION=$version" >> "$GITHUB_ENV"
          echo "DEVTHINK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: stamp generated android release config
        # the saddle release stamp: injects, into the generated gradle config:
        # the keystore.properties loader header (java Properties +
        # FileInputStream guarded by keystorePropertiesFile.exists()),
        # signingConfigs.release (keyAlias/keyPassword/storeFile/
        # storePassword read from keystore.properties), the release
        # buildType with minifyEnabled true, shrinkResources true,
        # proguard-android-optimize.txt + signingConfig signingConfigs.release
        # (only when keystorePropertiesFile.exists()), and the abi splits
        # block (the asset parity expansion: one standalone apk per abi
        # beside the universal build - armeabi-v7a, arm64-v8a, x86, x86_64 -
        # the legacy splits dsl answers fully installable apks, never the
        # bundletool split artifacts that need a base). asserts the stock
        # template blocks (versionCode 1 / versionName "1.0" / plain release)
        # were found and the stamp landed before writing.
        shell: bash
        run: |
          set -euo pipefail
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const file = "devthink/android/app/build.gradle";
            let gradle = fs.readFileSync(file, "utf8");
            const version = process.env.DEVTHINK_VERSION;
            const versioncode = process.env.DEVTHINK_VERSION_CODE;
            if (!version || !versioncode) {
              throw new Error("DEVTHINK_VERSION and DEVTHINK_VERSION_CODE must be exported before stamping");
            }
            const plainrelease = [
              "    buildTypes {",
              "        release {",
              "            minifyEnabled false",
              "            proguardFiles getDefaultProguardFile(\x27proguard-android.txt\x27), \x27proguard-rules.pro\x27",
              "        }",
              "    }"
            ].join("\n");
            if (!gradle.includes("versionCode 1") || !gradle.includes(`versionName "1.0"`) || !gradle.includes(plainrelease)) {
              throw new Error(`generated android template drifted: the defaultConfig/release blocks were not found in ${file}`);
            }
            gradle = gradle.replace("versionCode 1", `versionCode ${versioncode}`);
            gradle = gradle.replace(`versionName "1.0"`, `versionName "${version}"`);
            const stampedrelease = [
              "    signingConfigs {",
              "        if (keystorePropertiesFile.exists()) {",
              "            release {",
              "                keyAlias keystoreProperties[\x27keyAlias\x27]",
              "                keyPassword keystoreProperties[\x27keyPassword\x27]",
              "                storeFile file(keystoreProperties[\x27storeFile\x27])",
              "                storePassword keystoreProperties[\x27storePassword\x27]",
              "            }",
              "        }",
              "    }",
              "",
              "    buildTypes {",
              "        release {",
              "            minifyEnabled true",
              "            shrinkResources true",
              "            proguardFiles getDefaultProguardFile(\x27proguard-android-optimize.txt\x27), \x27proguard-rules.pro\x27",
              "            if (keystorePropertiesFile.exists()) {",
              "                signingConfig signingConfigs.release",
              "            }",
              "        }",
              "    }"
            ].join("\n");
            const splitrelease = [
              "    splits {",
              "        abi {",
              // the bundle collision law (issuetracker.google.com/402800800):
              // a bundle task never rides the same invocation as the abi
              // splits — the shrunk-resources stage answers one file per
              // split and buildReleasePreBundle refuses the many — so the
              // splits answer the assemble invocations alone and the bundle
              // lane runs its own invocation with the splits asleep (the
              // per-abi apks, the universal apk and the aab all ship)
              "            enable gradle.startParameter.taskNames.any { it.toLowerCase().contains(\x27assemble\x27) } && !gradle.startParameter.taskNames.any { it.toLowerCase().contains(\x27bundle\x27) }",
              "            reset()",
              "            include \x27armeabi-v7a\x27, \x27arm64-v8a\x27, \x27x86\x27, \x27x86_64\x27",
              "            universalApk true",
              "        }",
              "    }",
              "",
              ""
            ].join("\n");
            gradle = gradle.replace(plainrelease, splitrelease + stampedrelease);
            const keystoreloader = [
              "apply plugin: \x27com.android.application\x27",
              "",
              "import java.io.FileInputStream",
              "import java.util.Properties",
              "",
              "def keystorePropertiesFile = rootProject.file(\x27keystore.properties\x27)",
              "def keystoreProperties = new Properties()",
              "if (keystorePropertiesFile.exists()) {",
              "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))",
              "}"
            ].join("\n");
            gradle = gradle.replace("apply plugin: \x27com.android.application\x27", keystoreloader);
            if (!gradle.includes(`versionCode ${versioncode}`) || !gradle.includes(`versionName "${version}"`) || !gradle.includes("signingConfig signingConfigs.release") || !gradle.includes("universalApk true")) {
              throw new Error("the stamp did not land");
            }
            fs.writeFileSync(file, gradle);
            console.log(`stamped ${file}: versionName ${version}, versionCode ${versioncode}, the signed optimized release block`);
          '

      - name: configure android signing
        # the saddle signing three-way: the caller-owned keystore when the
        # production secrets exist; the clearly labeled ci-test-key when a
        # release (or a manual build that allows it) fires without them; a
        # hard fail otherwise. the manifest records which path answered.
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          production_ready=false
          if [ -n "${ANDROID_KEY_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_STORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            production_ready=true
          fi
          if [ "$production_ready" = true ]; then
            printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/devthink-upload.jks"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/devthink-upload.jks"
              printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > devthink/android/keystore.properties
            echo "DEVTHINK_SIGNING=caller-owned" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ inputs.allow_test_signing }}" = "true" ]; then
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/devthink-test.jks" -storepass changeit -keypass changeit -alias devthink-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DevThink CI Test,O=DevThink,C=US"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/devthink-test.jks"
              printf 'storePassword=changeit\n'
              printf 'keyAlias=devthink-test\n'
              printf 'keyPassword=changeit\n'
            } > devthink/android/keystore.properties
            echo "DEVTHINK_SIGNING=ci-test-key" >> "$GITHUB_ENV"
          else
            echo "Manual Android builds require production signing secrets or allow_test_signing=true."
            exit 1
          fi

      - name: build optimized android release
        working-directory: devthink/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # the bundle collision law rides the invocation split: the abi
          # splits answer the assemble lane alone (per-abi apks beside the
          # universal), and the bundle lane runs its own invocation with
          # the splits asleep — one shrunk-resources file, the aab ships
          ./gradlew --no-daemon --stacktrace assembleRelease
          ./gradlew --no-daemon --stacktrace bundleRelease

      - name: collect android artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          version="${{ steps.release.outputs.version }}"
          mkdir -p build/mobile/android
          apk="devthink.android.${version}.apk"
          aab="devthink.android.${version}.aab"
          aab_source="$(find android/app/build/outputs/bundle/release -type f \( -name 'android-release*.aab' -o -name 'app-release*.aab' \) -print -quit)"
          test -n "$aab_source"
          cp "$aab_source" "build/mobile/android/${aab}"
          # the abi split collect (the asset parity expansion): every apk the
          # splits dsl emitted lands under its public name - the universal
          # build keeps the plain apk name the lane always shipped, and every
          # abi answers beside it with dots only (the public naming carries
          # no underscore, so x86_64 ships as x64).
          collected=0
          while IFS= read -r -d '' apk_source; do
            [ -f "$apk_source" ] || continue
            base="$(basename "$apk_source")"
            case "$base" in
              *armeabi-v7a*) out="devthink.android.${version}.armeabi.v7a.apk" ;;
              *arm64-v8a*) out="devthink.android.${version}.arm64.v8a.apk" ;;
              *x86_64*) out="devthink.android.${version}.x64.apk" ;;
              *x86*) out="devthink.android.${version}.x86.apk" ;;
              *) out="devthink.android.${version}.apk" ;;
            esac
            cp "$apk_source" "build/mobile/android/${out}"
            collected=$((collected + 1))
          done < <(find android/app/build/outputs/apk/release -type f -name '*.apk' -print0 | sort -z)
          test "$collected" -ge 5
          test -f "build/mobile/android/devthink.android.${version}.apk"
          test -f "build/mobile/android/devthink.android.${version}.armeabi.v7a.apk"
          test -f "build/mobile/android/devthink.android.${version}.arm64.v8a.apk"
          test -f "build/mobile/android/devthink.android.${version}.x86.apk"
          test -f "build/mobile/android/devthink.android.${version}.x64.apk"
