name: DevThink CI

# THE CI BATTERY OF THE MERGED REPOSITORY, ONE FILE (the 2.0.16 grouping
# pass): the runtime compatibility lanes (the CLI contract matrix over
# node, bun and deno, the LTS typecheck leg and the static workbench
# compatibility) answer every push and pull request beside the DevThink
# Verify workflow the gate ladder owns, and the manual dispatch firing
# calls the same reusable verify ladder on a chosen ref. The compatibility
# lanes lived as their own workflow file the 2.0.15 board answered
# scattered; the merged file carries the push CI battery as one correlated
# logic (the family doctrine: the gate ladder IS the CI, this file owns the
# runtime legs that ladder does not repeat). The cross-bundler verification
# of the consolidated house rides here too: the webpack job packs the same
# core bundle the esbuild recipe produced through webpack and asserts the
# webpack shape stays a sane, non-empty bundle (the lane lived as its own
# workflow file until the webpack pass folded it in). The family config
# parity and the family test matrix fold here as well (the configs workflow
# file and the orphaned app suites answer one correlated owner), so the
# reported check count stops swinging with the folder moves.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # the supersede group of the CI battery (the verify lane pattern): a
  # superseded firing of the SAME event and ref is cancelled to save runner
  # minutes; the push and pull_request lanes stay distinct lanes that run
  # side by side.
  group: devthink-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-runtime:
    name: CLI contract on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    # the runtime battery (build, the deterministic suite, the CLI
    # contract and the flat tarball check) carries the same ceiling the
    # verify ladder grants its devthink job: every lane has its own
    # bounded ceiling, none rides the default 360.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: devthink/.nvmrc
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Set up Deno
        # the deno leg of the matrix (the saddle root-probe lane): the
        # deno-version pin mirrors the verify modes job (the v2.x line the
        # engines.deno range declares) so both lanes speak the same floor.
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install root dependencies
        run: cd devthink && bun install --frozen-lockfile --ignore-scripts
      - name: Validate the CLI help contract of the built artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          if [ "${{ matrix.runtime }}" = "node" ]; then
            node tests/build.mjs
            node dist/cli.js --help
          elif [ "${{ matrix.runtime }}" = "deno" ]; then
            node tests/build.mjs
          else
            node tests/build.mjs
            bun devthink.ts --help
          fi
      - name: Deno check over the deno entry
        # the saddle root-probe doctrine on the deno leg: the built entry
        # type-checks under the runtime that will import it (the same step
        # the verify modes job runs — the compatibility lane repeats it so
        # a deno-only regression answers this lane before the ladder).
        if: matrix.runtime == 'deno'
        run: |
          set -euo pipefail
          cd devthink
          deno --version
          deno check dist/deno.js
      - name: Deno import smoke over the deno entry
        if: matrix.runtime == 'deno'
        run: cd devthink && deno eval "const library = await import('./dist/deno.js'); if (typeof library.denoadapter !== 'function') throw new Error('The deno mode lost its adapter.'); if (typeof library.surfacepalette !== 'function') throw new Error('The deno mode lost its surface.');"
      - name: Run the accessibility sweep over the built tree
        # the readiness test the suite carries walks the committed evidence:
        # the sweep reruns here so the recorded wcag artifact reflects the
        # built surfaces (the committed artifact predates this build).
        run: cd devthink && node tests/wcag.mjs
      - name: Run deterministic test suite
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          if [ "${{ matrix.runtime }}" = "node" ]; then
            node --input-type=commonjs --eval "const library = require('./dist/index.cjs'); if (typeof library.surfacepalette !== 'function') throw new Error('The cjs mode lost its public surface.'); if (library.bundlestamp().mode !== 'cjs') throw new Error('The cjs mode lost its stamp.');"
            node --input-type=module --eval "import('./dist/index.js').then(library => { if (typeof library.surfacepalette !== 'function') throw new Error('The esm mode lost its public surface.'); if (library.bundlestamp().mode !== 'esm') throw new Error('The esm mode lost its stamp.'); });"
            node --input-type=module --eval "
            import { readFileSync } from 'node:fs';
            new Function('self', readFileSync('./dist/devthink.umd.js', 'utf8'))(globalThis);
            if (typeof globalThis.devthink.surfacepalette !== 'function') throw new Error('The umd mode lost its global surface.');
            if (globalThis.devthink.bundlestamp().mode !== 'umd') throw new Error('The umd mode lost its stamp.');
            "
          else
            bun run test:runtime
          fi
      - name: Flat tarball check over the single distribution
        if: matrix.runtime == 'node'
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p releasecheck
          npm pack ./distpackage --pack-destination releasecheck >/dev/null
          tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -F "package/index.cjs"
          tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -F "package/devthink.umd.js"
          tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -F "package/checksums.txt"
          if tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -E "^package/([^/]+/){3}"; then echo "The npm tarball carries a path nested past two directories; the package stays flat." >&2; exit 1; fi

  lts-typecheck:
    # the e2ugh family LTS leg (the saddle compatibility lane carries the
    # same doctrine): the typecheck must hold on the ACTIVE LTS line
    # (node 24.x), not only on the current line the .nvmrc baseline pins
    # (26.8.2) — a TypeScript regression that only answers on the current
    # runtime never rides a release. the tsc binary itself is the pinned
    # toolchain the lockfile resolves (typescript 7.0.2, the family
    # standard); the LTS lane only swaps the node that drives it.
    name: Typecheck on the active LTS line
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - name: Install the devthink dependencies
        # the merged application carries one package.json pinned to bun: the
        # single frozen install covers the engine and the web workbench alike
        run: cd devthink && bun install --frozen-lockfile --ignore-scripts
      - name: Assert the LTS line
        run: |
          set -euo pipefail
          node --version
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "${major}" = "24"
      - name: Generate the prisma client the typecheck imports
        # the database module imports the PrismaClient the generated
        # .prisma/client tree declares — a fresh install carries the stub
        # alone, so the client generates before the declaration walk (the
        # same ordering the root build carries through tests/build.mjs).
        run: cd devthink && npm run db:generate
      - name: Typecheck the merged tree on the LTS line
        run: cd devthink && npm run typecheck
      - name: Typecheck the web workbench on the LTS line
        run: cd devthink && npm run check:web

  static-web:
    name: Static workbench compatibility
    runs-on: ubuntu-latest
    # the workbench lane (frozen install, the check gate and the two Vite
    # base-path builds) stays bounded.
    timeout-minutes: 30
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - name: Set up Bun
        # the merged application pins bun (packageManager bun@1.4.2): the
        # frozen install and the build scripts run through the pinned bun
        # and the node toolchain it drives.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
        # the workbench lane installs through the pinned bun only: no pnpm
        # store ever populates inside the job, so the pnpm cache of setup-node
        # answers the path validation error on the post save the moment the
        # regenerated lockfile misses the key - the cache stays off here.
      - name: Install the locked workbench dependencies
        run: cd devthink && bun install --frozen-lockfile --ignore-scripts
      - name: Generate the prisma client the typecheck imports
        # the database module imports the PrismaClient the generated
        # .prisma/client tree declares — a fresh install carries the stub
        # alone, so the client generates before the declaration walk (the
        # same ordering the LTS typecheck lane and the root build carry).
        run: cd devthink && npm run db:generate
      - name: Check the web TypeScript of the static workbench
        run: cd devthink && npm run check:web
      - name: Build root-hosted static workbench
        env:
          VITE_BASE_PATH: /
        run: cd devthink && npm run build:web
      - name: Build repository-hosted static workbench
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: cd devthink && npm run build:web

  structure:
    # the gateway family structure gate (the 2.0.18 port): the repository
    # tree answers a flat grouping contract - the application folder adds one
    # layer, no tracked file nests past four directories (the deepest evidence trees ride tests/code/recipes
    # and the web page folders at exactly that line) and no tracked file
    # duplicates the content of another outside the recorded evidence
    # trees (a copy nobody deduplicated answers this gate).
    name: Repository flat structure contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Assert no tracked file nests past three directories
        shell: bash
        run: |
          set -euo pipefail
          # every application follows the house flat contract: the Sol theme
          # folders and the grouped docs/tests trees stay inside the ceiling,
          # and no app carries a nested src/ tree of its own.
          deep="$(git ls-files | awk -F/ 'NF > 5')"
          if [ -n "${deep}" ]; then
            echo "::error::tracked files nest past four directories; the app layer plus the grouping doctrine files them:" >&2
            for entry in ${deep}; do echo "${entry}"; done
            exit 1
          fi
          echo "every tracked file nests inside four directories."
      - name: Assert no tracked file duplicates another
        shell: bash
        run: |
          set -euo pipefail
          # the recorded evidence trees carry deliberate copies (the
          # tests/code mining corpus and the antigravity archives) and the
          # zero-build sites ship their own engine copy per deploy unit
          # (engine.css, engine.js, clean-url.js|ts) the way a standalone
          # static site must; the per-unit sol lockfiles are generated pins
          # riding the same rule, the family biome baseline and the family
          # pnpm workspace baseline are the deliberate identical configs the
          # parity law enforces; the live tree outside them answers no
          # duplicate content above the 512-byte stub floor.
          duplicates="$(
            git ls-files | grep -vE '^(devthink/tests/code/|devthink/docs/antigravity/)' | grep -vE '(^|/)LICENSE$' | grep -vE 'engine\.(css|js)$|clean-url\.(js|ts)$|/pnpm-lock\.yaml$|/biome\.jsonc$|/pnpm-workspace\.yaml$' | while IFS= read -r file; do
              test -f "${file}" || continue
              size="$(wc -c < "${file}")"
              if [ "${size}" -gt 512 ]; then
                md5sum "${file}"
              fi
            done | awk '{print $1}' | sort | uniq -d
          )"
          if [ -n "${duplicates}" ]; then
            echo "::error::duplicate tracked content outside the evidence trees:" >&2
            for entry in ${duplicates}; do echo "${entry}"; done
            exit 1
          fi
          echo "no tracked file duplicates another outside the evidence trees."

  verify:
    # the manual orchestrator entry the ci.yml file always carried: the
    # dispatch firing answers the same reusable verify ladder the release
    # workflow calls, over a chosen ref. The push and pull_request lanes
    # below never call it (the verify workflow answers those events on its
    # own trigger), so the call rides the dispatch firing only - the merged
    # ci file never double-runs the gate ladder.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}

  webpack:
    # the webpack transformation lane of the consolidated CI battery (the
    # cross-bundler verification the retired standalone workflow file
    # carried): the core bundle the esbuild recipe produces also packs
    # through webpack - one entry, one output - and the lane asserts the
    # webpack shape stays a sane, non-empty bundle beside the esbuild one.
    name: Pack the core bundle through webpack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: devthink/.nvmrc
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          cache: false

      - name: Install the locked toolchain and webpack
        # the core package answers bun as its package manager (the
        # packageManager field), so the locked install rides bun and the
        # pnpm refusal never fires.
        run: |
          cd devthink
          bun install --frozen-lockfile --ignore-scripts
          npm install webpack-cli@6 --no-save --no-fund --no-audit

      - name: Build the core bundle and pack it through webpack
        run: |
          cd devthink
          node tests/build.mjs
          npx webpack --entry ./dist/index.js --output-path ./distpackage/webpack --output-filename devthink.webpack.js --mode production --target node
          test -s ./distpackage/webpack/devthink.webpack.js
          du -h ./distpackage/webpack/devthink.webpack.js

  configparity:
    # the family config parity lane (the configs workflow file folds here,
    # the same push and pull request triggers and the same gate family):
    # every app root carries the standard set of framework configs and the
    # biome baseline rides byte identical across the family, so the parity
    # script of the os app walks the app folders and fails the pipeline on
    # the first drift.
    name: Config parity across the family
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the config parity gate
        working-directory: devthink
        run: node tests/configparity.mjs

  family-tests:
    # the family test lane: the ten family apps carry their own vitest
    # suites beside the os suite, and this matrix gives them their owner,
    # so the reported test count stops swinging with the folder moves and
    # every app answers its own battery on every push. the install
    # respects the pnpm and bun split of the family and carries the ignore
    # scripts policy the pages lane learned, and the empty suites answer
    # green with the guard instead of failing the matrix.
    name: Family suite on ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [argan, cadria, cobaia, debonair, forge, foundry, getry, saddle, stealthhead, vault]
    steps:
      - name: Checkout the DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          cache: false

      - name: Guard the suite presence
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          glob='*.test'
          if find "${{ matrix.app }}/tests" -name "${glob}.ts" 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "the ${{ matrix.app }} suite is empty — the lane answers green with nothing to run"
          fi

      - name: Install the locked tree
        if: steps.suite.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.app }}"
          if [ -f pnpm-lock.yaml ]; then
            # the family pins one pnpm rung - every pnpm manifest of the
            # matrix carries packageManager pnpm@12.3.4 and the lockless
            # legs answer bun - so the install answers the exact version
            # the code scanning pin doctrine demands
            npm install -g --no-fund --no-audit pnpm@12.3.4
            pnpm install --frozen-lockfile --ignore-scripts
          else
            bun install --frozen-lockfile --ignore-scripts
          fi

      - name: Build the app surface
        if: steps.suite.outputs.present == 'true'
        working-directory: ${{ matrix.app }}
        # the suites that assert the built surface need the dist on disk:
        # the app build script runs when the app declares one, and the
        # vite entry rewrite the build performs on the source index reverts
        # right after, so the design contracts read the source form.
        run: |
          npm run build --if-present
          git checkout -- index.html 2>/dev/null || true

      - name: Run the app suite
        if: steps.suite.outputs.present == 'true'
        working-directory: ${{ matrix.app }}
        # the app answers its own runner: the vitest dialect apps ride their
        # vitest script and the node test dialect apps ride theirs, so the
        # matrix never forces one runner on the family.
        run: npm test
