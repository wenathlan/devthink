name: DevThink CI

# The CI entry point of the merged repository: the verify workflow itself
# answers every pull request and every push to main (the extension lane
# model — the gate ladder is the CI), so this workflow stays the manual
# orchestrator that runs the same verification chain on demand over a
# chosen ref without duplicating the event-driven lanes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devthink-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
