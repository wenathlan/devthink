name: DevThink CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devthink-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Check CLI
        run: bun run check
      - name: Test CLI
        run: bun test tests/core.test.ts
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Check web
        run: pnpm --dir web check
      - name: Build portable web
        env:
          VITE_BASE_PATH: /
        run: pnpm --dir web build
