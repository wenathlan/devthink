name: desktop artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  desktop:
    name: desktop ${{ matrix.name }}
    # the desktop lane of the merged repository wires to reality: the
    # merged product carries no tauri envelope (the retired lane gated on
    # desktop/Cargo.toml and desktop/tauri.conf.json, which the merge does
    # not carry - the dead gate never ran), and the desktop surface the
    # repository actually ships is the compiled workbench binary - "one
    # product, one binary, one metadata". the lane gates on the real
    # binary sources (build.ts + devthink.ts), compiles the full desktop
    # matrix through the same bun build --compile recipe the release lane
    # uses (cross compiled from the linux runner), stamps the checksums on
    # the runner and attaches the per-platform binaries to the release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: bun-linux-x64
            extension: ""
            runnable: true
          - name: linux-arm64
            target: bun-linux-arm64
            extension: ""
            runnable: false
          - name: darwin-x64
            target: bun-darwin-x64
            extension: ""
            runnable: false
          - name: darwin-arm64
            target: bun-darwin-arm64
            extension: ""
            runnable: false
          - name: windows-x64
            target: bun-windows-x64
            extension: ".exe"
            runnable: false
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "false"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      # the reality gate: the binary sources of the merged repository. the
      # lane always builds (no detect-and-skip: the sources the product
      # ships are the sources the lane gates on).
      - name: gate the desktop binary sources
        shell: bash
        run: |
          set -euo pipefail
          test -f build.ts
          test -f devthink.ts

      - name: install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: compile the desktop binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          bun run build.ts --target "${{ matrix.target }}" --outfile "release/devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}${{ matrix.extension }}"
          test -f "release/devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}${{ matrix.extension }}"

      # the runnable smoke: the compiled binary answers the version command
      # on the leg whose target the linux runner can execute (the cross
      # compiled darwin and windows binaries ship through the same recipe
      # the release lane compiles them with).
      - name: smoke test the compiled binary
        if: matrix.runnable
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          actual_version="$(./release/devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }} --version)"
          test "${actual_version}" = "${RELEASE_VERSION}"

      - name: collect desktop artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          mkdir -p build/release-assets/desktop
          binary="devthink.desktop.${version}.${{ matrix.name }}${{ matrix.extension }}"
          cp "release/${binary}" "build/release-assets/desktop/${binary}"
          checksums="sha256.desktop.${{ matrix.name }}.${version}"
          manifest="manifest.desktop.${{ matrix.name }}.${version}.json"
          sha256sum "build/release-assets/desktop/${binary}" | sed 's#build/release-assets/desktop/##' > "build/release-assets/desktop/${checksums}"
          printf '{\n  "version": "%s",\n  "platform": "desktop",\n  "target": "%s",\n  "binary": "%s",\n  "signing": "caller-owned"\n}\n' "$version" "${{ matrix.target }}" "$binary" > "build/release-assets/desktop/${manifest}"
          ! find build/release-assets/desktop -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .

      - name: upload workflow artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink.desktop.${{ matrix.name }}.${{ steps.releaseversion.outputs.version }}
          path: build/release-assets/desktop
          if-no-files-found: error

      - name: attach release assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/release-assets/desktop/* --clobber
