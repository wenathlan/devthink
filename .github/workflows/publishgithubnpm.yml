name: publish github npm

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["DevThink Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing DevThink tag to publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # the event-scoped group (the family concurrency doctrine, Regra 52):
  # the release published, workflow_run and dispatch firings are distinct
  # lanes that never cancel one another; only a superseded firing of the
  # SAME event and ref waits for the running one (cancel-in-progress stays
  # false so no publish leg is ever cancelled mid-push).
  group: publish-github-npm-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the publish
    # lane. Only a successful completion whose triggering event was the
    # version-bump push or the maintenance ladder dispatch (the two events
    # the release workflow really runs on) publishes.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.2
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      # the package validator, inlined from the retired composite action
      # (dependency install plus the pack dry-run).
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: build the distribution set
        run: node tests/build.mjs
      - name: package dry-run
        run: npm run pack:check
      - name: align github package scope
        run: npm pkg set name="@${GITHUB_REPOSITORY_OWNER}/devthink"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      - name: show github package name
        run: npm pkg get name
      - name: detect existing github package version
        id: availability
        shell: bash
        run: |
          package_name="@${GITHUB_REPOSITORY_OWNER}/devthink"
          if npm view "${package_name}@${{ steps.release.outputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish github package
        # The bounded retry policy (the extension release lane doctrine)
        # rides this registry the same way the npmjs lane carries it:
        # registry pushes answer transient failures, the publish retries
        # inside three attempts with the linear backoff, and only a third
        # failure reddens the lane.
        if: steps.availability.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          attempt=0
          published=0
          until [ "$attempt" -ge 3 ]; do
            attempt=$((attempt + 1))
            if npm publish --registry=https://npm.pkg.github.com --access public; then
              published=1
              break
            fi
            echo "github registry publish attempt ${attempt}/3 failed; retrying with backoff."
            sleep "$((attempt * 5))"
          done
          if [ "$published" -ne 1 ]; then
            echo "::error::github registry publish failed after ${attempt} attempts."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: align the latest dist-tag with the release version
        # The maene family realignment doctrine rides the github registry
        # lane the same way the npmjs lane carries it: the registry never
        # moves the latest dist-tag when a release lands BELOW the
        # current latest, so the lane pins latest to the release version
        # explicitly.
        shell: bash
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package_name="@${GITHUB_REPOSITORY_OWNER}/devthink"
          npm dist-tag add "${package_name}@${RELEASE_VERSION}" latest --registry=https://npm.pkg.github.com
          echo "the github registry latest dist-tag now answers ${RELEASE_VERSION}."
