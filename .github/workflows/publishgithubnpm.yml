name: publish github npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing DevThink tag to publish.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - name: resolve release version
        id: release
        uses: ./.github/actions/releaseversion
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - name: validate package
        uses: ./.github/actions/validatepackage
      - name: align github package scope
        run: npm pkg set name="@${GITHUB_REPOSITORY_OWNER}/devthink"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      - name: show github package name
        run: npm pkg get name
      - name: detect existing github package version
        id: availability
        shell: bash
        run: |
          package_name="@${GITHUB_REPOSITORY_OWNER}/devthink"
          if npm view "${package_name}@${{ steps.release.outputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish github package
        if: steps.availability.outputs.published != 'true'
        run: npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
