name: DevThink Scorecard

# The OSSF Scorecard supply-chain lane of the family doctrine (the
# Saddle scorecard analysis, adapted to the DevThink identity as its
# own lane because the DevThink security workflow keeps the scanner
# battery of the merged repository): the scorecard measures the
# repository posture the branch protection signals describe, publishes
# the results to the public scorecard REST API (which backs the OpenSSF
# scorecard badge) and uploads the SARIF report to the code scanning
# dashboard under the ossf-scorecard category.

on:
  push:
    branches: [main]
  schedule:
    # weekly, monday 03:17 UTC - the security.yml lane window
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devthink-scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    # scorecard runs on the default branch only (the weekly schedule and
    # main pushes); pull-request scans would distort the branch-protection
    # signals the scorecard measures.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: OSSF scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # required to upload the SARIF results and to sign the api publication
      security-events: write
      id-token: write
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run scorecard analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # publishes the results to the public scorecard rest api, which
          # backs the openssf scorecard badge
          publish_results: true
      - name: Upload scorecard results to code scanning
        # the exact-version pin (Regra 56a/125: one version per action in
        # every workflow, never the bare moving @v4 major tag) - the same
        # codeql-action release the codeql and security lanes pin.
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: scorecard-results.sarif
          category: ossf-scorecard
