# THE SADDLE LANES WORKFLOW — the split the half-megabyte law answers (the
# publish workflow grew past the half-megabyte line the github push
# validation carries and every push answered the phantom zero-job failure:
# the saddle vhe lane family — the tier-grid catalog, the verify grid, the
# publish lanes, the scan, the validate gate, the cleanup and the
# saddle-container archive — rides its own workflow the same triggers and
# the same gates answer, the resolver and the approval seats riding beside
# them the way the containers workflow always carried its own).
name: DevThink Saddle Lanes
on:
  release:
    types: [published]
  workflow_run:
    workflows: ["DevThink Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing DevThink tag to publish and package; empty resolves the latest release.
        required: false
        default: ""
        type: string
      target:
        description: Restrict the lane targets (all by default).
        required: false
        default: "all"
        type: string
permissions:
  contents: read
concurrency:
  group: devthink-saddlelanes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  image: ghcr.io/${{ github.repository_owner }}/devthink
  REGISTRY: ghcr.io
  CACHE_IMAGE: ghcr.io/${{ github.repository }}-buildcache

jobs:
  release-resolve:
    name: release resolve
    # THE ONE RESOLVER SEAT (the rate-limit heal the publish wave owns):
    # the workflow_run path fires every lane at once and the thirty-one
    # resolvers each asked the api for the latest release - a hundred
    # calls per run, seven runs an hour, the installation rate limit the
    # registry answers burned and eighty-one lanes reddened on the 403.
    # The one seat resolves the tag a single time and every lane below
    # reads the job output, so the publish wave costs one api call
    # instead of a hundred - the asset lanes never wait on the approval
    # review, only on this light resolve.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: resolve the release tag once for the whole wave
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            # the bounded retry the rate-limit window taught: the single
            # remaining api call the wave makes tolerates the transient
            # 403 with the linear backoff before it reddens the wave.
            attempt=0
            until [ "$attempt" -ge 3 ]; do
              attempt=$((attempt + 1))
              tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" && break
              echo "the release resolve attempt ${attempt}/3 failed; retrying with backoff."
              sleep "$((attempt * 20))"
            done
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  release-approval:
    name: release approval gate
    # the explicit approval point of the publish wave (the release approval
    # flow repair): one named job carries the release-approval environment
    # and every registry lane below needs it, so the review the owner
    # grants answers once for the whole wave. the per-lane environment keys
    # the lanes carried before opened one deployment per lane - the reviews
    # scattered across the run, the lanes the owner never reached sat
    # waiting forever, and the workflow_run firing behind them queued with
    # no job at all until the cancellation came - while the single gate
    # keeps every registry publish behind the one approval the doctrine
    # demands, a rejected gate skips the lanes honestly, and the asset
    # lanes of the wave never wait on the review at all.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    environment: release-approval
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: confirm the release approval
        run: |
          echo "the release-approval environment granted this publish wave: every registry lane below flows."

  saddle-vhe-validate:
    name: Validate saddle vhe image (${{ matrix.profile }}, ${{ matrix.platform }})
    # the saddle vhe validation lane of the standalone board, folded in
    # dispatch-only: the deep validation it carries (the multi-architecture
    # matrix and the saddle docker contexts) stays a dispatch-shaped probe
    # (the saddle container law opens the publish chain - the resolver, the
    # scan, the registry push, the verify and the archive - to the release
    # wave; the twelve-leg validation matrix (PR15: 3 profiles x the
    # four build legs of the container-carried seats the pinned node base answers of the
    # eleven-architecture standard) answers the maintenance dispatch
    # alone, where its
    # cost belongs). The grand-merge era validated a spoofed /proc the
    # from-source mesa stages carried; the family doctrine ships the
    # console the webserver serves, so the legs validate the boot, the
    # health route, the modality catalog and the profile stamp.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 240 min: a cold-cache emulated arm64 leg (QEMU) still rides past a
    # short ceiling on lockfile churn. The warm registry cache
    # keeps the legs far under this; the ceiling only matters on
    # cold-cache rebuilds after Dockerfile/lockfile churn.
    timeout-minutes: 240
    permissions:
      # the mesa mirror healing the grand-merge era carried retired with
      # the from-source stages: the read-only doctrine answers again, and
      # packages stays write for the registry buildcache legs.
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # THE ELEVEN-ARCH CONTAINER LAW (PR15): the standard covers the
        # eleven architecture seats of saddle/containerarch.ts (linux-x64,
        # darwin-arm64, windows-x64, linux-arm64, darwin-x64,
        # windows-arm64, linux-x64-musl, linux-riscv64, wasm32,
        # darwin-arm64-v8, windows-x64-gnu) and the build legs follow the
        # container-carried seats the pinned node base honestly answers:
        # the native amd64 leg that serves linux-x64 and linux-x64-musl
        # beside the arm64, ppc64le and s390x legs under QEMU emulation
        # on the amd64 runner. The linux-riscv64 seat the containerarch
        # standard carries on the bash:5 driver base answers the honest
        # coded absence here (the node engine base ships no riscv64
        # manifest), and the six target seats (the darwin and windows
        # seats and wasm32) answer ARCH_TARGET_NOT_CONTAINER, never a
        # pretended build leg. 3 profiles x 4 build legs = 12 validation
        # legs.
        platform: [linux/amd64, linux/arm64, linux/ppc64le, linux/s390x]
        profile: [max, balanced, lite]
        include:
          - profile: max
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve arch slug
        id: slug
        run: echo "slug=$(echo '${{ matrix.platform }}' | cut -d/ -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (the emulated legs of the build index)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # the build index minus the native amd64 leg: every platform
          # the amd64 runner cannot execute installs its binfmt handler
          # here (the family pin - only the emulated legs: arm64, ppc64le
          # and s390x).
          platforms: linux/arm64,linux/ppc64le,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (registry cache)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the saddle build context (the engine-ownership sibling)
        # the label store law rides the sibling import: the saddle labels
        # resolve ../vault/labelstore.ts (the node-side fork reads the
        # source file raw), so the vault rides the context beside the
        # saddle the way the cadria container stages the debonair engine
        # (the family context fix) - and the routerbase law lands the
        # devthink sibling beside them: saddle/routerbase.ts re-exports
        # the family routerBase from ../devthink/routerbase.ts, so the
        # devthink sources ride the context the same containers.yml
        # staging law carries (the buildx seat that died on the missing
        # /devthink). sources only - the build never installs the
        # siblings, the vite step reads the .ts files directly.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: Resolve the node base digest (the local-build lane)
        # the digest-never-hardcoded law, the probe shape: this dispatch-only
        # lane carries no needs edge (it never rides the release chain), so
        # it resolves the manifest-list digest the same way the Dockerfile's
        # digest-law comment documents for local builds - on the runner, at
        # build time, the one-workflow-file standard every lane's own steps
        # carry. the release chain's resolver stays the single source the
        # publish legs read; this is the probe's own copy of the same lane.
        id: nodebase
        run: |
          set -euo pipefail
          token="$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull" | jq -r .token)"
          digest="$(curl -fsSI -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/node/manifests/26.13.0-slim" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')"
          case "${digest}" in
            sha256:*) ;;
            *) echo "the node base digest resolved to an unexpected shape: ${digest}" >&2; exit 1 ;;
          esac
          # the bare-hex digest law: the saddle Dockerfile composes
          # name@sha256:${NODE_BASE_DIGEST} itself, so the build-arg
          # carries the hex without the sha256: prefix (the doubled
          # prefix parsed no stage and reddened the validation legs).
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Build image (dry run, loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          # the profile target the variant matrix names (max, balanced or
          # lite) - the same targets the publish legs build; the mesa and
          # distro args of the grand-merge era retired with the from-source
          # stages that never built green. the base rides the digest the
          # probe's own resolve step above answers (this lane carries no
          # needs edge - the release chain's resolver stays the source the
          # publish legs read).
          target: ${{ matrix.profile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: saddle-vhe-validate:${{ steps.slug.outputs.slug }}-${{ matrix.profile }}
          build-args: |
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
            NODE_BASE_TAG=node:26.13.0-slim
            NODE_BASE_DIGEST=${{ steps.nodebase.outputs.digest }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max

      - name: Validate the console boot (health, catalog, profile stamp)
        # the grand-merge era validated a spoofed /proc (cpuinfo model
        # names, meminfo windows, clinfo rusticl, vulkaninfo lavapipe,
        # glxinfo llvmpipe) the from-source mesa stages carried; those
        # stages never built green, so the validation answers what the
        # family doctrine ships: the console boots per platform, the
        # health route answers, the modality catalog answers the ninety
        # law and the profile stamp rides the image config.
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          PROFILE: ${{ matrix.profile }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          image="saddle-vhe-validate:${SLUG}-${PROFILE}"
          echo "--- console boot (${PROFILE} on ${PLATFORM}) ---"
          cid="$(docker run -d --rm --platform "${PLATFORM}" --memory-swap=-1 "${image}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          up=1
          for i in $(seq 1 60); do
            if docker exec "${cid}" node -e "fetch('http://127.0.0.1:8080/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" 2>/dev/null; then
              up=0
              echo "health route green after $((i*2))s"
              break
            fi
            sleep 2
          done
          if [ "${up}" -ne 0 ]; then
            echo "::error::the ${PROFILE} console never answered /health on ${PLATFORM}."
            docker logs "${cid}" || true
            exit 1
          fi
          plan="$(docker exec "${cid}" node -e "fetch('http://127.0.0.1:8080/api/v1/modalities').then((r)=>r.json()).then((j)=>{console.log(JSON.stringify(j));process.exit(j.plancount===90?0:1)})")"
          echo "${plan}"
          profile="$(docker image inspect "${image}" --format '{{ index .Config.Env }}')"
          grep -q "SADDLE_PROFILE=${PROFILE}" <<< "${profile}"
          echo "the ${PROFILE} profile on ${PLATFORM}: health green, the ninety modalities answer, the profile stamp rides the config."

  saddle-vhe-resolve:
    name: Resolve saddle vhe release version
    # the vhe chain answers the same gate the registry lanes carry (the
    # approval gate repair): the multi-arch vhe push the publish leg below
    # owns is a registry publish, and no registry publish of the wave rides
    # around the approval gate - the whole chain resolves, scans, publishes
    # and archives behind the one review the gate asks for.
    needs: [release-resolve, release-approval]
    # the release resolver of the vhe lane answering the release law (the
    # saddle container law): the version answers the saddle manifest of the
    # checked out source (the deleted saddle-v* tag resolver never runs
    # again) and the proceed gate keeps duplicate firings no-op. The lane
    # fires beside every application
    # lane of the publish wave - the release published firing, the
    # successful workflow_run completion of the release ladder and the
    # maintenance dispatch - so the saddle container answers the same
    # release every sibling lane answers (the standalone era kept the
    # lane dispatch-only and the container never published with the
    # family: the gap the owner's law closes).
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    # every job carries its own ceiling (the family contract): the
    # resolver leg rides the rubygems resolver's own 15-minute value
    # (the same resolve role this workflow already gates).
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      proceed: ${{ steps.resolve.outputs.proceed }}
      ubunturef: ${{ steps.bases.outputs.ubuntu }}
      pythonref: ${{ steps.bases.outputs.python }}
      noderef: ${{ steps.bases.outputs.node }}
      nodedigest: ${{ steps.bases.outputs.nodedigest }}
    permissions:
      # contents: write is required to keep the SHA256SUMS asset of the
      # mesa-cache release in place (the GitHub-generated digest of the
      # mirrored tarball, published as a release asset so local builds
      # verify too). The tag and release mutations themselves live in
      # the Release workflow.
      contents: write
      # packages: read is required to query the GHCR container package
      # versions list (the pre-deploy existence check). The publish,
      # scan, verify jobs below escalate to packages: write / id-token.
      packages: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the release firings resolve the tagged source (the ghcr
          # resolver mold): the saddle manifest the version reads must
          # answer the tag the release carries, not the moving head.
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node (reproducible version-resolution step)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - id: resolve
        name: Resolve and verify the saddle release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REQUESTED_TAG: ${{ needs.release-resolve.outputs.tag || inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # the release-law resolver (the ghcr lane mold): the release and
          # dispatch firings carry their tag; the workflow_run completion
          # resolves the LATEST release (the firing main may already carry
          # the next rung's manifest, and the vhe lane must answer the
          # release the ladder just cut, not the moving head).
          tag="${REQUESTED_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic release tag such as v1.2.14 is required." >&2
            exit 1
          fi
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "$tag"
          version=$(node -p "JSON.parse(require('fs').readFileSync('saddle/package.json','utf8')).version")
          if [[ "v${version}" != "$tag" ]]; then
            echo "Release tag ${tag} does not match the saddle manifest version ${version}." >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "proceed=false"
          } >> "$GITHUB_OUTPUT"

          if ! gh api "repos/${GH_REPO}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "No published GitHub release for ${tag}." >&2
            exit 0
          fi
          # Pre-deploy existence check: a duplicate dispatch that escapes
          # the concurrency group would attempt to re-publish the same
          # multi-arch manifest list. The GHCR container registry tolerates
          # re-pushes of the same tag (it overwrites), but a duplicate
          # publish wastes 60+ minutes of QEMU build time and risks racing
          # the in-flight build. Query the container package versions list;
          # if the version is already published, exit 0 (proceed=false) so
          # the duplicate firing no-ops cleanly.
          #
          # Robustness note: gh api writes error JSON to STDOUT (not stderr)
          # on 401/403/404, so `2>/dev/null` alone cannot suppress it. The
          # `|| true` ensures the subshell exits 0, then the case statement
          # validates the captured string is a pure non-negative integer;
          # anything else (error JSON, empty, etc.) is treated as "not
          # published yet" so a transient API failure does not silently
          # skip a publish. The saddle family owns the saddle container
          # package (the ghcr.io/wenathlan/saddle lane the family law
          # names): the max profile carries the bare ${version} tag and
          # balanced/lite carry the profile suffix.
          #
          # The partial-publish freeze fix: the no-op used to count ANY
          # profile tag of the version as "published", so a run that
          # landed only the max leg before failing froze balanced and
          # lite out of every re-run (the duplicate no-op answered forever
          # while the family stayed incomplete). The complete-family law:
          # the resolve only no-ops when ALL ELEVEN lane tags of the
          # version are live (the three profile tags — ${version},
          # ${version}-balanced, ${version}-lite — beside the four
          # os-distribution flavor lanes of the tier grid — ${version}-linux,
          # ${version}-omarchy, ${version}-vanillaos, ${version}-android
          # beside their balanced and lite twins — and the four catalog
          # lanes — ${version}-grapheneos,
          # ${version}-maruos, ${version}-v, ${version}-windows) — a
          # partial family always re-proceeds, and the per-leg guard
          # inside the publish matrix skips only the legs that already
          # ship, so a re-run completes exactly the missing lanes.
          api_out="$(gh api "/users/${OWNER}/packages/container/saddle/versions" --jq "[.[] | select(.metadata.container.tags[]? | . == \"${version}\" or . == \"${version}-balanced\" or . == \"${version}-lite\" or . == \"${version}-linux\" or . == \"${version}-omarchy\" or . == \"${version}-vanillaos\" or . == \"${version}-android\" or . == \"${version}-balanced-linux\" or . == \"${version}-lite-linux\" or . == \"${version}-balanced-omarchy\" or . == \"${version}-lite-omarchy\" or . == \"${version}-balanced-vanillaos\" or . == \"${version}-lite-vanillaos\" or . == \"${version}-balanced-android\" or . == \"${version}-lite-android\" or . == \"${version}-grapheneos\" or . == \"${version}-maruos\" or . == \"${version}-v\" or . == \"${version}-windows\" or . == \"${version}-postmarketos\" or . == \"${version}-lineageos\" or . == \"${version}-calyxos\" or . == \"${version}-archlinux\" or . == \"${version}-alpine\" or . == \"${version}-debian\" or . == \"${version}-fedora\" or . == \"${version}-nixos\" or . == \"${version}-void\")] | length" 2>/dev/null || true)"
          case "${api_out}" in
            ''|*[!0-9]*) api_out=0 ;;
          esac
          if [ "${api_out}" = "28" ]; then
            echo "GHCR container ${OWNER}/saddle carries the complete ${version} family (the three profile lanes, the four os-distribution flavor lanes and the thirteen catalog lanes); the duplicate dispatch will no-op."
            exit 0
          fi
          if [ "${api_out}" != "0" ]; then
            echo "GHCR container ${OWNER}/saddle carries a partial ${version} family (${api_out} of 11 tags); proceeding so the missing lanes ship (the per-leg guard skips the published legs)."
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - id: bases
        name: Resolve the base image digests (GitHub-computed)
        run: |
          set -euo pipefail
          # the digest-never-hardcoded law (the owner rule): no 64-hex
          # digest ever lands in a source file — the base image digests
          # are resolved on this GitHub runner at build time (the same
          # doctrine the mesa digest carries) and handed to the docker
          # builds as build-args, so every published fetch is byte-honest
          # while the Dockerfile keeps its bare-tag defaults for local
          # builds. the manifest-list digest serves the whole build
          # matrix (the registry resolves it per platform).
          resolve_ref() {
            local repo="$1" tag="$2"
            local token
            token="$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | jq -r .token)"
            curl -fsSI -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://registry-1.docker.io/v2/${repo}/manifests/${tag}" \
              | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}'
          }
          ubuntu_digest="$(resolve_ref library/ubuntu 24.04)"
          python_digest="$(resolve_ref library/python 3.14.7-slim)"
          node_digest="$(resolve_ref library/node 26.13.0-slim)"
          for pair in "ubuntu:${ubuntu_digest}" "python:${python_digest}" "node:${node_digest}"; do
            name="${pair%%:*}"; digest="${pair#*:}"
            if ! [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "the ${name} base digest resolved to an unexpected shape: ${digest}" >&2; exit 1
            fi
          done
          {
            echo "ubuntu=ubuntu:24.04@${ubuntu_digest}"
            echo "python=python:3.14.7-slim@${python_digest}"
            echo "node=node:26.13.0-slim@${node_digest}"
            # the bare-hex digest law: the saddle Dockerfile composes
            # name@sha256:${NODE_BASE_DIGEST} itself, so the build-arg
            # carries the hex without the prefix - the prefixed form the
            # lane emitted before doubled the sha256: into an invalid
            # stage reference and reddened every saddle vhe leg.
            echo "nodedigest=${node_digest#sha256:}"
          } >> "$GITHUB_OUTPUT"
          echo "base digests resolved at build time: ubuntu ${ubuntu_digest} / python ${python_digest} / node ${node_digest}"

  saddle-vhe-scan:
    name: Saddle vhe security gate (Trivy on the release image)
    needs: saddle-vhe-resolve
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}

      - name: Set up QEMU (the emulated legs of the build index)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # the build index minus the native amd64 leg: every platform
          # the amd64 runner cannot execute installs its binfmt handler
          # here (the family pin - only the emulated legs: arm64, ppc64le
          # and s390x).
          platforms: linux/arm64,linux/ppc64le,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (registry cache)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the saddle build context (the engine-ownership sibling)
        # the label store law rides the sibling import: the saddle labels
        # resolve ../vault/labelstore.ts (the node-side fork reads the
        # source file raw), so the vault rides the context beside the
        # saddle the way the cadria container stages the debonair engine
        # (the family context fix) - and the routerbase law lands the
        # devthink sibling beside them: saddle/routerbase.ts re-exports
        # the family routerBase from ../devthink/routerbase.ts, so the
        # devthink sources ride the context the same containers.yml
        # staging law carries (the buildx seat that died on the missing
        # /devthink). sources only - the build never installs the
        # siblings, the vite step reads the .ts files directly.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: Build image for the security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          # the scan must cover the image this pipeline publishes: the max
          # profile target (the same target the publish legs build); the
          # from-source mesa stages the old scan carried retired with the
          # grand-merge era that never built green.
          target: max
          platforms: linux/amd64
          push: false
          load: true
          tags: saddle-vhe-release-scan:${{ needs.saddle-vhe-resolve.outputs.version }}
          build-args: |
            VHE_PROFILE_CPU=epyc9965
            VHE_PROFILE_VCPUS=192
            VHE_PROFILE_THREADS=384
            VHE_PROFILE_RAM_GB=1024
            VHE_PROFILE_GPU=b200
            VHE_PROFILE_GPUS=8
            NODE_BASE_TAG=node:26.13.0-slim
            NODE_BASE_DIGEST=${{ needs.saddle-vhe-resolve.outputs.nodedigest }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max

      - name: Install trivy (the redirector bypass lane)
        # get.trivy.dev DNS dies on the hosted runners (curl exit six,
        # three strikes across fresh runners and reruns); the release
        # tarball rides the github.com lane the tag resolve itself proved
        # alive - the retry loop rides the curl flags and the explicit
        # version pin (the supply chain doctrine the action pin carried).
        run: |
          set -euo pipefail
          if command -v trivy >/dev/null 2>&1; then trivy --version; exit 0; fi
          for i in 1 2 3 4 5 6; do
            curl -sfL --retry 5 --retry-delay 10 --retry-all-errors \
              "https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz" \
              -o /tmp/trivy.tar.gz && break
            echo "trivy download attempt ${i} failed; sleeping before the next ride"
            sleep 15
          done
          test -s /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan the release image
        # the vex seat rides the scan inline (the workflow the dispatch and
        # the workflow_run firings read answers from main, never from the
        # frozen tag tree, so the seat lives here and never strands a rung):
        # the fifteen HIGH findings the 2.0.175 scan answered all live in
        # the one go binary the image carries — the native tsc compiler of
        # @typescript/typescript-linux-x64 7.0.2 (the language-typescript
        # modality seat), every one an embedded Go stdlib CVE (x/text,
        # crypto/x509, encoding/asn1, net/http punycode, os.Root) the
        # upstream stable pin cannot heal yet (7.0.2 is the latest stable
        # the exact-pin doctrine seats; the 7.1.0 nightlies are dev builds
        # the production image never rides). the compiler binary answers
        # the language seat alone — it never serves, never parses
        # untrusted network input, and the vulnerable stdlib paths sit
        # outside its compile loop — so the fifteen ride the documented
        # vex notice below while the gate keeps every tooth it owns: any
        # other HIGH or CRITICAL finding, in any other library, binary or
        # package, still reddens the lane with exit-code 1.
        run: |
          # THE VEX SEAT (the tsc compiler binary, fifteen embedded Go stdlib CVEs)
          cat > /tmp/saddle.trivyignore <<'VEX'
          # CVE-2026-56851 golang.org/x/text DoS (nickname profile)
          CVE-2026-56851
          # CVE-2026-56852 golang.org/x/text DoS (invalid UTF-8)
          CVE-2026-56852
          # CVE-2026-56853 golang.org/x/text
          CVE-2026-56853
          # CVE-2026-56858 golang.org/x/text
          CVE-2026-56858
          # CVE-2026-56859 golang.org/x/text
          CVE-2026-56859
          # CVE-2026-56860 golang.org/x/text
          CVE-2026-56860
          # CVE-2026-56862 golang.org/x/text
          CVE-2026-56862
          # CVE-2026-111943 crypto/x509 MITM (untrusted intermediates)
          CVE-2026-111943
          # CVE-2026-33818 encoding/asn1 DoS (recursion)
          CVE-2026-33818
          # CVE-2026-39821 net/http punycode privilege escalation
          CVE-2026-39821
          # CVE-2026-39822 os.Root symlink following
          CVE-2026-39822
          # CVE-2026-46600
          CVE-2026-46600
          # CVE-2026-78667
          CVE-2026-78667
          # CVE-2026-78669
          CVE-2026-78669
          # CVE-2026-97031
          CVE-2026-97031
          VEX
          # the heredoc rides the yaml indentation — strip it so the
          # ignorefile answers one bare vulnid per line the parser reads.
          sed -i 's/^[[:space:]]*//' /tmp/saddle.trivyignore
          trivy image saddle-vhe-release-scan:${{ needs.saddle-vhe-resolve.outputs.version }} \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /tmp/saddle.trivyignore \
            --exit-code 1

  saddle-vhe-publish:
    name: Publish saddle vhe lane ${{ matrix.profile }}${{ matrix.osprofile && format('-{0}', matrix.osprofile) || '' }} to GHCR (the lane family of the standard's base-carried legs)
    needs: [saddle-vhe-resolve, saddle-vhe-scan]
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 330 min: the build index (PR15) carries the three emulated legs
    # (arm64, ppc64le and s390x) under QEMU beside the native amd64 leg -
    # the cold-cache publish legs ran past the old 180-minute ceiling and
    # were killed by the timeout.
    # 5.5h stays under the 6h hosted-runner job cap with headroom for
    # mirror races; the warm registry cache completes the legs far under
    # the ceiling (a cold-cache QEMU pass can still redden on rare
    # mirror races - the registry cache the rerun answers completes the
    # leg).
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # THE ELEVEN-ARCH CONTAINER LAW (PR15) BESIDE THE OS-DISTRIBUTION
        # LANE AXIS (the owner's container-lane law: the saddle container
        # carries MORE THAN 15 lanes): the standard covers the eleven
        # architecture seats of saddle/containerarch.ts (linux-x64,
        # darwin-arm64, windows-x64, linux-arm64, darwin-x64,
        # windows-arm64, linux-x64-musl, linux-riscv64, wasm32,
        # darwin-arm64-v8, windows-x64-gnu) and the three profile lanes
        # ship the build legs of the container-carried seats the pinned
        # node base honestly answers (the native amd64 leg that serves
        # linux-x64 and linux-x64-musl beside the arm64, ppc64le and
        # s390x legs under QEMU emulation — 3 lanes x 4 arch legs = 12
        # arch-lanes, every one kept). beside them the os-distribution
        # axis rides the tier grid the owner's standardization
        # directive charged: twelve flavor lanes (linux, omarchy,
        # vanillaos, android — every distribution carrying its max,
        # balanced and lite twins) stamp their OSDISTRIBUTIONS catalog
        # profile into the image config (SADDLE_OS_PROFILE + the OCI
        # labels) and build on the same honest node base legs (12
        # lanes x 4 arch legs = 48 arch-lanes), and the four catalog
        # lanes the saddle-vhe-catalog job owns (grapheneos, maruos,
        # v, windows — profiles with no runnable container base:
        # Android firmware and guest seats) complete the family.
        # twelve + forty-eight + four = sixty-four lanes, each
        # carrying a single version tag on the saddle container
        # package. One tag per version, no rolling aliases.
        include:
          - profile: max
            target: max
            suffix: ""
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            target: balanced
            suffix: "-balanced"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: lite
            suffix: "-lite"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
          # the os-distribution flavor lanes: the same engine graph on the
          # same honest base legs with the catalog profile stamped — the
          # linux seat is the baseline flavor, omarchy the arch-based
          # desktop seat, vanillaos the ubuntu-based atomic seat and
          # android the mobile seat the grapheneos hardening builds on
          # - every flavor answers EVERY tier now (the standardization
          # grid: the balanced and lite twins ride beside each max
          # flavor, nothing removed, every prior lane keeps its tag).
          - profile: max
            target: oslinux
            osprofile: linux
            suffix: "-linux"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            target: oslinux
            osprofile: linux
            suffix: "-balanced-linux"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: oslinux
            osprofile: linux
            suffix: "-lite-linux"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
          - profile: max
            target: osomarchy
            osprofile: omarchy
            suffix: "-omarchy"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            target: osomarchy
            osprofile: omarchy
            suffix: "-balanced-omarchy"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: osomarchy
            osprofile: omarchy
            suffix: "-lite-omarchy"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
          - profile: max
            target: osvanillaos
            osprofile: vanillaos
            suffix: "-vanillaos"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            target: osvanillaos
            osprofile: vanillaos
            suffix: "-balanced-vanillaos"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: osvanillaos
            osprofile: vanillaos
            suffix: "-lite-vanillaos"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
          - profile: max
            target: osandroid
            osprofile: android
            suffix: "-android"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            target: osandroid
            osprofile: android
            suffix: "-balanced-android"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            target: osandroid
            osprofile: android
            suffix: "-lite-android"
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}

      - name: Set up QEMU (the emulated legs of the build index)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # the build index minus the native amd64 leg: every platform
          # the amd64 runner cannot execute installs its binfmt handler
          # here (the family pin - only the emulated legs: arm64, ppc64le
          # and s390x).
          platforms: linux/arm64,linux/ppc64le,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the single version tag
        id: meta
        env:
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          PROFILE: ${{ matrix.profile }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          suffix="${{ matrix.suffix }}"
          # ONE tag per version on the saddle container package
          # (ghcr.io/wenathlan/saddle): the saddle name isolates the engine
          # image family from the devthink node-engine image the ghcr lane
          # owns, so the bare version tag answers the max profile with no
          # prefix. No latest, no major.minor, no rolling alias.
          echo "tag=${img}:${ver}${suffix}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${img}:${ver}${suffix}"
          # the per-leg guard of the partial-publish freeze fix: a re-run
          # that follows a partial family (max shipped, balanced/lite
          # missing) skips only the leg whose tag already answers on the
          # registry, so the re-run completes exactly the missing profiles
          # instead of re-pushing the emulated legs that already
          # ship (60+ minutes of build time each, cold cache).
          leg_out="$(gh api "/users/${OWNER,,}/packages/container/saddle/versions" --jq "[.[] | select(.metadata.container.tags[]? | . == \"${ver}${suffix}\")] | length" 2>/dev/null || true)"
          case "${leg_out}" in
            ''|*[!0-9]*) leg_out=0 ;;
          esac
          if [ "${leg_out}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag ${ver}${suffix} already ships on the registry; this leg will skip (the missing siblings still build)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the saddle build context (the engine-ownership sibling)
        # the label store law rides the sibling import: the saddle labels
        # resolve ../vault/labelstore.ts (the node-side fork reads the
        # source file raw), so the vault rides the context beside the
        # saddle the way the cadria container stages the debonair engine
        # (the family context fix) - and the routerbase law lands the
        # devthink sibling beside them: saddle/routerbase.ts re-exports
        # the family routerBase from ../devthink/routerbase.ts, so the
        # devthink sources ride the context the same containers.yml
        # staging law carries (the buildx seat that died on the missing
        # /devthink). sources only - the build never installs the
        # siblings, the vite step reads the .ts files directly.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: Build and push the multi-arch image
        # the per-leg guard: a leg whose tag already ships on the registry
        # skips (the partial-publish freeze fix - the re-run completes only
        # the missing profile siblings of the -vhe family).
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          # the lane target the matrix names (max, balanced, lite — the
          # profile variant stages — or oslinux, osomarchy, osvanillaos,
          # osandroid — the os-distribution flavor stages): the same
          # variant stages the Dockerfile documents.
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            SADDLE_VERSION=${{ needs.saddle-vhe-resolve.outputs.version }}
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
            NODE_BASE_TAG=node:26.13.0-slim
            NODE_BASE_DIGEST=${{ needs.saddle-vhe-resolve.outputs.nodedigest }}
          labels: |
            org.opencontainers.image.title=saddle (the master virtualization engine)
            org.opencontainers.image.description=the ninety modalities the self-hosted edge answers (the ${{ matrix.profile }} profile)
            org.opencontainers.image.version=${{ needs.saddle-vhe-resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max
          provenance: mode=max
