    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect index and smoke test the console (the runnable lanes)
        if: matrix.mode == 'runnable'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/saddle
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          PROFILE: ${{ matrix.profile }}
          EXPECTOSPROFILE: ${{ matrix.expectosprofile }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE,,}:${VERSION}${SUFFIX}"
          # Every published profile index must carry the build surface of
          # the eleven-arch standard (PR15: the four container-carried
          # legs the pinned node base honestly answers - the native amd64
          # leg that serves linux-x64 and linux-x64-musl beside the
          # arm64, ppc64le and s390x legs under QEMU; the linux-riscv64
          # seat the bash:5 driver base carries answers the honest coded
          # absence on the node engine base, and the six target seats
          # answer ARCH_TARGET_NOT_CONTAINER, never a pretended build
          # leg).
          echo "inspecting ${image_ref}"
          docker buildx imagetools inspect --raw "${image_ref}" | jq -e '
            [
              .manifests[]
              | select(.platform.os == "linux")
              | if .platform.variant then "\(.platform.architecture)/\(.platform.variant)" else .platform.architecture end
            ]
            | sort
            | . == ["amd64", "arm64", "ppc64le", "s390x"]
          '
          docker pull --quiet --platform linux/amd64 "${image_ref}"
          actual_version="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "${actual_version}" = "${VERSION}"
          # the console smoke the family doctrine ships (the grand-merge
          # era asserted a spoofed /proc the from-source stages carried):
          # the published image boots, the health route answers and the
          # modality catalog answers the ninety law.
          cid="$(docker run -d --rm --platform linux/amd64 "${image_ref}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          up=1
          for _ in $(seq 1 30); do
            if docker exec "${cid}" node -e "fetch('http://127.0.0.1:8080/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" 2>/dev/null; then
              up=0
              break
            fi
            sleep 2
          done
          if [ "${up}" -ne 0 ]; then
            echo "::error::the published ${image_ref} never answered /health."
            docker logs "${cid}" || true
            exit 1
          fi
          plan="$(docker exec "${cid}" node -e "fetch('http://127.0.0.1:8080/api/v1/modalities').then((r)=>r.json()).then((j)=>{console.log(JSON.stringify(j));process.exit(j.plancount===90?0:1)})")"
          echo "${plan}"
          profile="$(docker image inspect "${image_ref}" --format '{{ index .Config.Env }}')"
          grep -q "SADDLE_PROFILE=${PROFILE}" <<< "${profile}"
          # the os-distribution flavor lanes stamp their catalog seat beside
          # the plan profile (SADDLE_OS_PROFILE): the flavor legs assert it,
          # the bare profile lanes carry no seat stamp.
          if [ -n "${EXPECTOSPROFILE}" ]; then
            grep -q "SADDLE_OS_PROFILE=${EXPECTOSPROFILE}" <<< "${profile}"
          fi
          echo "published ${image_ref} verified: the four base-carried legs of the eleven-arch index (${PROFILE}${EXPECTOSPROFILE:+, the ${EXPECTOSPROFILE} os-distribution seat}), version label ${VERSION}, health green, the ninety modalities answer, the profile stamps ride the config"

      - name: Verify the catalog lane (the no-base os-distribution seats)
        # the scratch manifest lanes never pretend a boot: the verify reads
        # the published config — the catalog labels, the version stamp and
        # the embedded profile row the osprofiles catalog answers (id,
        # kind, base, archs) — through docker image inspect and the
        # extracted json, the honest grammar a profile with no runnable
        # container base carries.
        if: matrix.mode == 'catalog'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/saddle
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          EXPECTOSPROFILE: ${{ matrix.expectosprofile }}
          EXPECTTIER: ${{ matrix.expecttier }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE,,}:${VERSION}${SUFFIX}"
          echo "inspecting the catalog lane ${image_ref} (the ${EXPECTTIER} tier)"
          docker pull --quiet "${image_ref}"
          actual_version="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "${actual_version}" = "${VERSION}"
          title="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')"
          grep -q "catalog lane" <<< "${title}"
          cid="$(docker create "${image_ref}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/saddle/osprofile.json" ./osprofile.json
          jq -e --arg seat "${EXPECTOSPROFILE}" '.id == $seat and (.kind | length > 0) and (.base | length > 0) and (.archs | length > 0)' ./osprofile.json
          stamp="$(docker image inspect "${image_ref}" --format '{{ index .Config.Env }}')"
          grep -q "SADDLE_OS_PROFILE=${EXPECTOSPROFILE}" <<< "${stamp}"
          grep -q "SADDLE_PROFILE=${EXPECTTIER}" <<< "${stamp}"
          echo "published ${image_ref} verified: the ${EXPECTOSPROFILE} catalog lane carries the profile row (kind, base, archs), the version label ${VERSION}, the seat stamp and the ${EXPECTTIER} tier stamp — no runnable base pretended."

  saddle-vhe-cleanup:
    name: Clean the saddle vhe run caches
    needs: [saddle-vhe-validate]
    # the cache sweeper of the validation lane: the dispatch is the only
    # event the validate legs answer. The vhe lanes cache in the registry
    # buildcache image (cache-to: type=registry on every build leg), so
    # the buildkit-prefixed gha caches this sweeper walks are the
    # standalone-era stragglers - the sweep stays the honest hygiene the
    # consolidated house keeps beside the dispatch probe, never a gate
    # the publish chain depends on.
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete the caches this pipeline created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deleted=0
          while IFS=$'\t' read -r cache_id cache_key; do
            test -n "$cache_id" || continue
            if gh api --method DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" 2>/dev/null; then
              deleted=$((deleted + 1))
              echo "deleted cache id=${cache_id} key=${cache_key}"
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | startswith("buildkit")) | [.id, .key] | @tsv')
          echo "cleanup: deleted ${deleted} buildkit gha caches."

  saddle-container:
    name: saddle container release archive
    # THE SADDLE CONTAINER LAW (the asset parity the owner demands): the
    # saddle vhe image answers the same release the devthink container
    # archive answers - the standalone era left the saddle container
    # without a release asset (the registry push alone, and dispatch-only
    # at that), so the person who downloads the release could load every
    # sibling container except the saddle one. The lane builds the max
    # profile image the registry lane publishes (the same profile target,
    # the same args the publish legs answer), saves the portable tar.gz
    # an operator loads with `docker load`, and rides behind the security
    # gate the registry push answers (a FAILED trivy scan never ships an
    # archive).
    needs: [saddle-vhe-resolve, saddle-vhe-scan]
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    # the native amd64 leg answers the archive pass after the QEMU
    # builds, riding the same 90-minute ceiling the family container
    # archive carries scaled to the node graph the runtime bakes.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}
      - name: Stage the saddle build context (the engine-ownership sibling)
        # the same staged tree the vhe lanes build: the saddle nested under
        # saddle/ with the vault and devthink sources beside it (the
        # node-side label import resolves ../vault/labelstore.ts and the
        # routerbase re-export resolves ../devthink/routerbase.ts inside
        # the build).
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore

      - name: build the saddle vhe container
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/saddle:${{ needs.saddle-vhe-resolve.outputs.version }}
        # the max profile the registry lane publishes (the Dockerfile
        # defaults bake the same constants; the args stay explicit the
        # saddle family way) and the same context the vhe lanes build
        # (the saddle application folder with the vault and devthink
        # siblings).
        run: |
          set -euo pipefail
          archive="saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}.tar.gz"
          docker build \
            --target max \
            --build-arg SADDLE_VERSION="${{ needs.saddle-vhe-resolve.outputs.version }}" \
            --build-arg VHE_PROFILE_CPU="epyc9965" \
            --build-arg VHE_PROFILE_VCPUS="192" \
            --build-arg VHE_PROFILE_THREADS="384" \
            --build-arg VHE_PROFILE_RAM_GB="1024" \
            --build-arg VHE_PROFILE_GPU="b200" \
            --build-arg VHE_PROFILE_GPUS="8" \
            --build-arg NODE_BASE_TAG="node:26.13.0-slim" \
            --build-arg NODE_BASE_DIGEST="${{ needs.saddle-vhe-resolve.outputs.nodedigest }}" \
            --tag "$IMAGE" -f saddlebuildctx/saddle/Dockerfile saddlebuildctx
          docker save "$IMAGE" | gzip -9 > "$archive"
      - name: checksum and manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.saddle-vhe-resolve.outputs.version }}"
          archive="saddle.container.${version}.tar.gz"
          checksums="sha256.saddle.container.${version}"
          manifest="manifest.saddle.container.${version}.json"
          sha256sum "$archive" > "$checksums"
          printf '{\n  "version": "%s",\n  "platform": "container",\n  "image": "ghcr.io/%s:%s",\n  "archive": "%s",\n  "signing": "caller-owned"\n}\n' \
            "$version" "${{ github.repository_owner }}/saddle" "$version" "$archive" > "$manifest"
      - name: upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}
          path: |
            saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}.tar.gz
            sha256.saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}
            manifest.saddle.container.${{ needs.saddle-vhe-resolve.outputs.version }}.json
          if-no-files-found: error
      - name: attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.saddle-vhe-resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${{ needs.saddle-vhe-resolve.outputs.version }}"
          gh release upload "$RELEASE_TAG" \
            "saddle.container.${version}.tar.gz" \
            "sha256.saddle.container.${version}" \
            "manifest.saddle.container.${version}.json" --clobber
      - name: Patch the SHA256SUMS umbrella with the archive seat
        # the half-megabyte split moved this archive off the publish
        # workflow's sums umbrella — the row answers here instead: the
        # existing umbrella downloads, the old row for this asset
        # retires, the fresh checksum rides the re-upload (the umbrella
        # keeps the full coverage the split never loses).
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
        run: |
          set -euo pipefail
          asset="saddle.container.${VERSION}.tar.gz"
          sha="$(sha256sum "$asset" | awk '{print $1}')"
          if gh release view -R "$GITHUB_REPOSITORY" "${{ needs.saddle-vhe-resolve.outputs.tag }}" --json assets --jq '.[].name' | grep -qx 'SHA256SUMS'; then
            gh release download -R "$GITHUB_REPOSITORY" "${{ needs.saddle-vhe-resolve.outputs.tag }}" -p SHA256SUMS -O SHA256SUMS.prev || echo "" > SHA256SUMS.prev
          else
            echo "" > SHA256SUMS.prev
          fi
          grep -v " ${asset}$" SHA256SUMS.prev > SHA256SUMS || true
          printf '%s  %s\n' "$sha" "$asset" >> SHA256SUMS
          gh release upload -R "$GITHUB_REPOSITORY" "${{ needs.saddle-vhe-resolve.outputs.tag }}" SHA256SUMS --clobber
