      - name: Set up Node (the type-stripping read of the catalog)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the lane tag (the per-leg guard)
        id: meta
        env:
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/saddle
          PROFILE: ${{ matrix.osprofile }}
          SUFFIX: ${{ matrix.suffix }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          echo "tag=${img}:${ver}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "resolved catalog lane tag: ${img}:${ver}${SUFFIX}"
          leg_out="$(gh api "/users/${OWNER,,}/packages/container/saddle/versions" --jq "[.[] | select(.metadata.container.tags[]? | . == \"${ver}${SUFFIX}\")] | length" 2>/dev/null || true)"
          case "${leg_out}" in
            ''|*[!0-9]*) leg_out=0 ;;
          esac
          if [ "${leg_out}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "catalog lane ${ver}${SUFFIX} already ships on the registry; this leg will skip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the saddle build context and render the profile config
        # the same staged tree the runnable lanes build (the saddle nested
        # under saddle/ with the vault and devthink sources beside it) plus
        # the rendered osprofiles json the catalog stages COPY: the profile
        # rows the osprofiles catalog answers, one json per seat, generated
        # from the tagged source the lane checks out (never a placeholder).
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf saddlebuildctx
          mkdir -p saddlebuildctx/saddle saddlebuildctx/vault saddlebuildctx/devthink
          cp -a saddle/. saddlebuildctx/saddle/
          cp -a vault/. saddlebuildctx/vault/
          cp -a devthink/. saddlebuildctx/devthink/
          rm -rf saddlebuildctx/saddle/.git saddlebuildctx/vault/.git saddlebuildctx/devthink/.git \
                 saddlebuildctx/saddle/node_modules saddlebuildctx/vault/node_modules saddlebuildctx/devthink/node_modules \
                 saddlebuildctx/saddle/dist saddlebuildctx/vault/dist saddlebuildctx/devthink/dist \
                 saddlebuildctx/devthink/build \
                 saddlebuildctx/vault/test
          printf '%s\n' 'saddle/.git' 'vault/.git' 'devthink/.git' '**/node_modules' '**/dist' > saddlebuildctx/.dockerignore
          cat > osprofile-dump.ts <<'DUMP'
          import { mkdirSync, writeFileSync } from "node:fs";
          import { OSPROFILES } from "./saddlebuildctx/saddle/osprofiles.ts";
          mkdirSync("saddlebuildctx/osprofiles", { recursive: true });
          for (const profile of OSPROFILES) {
            writeFileSync(`saddlebuildctx/osprofiles/${profile.id}.json`, JSON.stringify(profile, null, 2) + "\n");
          }
          console.log(`the os profile catalog answered ${OSPROFILES.length} seats`);
          DUMP
          node osprofile-dump.ts
          rm -f osprofile-dump.ts
          test -s "saddlebuildctx/osprofiles/${{ matrix.osprofile }}.json"

      - name: Build and push the catalog lane
        # the scratch target of the profile: no runnable base (the digest
        # law rides trivially — a scratch stage pins no base at all), the
        # profile config and the stamps the config carries.
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./saddlebuildctx
          file: ./saddlebuildctx/saddle/Dockerfile
          target: os${{ matrix.osprofile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            SADDLE_VERSION=${{ needs.saddle-vhe-resolve.outputs.version }}
            SADDLE_OS_PROFILE=${{ matrix.osprofile }}
            SADDLE_TIER=${{ matrix.tier }}
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
          labels: |
            org.opencontainers.image.title=saddle (the ${{ matrix.osprofile }} os-distribution catalog lane, the ${{ matrix.tier }} tier)
            org.opencontainers.image.description=the ${{ matrix.osprofile }} os-distribution seat the osprofiles catalog carries on the ${{ matrix.tier }} virtual hardware plan — no runnable container base exists for this seat, the lane publishes the profile config the engine reads.
            org.opencontainers.image.version=${{ needs.saddle-vhe-resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

