name: DevThink Target Plans

# The target plan lane of the family doctrine (the Saddle lane scheme,
# adapted to the DevThink identity): every target x format cell of the
# packaging surface emits a REAL plan derived from the built release set
# - the version resolved through the family release-version resolver
# (tag <-> package.json lockstep), the artifacts read from the artifact
# manifest the root build emits, and the publishing channels each plan
# entry maps onto through the channel resolver of the distribution
# module. A plan never invents numbers: the version comes from the
# checked out source, the artifact set from node tests/build.mjs, and
# the channels from dist/pack.js.
#
# The dual-trigger pattern (the documented exception to the
# GITHUB_TOKEN event suppression): the release published event fired by
# the release workflow's GITHUB_TOKEN never cascades, so this lane also
# fires when the DevThink Release workflow completes successfully on a
# version bump (the job gate below requires the triggering event to be
# the release tag push or the maintenance ladder dispatch).

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["DevThink Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Optional target filter; use all for every target.
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  target-plans:
    # releases the ladder cuts carry version tags; any other workflow_run
    # completion (a failed or foreign run) never reaches the matrix.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    name: Plan ${{ matrix.target }} ${{ matrix.format }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the channels field carries the publishing channels the plan
        # filters the artifact manifest onto: every artifact attaches to
        # the github release, the browser formats ride their store
        # channels, the container image rides the container channel and
        # the single distribution tarball rides the registry channels.
        include:
          - { target: application, format: tarball, channels: "github" }
          - { target: computer, format: singlefile, channels: "github" }
          - { target: desktopapp, format: appimage, channels: "github" }
          - { target: desktopapp, format: deb, channels: "github" }
          - { target: desktopapp, format: rpm, channels: "github" }
          - { target: desktopapp, format: snap, channels: "github" }
          - { target: desktopapp, format: flatpak, channels: "github" }
          - { target: desktopapp, format: dmg, channels: "github" }
          - { target: desktopapp, format: pkg, channels: "github" }
          - { target: desktopapp, format: exe, channels: "github" }
          - { target: desktopapp, format: msi, channels: "github" }
          - { target: desktopapp, format: msix, channels: "github" }
          - { target: android, format: apk, channels: "github" }
          - { target: android, format: aab, channels: "github" }
          - { target: ios, format: ipa, channels: "github" }
          - { target: cli, format: singlefile, channels: "github,npmjs,githubpackages" }
          - { target: binary, format: sea, channels: "github" }
          - { target: binary, format: wasm, channels: "github" }
          - { target: browser, format: pwa, channels: "github,site" }
          - { target: extension, format: crx, channels: "github,chromium" }
          - { target: extension, format: xpi, channels: "github,firefox" }
          - { target: extension, format: safariextz, channels: "github,safari" }
          - { target: web, format: pwa, channels: "github,site" }
          - { target: libreoffice, format: oxt, channels: "github" }
          - { target: mcp, format: stdio, channels: "github,npmjs,githubpackages,maven,nuget" }
          - { target: vsix, format: vsix, channels: "github,vscode" }
          - { target: container, format: oci, channels: "github,container" }
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this target is selected
        id: selected
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.target || 'all' }}"
          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.target }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve release version
        # the release-version resolver, inlined per the one-workflow-file
        # standard (the family pattern): the tag must match the package
        # version of the commit it points at, and the lane checks out the
        # tagged tree before it builds.
        if: steps.selected.outputs.enabled == 'true' && github.event_name == 'release'
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CHECKOUT_TAG: "true"
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Bun
        if: steps.selected.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - name: Set up Node
        if: steps.selected.outputs.enabled == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install root dependencies
        if: steps.selected.outputs.enabled == 'true'
        run: bun install --frozen-lockfile
      - name: Build the release set the plans derive from
        if: steps.selected.outputs.enabled == 'true'
        run: node tests/build.mjs
      - name: Write DevThink target plan
        if: steps.selected.outputs.enabled == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FORMAT: ${{ matrix.format }}
          CHANNELS: ${{ matrix.channels }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag || github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          mkdir -p build/targets
          # the commit the plan derives from: the resolved tag commit on
          # the release path, the checked out head otherwise.
          SOURCE_SHA="$(git rev-parse HEAD)"
          TARGET="$TARGET" FORMAT="$FORMAT" CHANNELS="$CHANNELS" RELEASE_TAG="$RELEASE_TAG" SOURCE_SHA="$SOURCE_SHA" node <<'PLAN'
          const fs = require("node:fs");
          const target = process.env.TARGET;
          const format = process.env.FORMAT;
          const releaseTag = process.env.RELEASE_TAG ?? "";
          const sourceSha = process.env.SOURCE_SHA ?? "";
          const channels = (process.env.CHANNELS ?? "github").split(",").map(entry => entry.trim()).filter(entry => entry !== "");
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const manifest = JSON.parse(fs.readFileSync("dist/artifactmanifest.json", "utf8"));
          (async () => {
            const pack = await import("./dist/pack.js");
            /* the channel resolution of the release channel resolver: a
               version stamped release asset answers under its release name
               (the dist/ prefix the build stamps strips away), a plain
               bundle keeps the npm channels the manifest records, and the
               default github answer of an unrecognized name never hides the
               manifest channels of the bundle it names. */
            const resolve = entry => {
              const releasechannels = pack.artifactchannelof(entry.name.replace(/^dist\//, ""), version);
              if (releasechannels.length === 1 && releasechannels[0] === "github" && entry.channels.length > 1) return entry.channels;
              return releasechannels;
            };
            let selected = manifest.artifacts
              .filter(entry => resolve(entry).some(channel => channels.includes(channel)))
              .map(entry => ({ name: entry.name, channels: resolve(entry), primary: resolve(entry).some(channel => channel !== "github" && channels.includes(channel)) }));
            /* every release asset attaches to the github release, so the
               github channel matches them all; the primary flag ranks the
               artifacts that ride the target's own channel first. */
            selected.sort((a, b) => Number(b.primary) - Number(a.primary));
            /* a target whose channel the built set does not carry yet (the
               container tarball the release lanes attach, the mobile wrappers
               the mobile lane generates) falls back to the single distribution
               artifact — the one product every lane consumes. */
            if (selected.length === 0) {
              const distribution = manifest.artifacts.find(entry => entry.name === `dist/devthink${version}.zip`);
              if (distribution === undefined) throw new Error("The built set carries no distribution artifact to plan against.");
              const distributionchannels = resolve(distribution);
              selected = [{ name: distribution.name, channels: distributionchannels, primary: distributionchannels.some(channel => channel !== "github" && channels.includes(channel)) }];
            }
            const plan = {
              product: "DevThink",
              target,
              format,
              version,
              source: sourceSha,
              releaseTag,
              status: "planned",
              channels,
              artifacts: selected
            };
            fs.writeFileSync(`build/targets/${target}-${format}.json`, JSON.stringify(plan, null, 2) + "\n");
            console.log(`planned ${target} ${format} at ${version} over ${selected.length} artifacts riding ${channels.join(", ")}`);
          })().catch(error => { console.error(error); process.exit(1); });
          PLAN
      - name: Upload target plan
        if: steps.selected.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink-${{ matrix.target }}-${{ matrix.format }}-plan
          path: build/targets/${{ matrix.target }}-${{ matrix.format }}.json
          if-no-files-found: error
