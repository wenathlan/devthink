# the label map of the family: one label per application folder plus the
# infrastructure lanes the workflows live in. The map answers the canonical
# family pass order: devthink, argan, cadria, debonair, forge, foundry,
# stealhead, vault, getry - and saddle last, the heaviest pass of the house.
devthink:
  - changed-files:
      - any-glob-to-any-file: devthink/**
argan:
  - changed-files:
      - any-glob-to-any-file: argan/**
cadria:
  - changed-files:
      - any-glob-to-any-file: cadria/**
debonair:
  - changed-files:
      - any-glob-to-any-file: debonair/**
forge:
  - changed-files:
      - any-glob-to-any-file: forge/**
foundry:
  - changed-files:
      - any-glob-to-any-file: foundry/**
stealhead:
  - changed-files:
      - any-glob-to-any-file: stealhead/**
vault:
  - changed-files:
      - any-glob-to-any-file: vault/**
getry:
  - changed-files:
      - any-glob-to-any-file: getry/**
saddle:
  - changed-files:
      - any-glob-to-any-file: saddle/**
workflows:
  - changed-files:
      - any-glob-to-any-file: .github/**
docs:
  - changed-files:
      - any-glob-to-any-file: "**/docs/**"
