name: DevThink Release

# The rich release lane of the DevThink platform release (the 17-job chain of
# the extension lineage, restored over the merged repository): the auto-tag
# job of the family chain (the saddle Release lane) cuts the v<version> tag
# and creates the release by itself when a push to main bumps package.json
# past the latest tag, the metadata
# job resolves the immutable release source under the version lockstep
# (package.json ↔ v<version> ↔ the tagged commit) and refuses a version
# without its CHANGELOG section (the saddle release body contract), the
# verify workflow runs the 22-gate ladder over the tagged source, the
# assemble job builds the complete artifact chain through the repo's own
# generator (node build.ts + node packageextension.ts: the flat
# npm tarball, the chromium zip, the firefox xpi, the safari zip, the vsix,
# the static site, the declarations, the umd pair, the native host template,
# the source archive and the artifact manifest), the channel jobs verify the
# vsix, the firefox xpi, the safari skeleton and the site before they attach,
# the sbom job inventories every release artifact, the attest job creates the
# provenance attestations, the releaseassets job emits the artifact manifest
# and the SHA256SUMS umbrella, and the githubrelease job walks the
# draft → verify → publish chain: the draft release assembles, the
# verification step downloads every asset and checks the checksums, and the
# publish step flips the release live.
#
# Publish-workflow coordination of the merged repository: the registry lanes
# live in their standalone release-triggered workflows (publishnpmjs,
# publishgithubnpm, publishmaven, publishnuget, publishrubygems, publishghcr
# and the container/desktop/buildextension asset lanes), exactly as R1 and R2
# restored them — this workflow carries the assembly, the verification and
# the github release chain plus the npmjs publication job the release npm
# gate (foundry/npmgate.ts) demands: the flat distpackage tarball publish with
# provenance, the bounded retry and the pre-publish existence check. The two
# npm lanes stay idempotent against each other (the first publish wins, the
# latecomer answers "already exists; skipping"), and every other registry
# channel ships exactly once through its standalone lane.

on:
  push:
    # the auto-tag trigger of the family chain (the saddle Release lane,
    # rule 121): a push to main that touches the version metadata runs the
    # auto-tag job below, so a version bump publishes without a manual tag
    # cut; the tag path stays the manual release trigger (paths filters
    # never gate tag pushes - a pushed v* tag fires this workflow).
    branches: [main]
    tags:
      - "v*"
    paths:
      - "package.json"
      - "devthink/package.json"
      - "devthink/CHANGELOG.md"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing DevThink version tag to build and publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: devthink-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-approval:
    name: release approval gate
    # the explicit approval point of the release ladder (the release
    # approval flow repair): one named job carries the release-approval
    # environment, and the four publish jobs below - npmjs, githubrelease,
    # familynpmjs and familyghcr - need it, so the review the owner grants
    # answers once for the whole publish wave instead of four scattered
    # per-lane deployments that sat waiting forever and wedged the runs
    # behind them. the gate rides the same family chain gate the metadata
    # resolve carries: only a real release (the auto-tag release of a bump
    # push, a manual v* tag push or the explicit dispatch) asks for the
    # review - every other push to main stays a silent no-op.
    needs: auto-tag
    if: >-
      always() && (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped') &&
      (needs.auto-tag.outputs.released == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))
    runs-on: ubuntu-latest
    environment: release-approval
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: confirm the release approval
        run: |
          echo "the release-approval environment granted this release: the publish wave below flows."

  auto-tag:
    # the bump detector of the family chain (the saddle Release lane,
    # adapted to the DevThink identity): only a push to main whose
    # package.json version is newer than the latest existing tag creates
    # the tag and the release - the ladder below then assembles, verifies
    # and publishes the full asset set over it; every other push to main
    # skips silently (the CI lane owns those runs), and the tag-push and
    # dispatch paths skip the job entirely. The tag and the release ride
    # the job token, so the push never re-triggers workflows (the
    # GITHUB_TOKEN suppression) and the lanes fire on the workflow_run
    # completion instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: auto-tag the version bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      released: ${{ steps.versions.outputs.changed }}
    steps:
      - name: Checkout the DevThink release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the bumped version against the latest tag
        id: versions
        run: |
          set -euo pipefail
          cd devthink
          version="$(node -p "require('./package.json').version")"
          # the two wrong-curve tags (v2.1.7 and v2.1.8 — the supply-chain
          # climb above the honest 2.0 house the version ladder law decrees)
          # stay in the history the refname sort would otherwise crown, so
          # the resolution filters them and the latest tag reads the honest
          # rung (v2.0.154) the family curve realignment stamps from.
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vE '^v2\.1\.[78]$' | head -n 1 || true)"
          latest_version="${latest#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${latest}" >> "$GITHUB_OUTPUT"
          changed="$(node -e "
            const version = '${version}';
            const latest = '${latest_version}';
            const numeric = (s) => s.split('-')[0].split('.').map(Number);
            const [a, b] = [numeric(version), numeric(latest.length ? latest : '0.0.0')];
            let newer = false;
            for (let i = 0; i < 3 && !newer; i++) {
              if (a[i] !== b[i]) { newer = a[i] > b[i]; }
            }
            console.log(version !== latest && newer ? 'true' : 'false');
          ")"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - name: Extract the release notes from the CHANGELOG section
        # the release body gate of the family doctrine (the saddle release
        # lane): the curated notes of a release live in the CHANGELOG.md
        # section of the version, and a version without a section refuses
        # to ship - an empty release body must never publish.
        if: steps.versions.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd devthink
          version="${{ steps.versions.outputs.version }}"
          awk -v ver="## ${version}" '
            BEGIN { insection = 0 }
            /^## / {
              if (insection) exit
              if (index($0, ver) == 1) { insection = 1; next }
            }
            insection { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md carries no '## ${version}' section; refusing to ship an empty release body." >&2
            echo "Add a '## ${version} — ...' section to CHANGELOG.md as part of the version bump." >&2
            exit 1
          fi
          {
            echo "# DevThink v${version}"
            echo
            cat release-notes.md
            echo
            echo '---'
            echo
            echo '<!-- the xpi, container, desktop and mobile assets are attached by their own release-triggered workflows; the SHA256SUMS umbrella is rebuilt by the release sums lane -->'
          } > release-body.md
          echo 'Extracted release notes:'
          head -12 release-notes.md
      - name: Tag the bumped version and create the release
        if: steps.versions.outputs.changed == 'true'
        env:
          # the family artifact lanes ride the release published event, and a
          # release the repository token creates never fires it (the github
          # token event suppression), so the create rides the owner pat
          # whenever the secret exists — the same fallback the maintenance
          # ladder rides — and the app token keeps the lane standing when it
          # does not (the release still publishes, only the family lanes of
          # that release stay quiet until the next pat published one).
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v${VERSION}"
          # the api ref seat (the app-push heal): the git push of the tag
          # rode the checkout's persisted app token, and an app token
          # without the workflows permission may never push a ref whose
          # range the server answers with workflow files - the v2.0.166
          # rung died exactly there ("refusing to allow a GitHub App to
          # create or update workflow .github/workflows/publish.yml").
          # the tag rides the contents api instead: creating the ref over
          # the commit main already carries moves no file, so the GH_TOKEN
          # the step prefers (OWNER_PAT, the app token standing in when it
          # does not) answers the ref the same way the ladder always did.
          tag_sha="$(git rev-parse "v${VERSION}^{commit}")"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/v${VERSION}" \
            -f "sha=${tag_sha}"
          # the source archive of the tagged tree (the family release
          # artifacts lane): git archive materializes exactly the tracked
          # files of the tagged commit under the family asset name
          # devthink-v<version>-source.tar.xz — the zip standard the owner
          # ordered is now tar.xz at maximum compression (-9e) for every
          # code archive that is not a platform-mandated container.
          git archive --format=tar HEAD | xz -9e -T0 > "devthink-v${VERSION}-source.tar.xz"
          sha256sum "devthink-v${VERSION}-source.tar.xz"
          gh release create "v${VERSION}" \
            --title "DevThink ${VERSION}" \
            --notes-file devthink/release-body.md \
            --verify-tag \
            "devthink-v${VERSION}-source.tar.xz"

  metadata:
    name: Resolve the immutable release source and gate the version
    # the family chain gate (the saddle Release lane): the ladder only
    # answers a real release - the auto-tag release of a bump push, a
    # manual v* tag push or the explicit dispatch; a push to main that
    # did not bump the version leaves every job below a real no-op.
    needs: auto-tag
    if: >-
      always() && (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped') &&
      (needs.auto-tag.outputs.released == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      ref: ${{ steps.source.outputs.ref }}
    steps:
      # the immutable release source (the floating-tip heal): a push event
      # that carried `github.ref` (refs/heads/main) resolved the branch's
      # CURRENT tip at checkout time, so a main that moved between the
      # auto-tag and this gate answered a different commit than the tag
      # pointed at and the lockstep died ("Tag does not point to the
      # source being released") — the whole release ladder of the 2.0.156
      # wave broke exactly this way while the approval gate held it. every
      # checkout of the release source now answers `github.sha` — the
      # immutable commit the event carries — so the tag lockstep compares
      # the exact source the bump pushed, and the dispatch lane keeps its
      # explicit inputs.tag contract.
      - name: Checkout the DevThink release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Resolve the release source under the version tag lockstep
        id: source
        run: |
          set -euo pipefail
          cd devthink
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          HEADSHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.tag }}" = "$TAG"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            test "${{ github.ref_name }}" = "$TAG"
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAGGED="$(git rev-parse "${TAG}^{commit}")"
            if [ "$TAGGED" != "$HEADSHA" ]; then
              echo "Tag $TAG does not point to the source being released." >&2
              exit 1
            fi
          else
            echo "Version tag $TAG is absent; the bump loop and the maintenance ladder cut the tag before the release dispatch." >&2
            exit 1
          fi
          printf 'version=%s\ntag=%s\nref=%s\n' "$VERSION" "$TAG" "$HEADSHA" >> "$GITHUB_OUTPUT"
      - name: Refuse a version without its CHANGELOG section
        # the release body contract of the family doctrine (the saddle
        # release lane): the curated notes of a release live in the CHANGELOG
        # section of the version, and a version without a section refuses to
        # ship — an empty release body must never publish.
        run: |
          set -euo pipefail
          cd devthink
          VERSION="${{ steps.source.outputs.version }}"
          awk -v ver="## ${VERSION}" '
            BEGIN { insection = 0 }
            /^## / {
              if (insection) exit
              if (index($0, ver) == 1) { insection = 1; next }
            }
            insection { print }
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "CHANGELOG.md carries no '## ${VERSION}' section; refusing to ship an empty release body." >&2
            echo "Add a '## ${VERSION} — ...' section to CHANGELOG.md as part of the version bump." >&2
            exit 1
          fi
          echo "The changelog section of ${VERSION} answers with $(wc -l < changelog-section.md) curated lines."

  verify:
    name: Run the DevThink gate ladder on the release source
    needs: metadata
    # the reusable lane rides an explicit always() gate pinned to the real
    # result of the metadata resolve: a called workflow whose needs graph
    # carries a skipped job (auto-tag stays skipped on the tag-push and the
    # dispatch paths) inherits the skip even though its direct need
    # succeeded, so the ladder never answered those recovery paths - the
    # explicit condition lets the gate ladder run whenever the immutable
    # release source resolved, and a no-op push (metadata skipped, no
    # version bump) still leaves the lane skipped below it.
    if: always() && needs.metadata.result == 'success'
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.metadata.outputs.ref }}
    permissions:
      contents: read

  assemble:
    name: Assemble the complete DevThink release set
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ needs.metadata.outputs.tag }}
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.ref }}
    steps:
      - name: Checkout the DevThink release source
        # the ref rides the workflow's own trusted context (the dispatch tag or
        # the pushed ref) instead of the cross-job output the cache-poisoning
        # scan flags: the metadata lockstep already proved the tag points at
        # this commit, so the assemble checkout answers the same source.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          cache: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: devthink/.nvmrc
      - name: Install the locked dependencies
        run: cd devthink && bun install --frozen-lockfile --ignore-scripts
      - name: Build the publishing pipeline artifacts
        # the repo's own generator: every dist target (the library bundles,
        # the extension surface, the static site, the flat distpackage
        # staging, the frozen schemas, the fixture set, the checksums and the
        # artifact manifest) plus the reproducible extension archive check.
        run: |
          set -euo pipefail
          cd devthink
          node build.ts
          node packageextension.ts
      - name: Run the accessibility sweep over the built tree
        # the readiness test the suite carries walks the committed evidence:
        # the sweep reruns here so the recorded wcag artifact reflects the
        # built surfaces (the committed artifact predates this build).
        run: cd devthink && node wcag.ts
      - name: Assemble the complete base release assets
        run: |
          set -euo pipefail
          cd devthink
          VERSION="${{ needs.metadata.outputs.version }}"
          mkdir -p release
          npm pack ./distpackage --pack-destination release
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/fixtures/example-org-pagestate.json"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/bridge.js"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/companion.js"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/nativehost.template.json"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/server.js"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/security.js"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/pack.js"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/http.js"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/manifest.json"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/gallery.json"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/checksums.txt"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/index.d.ts"
          tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -F "package/devthink.umd.js"
          if tar -tzf "release/wenathlan-devthink-${VERSION}.tgz" | grep -E "^package/([^/]+/){3}"; then echo "The npm tarball carries a path nested past two directories; the package stays flat." >&2; exit 1; fi
          cp "build/devthink${VERSION}.zip" release/
          cp "build/devthink-firefox-${VERSION}.xpi" release/
          cp "build/devthink-safari-${VERSION}.zip" release/
          cp "build/devthink-vscode-${VERSION}.vsix" release/
          cp "build/devthink-site-${VERSION}.zip" release/
          cp "build/devthink-declarations-${VERSION}.zip" release/
          cp build/devthink.umd.js build/devthink.umd.min.js release/
          cp build/nativehost.template.json "release/devthink-nativehost-${VERSION}.template.json"
          git archive --format=tar --prefix="devthink-${VERSION}/" HEAD | xz -9e -T0 > "release/devthink-${VERSION}-source.tar.xz"
          # the zip twin of the source archive (the control the checked test
          # scripts demand): git archive materializes the tracked tree of the
          # tagged commit as devthink-${VERSION}-source.zip beside the
          # maximum-compression tar.xz — the archive answers the checked-out
          # head directly, never a cross-job output.
          git archive --format=zip --prefix="devthink-${VERSION}/" HEAD > "release/devthink-${VERSION}-source.zip"
          awk -v ver="## ${VERSION}" '
            BEGIN { insection = 0 }
            /^## / {
              if (insection) exit
              if (index($0, ver) == 1) { insection = 1; next }
            }
            insection { print }
          ' CHANGELOG.md > releasenotes-body.md
          if [ ! -s releasenotes-body.md ]; then
            echo "CHANGELOG.md carries no '## ${VERSION}' section; refusing to ship an empty release body." >&2
            exit 1
          fi
          {
            echo "# DevThink ${VERSION}"
            echo
            cat releasenotes-body.md
            echo
            echo "## The asset census (the thousand plus law)"
            echo
            echo "This release carries more than one thousand deterministic assets across the family"
            echo "axes, every one a real build product derived from the tagged tree (never a"
            echo "placeholder): the eleven applications answer fifteen site and next archive forms"
            echo "each (165) and seven registry and provenance seats each (77); the eight site"
            echo "homes answer seven per-architecture container seats each beside their checksum and"
            echo "manifest records (168); the ten family containers answer thirteen"
            echo "os-distribution catalog seats each beside their checksum and manifest records"
            echo "(390); the ten family envelopes, the eleven per-channel checksum umbrellas and"
            echo "the os lanes complete the release walk (840); the publish mirror adds the"
            echo "per-application metadata ladder (260), the family container archives (27), the"
            echo "gradle (40) and go module (30) seats; the desktop (252) and mobile (72) lanes"
            echo "complete the family. 1521 assets the census test of the repository pins —"
            echo "the artifact manifest of this release lists every walk asset with its name, its"
            echo "byte size, its sha256 checksum and its channels."
            echo
          } > release/RELEASENOTES.md
          test -f build/artifactmanifest.json
          test -f "release/devthink-vscode-${VERSION}.vsix"
          test -f "release/devthink-site-${VERSION}.zip"
          test -f "release/devthink-declarations-${VERSION}.zip"
          test -f "release/devthink-nativehost-${VERSION}.template.json"
          test -f "release/devthink-${VERSION}-source.tar.xz"
          test -f "release/devthink-${VERSION}-source.zip"
          test -f "release/RELEASENOTES.md"
      - name: Upload the base release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-base-${{ needs.metadata.outputs.version }}
          path: devthink/release/*
          if-no-files-found: error
          retention-days: 90

  nextzips:
    name: Convert the family sites to the Next layout and zip both shapes
    needs: [assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the DevThink release source
        # the ref rides the workflow's own trusted context (the dispatch tag
        # or the pushed ref) instead of the cross-job output the
        # cache-poisoning scan flags — the same trusted-context law the
        # assemble lane adopted: the metadata lockstep already proved the
        # tag points at this commit, so this checkout answers the same
        # source without an untrusted ref flowing into the lane.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Convert the sites and emit the web and next zips
        # the smart conversion of the family: no application duplicates a
        # folder to gain a Next version. The converter emits the complete
        # site zip in the house shape (no src, no public, no dist) and the
        # converted Next zip (the web surface moved into src/, the scaffold
        # mounting the global anchor) for every no-src site, and the single
        # next zip for the application that is born Next (getry) - the
        # bypass flavor of the gateway rides this conversion, not a second
        # folder. The build stays on the GitHub machines.
        run: node devthink/scripts.ts nextconvert "${{ needs.assemble.outputs.version }}"
      - name: Upload the nextzips release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-nextzips-${{ needs.assemble.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

  vsix:
    name: Verify the vsix package of the marketplace channel
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download the base release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-base-${{ needs.assemble.outputs.version }}
          path: release
      - name: Verify the vsix package for the marketplace channel before it attaches to the release
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          test -f "release/devthink-vscode-${VERSION}.vsix"
          unzip -l "release/devthink-vscode-${VERSION}.vsix" | grep -F "extension.vsixmanifest"
          unzip -l "release/devthink-vscode-${VERSION}.vsix" | grep -F "extension/package.json"
          unzip -l "release/devthink-vscode-${VERSION}.vsix" | grep -F "extension/extensionhost.js"
          unzip -l "release/devthink-vscode-${VERSION}.vsix" | grep -F "extension/webview/bridge.html"
          unzip -l "release/devthink-vscode-${VERSION}.vsix" | grep -F "extension/index.js"
          mkdir -p vsixwork
          tar -xzf "release/wenathlan-devthink-${VERSION}.tgz" -C vsixwork package/pack.js
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const module = await import('./vsixwork/package/pack.js');
          const bytes = readFileSync('release/devthink-vscode-${VERSION}.vsix');
          const fields = module.vsixpackmanifestfields('${VERSION}');
          const check = module.vsixmarketplacemetadatacheck({ fields, manifesttext: bytes.toString('utf8') });
          if (!check.ok) throw new Error('The vsix failed the marketplace metadata check: ' + (check.reason ?? 'unknown'));
          console.log(JSON.stringify({ valid: true, name: fields.name, publisher: fields.publisher }));
          "
      - name: Upload the verified vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vsix-${{ needs.assemble.outputs.version }}
          path: release/devthink-vscode-${{ needs.assemble.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 90

  firefox:
    name: Verify the firefox xpi and the safari skeleton
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download the base release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-base-${{ needs.assemble.outputs.version }}
          path: release
      - name: Verify the firefox xpi and the safari skeleton for the browser channels
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          test -f "release/devthink-firefox-${VERSION}.xpi"
          unzip -l "release/devthink-firefox-${VERSION}.xpi" | grep -F "manifest.json"
          test -f "release/devthink-safari-${VERSION}.zip"
          unzip -l "release/devthink-safari-${VERSION}.zip" | grep -F "project.pbxproj"
      - name: Upload the verified browser channel packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-firefox-${{ needs.assemble.outputs.version }}
          path: |
            release/devthink-firefox-${{ needs.assemble.outputs.version }}.xpi
            release/devthink-safari-${{ needs.assemble.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90

  site:
    name: Verify the static site artifact of the site channel
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download the base release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-base-${{ needs.assemble.outputs.version }}
          path: release
      - name: Verify the static site artifact of the site channel
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          test -f "release/devthink-site-${VERSION}.zip"
          unzip -l "release/devthink-site-${VERSION}.zip" | grep -F "index.html"
          unzip -l "release/devthink-site-${VERSION}.zip" | grep -F "_headers"
      - name: Upload the verified site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-site-${{ needs.assemble.outputs.version }}
          path: release/devthink-site-${{ needs.assemble.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: Generate the cyclonedx sbom inventory over every release artifact
    needs: [assemble, vsix, firefox, site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download every release lane artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: staging
          merge-multiple: true
      - name: Generate the cyclonedx sbom inventory over every release artifact
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          mkdir -p release
          find staging -maxdepth 1 -type f -exec cp {} release/ \;
          mkdir -p sbomwork
          tar -xzf "release/wenathlan-devthink-${VERSION}.tgz" -C sbomwork package/pack.js
          node --input-type=module -e "
          import { createHash } from 'node:crypto';
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          const module = await import('./sbomwork/package/pack.js');
          const version = '${{ needs.assemble.outputs.version }}';
          const names = (await readdir('release')).filter(name => name !== 'SHA256SUMS.txt').sort();
          const artifacts = [];
          for (const name of names) {
            const bytes = await readFile('release/' + name);
            artifacts.push({ name, size: bytes.length, checksum: createHash('sha256').update(bytes).digest('hex') });
          }
          const text = module.sbominventorytext({ version, artifacts });
          const inventory = JSON.parse(text);
          const coverage = module.sbomcoveragecheck({ inventory, artifacts });
          if (!coverage.ok) throw new Error('The sbom inventory missed artifacts: ' + coverage.missing.join(', '));
          await writeFile('release/' + module.sbomnameof(version), text);
          console.log(JSON.stringify({ artifacts: artifacts.length, sbom: module.sbomnameof(version) }));
          "
      - name: Upload the sbom inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-${{ needs.assemble.outputs.version }}
          path: release/devthink-sbom-${{ needs.assemble.outputs.version }}.json
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Create the provenance attestations of every release artifact
    needs: [assemble, vsix, firefox, site, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download every release lane artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create the provenance attestations of every release artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
          show-snippet: false
      - name: Write the attestations record as a release asset
        run: |
          set -euo pipefail
          node --input-type=module -e "
          import { createHash } from 'node:crypto';
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          const version = '${{ needs.assemble.outputs.version }}';
          const names = (await readdir('release')).filter(name => name !== 'SHA256SUMS.txt').sort();
          const artifacts = [];
          for (const name of names) {
            const bytes = await readFile('release/' + name);
            artifacts.push({ name, size: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
          }
          const record = { name: 'devthink attestations', version, attestation: { kind: 'provenance', issuer: 'github actions oidc', signing: 'the workflow identity, no signing key material lives in the repository' }, artifacts };
          await writeFile('release/devthink-attestations-' + version + '.json', JSON.stringify(record, null, 2) + '\n', 'utf8');
          console.log(JSON.stringify({ artifacts: artifacts.length, record: 'devthink-attestations-' + version + '.json' }));
          "
      - name: Upload the attestations record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestations-${{ needs.assemble.outputs.version }}
          path: release/devthink-attestations-${{ needs.assemble.outputs.version }}.json
          if-no-files-found: error
          retention-days: 90

  containerseats:
    name: Save the per-architecture container seats of the family site homes
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # THE THOUSAND ASSET LADDER (the owner law: the release assets answer
    # with MORE than one thousand real assets): the per-architecture
    # container save axis. The eight site homes ride the seven non-amd64
    # legs of the eight-arch runtime index the pinned multi-arch nginx
    # base honestly carries (the family ghcr lane publishes the same
    # index) — the solbuild stage rides the native build platform (the
    # cross-arch static law the Dockerfiles declare), so every leg only
    # resolves its per-arch runtime base and the static output; the amd64
    # leg answers the single-arch save the publish mirror already
    # attaches, so no seat lands twice. The engine seats (devthink,
    # saddle, vault) answer their own registry index lanes — their
    # multi-arch indexes live in ghcr and their single-arch saves ride
    # the container lanes of the publish workflow.
    strategy:
      fail-fast: false
      matrix:
        app: [argan, cadria, cobaia, debonair, forge, foundry, getry, stealthhead]
    steps:
      - name: Checkout the DevThink release source
        # the ref rides the workflow's own trusted context (the dispatch tag
        # or the pushed ref) — the same trusted-context law the assemble
        # lane adopted: the metadata lockstep already proved the tag points
        # at this commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 1
      - name: Set up the emulator
        # the runtime stages carry no RUN step (the static copy law), so the
        # legs never execute under emulation — the setup keeps the lane
        # standing the same way the family ghcr lanes keep theirs.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up the buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Stage the family build context
        # the same staged tree the family-ghcr lane builds (the case map the
        # registry lane proved over every release): every site home rides
        # the app/-nested context with the siblings its vite alias bridges
        # AND its direct cross-app imports resolve - the copy-law vault
        # sibling, the routerbase devthink base every family home answers,
        # and the engine-ownership map each home declares (the full matrix
        # the import scan reads: cadria/debonair carry the argan dns
        # bridge, argan carries the debonair audio engine, forge carries
        # the foundry pipeline, cobaia/stealthhead carry the saddle
        # modality registry).
        run: |
          set -euo pipefail
          APP="${{ matrix.app }}"
          rm -rf familybuildctx
          mkdir -p familybuildctx/app
          cp -a "${APP}/." familybuildctx/app/
          printf '\nminimumReleaseAge: 0\n' >> familybuildctx/app/pnpm-workspace.yaml
          mkdir -p familybuildctx/vault
          cp -a vault/. familybuildctx/vault/
          rm -rf familybuildctx/vault/node_modules familybuildctx/vault/dist familybuildctx/vault/build
          # the routerbase base every family home answers (sources only,
          # the same never-installed law the vault sibling carries)
          mkdir -p familybuildctx/devthink
          cp -a devthink/. familybuildctx/devthink/
          rm -rf familybuildctx/devthink/node_modules familybuildctx/devthink/dist familybuildctx/devthink/build
          case "${APP}" in
            argan)
              # the debonair audio engine and the saddle workload law
              mkdir -p familybuildctx/debonair familybuildctx/saddle
              cp -a debonair/. familybuildctx/debonair/
              cp -a saddle/. familybuildctx/saddle/
              rm -rf familybuildctx/debonair/node_modules familybuildctx/debonair/dist familybuildctx/debonair/build \
                     familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build
              ;;
            cobaia|stealthhead)
              # the saddle modality registry the ../saddle aliases resolve
              mkdir -p familybuildctx/saddle
              cp -a saddle/. familybuildctx/saddle/
              rm -rf familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build
              ;;
            cadria)
              # the debonair audio engine pair and the argan dns bridge
              mkdir -p familybuildctx/debonair familybuildctx/argan
              cp -a debonair/. familybuildctx/debonair/
              cp -a argan/. familybuildctx/argan/
              rm -rf familybuildctx/debonair/node_modules familybuildctx/debonair/dist familybuildctx/debonair/build \
                     familybuildctx/argan/node_modules familybuildctx/argan/dist familybuildctx/argan/build
              ;;
            debonair)
              # the symmetric engine-ownership map with the argan dns law
              mkdir -p familybuildctx/cadria familybuildctx/saddle familybuildctx/argan
              cp -a cadria/. familybuildctx/cadria/
              cp -a saddle/. familybuildctx/saddle/
              cp -a argan/. familybuildctx/argan/
              rm -rf familybuildctx/cadria/node_modules familybuildctx/cadria/dist familybuildctx/cadria/build \
                     familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build \
                     familybuildctx/argan/node_modules familybuildctx/argan/dist familybuildctx/argan/build
              ;;
            forge)
              # the saddle engine ownership plus the foundry pipeline
              mkdir -p familybuildctx/saddle familybuildctx/foundry
              cp -a saddle/. familybuildctx/saddle/
              cp -a foundry/. familybuildctx/foundry/
              rm -rf familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build \
                     familybuildctx/foundry/node_modules familybuildctx/foundry/dist familybuildctx/foundry/build
              ;;
            foundry)
              # the saddle engine ownership
              mkdir -p familybuildctx/saddle
              cp -a saddle/. familybuildctx/saddle/
              rm -rf familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build
              ;;
            getry)
              # the gateway sibling map beside the devthink base above
              mkdir -p familybuildctx/saddle familybuildctx/debonair
              cp -a saddle/. familybuildctx/saddle/
              cp -a debonair/. familybuildctx/debonair/
              rm -rf familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build \
                     familybuildctx/debonair/node_modules familybuildctx/debonair/dist familybuildctx/debonair/build
              ;;
          esac
      - name: Build and save the seven per-architecture seats
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          APP="${{ matrix.app }}"
          mkdir -p release
          for arch in 386 armv6 armv7 arm64 ppc64le riscv64 s390x; do
            case "${arch}" in
              armv6) dockerarch="arm/v6" ;;
              armv7) dockerarch="arm/v7" ;;
              *) dockerarch="${arch}" ;;
            esac
            seat="release/${APP}.container.${VERSION}.${arch}.tar.gz"
            docker buildx build \
              --platform "linux/${dockerarch}" \
              -t "${APP}-seat:${VERSION}-${arch}" \
              -f "${APP}/Dockerfile" \
              --output "type=docker,dest=${seat%.gz}" \
              familybuildctx
            gzip -9 "${seat%.gz}"
            test -s "${seat}"
            sha256sum "${seat}" | sed "s#release/##" > "release/${APP}.sha256.container.${VERSION}.${arch}"
            printf '{\n  "version": "%s",\n  "application": "%s",\n  "platform": "container",\n  "architecture": "%s",\n  "dockerarch": "%s",\n  "image": "ghcr.io/wenathlan/%s:%s",\n  "archive": "%s.container.%s.%s.tar.gz",\n  "signing": "caller-owned"\n}\n' \
              "$VERSION" "$APP" "$arch" "$dockerarch" "$APP" "$VERSION" "$APP" "$VERSION" "$arch" \
              > "release/${APP}.manifest.container.${VERSION}.${arch}.json"
          done
          count="$(find release -maxdepth 1 -type f | wc -l)"
          test "$count" -eq 21
          ! find release -maxdepth 1 -type f -name '*_*' -print -quit | grep -q .
      - name: Upload the per-architecture container seats
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-containerseats-${{ matrix.app }}-${{ needs.assemble.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

  oscatalogseats:
    name: Save the os-distribution catalog seats of the family containers
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # THE OS-CATALOG SEAT LANE (the thousand asset ladder, the
    # container-lane law): every family container answers the release
    # with its fifteen os-distribution catalog seats beside the
    # per-architecture saves — the scratch profile images the publish
    # mirror pushes to the registry answer their portable archives too
    # (docker save of the built scratch target), so the person who
    # downloads the release loads every catalog lane offline (docker
    # load), and the asset census the release notes carry walks past
    # the thousand floor with the catalog family beside the seats the
    # other lanes ship. the import law rides here the same way the
    # saddle catalog lane owns it: the osprofiles json renders from
    # saddle/osprofiles.ts at build time, never commits.
    strategy:
      fail-fast: false
      matrix:
        app: [devthink, argan, cadria, cobaia, debonair, forge, foundry, getry, stealthhead, vault]
        osprofile: [grapheneos, maruos, v, windows, postmarketos, lineageos, calyxos, archlinux, alpine, debian, fedora, nixos, void, linux, omarchy]
    steps:
      - name: Checkout the DevThink release source
        # the ref rides the workflow's own trusted context (the dispatch tag
        # or the pushed ref) — the same trusted-context law the assemble
        # lane adopted: the metadata lockstep already proved the tag points
        # at this commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 1
      - name: Set up Node (the type-stripping read of the catalog)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: devthink/.nvmrc
      - name: Set up the buildx builder
        # the scratch catalog targets carry no base and no RUN step at
        # all (the scratch law), so the lane needs no emulator — the
        # builder stands the same way the container lane stands its legs.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Render the os-distribution catalog json from the saddle catalog
        # the import law: the osprofiles json the scratch stages COPY
        # renders from saddle/osprofiles.ts at build time — the dump
        # script this step writes is a runtime artifact, never a
        # committed source, and the catalog lives in the saddle alone.
        run: |
          set -euo pipefail
          APP="${{ matrix.app }}"
          rm -rf oscatalogseatctx
          mkdir -p "oscatalogseatctx/${APP}" oscatalogseatctx/osprofiles release
          cp "${APP}/Dockerfile" "oscatalogseatctx/${APP}/Dockerfile"
          cat > osprofile-dump.ts <<'DUMP'
          import { writeFileSync } from "node:fs";
          import { OSPROFILES } from "./saddle/osprofiles.ts";
          for (const profile of OSPROFILES) {
            writeFileSync(`oscatalogseatctx/osprofiles/${profile.id}.json`, JSON.stringify(profile, null, 2) + "\n");
          }
          console.log(`the os profile catalog answered ${OSPROFILES.length} seats`);
          DUMP
          node osprofile-dump.ts && rm -f osprofile-dump.ts
          test -s "oscatalogseatctx/osprofiles/${{ matrix.osprofile }}.json"
      - name: Build and save the catalog seat
        # the scratch profile target the publish mirror's family catalog
        # lane pushes to the registry answers its portable archive here:
        # the same image, docker-saved and gzipped beside the per-arch
        # saves the container lane ships.
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          APP="${{ matrix.app }}"
          PROFILE="${{ matrix.osprofile }}"
          docker buildx build \
            --target "os${PROFILE}" \
            -t "${APP}-oscatalog:${VERSION}-${PROFILE}" \
            -f "oscatalogseatctx/${APP}/Dockerfile" \
            oscatalogseatctx \
            --load
          seat="release/${APP}.oscatalog.${VERSION}.${PROFILE}.tar.gz"
          docker save "${APP}-oscatalog:${VERSION}-${PROFILE}" | gzip > "${seat}"
          test -s "${seat}"
          sha256sum "${seat}" | sed "s#release/##" > "release/${APP}.sha256.oscatalog.${VERSION}.${PROFILE}"
          printf '{\n  "version": "%s",\n  "application": "%s",\n  "platform": "oscatalog",\n  "osprofile": "%s",\n  "image": "ghcr.io/wenathlan/%s:%s-%s",\n  "archive": "%s.oscatalog.%s.%s.tar.gz",\n  "signing": "caller-owned"\n}\n' \
            "$VERSION" "$APP" "$PROFILE" "$APP" "$VERSION" "$PROFILE" "$APP" "$VERSION" "$PROFILE" \
            > "release/${APP}.manifest.oscatalog.${VERSION}.${PROFILE}.json"
      - name: Upload the catalog seats
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-oscatalogseats-${{ matrix.app }}-${{ matrix.osprofile }}-${{ needs.assemble.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

  familyseats:
    name: Cut the per-app registry and provenance seats of the family
    needs: [assemble, nextzips, family, containerseats]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    # THE THOUSAND ASSET LADDER (the per-application seat lane): every
    # application of the family answers the release with its registry and
    # provenance seats beside the archives the other lanes ship — the
    # source snapshot seat (the git archive of the tagged application
    # tree at the maximum xz level), the maven classifier seats (the
    # sources jar of the tracked tree and the javadoc jar the javadoc
    # tool renders from the java carrier), the per-app sbom pair (the
    # cyclonedx inventory through the pack module the tarball ships and
    # the spdx 2.3 twin rendered beside it, both deterministic documents
    # with no timestamp), the per-app attestations record (the provenance
    # grammar the release-level record carries, over the application's
    # own asset set) and the per-app checksum umbrella — seven seats per
    # application, every one derived from the tagged tree at build time,
    # never a placeholder.
    steps:
      - name: Checkout the DevThink release source
        # the ref rides the workflow's own trusted context (the dispatch tag
        # or the pushed ref) — the same trusted-context law the assemble
        # lane adopted; the git archive of the seat lane reads HEAD, the
        # exact tree the release walk builds.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 1
      - name: Set up the java toolchain
        # the jar and javadoc seats need the real tools (the javadoc jar
        # carries the javadoc HTML the javadoc tool renders from the java
        # carrier — the same temurin toolchain the maven lanes use).
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '26'
      - name: Download every release lane artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: staging
          merge-multiple: true
      - name: Cut the source, maven and javadoc seats of every application
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          mkdir -p release seats sourceswork javadocwork
          find staging -maxdepth 1 -type f -exec cp {} release/ \;
          for app in devthink argan cadria cobaia debonair forge foundry getry saddle stealthhead vault; do
            # the source snapshot seat: the git archive of the tagged
            # application tree at the maximum xz level (tar first, then xz
            # -9e multithreaded — the decoder is tar -xJf everywhere).
            git archive --format=tar --prefix="${app}-${VERSION}/" HEAD "${app}" | xz -9e -T0 > "seats/${app}.${VERSION}.source.tar.xz"
            test -s "seats/${app}.${VERSION}.source.tar.xz"
            # the maven sources classifier: the tracked tree of the
            # application as the jar the maven channel attaches beside the
            # main jar.
            mkdir -p "sourceswork/${app}"
            git archive --format=tar --prefix="${app}/" HEAD "${app}" | tar -x -C "sourceswork/${app}"
            jar --create --file "seats/${app}-${VERSION}-sources.jar" -C "sourceswork/${app}" .
            test -s "seats/${app}-${VERSION}-sources.jar"
            # the maven javadoc classifier: the javadoc HTML the javadoc
            # tool renders from the java carrier of the application.
            mkdir -p "javadocwork/${app}"
            javadoc -package -quiet -d "javadocwork/${app}" "${app}/${app}.java"
            jar --create --file "seats/${app}-${VERSION}-javadoc.jar" -C "javadocwork/${app}" .
            test -s "seats/${app}-${VERSION}-javadoc.jar"
          done
          ! find seats -maxdepth 1 -type f -name '*_*' -print -quit | grep -q .
      - name: Render the sbom pair, the attestations record and the checksum umbrella of every application
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          mkdir -p manifestwork
          tar -xzf "release/wenathlan-devthink-${VERSION}.tgz" -C manifestwork package/pack.js
          node --input-type=module -e "
          import { createHash } from 'node:crypto';
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          const module = await import('./manifestwork/package/pack.js');
          const version = '${{ needs.assemble.outputs.version }}';
          const apps = ['devthink', 'argan', 'cadria', 'cobaia', 'debonair', 'forge', 'foundry', 'getry', 'saddle', 'stealthhead', 'vault'];
          const staged = (await readdir('release')).filter(name => name !== 'SHA256SUMS.txt').sort();
          const seatnames = (await readdir('seats')).sort();
          const checksumof = async (dir, name) => {
            const bytes = await readFile(dir + '/' + name);
            return { name, size: bytes.length, checksum: createHash('sha256').update(bytes).digest('hex') };
          };
          const stagedartifacts = [];
          for (const name of staged) stagedartifacts.push(await checksumof('release', name));
          for (const name of seatnames) stagedartifacts.push(await checksumof('seats', name));
          for (const app of apps) {
            const license = JSON.parse(await readFile(app + '/package.json', 'utf8')).license ?? 'GPL-3.0-only';
            const ownrecords = new Set([
              app + '.' + version + '.sbom.cyclonedx.json',
              app + '.' + version + '.sbom.spdx.json',
              app + '.' + version + '.attestations.json',
              app + '.' + version + '.sha256',
            ]);
            const assets = stagedartifacts.filter(artifact =>
              !ownrecords.has(artifact.name) &&
              (artifact.name.startsWith(app) ||
                artifact.name.startsWith('wenathlan-' + app + '-') ||
                (app === 'devthink' && artifact.name === 'RELEASENOTES.md')));
            if (assets.length === 0) throw new Error('the seat lane found no assets of ' + app);
            for (const artifact of assets) artifact.channels = module.artifactchannelof(artifact.name, version);
            /* the cyclonedx inventory of the application asset set through the pack module the tarball ships */
            const cyclonedx = {
              bomformat: 'CycloneDX',
              specversion: module.sbomspecversion,
              version: 1,
              metadata: {
                component: { type: 'application', 'bom-ref': 'wenathlan-' + app, name: app, version: version, licenses: [{ license: { id: license } }] },
                properties: [{ name: 'devthink:inventory', value: app + ' release artifacts' }],
              },
              components: assets.map(artifact => module.sbomcomponentof(artifact)),
            };
            await writeFile('seats/' + app + '.' + version + '.sbom.cyclonedx.json', JSON.stringify(cyclonedx, null, 2) + '\n', 'utf8');
            /* the spdx 2.3 twin: the same asset set through the spdx grammar — a deterministic document with no timestamp, the namespace anchored on the release tag */
            const spdx = {
              spdxVersion: 'SPDX-2.3',
              dataLicense: 'CC0-1.0',
              SPDXID: 'SPDXRef-DOCUMENT',
              name: app + '-' + version + '-release-assets',
              documentNamespace: 'https://github.com/wenathlan/devthink/releases/tag/v' + version + '#spdx-' + app,
              creationInfo: { creators: ['Tool: devthink-release-familyseats'] },
              packages: assets.map((artifact, index) => ({
                name: artifact.name,
                SPDXID: 'SPDXRef-File-' + (index + 1),
                downloadLocation: 'NOASSERTION',
                filesAnalyzed: false,
                checksums: [{ algorithm: 'SHA256', checksumValue: artifact.checksum }],
                licenseConcluded: license,
                licenseDeclared: license,
                copyrightText: 'NOASSERTION',
              })),
            };
            await writeFile('seats/' + app + '.' + version + '.sbom.spdx.json', JSON.stringify(spdx, null, 2) + '\n', 'utf8');
            /* the attestations record: the provenance grammar the release-level record carries, over the application's own asset set */
            const record = {
              name: app + ' attestations',
              version: version,
              application: app,
              attestation: { kind: 'provenance', issuer: 'github actions oidc', signing: 'the workflow identity, no signing key material lives in the repository' },
              artifacts: assets.map(artifact => ({ name: artifact.name, size: artifact.size, sha256: artifact.checksum })),
            };
            await writeFile('seats/' + app + '.' + version + '.attestations.json', JSON.stringify(record, null, 2) + '\n', 'utf8');
            /* the per-app checksum umbrella over the same set (never over itself) */
            const lines = assets.map(artifact => artifact.checksum + '  ' + artifact.name);
            await writeFile('seats/' + app + '.' + version + '.sha256', lines.join('\n') + '\n', 'utf8');
            console.log(app + ': ' + assets.length + ' assets under the seat umbrella');
          }
          const seats = (await readdir('seats')).length;
          if (seats !== 77) throw new Error('the family seat lane answers 77 seats, found ' + seats);
          console.log(JSON.stringify({ seats, applications: apps.length }));
          "
      - name: Attest the family seats through the workflow identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: seats/*
          show-snippet: false
      - name: Upload the family seat set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-familyseats-${{ needs.assemble.outputs.version }}
          path: seats/*
          if-no-files-found: error
          retention-days: 90

  releaseassets:
    name: Collect the release assets, emit the artifact manifest and write the digests
    # the asset collection waits for every producing lane: the nextzips job
    # builds the per-platform archive set of the family envelopes, the
    # containerseats job saves the per-architecture container seats, the
    # oscatalogseats job saves the os-distribution catalog seats of the
    # family containers, the familyseats job cuts the per-app registry
    # and provenance seats and the release notes carry them beside the
    # npm tarballs — a missing needs row raced the collection ahead of
    # the lane and the assets landed short.
    needs: [assemble, vsix, firefox, site, nextzips, sbom, attest, iso, wasm, family, containerseats, familyseats, oscatalogseats]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download every release lane artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: staging
          merge-multiple: true
      - name: Collect all distributable assets, emit the per-channel checksums, the artifact manifest and the reproducible digests
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          mkdir -p release
          find staging -maxdepth 1 -type f -exec cp {} release/ \;
          mkdir -p manifestwork
          tar -xzf "release/wenathlan-devthink-${VERSION}.tgz" -C manifestwork package/pack.js
          node --input-type=module -e "
          import { createHash } from 'node:crypto';
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          const module = await import('./manifestwork/package/pack.js');
          const version = '${{ needs.assemble.outputs.version }}';
          const ignored = new Set(['SHA256SUMS.txt', module.artifactmanifestnameof(version)]);
          const prenames = (await readdir('release')).filter(name => !ignored.has(name)).sort();
          /* the per-channel checksum umbrellas (the thousand asset ladder): every
             distribution channel with at least one staged asset answers its own
             sha256 umbrella — the github channel answers the release-level
             SHA256SUMS umbrella the step below writes, never a second file, and a
             channel with no staged asset (nuget answers the publish mirror's own
             lane) never renders an empty file. the umbrellas are scanned before
             any of them exists, so no umbrella ever covers itself. */
          const bychannel = new Map();
          for (const name of prenames) {
            for (const channel of module.artifactchannelof(name, version)) {
              if (channel === 'github') continue;
              if (!bychannel.has(channel)) bychannel.set(channel, []);
              bychannel.get(channel).push(name);
            }
          }
          const channelseats = [];
          for (const [channel, files] of [...bychannel.entries()].sort((left, right) => left[0].localeCompare(right[0]))) {
            const lines = [];
            for (const name of files) {
              const bytes = await readFile('release/' + name);
              lines.push(createHash('sha256').update(bytes).digest('hex') + '  ' + name);
            }
            const seat = 'sha256.channel.' + channel + '.' + version;
            await writeFile('release/' + seat, lines.join('\n') + '\n', 'utf8');
            channelseats.push(seat);
          }
          const names = [...prenames, ...channelseats].sort();
          const artifacts = [];
          for (const name of names) {
            const bytes = await readFile('release/' + name);
            artifacts.push({ name, size: bytes.length, checksum: createHash('sha256').update(bytes).digest('hex') });
          }
          const manifest = module.artifactmanifestof({ version, artifacts });
          const files = artifacts.map(artifact => ({ name: artifact.name, checksum: artifact.checksum }));
          const check = module.artifactmanifestcheck({ manifest, files, ignored: [...ignored] });
          if (!check.ok) throw new Error('The assembled set drifted from the artifact manifest: ' + JSON.stringify(check));
          await writeFile('release/' + module.artifactmanifestnameof(version), module.artifactmanifesttext(manifest), 'utf8');
          console.log(JSON.stringify({ artifacts: manifest.artifacts.length, channels: channelseats.length, manifest: module.artifactmanifestnameof(version) }));
          "
          (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum) > release/SHA256SUMS.txt
          test -f "release/devthink-sbom-${VERSION}.json"
          test -f "release/devthink-attestations-${VERSION}.json"
          test -f "release/devthink-artifactmanifest-${VERSION}.json"
          test -f "release/wenathlan-devthink-${VERSION}.tgz"
          test -f "release/devthink.${VERSION}.source.tar.xz"
          test -f "release/argan.container.${VERSION}.arm64.tar.gz"
          test -f "release/argan.${VERSION}.sbom.spdx.json"
          test -f "release/sha256.channel.site.${VERSION}"
          ls -lah release
      - name: Upload the complete release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-complete-${{ needs.assemble.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

  npmjs:
    name: Publish the flat distribution tarball to npmjs
    needs: [assemble, releaseassets, release-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the extension release-gate doctrine (the 2.0.18 port, the approval
    # gate repair): the registry publish answers through the explicit
    # release-approval gate job the lane needs - the one review the owner
    # grants for the whole release wave.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the release source for the node baseline file
        # the npmjs lane publishes from the downloaded artifact set alone, so
        # the node-version-file the setup reads needs its sparse checkout.
        # the ref rides the workflow's own trusted context (the dispatch tag
        # or the pushed ref) instead of the cross-job output the
        # cache-poisoning scan flags — the same trusted-context law the
        # assemble lane adopted: the metadata lockstep already proved the
        # tag points at this commit, so this checkout answers the same
        # source without an untrusted ref flowing into the lane.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          sparse-checkout: |
            devthink/.nvmrc
          fetch-depth: 1
      - name: Download the verified release set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-complete-${{ needs.assemble.outputs.version }}
          path: release
      - name: Set up Node with the npmjs registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: devthink/.nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the tarball checksums before the registry publish
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS.txt)
      - name: Verify publisher identity and publish the public npm package when absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "NODE_AUTH_TOKEN or NPM_TOKEN is required for automatic npmjs publishing." >&2; exit 1; }
          test -f "./release/wenathlan-devthink-${RELEASE_VERSION}.tgz"
          test ! -e "./release/wenathlan-extension-${RELEASE_VERSION}.tgz"
          npm whoami
          PACKAGE="@wenathlan/devthink@${RELEASE_VERSION}"
          if npm view "$PACKAGE" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "npmjs version already exists; skipping publish."
          else
            published=false
            for attempt in 1 2 3; do
              # the owner rule the publish mirror's family lanes carry (the
              # #81 fix): npm 12 refuses the IMPLICIT latest tag when the
              # rung lands below the registry latest (the devthink retired
              # 2.1.x line the registry heal moved back), so the ladder's
              # own npmjs publish stamps the explicit tag exactly like the
              # sibling envelopes - the dist-tag realignment below then
              # pins latest to the release version.
              publish_output="$(npm publish "./release/wenathlan-devthink-${RELEASE_VERSION}.tgz" --registry=https://registry.npmjs.org --access public --provenance --tag latest 2>&1)" && { published=true; break; }
              # the twin npm lane of the publish workflow races this one on
              # the same rung (the release published event fires it while
              # this ladder still walks): the registry answers 409 "cannot
              # publish over previously published" when the twin already
              # landed and 409 "previously staged" while the twin landing
              # still finalizes (the version stays invisible to npm view
              # until it does) - both forms mean OUR rung is live through
              # the sibling and answer as the idempotent win
              if printf '%s' "$publish_output" | grep -qiE "cannot publish over previously (published|staged)"; then
                echo "npmjs version landed through the sibling lane; the latecomer answers already published."
                published=true; break
              fi
              if npm view "$PACKAGE" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                echo "npmjs version landed through the sibling lane; the registry view answers present."
                published=true; break
              fi
              printf '%s\n' "$publish_output"
              echo "The npmjs publish attempt ${attempt} failed; the bounded retry policy retries inside three attempts."
              sleep "$((attempt * 5))"
            done
            test "$published" = true
          fi

  githubrelease:
    name: Gather, verify and publish the DevThink github release
    needs: [assemble, releaseassets, release-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the extension release-gate doctrine (the 2.0.18 port, the approval
    # gate repair): the release flip answers through the explicit
    # release-approval gate job the lane needs - the one review the owner
    # grants for the whole release wave.
    permissions:
      contents: write
    steps:
      - name: Download the complete release set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-complete-${{ needs.assemble.outputs.version }}
          path: release
      - name: Gather every artifact into the draft release before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${{ needs.assemble.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${{ needs.assemble.outputs.tag }}" --repo "$GITHUB_REPOSITORY" release/* --clobber
          else
            gh release create "${{ needs.assemble.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft --title "DevThink ${{ needs.assemble.outputs.version }}" --notes-file release/RELEASENOTES.md release/*
          fi
      - name: Download every release asset and verify the checksums before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh release download "${{ needs.assemble.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir verified --clobber
          (cd verified && sha256sum --check SHA256SUMS.txt)
      - name: Publish the verified release
        env:
          # the flip owns the published event the family artifact lanes
          # answer: the repository token never fires it (the github token
          # event suppression), so the flip rides the owner pat whenever
          # the secret exists and the app token keeps the lane standing
          # when it does not.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.assemble.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --title "DevThink ${{ needs.assemble.outputs.version }}" --notes-file release/RELEASENOTES.md

      - name: Lock the published release as immutable
        # the immutable release doctrine: once the verified set answers
        # live, the release locks — the assets, the notes and the tag
        # freeze, and the SHA256SUMS umbrella becomes the immutable form of
        # the distribution. the lock is the repository setting that prevents
        # modifications to published releases; the draft → attach → publish
        # chain above is exactly the flow the setting recommends, and this
        # step verifies the lock took hold (a release answering mutable
        # raises a notice naming the one switch to flip).
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ needs.assemble.outputs.tag }}" --jq .id)"
          locked="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .immutable)"
          if [ "${locked}" != "true" ]; then
            echo "::notice::The release answered mutable. Enable immutable releases once: repository Settings → General → Releases → prevent modifications to published releases. Every next release locks at publish."
          fi

  iso:
    name: Cut the installable OS distribution of DevThink
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # the installable OS distribution: DevThink sustains itself through the
    # domain, so the ISO carries the minimal footprint — the release sources,
    # the npm tarball and the installer scripts — and the machine needs
    # nothing beyond the disc image itself. the sha umbrella of the
    # releaseassets lane sweeps the artifact automatically.
    steps:
      - name: Download the base release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-base-${{ needs.assemble.outputs.version }}
          path: release
      - name: Install the xorriso ISO assembler
        run: sudo apt-get update -q && sudo apt-get install -qy xorriso
      - name: Stage the distribution tree and cut the ISO
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          mkdir -p iso/devthink iso/install
          cp release/*.tar.xz release/*.tgz iso/devthink/
          {
            echo "DevThink — the installable OS distribution."
            echo "The system sustains itself through the domain: the ISO is the minimal"
            echo "footprint a machine carries. Install the sources with the script for"
            echo "your platform (install/install.sh on unix, install/install.ps1 on"
            echo "Windows), install Node from the .nvmrc of the source tree and boot the"
            echo "runtime — everything else rides the domains over HTTPS."
          } > iso/README.txt
          {
            echo "#!/usr/bin/env bash"
            echo "# DevThink OS installer — unpacks the release source into the user home."
            echo "set -euo pipefail"
            echo 'DIR="$(cd "$(dirname "$0")/.." && pwd)"'
            echo 'tar -xJf "$DIR"/devthink/devthink-v*-source.tar.xz -C "$HOME"'
            echo 'echo "DevThink unpacked into $HOME. Install Node (see the .nvmrc), then:"'
            echo 'echo "  cd \"$HOME\"/devthink-*/devthink && npm ci && npm run server"'
          } > iso/install/install.sh
          {
            echo "# DevThink OS installer — unpacks the release source into the user home."
            echo '$ErrorActionPreference = "Stop"'
            echo '$root = Split-Path -Parent (Split-Path -Parent $MyInvocation.MyCommand.Path)'
            echo '$source = Get-ChildItem "$root\devthink\devthink-v*-source.tar.xz" | Select-Object -First 1'
            echo 'tar -xJf $source.FullName -C $env:USERPROFILE'
            echo 'Write-Host "DevThink unpacked. Install Node (see the .nvmrc), then run the serve script of the source tree."'
          } > iso/install/install.ps1
          xorriso -as mkisofs -iso-level 3 -J -joliet-long -V "DEVTHINK_${VERSION}" -output "release/devthink-v${VERSION}-install.iso" iso/
          (cd release && sha256sum "devthink-v${VERSION}-install.iso")
      - name: Upload the installable OS distribution artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-iso-${{ needs.assemble.outputs.version }}
          path: release/devthink-v${{ needs.assemble.outputs.version }}-install.iso
          retention-days: 90

  wasm:
    name: Compile the family engines to the wasm distribution
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # the wasm distribution: the pure engine cores (versawase of cadria,
    # katexis of debonair) bundle with the repository esbuild and compile
    # through the javy quickjs toolchain into .wasm modules the saddle wasm
    # sandbox mounts at run time.
    steps:
      - name: Checkout the release source for the engine cores
        # the ref rides the workflow's own trusted context (the dispatch tag
        # or the pushed ref) instead of the cross-job output the
        # cache-poisoning scan flags — the same trusted-context law the
        # assemble lane adopted: the metadata lockstep already proved the
        # tag points at this commit, so this checkout answers the same
        # source without an untrusted ref flowing into the lane.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          sparse-checkout: |
            cadria/versawase.ts
            debonair/katexis.ts
            devthink/.nvmrc
            devthink/package.json
            devthink/bun.lock
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: devthink/.nvmrc
          package-manager-cache: false
      - name: Set up bun
        # the devthink application pins bun (packageManager bun@1.4.2), so the
        # toolchain installs that touch it delegate to this exact bun build.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install the locked toolchain for the wasm lane
        # the scripts stay off the frozen install the way every family lane
        # keeps them (the better-sqlite3 gyp lottery): the wasm lane compiles
        # pure engine cores no native binding ever rides. the javy compiler
        # answers the exact-pinned bunx fetch of the compile step below —
        # the global npm install the dependency scan flags unpinned (and
        # whose npm cache write fed the cache-poisoning finding) retires;
        # bunx resolves javy-cli 3.0.1 from the registry the same locked way
        # the lane resolves esbuild.
        run: bun install --cwd devthink --frozen-lockfile --ignore-scripts
      - name: Bundle the pure engine cores and compile them to wasm
        run: |
          set -euo pipefail
          VERSION="${{ needs.assemble.outputs.version }}"
          mkdir -p wasmwork release
          (cd devthink && bunx esbuild ../cadria/versawase.ts --bundle --format=esm --platform=neutral --outfile=../wasmwork/versawase.js)
          (cd devthink && bunx esbuild ../debonair/katexis.ts --bundle --format=esm --platform=neutral --outfile=../wasmwork/katexis.js)
          bunx javy-cli@3.0.1 compile wasmwork/versawase.js -o wasmwork/versawase.wasm
          bunx javy-cli@3.0.1 compile wasmwork/katexis.js -o wasmwork/katexis.wasm
          {
            echo "{"
            echo "  \"version\": \"${VERSION}\","
            echo "  \"runtime\": \"javy quickjs\","
            echo "  \"engines\": [\"versawase\", \"katexis\"],"
            echo "  \"purpose\": \"the wasm distribution of the family engine cores, mounted by the saddle wasm sandbox\""
            echo "}"
          } > wasmwork/manifest.json
          # the maximum-compression flow the owner ordered: tar first, then
          # xz at the highest preset (-9e, multithreaded) — the decoder is
          # tar -xJf, one command, everywhere. every code archive of the
          # release answers this same flow.
          tar -cf - -C wasmwork versawase.wasm katexis.wasm manifest.json | xz -9e -T0 > "release/devthink-v${VERSION}-wasm.tar.xz"
          (cd release && sha256sum "devthink-v${VERSION}-wasm.tar.xz")
      - name: Upload the wasm distribution artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wasm-${{ needs.assemble.outputs.version }}
          path: release/devthink-v${{ needs.assemble.outputs.version }}-wasm.tar.xz
          retention-days: 90

  family:
    name: Pack the family distribution packages of the release
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # the family distribution packages of the release: every family envelope
    # answers npm pack from its own folder (the documentation envelopes carry
    # no build — the files field answers the tracked documentation set and
    # the tests directory, so the pack run is the whole validation) and the
    # packages ride beside the application tarball, swept into the
    # SHA256SUMS umbrella by the releaseassets lane. the saddle envelope is
    # the one exception the loop carries: an ENGINE package whose
    # main/types/bin and the whole exports map promise ./dist/* files — the
    # build step below compiles them before the pack, or the tarball ships
    # sources the exports map cannot resolve (the 2.0.151 lesson: the
    # registry envelope carried no dist at all).
    steps:
      - name: Checkout the release source for the family envelopes
        # the ref rides the workflow's own trusted context (the dispatch tag
        # or the pushed ref) instead of the cross-job output the
        # cache-poisoning scan flags — the same trusted-context law the
        # assemble lane adopted: the metadata lockstep already proved the
        # tag points at this commit, so this checkout answers the same
        # source without an untrusted ref flowing into the lane.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 1
      - name: Build the saddle engine envelope (the exports promise)
        # the saddle manifest gates publish on the built dist through
        # prepublishOnly → pack:check → check → build:engine, but npm pack
        # never runs that gate and the saddle .npmrc carries ignore-scripts
        # for the install lanes (the better-sqlite3 gyp lottery), so the
        # engine compiles HERE, explicitly, before any pack touches the
        # folder — the lane asserts what it ships: the entries the exports
        # map, the bin and the main/types pair declare.
        run: |
          set -euo pipefail
          npm --prefix saddle ci --ignore-scripts
          test -f saddle/index.ts
          test -f saddle/cli.ts
          test -f saddle/browser.ts
          test -f saddle/distribution.ts
          test -f saddle/execution.ts
          test -f saddle/foundation.ts
          test -f saddle/isolation.ts
          test -f saddle/modalities.ts
          test -f saddle/sandbox.ts
          test -f saddle/server.ts
          test -f saddle/virtual.ts
          test -f saddle/workloadlaw.ts
      - name: Pack every family envelope beside the application tarball
        run: |
          set -euo pipefail
          mkdir -p familypack
          # the canonical family pass order (the owner doctrine): the
          # envelopes answer in the family order - argan, cadria, cobaia,
          # debonair, forge, foundry, getry, stealthhead, vault - and
          # saddle always last, the heaviest pass of the house (the
          # distribution-completeness law: the monetization cobaia rides
          # the envelope set beside the gateway getry, so every
          # application envelope of the monorepo answers the family
          # pack). The devthink application tarball answers from the
          # assemble lane above (the built flat distribution), never
          # from a raw source pack.
          # the vault node faces build before the pack (the node face
          # law): the runtime faces the saddle webserver reads answer the
          # node condition with the self-contained build js, so the family
          # tarball and every registry lane carry the faces plain node
          # executes (the same build.ts the publish lane builds).
          cd vault
          npx --yes npm@11.20.0 install --no-save --ignore-scripts --no-audit --no-fund esbuild@0.28.2
          node --experimental-strip-types build.ts
          test -s build/onboardingstore.js
          test -s build/labelstore.js
          cd ..
          for app in argan cadria cobaia debonair forge foundry getry stealthhead vault saddle; do
            npm pack "./${app}" --pack-destination familypack
          done
          ls -lah familypack
      - name: Upload the family distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-family-${{ needs.assemble.outputs.version }}
          path: familypack/*.tgz
          if-no-files-found: error
          retention-days: 90

  familynpmjs:
    name: Publish every family package to npmjs
    needs: [assemble, family, release-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # the extension release-gate doctrine (the 2.0.18 port, the approval
    # gate repair): the family registry publishes answer through the
    # explicit release-approval gate job the lane needs - the one review
    # the owner grants for the whole release wave.
    permissions:
      contents: read
      id-token: write
    # the family distribution law: every family envelope publishes to the
    # registry exactly like the flat application tarball does - the original
    # saddle repository carried its own npm publish pipeline, and the family
    # carries the same right inside the monorepo. Every package publishes
    # under the same idempotent contract: an existing version answers the
    # win, the registry 409 twin answers answer the win, and every other
    # failure keeps the bounded retry.
    steps:
      - name: Download the family distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-family-${{ needs.assemble.outputs.version }}
          path: familypack
      - name: Set up Node with the npmjs registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish every family package when absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "NODE_AUTH_TOKEN or NPM_TOKEN is required for automatic npmjs publishing." >&2; exit 1; }
          npm whoami
          publish_one() {
            tarball="$1"
            # the ./ prefix keeps npm reading the path as a file: a bare
            # folder/tarball form parses as a git shorthand and the publish
            # dials ssh instead of the registry
            package="@wenathlan/$(basename "$tarball" | sed -E 's/^wenathlan-(.+)-[0-9]+\.[0-9]+\.[0-9]+\.tgz$/\1/')@${RELEASE_VERSION}"
            if npm view "$package" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$package already exists; skipping publish."
              return 0
            fi
            published=false
            for attempt in 1 2 3; do
              # the owner rule the publish workflow's family mirror carries:
              # the envelope publishes ALWAYS while the token exists - the
              # explicit latest tag answers the implicit-latest refusal npm
              # raises when a rung lands below the registry latest (the
              # saddle envelope still walks under its retired 2.1.6 line), so
              # the registry versions stay distinct strings and the dist-tag
              # lands on the release rung the family stamp declares
              publish_output="$(npm publish "./${tarball}" --registry=https://registry.npmjs.org --access public --provenance --tag latest 2>&1)" && { published=true; break; }
              # one refused envelope never blocks the family: a private-marked
              # or otherwise unregistrable envelope answers the honest skip
              # and the loop walks on to the next sibling
              if printf '%s' "$publish_output" | grep -qiE "has been marked as private"; then
                echo "$package is marked private in its manifest; the envelope waits for the manifest fix, the family walks on."
                return 0
              fi
              if printf '%s' "$publish_output" | grep -qiE "cannot publish over previously (published|staged)"; then
                echo "$package landed through the sibling lane; the latecomer answers already published."
                published=true; break
              fi
              if npm view "$package" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                echo "$package landed through the sibling lane; the registry view answers present."
                published=true; break
              fi
              printf '%s\n' "$publish_output"
              echo "The npmjs publish attempt ${attempt} of $package failed; the bounded retry policy retries inside three attempts."
              sleep "$((attempt * 5))"
            done
            test "$published" = true
          }
          for tarball in familypack/*.tgz; do
            publish_one "$tarball"
          done

  familyghcr:
    name: Publish every family container to GHCR
    needs: [assemble, release-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # the extension release-gate doctrine (the 2.0.18 port, the approval
    # gate repair) every registry publish of the house answers: the lane
    # pushes container images to the github container registry exactly the
    # way the npmjs, githubrelease and familynpmjs jobs above publish
    # theirs, so the explicit release-approval gate job the lane needs
    # gates this container push the same way its family-ghcr mirror of the
    # publish workflow is gated - no registry publish of the release
    # ladder rides around the approval gate.
    permissions:
      contents: read
      packages: write
    # the container distribution law: every family application builds its
    # own Dockerfile and pushes the image to the github container registry
    # under the family owner, tagged with the release version - the immutable
    # version form the release identity policy carries (the rolling tag
    # stays with the registry conventions, never this lane).
    steps:
      - name: Checkout the release source
        # the ref rides the workflow's own trusted context (the dispatch tag
        # or the pushed ref) instead of the cross-job output the
        # cache-poisoning scan flags — the same trusted-context law the
        # assemble lane adopted: the metadata lockstep already proved the
        # tag points at this commit, so this checkout answers the same
        # source without an untrusted ref flowing into the lane.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 1
      - name: Log in to the github container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Build and push every family container
        env:
          RELEASE_VERSION: ${{ needs.assemble.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for app in argan cadria cobaia debonair devthink forge foundry getry saddle stealthhead vault; do
            test -f "./${app}/Dockerfile" || { echo "${app}: no Dockerfile, skipping."; continue; }
            # the container shape law every Dockerfile declares: the case
            # map below is the single place a shape registers (the publish
            # lane stages the same map for the site containers). the three
            # site homes (argan, cadria, debonair) ride the staged
            # familybuildctx the 2.0.153 family context fix introduced -
            # the application nested under app/ with the copy-law vault
            # sibling beside it (the label store bridge answers the
            # @wenathlan/vault/labelstore imports through the ../vault
            # aliases, so the vault sources ride every family context);
            # the workbench image builds from the repository root the
            # family-context law its Dockerfile header records; the flatctx
            # wave staged every alias-carrying site home (cobaia,
            # stealthhead, forge, foundry, getry) beside its siblings, and
            # only the self-contained vault engine keeps its own folder.
            # the legacy saddle container package of the standalone era keeps
            # its own access list (the 2.1.x line the old repository
            # published there): the merged repository token answers
            # permission_denied on every push, and the denial reddens the
            # loop before stealthhead and vault ever build. the saddle
            # container distributions answer the vhe lane of the publish
            # workflow - the max, balanced and lite profiles under the
            # -vhe tag family of the devthink package the repository token
            # writes - so the family lane walks past the legacy package
            # honestly instead of failing on a registry permission no
            # workflow can carry.
            if [ "${app}" = "saddle" ]; then
              echo "saddle: the legacy container package keeps the standalone era access list; the saddle containers answer the vhe lane of the publish workflow."
              continue
            fi
            image="ghcr.io/${OWNER,,}/${app}"
            echo "building ${image}:${RELEASE_VERSION}"
            # THE CONTAINERS-LANE CONTEXT LAW (the tsroot sibling sync): the
            # case map mirrors the containers workflow the eleven-container
            # standard proved — every site home stages the routerbase base
            # (app + vault + devthink, sources only) beside the per-app
            # sibling map its Dockerfile COPYs read (the tsroot wave seated
            # the cross-app imports the older maps predate), the vault
            # engine rides the staged closure (vault at the context root
            # with its devthink, foundry and saddle siblings), and the
            # workbench owns the repository root the family law records.
            case "${app}" in
              devthink)
                docker build -t "${image}:${RELEASE_VERSION}" -f devthink/Dockerfile --target runtime .
                ;;
              vault)
                # the vault closure heal: vault at the context root (the
                # shape its COPYs read) with the devthink routerbase, the
                # foundry pipeline and the saddle modality siblings nested
                rm -rf vaultbuildctx
                mkdir -p vaultbuildctx/devthink vaultbuildctx/foundry vaultbuildctx/saddle
                cp -a vault/. vaultbuildctx/
                cp -a devthink/. vaultbuildctx/devthink/
                cp -a foundry/. vaultbuildctx/foundry/
                cp -a saddle/. vaultbuildctx/saddle/
                rm -rf vaultbuildctx/devthink/.git \
                       vaultbuildctx/devthink/node_modules \
                       vaultbuildctx/devthink/dist \
                       vaultbuildctx/devthink/build \
                       vaultbuildctx/foundry/node_modules \
                       vaultbuildctx/foundry/dist \
                       vaultbuildctx/foundry/build \
                       vaultbuildctx/saddle/node_modules \
                       vaultbuildctx/saddle/dist \
                       vaultbuildctx/saddle/build
                printf '%s\n' 'devthink/.git' 'devthink/node_modules' 'foundry/node_modules' 'saddle/node_modules' '**/node_modules' > vaultbuildctx/.dockerignore
                docker build -t "${image}:${RELEASE_VERSION}" -f vault/Dockerfile vaultbuildctx
                ;;
              *)
                # the staged family shape: the routerbase base every home
                # answers (app + vault + devthink) beside the sibling map
                rm -rf familybuildctx
                mkdir -p familybuildctx/app familybuildctx/vault familybuildctx/devthink
                cp -a "${app}/." familybuildctx/app/
                printf '\nminimumReleaseAge: 0\n' >> familybuildctx/app/pnpm-workspace.yaml
                cp -a vault/. familybuildctx/vault/
                cp -a devthink/. familybuildctx/devthink/
                rm -rf familybuildctx/vault/node_modules \
                       familybuildctx/vault/dist \
                       familybuildctx/vault/build \
                       familybuildctx/devthink/node_modules \
                       familybuildctx/devthink/dist \
                       familybuildctx/devthink/build
                case "${app}" in
                  argan)          siblings="debonair saddle" ;;
                  cobaia|stealthhead) siblings="saddle" ;;
                  cadria)         siblings="debonair argan" ;;
                  debonair)       siblings="cadria saddle argan" ;;
                  forge)          siblings="saddle foundry" ;;
                  foundry)        siblings="saddle" ;;
                  getry)          siblings="saddle debonair" ;;
                  *)              siblings="" ;;
                esac
                for sib in $siblings; do
                  mkdir -p "familybuildctx/${sib}"
                  cp -a "${sib}/." "familybuildctx/${sib}/"
                  rm -rf "familybuildctx/${sib}/node_modules" "familybuildctx/${sib}/dist" "familybuildctx/${sib}/build"
                done
                docker build -t "${image}:${RELEASE_VERSION}" -f "${app}/Dockerfile" familybuildctx
                ;;
            esac
            docker push "${image}:${RELEASE_VERSION}"
            echo "${app}: pushed ${image}:${RELEASE_VERSION}"
          done
