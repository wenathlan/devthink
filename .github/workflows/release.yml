name: DevThink Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: package
        shell: bash
        run: |
          VERSION=$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("package.json","utf8")).version)')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: bun run check
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web check
      - run: pnpm --dir web build

  build:
    needs: [metadata, check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: bun-linux-x64
          - name: macos-arm64
            target: bun-darwin-arm64
          - name: windows-x64
            target: bun-windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: mkdir -p release
      - run: bun run build.ts --target "${{ matrix.target }}" --outfile "release/devthink-${{ matrix.name }}${{ matrix.name == 'windows-x64' && '.exe' || '' }}"
      - run: sha256sum release/* > "release/SHA256SUMS-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: devthink-${{ matrix.name }}
          path: release/
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: devthink-*
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: DevThink v${{ needs.metadata.outputs.version }}
          body_path: CHANGELOG.md
          files: release/*
          fail_on_unmatched_files: true
