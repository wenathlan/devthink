name: DevThink Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing DevThink version tag to build and publish.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: devthink-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Checkout tagged DevThink source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: package
        name: Read package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("package.json","utf8")).version)')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - id: ref
        name: Verify version tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ "${TAG}" != "v${{ steps.package.outputs.version }}" ]; then
            echo "Tag ${TAG} must match package version v${{ steps.package.outputs.version }}." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

  check:
    name: Validate tagged source
    needs: metadata
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.metadata.outputs.ref }}

  build:
    name: Build ${{ matrix.name }} binary
    needs: [metadata, check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: bun-linux-x64
            extension: ""
          - name: macos-arm64
            target: bun-darwin-arm64
            extension: ""
          - name: windows-x64
            target: bun-windows-x64
            extension: .exe
    steps:
      - name: Checkout tagged DevThink source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - name: Set up Bun compiler
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Compile self-contained binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          bun run build.ts --target "${{ matrix.target }}" --outfile "release/devthink-${{ matrix.name }}${{ matrix.extension }}"
      - name: Write checksum
        shell: bash
        run: sha256sum release/* > "release/SHA256SUMS-${{ matrix.name }}.txt"
      - name: Upload release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink-${{ matrix.name }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publish DevThink release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged DevThink source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - name: Download binary artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          pattern: devthink-*
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: DevThink v${{ needs.metadata.outputs.version }}
          body_path: CHANGELOG.md
          files: release/*
          fail_on_unmatched_files: true
