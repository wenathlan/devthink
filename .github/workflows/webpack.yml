              echo "::warning::the nuget registry answered 403 forbidden (the account packages billing wall) on the ${PKG}.webpack ${VERSION} envelope - the mirror rung keeps its seat unpublished and the next maintenance dispatch retries it idempotently once the quota lifts."
              rm -f "${pushlog}"
              break
            fi
            rm -f "${pushlog}"
            echo "the nuget webpack push attempt ${attempt}/3 of the ${PKG}.webpack envelope failed; retrying with backoff."
            sleep "$((attempt * 5))"
          done
          if [ "$pushed" != true ] && [ "$billing" -ne 1 ]; then
            echo "::error::the nuget webpack push of the ${PKG}.webpack envelope failed after the bounded retries."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-webpacknuget-${{ matrix.package }}-${{ steps.release.outputs.version }}
          path: |
            ${{ matrix.package }}.nuget.webpack.${{ steps.release.outputs.version }}.nupkg
            ${{ matrix.package }}.sha256.nuget.webpack.${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.package }}.nuget.webpack.${VERSION}.nupkg" \
            "${{ matrix.package }}.sha256.nuget.webpack.${VERSION}" --clobber

