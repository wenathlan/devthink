        run: |
          set -euo pipefail
          PKG="${{ matrix.package }}"
          VERSION="${{ steps.release.outputs.version }}"
          test -s "seat/${PKG}.webpack.${VERSION}.cjs"
          test -f "${PKG}/${PKG}.gemspec"
          mkdir -p gemwork
          cp "seat/${PKG}.webpack.${VERSION}.cjs" "gemwork/${PKG}.webpack.cjs"
          sed -e "s|spec.name = \"${PKG}\"|spec.name = \"${PKG}.webpack\"|" \
              -e "s|spec.files = .*|spec.files = Dir[\"${PKG}.webpack.js\"]|" \
              -e "s|spec.summary = \".*\"|spec.summary = \"The ${PKG} webpack distribution bundle (the engine payload the webpack CLI seat bundles).\"|" \
              "${PKG}/${PKG}.gemspec" > "gemwork/${PKG}.webpack.gemspec"
          grep -q "spec.name = \"${PKG}.webpack\"" "gemwork/${PKG}.webpack.gemspec"
          cd gemwork
          env "${{ steps.release.outputs.versionarg }}=${VERSION}" gem build "${PKG}.webpack.gemspec"
          test -f "${PKG}.webpack-${VERSION}.gem"
          cd ..
          cp "gemwork/${PKG}.webpack-${VERSION}.gem" "${PKG}.rubygems.webpack.${VERSION}.gem"
          sha256sum "${PKG}.rubygems.webpack.${VERSION}.gem" > "${PKG}.sha256.rubygems.webpack.${VERSION}"
          test -s "${PKG}.sha256.rubygems.webpack.${VERSION}"
          ! printf '%s\n' \
            "${PKG}.rubygems.webpack.${VERSION}.gem" \
            "${PKG}.sha256.rubygems.webpack.${VERSION}" | grep -q "_"
      - name: publish the webpack gem
        # the gem name glob stays unquoted on purpose: gem push does not
        # glob the path itself, and the work directory carries the one
        # gem the seat built.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKG="${{ matrix.package }}"
          VERSION="${{ steps.release.outputs.version }}"
          published=false
          billing=0
          for attempt in 1 2 3; do
            pushlog="$(mktemp)"
            if pushlog_out="$(cd gemwork && gem push ${PKG}.webpack-${VERSION}.gem --key github --host "https://rubygems.pkg.github.com/${{ github.repository_owner }}" 2>&1)"; then
              printf '%s' "$pushlog_out" | tee "${pushlog}"
              published=true
              rm -f "${pushlog}"
              break
            fi
            printf '%s' "$pushlog_out" | tee "${pushlog}" >/dev/null
            if echo "$pushlog_out" | grep -q "has already been pushed"; then
              echo "::notice::the registry already carries ${PKG}.webpack ${VERSION}; the immutable envelope is present."
              published=true
              rm -f "${pushlog}"
              break
            fi
            if echo "$pushlog_out" | grep -qiE "billing limit|403"; then
              billing=1
              echo "::warning::the rubygems registry answered the account billing wall on the ${PKG}.webpack ${VERSION} gem - the mirror rung keeps its seat unpublished and the next maintenance dispatch retries it idempotently once the quota lifts."
              rm -f "${pushlog}"
              break
            fi
            rm -f "${pushlog}"
            echo "gem push attempt ${attempt}/3 of the ${PKG}.webpack gem failed; retrying with backoff."
            sleep "$((attempt * 5))"
          done
          if [ "$published" != true ] && [ "$billing" -ne 1 ]; then
            echo "::error::gem push of the ${PKG}.webpack envelope failed after the bounded retries."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-webpackrubygems-${{ matrix.package }}-${{ steps.release.outputs.version }}
          path: |
            ${{ matrix.package }}.rubygems.webpack.${{ steps.release.outputs.version }}.gem
            ${{ matrix.package }}.sha256.rubygems.webpack.${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.package }}.rubygems.webpack.${VERSION}.gem" \
            "${{ matrix.package }}.sha256.rubygems.webpack.${VERSION}" --clobber
