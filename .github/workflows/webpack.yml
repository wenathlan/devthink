            sleep "$((attempt * 5))"
          done
          if [ "$published" != true ] && [ "$billing" -ne 1 ]; then
            echo "::error::the github npm webpack publish of the ${PKG} envelope failed after the bounded retries."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-webpackgithubnpm-${{ matrix.package }}-${{ steps.release.outputs.version }}
          path: |
            ${{ matrix.package }}.github.webpack.${{ steps.release.outputs.version }}.tgz
            ${{ matrix.package }}.sha256.github.webpack.${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.package }}.github.webpack.${VERSION}.tgz" \
            "${{ matrix.package }}.sha256.github.webpack.${VERSION}" --clobber

  webpackmaven:
    name: webpack maven ${{ matrix.package }}
    needs: [webpackseats, release-approval]
    # the Maven x webpack matrix: the bundle rides the com.wenathlan
    # coordinates the family maven lane owns, the single-file seat
