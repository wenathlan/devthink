        run: |
          set -euo pipefail
          PKG="${{ matrix.package }}"
          VERSION="${{ steps.release.outputs.version }}"
          test -s "seat/${PKG}.webpack.${VERSION}.cjs"
          mkdir -p nugetwork
          cp "seat/${PKG}.webpack.${VERSION}.cjs" "nugetwork/${PKG}.webpack.js"
          cat > "nugetwork/${PKG}.webpack.csproj" <<CSPROJ
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFrameworks>netstandard2.0;netstandard2.1</TargetFrameworks>
              <AssemblyName>${PKG}.webpack</AssemblyName>
              <RootNamespace>${PKG}.webpack</RootNamespace>
              <PackageId>${PKG}.webpack</PackageId>
              <Version>${VERSION}</Version>
              <Authors>wenathlan</Authors>
              <Description>The ${PKG} webpack distribution bundle — the single-file engine payload the DevThink Webpack workflow cuts.</Description>
              <PackageLicenseExpression>GPL-3.0-only</PackageLicenseExpression>
              <PackageProjectUrl>https://github.com/wenathlan/devthink</PackageProjectUrl>
              <RepositoryUrl>https://github.com/wenathlan/devthink</RepositoryUrl>
              <PackageRequireLicenseAcceptance>false</PackageRequireLicenseAcceptance>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup>
              <None Include="${PKG}.webpack.cjs" Pack="true" PackagePath="webpack/" />
            </ItemGroup>
          </Project>
          CSPROJ
          cd nugetwork
          dotnet pack "${PKG}.webpack.csproj" --configuration Release --output . -p:PackageVersion="${VERSION}"
          cd ..
          NUPKG="$(find nugetwork -maxdepth 1 -name "${PKG}.webpack.${VERSION}.nupkg" -print -quit)"
