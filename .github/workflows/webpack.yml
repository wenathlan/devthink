            if dotnet nuget push "${PKG}.nuget.webpack.${VERSION}.nupkg" --api-key "${GITHUB_TOKEN}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate 2>&1 | tee "${pushlog}"; then pushed=true; rm -f "${pushlog}"; break; fi
