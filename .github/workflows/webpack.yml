# the webpack distribution workflow of the house — the owner doctrine the
# corridor clarified and the fusion order the latest breath sealed: the
# webpack the platform speaks is THE WORKFLOW THAT CREATES THE WEBPACK
# DISTRIBUTION (the github actions seat, never a file naming flavor),
# the reason every application envelope carries the webpack and
# webpack-cli dependencies beside the esbuild carrier the transpile
# rides. the wave bundles every one of the eleven applications through
# the webpack CLI into the single-file distribution seat (the esbuild
# carrier walks the typescript sources to the plain script the webpack
# CLI bundles, the packages staying external the way the envelope
# dependency blocks already answer) and attaches the bundle beside its
# checksum to the release — the visible distribution the owner law
# names. the registry publication of that bundle rides the ORIGINAL
# packages alone: the publish workflow's family lanes embed the
# <app>.webpack.cjs seat inside the normal envelopes they already ship
# (the @wenathlan/<app> npm envelope carrying the bundle in its files,
# the com.wenathlan.<app> maven artifact the normal name — forge,
# cadria and the eleven — carrying the webpack classifier, the gradle
# module, the nuget package and the rubygem the same embed), so the
# variant seats the older wave published under the .webpack names —
# @wenathlan/<app>.webpack, com.wenathlan.<app>.webpack, the
# <app>.webpack nuget and gem flavors — are dead by the owner order
# (canceled, excluded from every registry, the feature embedded in the
# original that never carried the webpack trace in the name). the asset
# grammar rides the dotted law (<app>.webpack.<version>.cjs and the
# sha256 twin) and never an underscore, the asset lane stays outside the
# release-approval gate the registry lanes answer, and the bundle
# compiles once per rung for every consumer the fusion seats.
name: DevThink Webpack

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: the release tag the webpack matrices publish (empty answers the latest release)
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # the event-scoped group (the family concurrency doctrine): the release
  # published and dispatch firings are distinct lanes that never cancel
  # one another; only a superseded firing of the SAME event and ref waits
  # behind the running one (cancel-in-progress stays false so no webpack
  # leg is ever cancelled mid-push).
  group: devthink-webpack-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  webpackseats:
    name: webpack ${{ matrix.package }}
    # the bundle lane: every application walks the esbuild carrier (the
    # typescript sources to the plain commonjs script, the packages
    # external the way the envelope dependency blocks already answer)
    # and the webpack CLI bundles the carrier into the single-file
    # distribution seat — the one build the release carries and the
    # publish workflow's family lanes consume (the embed the fusion law
    # seats: the original envelopes re-run the same carrier when they
    # pack their own bundle seat, the variant registry lanes the older
    # wave owned are dead by the owner order).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # the eleven applications the webpack law covers — the envelope
        # beside the ten siblings, the canonical alphabetical pass order.
        package: [argan, cadria, cobaia, debonair, devthink, forge, foundry, getry, saddle, stealthhead, vault]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: bundle the webpack distribution seat
        # the carrier law the corridor clarified: the webpack CLI and the
        # webpack dependencies the envelopes carry exist FOR this seat —
        # the esbuild carrier transpiles the typescript entry (the cli
        # logic every application root owns) to the esm script with the
        # packages external (the top level await the saddle scripts carry
        # and the import.meta the entries read answer through the esm
        # form) and the webpack CLI bundles it through the generated
        # config into the single-file distribution (the config the seat
        # generates answers the variadic target flag the webpack cli
        # grammar cannot carry on the command line, the externals law
        # keeps every package a runtime require the envelope dependency
        # blocks already answer and the parser url switch keeps the
        # runtime file reads the devthink caps seat carries runtime reads
        # instead of build time assets), the node target under
        # production, the commonjs2 library riding the .cjs extension so
        # the bundle answers both the direct node run and the require of
        # the envelopes the registry lanes publish (the type:module
        # trees never break the commonjs seat).
        run: |
          set -euo pipefail
          PKG="${{ matrix.package }}"
          VERSION="${{ steps.release.outputs.version }}"
          cd "${PKG}"
          bun install --frozen-lockfile --ignore-scripts
          npx esbuild cli.ts --bundle --platform=node --format=esm --packages=external --outfile=webpacksrc.mjs
          cat > webpack.config.cjs <<CFG
          "use strict";
          const path = require("node:path");
          module.exports = {
            mode: "production",
            target: "node",
            entry: "./webpacksrc.mjs",
            output: {
              path: path.resolve(__dirname, "webpackdist"),
              filename: "${PKG}.webpack.cjs",
              library: { type: "commonjs2" }
            },
            externals: [
              function externallaw({ request }, callback) {
                if (request.startsWith(".") || request.startsWith("node:") || path.isAbsolute(request)) return callback();
                return callback(null, "commonjs " + request);
              }
            ],
            module: { parser: { javascript: { url: false } } },
            devtool: false
          };
          CFG
          npx webpack --config webpack.config.cjs
          test -s "webpackdist/${PKG}.webpack.cjs"
          mv "webpackdist/${PKG}.webpack.cjs" "../${PKG}.webpack.${VERSION}.cjs"
          cd ..
          rm -rf "${PKG}/webpackdist" "${PKG}/webpacksrc.mjs" "${PKG}/webpack.config.cjs"
          sha256sum "${PKG}.webpack.${VERSION}.cjs" > "${PKG}.sha256.webpack.${VERSION}"
          test -s "${PKG}.sha256.webpack.${VERSION}"
          # the family asset naming gate: no underscore ever rides a
          # published asset (the two names the seat attaches answer the
          # check, never the whole repository root).
          ! printf '%s\n' \
            "${PKG}.webpack.${VERSION}.cjs" \
            "${PKG}.sha256.webpack.${VERSION}" | grep -q "_"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-webpack-${{ matrix.package }}-${{ steps.release.outputs.version }}
          path: |
            ${{ matrix.package }}.webpack.${{ steps.release.outputs.version }}.cjs
            ${{ matrix.package }}.sha256.webpack.${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        # the release event path attaches the bundle beside its checksum
        # (the dispatch path answers the same attach once the tag rides
        # the input), and --clobber keeps the re-run idempotent over its
        # own names, which carry the application prefix and never
        # collide with another lane's grammar.
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.package }}.webpack.${VERSION}.cjs" \
            "${{ matrix.package }}.sha256.webpack.${VERSION}" --clobber

