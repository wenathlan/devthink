name: DevThink Verify

# The verification chain of the DevThink release candidate: the grand merge
# restores the extension lane's gate ladder — every gate script of the tests/
# family runs as its own step so a red names its gate — beside the modes
# matrix over the built artifacts and the static workbench check.
#
# The root build (node tests/build.mjs) runs BEFORE the deterministic suite:
# the protocolv2 frozen contract suite reads dist/schemas/plan.schema.json,
# which the build derives from tests/code — the lane that ran the tests
# before the build failed on the missing schema.

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit or tag to validate when called by CI or release.
        required: false
        default: ""
        type: string
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional git ref to validate.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Superseded verify runs of the same event and ref are cancelled to save
  # runner minutes; workflow_call invocations ride the caller's run.
  group: devthink-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devthink:
    name: The DevThink gate ladder
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.22.0
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the npm version declared by package metadata
        run: |
          set -euo pipefail
          npm_version="$(node -p "require('./package.json').engines.npm.match(/>=([^ ]+)/)[1]")"
          npm install --global "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build the root distribution before the deterministic suite
        run: node tests/build.mjs
      - name: Check secrets and run the deterministic suite
        run: bun run check
      - name: Verify the protocolv2 api freeze of the frozen contracts
        run: node tests/apifreeze.mjs
      - name: Run the penetration test checklist of the security hardening release
        run: node tests/pentest.mjs
      - name: Audit every content security policy of the extension surfaces
        run: node tests/cspaudit.mjs
      - name: Verify the permission set never grew against the previous release
        run: node tests/permdiff.mjs
      - name: Run the coordination certification checklist of the multi agent release
        run: node tests/agentcert.mjs
      - name: Run the shared accounting certification of the multi agent release
        run: node tests/costcert.mjs
      - name: Run the documentation consistency check of the documentation completion release
        run: node tests/doccheck.mjs
      - name: Sweep the recorded failures and the source defect classes of the release candidate
        run: node tests/sweep.mjs
      - name: Audit the feature pool of the crx mining evidence against the shipped surface
        run: node tests/poolaudit.mjs
      - name: Run the verification matrix of the release candidate
        run: node tests/matrixverify.mjs
      - name: Prove the telemetry free guarantees of the release candidate behind the block all proxy
        run: node tests/telemetryfree.mjs
      - name: Run the example gallery recipes runner of the platform release
        run: node tests/recipes.mjs
      - name: Run the release readiness review of the platform release
        run: node tests/readiness.mjs
      - name: Run the maintenance metadata proposal check of the dependency ladder
        run: node tests/maintain.mjs check
      - name: Check for available non-breaking dependency updates of the ladder
        run: node tests/dependencyupdates.mjs check
      - name: Check the versioned GitHub Actions references of the ladder
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/workflowupdates.mjs check
      - name: Run the runtime policy gate of the declared baselines
        run: node tests/runtimepolicy.mjs
      - name: Run the release workflow npm gate
        run: node tests/npmgate.mjs
      - name: Run the workflow yaml and controls gate
        run: node tests/workflowcheck.mjs
      - name: Run the native bridge smoke against a fake host process
        run: node tests/nativesmoke.mjs
      - name: Lint every example plan with the compiled CLI
        run: node dist/cli.js planlint dist/fixtures/plans
      - name: Dry-run every example workflow with the compiled CLI
        run: |
          set -euo pipefail
          for workflow in dist/fixtures/workflows/*.json; do
            node dist/cli.js runworkflow "$workflow" --dryrun --quiet
          done
      - name: Install the host manifest for an isolated Chromium profile and run the native checks
        run: |
          set -euo pipefail
          mkdir -p smokeprofile
          node dist/cli.js native install --profile smokeprofile --host com.wenathlan.devthink.smoke --extension-id smokeextensionid0000000000000000000 --companion "$(pwd)/dist/companion.js" --consent true
          test -f "smokeprofile/NativeMessagingHosts/com.wenathlan.devthink.smoke.json"
          grep -F "chrome-extension://smokeextensionid0000000000000000000/" "smokeprofile/NativeMessagingHosts/com.wenathlan.devthink.smoke.json"
          grep -F "__generated_extension_id__" dist/nativehost.template.json
          node dist/cli.js native diagnostics --host com.wenathlan.devthink.smoke --profile smokeprofile
      - name: Remove the host manifest after the native smoke
        run: |
          set -euo pipefail
          node dist/cli.js native uninstall --profile smokeprofile --host com.wenathlan.devthink.smoke
          test ! -e "smokeprofile/NativeMessagingHosts/com.wenathlan.devthink.smoke.json"
          rm -rf smokeprofile
      - name: Assert the native messaging permission stays absent from the required set
        run: |
          set -euo pipefail
          node -e "const manifest = require('./web/extension/manifest.json'); if ((manifest.permissions ?? []).includes('nativeMessaging')) throw new Error('The native messaging permission must stay absent from the required set.'); if (!(manifest.optional_permissions ?? []).includes('nativeMessaging')) throw new Error('The native messaging permission declares in the optional set only.'); console.log(JSON.stringify({ valid: true, optional: true, required: false }));"
      - name: Run the firefox prep step offline
        run: |
          set -euo pipefail
          node -e "import('./dist/crossbrowser.js').then(module => { const overlay = require('./web/extension/manifest.json').browsers.firefox; const source = require('./web/extension/manifest.json'); const adapted = module.firefoxprepadapt({ manifest: source, overlay, backgroundscripts: ['background.js'] }); if (adapted.manifest.host_permissions.length !== 0) throw new Error('The firefox overlay must keep host permissions empty.'); if (adapted.manifest.browser_specific_settings.gecko.id !== 'devthink@wenathlan') throw new Error('The firefox overlay must carry the generated extension id.'); console.log(JSON.stringify({ valid: true, browser: adapted.overlay.browser, changes: adapted.changes.length })); })"
      - name: Run the addons linter over the xpipack output when installed
        run: |
          set -euo pipefail
          if ! command -v addons-linter >/dev/null 2>&1; then
            echo "addons-linter is not installed; skipping the linter step (the local suite covers the markers check)."
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          addons-linter "dist/devthink-firefox-${VERSION}.xpi" || true
      - name: Install firefox and run a load smoke on the xpipack build when available
        run: |
          set -euo pipefail
          if ! command -v firefox >/dev/null 2>&1; then
            echo "firefox is not installed; the load smoke runs in the release lane when the firefox addon store accepts the xpi."
            exit 0
          fi
          firefox --version
      - name: Run the package extension pack verification
        run: node tests/packageextension.mjs
      - name: Dry-run the flat package of the single distribution
        run: |
          set -euo pipefail
          node tests/build.mjs
          npm pack ./distpackage --dry-run
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome-for-testing
        with:
          chrome-version: stable
      - name: Load the packaged extension in an isolated Chromium profile
        env:
          CHROME_BIN: ${{ steps.chrome-for-testing.outputs.chrome-path }}
          CHROME_HEADLESS: "false"
        run: xvfb-run --auto-servernum bun run test:chromium
      - name: Smoke-test the compiled CLI with the declared Bun baseline
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$(node -p "require('./package.json').engines.bun.match(/>=([^ ]+)/)[1]")"
          bun dist/cli.js manifest
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Run the maven pack dry run over the single distribution
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mvn --batch-mode -Drevision="${VERSION}" package
          test -f "target/devthink-${VERSION}.jar"
          jar tf "target/devthink-${VERSION}.jar" | grep -F "index.js"
          jar tf "target/devthink-${VERSION}.jar" | grep -F "cli.js"
          jar tf "target/devthink-${VERSION}.jar" | grep -F "headless.js"
          jar tf "target/devthink-${VERSION}.jar" | grep -F "mcp.js"
      - uses: actions/setup-dotnet@v6.0.0
      - name: Run the nuget pack dry run over the content files and fixtures
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          dotnet pack devthink.csproj --configuration Release --output validation/nuget -p:PackageVersion="${VERSION}"
          unzip -l validation/nuget/*.nupkg | grep -F "contentFiles/any/any/devthink${VERSION}.zip"
          unzip -l validation/nuget/*.nupkg | grep -F "contentFiles/any/any/cli.js"
          unzip -l validation/nuget/*.nupkg | grep -F "contentFiles/any/any/headless.js"
          unzip -l validation/nuget/*.nupkg | grep -F "contentFiles/any/any/mcp.js"
          unzip -l validation/nuget/*.nupkg | grep -F "contentFiles/any/any/devthink.umd.js"
          unzip -l validation/nuget/*.nupkg | grep -F "contentFiles/any/any/index.cjs"
          unzip -l validation/nuget/*.nupkg | grep -F "contentFiles/any/any/declarations/index.d.ts"
          unzip -l validation/nuget/*.nupkg | grep -F "contentFiles/any/any/fixtures/example-org-pagestate.json"
          unzip -l validation/nuget/*.nupkg | grep -F "README.md"
      - name: Run the vsix package build
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test -f "dist/devthink-vscode-${VERSION}.vsix"
          unzip -l "dist/devthink-vscode-${VERSION}.vsix" | grep -F "extension.vsixmanifest"
          unzip -l "dist/devthink-vscode-${VERSION}.vsix" | grep -F "extension/package.json"
          unzip -l "dist/devthink-vscode-${VERSION}.vsix" | grep -F "extension/extensionhost.js"
          unzip -l "dist/devthink-vscode-${VERSION}.vsix" | grep -F "extension/webview/bridge.html"
          unzip -l "dist/devthink-vscode-${VERSION}.vsix" | grep -F "extension/index.js"
          node -e "import('./dist/pack.js').then(module => { const bytes = require('fs').readFileSync('dist/devthink-vscode-${VERSION}.vsix'); const fields = module.vsixpackmanifestfields('${VERSION}'); const check = module.vsixmarketplacemetadatacheck({ fields, manifesttext: bytes.toString('utf8') }); if (!check.ok) throw new Error('The vsix failed the marketplace metadata check: ' + (check.reason ?? 'unknown')); console.log(JSON.stringify({ valid: true, name: fields.name, publisher: fields.publisher, telemetry: fields.telemetry })); })"
      - name: Assert the artifact manifest matches the built set
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test -f dist/artifactmanifest.json
          node -e "const { createHash } = require('node:crypto'); const { readFile } = require('node:fs/promises'); (async () => { const manifest = JSON.parse(await readFile('dist/artifactmanifest.json', 'utf8')); const module = await import('./dist/pack.js'); const files = []; for (const entry of manifest.artifacts) { const bytes = await readFile(entry.name); files.push({ name: entry.name, checksum: createHash('sha256').update(bytes).digest('hex') }); } const check = module.artifactmanifestcheck({ manifest, files }); if (!check.ok) throw new Error('The built set drifted from the artifact manifest: ' + JSON.stringify(check)); const names = manifest.artifacts.map(entry => entry.name); const version = '${VERSION}'; for (const required of ['dist/devthink' + version + '.zip', 'dist/devthink-firefox-' + version + '.xpi', 'dist/devthink-safari-' + version + '.zip', 'dist/devthink-vscode-' + version + '.vsix', 'dist/devthink-site-' + version + '.zip', 'dist/devthink-declarations-' + version + '.zip']) { if (!names.includes(required)) throw new Error('The artifact manifest misses the built artifact ' + required); } console.log(JSON.stringify({ artifacts: manifest.artifacts.length, ok: true })); })();"
      - name: Build the container image and run its smoke
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t devthink-verify:local .
          docker run --rm devthink-verify:local --check
      - name: Check the web TypeScript of the static workbench
        run: pnpm --dir web check
      - name: Build portable static web
        env:
          VITE_BASE_PATH: /
        run: pnpm --dir web build
      - name: Upload the built DevThink artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink-verify-${{ inputs.ref || github.sha }}
          path: dist/devthink*.zip
          if-no-files-found: error
          retention-days: 14
  modes:
    name: The DevThink library modes on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Build the root distribution
        run: node tests/build.mjs
      - name: Require smoke against the cjs bundle
        if: matrix.runtime == 'node'
        run: node --input-type=commonjs --eval "const library = require('./dist/index.cjs'); if (typeof library.surfacepalette !== 'function') throw new Error('The cjs mode lost its public surface.'); if (library.bundlestamp().mode !== 'cjs') throw new Error('The cjs mode lost its stamp.');"
      - name: Import smoke against the esm bundle
        if: matrix.runtime == 'node'
        run: node --input-type=module --eval "import('./dist/index.js').then(library => { if (typeof library.surfacepalette !== 'function') throw new Error('The esm mode lost its public surface.'); if (library.bundlestamp().mode !== 'esm') throw new Error('The esm mode lost its stamp.'); });"
      - name: Global smoke against the umd bundle
        if: matrix.runtime == 'node'
        run: |
          set -euo pipefail
          node --input-type=module --eval "
          import { readFileSync } from 'node:fs';
          new Function('self', readFileSync('./dist/devthink.umd.js', 'utf8'))(globalThis);
          if (typeof globalThis.devthink.surfacepalette !== 'function') throw new Error('The umd mode lost its global surface.');
          if (globalThis.devthink.bundlestamp().mode !== 'umd') throw new Error('The umd mode lost its stamp.');
          "
      - name: Tarball content check over every mode file
        if: matrix.runtime == 'node'
        run: |
          set -euo pipefail
          mkdir -p releasecheck
          npm pack ./distpackage --pack-destination releasecheck >/dev/null
          tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -F "package/index.cjs"
          tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -F "package/devthink.umd.js"
          tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -F "package/index.d.ts"
          tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -F "package/policy.js"
          tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -F "package/checksums.txt"
          if tar -tzf releasecheck/wenathlan-devthink-*.tgz | grep -E "^package/([^/]+/){3}"; then echo "The npm tarball carries a path nested past two directories; the package stays flat." >&2; exit 1; fi
      - name: Run the vitest suite once under bun
        if: matrix.runtime == 'bun'
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$(node -p "require('./package.json').engines.bun.match(/>=([^ ]+)/)[1]")"
          bun x vitest run
      - name: Bun import smoke over the bun entry
        if: matrix.runtime == 'bun'
        run: bun --eval "const library = await import('./dist/bun.js'); if (typeof library.bunadapter !== 'function') throw new Error('The bun mode lost its adapter.'); if (typeof library.surfacepalette !== 'function') throw new Error('The bun mode lost its surface.');"
      - uses: denoland/setup-deno@v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - name: Deno check over the deno entry
        if: matrix.runtime == 'deno'
        run: |
          set -euo pipefail
          deno --version
          deno check dist/deno.js
      - name: Deno import smoke over the deno entry
        if: matrix.runtime == 'deno'
        run: deno eval "const library = await import('./dist/deno.js'); if (typeof library.denoadapter !== 'function') throw new Error('The deno mode lost its adapter.'); if (typeof library.surfacepalette !== 'function') throw new Error('The deno mode lost its surface.');"
      - name: Upload the mode bundles
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mode-bundles-${{ matrix.runtime }}-${{ inputs.ref || github.sha }}
          path: |
            dist/index.cjs
            dist/index.js
            dist/devthink.umd.js
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
