name: DevThink Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Git reference to validate.
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Optional git ref to validate.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Bun and static web verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.22.0
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Check secrets and CLI tests
        run: bun run check
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Check web TypeScript
        run: pnpm --dir web check
      - name: Build portable static web
        env:
          VITE_BASE_PATH: /
        run: pnpm --dir web build
