name: Family Release

# The per-application release lane of the monorepo (the owner answer to many
# releases inside one repository): every family folder owns its version line
# and its own release. The autotag job walks the nine family packages; when a
# folder's package.json version is newer than that folder's latest
# <app>-v<version> tag it cuts the tag, attaches the folder source archive
# (tar.xz at maximum compression) and opens the release by itself — the same
# auto-tag contract the DevThink Release lane carries for the platform, one
# release line per application. The shapes job then converts every family
# theme into the four Next deploy shapes and uploads each released
# application's shapes to its own release, so a family release ships the
# source archive plus the four deployable Next variants (personalized, zai,
# fifty, normal) with their brotli mirrors. A push that bumps no family
# version skips silently; the DevThink platform release keeps its own
# dedicated lane in release.yml.

on:
  push:
    branches: [main]
    paths:
      - "argan/package.json"
      - "cadria/package.json"
      - "debonair/package.json"
      - "forge/package.json"
      - "foundry/package.json"
      - "getry/package.json"
      - "saddle/package.json"
      - "stealhead/package.json"
      - "vault/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: family-release
  cancel-in-progress: false

jobs:
  autotag:
    name: auto-tag the family version bumps
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.bumps.outputs.released }}
    steps:
      - name: Checkout the family source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Cut one tag and release per bumped family application
        id: bumps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          released=""
          for app in argan cadria debonair forge foundry getry saddle stealhead vault; do
            version="$(node -p "require('./${app}/package.json').version")"
            latest="$(git tag --list "${app}-v*" --sort=-v:refname | head -n 1 || true)"
            latest_version="${latest#${app}-v}"
            if [ -z "${latest_version}" ]; then latest_version="0.0.0"; fi
            newer="$(node -e "
              const numeric = (s) => s.split('-')[0].split('.').map(Number);
              const [a, b] = [numeric('${version}'), numeric('${latest_version}')];
              let newer = false;
              for (let i = 0; i < 3 && !newer; i++) { if (a[i] !== b[i]) { newer = a[i] > b[i]; } }
              console.log('${version}' !== '${latest_version}' && newer ? 'true' : 'false');
            ")"
            if [ "${newer}" != "true" ]; then
              echo "${app} ${version} answers tag ${app}-v${latest_version}; skipping."
              continue
            fi
            tag="${app}-v${version}"
            git tag "${tag}"
            git push origin "${tag}"
            # the folder source archive: exactly the tracked files of the
            # application subtree at maximum xz compression.
            git archive --format=tar --prefix="${app}/" "${tag}:${app}" | xz -9e -T0 > "${tag}-source.tar.xz"
            {
              echo "# ${app} ${version}"
              echo
              echo "The family release of ${app} cut from the devthink monorepo: the source archive (tar.xz) and the four next deploy shapes ride this release."
            } > release-body.md
            gh release create "${tag}" \
              --title "${app} ${version}" \
              --notes-file release-body.md \
              --verify-tag \
              "${tag}-source.tar.xz"
            released="${released:+${released},}${app}@${version}"
            echo "${app} released ${tag}"
          done
          echo "released=${released}" >> "$GITHUB_OUTPUT"

  shapes:
    name: Convert the family themes and attach the four next shapes
    needs: autotag
    if: >-
      always() && needs.autotag.result == 'success' &&
      needs.autotag.outputs.released != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the family source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Convert every family theme into the four next shapes
        # the smart conversion of the family: the converter reads each
        # application theme (Sol) and emits the personalized, zai, fifty and
        # normal Next shapes with their brotli mirrors, one asset set per
        # application folder. The build stays on the GitHub machines.
        run: node devthink/tests/scripts/next.convert.ts
      - name: Upload the released shapes to their releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.autotag.outputs.released }}
        run: |
          set -euo pipefail
          for entry in ${RELEASED//,/ }; do
            app="${entry%%@*}"
            version="${entry##*@}"
            tag="${app}-v${version}"
            assets=()
            for file in release/"${app}".next.*; do
              [ -e "${file}" ] || continue
              assets+=("${file}")
            done
            if [ "${#assets[@]}" -eq 0 ]; then
              echo "no next shapes found for ${app}; skipping upload." >&2
              continue
            fi
            gh release upload "${tag}" "${assets[@]}" --clobber
            echo "uploaded ${#assets[@]} shapes to ${tag}"
          done
      - name: Keep the shape set as a run artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: family-shapes
          path: release/*
          if-no-files-found: error
          retention-days: 30
