name: DevThink Runtime Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-runtime:
    name: CLI contract on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Validate CLI help contract
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.runtime }}" = "node" ]; then
            node --experimental-strip-types devthink.ts --help
          else
            bun devthink.ts --help
          fi
      - name: Run deterministic test suite
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.runtime }}" = "node" ]; then
            node --experimental-strip-types --test tests/*.test.ts
          else
            bun run test
          fi

  static-web:
    name: Static workbench compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.22.0
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install and validate portable workbench
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web check
      - name: Build root-hosted static workbench
        env:
          VITE_BASE_PATH: /
        run: pnpm --dir web build
      - name: Build repository-hosted static workbench
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --dir web build
