name: NuGet cleanup
# one-shot maintenance dispatch: deletes the wrongly-prefixed pro.devthink.*
# nuget envelopes the early publish wave pushed under the wenathlan namespace.
# the correct envelopes publish unprefixed since release 2.0.75; this lane
# only removes the retired names and stays dispatch-only (never scheduled).
on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  delete-retired-prefixes:
    name: delete the retired pro.devthink.* nuget envelopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: delete the retired package names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in pro.devthink.stealhead pro.devthink.argan pro.devthink.cadria pro.devthink.debonair; do
            code="$(curl -s -o /tmp/nuget-delete.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/nuget/${pkg}")"
            echo "${pkg}: ${code} $(cat /tmp/nuget-delete.json | head -c 120)"
          done
