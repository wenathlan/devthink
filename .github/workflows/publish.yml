name: DevThink Publish

# THE POST-RELEASE LANES OF THE MERGED REPOSITORY, ONE FILE (the 2.0.16
# grouping pass): every lane that fires when the DevThink Release ladder
# completes - the eight registry publishes (npmjs, the github npm
# registry, maven, nuget, rubygems, gradle, the go get module rung and
# the five-architecture ghcr container index),
# the platform artifact lanes (the compiled desktop binaries, the tauri
# bundles, the android and ios mobile artifacts, the container archive, the
# browser extension package and the target plans) and the SHA256SUMS
# umbrella that closes the wave - carries ONE correlated logic: publish
# everything the release produced. The lanes lived as twelve separate
# workflow files the 2.0.15 board answered scattered and desynchronized
# (the sums umbrella rebuilt before the artifact lanes attached their
# assets, the npm lane raced the ladder's own npmjs job with a root
# manifest publish); the merged file wires the umbrella AFTER the lanes
# through the needs chain, so the checksum signature answers only a
# complete lane set - the grouping the repository owner demanded.
#
# Every job keeps its own conclusion guard (the saddle family pattern,
# Regra 56b): a FAILED or cancelled DevThink Release completion never
# reaches any lane, and a release published manually fires the same
# lanes the ladder completion does (the dual-trigger doctrine - the
# documented exception to the GITHUB_TOKEN event suppression).
#
# THE FAMILY DISTRIBUTION LANES (the 2.0.46 five-package wave): beside
# every application registry lane rides its family mirror - the
# family-npmjs, family-githubnpm, family-maven, family-nuget,
# family-gradle, family-goget, family-rubygems and family-ghcr jobs
# publish every documentation envelope (the six-distribution completeness
# law of the distpack ladder, closed by the distfamily wave: every
# application envelope rides the nuget, maven, rubygems, npmjs and github
# npm lanes, the gradleseat wave seats the gradle rung beside them under
# the com.wenathlan coordinates the gradle consumer resolves, and the
# goget wave seats the go module rung - the per-application go.mod
# markers the go get consumer resolves through the proxy.golang.org
# chain off the per-module tags the lanes sync on the release commit - the
# ten siblings in the canonical pass order, saddle walking npmjs last
# beside its engine lanes and answering the devthink maven registry
# the family coordinates carry) through the same registries, the same
# conclusion guard, the same release-approval environment and the same
# bounded retry the application lanes carry, one matrix leg per
# envelope folder. The correlated registry logic of
# each channel stays grouped inside the one lane pair it belongs to.
#
# THE FIVE HUNDRED ASSET LADDER (the 2.0.157 expansion the owner
# demanded - "os assets não tão passando de quinhentos"): the
# family-metadata and family-map lanes answer every release with the
# real metadata asset set of the eleven applications - documentation
# bundles, engine maps, api surfaces, test inventories, schema bundles,
# dependency snapshots, changelog excerpts, license notices, route maps,
# web asset inventories, biome configuration snapshots, the
# per-architecture container manifests of the eleven platforms the
# saddle vhe matrix carries, the per-application checksum umbrellas and
# the family reports (the map, the version ladder, the mimetypes
# registry digest, the protocols registry, the gate ladder report, the
# release approval audit trail and the asset inventory) - two hundred
# sixty real build products every one derived from the tagged tree, so
# the release the ladder cuts ships past the half thousand assets the
# owner demanded (never a placeholder: zips of tracked folders, reports
# the node walker computes over the sources, manifests stamped with the
# grammar the container lanes already speak).
#
# THE SADDLE BLOCK (the consolidation pass, saddle always last): the three
# saddle lanes the standalone workflow files carried - the saddle engine
# extension package, the saddle target plans and the saddle vhe registry
# lane - ride as the closing jobs of this file, after every application
# lane of the family, because the saddle surface is the heaviest pass of
# the house (the docker builds). The extension package and the target
# plans answer the same release and workflow_run triggers the lanes above
# carry; the vhe lanes answer the same release law (the saddle container
# law): the resolver, the security gate, the multi-arch registry push, the
# published-image verify and the container archive lane fire with the
# family publish wave, while the deep validation lane (the nine-leg
# matrix of the three profiles across the four base-carried build legs)
# keeps its dispatch-only shape. The saddle lanes read
# the saddle application folder and stamp the version their own manifest
# declares - the family release tag carries the assets.

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["DevThink Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing DevThink tag to publish and package; empty resolves the latest release.
        required: false
        default: ""
        type: string
      build_ios:
        description: Build the iOS ipa lane (the simulator lane always runs).
        required: false
        default: false
        type: boolean
      allow_test_signing:
        description: Allow the labeled ci-test-key android signing when no production keystore exists.
        required: false
        default: false
        type: boolean
      target:
        description: Restrict the target-plans matrix (all by default).
        required: false
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  # the event-scoped group (the family concurrency doctrine, Regra 52):
  # the release published, workflow_run and dispatch firings are distinct
  # lanes that never cancel one another; only a superseded firing of the
  # SAME event and ref waits behind the running one (cancel-in-progress
  # stays false so no publish leg is ever cancelled mid-push).
  group: devthink-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  image: ghcr.io/${{ github.repository_owner }}/devthink
  # the saddle vhe block answers the same registry the consolidated file
  # publishes (the saddle package family never collides with the devthink
  # node-engine tags) and caches its multi-profile layers in the registry
  # cache image the saddle lane has always carried.
  REGISTRY: ghcr.io
  CACHE_IMAGE: ghcr.io/${{ github.repository }}-buildcache

jobs:
  release-resolve:
    name: release resolve
    # THE ONE RESOLVER SEAT (the rate-limit heal the publish wave owns):
    # the workflow_run path fires every lane at once and the thirty-one
    # resolvers each asked the api for the latest release - a hundred
    # calls per run, seven runs an hour, the installation rate limit the
    # registry answers burned and eighty-one lanes reddened on the 403.
    # The one seat resolves the tag a single time and every lane below
    # reads the job output, so the publish wave costs one api call
    # instead of a hundred - the asset lanes never wait on the approval
    # review, only on this light resolve.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: resolve the release tag once for the whole wave
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            # the bounded retry the rate-limit window taught: the single
            # remaining api call the wave makes tolerates the transient
            # 403 with the linear backoff before it reddens the wave.
            attempt=0
            until [ "$attempt" -ge 3 ]; do
              attempt=$((attempt + 1))
              tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" && break
              echo "the release resolve attempt ${attempt}/3 failed; retrying with backoff."
              sleep "$((attempt * 20))"
            done
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
  release-approval:
    name: release approval gate
    # the explicit approval point of the publish wave (the release approval
    # flow repair): one named job carries the release-approval environment
    # and every registry lane below needs it, so the review the owner
    # grants answers once for the whole wave. the per-lane environment keys
    # the lanes carried before opened one deployment per lane - the reviews
    # scattered across the run, the lanes the owner never reached sat
    # waiting forever, and the workflow_run firing behind them queued with
    # no job at all until the cancellation came - while the single gate
    # keeps every registry publish behind the one approval the doctrine
    # demands, a rejected gate skips the lanes honestly, and the asset
    # lanes of the wave never wait on the review at all.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    environment: release-approval
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: confirm the release approval
        run: |
          echo "the release-approval environment granted this publish wave: every registry lane below flows."

  npmjs:
    needs: [release-resolve, release-approval]
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the publish
    # lane. Only a successful completion whose triggering event was the
    # version-bump push or the maintenance ladder dispatch (the two events
    # the release workflow really runs on) publishes.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    # the extension release-gate doctrine (the 2.0.18 port, the approval
    # gate repair): every registry publish answers through the explicit
    # release-approval gate job this lane needs - the one review the owner
    # grants for the whole publish wave.
    timeout-minutes: 15
    # the provenance signature the extension release lane carries (the
    # 2.0.16 fix): the npmjs publish answers the registry's attestation
    # endpoint, so the job carries the oidc write beside the read.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      # the package validator, inlined from the retired composite action
      # (dependency install plus the pack dry-run). the setup node registry
      # url writes the github package registry redirect into the home npmrc
      # (and the project one), but the job token cannot read that cross
      # repo package and the family mirror publishes the same package to
      # npmjs: the install neutralizes the home redirect and restores the
      # committed project npmrc so bun resolves the public mirror.
      - name: install dependencies
        run: |
          cd devthink
          rm -f "$HOME/.npmrc"
          git checkout -- .npmrc
          bun install --frozen-lockfile --ignore-scripts
      - name: build the distribution set
        run: cd devthink && node build.ts
      - name: package dry-run
        run: cd devthink && npm run pack:check
      - name: Verify release package versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e 'const fs=require("node:fs"); const expected=process.env.RELEASE_VERSION; const actual=JSON.parse(fs.readFileSync("package.json","utf8")).version; if (actual !== expected) throw new Error(`package.json is ${actual}; expected ${expected}`);'
      - name: stamp the provenance repository the sigstore law validates
        # the manifest law (#501) retired the repository seat from the
        # source manifests, but the npmjs provenance attestation validates
        # the repository url the packed package.json carries (the E422 the
        # 2.0.166 rung answered: "repository.url" is "", expected to match
        # the provenance) — the staged distpackage stamps it runner-side so
        # the sigstore bundle and the registry agree without the source
        # manifest carrying the decorative seat again.
        run: |
          node -e 'const fs=require("node:fs"); const p="devthink/distpackage/package.json"; const m=JSON.parse(fs.readFileSync(p,"utf8")); m.repository={type:"git",url:"https://github.com/wenathlan/devthink"}; fs.writeFileSync(p, JSON.stringify(m,null,2)+"\n");'
          grep -q '"url": "https://github.com/wenathlan/devthink"' devthink/distpackage/package.json
      - name: check npm token availability
        # the graceful-skip gate (the family contract, Regra 54: NPM_TOKEN
        # is OPTIONAL - a repository without the secret skips the
        # publication with a notice instead of hard-failing the release
        # pipeline). The token is only ever touched through env, never an
        # `if:` condition (Regra 56).
        id: token
        shell: bash
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          token="${RAW_NPM_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          if [[ -z "$token" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            printf 'NODE_AUTH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: skip notice when NPM_TOKEN is not configured
        if: steps.token.outputs.available != 'true'
        run: |
          echo "::notice::Secret NPM_TOKEN is not configured; the npmjs.com publication is skipped with this warning. Add the secret in Settings > Secrets and variables > Actions and re-run this workflow (or re-publish the release) to ship @wenathlan/devthink@${{ steps.release.outputs.version }} to the public registry."
      - name: verify npm identity
        if: steps.token.outputs.available == 'true'
        run: cd devthink && npm whoami
      - name: publish the flat distribution tarball when absent
        # the extension family release doctrine (the 2.0.16 fix of the
        # badly built package): the lane publishes the PACKED flat
        # distribution tarball the build stages — npm pack ./distpackage —
        # never the repository root manifest, whose files field answers
        # the development source tree the 2.0.15 lane shipped raw to the
        # registry (an unbuilt package whose main resolved nothing). The
        # staged tree carries its own generated package.json with
        # root-level entry paths and the package-scoped checksums.txt
        # signature, and the publish rides the provenance attestation the
        # extension release lane always carried — the release signature
        # that goes to npm.
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          if npm view "@wenathlan/devthink@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "CLI package version already exists; skipping publish."
          else
            mkdir -p release
            npm pack ./distpackage --pack-destination release >/dev/null
            tarball="./release/wenathlan-devthink-${RELEASE_VERSION}.tgz"
            test -f "${tarball}"
            # the built-and-checksummed contract: the tarball answers the
            # built entries and the checksum signature the staging wrote.
            tar -tzf "${tarball}" | grep -F "package/index.cjs"
            tar -tzf "${tarball}" | grep -F "package/checksums.txt"
            # The bounded retry policy (the extension release lane
            # doctrine): registry pushes answer transient failures — the
            # publish retries inside three attempts with the linear
            # backoff the family lane carries, and only a third failure
            # reddens the lane. The dual-trigger race tolerance rides the
            # same loop: the ladder's own npmjs job publishes the same
            # tarball while the lanes build, so a registry answer of
            # "already exists" from the identical content is a pass.
            attempt=0
            published=0
            until [ "$attempt" -ge 3 ]; do
              attempt=$((attempt + 1))
              # the owner rule the family lanes carry (the #81 fix): npm 12
              # refuses the IMPLICIT latest tag when the rung lands below the
              # registry latest (the devthink retired 2.1.x line the heal
              # moved back), so the application publish stamps the explicit
              # tag exactly like the sibling envelopes - the dist-tag step
              # below then pins latest to the release version.
              publish_output="$(npm publish "${tarball}" --access public --provenance --tag latest 2>&1)" && { published=1; break; }
              # the twin-409 doctrine (the idempotent win the family loop of
              # the release ladder carries): the ladder's own npmjs job
              # publishes the same tarball inside the same release event, and
              # the registry answers the latecomer with "cannot publish over
              # previously staged/published" while the read path still lags -
              # the npm view check below cannot see a staged version, so the
              # registry's own twin answer is the win (the 2.0.151 release
              # burned three attempts on the lag and reddened the lane).
              if printf '%s' "${publish_output}" | grep -qiE "cannot publish over previously (published|staged)"; then
                echo "the twin lane already owns ${RELEASE_VERSION}; the publish race resolved with the registry's own answer."
                published=1
                break
              fi
              if npm view "@wenathlan/devthink@${RELEASE_VERSION}" version >/dev/null 2>&1; then
                echo "the registry already answers ${RELEASE_VERSION}; the publish race resolved with the same built content."
                published=1
                break
              fi
              printf '%s\n' "${publish_output}"
              echo "npm publish attempt ${attempt}/3 failed; retrying with backoff."
              sleep "$((attempt * 5))"
            done
            if [ "$published" -ne 1 ]; then
              echo "::error::npm publish failed after ${attempt} attempts."
              exit 1
            fi
          fi
      - name: align the latest dist-tag with the release version
        # The maene family realignment doctrine: npm never moves the
        # latest dist-tag when a release lands BELOW the current latest
        # (a maintenance rung on an older line), so the lane pins latest
        # to the release version explicitly — the registry page always
        # answers the version this pipeline published.
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          npm dist-tag add "@wenathlan/devthink@${RELEASE_VERSION}" latest
          echo "the latest dist-tag now answers ${RELEASE_VERSION}."

  family-npmjs:
    needs: [release-resolve, release-approval]
    # the family npmjs lane: the documentation envelopes publish to
    # npmjs.com beside the devthink application package - the same
    # graceful-skip token gate, the same provenance signature, the same
    # bounded retry and race tolerance the application lane above
    # carries, resolved per envelope folder (the envelopes carry no
    # build: the files field answers the tracked documentation set, the
    # zero-build site and the tests directory, so the pack dry-run is
    # the whole validation). The matrix answers the canonical family
    # pass order with the distribution-completeness law the mirror
    # carries: every application envelope of the monorepo rides the
    # registry lane (the gateway getry and the monetization cobaia walk
    # beside the eight the mirror always carried, saddle last).
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      # one envelope failing its publish must not kill the sibling legs -
      # every folder answers its own registry leg to the end.
      fail-fast: false
      matrix:
        # the canonical family pass order - argan, cadria, debonair, forge,
        # foundry, stealthhead, vault - and saddle always last, the
        # heaviest pass of the house (the SADDLE BLOCK order the release
        # family pack loop already carries). the saddle envelope rode the
        # release familynpmjs lane alone since the consolidation and that
        # lane reds on every rung while the npm ordering refusal stands;
        # the family mirror here gives the saddle envelope the same
        # graceful token gate, the same retry and the same race tolerance
        # every sibling leg carries.
        package: [argan, cadria, cobaia, debonair, forge, foundry, getry, stealthhead, vault, saddle]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: package dry-run
        run: cd "${{ matrix.package }}" && npm pack --dry-run >/dev/null
      - name: check npm token availability
        # the graceful-skip gate (the family contract, Regra 54: NPM_TOKEN
        # is OPTIONAL - a repository without the secret skips the
        # publication with a notice instead of hard-failing the release
        # pipeline). The token is only ever touched through env, never an
        # `if:` condition (Regra 56).
        id: token
        shell: bash
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          token="${RAW_NPM_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          if [[ -z "$token" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            printf 'NODE_AUTH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: skip notice when NPM_TOKEN is not configured
        if: steps.token.outputs.available != 'true'
        run: |
          echo "::notice::Secret NPM_TOKEN is not configured; the npmjs.com publication of @wenathlan/${{ matrix.package }} is skipped with this warning. Add the secret in Settings > Secrets and variables > Actions and re-run this workflow to ship the family envelope."
      - name: verify npm identity
        if: steps.token.outputs.available == 'true'
        run: cd "${{ matrix.package }}" && npm whoami
      - name: build the saddle engine envelope (the exports promise)
        # the saddle leg is the one ENGINE envelope of the family matrix:
        # its main/types/bin and the whole exports map promise ./dist/*
        # files, and the 2.0.151 rung published the registry envelope with
        # NO dist at all — the saddle .npmrc carries ignore-scripts for the
        # install lanes (the better-sqlite3 gyp lottery), so npm publish
        # from the folder never runs the prepublishOnly → pack:check →
        # build:engine gate the manifest declares. the engine compiles
        # HERE, explicitly, and the lane asserts the entries the exports
        # map, the bin and the main/types pair promise before any publish
        # touches the registry — the documentation envelopes keep their
        # zero-build doctrine, and the build rides the token gate so a
        # tokenless firing never installs a toolchain it cannot ship.
        if: matrix.package == 'saddle' && steps.token.outputs.available == 'true'
        run: |
          set -euo pipefail
          # the family pin law (the same seat the gate ladder answers — the
          # codeql pinned-dependencies battery charged the saddle engine
          # build's floating npm): the engines floor of the root manifest
          # answers the one npm rung the engine install below carries.
          npm_version="$(node -p "const m=String(require('./package.json').engines.npm).match(/\d+(?:\.\d+)*/); if(!m) throw new Error('no npm floor'); m[0]")"
          npm install --global "npm@${npm_version}"
          # the manifest law (#498) answers one dependency rung through the
          # bun lock alone — the npm package-lock the ci lane froze on
          # retired with the union, so the engine build resolves the
          # manifest live (install, never the frozen ci) and the compile
          # walks the same 172-name floor the bun lane pins.
          npm --prefix saddle install --ignore-scripts --no-audit --no-fund
          test -f saddle/index.ts
          test -f saddle/cli.ts
          test -f saddle/browser.ts
          test -f saddle/distribution.ts
          test -f saddle/execution.ts
          test -f saddle/foundation.ts
          test -f saddle/isolation.ts
          test -f saddle/modalityregistry.ts
          test -f saddle/modes.ts
          test -f saddle/sandbox.ts
          test -f saddle/server.ts
          test -f saddle/virtual.ts
          test -f saddle/workloadlaw.ts
      - name: publish the family envelope when absent
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd "${{ matrix.package }}"
          # the provenance signature rides only a manifest that carries the
          # repository coordinates the sigstore verification validates: the
          # first real publish run answered 422 on the forge, vault and
          # foundry envelopes - their package.json declares no repository
          # field, and npm refuses a provenance bundle whose repository url
          # answers empty. An envelope without the field publishes without
          # the attestation instead of reddening the lane.
          provenance=false
          if [ -n "$(node -p "const pkg=require('./package.json'); (pkg.repository && pkg.repository.url) || ''")" ]; then
            provenance=true
          fi
          if npm view "@wenathlan/${{ matrix.package }}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "The ${{ matrix.package }} envelope version already exists; skipping publish."
          else
            attempt=0
            published=0
            until [ "$attempt" -ge 3 ]; do
              attempt=$((attempt + 1))
              # the owner rule: the envelope publishes ALWAYS while the
              # token exists - registry versions are distinct strings and
              # a rung landing BELOW the registry latest (saddle stamps
              # 2.0.150 while its retired 2.1.6 line still holds the
              # latest tag) must never skip. npm 12 refuses the IMPLICIT
              # latest tag in that case ("Cannot implicitly apply the
              # latest tag"); the explicit tag answers the refusal, the
              # publish lands, and the dist-tag step below pins latest to
              # the release version - the maene realignment doctrine the
              # lane already carries for the rungs of an older line.
              publish_output=""
              if [ "$provenance" = "true" ]; then
                publish_output="$(npm publish --access public --provenance --tag latest 2>&1)" && published=1
              else
                publish_output="$(npm publish --access public --tag latest 2>&1)" && published=1
              fi
              if [ "$published" -eq 1 ]; then
                break
              fi
              # the twin-409 doctrine (the idempotent win the family loop of
              # the release ladder carries): the ladder's familynpmjs loop
              # stages the same envelope inside the same release event and
              # the registry answers the latecomer with the staged/published
              # twin refusal while the read path lags - the npm view check
              # below cannot see a staged version, so the registry's own
              # twin answer is the win (the 2.0.151 release reddened the
              # debonair and forge legs on the lag).
              if printf '%s' "${publish_output}" | grep -qiE "cannot publish over previously (published|staged)"; then
                echo "the twin lane already owns ${RELEASE_VERSION}; the publish race resolved with the registry's own answer."
                published=1
                break
              fi
              # the dual-trigger race tolerance: a sibling firing may have
              # landed the identical envelope while this leg built - an
              # existence answer is a pass, never a retry burn.
              if npm view "@wenathlan/${{ matrix.package }}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
                echo "the registry already answers ${RELEASE_VERSION}; the publish race resolved with the same built content."
                published=1
                break
              fi
              printf '%s\n' "${publish_output}"
              echo "npm publish attempt ${attempt}/3 failed; retrying with backoff."
              sleep "$((attempt * 5))"
            done
            if [ "$published" -ne 1 ]; then
              echo "::error::npm publish failed after ${attempt} attempts."
              exit 1
            fi
          fi
      - name: align the latest dist-tag with the release version
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd "${{ matrix.package }}"
          npm dist-tag add "@wenathlan/${{ matrix.package }}@${RELEASE_VERSION}" latest
          echo "the latest dist-tag of ${{ matrix.package }} now answers ${RELEASE_VERSION}."

  githubnpm:
    needs: [release-resolve, release-approval]
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the publish
    # lane. Only a successful completion whose triggering event was the
    # version-bump push or the maintenance ladder dispatch (the two events
    # the release workflow really runs on) publishes.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    # the extension release-gate doctrine (the 2.0.18 port, the approval
    # gate repair): every registry publish answers through the explicit
    # release-approval gate job this lane needs - the one review the owner
    # grants for the whole publish wave.
    timeout-minutes: 15
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
