        # the idempotent publish: a version tag is immutable content, so a
        # re-run over an already published four-architecture index skips the
        # build and the push and only re-verifies the published image; a
        # missing or partial index (a failed previous run) rebuilds and
        # completes the push.
        id: published
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          image_ref="${image}:${version}"
          if docker buildx imagetools inspect --raw "${image_ref}" >/dev/null 2>&1; then
            arches="$(docker buildx imagetools inspect --raw "${image_ref}" | jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')"
            if [ "${arches}" = "amd64,arm64,ppc64le,riscv64,s390x" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "the image ${image_ref} is already published with all five architectures; the publish is idempotent."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "the image ${image_ref} exists without the five-architecture surface; the publish completes it." >&2
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
