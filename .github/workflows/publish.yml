          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup dotnet
        uses: actions/setup-dotnet@v6.0.0
        with:
          # the pinned SDK line the application lane carries: the family
          # content packages target netstandard2.0;netstandard2.1 the
          # same way devthink.csproj does, so the one pin serves both.
          dotnet-version: 10.0.112
      - name: pack the family content package
        run: |
          set -euo pipefail
          cd "${{ matrix.package }}"
          VERSION="${{ steps.release.outputs.version }}"
          dotnet pack "${{ matrix.package }}.csproj" --configuration Release --output ./nuget -p:PackageVersion="${VERSION}"
          test -f "nuget/${{ matrix.package }}.${VERSION}.nupkg"
      - name: publish the family package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${{ matrix.package }}"
          VERSION="${{ steps.release.outputs.version }}"
          pushed=false
          for attempt in 1 2 3; do
            if dotnet nuget push "nuget/${{ matrix.package }}.${VERSION}.nupkg" --api-key "${{ github.token }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate; then pushed=true; break; fi
            echo "The nuget push attempt ${attempt} of the ${{ matrix.package }} envelope failed; the bounded retry policy retries inside three attempts."
            sleep "$((attempt * 5))"
          done
          test "$pushed" = true
      - name: retain the family content package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-family-nuget-${{ matrix.package }}-${{ steps.release.outputs.version }}
          path: ${{ matrix.package }}/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 90

  rubygems-resolve:
    name: Resolve release version
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the publish
    # lane. Only a successful completion whose triggering event was the
    # version-bump push or the maintenance ladder dispatch (the two events
    # the release workflow really runs on) resolves; the publish job below
    # cascades off the proceed output.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      proceed: ${{ steps.resolve.outputs.proceed }}
    permissions:
      contents: read
      # packages: read is required to query the GitHub Packages RubyGems
      # registry versions list (the pre-deploy existence check). The
      # publish job below escalates to packages: write.
      packages: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1
        with:
          # untrusted-input hardening: never interpolate event data
          # (release names, dispatch inputs) into the checkout ref. The
          # default branch is checked out first; the verified version tag
          # (validated against package.json on disk and the git tag list
          # below) is materialized with plain git commands afterwards.
          fetch-depth: 0

      - name: Set up Node (reproducible version-resolution step)
        uses: actions/setup-node@v7.1.0
        with:
          # the repo-declared Node line (the family runtime doctrine,
          # Regra 54: the runtime pin reads the envelope, never a drifting
          # literal): .nvmrc is the single source of truth the other
          # publish lanes already read.
          node-version-file: devthink/.nvmrc
          package-manager-cache: false

      - name: Resolve and verify the release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # the tag requested by the event (release published or dispatch);
          # treated as UNTRUSTED - only used to pick which tag to verify,
          # never interpolated into a checkout ref or shell command.
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # when an event names a tag, verify THAT tag matches the on-disk
          # package.json of its commit; otherwise resolve the version from
          # the default-branch metadata (the automatic bump path).
          requested="${REQUESTED_TAG:-}"
          if [ -n "$requested" ]; then
            git fetch --force --tags origin "refs/tags/${requested}:refs/tags/${requested}"
            git checkout --detach "$requested" 2>/dev/null || {
              echo "Tag ${requested} does not exist." >&2; exit 1; }
          fi
          version=$(node -p "JSON.parse(require('fs').readFileSync('devthink/package.json','utf8')).version")
          tag="v${version}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "proceed=false"
          } >> "$GITHUB_OUTPUT"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic release tag such as v1.2.0 is required (package.json version ${version})." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} does not exist; the DevThink Release workflow creates it on version bumps." >&2
            exit 1
          fi
          if [ "$(git rev-parse "${tag}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Tag ${tag} does not point at this source; the release for it already shipped. Skipping."
            exit 0
          fi
          if ! gh api "repos/${GH_REPO}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "No published GitHub release for ${tag}; the DevThink Release run skipped this bump. Skipping."
            exit 0
          fi
          # Pre-deploy existence check: the workflow_run trigger can fire
          # multiple times for the same Release completion, and the
          # git-tag/HEAD equality check above does NOT short-circuit the
          # duplicate-firing case where the tag still points at HEAD. The
          # GitHub Packages RubyGems registry rejects re-uploads with the
          # "Version X.Y.Z of devthink has already been pushed" error. Query
          # the registry versions list; if the version is already published,
          # exit 0 (proceed=false) so the duplicate firing no-ops instead of
          # failing the workflow.
          #
          # Robustness note: gh api writes error JSON to STDOUT (not stderr)
          # on 401/403/404, so `2>/dev/null` alone cannot suppress it. The
          # `|| true` ensures the subshell exits 0, then the case statement
          # validates the captured string is a pure non-negative integer;
          # anything else (error JSON, empty, etc.) is treated as "not
          # published yet" so a transient API failure does not silently
          # skip a publish.
          api_out="$(gh api "/users/${OWNER}/packages/rubygems/devthink/versions" --jq "[.[] | select(.name == \"${version}\")] | length" 2>/dev/null || true)"
          case "${api_out}" in
            ''|*[!0-9]*) api_out=0 ;;
          esac
          if [ "${api_out}" != "0" ]; then
            echo "RubyGems devthink-${version} is already published to GitHub Packages; the duplicate workflow_run firing will no-op."
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  rubygems:
    name: Publish devthink to GitHub Packages (RubyGems)
    needs: rubygems-resolve
    if: needs.rubygems-resolve.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    # the extension release-gate doctrine (the 2.0.18 port): every
    # registry publish answers through the release-approval environment
    # the release ladder's own publish jobs gate on.
    environment: release-approval
    timeout-minutes: 15
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@v7.0.1
        with:
          # needs.rubygems-resolve.outputs.tag is v<version> validated against the
          # package.json of the tagged commit - never raw event data.
          ref: ${{ needs.rubygems-resolve.outputs.tag }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          # the pinned interpreter (the family runtime doctrine, Regra 54/
          # 125: never the `ruby` mutable alias): the gemspec envelope
          # declares required_ruby_version >= 3.1, so the pin rides the
          # supported 3.4 line at its current patch release (ruby/ruby
          # releases, verified via the GitHub API) - the same
          # envelope-line doctrine the Node pin follows.
          ruby-version: 3.4.10

      - name: Configure GitHub credentials
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.gem"
          printf '%s\n' '---' ":github: Bearer ${GITHUB_TOKEN}" > "${HOME}/.gem/credentials"
          chmod 600 "${HOME}/.gem/credentials"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare temporary gem source
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p runner
          cat > runner/devthink.rb <<'RUBY'
          # frozen_string_literal: true

          module DevThink
            VERSION = ENV.fetch("DEVTHINK_VERSION", "0.0.0")

            def self.command(*arguments)
              [ENV.fetch("DEVTHINK_BIN", "devthink"), *arguments]
            end

            def self.start(*arguments, **options)
              Process.spawn(*command(*arguments), **options)
            end
          end
          RUBY

      - name: Build gem
        run: cd devthink && DEVTHINK_VERSION="${{ needs.rubygems-resolve.outputs.version }}" gem build devthink.gemspec

      - name: Publish package
        run: cd devthink && gem push devthink-*.gem --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}"

  family-rubygems:
    # the family rubygems lane: every documentation envelope builds its
    # gem from the folder gemspec (the envelope version the metadata
    # lockstep stamps rides the <APP>_VERSION environment the lane
    # resolves from the matrix leg) and pushes to the GitHub Packages
    # RubyGems registry behind the same pre-deploy existence check, the
    # same credential handoff and the same bounded retry the application
    # lane above carries.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    environment: release-approval
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [argan, cadria, debonair, stealthhead]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.11.1
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "versionarg=$(echo '${{ matrix.package }}' | tr '[:lower:]' '[:upper:]')_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: setup ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          # the pinned interpreter the application lane carries (the
          # family runtime doctrine, Regra 54/125): the gemspec envelopes
          # declare required_ruby_version >= 3.1, so the pin rides the
          # supported 3.4 line at its current patch release.
          ruby-version: 3.4.10
      - name: configure github credentials
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.gem"
          printf '%s\n' '---' ":github: Bearer ${GITHUB_TOKEN}" > "${HOME}/.gem/credentials"
          chmod 600 "${HOME}/.gem/credentials"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pre-deploy existence check
        # the idempotent publish: a gem version is immutable content, so a
        # re-run over an already pushed envelope skips the push instead of
        # reddening the lane on the registry's rejection.
        id: exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          PKG="${{ matrix.package }}"
          if curl -s -f -H "Authorization: Bearer $GITHUB_TOKEN" -o /dev/null "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/download/${PKG}/${PKG}-${RELEASE_VERSION}.gem"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: build the family gem
        if: steps.exists.outputs.present != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd "${{ matrix.package }}"
          env "${{ steps.release.outputs.versionarg }}=${RELEASE_VERSION}" gem build "${{ matrix.package }}.gemspec"
          test -f "${{ matrix.package }}-${RELEASE_VERSION}.gem"
      - name: publish the family gem
        if: steps.exists.outputs.present != 'true'
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cd "${{ matrix.package }}"
          attempt=0
          published=0
          until [ "$attempt" -ge 3 ]; do
            attempt=$((attempt + 1))
            # the gem name glob stays unquoted on purpose: gem push does not
            # expand patterns itself, and the quoted form the first real
            # publish run carried handed the literal `stealthhead-*.gem` to the
            # push command, which answered Gem::Package::FormatError on the
            # file it could not open. The shell expands the pattern here the
            # same way the application gem lane expands its devthink-*.gem.
            if pushlog="$(gem push ${{ matrix.package }}-*.gem --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}" 2>&1)"; then
              echo "$pushlog"
              published=1
              break
            fi
            echo "$pushlog"
            # a gem version is immutable content: when the registry answers
            # that the envelope is already there (the overlapping publish
            # windows of the family can resolve the same release version),
            # the lane stays green — the content the release promises is
            # present on the registry.
            if echo "$pushlog" | grep -q "has already been pushed"; then
              echo "::notice::the registry already carries ${{ matrix.package }} ${{ steps.release.outputs.version }}; the immutable envelope is present."
              published=1
              break
            fi
            echo "gem push attempt ${attempt}/3 failed; retrying with backoff."
            sleep "$((attempt * 5))"
          done
          if [ "$published" -ne 1 ]; then
            echo "::error::gem push failed after ${attempt} attempts."
            exit 1
          fi

  ghcr:
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the heavy
    # container lane. Only a successful completion whose triggering event
    # was the version-bump push or the maintenance ladder dispatch (the two
    # events the release workflow really runs on) publishes.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    # the extension release-gate doctrine (the 2.0.18 port): every
    # registry publish answers through the release-approval environment
    # the release ladder's own publish jobs gate on.
    environment: release-approval
    # the emulated legs of the multi arch push run the runtime stage
    # interpreted through qemu with the scaled smoke budgets the Dockerfile
    # sets; the 240 minute ceiling rides the family QEMU doctrine (the
    # e2ugh validation-leg calibration: a cold-cache emulated leg is
    # measured far past the old two-hour ceiling, and the riscv64 leg the
    # 2.0.16 index adds answers 64-bit emulation on a binfmt handler).
    timeout-minutes: 240
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.11.1
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: login ghcr
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: setup qemu
        # multi-arch emulation for the non-native architectures of the
        # five-arch index (the family union surface the saddle publish lane
        # established plus the riscv64 leg the 2.0.16 pass adds): amd64,
        # arm64, ppc64le, s390x and riscv64. the explicit platforms list is
        # the family pin — only the emulated legs install their binfmt
        # handlers.
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64
      - name: setup buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: check published image state
        # the idempotent publish: a version tag is immutable content, so a
        # re-run over an already published four-architecture index skips the
        # build and the push and only re-verifies the published image; a
        # missing or partial index (a failed previous run) rebuilds and
        # completes the push.
        id: published
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          image_ref="${image}:${version}"
          if docker buildx imagetools inspect --raw "${image_ref}" >/dev/null 2>&1; then
            arches="$(docker buildx imagetools inspect --raw "${image_ref}" | jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')"
            if [ "${arches}" = "amd64,arm64,ppc64le,riscv64,s390x" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "the image ${image_ref} is already published with all five architectures; the publish is idempotent."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "the image ${image_ref} exists without the five-architecture surface; the publish completes it." >&2
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: resolve image tags
        # the version tag plus the latest channel alias (the 2.0.16 fix of
        # the container that never landed on latest): the version tag stays
        # the immutable coordinate an operator pins, and the latest alias
        # realigns to the version this pipeline published — the same maene
        # family dist-tag doctrine the npm lanes carry, so `docker pull
        # devthink:latest` always answers the release the registry holds
        # current.
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          {
            echo "version=${version}"
            echo 'tags<<EOF'
            echo "${image}:${version}"
            echo "${image}:latest"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: build image for security scan
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./devthink
          file: ./devthink/Dockerfile
          # the runner stage is the explicit target: the single-binary
          # stages of the same file stay behind their own --target
          target: runtime
          load: true
          platforms: linux/amd64
          tags: devthink:scan-${{ steps.release.outputs.version }}
          build-args: |
            DEVTHINK_VERSION=${{ steps.release.outputs.version }}
            DEVTHINK_REVISION=${{ steps.release.outputs.revision }}
          # the build cache embeds inside the workflow run (the owner
          # directive, refined in 2.0.20): the buildkit session cache of
          # THIS run is created, used and discarded with it — the native
          # stages deduplicate across the architecture legs of the same
          # build and nothing crosses runs (the cross-run gha cache proved
          # fragile: the service evicts blobs and leaves orphan references
          # the next build reads as not-found), and nothing is published
          # beside the product image.
      - name: scan container image
        if: steps.published.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devthink:scan-${{ steps.release.outputs.version }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: scan container image best practices
        # the dockle gate (the container best-practices complement the
        # trivy gate above answers nothing about: trivy reports what is
        # INSIDE the image, dockle lints HOW the image is built - the
        # merged repository carried only the trivy half and the audit
        # flagged the missing family lane, every container the family
        # published went through dockle before the merge). it scans the
        # same locally loaded amd64 scan image the trivy gate uses and
        # fails the publish on FATAL findings - a container that
        # violates the build doctrine never reaches the registry.
        if: steps.published.outputs.skip != 'true'
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: devthink:scan-${{ steps.release.outputs.version }}
          # only FATAL findings fail the gate; WARN items are reported.
          exit-code: "1"
          exit-level: FATAL
          # the accept-key list whitelists every ENV/ARG key the runtime
          # stage declares plus the smoke-boot loop variables, the apt
          # retry counter and the node slim base layer internals the
          # CIS-DI-0010 heuristic misreads as credential holders (runnerpid
          # and waited are the smoke-boot loop's process id and retry
          # counter and smokebudget is the smoke-boot probe budget the loop
          # counter tracks; apt_update_tries is the mirror-sync retry counter
          # of the family apt pattern every apt RUN of the file carries; the
          # seven node-layer entries - dpkgArch, ARCH, OPENSSL_ARCH, GNUPGHOME,
          # --strip-components, /, and the apt autoremove knob - all come
          # from the official node image's install RUN: its architecture
          # probe, the case-arm architecture mappings, the gpg temp home,
          # the tar extraction flag and the apt cleanup option; the
          # --chown entry answers the buildkit COPY --chown history lines
          # of the runtime stage - the site, the cli and the http bundles
          # copy owned by the non-root uid 10000, the flag token rides the
          # layer history, and the heuristic splits --chown=10000:10000
          # into a var/value pair whose value is the ownership pair, the
          # same class as the gateway lineage's --strip-components accept;
          # none are
          # secrets, and the scanner only reports the first unaccepted
          # match per layer, so the list must cover them all). the
          # smoke-boot poll and the healthcheck need no entries: their
          # expressions carry no '=' character, and the heuristic only
          # reports tokens it can split on '=' (the arrow-callback
          # spelling r=>{...} put one there once and failed this gate in
          # the gateway family, which silently skipped the trivy legs
          # below it - the reason the devthink runner spells every
          # callback function(r){}). the remaining entries are the
          # runtime knobs, the build args and the OCI labels - no secret
          # material anywhere.
          accept-key: NODE_ENV,DEVTHINK_HTTP_BIND,DEVTHINK_HTTP_PORT,DEVTHINK_RELAY_PATH,DEVTHINK_MCP_BIND,DEVTHINK_MCP_PORT,DEVTHINK_MCP_PATH,DEVTHINK_MEMORY_ENGINE,DEVTHINK_PLATFORM,DEVTHINK_CDN_URL,NODE_IMAGE,DEVTHINK_VERSION,DEVTHINK_REVISION,PATH,NODE_VERSION,runnerpid,waited,smokebudget,apt_update_tries,dpkgArch,ARCH,OPENSSL_ARCH,GNUPGHOME,--strip-components,--chown,/,APT::AutoRemove::RecommendsImportant,org.opencontainers.image.title,org.opencontainers.image.description,org.opencontainers.image.documentation,org.opencontainers.image.version,org.opencontainers.image.licenses,org.opencontainers.image.source,org.opencontainers.image.revision
      - name: build and push image with attestations
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./devthink
          file: ./devthink/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            DEVTHINK_VERSION=${{ steps.release.outputs.version }}
            DEVTHINK_REVISION=${{ steps.release.outputs.revision }}
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64
          provenance: mode=max
          sbom: true
          # the build cache embeds inside the workflow run (the owner
          # directive, refined in 2.0.20): the buildkit session cache of
          # THIS run carries the stage deduplication across the five
          # architecture legs (the deps and builder stages answer the
          # native build platform, so every leg shares their results) and
          # nothing crosses runs — the cross-run gha cache proved fragile
          # (the service evicts blobs and leaves orphan references the
          # next build reads as not-found) and the registry cache the
          # family once carried is a published package the owner retired.
      - name: verify published image index and smoke test the runner
        # the smoke test runs the published image with the absorbed compose
        # hardening (read-only, cap-drop ALL, no-new-privileges, network
        # isolation, the tmpfs scratch), waits for the image HEALTHCHECK to
        # report the runner healthy and probes the /healthz endpoint that
        # reports every surface live - an image that cannot serve never
        # counts as published. the index assertion carries the four-arch
        # family surface (amd64, arm64, ppc64le, s390x) the push above
        # ships.
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${image}:${{ steps.release.outputs.version }}"
          docker buildx imagetools inspect --raw "${image_ref}" | jq -e '
            [
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ]
            | sort
            | . == ["amd64", "arm64", "ppc64le", "riscv64", "s390x"]
          '
          docker pull --quiet --platform linux/amd64 "${image_ref}"
          actual_version="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "${actual_version}" = "${{ steps.release.outputs.version }}"
          docker run -d --name devthink-smoke --platform linux/amd64 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --network none --tmpfs /tmp:size=512m,mode=1777 \
            "${image_ref}"
          trap 'docker rm -f devthink-smoke >/dev/null 2>&1 || true' EXIT
          healthy=""
          # the loop counter tracks the probe budget only; the body reads the
          # container state, never the index.
          # shellcheck disable=SC2034
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' devthink-smoke)"
            if [ "${status}" = "healthy" ]; then healthy="true"; break; fi
            if [ "${status}" = "unhealthy" ]; then
              echo "the published image reported an unhealthy runner:" >&2
              docker logs devthink-smoke >&2 || true
              exit 1
            fi
            sleep 2
          done
          test "${healthy}" = "true"
          docker exec devthink-smoke node -e "fetch('http://127.0.0.1:'+(process.env.DEVTHINK_HTTP_PORT||8080)+'/healthz').then(function(r){return r.json()}).then(function(body){if(body.ok!==true)process.exit(1);process.stderr.write(JSON.stringify(body)+'\n')}).catch(function(){process.exit(1)})"
          echo "the published image answered: the index carries amd64, arm64, ppc64le, riscv64 and s390x, the version label matches and the runner serves every surface healthy."
      - name: drop the legacy referrers fallback tags of the package page
        # The extension release lane doctrine: the registry records every
        # pushed manifest as a package version, and the attestation
        # pushes of earlier releases left the referrers fallback
        # manifests behind as versions tagged only sha256-... — this
        # step walks the package versions and drops exactly those,
        # dynamically from the registry answer (no digest is written
        # here), so the package page answers only the version tags the
        # metadata step owns. the walk is idempotent: a page with no
        # referrers-only versions answers nothing and the lane stays
        # green.
        if: steps.published.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page=1
          while :; do
            versions="$(gh api "user/packages/container/devthink/versions?per_page=100&page=${page}")"
            count="$(printf '%s' "$versions" | jq 'length')"
            if [ "$count" -eq 0 ]; then break; fi
            printf '%s' "$versions" | jq -c '.[] | select(((.metadata.container.tags // []) | length) > 0) | select((.metadata.container.tags // []) | all(startswith("sha256-")))' | while IFS= read -r legacy; do
              id="$(printf '%s' "$legacy" | jq -r '.id')"
              tags="$(printf '%s' "$legacy" | jq -c '.metadata.container.tags')"
              echo "dropping the referrers fallback version ${id} ${tags}"
              if gh api --method DELETE "user/packages/container/devthink/versions/${id}"; then
                echo "the version delete answered clean."
              else
                echo "::warning::the version delete of ${id} did not answer clean; the cleanup continues."
              fi
            done
            if [ "$count" -lt 100 ]; then break; fi
            page=$((page + 1))
          done
          echo "the referrers fallback cleanup walked the package page clean."

  family-ghcr:
    # the family container lane: the three site homes (argan, cadria,
    # debonair) publish one versioned static container each beside the
    # application image. stealthhead rides the registry lanes only until
    # its site surface lands - the folder carries no site/ yet, so a
    # static container would serve nothing. The publish state check and
    # the latest alias mirror the application lane; the static COPY build
    # answers every architecture the multi-arch base image publishes
    # without an emulator.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    environment: release-approval
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [argan, cadria, debonair]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.11.1
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "versionarg=$(echo '${{ matrix.package }}' | tr '[:lower:]' '[:upper:]')_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: login ghcr
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: setup buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: check published image state
        # the idempotent publish: a version tag is immutable content, so a
        # re-run over an already published site container skips the push
        # instead of re-writing the same manifest.
        id: published
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.package }}:${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "the ${{ matrix.package }} site container ${RELEASE_VERSION} is already published; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: stage the site build context for the container install
        # the site containers install the locked pnpm tree inside the
        # solbuild stage, and the pnpm supply-chain release-age policy (the
        # one-day window the pnpm 12 line answers by default) rejects every
        # lockfile entry younger than twenty-four hours - the first real
        # publish run red on the fresh dependency baseline of the release,
        # and the minimumReleaseAgeExclude list the envelopes carry is
        # exactly the exclusion class the pnpm issues 10361, 10266 and 13687
        # record as ignored during the frozen-lockfile verification. The
        # lane stages the build context and pins the window to zero for the
        # container install: the tracked application file stays untouched
        # and the frozen lockfile keeps answering the same
        # integrity-checked versions.
        if: steps.published.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf familybuildctx
          mkdir -p familybuildctx
          cp -a "${{ matrix.package }}/." familybuildctx/
          printf '\nminimumReleaseAge: 0\n' >> familybuildctx/pnpm-workspace.yaml
      - name: build and push the site container
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: familybuildctx
          file: ./${{ matrix.package }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            ${{ steps.release.outputs.versionarg }}=${{ steps.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:latest

  desktop:
    name: desktop ${{ matrix.name }}
    # the desktop lane of the merged repository wires to reality: the
    # merged product carries no tauri envelope (the retired lane gated on
    # desktop/Cargo.toml and desktop/tauri.conf.json, which the merge does
    # not carry - the dead gate never ran), and the desktop surface the
    # repository actually ships is the compiled workbench binary - "one
    # product, one binary, one metadata". the lane gates on the real
    # binary sources (build.ts + devthink.ts), compiles the full desktop
    # matrix through the same bun build --compile recipe the release lane
    # uses (cross compiled from the linux runner), stamps the checksums on
    # the runner and attaches the per-platform binaries to the release.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the matrix.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: bun-linux-x64
            extension: ""
            runnable: true
          - name: linux-arm64
            target: bun-linux-arm64
            extension: ""
            runnable: false
          - name: darwin-x64
            target: bun-darwin-x64
            extension: ""
            runnable: false
          - name: darwin-arm64
            target: bun-darwin-arm64
            extension: ""
            runnable: false
          - name: windows-x64
            target: bun-windows-x64
            extension: ".exe"
            runnable: false
    runs-on: ubuntu-24.04
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: resolve release version
        id: releaseversion
        # bash on every platform: the windows runners default to pwsh and
        # the shared resolver is a bash script (the saddle lane lesson).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # the automatic workflow_run path resolves the latest release and
          # detaches the working tree onto its tag (the publishghcr
          # resolver mold), so the matrix always compiles the tagged source.
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3

      # the reality gate: the binary sources of the merged repository. the
      # lane always builds (no detect-and-skip: the sources the product
      # ships are the sources the lane gates on).
      - name: gate the desktop binary sources
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          test -f build.ts
          test -f devthink.ts

      - name: install dependencies
        shell: bash
        run: cd devthink && bun install --frozen-lockfile

      # the prisma client the compiled binary embeds: the @prisma/client
      # package re-exports the generated .prisma/client/default module, so a
      # fresh checkout without generation answers the bundle with an
      # unresolvable require (the "Bundle failed" the lane carried since the
      # merge — the sandbox builds passed by resolving a parent project's
      # generated client, the runner never had one). the generate step the
      # root script owns materializes the client from schema.prisma
      # before the compile reads it.
      - name: generate the prisma client the binary embeds
        shell: bash
        run: cd devthink && bun run db:generate

      - name: compile the desktop binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p release
          bun run build.ts --target "${{ matrix.target }}" --outfile "release/devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}${{ matrix.extension }}"
          test -f "release/devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}${{ matrix.extension }}"

      # the runnable smoke: the compiled binary answers the version command
      # on the leg whose target the linux runner can execute (the cross
      # compiled darwin and windows binaries ship through the same recipe
      # the release lane compiles them with).
      - name: smoke test the compiled binary
        if: matrix.runnable
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          # the binary name carries two expansions; the quoted word keeps the
          # globbing discipline the release lane preaches.
          actual_version="$(./release/"devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}" --version)"
          test "${actual_version}" = "${RELEASE_VERSION}"

      - name: collect desktop artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          version="${RELEASE_VERSION}"
          mkdir -p build/release-assets/desktop
          binary="devthink.desktop.${version}.${{ matrix.name }}${{ matrix.extension }}"
          cp "release/${binary}" "build/release-assets/desktop/${binary}"
          checksums="sha256.desktop.${{ matrix.name }}.${version}"
          manifest="manifest.desktop.${{ matrix.name }}.${version}.json"
          sha256sum "build/release-assets/desktop/${binary}" | sed 's#build/release-assets/desktop/##' > "build/release-assets/desktop/${checksums}"
          printf '{\n  "version": "%s",\n  "platform": "desktop",\n  "target": "%s",\n  "binary": "%s",\n  "signing": "caller-owned"\n}\n' "$version" "${{ matrix.target }}" "$binary" > "build/release-assets/desktop/${manifest}"
          ! find build/release-assets/desktop -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .

      - name: upload workflow artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: devthink.desktop.${{ matrix.name }}.${{ steps.releaseversion.outputs.version }}
          path: devthink/build/release-assets/desktop
          if-no-files-found: error

      - name: attach release assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag)
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/release-assets/desktop/* --clobber

  desktop-tauri:
    name: desktop tauri ${{ matrix.platform }}-${{ matrix.architecture }}
    # the tauri lane of the saddle desktop surface (the GUI shell beside
    # the compiled binary lane above): a desktop application is not a
    # virtualization surface - the whole lane ports. the rust shell is
    # runner-side scaffold (the native wrapper doctrine: a toolchain
    # output generated and stamped on the runner, never tracked), the
    # tracked root tauri.conf.json carries the identity and the window
    # contract, and the icons derive from the web/icon.svg source through
    # the pinned tauri cli on every leg.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the matrix.
