        # the version tag plus the latest channel alias (the 2.0.16 fix of
        # the container that never landed on latest): the version tag stays
        # the immutable coordinate an operator pins, and the latest alias
        # realigns to the version this pipeline published — the same maene
        # family dist-tag doctrine the npm lanes carry, so `docker pull
        # devthink:latest` always answers the release the registry holds
