          image_ref="${image}:${version}"
          if docker buildx imagetools inspect --raw "${image_ref}" >/dev/null 2>&1; then
            arches="$(docker buildx imagetools inspect --raw "${image_ref}" | jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')"
            if [ "${arches}" = "amd64,arm64,ppc64le,riscv64,s390x" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "the image ${image_ref} is already published with all five architectures; the publish is idempotent."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "the image ${image_ref} exists without the five-architecture surface; the publish completes it." >&2
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: resolve image tags
        # the version tag plus the latest channel alias (the 2.0.16 fix of
        # the container that never landed on latest): the version tag stays
        # the immutable coordinate an operator pins, and the latest alias
        # realigns to the version this pipeline published — the same maene
        # family dist-tag doctrine the npm lanes carry, so `docker pull
        # devthink:latest` always answers the release the registry holds
        # current.
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          {
            echo "version=${version}"
            echo 'tags<<EOF'
            echo "${image}:${version}"
            echo "${image}:latest"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: build image for security scan
        if: steps.published.outputs.skip != 'true'
        # the context is THE REPOSITORY ROOT (the family-context law the
        # Dockerfile header records): the dependency union pins the vault
        # sibling as file:../vault, the flat test village owns the build
        # engine and the suite, and the config bridges resolve the getry
        # and saddle engines onto their sibling owners, so the image
        # builds from the checkout geometry it mirrors.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./devthink/Dockerfile
          # the runner stage is the explicit target: the single-binary
          # stages of the same file stay behind their own --target
          target: runtime
          load: true
          platforms: linux/amd64
          tags: devthink:scan-${{ steps.release.outputs.version }}
          build-args: |
            DEVTHINK_VERSION=${{ steps.release.outputs.version }}
            DEVTHINK_REVISION=${{ steps.release.outputs.revision }}
          # the build cache embeds inside the workflow run (the owner
          # directive, refined in 2.0.20): the buildkit session cache of
          # THIS run is created, used and discarded with it — the native
          # stages deduplicate across the architecture legs of the same
          # build and nothing crosses runs (the cross-run gha cache proved
          # fragile: the service evicts blobs and leaves orphan references
          # the next build reads as not-found), and nothing is published
          # beside the product image.
      - name: Install trivy (the redirector bypass lane)
        # get.trivy.dev DNS dies on the hosted runners (curl exit six,
        # three strikes across fresh runners and reruns); the release
        # tarball rides the github.com lane the tag resolve itself proved
        # alive - the retry loop rides the curl flags and the explicit
        # version pin (the supply chain doctrine the action pin carried).
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if command -v trivy >/dev/null 2>&1; then trivy --version; exit 0; fi
          for i in 1 2 3 4 5 6; do
            curl -sfL --retry 5 --retry-delay 10 --retry-all-errors \
              "https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz" \
              -o /tmp/trivy.tar.gz && break
            echo "trivy download attempt ${i} failed; sleeping before the next ride"
            sleep 15
          done
          test -s /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: scan container image
        if: steps.published.outputs.skip != 'true'
        run: |
          trivy image devthink:scan-${{ steps.release.outputs.version }} \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1
      - name: scan container image best practices
        # the dockle gate (the container best-practices complement the
        # trivy gate above answers nothing about: trivy reports what is
        # INSIDE the image, dockle lints HOW the image is built - the
        # merged repository carried only the trivy half and the audit
        # flagged the missing family lane, every container the family
        # published went through dockle before the merge). it scans the
        # same locally loaded amd64 scan image the trivy gate uses and
        # fails the publish on FATAL findings - a container that
        # violates the build doctrine never reaches the registry.
        if: steps.published.outputs.skip != 'true'
        uses: goodwithtech/dockle-action@e30e6af832aad6ea7dca2a248d31a85eab6dbd68 # v0.4.15
        with:
          image: devthink:scan-${{ steps.release.outputs.version }}
          # only FATAL findings fail the gate; WARN items are reported.
          exit-code: "1"
          exit-level: FATAL
          # the accept-key list whitelists every ENV/ARG key the runtime
          # stage declares plus the smoke-boot loop variables, the apt
          # retry counter and the node slim base layer internals the
          # CIS-DI-0010 heuristic misreads as credential holders (runnerpid
          # and waited are the smoke-boot loop's process id and retry
          # counter and smokebudget is the smoke-boot probe budget the loop
          # counter tracks; apt_update_tries is the mirror-sync retry counter
          # of the family apt pattern every apt RUN of the file carries; the
          # seven node-layer entries - dpkgArch, ARCH, OPENSSL_ARCH, GNUPGHOME,
          # --strip-components, /, and the apt autoremove knob - all come
          # from the official node image's install RUN: its architecture
          # probe, the case-arm architecture mappings, the gpg temp home,
          # the tar extraction flag and the apt cleanup option; the
          # --chown entry answers the buildkit COPY --chown history lines
          # of the runtime stage - the site, the cli and the http bundles
          # copy owned by the non-root uid 10000, the flag token rides the
          # layer history, and the heuristic splits --chown=10000:10000
          # into a var/value pair whose value is the ownership pair, the
          # same class as the gateway lineage's --strip-components accept;
          # none are
          # secrets, and the scanner only reports the first unaccepted
          # match per layer, so the list must cover them all). the
          # smoke-boot poll and the healthcheck need no entries: their
          # expressions carry no '=' character, and the heuristic only
          # reports tokens it can split on '=' (the arrow-callback
          # spelling r=>{...} put one there once and failed this gate in
          # the gateway family, which silently skipped the trivy legs
          # below it - the reason the devthink runner spells every
          # callback function(r){}). the remaining entries are the
          # runtime knobs, the build args and the OCI labels - no secret
          # material anywhere.
          accept-key: NODE_ENV,DEVTHINK_HTTP_BIND,DEVTHINK_HTTP_PORT,DEVTHINK_RELAY_PATH,DEVTHINK_MCP_BIND,DEVTHINK_MCP_PORT,DEVTHINK_MCP_PATH,DEVTHINK_MEMORY_ENGINE,DEVTHINK_PLATFORM,DEVTHINK_CDN_URL,NODE_IMAGE,DEVTHINK_VERSION,DEVTHINK_REVISION,PATH,NODE_VERSION,runnerpid,waited,smokebudget,apt_update_tries,dpkgArch,ARCH,OPENSSL_ARCH,GNUPGHOME,--strip-components,--chown,/,APT::AutoRemove::RecommendsImportant,org.opencontainers.image.title,org.opencontainers.image.description,org.opencontainers.image.documentation,org.opencontainers.image.version,org.opencontainers.image.licenses,org.opencontainers.image.source,org.opencontainers.image.revision
      - name: build and push image with attestations
        if: steps.published.outputs.skip != 'true'
        # the context is THE REPOSITORY ROOT (the family-context law the
        # Dockerfile header records): the dependency union pins the vault
        # sibling as file:../vault, the flat test village owns the build
        # engine and the suite, and the config bridges resolve the getry
        # and saddle engines onto their sibling owners, so the image
        # builds from the checkout geometry it mirrors.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./devthink/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            DEVTHINK_VERSION=${{ steps.release.outputs.version }}
            DEVTHINK_REVISION=${{ steps.release.outputs.revision }}
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64
          provenance: mode=max
          sbom: true
          # the build cache embeds inside the workflow run (the owner
          # directive, refined in 2.0.20): the buildkit session cache of
          # THIS run carries the stage deduplication across the five
          # architecture legs (the deps and builder stages answer the
          # native build platform, so every leg shares their results) and
          # nothing crosses runs — the cross-run gha cache proved fragile
          # (the service evicts blobs and leaves orphan references the
          # next build reads as not-found) and the registry cache the
          # family once carried is a published package the owner retired.
      - name: build the documented best-effort lanes (fail closed, never block the wave)
        # the honest best-effort half of the twelve-lane axis (the owner's
        # container-lane law: MORE THAN 11 lanes per app container): the
        # five carried arches above (every arch the verified node 26
        # tarballs and the debian trixie base honestly answer — checked
        # against the live registries) beside seven documented best-effort
        # lanes (386, arm/v5, arm/v6, arm/v7, mips64le, mips64, loong64:
        # buildx-supported arches whose node runtime tarball or base
        # manifest no upstream ships today). each lane builds its own
        # per-arch tag, and a lane that cannot resolve fails closed with a
        # warning — the lane stays documented in the census, the wave
        # never reddens on an arch no base ships (continue-on-error rides
        # the step for the same law).
        if: steps.published.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          version="${{ steps.release.outputs.version }}"
          for arch in linux/386 linux/arm/v5 linux/arm/v6 linux/arm/v7 linux/mips64le linux/mips64 linux/loong64; do
            slug="${arch//\//-}"
            echo "--- best-effort lane ${arch} (documented: no node 26 tarball or base manifest carries this arch today) ---"
            if docker buildx build \
              --platform "${arch}" \
              --target runtime \
              --build-arg "DEVTHINK_VERSION=${version}" \
              --build-arg "DEVTHINK_REVISION=${{ steps.release.outputs.revision }}" \
              --tag "${image}:${version}-${slug}" \
              --push . "--file=./devthink/Dockerfile"; then
              echo "the best-effort lane ${arch} answered — an upstream carries it now; the lane ships as :${version}-${slug}."
            else
              echo "::warning::the best-effort lane ${arch} failed closed — no node 26 runtime tarball or base manifest answers it; the lane stays documented in the census, the wave continues."
            fi
          done
      - name: verify published image index and smoke test the runner
        # the smoke test runs the published image with the absorbed compose
        # hardening (read-only, cap-drop ALL, no-new-privileges, network
        # isolation, the tmpfs scratch), waits for the image HEALTHCHECK to
        # report the runner healthy and probes the /healthz endpoint that
        # reports every surface live - an image that cannot serve never
        # counts as published. the index assertion carries the four-arch
        # family surface (amd64, arm64, ppc64le, s390x) the push above
        # ships.
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${image}:${{ steps.release.outputs.version }}"
          docker buildx imagetools inspect --raw "${image_ref}" | jq -e '
            [
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ]
            | sort
            | . == ["amd64", "arm64", "ppc64le", "riscv64", "s390x"]
          '
          docker pull --quiet --platform linux/amd64 "${image_ref}"
          actual_version="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "${actual_version}" = "${{ steps.release.outputs.version }}"
          docker run -d --name devthink-smoke --platform linux/amd64 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --network none --tmpfs /tmp:size=512m,mode=1777 \
            "${image_ref}"
          trap 'docker rm -f devthink-smoke >/dev/null 2>&1 || true' EXIT
          healthy=""
          # the loop counter tracks the probe budget only; the body reads the
          # container state, never the index.
          # shellcheck disable=SC2034
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' devthink-smoke)"
            if [ "${status}" = "healthy" ]; then healthy="true"; break; fi
            if [ "${status}" = "unhealthy" ]; then
              echo "the published image reported an unhealthy runner:" >&2
              docker logs devthink-smoke >&2 || true
              exit 1
            fi
            sleep 2
          done
          test "${healthy}" = "true"
          docker exec devthink-smoke node -e "fetch('http://127.0.0.1:'+(process.env.DEVTHINK_HTTP_PORT||8080)+'/healthz').then(function(r){return r.json()}).then(function(body){if(body.ok!==true)process.exit(1);process.stderr.write(JSON.stringify(body)+'\n')}).catch(function(){process.exit(1)})"
          echo "the published image answered: the index carries amd64, arm64, ppc64le, riscv64 and s390x, the version label matches and the runner serves every surface healthy."
          echo "the devthink container answers 12 lanes (5 base-carried arches in the published index + 7 documented best-effort lanes: 386, arm/v5, arm/v6, arm/v7, mips64le, mips64, loong64): more than eleven, the container-lane law answered."
      - name: drop the legacy referrers fallback tags of the package page
        # The extension release lane doctrine: the registry records every
        # pushed manifest as a package version, and the attestation
        # pushes of earlier releases left the referrers fallback
        # manifests behind as versions tagged only sha256-... — this
        # step walks the package versions and drops exactly those,
        # dynamically from the registry answer (no digest is written
        # here), so the package page answers only the version tags the
        # metadata step owns. the walk is idempotent: a page with no
        # referrers-only versions answers nothing and the lane stays
        # green.
        if: steps.published.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page=1
          while :; do
            versions="$(gh api "user/packages/container/devthink/versions?per_page=100&page=${page}")"
            count="$(printf '%s' "$versions" | jq 'length')"
            if [ "$count" -eq 0 ]; then break; fi
            printf '%s' "$versions" | jq -c '.[] | select(((.metadata.container.tags // []) | length) > 0) | select((.metadata.container.tags // []) | all(startswith("sha256-")))' | while IFS= read -r legacy; do
              id="$(printf '%s' "$legacy" | jq -r '.id')"
              tags="$(printf '%s' "$legacy" | jq -c '.metadata.container.tags')"
              echo "dropping the referrers fallback version ${id} ${tags}"
              if gh api --method DELETE "user/packages/container/devthink/versions/${id}"; then
                echo "the version delete answered clean."
              else
                echo "::warning::the version delete of ${id} did not answer clean; the cleanup continues."
              fi
            done
            if [ "$count" -lt 100 ]; then break; fi
            page=$((page + 1))
          done
          echo "the referrers fallback cleanup walked the package page clean."

  family-ghcr:
    needs: [release-resolve, release-approval]
    # the family container registry lane: every family site home (argan,
    # cadria, cobaia, debonair, forge, foundry, getry, stealthhead and the
    # self-contained vault engine) publishes one versioned static container
    # each beside the application image - the 2.0.163 registry sync wave
    # retires the three-app era the lane carried (the "no site/ yet" gap
    # closed when the family-container archive lane began proving every
    # build; the registry lane and the archive lane now answer the same
    # nine legs, the os rides its own ghcr lane and the saddle engine
    # answers the vhe lanes of the saddle block). The publish state check
    # and the latest alias mirror the application lane; the static COPY
    # build answers every architecture the multi-arch base image publishes
    # without an emulator.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [argan, cadria, cobaia, debonair, forge, foundry, getry, stealthhead, vault]
        # THE TWELVE-LANE FAMILY PLATFORM AXIS (the owner's container-lane
        # law: every app container of the eleven carries MORE THAN 11
        # lanes): every site home answers the eight arches its pinned
        # nginxinc/nginx-unprivileged:1.29-alpine runtime base honestly
        # resolves (verified against the live registry manifest list: 386,
        # amd64, arm/v6, arm/v7, arm64, ppc64le, riscv64, s390x — the
        # solbuild stage rides the native build platform so the 2-arch
        # node alpine base never constrains the static output), beside
        # four documented best-effort lanes (arm/v5, mips64le, mips64,
        # loong64: buildx-supported arches no pinned base carries today —
        # the lanes stay named, fail closed and never block the wave). the
        # vault engine compiles its better-sqlite3 seat per-arch inside
        # the node:26-alpine base, so its carried set is the amd64 and
        # arm64 legs the base answers and its best-effort set is the ten
        # remaining seats of the same twelve-lane axis — 8+4 or 2+10,
        # twelve lanes every app, honestly counted.
        include:
          - package: argan
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            carriedassert: '["386","amd64","arm/v6","arm/v7","arm64","ppc64le","riscv64","s390x"]'
          - package: cadria
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            carriedassert: '["386","amd64","arm/v6","arm/v7","arm64","ppc64le","riscv64","s390x"]'
          - package: cobaia
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            carriedassert: '["386","amd64","arm/v6","arm/v7","arm64","ppc64le","riscv64","s390x"]'
          - package: debonair
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            carriedassert: '["386","amd64","arm/v6","arm/v7","arm64","ppc64le","riscv64","s390x"]'
          - package: forge
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            carriedassert: '["386","amd64","arm/v6","arm/v7","arm64","ppc64le","riscv64","s390x"]'
          - package: foundry
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            carriedassert: '["386","amd64","arm/v6","arm/v7","arm64","ppc64le","riscv64","s390x"]'
          - package: getry
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            carriedassert: '["386","amd64","arm/v6","arm/v7","arm64","ppc64le","riscv64","s390x"]'
          - package: stealthhead
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
            exotic: linux/arm/v5,linux/mips64le,linux/mips64,linux/loong64
            carriedassert: '["386","amd64","arm/v6","arm/v7","arm64","ppc64le","riscv64","s390x"]'
          - package: vault
            platforms: linux/amd64,linux/arm64
            exotic: linux/386,linux/arm/v5,linux/arm/v6,linux/arm/v7,linux/mips64le,linux/mips64,linux/ppc64le,linux/riscv64,linux/s390x,linux/loong64
            carriedassert: '["amd64","arm64"]'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "versionarg=$(echo '${{ matrix.package }}' | tr '[:lower:]' '[:upper:]')_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: login ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: setup qemu
        # the emulated legs of the eight-arch site index: every platform
        # the amd64 runner cannot execute installs its binfmt handler here
        # (the family pin — only the emulated legs: 386, arm64, arm/v6,
        # arm/v7, ppc64le, riscv64 and s390x; the vault engine rides the
        # native amd64 leg beside the arm64 emulated one).
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/386,linux/arm64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/s390x
      - name: setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: check published image state
        # the idempotent publish: a version tag is immutable content, so a
        # re-run over an already published site container skips the push
        # instead of re-writing the same manifest.
        id: published
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.package }}:${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "the ${{ matrix.package }} site container ${RELEASE_VERSION} is already published; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: stage the site build context for the container install
        # the site containers install the locked pnpm tree inside the
        # solbuild stage, and the pnpm supply-chain release-age policy (the
        # one-day window the pnpm 12 line answers by default) rejects every
        # lockfile entry younger than twenty-four hours - the first real
        # publish run red on the fresh dependency baseline of the release,
        # and the minimumReleaseAgeExclude list the envelopes carry is
        # exactly the exclusion class the pnpm issues 10361, 10266 and 13687
        # record as ignored during the frozen-lockfile verification. The
        # lane stages the build context and pins the window to zero for the
        # container install: the tracked application file stays untouched
        # and the frozen lockfile keeps answering the same
        # integrity-checked versions.
        #
        # The 2.0.153 family context fix: the application rides the context
        # nested under app/ (the uniform shape the three site Dockerfiles
        # read), and the engine-ownership law carries its price - cadria
        # consumes the debonair audio engine as a source-level sibling (the
        # vite aliases resolve ../debonair/*), so the cadria context stages
        # the sibling whole beside it. The flat context the lane staged
        # before left the ../debonair imports unreachable inside the
        # container and the cadria container build died on the vite step
        # (the only cross-app consumption the family ships today; the map
        # below is the single place a new sibling registers).
        #
        # The 2.0.154 vault sibling fix: the copy law is the second
        # source-level sibling the site homes consume - every labels.ts
        # imports @wenathlan/vault/labelstore and the vite aliases resolve
        # ../vault/*, so the vault sources ride every family context beside
        # the app. The app-only context the lane staged before left the
        # label store bridge unloadable inside the container and the build
        # died on the vite step ([UNLOADABLE_DEPENDENCY] Could not load
        # ../vault/labelstore.ts) - the vault sibling stages for every
        # site home, not a per-app case entry, because the copy law is the
        # one consumption every family app shares.
        #
        # The 2.0.163 registry sync wave: the sibling map below mirrors the
        # family-container archive lane case map one to one (the map the
        # archive lane proved over every release since 2.0.161), and the
        # debonair leg heals the saddle sibling its Dockerfile COPYs that
        # the three-app era never staged. The vault engine skips the staged
        # shape entirely - its container builds from its own self-contained
        # folder the archive lane proved (the resolve-shape step below).
        if: steps.published.outputs.skip != 'true' && matrix.package != 'vault'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf familybuildctx
          mkdir -p familybuildctx/app
          cp -a "${{ matrix.package }}/." familybuildctx/app/
          printf '\nminimumReleaseAge: 0\n' >> familybuildctx/app/pnpm-workspace.yaml
          # the copy-law sibling every site home rides: the vault label
          # store answers the @wenathlan/vault/labelstore bridge through
          # the ../vault vite aliases, so the sibling sources ride every
          # family context (sources only - the build never installs it,
          # the aliases read the .ts files directly)
          mkdir -p familybuildctx/vault
          cp -a vault/. familybuildctx/vault/
          rm -rf familybuildctx/vault/node_modules \
                 familybuildctx/vault/dist \
                 familybuildctx/vault/build
          case "${{ matrix.package }}" in
            argan|cobaia|stealthhead)
              # the copy-law pair the base staging already answers (app +
              # vault): these site homes consume no further sibling
              # through the vite aliases, so the case registers the shape
              # the map documents for each leg
              ;;
            cadria)
              # the engine-ownership sibling map: cadria resolves the
              # debonair audio engine through the ../debonair vite
              # aliases, so the sibling rides the context whole (sources
              # only - the build never installs it, the aliases read
              # the .ts files directly)
              mkdir -p familybuildctx/debonair
              cp -a debonair/. familybuildctx/debonair/
              rm -rf familybuildctx/debonair/node_modules \
                     familybuildctx/debonair/dist \
                     familybuildctx/debonair/build
              ;;
            debonair)
              # the engine-ownership sibling map is symmetric: debonair
              # resolves the cadria synth palette through the
              # ../cadria/synthpalette vite aliases (coverpalette.ts) and
              # the saddle workload law through the ../saddle ones, so both
              # siblings ride the context whole (sources only - the build
              # never installs them, the aliases read the .ts files
              # directly) the same way the cadria lane stages the debonair
              # audio engine above
              mkdir -p familybuildctx/cadria familybuildctx/saddle
              cp -a cadria/. familybuildctx/cadria/
              cp -a saddle/. familybuildctx/saddle/
              rm -rf familybuildctx/cadria/node_modules \
                     familybuildctx/cadria/dist \
                     familybuildctx/cadria/build \
                     familybuildctx/saddle/node_modules \
                     familybuildctx/saddle/dist \
                     familybuildctx/saddle/build
              ;;
            forge|foundry)
              # the vault copy law plus the saddle engine ownership: the
              # modes and sandbox bridges the ../saddle aliases own (the
              # map the archive lane proved for both runner homes)
              mkdir -p familybuildctx/saddle
              cp -a saddle/. familybuildctx/saddle/
              rm -rf familybuildctx/saddle/node_modules \
                     familybuildctx/saddle/dist \
                     familybuildctx/saddle/build
              ;;
            getry)
              # the gateway sibling map: the vault copy law, the saddle
              # modality registry, the devthink config bridges and the
              # debonair route table all ride the context whole (the map
              # the archive lane proved for the gateway home)
              mkdir -p familybuildctx/saddle familybuildctx/devthink familybuildctx/debonair
              cp -a saddle/. familybuildctx/saddle/
              cp -a devthink/. familybuildctx/devthink/
              cp -a debonair/. familybuildctx/debonair/
              rm -rf familybuildctx/saddle/node_modules familybuildctx/saddle/dist familybuildctx/saddle/build \
                     familybuildctx/devthink/node_modules familybuildctx/devthink/dist familybuildctx/devthink/build \
                     familybuildctx/debonair/node_modules familybuildctx/debonair/dist familybuildctx/debonair/build
              ;;
          esac
      - name: resolve the context shape
        # the vault engine owns its own closure: its container builds from
        # its own folder (the self-contained shape the archive lane proved)
        # while every site home answers the staged familybuildctx shape
        id: resolve-context
        if: steps.published.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.package }}" = "vault" ]; then
            echo "context=./vault" >> "$GITHUB_OUTPUT"
          else
            echo "context=familybuildctx" >> "$GITHUB_OUTPUT"
          fi
      - name: build and push the site container
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.resolve-context.outputs.context || 'familybuildctx' }}
          file: ./${{ matrix.package }}/Dockerfile
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            ${{ steps.release.outputs.versionarg }}=${{ steps.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:latest
      - name: build the documented best-effort lanes (fail closed, never block the wave)
        # the honest best-effort half of the twelve-lane axis: the arches
        # buildx supports whose pinned runtime base carries no manifest
        # today (arm/v5, mips64le, mips64 and loong64 for the site homes;
        # the node-base complement for the vault engine). each lane builds
        # its own per-arch tag, and a lane whose base cannot resolve fails
        # closed with a warning — the lane stays documented in the census,
        # the wave never reddens on an arch no base ships (continue-on-error
        # rides the step for the same law: a mirror race on a lane that
        # could build never blocks the family either).
        if: steps.published.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        env:
          EXOTIC: ${{ matrix.exotic }}
        run: |
          set -uo pipefail
          version="${{ steps.release.outputs.version }}"
          context="${{ steps.resolve-context.outputs.context || 'familybuildctx' }}"
          for arch in ${EXOTIC//,/ }; do
            slug="${arch//\//-}"
            echo "--- best-effort lane ${arch} (documented: no pinned base carries this manifest today) ---"
            if docker buildx build \
              --platform "${arch}" \
              --build-arg "${{ steps.release.outputs.versionarg }}=${version}" \
              --tag "ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:${version}-${slug}" \
              --push "${context}" "--file=./${{ matrix.package }}/Dockerfile"; then
              echo "the best-effort lane ${arch} answered — a base variant carries it now; the lane ships as :${version}-${slug}."
            else
              echo "::warning::the best-effort lane ${arch} failed closed — the pinned runtime base carries no ${arch} manifest; the lane stays documented in the census, the wave continues."
            fi
          done
      - name: verify the published lane set (the twelve-lane axis)
        # the lane census the owner's law charges: the published index
        # must carry every arch the pinned base resolves (the carried
        # half of the axis), and the census line names the best-effort
        # half — twelve lanes per app container, more than eleven, every
        # one honestly named.
        if: steps.published.outputs.skip != 'true'
        shell: bash
        env:
          CARRIEDASSERT: ${{ matrix.carriedassert }}
          EXOTIC: ${{ matrix.exotic }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          image_ref="ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}:${version}"
          docker buildx imagetools inspect --raw "${image_ref}" | jq -e --argjson expected "${CARRIEDASSERT}" '
            [
              .manifests[]
              | select(.platform.os == "linux")
              | if .platform.variant then "\(.platform.architecture)/\(.platform.variant)" else .platform.architecture end
            ]
            | sort
            | . == $expected
          '
          carried="$(printf '%s' "${CARRIEDASSERT}" | jq length)"
          exotic="$(printf '%s' "${EXOTIC}" | tr ',' '\n' | wc -l)"
          lanes=$((carried + exotic))
          echo "the ${{ matrix.package }} container answers ${lanes} lanes (${carried} base-carried arches in the published index + ${exotic} documented best-effort lanes): more than eleven, the container-lane law answered."

  desktop:
    name: desktop ${{ matrix.name }}
    needs: release-resolve
    # the desktop lane of the merged repository wires to reality: the
    # merged product carries no tauri envelope (the retired lane gated on
    # desktop/Cargo.toml and desktop/tauri.conf.json, which the merge does
    # not carry - the dead gate never ran), and the desktop surface the
    # repository actually ships is the compiled workbench binary - "one
    # product, one binary, one metadata". the lane gates on the real
    # binary sources (build.ts + devthink.ts), compiles the full desktop
    # matrix through the same bun build --compile recipe the release lane
    # uses (cross compiled from the linux runner), stamps the checksums on
    # the runner and attaches the per-platform binaries to the release.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the matrix.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: bun-linux-x64
            extension: ""
            runnable: true
          - name: linux-arm64
            target: bun-linux-arm64
            extension: ""
            runnable: false
          - name: darwin-x64
            target: bun-darwin-x64
            extension: ""
            runnable: false
          - name: darwin-arm64
            target: bun-darwin-arm64
            extension: ""
            runnable: false
          - name: windows-x64
            target: bun-windows-x64
            extension: ".exe"
            runnable: false
          # the musl legs of the compiled binary surface (the asset parity
          # expansion): the alpine and the musl-native hosts install the
          # same standalone workbench binary the glibc hosts do, and the
          # bun compile target list answers both musl architectures.
          - name: linux-x64-musl
            target: bun-linux-x64-musl
            extension: ""
            runnable: false
          - name: linux-arm64-musl
            target: bun-linux-arm64-musl
            extension: ""
            runnable: false
    runs-on: ubuntu-24.04
    # every job carries its own ceiling (the family contract): the
    # compiled-binary leg rides the same bun build --compile recipe the
    # release assemble lane carries its 30-minute ceiling for.
    timeout-minutes: 30
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: resolve release version
        id: releaseversion
        # bash on every platform: the windows runners default to pwsh and
        # the shared resolver is a bash script (the saddle lane lesson).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # the automatic workflow_run path resolves the latest release and
          # detaches the working tree onto its tag (the publishghcr
          # resolver mold), so the matrix always compiles the tagged source.
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # the reality gate: the binary sources of the merged repository. the
      # lane always builds (no detect-and-skip: the sources the product
      # ships are the sources the lane gates on).
      - name: gate the desktop binary sources
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          test -f build.ts
          test -f devthink.ts

      - name: install dependencies
        shell: bash
        # the setup node registry url leaves the github package redirect in
        # the home npmrc: the install neutralizes it so bun resolves the
        # public npmjs mirror the family publishes.
        run: |
          cd devthink
          rm -f "$HOME/.npmrc"
          git checkout -- .npmrc
          bun install --frozen-lockfile --ignore-scripts

      # the prisma client the compiled binary embeds: the @prisma/client
      # package re-exports the generated .prisma/client/default module, so a
      # fresh checkout without generation answers the bundle with an
      # unresolvable require (the "Bundle failed" the lane carried since the
      # merge — the sandbox builds passed by resolving a parent project's
      # generated client, the runner never had one). the generate step the
      # root script owns materializes the client from schema.prisma
      # before the compile reads it.
      - name: generate the prisma client the binary embeds
        shell: bash
        run: cd devthink && bun run db:generate

      # the gateway sibling the compiled binary bridges into: the bundle's
      # module graph reaches ../getry/engine.ts through the getry bridge
      # family (the thinking ladder the os consumes as a library), and the
      # engine's lazy z-ai-web-dev-sdk singleton resolves from the getry
      # tree's own node_modules — the devthink install alone leaves the
      # sibling bare and the compile answers "Bundle failed" on the
      # unresolved dynamic import (the same fresh-checkout law the prisma
      # generate step carries: the sandbox builds passed by resolving a
      # sibling's installed tree, the runner never had one).
      - name: install the gateway sibling the binary bridges into
        shell: bash
        run: |
          cd getry
          rm -f "$HOME/.npmrc"
          git checkout -- .npmrc 2>/dev/null || true
          bun install --frozen-lockfile --ignore-scripts

      - name: compile the desktop binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p release
          bun run build.ts binary --target "${{ matrix.target }}" --outfile "release/devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}${{ matrix.extension }}"
          test -f "release/devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}${{ matrix.extension }}"

      # the runnable smoke: the compiled binary answers the version command
      # on the leg whose target the linux runner can execute (the cross
      # compiled darwin and windows binaries ship through the same recipe
      # the release lane compiles them with).
      - name: smoke test the compiled binary
        if: matrix.runnable
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          # the binary name carries two expansions; the quoted word keeps the
          # globbing discipline the release lane preaches.
          actual_version="$(./release/"devthink.desktop.${RELEASE_VERSION}.${{ matrix.name }}" --version)"
          test "${actual_version}" = "${RELEASE_VERSION}"

      - name: collect desktop artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          version="${RELEASE_VERSION}"
          mkdir -p build/release-assets/desktop
          binary="devthink.desktop.${version}.${{ matrix.name }}${{ matrix.extension }}"
          cp "release/${binary}" "build/release-assets/desktop/${binary}"
          checksums="sha256.desktop.${{ matrix.name }}.${version}"
          manifest="manifest.desktop.${{ matrix.name }}.${version}.json"
          sha256sum "build/release-assets/desktop/${binary}" | sed 's#build/release-assets/desktop/##' > "build/release-assets/desktop/${checksums}"
          printf '{\n  "version": "%s",\n  "platform": "desktop",\n  "target": "%s",\n  "binary": "%s",\n  "signing": "caller-owned"\n}\n' "$version" "${{ matrix.target }}" "$binary" > "build/release-assets/desktop/${manifest}"
          ! find build/release-assets/desktop -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .

      - name: upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.desktop.${{ matrix.name }}.${{ steps.releaseversion.outputs.version }}
          path: devthink/build/release-assets/desktop
          if-no-files-found: error

      - name: attach release assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag)
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/release-assets/desktop/* --clobber

  desktop-tauri:
    name: desktop tauri ${{ matrix.platform }}-${{ matrix.architecture }}
    needs: release-resolve
    # the tauri lane of the saddle desktop surface (the GUI shell beside
    # the compiled binary lane above): a desktop application is not a
    # virtualization surface - the whole lane ports. the rust shell is
    # runner-side scaffold (the native wrapper doctrine: a toolchain
    # output generated and stamped on the runner, never tracked), the
    # tracked root tauri.conf.json carries the identity and the window
    # contract, and the icons derive from the web/icon.svg source through
    # the pinned tauri cli on every leg.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the matrix.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: windows
            architecture: x86
            runner: windows-2025
            target: i686-pc-windows-msvc
            bundles: nsis,msi
          - platform: windows
            architecture: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: windows
            architecture: arm64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            bundles: nsis,msi
          - platform: macos
            architecture: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: macos
            architecture: arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    # every job carries its own ceiling (the family contract): the rust
    # compile lane rides the family desktop lane's own 60-minute value
    # (the same tauri matrix family-desktop.yml gates).
    timeout-minutes: 60
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: resolve release version
        id: releaseversion
        # bash on every platform: the windows runners default to pwsh and
        # the shared resolver is a bash script (the saddle lane lesson).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: devthink/.nvmrc
      - name: setup pnpm
        # standalone: the desktop lane is the family's only macos pnpm
        # consumer, and the self-installer of pnpm 11 verifies its native
        # binary against the lockfile of the checkout - the web lockfile
        # carries no @pnpm/exe.darwin entries, so the identity check
        # refuses the runner. the standalone mode installs the pinned
        # pnpm straight from the npm registry and skips the lockfile
        # identity gate.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
          # the standalone @pnpm/exe binary answers a Node.js SEA bug on
          # the Intel macOS runners (the upstream issue the pnpm error
          # names: no working darwin-x64 binary), so the intel leg falls
          # back to the npm-managed install the workaround documents while
          # every other leg keeps the self-contained binary.
          standalone: ${{ matrix.runner != 'macos-15-intel' }}
      - name: set up bun
        # the devthink application pins bun (packageManager bun@1.4.2), so the
        # pnpm invocations that touch it delegate to this exact bun build.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: setup rust
        # the saddle lane rides the stable channel (the family runtime
        # doctrine, Regra 54/125: the toolchain the tauri lane compiles
        # answers the same channel every leg resolves). The ref is the
        # `stable` branch the action publishes - the `vstable` spelling the
        # first real publish run carried resolved no version and killed the
        # whole matrix at the Set up job step.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: add target toolchain
        run: rustup target add "${{ matrix.target }}"

      - name: install linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf rpm

      # the reality gate: the tauri envelope the repository tracks (the
      # root config and the icon source the cli derives every density from).
      - name: gate the tauri sources
        shell: bash
        run: |
          set -euo pipefail
          test -f devthink/tauri.conf.json
          test -f devthink/icon.svg
          test -f devthink/package.json

      - name: build shared web surface
        # the single static UI source (the same build the mobile lane
        # wraps): the vite build answers straight at the application root —
        # no dist, no public — and the staging below frames the delivered
        # surface the shell bundles.
        shell: bash
        run: |
          set -euo pipefail
          (cd devthink && bun install --frozen-lockfile --ignore-scripts)
          (cd devthink && npm run build:web)
          test -f devthink/index.html
          test -n "$(ls devthink/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
          mkdir -p devthink/build/web
          cp devthink/index.html devthink/build/web/
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp devthink/*.${kind} devthink/build/web/ 2>/dev/null || true
          done
          test -f devthink/build/web/index.html

      - name: scaffold desktop rust shell
        # the runner-side scaffold (the native wrapper doctrine): the
        # cargo manifest, the entry sources and the copied tauri config
        # with runner-relative paths live under build/native/desktop,
        # three levels below the app root - the same geometry the
        # saddle lane scaffolds.
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p build/native/desktop
          cd build/native/desktop
          cat > Cargo.toml <<'CARGO_EOF'
          [package]
          name = "devthink-desktop"
          version = "0.0.0"
          description = "DevThink desktop workbench shell"
          authors = ["wenathlan"]
          edition = "2021"
          license = "GPL-3.0-only"
          build = "build.rs"

          [lib]
          name = "devthink_desktop"
          path = "lib.rs"
          crate-type = ["staticlib", "cdylib", "rlib"]

          [[bin]]
          name = "devthink-desktop"
          path = "main.rs"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          CARGO_EOF
          cat > main.rs <<'MAIN_EOF'
          fn main() {
              devthink_desktop::run()
          }
          MAIN_EOF
          cat > lib.rs <<'LIB_EOF'
          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("failed to run DevThink desktop workbench")
          }
          LIB_EOF
          cat > build.rs <<'BUILD_EOF'
          fn main() {
              tauri_build::build()
          }
          BUILD_EOF
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("../../../tauri.conf.json", "utf8"));
            config.build.frontendDist = "../../../build/web";
            config.build.beforeDevCommand = "pnpm dev";
            fs.writeFileSync("tauri.conf.json", `${JSON.stringify(config, null, 2)}\n`);
            console.log("copied the tauri.conf.json into the scaffold with runner-relative paths");
          '

      - name: synchronize desktop version metadata
        # stamps tauri.conf.json version + Cargo.toml version on the scaffold
        # copy (the tracked root file moves with release bumps, never with
        # runner builds).
        shell: bash
        env:
          DEVTHINK_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e 'const fs=require("node:fs"); const version=process.env.DEVTHINK_VERSION; const config=JSON.parse(fs.readFileSync("build/native/desktop/tauri.conf.json","utf8")); config.version=version; fs.writeFileSync("build/native/desktop/tauri.conf.json", `${JSON.stringify(config, null, 2)}\n`); const cargo=fs.readFileSync("build/native/desktop/Cargo.toml","utf8").replace(/^version = ".*"$/m, `version = "${version}"`); fs.writeFileSync("build/native/desktop/Cargo.toml", cargo);'

      - name: generate platform icons
        # the icon source the repository tracks (icon.svg, the 1024px
        # mark) derives every density the bundles declare - nothing is
        # committed pre-rendered.
        shell: bash
        run: cd devthink && npx --yes @tauri-apps/cli@2.11.4 icon icon.svg --output build/native/desktop/icons

      - name: configure desktop signing status
        # the saddle signing surface: the caller-owned certificate when the
        # platform's secrets exist, the unsigned path (skipped sign and
        # notarize steps below) otherwise - the manifest records which.
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows" ] && [ -n "${WINDOWS_CERTIFICATE_BASE64:-}" ] && [ -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "DEVTHINK_SIGNING=caller-owned" >> "$GITHUB_ENV"
          elif [ "${{ matrix.platform }}" = "macos" ] && [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "DEVTHINK_SIGNING=caller-owned" >> "$GITHUB_ENV"
          else
            echo "DEVTHINK_SIGNING=unsigned" >> "$GITHUB_ENV"
          fi

      - name: configure macos signing keychain
        if: matrix.platform == 'macos' && env.DEVTHINK_SIGNING == 'caller-owned'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/devthink-desktop.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/devthink-desktop.p12"
          security import "$RUNNER_TEMP/devthink-desktop.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          echo "APPLE_SIGNING_IDENTITY_EXPORTED=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: build desktop bundles
        shell: bash
        run: |
          set -euo pipefail
          cd devthink/build/native/desktop
          if [ "${DEVTHINK_SIGNING}" = "caller-owned" ]; then
            npx --yes @tauri-apps/cli@2.11.4 build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          else
            npx --yes @tauri-apps/cli@2.11.4 build --ci --no-sign --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          fi

      - name: sign windows installers
        # the saddle signtool recipe: the caller's certificate signs every
        # installer the bundle emitted, with the timestamp counter-signature
        # the repository variable names.
        if: matrix.platform == 'windows' && env.DEVTHINK_SIGNING == 'caller-owned'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\devthink-code-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          Get-ChildItem "devthink\build\native\desktop\target\${{ matrix.target }}\release\bundle" -Recurse -Include *.exe,*.msi | ForEach-Object {
            signtool sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /f "$env:RUNNER_TEMP\devthink-code-signing.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
            signtool verify /pa /all $_.FullName
          }

      - name: notarize macos installers
        # the saddle notarytool recipe: the dmg images submit to Apple's
        # notary service and staple the ticket the response issues.
        if: matrix.platform == 'macos' && env.DEVTHINK_SIGNING == 'caller-owned'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for dmg in devthink/build/native/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
          done

      - name: collect desktop artifacts
        shell: bash
        env:
          DEVTHINK_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          version="${DEVTHINK_VERSION}"
          mkdir -p build/release-assets/tauri
          # the find walk replaces the globstar sweep the macOS bash 3.2
          # cannot answer: `shopt: globstar: invalid shell option name`
          # killed the 2.0.14 macos legs at the shopt line itself, before
          # the first bundle ever answered — globstar is a bash 4 option
          # and the macos runners carry the bash 3.2 the system ships.
          # find carries the recursive walk on every platform the matrix
          # builds and the nullglob semantics ride the read itself (an
          # empty bundle tree answers nothing and the collected assertion
          # below fails the leg honestly). the -f guard beside the loop
          # keeps the exact filtering the globstar sweep carried.
          collected=0
          while IFS= read -r -d '' bundle; do
            [ -f "$bundle" ] || continue
            case "$bundle" in
              *.deb|*.rpm|*.AppImage|*.exe|*.msi|*.dmg)
                ext="${bundle##*.}"
                [ "$ext" = "AppImage" ] && ext="appimage"
                asset="devthink.desktop.${version}.${{ matrix.platform }}-${{ matrix.architecture }}.${ext}"
                cp "$bundle" "build/release-assets/tauri/${asset}"
                collected=$((collected + 1))
                ;;
              *.app)
                asset="devthink.desktop.${version}.${{ matrix.platform }}-${{ matrix.architecture }}.app.zip"
                ditto -c -k --sequesterRsrc --keepParent "$bundle" "build/release-assets/tauri/${asset}" 2>/dev/null || (cd "$(dirname "$bundle")" && zip -qr "$OLDPWD/build/release-assets/tauri/${asset}" "$(basename "$bundle")")
                collected=$((collected + 1))
                ;;
            esac
          done < <(find "build/native/desktop/target/${{ matrix.target }}/release/bundle" -print0 2>/dev/null)
          test "$collected" -gt 0
          # the portable digest: the macOS runners carry no sha256sum
          # binary (the 2.0.15 macos legs died at the checksum line), so
          # the lane answers shasum -a 256 there — the same coreutils wire
          # format sha256sum emits, and the digest files stay identical
          # across the matrix.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum build/release-assets/tauri/* | sed 's#build/release-assets/tauri/##' > "build/release-assets/tauri/sha256.desktop.${{ matrix.platform }}-${{ matrix.architecture }}.${version}"
          else
            shasum -a 256 build/release-assets/tauri/* | sed 's#build/release-assets/tauri/##' > "build/release-assets/tauri/sha256.desktop.${{ matrix.platform }}-${{ matrix.architecture }}.${version}"
          fi
          printf '{\n  "version": "%s",\n  "platform": "desktop-tauri",\n  "target": "%s",\n  "bundles": "%s",\n  "signing": "%s",\n  "notarization": "%s"\n}\n' "$version" "${{ matrix.target }}" "${{ matrix.bundles }}" "${DEVTHINK_SIGNING:-unsigned}" "${DEVTHINK_NOTARIZATION:-none}" > "build/release-assets/tauri/manifest.desktop.${{ matrix.platform }}-${{ matrix.architecture }}.${version}.json"
          ! find build/release-assets/tauri -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .

      - name: upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.desktop.tauri.${{ matrix.platform }}-${{ matrix.architecture }}.${{ steps.releaseversion.outputs.version }}
          path: devthink/build/release-assets/tauri
          if-no-files-found: error

      - name: attach release assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag)
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/release-assets/tauri/* --clobber

  android:
    name: android release artifacts
    needs: release-resolve
    # the mobile lane folds to the saddle pattern: the workbench at the
    # application root is the single static UI source (the mobile shell
    # doctrine of the repository), the lane builds it with the workspace's
    # own frozen lockfile, relocates the DevThink mobile identity the
    # repository carries (devthink/capacitor.config.ts - appId
    # im.devthink.app) onto the app root on the runner (a native wrapper
    # is toolchain output, generated and stamped on the runner, never
    # tracked), and runs the capacitor add/sync from working-directory:
    # devthink. the lane gates on the real locations (devthink/package.json,
    # devthink/vite.config.ts and the mobile identity config) - it always
    # builds. the release lane is
    # the saddle signing surface: the caller-owned keystore when the
    # production secrets exist, the clearly labeled ci-test-key when a
    # release fires without them, and a hard fail on manual dispatch
    # that carries neither.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the wrapper.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    # every job carries its own ceiling (the family contract): the mobile
    # shell lane rides the family mobile lane's own 45-minute value
    # (family-mobile.yml gates the android leg the same).
    timeout-minutes: 45
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # the automatic workflow_run path resolves the latest release and
          # detaches the working tree onto its tag (the publishghcr
          # resolver mold), so the wrapper always builds the tagged source.
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # the reality gate: the merged workbench and the mobile identity the
      # repository actually carries (no detect-and-skip - the sources the
      # product ships are the sources the lane gates on).
      - name: gate the merged mobile surface
        shell: bash
        run: |
          set -euo pipefail
          test -f devthink/package.json
          test -f devthink/vite.config.ts
          test -f devthink/capacitor.config.ts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
      - name: set up bun
        # the devthink application pins bun (packageManager bun@1.4.2), so the
        # pnpm invocations that touch it delegate to this exact bun build.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # the explicit platform-tools package: the action default answers
          # the retired `tools` package that the sdk no longer carries.
          packages: platform-tools
      - name: accept the android sdk licenses
        # the runner image refresh resets the accepted license set: the
        # sdkmanager answers its own prompt through the yes pipe before the
        # package install reads it.
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: install android sdk packages
        # the release lane's r8 and build-tools surface (the saddle recipe):
        # the debug lane inherited the runner's preinstalled set, the
        # release build asks for the platform and build tools explicitly.
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: build the static workbench
        # the single static UI source: the vite build answers straight at
        # the application root (no dist, no public), the staging inside the
        # same step frames the delivered surface, and the webDir below aims
        # the capacitor shell at that staging.
        shell: bash
        run: |
          set -euo pipefail
          (cd devthink && bun install --frozen-lockfile --ignore-scripts)
          (cd devthink && npm run build:web)
          test -f devthink/index.html
          test -n "$(ls devthink/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
          mkdir -p devthink/build/web
          cp devthink/index.html devthink/build/web/
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp devthink/*.${kind} devthink/build/web/ 2>/dev/null || true
          done
          test -f devthink/build/web/index.html

      - name: relocate the mobile identity onto the web root
        # the saddle native wrapper doctrine: the shell is runner-side
        # toolchain output. the lane reads the DevThink mobile identity the
        # repository carries (appId im.devthink.app, appName DevThink) and
        # writes it at the app root with the webDir aimed at the staged
        # workbench output, so the capacitor add/sync below runs with
        # working-directory: devthink exactly like the saddle mobile lane.
        # the identity is read from the tracked config, never hardcoded
        # here: the one config of the family lives at the app root as the
        # ts source the capacitor cli 8.5 resolves from its cwd, and the
        # derived json rides beside it for every consumer that prefers the
        # plain shape.
        shell: bash
        run: |
          set -euo pipefail
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync("devthink/capacitor.config.ts", "utf8");
            const appid = /appId:\s*"([^"]+)"/.exec(source);
            if (!appid || appid[1].trim() === "") throw new Error("The mobile identity config carries no appId.");
            const appname = /appName:\s*"([^"]+)"/.exec(source);
            const config = { appId: appid[1], appName: appname ? appname[1] : "DevThink", webDir: "build/web", bundledWebRuntime: false };
            fs.writeFileSync("devthink/capacitor.config.json", `${JSON.stringify(config, null, 2)}\n`);
            console.log(`derived the DevThink mobile identity (${config.appId}) at the web root (webDir ${config.webDir})`);
          '
          # the cli resolves capacitor.config.ts ahead of the derived json,
          # and the tracked ts answers webDir "." - a value the capacitor
          # 8.5 line refuses on the sync path (the first real publish run
          # red the ios leg on "is not a valid value for webDir"). The
          # runner aims the tracked ts at the staged build/web the same way
          # the family mobile lane does: the tracked file never carries the
          # runner path once the release commit is cut.
          node -e 'const fs=require("node:fs");const file="devthink/capacitor.config.ts";const source=fs.readFileSync(file,"utf8");const rewritten=source.replace(/webDir:\s*"[^"]*"/,`webDir: "build/web"`);if(rewritten===source)throw new Error("the capacitor config carries no webDir to aim");fs.writeFileSync(file,rewritten);'

      - name: generate and synchronize the android wrapper
        # the capacitor cli pinned to the 8.5.0 the mobile shell declares;
        # cap add materializes the android template inside the application and
        # sync copies the built workbench output into its assets.
        working-directory: devthink
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android

      - name: derive android version values
        # the saddle release lane recipe: the version and the derived
        # versionCode (major*1000000 + minor*1000 + patch) ride the env so
        # the stamp and the collect steps share one source of truth.
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "DEVTHINK_VERSION=$version" >> "$GITHUB_ENV"
          echo "DEVTHINK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: stamp generated android release config
        # the saddle release stamp: injects, into the generated gradle config:
        # the keystore.properties loader header (java Properties +
        # FileInputStream guarded by keystorePropertiesFile.exists()),
        # signingConfigs.release (keyAlias/keyPassword/storeFile/
        # storePassword read from keystore.properties), the release
        # buildType with minifyEnabled true, shrinkResources true,
        # proguard-android-optimize.txt + signingConfig signingConfigs.release
        # (only when keystorePropertiesFile.exists()), and the abi splits
        # block (the asset parity expansion: one standalone apk per abi
        # beside the universal build - armeabi-v7a, arm64-v8a, x86, x86_64 -
        # the legacy splits dsl answers fully installable apks, never the
        # bundletool split artifacts that need a base). asserts the stock
        # template blocks (versionCode 1 / versionName "1.0" / plain release)
        # were found and the stamp landed before writing.
        shell: bash
        run: |
          set -euo pipefail
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const file = "devthink/android/app/build.gradle";
            let gradle = fs.readFileSync(file, "utf8");
            const version = process.env.DEVTHINK_VERSION;
            const versioncode = process.env.DEVTHINK_VERSION_CODE;
            if (!version || !versioncode) {
              throw new Error("DEVTHINK_VERSION and DEVTHINK_VERSION_CODE must be exported before stamping");
            }
            const plainrelease = [
              "    buildTypes {",
              "        release {",
              "            minifyEnabled false",
              "            proguardFiles getDefaultProguardFile(\x27proguard-android.txt\x27), \x27proguard-rules.pro\x27",
              "        }",
              "    }"
            ].join("\n");
            if (!gradle.includes("versionCode 1") || !gradle.includes(`versionName "1.0"`) || !gradle.includes(plainrelease)) {
              throw new Error(`generated android template drifted: the defaultConfig/release blocks were not found in ${file}`);
            }
            gradle = gradle.replace("versionCode 1", `versionCode ${versioncode}`);
            gradle = gradle.replace(`versionName "1.0"`, `versionName "${version}"`);
            const stampedrelease = [
              "    signingConfigs {",
              "        if (keystorePropertiesFile.exists()) {",
              "            release {",
              "                keyAlias keystoreProperties[\x27keyAlias\x27]",
              "                keyPassword keystoreProperties[\x27keyPassword\x27]",
              "                storeFile file(keystoreProperties[\x27storeFile\x27])",
              "                storePassword keystoreProperties[\x27storePassword\x27]",
              "            }",
              "        }",
              "    }",
              "",
              "    buildTypes {",
              "        release {",
              "            minifyEnabled true",
              "            shrinkResources true",
              "            proguardFiles getDefaultProguardFile(\x27proguard-android-optimize.txt\x27), \x27proguard-rules.pro\x27",
              "            if (keystorePropertiesFile.exists()) {",
              "                signingConfig signingConfigs.release",
              "            }",
              "        }",
              "    }"
            ].join("\n");
            const splitrelease = [
              "    splits {",
              "        abi {",
              // the bundle collision law (issuetracker.google.com/402800800):
              // a bundle task never rides the same invocation as the abi
              // splits — the shrunk-resources stage answers one file per
              // split and buildReleasePreBundle refuses the many — so the
              // splits answer the assemble invocations alone and the bundle
              // lane runs its own invocation with the splits asleep (the
              // per-abi apks, the universal apk and the aab all ship)
              "            enable gradle.startParameter.taskNames.any { it.toLowerCase().contains(\x27assemble\x27) } && !gradle.startParameter.taskNames.any { it.toLowerCase().contains(\x27bundle\x27) }",
              "            reset()",
              "            include \x27armeabi-v7a\x27, \x27arm64-v8a\x27, \x27x86\x27, \x27x86_64\x27",
              "            universalApk true",
              "        }",
              "    }",
              "",
              ""
            ].join("\n");
            gradle = gradle.replace(plainrelease, splitrelease + stampedrelease);
            const keystoreloader = [
              "apply plugin: \x27com.android.application\x27",
              "",
              "import java.io.FileInputStream",
              "import java.util.Properties",
              "",
              "def keystorePropertiesFile = rootProject.file(\x27keystore.properties\x27)",
              "def keystoreProperties = new Properties()",
              "if (keystorePropertiesFile.exists()) {",
              "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))",
              "}"
            ].join("\n");
            gradle = gradle.replace("apply plugin: \x27com.android.application\x27", keystoreloader);
            if (!gradle.includes(`versionCode ${versioncode}`) || !gradle.includes(`versionName "${version}"`) || !gradle.includes("signingConfig signingConfigs.release") || !gradle.includes("universalApk true")) {
              throw new Error("the stamp did not land");
            }
            fs.writeFileSync(file, gradle);
            console.log(`stamped ${file}: versionName ${version}, versionCode ${versioncode}, the signed optimized release block`);
          '

      - name: configure android signing
        # the saddle signing three-way: the caller-owned keystore when the
        # production secrets exist; the clearly labeled ci-test-key when a
        # release (or a manual build that allows it) fires without them; a
        # hard fail otherwise. the manifest records which path answered.
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          production_ready=false
          if [ -n "${ANDROID_KEY_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_STORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            production_ready=true
          fi
          if [ "$production_ready" = true ]; then
            printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/devthink-upload.jks"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/devthink-upload.jks"
              printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > devthink/android/keystore.properties
            echo "DEVTHINK_SIGNING=caller-owned" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ inputs.allow_test_signing }}" = "true" ]; then
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/devthink-test.jks" -storepass changeit -keypass changeit -alias devthink-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DevThink CI Test,O=DevThink,C=US"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/devthink-test.jks"
              printf 'storePassword=changeit\n'
              printf 'keyAlias=devthink-test\n'
              printf 'keyPassword=changeit\n'
            } > devthink/android/keystore.properties
            echo "DEVTHINK_SIGNING=ci-test-key" >> "$GITHUB_ENV"
          else
            echo "Manual Android builds require production signing secrets or allow_test_signing=true."
            exit 1
          fi

      - name: build optimized android release
        working-directory: devthink/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # the bundle collision law rides the invocation split: the abi
          # splits answer the assemble lane alone (per-abi apks beside the
          # universal), and the bundle lane runs its own invocation with
          # the splits asleep — one shrunk-resources file, the aab ships
          ./gradlew --no-daemon --stacktrace assembleRelease
          ./gradlew --no-daemon --stacktrace bundleRelease

      - name: collect android artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          version="${{ steps.release.outputs.version }}"
          mkdir -p build/mobile/android
          apk="devthink.android.${version}.apk"
          aab="devthink.android.${version}.aab"
          aab_source="$(find android/app/build/outputs/bundle/release -type f \( -name 'android-release*.aab' -o -name 'app-release*.aab' \) -print -quit)"
          test -n "$aab_source"
          cp "$aab_source" "build/mobile/android/${aab}"
          # the abi split collect (the asset parity expansion): every apk the
          # splits dsl emitted lands under its public name - the universal
          # build keeps the plain apk name the lane always shipped, and every
          # abi answers beside it with dots only (the public naming carries
          # no underscore, so x86_64 ships as x64).
          collected=0
          while IFS= read -r -d '' apk_source; do
            [ -f "$apk_source" ] || continue
            base="$(basename "$apk_source")"
            case "$base" in
              *armeabi-v7a*) out="devthink.android.${version}.armeabi.v7a.apk" ;;
              *arm64-v8a*) out="devthink.android.${version}.arm64.v8a.apk" ;;
              *x86_64*) out="devthink.android.${version}.x64.apk" ;;
              *x86*) out="devthink.android.${version}.x86.apk" ;;
              *) out="devthink.android.${version}.apk" ;;
            esac
            cp "$apk_source" "build/mobile/android/${out}"
            collected=$((collected + 1))
          done < <(find android/app/build/outputs/apk/release -type f -name '*.apk' -print0 | sort -z)
          test "$collected" -ge 5
          test -f "build/mobile/android/devthink.android.${version}.apk"
          test -f "build/mobile/android/devthink.android.${version}.armeabi.v7a.apk"
          test -f "build/mobile/android/devthink.android.${version}.arm64.v8a.apk"
          test -f "build/mobile/android/devthink.android.${version}.x86.apk"
          test -f "build/mobile/android/devthink.android.${version}.x64.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x -print 2>/dev/null | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          for apk_path in build/mobile/android/*.apk; do
            "$apksigner_path" verify --verbose "$apk_path"
          done
          jarsigner -verify -verbose -certs "build/mobile/android/${aab}" >/dev/null
          sha256sum build/mobile/android/*.apk "build/mobile/android/${aab}" | sed 's#build/mobile/android/##' > "build/mobile/android/sha256.android.${version}"
          printf '{\n  "version": "%s",\n  "platform": "android",\n  "signing": "%s",\n  "optimization": "r8-and-resource-shrinking",\n  "appId": "%s",\n  "files": ["%s", "devthink.android.%s.armeabi.v7a.apk", "devthink.android.%s.arm64.v8a.apk", "devthink.android.%s.x86.apk", "devthink.android.%s.x64.apk", "%s"]\n}\n' "$version" "${DEVTHINK_SIGNING:-unknown}" "$(node -p "JSON.parse(require('node:fs').readFileSync('./capacitor.config.json','utf8')).appId")" "$apk" "$version" "$version" "$version" "$version" "$aab" > "build/mobile/android/manifest.android.${version}.json"
      - name: validate public asset names
        # the family asset naming gate: no underscore and no build script
        # name ever rides a published asset.
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          find build/mobile/android -type f | while IFS= read -r asset; do
            base="$(basename "$asset")"
            case "$base" in
              # the build script pattern rides first: it carries underscores,
              # so the general underscore gate below would swallow it and the
              # specific message would never answer.
              build_script_build*.exe) echo "The asset ${base} carries the build script name; the public naming carries none." >&2; exit 1 ;;
              *_*) echo "The asset ${base} carries an underscore; the public naming carries none." >&2; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.android.${{ steps.release.outputs.version }}
          path: devthink/build/mobile/android
          if-no-files-found: error
      - name: attach Android assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/mobile/android/* --clobber

  ios-simulator:
    name: iOS simulator artifact
    needs: release-resolve
    # the same saddle fold on the macos leg: the workbench builds, the
    # identity relocates onto the app root, cap add/sync runs with
    # working-directory: devthink and the simulator build archives the app.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the simulator build.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: macos-15
    # every job carries its own ceiling (the family contract): the
    # simulator leg rides the family mobile lane's own 45-minute value
    # (the ios legs of family-mobile.yml answer the same ceiling).
    timeout-minutes: 45
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # the automatic workflow_run path resolves the latest release and
          # detaches the working tree onto its tag (the publishghcr
          # resolver mold), so the simulator always builds the tagged source.
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: gate the merged mobile surface
        shell: bash
        run: |
          set -euo pipefail
          test -f devthink/package.json
          test -f devthink/vite.config.ts
          test -f devthink/capacitor.config.ts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0
      - name: set up bun
        # the devthink application pins bun (packageManager bun@1.4.2), so the
        # pnpm invocations that touch it delegate to this exact bun build.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: build the static workbench
        shell: bash
        run: |
          set -euo pipefail
          (cd devthink && bun install --frozen-lockfile --ignore-scripts)
          (cd devthink && npm run build:web)
          test -f devthink/index.html
          test -n "$(ls devthink/*.js 2>/dev/null)" || { echo "::error::the build emitted no hashed bundle at the application root"; exit 1; }
          mkdir -p devthink/build/web
          cp devthink/index.html devthink/build/web/
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp devthink/*.${kind} devthink/build/web/ 2>/dev/null || true
          done
          test -f devthink/build/web/index.html

      - name: derive the mobile identity at the web root
        # the tracked ts config is the one source; the derived json rides beside it.
        shell: bash
        run: |
          set -euo pipefail
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync("devthink/capacitor.config.ts", "utf8");
            const appid = /appId:\s*"([^"]+)"/.exec(source);
            if (!appid || appid[1].trim() === "") throw new Error("The mobile identity config carries no appId.");
            const appname = /appName:\s*"([^"]+)"/.exec(source);
            const config = { appId: appid[1], appName: appname ? appname[1] : "DevThink", webDir: "build/web", bundledWebRuntime: false };
            fs.writeFileSync("devthink/capacitor.config.json", `${JSON.stringify(config, null, 2)}\n`);
            console.log(`derived the DevThink mobile identity (${config.appId}) at the web root (webDir ${config.webDir})`);
          '
          # the cli resolves capacitor.config.ts ahead of the derived json,
          # and the tracked ts answers webDir "." - a value the capacitor
          # 8.5 line refuses on the sync path (the first real publish run
          # red the ios leg on "is not a valid value for webDir"). The
          # runner aims the tracked ts at the staged build/web the same way
          # the family mobile lane does: the tracked file never carries the
          # runner path once the release commit is cut.
          node -e 'const fs=require("node:fs");const file="devthink/capacitor.config.ts";const source=fs.readFileSync(file,"utf8");const rewritten=source.replace(/webDir:\s*"[^"]*"/,`webDir: "build/web"`);if(rewritten===source)throw new Error("the capacitor config carries no webDir to aim");fs.writeFileSync(file,rewritten);'

      - name: generate and synchronize the ios wrapper
        working-directory: devthink
        shell: bash
        run: |
          set -euo pipefail
          npx cap add ios
          npx cap sync ios

      - name: build iOS simulator application
        shell: bash
        env:
          DEVTHINK_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          versioncode="$(node -p "process.env.DEVTHINK_VERSION.split('.').reduce((code, part) => code * 1000 + Number(part), 0)")"
          xcodebuild -project devthink/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath "$RUNNER_TEMP/devthink-ios" MARKETING_VERSION="$DEVTHINK_VERSION" CURRENT_PROJECT_VERSION="$versioncode" build

      - name: collect iOS simulator artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p build/mobile/ios
          app="$(find "$RUNNER_TEMP/devthink-ios/Build/Products" -type d -name 'App.app' -print -quit)"
          test -n "$app"
          asset="devthink.ios.${VERSION}.simulator.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/mobile/ios/${asset}"
          shasum -a 256 "build/mobile/ios/${asset}" | sed 's#build/mobile/ios/##' > "build/mobile/ios/sha256.ios.${VERSION}"
          printf '{\n  "version": "%s",\n  "platform": "ios-simulator",\n  "signing": "not-required",\n  "appId": "%s",\n  "files": ["%s"]\n}\n' "$VERSION" "$(node -p "JSON.parse(require('node:fs').readFileSync('./capacitor.config.json','utf8')).appId")" "$asset" > "build/mobile/ios/manifest.ios.${VERSION}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.ios.${{ steps.release.outputs.version }}
          path: devthink/build/mobile/ios
          if-no-files-found: error
      - name: attach iOS simulator assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/mobile/ios/* --clobber

