              echo "The go module tag ${modtag} already exists on a different commit; the go module registry is immutable and the lane refuses the re-tag." >&2
              exit 1
            fi
            echo "The go module tag ${modtag} is already synced on the release commit; skipping the tag push."
          else
            git tag "${modtag}" "${target}"
            git push origin "refs/tags/${modtag}"
          fi
      - name: verify the family module resolves through the go proxy
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          PKG="${{ matrix.package }}"
          MODPATH="github.com/wenathlan/devthink/${PKG}/v2"
          resolved=false
          for attempt in 1 2 3 4 5; do
            info="$(curl -sSf --max-time 60 "https://proxy.golang.org/${MODPATH}/@v/v${VERSION}.info" 2>/dev/null || true)"
            if printf '%s' "$info" | grep -q "\"Version\":\"v${VERSION}\""; then
              resolved=true
              echo "The go module ${MODPATH}@v${VERSION} resolves through the proxy chain."
              break
            fi
            echo "The proxy resolve attempt ${attempt} of the ${PKG} module failed; the bounded retry policy retries inside five attempts (the proxy fetches the repository on the first request)."
            sleep "$((attempt * 10))"
          done
          test "$resolved" = true
      - name: retain and checksum the family module the proxy serves
        # the public naming law (the family asset naming gate): every leg
        # attaches under its own dotted grammar - <app>.goget.<version> -
        # beside the checksum umbrella over the set, the same discipline
        # the family gradle lane carries for its module set.
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          PKG="${{ matrix.package }}"
          MODPATH="github.com/wenathlan/devthink/${PKG}/v2"
          # the final-form honesty check: the .mod file the proxy serves
          # is the go.mod marker the tagged tree carries (the module
          # directive the checksum database signs).
          curl -sSf -o "${PKG}.goget.${VERSION}.mod" "https://proxy.golang.org/${MODPATH}/@v/v${VERSION}.mod"
          if ! diff <(grep -E '^(module|go) ' "${PKG}/go.mod") <(grep -E '^(module|go) ' "${PKG}.goget.${VERSION}.mod"); then
            echo "The go.mod the proxy serves does not match the module marker of the tagged tree." >&2
            exit 1
          fi
          curl -sSf -o "${PKG}.goget.${VERSION}.zip" "https://proxy.golang.org/${MODPATH}/@v/v${VERSION}.zip"
          sha256sum "${PKG}.goget.${VERSION}."* > "${PKG}.sha256.goget.${VERSION}"
          test -s "${PKG}.sha256.goget.${VERSION}"
          # the family asset naming gate: no underscore ever rides a
          # published asset (the three names the leg attaches answer the
          # check, never the whole repository root).
          ! printf '%s\n' \
            "${PKG}.goget.${VERSION}.zip" \
            "${PKG}.goget.${VERSION}.mod" \
            "${PKG}.sha256.goget.${VERSION}" | grep -q "_"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-family-goget-${{ matrix.package }}-${{ steps.release.outputs.version }}
          path: |
            ${{ matrix.package }}.goget.${{ steps.release.outputs.version }}.zip
            ${{ matrix.package }}.goget.${{ steps.release.outputs.version }}.mod
            ${{ matrix.package }}.sha256.goget.${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag),
        # and --clobber keeps the re-run idempotent over its own names,
        # which carry the application prefix and never collide with
        # another lane's grammar.
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.package }}.goget.${VERSION}.zip" \
            "${{ matrix.package }}.goget.${VERSION}.mod" \
            "${{ matrix.package }}.sha256.goget.${VERSION}" --clobber

