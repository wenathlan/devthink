    - name: Build the wheel and the sdist
      run: cd ${{ matrix.package }} && python3 -m pip install --user --quiet "build==1.2.2.post1" && python3 -m build
    - name: Check PyPI token availability
      id: token
      shell: bash
      # the graceful-skip gate (the family contract, Regra 54:
      # PYPI_API_TOKEN is OPTIONAL - a repository without the secret skips
      # the publication with a notice instead of hard-failing the release
      # pipeline). The token is only ever touched through env, never an
      # `if:` condition (Regra 56).
      env:
        RAW_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        set -euo pipefail
        token="${RAW_PYPI_TOKEN//$'\r'/}"
        token="${token//$'\n'/}"
        if [[ -z "$token" ]]; then
          echo "available=false" >> "$GITHUB_OUTPUT"
        else
          printf 'PYPI_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Skip notice when PYPI_API_TOKEN is not configured
      if: steps.token.outputs.available != 'true'
      run: echo "::notice::Secret PYPI_API_TOKEN is not configured; the pypi.org publication of wenathlan-${{ matrix.package }} is skipped with this warning. Add the secret in Settings > Secrets and variables > Actions and re-run this workflow to ship the python envelope to PyPI."
    - name: Publish the python envelope when the token answers
      if: steps.token.outputs.available == 'true'
      shell: bash
      # the username/password pair rides the __token__ law pypi.org
      # answers, the password only through env (Regra 56). PyPI carries no
      # clean pre-deploy existence check (the simple index the API exposes
      # has no per-version HEAD the lane could probe without auth), so the
      # owner-token gate is the honest dedupe the lane carries.
      env:
        RELEASE_VERSION: ${{ steps.release.outputs.version }}
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ env.PYPI_TOKEN }}
      run: |
        set -euo pipefail
        python3 -m pip install --user --quiet "twine==6.1.0"
        cd "${{ matrix.package }}"
        python3 -m twine upload --repository pypi --non-interactive --verbose dist/*
    - name: Attach the python artifacts to the release
      # the artifacts attach unconditionally - they are evidence even when
      # the publication skipped for the missing token
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: v${{ steps.release.outputs.version }}
      run: |
        set -euo pipefail
        cd ${{ matrix.package }}
        assets=""
        for f in dist/wenathlan_${{ matrix.package }}-*.whl dist/wenathlan_${{ matrix.package }}-*.tar.gz; do
          test -f "$f" && assets="$assets $f"
        done
        test -n "$assets" || { echo "no python artifacts found to attach" >&2; exit 1; }
        # shellcheck disable=SC2086
        gh release upload "$RELEASE_TAG" $assets --repo "$GITHUB_REPOSITORY" --clobber

  detect-cargo:
    name: detect the cargo crate sources
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the publish
    # lane. Only a successful completion whose triggering event was the
    # version-bump push or the maintenance ladder dispatch proceeds.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      present: ${{ steps.cargo.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: cargo
        shell: bash
        run: |
          if test -f devthink/Cargo.toml; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  cargo:
    name: Publish devthink to crates.io (the rust version envelope)
    needs: [release-resolve, detect-cargo, release-approval]
    if: needs.detect-cargo.outputs.present == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Set up the rust toolchain
        # the house pin the desktop-tauri lane rides - the version envelope
        # crate compiles under the same stable toolchain the desktop build stamps
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Stamp the release version into the crate manifest
        # the manifest ships the lockstep static version, the lane stamps the
        # release version - the same sed law the python and gem lanes ride
        run: cd devthink && sed -i.bak "s/^version = \"[^\"]*\"/version = \"${{ steps.release.outputs.version }}\"/" Cargo.toml && rm -f Cargo.toml.bak
      - name: Package the version envelope crate
        # --no-verify because the envelope carrier declares no test target -
        # the crate is the version constant the registry lanes reference, the
        # argan.java precedent in rust; --allow-dirty because the version
        # stamp above leaves the checkout one sed away from clean
        run: cd devthink && cargo package --no-verify --allow-dirty
      - name: Check the crates.io token availability
        # the graceful-skip gate (the family contract, Regra 54:
        # CARGO_REGISTRY_TOKEN is OPTIONAL - a repository without the secret
        # skips the publication with a notice instead of hard-failing the
        # release pipeline). The token is only ever touched through env,
        # never an `if:` condition (Regra 56).
        id: token
        shell: bash
        env:
          RAW_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          token="${RAW_CARGO_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          if [[ -z "$token" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            printf 'CARGO_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip notice when CARGO_REGISTRY_TOKEN is not configured
        if: steps.token.outputs.available != 'true'
        run: echo "::notice::Secret CARGO_REGISTRY_TOKEN is not configured; the crates.io publication of wenathlan-devthink is skipped with this warning. Add the secret in Settings > Secrets and variables > Actions and re-run this workflow to ship the rust envelope."
      - name: Publish the crate when the token answers
        # crates.io answers the token through the --token flag once, the
        # publish is idempotent per version (a re-run of an already-published
        # version fails the lane honestly - the registry rejects the
        # duplicate, the same honest answer the npm lanes give their 409s).
        # the token rides the GITHUB_ENV export from the gate step (the
        # gitlab lane law), so the shell reads CARGO_TOKEN directly
        if: steps.token.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          cargo publish --token "${CARGO_TOKEN}" --no-verify --allow-dirty
      - name: Attach the crate artifact to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          test -f target/package/wenathlan-devthink-*.crate
          # shellcheck disable=SC2086
          gh release upload "$RELEASE_TAG" target/package/wenathlan-devthink-*.crate --repo "$GITHUB_REPOSITORY" --clobber

