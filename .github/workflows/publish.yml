          npm pack ./distpackage --pack-destination release >/dev/null
          tarball="./release/wenathlan-devthink-${RELEASE_VERSION}.tgz"
          test -f "${tarball}"
          tar -tzf "${tarball}" | grep -F "package/index.cjs"
          tar -tzf "${tarball}" | grep -F "package/checksums.txt"
          echo "the github registry tarball packs the built flat distribution:"
          npm pkg get name --prefix distpackage || true
      - name: detect existing github package version
        id: availability
        shell: bash
        run: |
          package_name="@${GITHUB_REPOSITORY_OWNER}/devthink"
          if npm view "${package_name}@${{ steps.release.outputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
