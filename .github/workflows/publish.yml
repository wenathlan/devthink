      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.0
    - name: Resolve release version
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        CHECKOUT_TAG: "true"
        RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
      run: |
        set -euo pipefail
        tag="${RELEASE_TAG:-}"
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
        fi
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
          exit 1
        fi
        version="${tag#v}"
        git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
        if [[ "$CHECKOUT_TAG" == "true" ]]; then
          git checkout --detach "$tag"
        fi
        package_version=$(node -p "require('./devthink/package.json').version")
        if [[ "$package_version" != "$version" ]]; then
          echo "Release tag ${tag} does not match package version ${package_version}" >&2
          exit 1
        fi
        {
          echo "tag=$tag"
          echo "version=$version"
        } >> "$GITHUB_OUTPUT"
    - name: Stamp the release version into the python envelope
      # the pyproject ships the lockstep static version, the lane stamps
      # the release version before every build - the same sed law the gem
      # lanes ride
      run: cd devthink && python3 -c "import re,sys; p=open('pyproject.toml').read(); p=re.sub(r'version = \"[^\"]+\"', 'version = \"'+sys.argv[1]+'\"', p, count=1); open('pyproject.toml','w').write(p)" "${{ steps.release.outputs.version }}"
    - name: Build the wheel and the sdist
      run: cd devthink && python3 -m pip install --user --quiet "build==1.2.2.post1" && python3 -m build
    - name: Check PyPI token availability
      id: token
      shell: bash
      # the graceful-skip gate (the family contract, Regra 54:
      # PYPI_API_TOKEN is OPTIONAL - a repository without the secret skips
      # the publication with a notice instead of hard-failing the release
      # pipeline). The token is only ever touched through env, never an
      # `if:` condition (Regra 56).
      env:
        RAW_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        set -euo pipefail
        token="${RAW_PYPI_TOKEN//$'\r'/}"
        token="${token//$'\n'/}"
        if [[ -z "$token" ]]; then
          echo "available=false" >> "$GITHUB_OUTPUT"
        else
          printf 'PYPI_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Skip notice when PYPI_API_TOKEN is not configured
      if: steps.token.outputs.available != 'true'
      run: echo "::notice::Secret PYPI_API_TOKEN is not configured; the pypi.org publication of wenathlan-devthink is skipped with this warning. Add the secret in Settings > Secrets and variables > Actions and re-run this workflow to ship the python envelope to PyPI."
    - name: Publish the python envelope when the token answers
      if: steps.token.outputs.available == 'true'
      shell: bash
      # the username/password pair rides the __token__ law pypi.org
      # answers, the password only through env (Regra 56). PyPI carries no
      # clean pre-deploy existence check (the simple index the API exposes
      # has no per-version HEAD the lane could probe without auth), so the
      # owner-token gate is the honest dedupe the lane carries.
      env:
        RELEASE_VERSION: ${{ steps.release.outputs.version }}
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ env.PYPI_TOKEN }}
      run: |
        set -euo pipefail
        python3 -m pip install --user --quiet "twine==6.1.0"
        cd devthink
        python3 -m twine upload --repository pypi --non-interactive --verbose dist/*
    - name: Attach the python artifacts to the release
      # the artifacts attach unconditionally - they are evidence even when
      # the publication skipped for the missing token
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: v${{ steps.release.outputs.version }}
      run: |
        set -euo pipefail
        cd devthink
        assets=""
        for f in dist/wenathlan_devthink-*.whl dist/wenathlan_devthink-*.tar.gz; do
          test -f "$f" && assets="$assets $f"
        done
        test -n "$assets" || { echo "no python artifacts found to attach" >&2; exit 1; }
        # shellcheck disable=SC2086
        gh release upload "$RELEASE_TAG" $assets --repo "$GITHUB_REPOSITORY" --clobber
