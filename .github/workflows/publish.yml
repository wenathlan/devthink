          } >> "$GITHUB_OUTPUT"
      - name: Download the release asset and derive the sha256
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "wenathlan-${{ matrix.package }}-${RELEASE_TAG#v}.tgz" --dir /tmp/asset
          # the checksum derives from the real downloaded asset on the runner (the
          # #540 law: never from a constant, never hardcoded in the workflow)
          ASSET_SHA256="$(sha256sum "/tmp/asset/wenathlan-${{ matrix.package }}-${RELEASE_TAG#v}.tgz" | awk '{print $1}')"
          test "${#ASSET_SHA256}" -eq 64
          echo "ASSET_SHA256=${ASSET_SHA256}" >> "$GITHUB_ENV"
          echo "the ${{ matrix.package }} formula checksum answers ${ASSET_SHA256}"
      - name: Stamp the formula from the template
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ASSET_SHA256: ${{ env.ASSET_SHA256 }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          sha256="${ASSET_SHA256}"
          url="https://github.com/wenathlan/devthink/releases/download/v${version}/wenathlan-${{ matrix.package }}-${version}.tgz"
          sed -i.bak -e "s|url \"https://github.com/wenathlan/devthink/releases/download/[^\"]*\"|url \"${url}\"|" -e "s/^  version \"[^\"]*\"/  version \"${version}\"/" -e "s/^  sha256 \"[0-9a-f]\\{64\\}\"/  sha256 \"${sha256}\"/" ${{ matrix.package }}/homebrew.rb
          rm -f ${{ matrix.package }}/homebrew.rb.bak
          grep -q "sha256 \"${sha256}\"" ${{ matrix.package }}/homebrew.rb
          grep -q "version \"${version}\"" ${{ matrix.package }}/homebrew.rb
      # the graceful-skip gate (the family contract, Regra 54:
      # HOMEBREW_GITHUB_TOKEN is OPTIONAL - a repository without the
      # secret skips the tap push with a notice instead of hard-failing
      # the release pipeline). The token is only ever touched through
      # env, never an `if:` condition (Regra 56).
      - name: Check the homebrew token availability
        id: token
        shell: bash
        env:
          RAW_BREW_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="${RAW_BREW_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          if [[ -z "$token" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            printf 'BREW_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip notice when HOMEBREW_GITHUB_TOKEN is not configured
        if: steps.token.outputs.available != 'true'
        run: echo "::notice::Secret HOMEBREW_GITHUB_TOKEN is not configured; the homebrew tap push of wenathlan-${{ matrix.package }} is skipped with this warning. Add the secret (a fine-grained token with Contents read/write on wenathlan/homebrew-devthink) in Settings > Secrets and variables > Actions and re-run this workflow to tap the formula."
      # the tap repo wenathlan/homebrew-devthink owns the Formula/ folder
      # homebrew searches (the tap naming law: brew tap wenathlan/devthink
      # answers https://github.com/wenathlan/homebrew-devthink); the commit
      # rides the iakadion identity the family law stamps; the quiet-diff
      # guard keeps re-runs idempotent (an unchanged formula never pushes
      # twice).
      - name: Push the stamped formula to the tap when the token answers
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BREW_TOKEN: ${{ env.BREW_TOKEN }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          git clone --depth=1 "https://x-access-token:${BREW_TOKEN}@github.com/wenathlan/homebrew-devthink.git" "$workdir/tap"
          mkdir -p "$workdir/tap/Formula"
          cp ${{ matrix.package }}/homebrew.rb "$workdir/tap/Formula/wenathlan-${{ matrix.package }}.rb"
          cd "$workdir/tap"
          git config user.name "iakadion"
          git config user.email "iakadion@users.noreply.github.com"
          git add Formula/wenathlan-${{ matrix.package }}.rb
          if git diff --cached --quiet; then
            echo "the tap formula already answers v${RELEASE_VERSION} - nothing to push"
          else
            git commit -m "wenathlan-${{ matrix.package }} ${RELEASE_VERSION}"
            git push origin main
          fi

  detect-gradle:
    name: detect Gradle source
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the publish
    # lane. Only a successful completion whose triggering event was the
    # version-bump push or the maintenance ladder dispatch (the two events
    # the release workflow really runs on) proceeds; the publish job below
    # cascades off this one.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    # the resolve/existence lane stays bounded (the family contract: every
    # resolve-shaped job carries its own ceiling).
    timeout-minutes: 15
    outputs:
      present: ${{ steps.gradle.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: gradle
        shell: bash
        run: |
          if test -f devthink/build.gradle.kts; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  gradle:
    name: publish the single gradle distribution
    needs: [release-resolve, detect-gradle, release-approval]
    if: needs.detect-gradle.outputs.present == 'true'
    runs-on: ubuntu-latest
    # the extension release-gate doctrine (the 2.0.18 port, the approval
    # gate repair): every registry publish answers through the explicit
    # release-approval gate job this lane needs - the one review the owner
    # grants for the whole publish wave.
    timeout-minutes: 20
    # least-privilege: the job's own writes (the e2ugh job-permission
    # doctrine): packages write pushes the registry distribution, contents
    # write attaches it to the release assets below.
    permissions:
      contents: write
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: install locked dependencies
        run: cd devthink && bun install --frozen-lockfile --ignore-scripts
      - name: assemble the rich dist set the module embeds
        run: cd devthink && node build.ts
      - name: setup java
        # the java line the maven lane carries (the family runtime
        # doctrine, Regra 54/125): the gradle rung rides the same temurin
        # 26 interpreter the mvn legs resolve with - the module reads the
        # credentials from the env, so no settings handoff rides beside it.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '26'
          distribution: temurin
      - name: install the pinned gradle distribution
        # the pinned distribution line (the family runtime doctrine, Regra
        # 54/125: never a floating `gradle` alias): the house already runs
        # the 9.5.1 line the mobile wrapper resolved (the saddle android
        # compatibility rung - the 9.7.1 wrapper red the mobile leg against
        # the plugin line), so the gradle registry lane rides the same
        # distribution - downloaded from services.gradle.org with the
        # official checksum verified, never a cached alias, and the bin
        # folder rides the GITHUB_PATH so every step below answers
        # `gradle` the way the maven legs answer `mvn`.
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.5.1"
          curl -sSfL -o "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -sSfL -o "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip.sha256" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip.sha256"
          expected="$(tr -d '[:space:]' < "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip.sha256")"
          actual="$(sha256sum "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" | awk '{print $1}')"
          if [[ "$expected" != "$actual" ]]; then
            echo "The gradle ${GRADLE_VERSION} distribution checksum does not match; the pinned toolchain refuses the download." >&2
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon --version >/dev/null
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: pack the single distribution with the classifier zips attached
        # the maven lane mold (package before deploy): publishToMavenLocal
        # stages the module the lane then uploads - the module metadata
        # (.module), the pom, the jar and both classifier zips land in the
        # local repository under the com.wenathlan coordinates the gradle
        # rung owns, so the retain and the existence check read the same
        # final-form files the registry serves.
        run: |
          set -euo pipefail
          cd devthink
          VERSION="${{ steps.release.outputs.version }}"
          gradle --no-daemon -PreleaseVersion="${VERSION}" publishToMavenLocal
          # the single jar embeds every consumption mode and the publication attaches both classifier zips
          test -f "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}.jar"
          test -f "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}.module"
          test -f "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}.pom"
          test -f "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}-extension.zip"
          test -f "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}-declarations.zip"
      - name: publish the single gradle distribution
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd devthink
          VERSION="${{ steps.release.outputs.version }}"
          PUBLISH="https://maven.pkg.github.com/wenathlan/devthink"
          # the module metadata is the gradle rung's own artifact: the
          # existence check curls the .module file the gradle consumer
          # resolves, so a re-run over an already published rung skips the
          # re-upload instead of reddening on the registry's immutable
          # version refusal.
          if curl -s -f -H "Authorization: Bearer $GITHUB_TOKEN" -o /dev/null "$PUBLISH/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}.module"; then
            echo "The single gradle distribution devthink-${VERSION} is already published; skipping the re-upload."
          else
            published=false
            for attempt in 1 2 3; do
              if gradle --no-daemon --stacktrace -PreleaseVersion="${VERSION}" publish; then published=true; break; fi
              echo "The gradle publish attempt ${attempt} of the single distribution failed; the bounded retry policy retries inside three attempts."
              sleep "$((attempt * 5))"
            done
            test "$published" = true
          fi
      - name: retain the single distribution module, pom, jar and the classifier zips
        # the public naming law (the family asset naming gate): the gradle
        # lane attaches under its own dotted grammar - devthink.gradle.<version>
        # - so the maven lane's devthink-<version> assets never collide and
        # the SHA256SUMS umbrella never flips between two lanes' bytes.
        run: |
          set -euo pipefail
          cd devthink
          VERSION="${{ steps.release.outputs.version }}"
          stage="gradlerelease"
          mkdir -p "$stage"
          cp "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}.pom" "${stage}/devthink.gradle.${VERSION}.pom"
          cp "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}.module" "${stage}/devthink.gradle.${VERSION}.module"
          cp "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}.jar" "${stage}/devthink.gradle.${VERSION}.jar"
          cp "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}-extension.zip" "${stage}/devthink.gradle.${VERSION}.extension.zip"
          cp "$HOME/.m2/repository/com/wenathlan/devthink/${VERSION}/devthink-${VERSION}-declarations.zip" "${stage}/devthink.gradle.${VERSION}.declarations.zip"
          # the checksum umbrella over the gradle set the lane attaches -
          # the same checksum discipline every asset family carries, and
          # never over itself (the SHA256SUMS umbrella law).
          sha256sum "${stage}"/devthink.gradle."${VERSION}".* | sed "s#${stage}/##" > "${stage}/sha256.gradle.${VERSION}"
          test -s "${stage}/sha256.gradle.${VERSION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gradle-${{ steps.release.outputs.version }}
          path: devthink/gradlerelease/*
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        # the audit gap fix mold (the SBOM/SHA256SUMS umbrella lost the
        # registry channel coverage when the lanes moved out of release.yml):
        # the registry publish lane also attaches the artifacts it publishes
        # to the GitHub release (the asset-lane attach mold of
        # container/desktop); --clobber keeps the re-run idempotent
        # (Regra 39).
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" devthink/gradlerelease/* --clobber

  family-gradle:
    needs: [release-resolve, release-approval]
    # the family gradle lane: every application envelope publishes its own
    # com.wenathlan.<app> module (the nine documentation envelopes carry
    # the README, the documentation set, the zero-build site and the tests
    # directory as jar resources; the saddle engine envelope compiles its
    # Saddle.java adapter into the one real jar of the family) into the
    # same GitHub Packages maven registry the single gradle distribution
    # uses - under the com.wenathlan coordinates the family maven lane
    # owns too, the one coordinate family the owner law stamps for every
    # lane - with the module metadata (the .module file the gradle
    # consumer resolves) beside the pom and the jar, the existence
    # pre-check, the bounded retry, the checksum umbrella and the release
    # asset attachment the asset families carry (the family container
    # archive lane mold: every leg answers its own dotted asset set with
    # its checksum).
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # the canonical family pass order the maven family lane carries
        # (the distfamily law): the saddle engine module joins the nine
        # documentation modules - its coordinates answer the com.wenathlan
        # group and the devthink registry this lane deploys, so the one
        # existence path and the one bounded retry serve every leg alike.
        package: [argan, cadria, cobaia, debonair, forge, foundry, getry, saddle, stealthhead, vault]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup java
        # the java line the maven family lane carries: the gradle family
        # legs ride the same temurin 26 interpreter the mvn family legs
        # resolve with.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '26'
          distribution: temurin
      - name: install the pinned gradle distribution
        # the pinned 9.5.1 line the single gradle lane carries: every
        # family leg downloads the same checksum-verified distribution the
        # application lane resolves, so the gradle rung answers one line
        # across the whole family.
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.5.1"
          curl -sSfL -o "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -sSfL -o "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip.sha256" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip.sha256"
          expected="$(tr -d '[:space:]' < "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip.sha256")"
          actual="$(sha256sum "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" | awk '{print $1}')"
          if [[ "$expected" != "$actual" ]]; then
            echo "The gradle ${GRADLE_VERSION} distribution checksum does not match; the pinned toolchain refuses the download." >&2
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon --version >/dev/null
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: pack the family envelope module
        # the maven family lane mold (package before deploy): the leg
        # stages the module in the local repository and asserts the
        # module metadata, the pom and the jar the retain step copies.
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          cd "${{ matrix.package }}"
          gradle --no-daemon -PreleaseVersion="${VERSION}" publishToMavenLocal
          test -f "$HOME/.m2/repository/com/wenathlan/${{ matrix.package }}/${VERSION}/${{ matrix.package }}-${VERSION}.jar"
          test -f "$HOME/.m2/repository/com/wenathlan/${{ matrix.package }}/${VERSION}/${{ matrix.package }}-${VERSION}.module"
          test -f "$HOME/.m2/repository/com/wenathlan/${{ matrix.package }}/${VERSION}/${{ matrix.package }}-${VERSION}.pom"
      - name: publish the family envelope when absent
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          PKG="${{ matrix.package }}"
          cd "${PKG}"
          PUBLISH="https://maven.pkg.github.com/wenathlan/devthink"
          if curl -s -f -H "Authorization: Bearer $GITHUB_TOKEN" -o /dev/null "$PUBLISH/com/wenathlan/${PKG}/${VERSION}/${PKG}-${VERSION}.module"; then
            echo "The family gradle distribution ${PKG}-${VERSION} is already published; skipping the re-upload."
          else
            published=false
            for attempt in 1 2 3; do
              if gradle --no-daemon --stacktrace -PreleaseVersion="${VERSION}" publish; then published=true; break; fi
              echo "The gradle publish attempt ${attempt} of the ${PKG} envelope failed; the bounded retry policy retries inside three attempts."
              sleep "$((attempt * 5))"
            done
            test "$published" = true
          fi
      - name: retain and checksum the family envelope module
        # the public naming law (the family asset naming gate): every leg
        # attaches under its own dotted grammar - <app>.gradle.<version> -
        # beside the checksum umbrella over the set, the same discipline
        # the family container archive lane carries for its tar.gz.
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          PKG="${{ matrix.package }}"
          repo="$HOME/.m2/repository/com/wenathlan/${PKG}/${VERSION}"
          cp "${repo}/${PKG}-${VERSION}.pom" "${PKG}.gradle.${VERSION}.pom"
          cp "${repo}/${PKG}-${VERSION}.module" "${PKG}.gradle.${VERSION}.module"
          cp "${repo}/${PKG}-${VERSION}.jar" "${PKG}.gradle.${VERSION}.jar"
          sha256sum "${PKG}.gradle.${VERSION}."* > "${PKG}.sha256.gradle.${VERSION}"
          test -s "${PKG}.sha256.gradle.${VERSION}"
          # the family asset naming gate: no underscore ever rides a
          # published asset (the four names the leg attaches answer the
          # check, never the whole repository root).
          ! printf '%s\n' \
            "${PKG}.gradle.${VERSION}.pom" \
            "${PKG}.gradle.${VERSION}.module" \
            "${PKG}.gradle.${VERSION}.jar" \
            "${PKG}.sha256.gradle.${VERSION}" | grep -q "_"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-family-gradle-${{ matrix.package }}-${{ steps.release.outputs.version }}
          path: |
            ${{ matrix.package }}.gradle.${{ steps.release.outputs.version }}.pom
            ${{ matrix.package }}.gradle.${{ steps.release.outputs.version }}.module
            ${{ matrix.package }}.gradle.${{ steps.release.outputs.version }}.jar
            ${{ matrix.package }}.sha256.gradle.${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag),
        # and --clobber keeps the re-run idempotent over its own names,
        # which carry the application prefix and never collide with
        # another lane's grammar.
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.package }}.gradle.${VERSION}.pom" \
            "${{ matrix.package }}.gradle.${VERSION}.module" \
            "${{ matrix.package }}.gradle.${VERSION}.jar" \
            "${{ matrix.package }}.sha256.gradle.${VERSION}" --clobber

  detect-goget:
    name: detect Go module source
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the publish
    # lane. Only a successful completion whose triggering event was the
    # version-bump push or the maintenance ladder dispatch (the two events
    # the release workflow really runs on) proceeds; the publish job below
    # cascades off this one.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    # the resolve/existence lane stays bounded (the family contract: every
    # resolve-shaped job carries its own ceiling).
    timeout-minutes: 15
    outputs:
      present: ${{ steps.goget.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: goget
        shell: bash
        run: |
          if test -f devthink/go.mod; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  goget:
    name: publish the single go module distribution
    needs: [release-resolve, detect-goget, release-approval]
    if: needs.detect-goget.outputs.present == 'true'
    runs-on: ubuntu-latest
    # the extension release-gate doctrine (the 2.0.18 port, the approval
    # gate repair): every registry publish answers through the explicit
    # release-approval gate job this lane needs - the one review the owner
    # grants for the whole publish wave.
    timeout-minutes: 20
    # least-privilege: the job's own writes (the e2ugh job-permission
    # doctrine): contents write pushes the per-module tag the go get rung
    # resolves and attaches the module set to the release assets below -
    # the go module registry IS the repository tag set the proxy chain
    # serves, so no packages write rides beside it the way the maven and
    # gradle rungs carry theirs.
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup go
        # the pinned interpreter line the family runtime doctrine, Regra
        # 54/125 carries: the go legs ride the 1.27 line at its current
        # patch release the way the java legs ride temurin 26 and the node
        # legs ride 26.13.0 - never a floating `go` alias, and the
        # dependency cache stays off because the module envelopes the wave
        # ships declare no go.sum at all.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: verify the go module builds clean
        # the module validity gate: the go.mod marker and the doc carrier
        # the goget wave stamped must answer the real toolchain - the
        # module identity, the gofmt discipline, the vet pass and the
        # build itself - before the lane ever tags the registry entry.
        run: |
          set -euo pipefail
          cd devthink
          # the module identity the lane owns: the go.mod marker declares
          # the github.com/wenathlan/devthink/devthink/v2 path the
          # per-module tag below serves.
          test "$(go list -m)" = "github.com/wenathlan/devthink/devthink/v2"
          # the format law: the doc carrier the module ships answers
          # gofmt exactly (an empty listing is the pass).
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
      - name: sync the go module tag the proxy chain resolves
        # the go get registry entry: a go module resolves from the
        # repository itself through the proxy.golang.org chain when the
        # per-module tag (devthink/vX.Y.Z) points at the release commit -
        # the lane pushes the tag the same release ladder pushes the
        # version tag, an existing tag on the same commit answers the
        # idempotent skip, and a tag on a foreign commit reddens honestly
        # (the go checksum database pins the module bytes per version - a
        # re-tag would serve different content for the same semver).
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          modtag="devthink/v${VERSION}"
          target="$(git rev-parse "v${VERSION}^{commit}")"
          if git ls-remote --tags origin "refs/tags/${modtag}" | grep -q "refs/tags/${modtag}"; then
            git fetch --force --tags origin "refs/tags/${modtag}:refs/tags/${modtag}"
            if [[ "$(git rev-parse "${modtag}^{commit}")" != "$target" ]]; then
              echo "The go module tag ${modtag} already exists on a different commit; the go module registry is immutable and the lane refuses the re-tag." >&2
              exit 1
            fi
            echo "The go module tag ${modtag} is already synced on the release commit; skipping the tag push."
          else
            git tag "${modtag}" "${target}"
            git push origin "refs/tags/${modtag}"
          fi
      - name: verify the module resolves through the go proxy
        # the tag-sync verification: proxy.golang.org fetches the module
        # from the repository on the first request, so the bounded retry
        # (the same policy the registry lanes carry) walks the cold fetch
        # until the .info record answers the version the lane tagged.
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          MODPATH="github.com/wenathlan/devthink/devthink/v2"
          resolved=false
          for attempt in 1 2 3 4 5; do
            info="$(curl -sSf --max-time 60 "https://proxy.golang.org/${MODPATH}/@v/v${VERSION}.info" 2>/dev/null || true)"
            if printf '%s' "$info" | grep -q "\"Version\":\"v${VERSION}\""; then
              resolved=true
              echo "The go module ${MODPATH}@v${VERSION} resolves through the proxy chain."
              break
            fi
            echo "The proxy resolve attempt ${attempt} of the single module failed; the bounded retry policy retries inside five attempts (the proxy fetches the repository on the first request)."
            sleep "$((attempt * 10))"
          done
          test "$resolved" = true
      - name: retain the module zip and the go.mod the proxy serves
        # the public naming law (the family asset naming gate): the goget
        # lane attaches under its own dotted grammar - devthink.goget.<version>
        # - so the gradle lane's devthink.gradle.<version> assets never
        # collide and the SHA256SUMS umbrella never flips between two
        # lanes' bytes.
        run: |
          set -euo pipefail
          cd devthink
          VERSION="${{ steps.release.outputs.version }}"
          MODPATH="github.com/wenathlan/devthink/devthink/v2"
          stage="gogetrelease"
          mkdir -p "$stage"
          # the final-form honesty check: the .mod file the proxy serves
          # is the go.mod marker the tagged tree carries (the module
          # directive the checksum database signs) - the lane retains the
          # same final-form files the registry serves, the maven lane mold
          # over the ~/.m2 set.
          curl -sSf -o "${stage}/devthink.goget.${VERSION}.mod" "https://proxy.golang.org/${MODPATH}/@v/v${VERSION}.mod"
          if ! diff <(grep -E '^(module|go) ' go.mod) <(grep -E '^(module|go) ' "${stage}/devthink.goget.${VERSION}.mod"); then
            echo "The go.mod the proxy serves does not match the module marker of the tagged tree." >&2
            exit 1
          fi
          curl -sSf -o "${stage}/devthink.goget.${VERSION}.zip" "https://proxy.golang.org/${MODPATH}/@v/v${VERSION}.zip"
          # the checksum umbrella over the goget set the lane attaches -
          # the same checksum discipline every asset family carries, and
          # never over itself (the SHA256SUMS umbrella law).
          sha256sum "${stage}"/devthink.goget."${VERSION}".* | sed "s#${stage}/##" > "${stage}/sha256.goget.${VERSION}"
          test -s "${stage}/sha256.goget.${VERSION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-goget-${{ steps.release.outputs.version }}
          path: devthink/gogetrelease/*
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        # the audit gap fix mold (the registry channel coverage law): the
        # go module lane attaches the artifacts the proxy serves to the
        # GitHub release beside the module tag it pushed (the asset-lane
        # attach mold of container/desktop); --clobber keeps the re-run
        # idempotent (Regra 39).
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$RELEASE_TAG" devthink/gogetrelease/* --clobber

  family-goget:
    needs: [release-resolve, release-approval]
    # the family go get lane: every application envelope rides the go
    # module rung beside the maven, nuget, rubygems and gradle rungs -
    # each leg verifies its module against the pinned go toolchain, syncs
    # the per-module tag (<app>/vX.Y.Z on the release commit, the registry
    # entry the proxy chain resolves), verifies the module resolves
    # through proxy.golang.org and attaches the module zip and the go.mod
    # the proxy serves beside the checksum umbrella (the family container
    # archive lane mold: every leg answers its own dotted asset set with
    # its checksum). The saddle engine envelope keeps its go.mod at the
    # app root beside the gradle and pom markers - the module owns the
    # whole saddle envelope - while its one go package (the doc carrier
    # the doc.go file declares) rides the documentation support seat at
    # saddle/docs, because the app root carries the C engine sources
    # (virtualhardware.c beside the virtualization core and the gpu
    # monitor companions) the go package law refuses inside a package
    # directory and the flat layout law keeps the app root to the sol
    # interface and the support seats - so every leg walks the same
    # uniform path the ten siblings walk.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # the canonical family pass order the maven family lane carries
        # (the distfamily law): the saddle engine module joins the nine
        # documentation modules - its per-module tag answers the
        # github.com/wenathlan/devthink coordinates this lane serves, so
        # the one tag-sync path and the one bounded retry serve every leg
        # alike.
        package: [argan, cadria, cobaia, debonair, forge, foundry, getry, saddle, stealthhead, vault]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
