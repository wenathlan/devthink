    # gem from the folder gemspec (the envelope version the metadata
    # lockstep stamps rides the <APP>_VERSION environment the lane
    # resolves from the matrix leg) and pushes to the GitHub Packages
    # RubyGems registry behind the same pre-deploy existence check, the
    # same credential handoff and the same bounded retry the application
    # lane above carries.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [argan, cadria, cobaia, debonair, forge, foundry, getry, saddle, stealthhead, vault]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "versionarg=$(echo '${{ matrix.package }}' | tr '[:lower:]' '[:upper:]')_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: setup ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # the pinned interpreter the application lane carries (the
          # family runtime doctrine, Regra 54/125): the gemspec envelopes
          # declare required_ruby_version >= 3.1, so the pin rides the
          # supported 3.4 line at its current patch release.
          ruby-version: 3.4.10
      - name: configure github credentials
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.gem"
          printf '%s\n' '---' ":github: Bearer ${GITHUB_TOKEN}" > "${HOME}/.gem/credentials"
          chmod 600 "${HOME}/.gem/credentials"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pre-deploy existence check
        # the idempotent publish: a gem version is immutable content, so a
        # re-run over an already pushed envelope skips the push instead of
        # reddening the lane on the registry's rejection.
        id: exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          PKG="${{ matrix.package }}"
          if curl -s -f -H "Authorization: Bearer $GITHUB_TOKEN" -o /dev/null "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/download/${PKG}/${PKG}-${RELEASE_VERSION}.gem"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: build the family gem
        if: steps.exists.outputs.present != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd "${{ matrix.package }}"
          env "${{ steps.release.outputs.versionarg }}=${RELEASE_VERSION}" gem build "${{ matrix.package }}.gemspec"
          test -f "${{ matrix.package }}-${RELEASE_VERSION}.gem"
      - name: publish the family gem
        if: steps.exists.outputs.present != 'true'
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cd "${{ matrix.package }}"
          attempt=0
          published=0
          until [ "$attempt" -ge 3 ]; do
            attempt=$((attempt + 1))
            # the gem name glob stays unquoted on purpose: gem push does not
            # expand patterns itself, and the quoted form the first real
            # publish run carried handed the literal `stealthhead-*.gem` to the
            # push command, which answered Gem::Package::FormatError on the
            # file it could not open. The shell expands the pattern here the
            # same way the application gem lane expands its devthink-*.gem.
            if pushlog="$(gem push ${{ matrix.package }}-*.gem --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}" 2>&1)"; then
              echo "$pushlog"
              published=1
              break
            fi
            echo "$pushlog"
            # a gem version is immutable content: when the registry answers
            # that the envelope is already there (the overlapping publish
            # windows of the family can resolve the same release version),
            # the lane stays green — the content the release promises is
            # present on the registry.
            if echo "$pushlog" | grep -q "has already been pushed"; then
              echo "::notice::the registry already carries ${{ matrix.package }} ${{ steps.release.outputs.version }}; the immutable envelope is present."
              published=1
              break
            fi
            echo "gem push attempt ${attempt}/3 failed; retrying with backoff."
            sleep "$((attempt * 5))"
          done
          if [ "$published" -ne 1 ]; then
            echo "::error::gem push failed after ${attempt} attempts."
            exit 1
          fi

  pypi:
    name: Publish devthink to PyPI (the python documentation envelope)
    needs: [release-resolve, release-approval]
    # the pypi channel lane (the PR12 tri-channel law: eleven distribution
    # channels, the pypi seat rides beside npmjs, maven, nuget, rubygems,
    # gradle, goget and the container lanes) - the python documentation
    # envelope ships the same file set the gem face packs, stamped with the
    # release version and built with the stock runner python (no unpinned
    # setup action: the house pinning law demands full-sha pins and no
    # house pin exists for setup-python, so the lane rides the preinstalled
    # interpreter the ubuntu runner carries).
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out the verified tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.RELEASE_TAG }}
