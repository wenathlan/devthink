            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./${{ matrix.package }}/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match the ${{ matrix.package }} envelope version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup go
        # the pinned 1.27.3 line the single goget lane carries: every
        # family leg answers the same interpreter the application lane
        # resolves, so the go rung answers one line across the whole
        # family.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: verify the family go module builds clean
        run: |
          set -euo pipefail
          PKG="${{ matrix.package }}"
          cd "$PKG"
          MODPATH="github.com/wenathlan/devthink/${PKG}/v2"
          test "$(go list -m)" = "$MODPATH"
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
      - name: sync the family go module tag the proxy chain resolves
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          PKG="${{ matrix.package }}"
          modtag="${PKG}/v${VERSION}"
          target="$(git rev-parse "v${VERSION}^{commit}")"
          if git ls-remote --tags origin "refs/tags/${modtag}" | grep -q "refs/tags/${modtag}"; then
            git fetch --force --tags origin "refs/tags/${modtag}:refs/tags/${modtag}"
