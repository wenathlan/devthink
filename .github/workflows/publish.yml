          # the runner stage is the explicit target: the single-binary
          # stages of the same file stay behind their own --target
          target: runtime
          load: true
          platforms: linux/amd64
          tags: devthink:scan-${{ steps.release.outputs.version }}
          build-args: |
            DEVTHINK_VERSION=${{ steps.release.outputs.version }}
            DEVTHINK_REVISION=${{ steps.release.outputs.revision }}
          # the build cache embeds inside the workflow run (the owner
          # directive, refined in 2.0.20): the buildkit session cache of
          # THIS run is created, used and discarded with it — the native
          # stages deduplicate across the architecture legs of the same
          # build and nothing crosses runs (the cross-run gha cache proved
          # fragile: the service evicts blobs and leaves orphan references
          # the next build reads as not-found), and nothing is published
          # beside the product image.
      - name: scan container image
        if: steps.published.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devthink:scan-${{ steps.release.outputs.version }}
