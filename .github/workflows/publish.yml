  homebrew:
    name: Tap the devthink formula to homebrew (the brew channel)
    needs: [release-resolve, release-approval]
    # the homebrew channel lane (the PR12 tri-channel law: eleven
    # distribution channels, the brew seat rides the tap repo the lane
    # pushes) - the formula template every app root carries gets its
    # version, url and sha256 stamped from the real release asset on the
    # runner (the #540 law: every checksum is born on the runner from the
    # real downloaded release assets, never from a constant), then the
    # lane pushes it to the wenathlan/homebrew-devthink tap.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ needs.release-resolve.outputs.tag || github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Download the release asset and derive the sha256
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "wenathlan-devthink-${RELEASE_TAG#v}.tgz" --dir /tmp/asset
          # the checksum derives from the real downloaded asset on the runner (the
          # #540 law: never from a constant, never hardcoded in the workflow)
          ASSET_SHA256="$(sha256sum "/tmp/asset/wenathlan-devthink-${RELEASE_TAG#v}.tgz" | awk '{print $1}')"
          test "${#ASSET_SHA256}" -eq 64
          echo "ASSET_SHA256=${ASSET_SHA256}" >> "$GITHUB_ENV"
          echo "the devthink formula checksum answers ${ASSET_SHA256}"
      - name: Stamp the formula from the template
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ASSET_SHA256: ${{ env.ASSET_SHA256 }}
        run: |
          set -euo pipefail
          cd devthink
          version="${RELEASE_VERSION}"
          sha256="${ASSET_SHA256}"
          url="https://github.com/wenathlan/devthink/releases/download/v${version}/wenathlan-devthink-${version}.tgz"
          sed -i.bak -e "s|url \"https://github.com/wenathlan/devthink/releases/download/[^\"]*\"|url \"${url}\"|" -e "s/^  version \"[^\"]*\"/  version \"${version}\"/" -e "s/^  sha256 \"[0-9a-f]\\{64\\}\"/  sha256 \"${sha256}\"/" homebrew.rb
          rm -f homebrew.rb.bak
          grep -q "sha256 \"${sha256}\"" homebrew.rb
          grep -q "version \"${version}\"" homebrew.rb
      # the graceful-skip gate (the family contract, Regra 54:
      # HOMEBREW_GITHUB_TOKEN is OPTIONAL - a repository without the
      # secret skips the tap push with a notice instead of hard-failing
      # the release pipeline). The token is only ever touched through
      # env, never an `if:` condition (Regra 56).
      - name: Check the homebrew token availability
        id: token
        shell: bash
        env:
          RAW_BREW_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="${RAW_BREW_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          if [[ -z "$token" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            printf 'BREW_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip notice when HOMEBREW_GITHUB_TOKEN is not configured
        if: steps.token.outputs.available != 'true'
        run: echo "::notice::Secret HOMEBREW_GITHUB_TOKEN is not configured; the homebrew tap push of wenathlan-devthink is skipped with this warning. Add the secret (a fine-grained token with Contents read/write on wenathlan/homebrew-devthink) in Settings > Secrets and variables > Actions and re-run this workflow to tap the formula."
      # the tap repo wenathlan/homebrew-devthink owns the Formula/ folder
      # homebrew searches (the tap naming law: brew tap wenathlan/devthink
      # answers https://github.com/wenathlan/homebrew-devthink); the commit
      # rides the iakadion identity the family law stamps; the quiet-diff
      # guard keeps re-runs idempotent (an unchanged formula never pushes
      # twice).
      - name: Push the stamped formula to the tap when the token answers
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BREW_TOKEN: ${{ env.BREW_TOKEN }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          git clone --depth=1 "https://x-access-token:${BREW_TOKEN}@github.com/wenathlan/homebrew-devthink.git" "$workdir/tap"
          mkdir -p "$workdir/tap/Formula"
          cp devthink/homebrew.rb "$workdir/tap/Formula/wenathlan-devthink.rb"
          cd "$workdir/tap"
          git config user.name "iakadion"
          git config user.email "iakadion@users.noreply.github.com"
          git add Formula/wenathlan-devthink.rb
          if git diff --cached --quiet; then
            echo "the tap formula already answers v${RELEASE_VERSION} - nothing to push"
          else
            git commit -m "wenathlan-devthink ${RELEASE_VERSION}"
            git push origin main
          fi

