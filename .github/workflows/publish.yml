      - name: derive ios version values
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "DEVTHINK_VERSION=$version" >> "$GITHUB_ENV"
          echo "DEVTHINK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: archive ios app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project devthink/ios/App/App.xcodeproj -scheme App -configuration Release -archivePath "$RUNNER_TEMP/DevThink.xcarchive" archive MARKETING_VERSION="$DEVTHINK_VERSION" CURRENT_PROJECT_VERSION="$DEVTHINK_VERSION_CODE"

      - name: export ipa
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DevThink.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/DevThinkExportOptions.plist" -exportPath "$RUNNER_TEMP/DevThinkExport"

      - name: collect ios artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd devthink
          version="${{ steps.release.outputs.version }}"
          mkdir -p build/mobile/ipa
          ipa="$(find "$RUNNER_TEMP/DevThinkExport" -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          cp "$ipa" "build/mobile/ipa/devthink.ios.${version}.ipa"
          app="$(find "$RUNNER_TEMP/DevThink.xcarchive/Products/Applications" -type d -name '*.app' -print -quit)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/mobile/ipa/devthink.ios.${version}.app.zip"
          shasum -a 256 "build/mobile/ipa/devthink.ios.${version}.ipa" "build/mobile/ipa/devthink.ios.${version}.app.zip" | sed 's#build/mobile/ipa/##' > "build/mobile/ipa/sha256.iosipa.${version}"
          printf '{\n  "version": "%s",\n  "platform": "ios",\n  "signing": "caller-configured",\n  "appId": "%s",\n  "files": ["devthink.ios.%s.ipa", "devthink.ios.%s.app.zip"]\n}\n' "$version" "$(node -p "JSON.parse(require('node:fs').readFileSync('./capacitor.config.json','utf8')).appId")" "$version" "$version" > "build/mobile/ipa/manifest.iosipa.${version}.json"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: devthink.iosipa.${{ steps.release.outputs.version }}
          path: devthink/build/mobile/ipa
          if-no-files-found: error
      - name: attach iOS ipa assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/mobile/ipa/* --clobber

  container:
    name: container release archive
    # the lane builds the tar.gz release archive from THE Dockerfile (the
    # one container file of the repository): the default runtime target -
    # the multi stage build whose builder validated the whole chain and
    # whose smoke boot proved every surface - saved as the portable
    # archive an operator loads with `docker load` beside the registry
    # image the publishghcr lane pushes.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the build.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          # the automatic workflow_run path resolves the latest release and
          # detaches the working tree onto its tag (the publishghcr
          # resolver mold), so the archive always builds the tagged source.
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries its
          # own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: build container
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.releaseversion.outputs.version }}
        run: |
          archive="devthink.container.${{ steps.releaseversion.outputs.version }}.tar.gz"
          docker build \
            --target runtime \
            --build-arg DEVTHINK_VERSION="${{ steps.releaseversion.outputs.version }}" \
            --build-arg DEVTHINK_REVISION="${{ steps.releaseversion.outputs.revision }}" \
            --tag "$IMAGE" devthink
          docker save "$IMAGE" | gzip -9 > "$archive"
      - name: checksum and manifest
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          archive="devthink.container.${version}.tar.gz"
          checksums="sha256.container.${version}"
          manifest="manifest.container.${version}.json"
          sha256sum "$archive" > "$checksums"
          printf '{\n  "version": "%s",\n  "platform": "container",\n  "image": "ghcr.io/%s:%s",\n  "archive": "%s",\n  "signing": "caller-owned"\n}\n' "$version" "${{ github.repository }}" "$version" "$archive" > "$manifest"
          ! find . -maxdepth 1 -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .
      - name: upload workflow artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: devthink.container.${{ steps.releaseversion.outputs.version }}
          path: |
            devthink.container.${{ steps.releaseversion.outputs.version }}.tar.gz
            sha256.container.${{ steps.releaseversion.outputs.version }}
            manifest.container.${{ steps.releaseversion.outputs.version }}.json
          if-no-files-found: error
      - name: attach release assets
        # the automatic workflow_run path attaches the same assets the
        # release event does (the resolver's tag output carries the tag)
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "devthink.container.${{ steps.releaseversion.outputs.version }}.tar.gz" "sha256.container.${{ steps.releaseversion.outputs.version }}" "manifest.container.${{ steps.releaseversion.outputs.version }}.json" --clobber

  package:
    name: package the browser extension
    # the extension lane of the merged repository: the interface files live
    # flat at the web root (the 2.0.12 flat merge dissolved the interface
    # folder - the manifest the
    # lane gates on is web/manifest.json, never a root
    # manifest.json), and the archive the lane ships is the reproducible
    # dist/devthink<version>.zip the build engine (tests/build.mjs)
    # assembles from that tree - the same artifact the pack verification
    # (tests/packageextension.mjs) and the artifact manifest consume, so no
    # second packaging path exists.
    #
    # releases the lane releases carry version tags; a failed or foreign
    # workflow_run completion (the release run red before its assets
    # existed) never reaches the packaging.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.11.1

      - name: setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3

      # the reality gate: the flat interface files answer at the
      # web root (the dead folder gate of the
      # pre-restoration lane never runs again - the lane always builds).
      - name: gate the merged extension surface
        shell: bash
        run: |
          set -euo pipefail
          test -f devthink/manifest.json
          node -p "JSON.parse(require('fs').readFileSync('devthink/manifest.json','utf8')).version" > /dev/null

      - name: install dependencies
        shell: bash
        run: cd devthink && bun install --frozen-lockfile

      # the build engine: one deterministic pass assembles every artifact
      # from the merged tree (the library bundles, the extension surface
      # with its manifest and icon family, the static site, the flat
      # distpackage staging and the version stamped
      # dist/devthink<version>.zip) with the internal budgets, naming and
      # manifest checks as gates - the pack lane builds what the engine
      # ships, never a second packaging recipe.
      - name: build the extension archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          bun run build
          test -f "dist/devthink${RELEASE_VERSION}.zip"

      # the pack verification (the retired pack:check composite answer for
      # the merged layout): the reproducible archive answers with every
      # required artifact, the packaged manifest matches the package
      # stamp, the icon family and the page bundles ship complete.
      - name: verify the packaged extension
        shell: bash
        run: cd devthink && node tests/packageextension.mjs

      - name: collect release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p build/release-assets/extension
          cp "dist/devthink${RELEASE_VERSION}.zip" "build/release-assets/extension/devthink.extension.${RELEASE_VERSION}.zip"
          checksums="sha256.extension.${RELEASE_VERSION}"
          manifest="manifest.extension.${RELEASE_VERSION}.json"
          sha256sum "build/release-assets/extension/devthink.extension.${RELEASE_VERSION}.zip" | sed 's#build/release-assets/extension/##' > "build/release-assets/extension/${checksums}"
          printf '{\n  "version": "%s",\n  "platform": "extension",\n  "archive": "devthink.extension.%s.zip",\n  "manifest": "devthink/manifest.json",\n  "signing": "caller-owned"\n}\n' "$RELEASE_VERSION" "$RELEASE_VERSION" > "build/release-assets/extension/${manifest}"
          ! find build/release-assets/extension -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .

      - name: upload workflow artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: devthink.extension.${{ steps.releaseversion.outputs.version }}
          path: devthink/build/release-assets/extension
          if-no-files-found: error

      - name: attach release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" devthink/build/release-assets/extension/* --clobber

  target-plans:
    # releases the ladder cuts carry version tags; any other workflow_run
    # completion (a failed or foreign run) never reaches the matrix.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    name: Plan ${{ matrix.target }} ${{ matrix.format }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the channels field carries the publishing channels the plan
        # filters the artifact manifest onto: every artifact attaches to
        # the github release, the browser formats ride their store
        # channels, the container image rides the container channel and
        # the single distribution tarball rides the registry channels.
        include:
          - { target: application, format: tarball, channels: "github" }
          - { target: computer, format: singlefile, channels: "github" }
          - { target: desktopapp, format: appimage, channels: "github" }
          - { target: desktopapp, format: deb, channels: "github" }
          - { target: desktopapp, format: rpm, channels: "github" }
          - { target: desktopapp, format: snap, channels: "github" }
          - { target: desktopapp, format: flatpak, channels: "github" }
          - { target: desktopapp, format: dmg, channels: "github" }
          - { target: desktopapp, format: pkg, channels: "github" }
          - { target: desktopapp, format: exe, channels: "github" }
          - { target: desktopapp, format: msi, channels: "github" }
          - { target: desktopapp, format: msix, channels: "github" }
          - { target: android, format: apk, channels: "github" }
          - { target: android, format: aab, channels: "github" }
          - { target: ios, format: ipa, channels: "github" }
          - { target: cli, format: singlefile, channels: "github,npmjs,githubpackages" }
          - { target: binary, format: sea, channels: "github" }
          - { target: binary, format: wasm, channels: "github" }
          - { target: browser, format: pwa, channels: "github,site" }
          - { target: extension, format: crx, channels: "github,chromium" }
          - { target: extension, format: xpi, channels: "github,firefox" }
          - { target: extension, format: safariextz, channels: "github,safari" }
          - { target: web, format: pwa, channels: "github,site" }
          - { target: libreoffice, format: oxt, channels: "github" }
          - { target: mcp, format: stdio, channels: "github,npmjs,githubpackages,maven,nuget" }
          - { target: vsix, format: vsix, channels: "github,vscode" }
          - { target: container, format: oci, channels: "github,container" }
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this target is selected
        id: selected
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.target || 'all' }}"
          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.target }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve release version
        # the release-version resolver, inlined per the one-workflow-file
        # standard (the family pattern): the tag must match the package
        # version of the commit it points at, and the lane checks out the
        # tagged tree before it builds.
        if: steps.selected.outputs.enabled == 'true' && github.event_name == 'release'
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CHECKOUT_TAG: "true"
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Bun
        if: steps.selected.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - name: Set up Node
        if: steps.selected.outputs.enabled == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: devthink/.nvmrc
      - name: Install root dependencies
        if: steps.selected.outputs.enabled == 'true'
        run: cd devthink && bun install --frozen-lockfile
      - name: Build the release set the plans derive from
        if: steps.selected.outputs.enabled == 'true'
        run: cd devthink && node tests/build.mjs
      - name: Write DevThink target plan
        if: steps.selected.outputs.enabled == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FORMAT: ${{ matrix.format }}
          CHANNELS: ${{ matrix.channels }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag || github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          cd devthink
          mkdir -p build/targets
          # the commit the plan derives from: the resolved tag commit on
          # the release path, the checked out head otherwise.
          SOURCE_SHA="$(git rev-parse HEAD)"
          TARGET="$TARGET" FORMAT="$FORMAT" CHANNELS="$CHANNELS" RELEASE_TAG="$RELEASE_TAG" SOURCE_SHA="$SOURCE_SHA" node <<'PLAN'
          const fs = require("node:fs");
          const target = process.env.TARGET;
          const format = process.env.FORMAT;
          const releaseTag = process.env.RELEASE_TAG ?? "";
          const sourceSha = process.env.SOURCE_SHA ?? "";
          const channels = (process.env.CHANNELS ?? "github").split(",").map(entry => entry.trim()).filter(entry => entry !== "");
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const manifest = JSON.parse(fs.readFileSync("dist/artifactmanifest.json", "utf8"));
          (async () => {
            const pack = await import("./dist/pack.js");
            /* the channel resolution of the release channel resolver: a
               version stamped release asset answers under its release name
               (the dist/ prefix the build stamps strips away), a plain
               bundle keeps the npm channels the manifest records, and the
               default github answer of an unrecognized name never hides the
               manifest channels of the bundle it names. */
            const resolve = entry => {
              const releasechannels = pack.artifactchannelof(entry.name.replace(/^dist\//, ""), version);
              if (releasechannels.length === 1 && releasechannels[0] === "github" && entry.channels.length > 1) return entry.channels;
              return releasechannels;
            };
            let selected = manifest.artifacts
              .filter(entry => resolve(entry).some(channel => channels.includes(channel)))
              .map(entry => ({ name: entry.name, channels: resolve(entry), primary: resolve(entry).some(channel => channel !== "github" && channels.includes(channel)) }));
            /* every release asset attaches to the github release, so the
               github channel matches them all; the primary flag ranks the
               artifacts that ride the target's own channel first. */
            selected.sort((a, b) => Number(b.primary) - Number(a.primary));
            /* a target whose channel the built set does not carry yet (the
               container tarball the release lanes attach, the mobile wrappers
               the mobile lane generates) falls back to the single distribution
               artifact — the one product every lane consumes. */
            if (selected.length === 0) {
              const distribution = manifest.artifacts.find(entry => entry.name === `dist/devthink${version}.zip`);
              if (distribution === undefined) throw new Error("The built set carries no distribution artifact to plan against.");
              const distributionchannels = resolve(distribution);
              selected = [{ name: distribution.name, channels: distributionchannels, primary: distributionchannels.some(channel => channel !== "github" && channels.includes(channel)) }];
            }
            const plan = {
              product: "DevThink",
              target,
              format,
              version,
              source: sourceSha,
              releaseTag,
              status: "planned",
              channels,
              artifacts: selected
            };
            fs.writeFileSync(`build/targets/${target}-${format}.json`, JSON.stringify(plan, null, 2) + "\n");
            console.log(`planned ${target} ${format} at ${version} over ${selected.length} artifacts riding ${channels.join(", ")}`);
          })().catch(error => { console.error(error); process.exit(1); });
          PLAN
      - name: Upload target plan
        if: steps.selected.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: devthink-${{ matrix.target }}-${{ matrix.format }}-plan
          path: devthink/build/targets/${{ matrix.target }}-${{ matrix.format }}.json
          if-no-files-found: error

  digest:
    name: Pin the published container digest as release assets
    # the extension digest lane doctrine (the 2.0.18 port): the immutable
    # coordinate an operator pins is the image DIGEST, not the moving tag -
    # the lane records the digest the ghcr lane published as release assets
    # (the .digest pin, the human-readable reference and the json record)
    # so the release carries the exact image the registry answers for the
    # version beside the tag and the latest alias.
    needs: ghcr
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # least-privilege: the job's own write (the e2ugh job-permission
    # doctrine) - the packages read the registry login below carries (the
    # digest lane reads the private package the ghcr lane published).
    permissions:
      contents: write
      packages: read
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: setup buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: login ghcr
        # the digest lane reads the private package the ghcr lane
        # published: the anonymous token the registry answers a private
        # package with is the 401 that killed the 2.0.28 pin (the lane
        # the 2.0.18 port carried had never run behind a green ghcr
        # before), so the inspect rides the job token's packages read
        # the same login action the ghcr lane itself carries.
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./devthink/package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: record the published image digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: |
          set -euo pipefail
          version="${{ steps.releaseversion.outputs.version }}"
          image_ref="${image}:${version}"
          digest="$(docker buildx imagetools inspect "${image_ref}" --format '{{.Manifest.Digest}}')"
          case "${digest}" in
            sha256:*) ;;
            *) echo "the registry answered an unexpected digest shape: ${digest}" >&2; exit 1 ;;
          esac
          printf '%s\n' "${digest}" > devthink-container.digest
          printf '%s@%s\n' "${image_ref}" "${digest}" > devthink-container.txt
          printf '{\n  "version": "%s",\n  "image": "%s",\n  "digest": "%s"\n}\n' "$version" "${image}" "${digest}" > devthink-container.json
          cat devthink-container.txt
          gh release upload "${RELEASE_TAG}" devthink-container.digest devthink-container.txt devthink-container.json --clobber

  # ---------------------------------------------------------------------
  # THE SADDLE BLOCK (the consolidation pass, saddle always last): the
  # saddle lanes the standalone workflow files carried ride as the closing
  # application lanes of this file - the extension package, the target
  # plans and the dispatch-only vhe registry lane - because the saddle
  # surface is the heaviest pass of the house (the docker builds). Every
  # lane reads the saddle application folder, stamps the version the
  # saddle manifest declares (the saddle-v* tags the standalone board cut
  # are retired - the deleted tag pattern never answers a resolver again)
  # and attaches its assets to the same family release the lanes above
  # carry.

  saddle-extension:
    name: package the saddle engine extension
    # the saddle engine extension lane of the standalone board, folded in:
    # the engine surface stays saddle-specific, so the lane reads the
    # saddle application folder and attaches the zip to the family release
    # the lanes above carry. The version answers the saddle manifest (the
    # deleted saddle-v* tag resolver never runs again).
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: resolve the saddle version and the family release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          # detach onto the tagged source the lanes above build from, then
          # read the version the saddle manifest of that source declares.
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "$tag"
          version="$(node -p "require('./saddle/package.json').version")"
          test -n "$version"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.11.1

      - name: install dependencies
        run: npm --prefix saddle ci
      - name: run full deterministic gates
        run: npm --prefix saddle run check && npm --prefix saddle run formatcheck && npm --prefix saddle test
      - name: package dry-run
        run: npm --prefix saddle run pack:check

      - name: generate extension icons
        # the 2.1.0 restructure: the extension assets live flat at the web
        # root (manifest.json + iconNN.png - the browser.ts
        # extensionassets entries), regenerated from the single icon source.
        shell: bash
        working-directory: saddle
        run: |
          npx --yes @tauri-apps/cli@2.11.4 icon icon.svg --output build/generated-icons
          cp build/generated-icons/32x32.png icon32.png
          cp build/generated-icons/64x64.png icon64.png
          cp build/generated-icons/128x128.png icon128.png

      - name: build extension
        working-directory: saddle
        run: npm run build:engine && node dist/browser.js --version "${{ steps.release.outputs.version }}" --output build/extension

      - name: create zip
        working-directory: saddle/build/extension
        run: zip -qr "../../saddle.extension.${{ steps.release.outputs.version }}.zip" .

      - name: upload workflow artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: saddle.extension.${{ steps.release.outputs.version }}
          path: saddle/saddle.extension.${{ steps.release.outputs.version }}.zip
          if-no-files-found: error

      - name: attach release asset
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "saddle/saddle.extension.${{ steps.release.outputs.version }}.zip" --clobber

  saddle-target-plans:
    name: Saddle plan ${{ matrix.target }} ${{ matrix.format }}
    # the saddle target-plans lane of the standalone board, folded in: the
    # packager targetcli is the saddle motor surface, so the lane reads the
    # saddle application folder and writes every target plan the matrix
    # declares. The plans ride the workflow artifacts (the same shape the
    # devthink target-plans lane above uploads).
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: application, format: tarball }
          - { target: computer, format: singlefile }
          - { target: desktopapp, format: appimage }
          - { target: desktopapp, format: deb }
          - { target: desktopapp, format: rpm }
          - { target: desktopapp, format: snap }
          - { target: desktopapp, format: flatpak }
          - { target: desktopapp, format: dmg }
          - { target: desktopapp, format: pkg }
          - { target: desktopapp, format: exe }
          - { target: desktopapp, format: msi }
          - { target: desktopapp, format: msix }
          - { target: android, format: apk }
          - { target: android, format: aab }
          - { target: ios, format: ipa }
          - { target: cli, format: singlefile }
          - { target: binary, format: sea }
          - { target: binary, format: wasm }
          - { target: browser, format: pwa }
          - { target: extension, format: crx }
          - { target: extension, format: xpi }
          - { target: extension, format: safariextz }
          - { target: web, format: pwa }
          - { target: libreoffice, format: oxt }
          - { target: mcp, format: stdio }
          - { target: vsix, format: vsix }
          - { target: container, format: oci }
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - name: resolve the saddle version and the family release tag
        if: github.event_name == 'release'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="$(node -p "require('./saddle/package.json').version")"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "$tag"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: install
        run: npm --prefix saddle ci
      - name: build engine
        run: npm --prefix saddle run build:engine
      - name: write target plan
        working-directory: saddle
        run: node dist/packager/targetcli.js "${{ matrix.target }}" "${{ matrix.format }}" build/targets
      - name: upload target plan
        uses: actions/upload-artifact@v7.0.2
        with:
          name: saddle-${{ matrix.target }}-${{ matrix.format }}-plan
          path: saddle/build/targets/${{ matrix.target }}-${{ matrix.format }}.json

  saddle-vhe-validate:
    name: Validate saddle vhe image (${{ matrix.profile }}, ${{ matrix.platform }})
    # the saddle vhe validation lane of the standalone board, folded in
    # dispatch-only: the deep validation it carries (the multi-architecture
    # firecracker matrix and the saddle docker contexts) awaits its
    # per-application adaptation pass, so a release- or push-shaped firing
    # of the publish wave never reaches it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 240 min: a cold-cache emulated leg (QEMU ppc64le/s390x building
    # mesa from source) is measured past the old 90-minute ceiling. The
    # warm registry cache keeps the legs far under this; the ceiling only
    # matters on cold-cache rebuilds after Dockerfile/lockfile churn.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 3 profiles x 4 architectures = 12 validation legs; every profile
        # is built and probed on every architecture the registry ships.
        platform: [linux/amd64, linux/arm64, linux/ppc64le, linux/s390x]
        profile: [max, balanced, lite]
        include:
          - profile: max
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Resolve arch slug
        id: slug
        run: echo "slug=$(echo '${{ matrix.platform }}' | cut -d/ -f2)" >> "$GITHUB_OUTPUT"

      - name: Resolve the mesa tarball digest (GitHub-computed)
        id: mesa
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The mesa-cache release carries the mirrored upstream tarball and
          # GitHub computes the sha256 digest of every release asset at
          # upload time. Resolving it at build time keeps every source file
          # free of hardcoded hashes (the gateway family policy): the digest
          # is generated by GitHub's own computers and consumed here, never
          # written into the repository sources.
          mesa_version=$(sed -n 's/^ARG MESA_VERSION="\([0-9.]*\)"$/\1/p' saddle/Dockerfile | head -n1)
          test -n "${mesa_version}"
          tarball="mesa-${mesa_version}.tar.xz"
          release="mesa-cache-${mesa_version}"
          digest="$(gh api "repos/${GH_REPO}/releases/tags/${release}" --jq ".assets[] | select(.name == \"${tarball}\") | .digest" 2>/dev/null || true)"
          case "${digest}" in
            sha256:*) sha="${digest#sha256:}" ;;
            *) sha="" ;;
          esac
          if [ -z "${sha}" ] || [ "${#sha}" -ne 64 ]; then
            # legacy asset without a GitHub-computed digest: the checksum
            # is computed on this GitHub runner (still GitHub computers,
            # the value never enters the repository)
            gh release download "${release}" --repo "${GH_REPO}" --pattern "${tarball}" --output "/tmp/${tarball}"
            sha="$(sha256sum "/tmp/${tarball}" | awk '{print $1}')"
            rm -f "/tmp/${tarball}"
          fi
          test "${#sha}" -eq 64
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "mesa ${tarball}: ${sha} (resolved at build time)"

      - name: Set up QEMU (arm64, ppc64le and s390x user-mode emulation)
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/arm64,linux/ppc64le,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR (registry cache)
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (dry run, loaded locally)
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./saddle
          file: ./saddle/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: saddle-vhe-validate:${{ steps.slug.outputs.slug }}-${{ matrix.profile }}
          build-args: |
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
            MESA_SHA256=${{ steps.mesa.outputs.sha256 }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max

      - name: Validate spoofed CPU and memory (per-profile identity)
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          PROFILE: ${{ matrix.profile }}
          PLATFORM: ${{ matrix.platform }}
          EXPECTCPU: ${{ matrix.expectcpu }}
          PROFILERAM: ${{ matrix.profileram }}
        run: |
          set -euo pipefail
          image="saddle-vhe-validate:${SLUG}-${PROFILE}"
          run_contract() {
            docker run --rm --platform "${PLATFORM}" \
              --memory-swap=-1 --shm-size=2g "$image" "$@"
          }
          echo "--- Spoofed /proc/cpuinfo (expects ${EXPECTCPU} for the ${PROFILE} profile) ---"
          cpuinfo="$(run_contract bash -lc 'grep -m1 "model name" /proc/cpuinfo')"
          echo "$cpuinfo"
          if ! grep -q "${EXPECTCPU}" <<< "$cpuinfo"; then
            echo "::error::/proc/cpuinfo does not report the spoofed ${EXPECTCPU} processor; the CPU spoof layer is not active for the ${PROFILE} profile."
            exit 1
          fi
          expected_kb=$(( PROFILERAM * 1024 * 1024 ))
          window_low=$(( expected_kb - expected_kb / 16 ))
          window_high=$(( expected_kb + expected_kb / 16 ))
          echo "--- Spoofed memory report (free -h, expects ~${PROFILERAM} GiB plan) ---"
          run_contract free -h
          memtotal_kb="$(run_contract bash -lc 'grep -m1 "^MemTotal:" /proc/meminfo | tr -dc 0-9')"
          echo "Spoofed MemTotal: ${memtotal_kb} kB (expected window: ${window_low}-${window_high} kB)"
          if [ "$memtotal_kb" -lt "$window_low" ] || [ "$memtotal_kb" -gt "$window_high" ]; then
            echo "::error::Spoofed MemTotal (${memtotal_kb} kB) is outside the expected ${PROFILERAM} GiB window (${window_low}-${window_high} kB); the memory spoof layer is not active for the ${PROFILE} profile."
            exit 1
          fi

      - name: Validate OpenCL platform (clinfo / Rusticl)
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          PROFILE: ${{ matrix.profile }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          image="saddle-vhe-validate:${SLUG}-${PROFILE}"
          echo '--- clinfo: Rusticl on LLVMpipe (OpenCL 3.1) ---'
          docker run --rm --platform "${PLATFORM}" \
            --memory-swap=-1 --shm-size=2g "$image" \
            clinfo | tee clinfo.txt | head -40
          grep -q 'Number of platforms' clinfo.txt
          grep -qiE 'rusticl|OpenCL 3' clinfo.txt

      - name: Validate Vulkan platform (vulkaninfo / Lavapipe)
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          PROFILE: ${{ matrix.profile }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          image="saddle-vhe-validate:${SLUG}-${PROFILE}"
          echo '--- vulkaninfo --summary: Lavapipe (Vulkan 1.4) ---'
          docker run --rm --platform "${PLATFORM}" \
            --memory-swap=-1 --shm-size=2g "$image" \
            vulkaninfo --summary | tee vulkaninfo.txt | head -40
          grep -q 'apiVersion' vulkaninfo.txt
          grep -qiE 'lavapipe|llvmpipe' vulkaninfo.txt

  saddle-vhe-resolve:
    name: Resolve saddle vhe release version
    # the release resolver of the vhe lane, folded in dispatch-only: the
    # version answers the saddle manifest of the checked out source (the
    # deleted saddle-v* tag resolver never runs again), the proceed gate
    # keeps duplicate dispatches no-op, and the mesa digest resolution
    # rides the same GitHub-computed source the validation lane carries.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      proceed: ${{ steps.resolve.outputs.proceed }}
      mesasha256: ${{ steps.mesa.outputs.sha256 }}
    permissions:
      # contents: write is required to keep the SHA256SUMS asset of the
      # mesa-cache release in place (the GitHub-generated digest of the
      # mirrored tarball, published as a release asset so local builds
      # verify too). The tag and release mutations themselves live in
      # the Release workflow.
      contents: write
      # packages: read is required to query the GHCR container package
      # versions list (the pre-deploy existence check). The publish,
      # scan, verify jobs below escalate to packages: write / id-token.
      packages: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node (reproducible version-resolution step)
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.11.1

      - id: resolve
        name: Resolve and verify the saddle release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('saddle/package.json','utf8')).version")
          tag="v${version}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "proceed=false"
          } >> "$GITHUB_OUTPUT"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic release tag such as v1.2.14 is required." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} does not exist." >&2
            exit 1
          fi
          if ! gh api "repos/${GH_REPO}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "No published GitHub release for ${tag}." >&2
            exit 0
          fi
          # Pre-deploy existence check: a duplicate dispatch that escapes
          # the concurrency group would attempt to re-publish the same
          # multi-arch manifest list. The GHCR container registry tolerates
          # re-pushes of the same tag (it overwrites), but a duplicate
          # publish wastes 60+ minutes of QEMU build time and risks racing
          # the in-flight build. Query the container package versions list;
          # if the version is already published, exit 0 (proceed=false) so
          # the duplicate firing no-ops cleanly.
          #
          # Robustness note: gh api writes error JSON to STDOUT (not stderr)
          # on 401/403/404, so `2>/dev/null` alone cannot suppress it. The
          # `|| true` ensures the subshell exits 0, then the case statement
          # validates the captured string is a pure non-negative integer;
          # anything else (error JSON, empty, etc.) is treated as "not
          # published yet" so a transient API failure does not silently
          # skip a publish. The vhe family owns the -vhe prefixed tags of
          # the devthink container package - the bare startswith(${version})
          # saw the node-engine tag and no-opped the vhe publication (the
          # saddle lesson): the match carries the -vhe suffix.
          api_out="$(gh api "/users/${OWNER}/packages/container/devthink/versions" --jq "[.[] | select(.metadata.container.tags[]? | startswith(\"${version}-vhe\"))] | length" 2>/dev/null || true)"
          case "${api_out}" in
            ''|*[!0-9]*) api_out=0 ;;
          esac
          if [ "${api_out}" != "0" ]; then
            echo "GHCR container ${OWNER}/devthink:${version}-vhe is already published; the duplicate dispatch will no-op."
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - id: mesa
        name: Resolve the mesa tarball digest (GitHub-computed)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The mesa-cache release carries the mirrored upstream tarball
          # and GitHub computes the sha256 digest of every release asset
          # at upload time. Resolving it at build time keeps every source
          # file free of hardcoded hashes (the gateway family policy): the
          # digest is generated by GitHub's own computers, handed to the
          # docker builds as the MESA_SHA256 build-arg and published as
          # the SHA256SUMS release asset, never written into the sources.
          mesa_version=$(sed -n 's/^ARG MESA_VERSION="\([0-9.]*\)"$/\1/p' saddle/Dockerfile | head -n1)
          test -n "${mesa_version}"
          tarball="mesa-${mesa_version}.tar.xz"
          release="mesa-cache-${mesa_version}"
          digest="$(gh api "repos/${GH_REPO}/releases/tags/${release}" --jq ".assets[] | select(.name == \"${tarball}\") | .digest" 2>/dev/null || true)"
          case "${digest}" in
            sha256:*) sha="${digest#sha256:}" ;;
            *) sha="" ;;
          esac
          if [ -z "${sha}" ] || [ "${#sha}" -ne 64 ]; then
            # legacy asset without a GitHub-computed digest: the checksum
            # is computed on this GitHub runner (still GitHub computers,
            # the value never enters the repository)
            gh release download "${release}" --repo "${GH_REPO}" --pattern "${tarball}" --output "/tmp/${tarball}"
            sha="$(sha256sum "/tmp/${tarball}" | awk '{print $1}')"
            rm -f "/tmp/${tarball}"
          fi
          test "${#sha}" -eq 64
          # Keep the SHA256SUMS asset of the mesa-cache release in place so
          # local builds (and any build without the build-arg) verify the
          # tarball too: the checksum is GitHub-generated and published as
          # a release asset, never hardcoded in the sources.
          sums_count="$(gh api "repos/${GH_REPO}/releases/tags/${release}" --jq "[.assets[] | select(.name == \"SHA256SUMS\")] | length" 2>/dev/null || true)"
          if [ "${sums_count}" != "1" ]; then
            printf '%s  %s\n' "${sha}" "${tarball}" > SHA256SUMS
            gh release upload "${release}" SHA256SUMS --repo "${GH_REPO}"
            rm -f SHA256SUMS
            echo "SHA256SUMS published to ${release}"
          fi
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "mesa ${tarball}: ${sha} (resolved at build time)"

  saddle-vhe-scan:
    name: Saddle vhe security gate (Trivy on the release image)
    needs: saddle-vhe-resolve
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/arm64,linux/ppc64le,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR (registry cache)
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for the security scan
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./saddle
          file: ./saddle/Dockerfile
          # the scan must cover the image this pipeline publishes: the
          # vhe runtime stage (the same target: runtime the publish legs
          # build). Without it the last stage of the Dockerfile - the
          # node-engine saddle-runtime - would be scanned instead (the
          # publish ghcr workflow owns that image's gate).
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: saddle-vhe-release-scan:${{ needs.saddle-vhe-resolve.outputs.version }}
          build-args: |
            VHE_PROFILE_CPU=epyc9965
            VHE_PROFILE_VCPUS=192
            VHE_PROFILE_THREADS=384
            VHE_PROFILE_RAM_GB=1024
            VHE_PROFILE_GPU=b200
            VHE_PROFILE_GPUS=8
            MESA_SHA256=${{ needs.saddle-vhe-resolve.outputs.mesasha256 }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max

      - name: Scan the release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saddle-vhe-release-scan:${{ needs.saddle-vhe-resolve.outputs.version }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  saddle-vhe-publish:
    name: Publish saddle vhe ${{ matrix.profile }} image to GHCR (4-arch)
    needs: [saddle-vhe-resolve, saddle-vhe-scan]
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 330 min: the four-arch leg builds three architectures under QEMU
    # and mesa compiles from source - the cold-cache publish legs ran past
    # the old 180-minute ceiling and were killed by the timeout. 5.5h
    # stays under the 6h hosted-runner job cap with headroom for mirror
    # races; the warm registry cache completes the legs in ~10-25 min per
    # profile.
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # All three profiles ship all four architectures; each carries a
        # single version tag (max -> :<version>-vhe, balanced/lite carry
        # the profile suffix). One tag per version, no rolling aliases.
        include:
          - profile: max
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: epyc9965
            profilevcpus: 192
            profilethreads: 384
            profileram: 1024
            profilegpu: b200
            profilegpus: 8
            expectcpu: EPYC 9965
          - profile: balanced
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: threadripperpro9995wx
            profilevcpus: 96
            profilethreads: 192
            profileram: 512
            profilegpu: b200
            profilegpus: 2
            expectcpu: 9995WX
          - profile: lite
            platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
            profilecpu: ryzen9950x3d
            profilevcpus: 16
            profilethreads: 32
            profileram: 128
            profilegpu: rtx5090
            profilegpus: 1
            expectcpu: 9950X3D
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.saddle-vhe-resolve.outputs.tag }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/arm64,linux/ppc64le,linux/s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the single version tag
        id: meta
        env:
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          img="${IMAGE,,}"
          ver="${VERSION}"
          suffix="-vhe"
          if [ "${PROFILE}" != "max" ]; then suffix="-vhe-${PROFILE}"; fi
          # ONE tag per version: the vhe family carries the -vhe prefix so
          # the virtual-hardware engine surface and the node-engine surface
          # of the same repository never collide (devthink:2.0.0 is the node
          # engine, devthink:2.0.0-vhe* is the vhe engine). No latest, no
          # major.minor, no rolling alias.
          echo "tag=${img}:${ver}${suffix}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${img}:${ver}${suffix}"

      - name: Build and push the multi-arch image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./saddle
          file: ./saddle/Dockerfile
          target: runtime
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            VHE_PROFILE_CPU=${{ matrix.profilecpu }}
            VHE_PROFILE_VCPUS=${{ matrix.profilevcpus }}
            VHE_PROFILE_THREADS=${{ matrix.profilethreads }}
            VHE_PROFILE_RAM_GB=${{ matrix.profileram }}
            VHE_PROFILE_GPU=${{ matrix.profilegpu }}
            VHE_PROFILE_GPUS=${{ matrix.profilegpus }}
            MESA_SHA256=${{ needs.saddle-vhe-resolve.outputs.mesasha256 }}
          labels: |
            org.opencontainers.image.title=saddle grand-merge vhe (e2ugh virtual hardware engine)
            org.opencontainers.image.description=100 percent software virtual hardware engine (${{ matrix.profile }} profile)
            org.opencontainers.image.version=${{ needs.saddle-vhe-resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max
          provenance: mode=max
          sbom: true

  saddle-vhe-verify:
    name: Verify published saddle vhe image (${{ matrix.profile }})
    needs: [saddle-vhe-resolve, saddle-vhe-publish]
    if: needs.saddle-vhe-resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # the SAME -vhe tag family the publish legs emit (max -> -vhe,
          # balanced -> -vhe-balanced, lite -> -vhe-lite): the bare
          # :<version> tag belongs to the node-engine image of the ghcr
          # lane - inspecting it here would verify the wrong image.
          - profile: max
            suffix: "-vhe"
            expectcpu: EPYC 9965
          - profile: balanced
            suffix: "-vhe-balanced"
            expectcpu: 9995WX
          - profile: lite
            suffix: "-vhe-lite"
            expectcpu: 9950X3D
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect index and smoke test the spoofing layer
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.saddle-vhe-resolve.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          EXPECTCPU: ${{ matrix.expectcpu }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE,,}:${VERSION}${SUFFIX}"
          # Every published profile index must carry the four-arch
          # registry surface: amd64, arm64, ppc64le and s390x.
          echo "inspecting ${image_ref}"
          docker buildx imagetools inspect --raw "${image_ref}" | jq -e '
            [
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ]
            | sort
            | . == ["amd64", "arm64", "ppc64le", "s390x"]
          '
          docker pull --quiet --platform linux/amd64 "${image_ref}"
          actual_version="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "${actual_version}" = "${VERSION}"
          cpuinfo="$(docker run --rm --platform linux/amd64 \
            --memory-swap=-1 --shm-size=2g "${image_ref}" \
            bash -lc 'grep -m1 "model name" /proc/cpuinfo')"
          echo "${cpuinfo}"
          grep -q "${EXPECTCPU}" <<< "${cpuinfo}"
          echo "published ${image_ref} verified: 4-arch index (${PROFILE}), version label ${VERSION}, spoofing layer active (${EXPECTCPU})"

  saddle-vhe-cleanup:
    name: Clean the saddle vhe run caches
    needs: [saddle-vhe-validate]
    # the cache sweeper of the validation lane: the dispatch is the only
    # event the validate legs answer in the consolidated house, so the
    # push-shaped gate the standalone file carried narrows to it.
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete the caches this pipeline created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deleted=0
          while IFS=$'\t' read -r cache_id cache_key; do
            test -n "$cache_id" || continue
            if gh api --method DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" 2>/dev/null; then
              deleted=$((deleted + 1))
              echo "deleted cache id=${cache_id} key=${cache_key}"
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | startswith("buildkit")) | [.id, .key] | @tsv')
          echo "cleanup: deleted ${deleted} buildkit gha caches."

  sums:
    name: Rebuild the release SHA256SUMS umbrella
    # THE CLOSING UMBRELLA OF THE MERGED LANE FILE (the 2.0.16 fix of the
    # broken checksum signature): the rebuild rides the needs chain over
    # every publish and artifact lane of this file, so the SHA256SUMS
    # umbrella answers only after the lanes attached their assets — the
    # 2.0.15 board carried a one-line umbrella because the standalone sums
    # lane fired beside the artifact lanes and summed an asset set the
    # lanes had not attached yet. !cancelled() keeps the rebuild honest
    # over the assets that landed (an idempotent, byte-reproducible
    # snapshot) while a failed or foreign workflow_run completion never
    # reaches the download at all, and releases with no checksummable
    # assets skip cleanly instead of blocking the publish cascade.
    needs:
      - npmjs
      - githubnpm
      - maven
      - nuget
      - rubygems
      - ghcr
      - digest
      - desktop
      - desktop-tauri
      - android
      - ios-simulator
      - ios
      - container
      - package
      - target-plans
      # the saddle block attaches its assets before the umbrella answers:
      # the extension zip rides the release, the target plans ride the
      # workflow artifacts, and the dispatch-only vhe lane attaches
      # nothing (the registry image carries its own digests).
      - saddle-extension
      - saddle-target-plans
    if: >-
      !cancelled() &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: write
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      # the release-version resolver, inlined per the one-workflow-file
      # standard (the family pattern): the tag must match the package
      # version of the commit it points at; the umbrella only reads the
      # release assets, so the lane never detaches the working tree.
      - name: Resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          CHECKOUT_TAG: "false"
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          # the package version equality only answers a DETACHED checkout
          # of the tag: the umbrella sets CHECKOUT_TAG false - it reads the
          # release assets alone and never builds from the tree - so the
          # working tree may already carry the next rung while the release
          # under checksum is the previous one (the first real publish run
          # red here on v2.0.59 against a default branch already stamped
          # 2.0.60). Skipping the comparison keeps the umbrella honest
          # about the assets it downloads.
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            package_version=$(node -p "require('./devthink/package.json').version")
            if [[ "$package_version" != "$version" ]]; then
              echo "Release tag ${tag} does not match package version ${package_version}" >&2
              exit 1
            fi
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Rebuild SHA256SUMS from the current release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          workdir="$(mktemp -d)"
          # a release with no assets yet has nothing to checksum (the
          # publish lanes may still be attaching theirs); skip cleanly
          # instead of failing the lane, which would block the cascade.
          asset_count="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq '.assets | length' 2>/dev/null || echo 0)"
          if [ "${asset_count}" = "0" ]; then
            echo "Release ${tag} carries no assets yet; nothing to checksum."
            exit 0
          fi
          gh release download "${tag}" --dir "${workdir}" --clobber
          # the umbrella never covers itself.
          rm -f "${workdir}/SHA256SUMS.txt"
          shopt -s nullglob
          files=("${workdir}"/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Release ${tag} carries no checksummable assets; nothing to do."
            exit 0
          fi
          (
            cd "${workdir}"
            # snapshot the sorted asset list BEFORE creating the output
            # file, so the freshly created SHA256SUMS.txt never lands in
            # its own glob and the umbrella renders byte identically on
            # every rerun of the same asset set.
            mapfile -d '' -t assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z)
            : > SHA256SUMS.txt
            for asset in "${assets[@]}"; do
              sha256sum "${asset#./}" >> SHA256SUMS.txt
            done
          )
          cp "${workdir}/SHA256SUMS.txt" .
          count="$(wc -l < SHA256SUMS.txt)"
          echo "Release ${tag}: ${count} assets checksummed."
          cat SHA256SUMS.txt
          gh release upload "${tag}" SHA256SUMS.txt --clobber
