          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: setup qemu
        # multi-arch emulation for the non-native architectures of the
        # five-arch index (the family union surface the saddle publish lane
        # established plus the riscv64 leg the 2.0.16 pass adds): amd64,
        # arm64, ppc64le, s390x and riscv64. the explicit platforms list is
        # the family pin — only the emulated legs install their binfmt
        # handlers.
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64
      - name: setup buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
