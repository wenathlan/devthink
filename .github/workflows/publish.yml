          # stage declares plus the smoke-boot loop variables, the apt
          # retry counter and the node slim base layer internals the
          # CIS-DI-0010 heuristic misreads as credential holders (runnerpid
          # and waited are the smoke-boot loop's process id and retry
          # counter and smokebudget is the smoke-boot probe budget the loop
          # counter tracks; apt_update_tries is the mirror-sync retry counter
          # of the family apt pattern every apt RUN of the file carries; the
          # seven node-layer entries - dpkgArch, ARCH, OPENSSL_ARCH, GNUPGHOME,
