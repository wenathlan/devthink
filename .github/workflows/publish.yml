          set -euo pipefail
          test -f web/package.json
          test -f web/vite.config.ts
          test -f web/capacitor.config.ts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - name: build the static workbench
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          test -f web/dist/public/index.html

      - name: derive the mobile identity at the web root
        # the tracked ts config is the one source; the derived json rides beside it.
        shell: bash
        run: |
          set -euo pipefail
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
