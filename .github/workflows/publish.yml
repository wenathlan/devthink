    name: publish the rich NuGet content package
    needs: detect-nuget
    if: needs.detect-nuget.outputs.present == 'true'
    runs-on: ubuntu-latest
    # the extension release-gate doctrine (the 2.0.18 port): every
    # registry publish answers through the release-approval environment
    # the release ladder's own publish jobs gate on.
    environment: release-approval
    timeout-minutes: 20
    # least-privilege: the job's own writes (the e2ugh job-permission
    # doctrine): packages write pushes the registry package, contents write
    # attaches it to the release assets below.
    permissions:
      contents: write
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: install locked dependencies
        run: bun install --frozen-lockfile
      - name: assemble the rich dist set the content package carries
        run: node tests/build.mjs
      - name: setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # the pinned SDK line (the family runtime doctrine, Regra 54/125:
          # never `latest`): the content package targets
          # netstandard2.0;netstandard2.1 (devthink.csproj), which every
          # modern SDK packs; the pin rides the current stable .NET 10
          # servicing SDK (dotnet/sdk releases, verified via the GitHub
          # API) so the pack is deterministic run over run.
          dotnet-version: 10.0.112
      - name: pack the rich content distribution
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          dotnet pack devthink.csproj --configuration Release --output ./nuget -p:PackageVersion="${VERSION}"
          # the content package carries the bundles, the entries, the declarations, the fixtures and the extension zip
          test -f "nuget/devthink.${VERSION}.nupkg"
      - name: publish package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          pushed=false
          for attempt in 1 2 3; do
            if dotnet nuget push "nuget/devthink.${VERSION}.nupkg" --api-key "${{ github.token }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate; then pushed=true; break; fi
            echo "The nuget push attempt ${attempt} failed; the bounded retry policy retries inside three attempts."
            sleep "$((attempt * 5))"
          done
          test "$pushed" = true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-nuget-${{ steps.release.outputs.version }}
          path: nuget/*.nupkg
          if-no-files-found: error
          retention-days: 90
      - name: attach release assets
        # the audit gap fix (the SBOM/SHA256SUMS umbrella lost the nuget
        # channel coverage when the lanes moved out of release.yml): the
        # registry publish lane also attaches the package it publishes to
        # the GitHub release (the asset-lane attach mold of
        # container/desktop); --clobber keeps the re-run idempotent
        # (Regra 39).
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$RELEASE_TAG" "nuget/devthink.${VERSION}.nupkg" --clobber

  rubygems-resolve:
    name: Resolve release version
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the publish
    # lane. Only a successful completion whose triggering event was the
    # version-bump push or the maintenance ladder dispatch (the two events
    # the release workflow really runs on) resolves; the publish job below
    # cascades off the proceed output.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      proceed: ${{ steps.resolve.outputs.proceed }}
    permissions:
      contents: read
      # packages: read is required to query the GitHub Packages RubyGems
      # registry versions list (the pre-deploy existence check). The
      # publish job below escalates to packages: write.
      packages: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # untrusted-input hardening: never interpolate event data
          # (release names, dispatch inputs) into the checkout ref. The
          # default branch is checked out first; the verified version tag
          # (validated against package.json on disk and the git tag list
          # below) is materialized with plain git commands afterwards.
          fetch-depth: 0

      - name: Set up Node (reproducible version-resolution step)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # the repo-declared Node line (the family runtime doctrine,
          # Regra 54: the runtime pin reads the envelope, never a drifting
          # literal): .nvmrc is the single source of truth the other
          # publish lanes already read.
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Resolve and verify the release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # the tag requested by the event (release published or dispatch);
          # treated as UNTRUSTED - only used to pick which tag to verify,
          # never interpolated into a checkout ref or shell command.
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          # when an event names a tag, verify THAT tag matches the on-disk
          # package.json of its commit; otherwise resolve the version from
          # the default-branch metadata (the automatic bump path).
          requested="${REQUESTED_TAG:-}"
          if [ -n "$requested" ]; then
            git fetch --force --tags origin "refs/tags/${requested}:refs/tags/${requested}"
            git checkout --detach "$requested" 2>/dev/null || {
              echo "Tag ${requested} does not exist." >&2; exit 1; }
          fi
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          tag="v${version}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "proceed=false"
          } >> "$GITHUB_OUTPUT"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic release tag such as v1.2.0 is required (package.json version ${version})." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} does not exist; the DevThink Release workflow creates it on version bumps." >&2
            exit 1
          fi
          if [ "$(git rev-parse "${tag}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Tag ${tag} does not point at this source; the release for it already shipped. Skipping."
            exit 0
          fi
          if ! gh api "repos/${GH_REPO}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "No published GitHub release for ${tag}; the DevThink Release run skipped this bump. Skipping."
            exit 0
          fi
          # Pre-deploy existence check: the workflow_run trigger can fire
          # multiple times for the same Release completion, and the
          # git-tag/HEAD equality check above does NOT short-circuit the
          # duplicate-firing case where the tag still points at HEAD. The
          # GitHub Packages RubyGems registry rejects re-uploads with the
          # "Version X.Y.Z of devthink has already been pushed" error. Query
          # the registry versions list; if the version is already published,
          # exit 0 (proceed=false) so the duplicate firing no-ops instead of
          # failing the workflow.
          #
          # Robustness note: gh api writes error JSON to STDOUT (not stderr)
          # on 401/403/404, so `2>/dev/null` alone cannot suppress it. The
          # `|| true` ensures the subshell exits 0, then the case statement
          # validates the captured string is a pure non-negative integer;
          # anything else (error JSON, empty, etc.) is treated as "not
          # published yet" so a transient API failure does not silently
          # skip a publish.
          api_out="$(gh api "/users/${OWNER}/packages/rubygems/devthink/versions" --jq "[.[] | select(.name == \"${version}\")] | length" 2>/dev/null || true)"
          case "${api_out}" in
            ''|*[!0-9]*) api_out=0 ;;
          esac
          if [ "${api_out}" != "0" ]; then
            echo "RubyGems devthink-${version} is already published to GitHub Packages; the duplicate workflow_run firing will no-op."
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  rubygems:
    name: Publish devthink to GitHub Packages (RubyGems)
    needs: rubygems-resolve
    if: needs.rubygems-resolve.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    # the extension release-gate doctrine (the 2.0.18 port): every
    # registry publish answers through the release-approval environment
    # the release ladder's own publish jobs gate on.
    environment: release-approval
    timeout-minutes: 15
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # needs.rubygems-resolve.outputs.tag is v<version> validated against the
          # package.json of the tagged commit - never raw event data.
          ref: ${{ needs.rubygems-resolve.outputs.tag }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # the pinned interpreter (the family runtime doctrine, Regra 54/
          # 125: never the `ruby` mutable alias): the gemspec envelope
          # declares required_ruby_version >= 3.1, so the pin rides the
          # supported 3.4 line at its current patch release (ruby/ruby
          # releases, verified via the GitHub API) - the same
          # envelope-line doctrine the Node pin follows.
          ruby-version: 3.4.10

      - name: Configure GitHub credentials
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.gem"
          printf '%s\n' '---' ":github: Bearer ${GITHUB_TOKEN}" > "${HOME}/.gem/credentials"
          chmod 600 "${HOME}/.gem/credentials"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare temporary gem source
        run: |
          set -euo pipefail
          mkdir -p runner
          cat > runner/devthink.rb <<'RUBY'
          # frozen_string_literal: true

          module DevThink
            VERSION = ENV.fetch("DEVTHINK_VERSION", "0.0.0")

            def self.command(*arguments)
              [ENV.fetch("DEVTHINK_BIN", "devthink"), *arguments]
            end

            def self.start(*arguments, **options)
              Process.spawn(*command(*arguments), **options)
            end
          end
          RUBY

      - name: Build gem
        run: DEVTHINK_VERSION="${{ needs.rubygems-resolve.outputs.version }}" gem build devthink.gemspec

      - name: Publish package
        run: gem push devthink-*.gem --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}"

  ghcr:
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the heavy
    # container lane. Only a successful completion whose triggering event
    # was the version-bump push or the maintenance ladder dispatch (the two
    # events the release workflow really runs on) publishes.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    # the extension release-gate doctrine (the 2.0.18 port): every
    # registry publish answers through the release-approval environment
    # the release ladder's own publish jobs gate on.
    environment: release-approval
    # the emulated legs of the multi arch push run the runtime stage
    # interpreted through qemu with the scaled smoke budgets the Dockerfile
    # sets; the 240 minute ceiling rides the family QEMU doctrine (the
    # e2ugh validation-leg calibration: a cold-cache emulated leg is
    # measured far past the old two-hour ceiling, and the riscv64 leg the
    # 2.0.16 index adds answers 64-bit emulation on a binfmt handler).
    timeout-minutes: 240
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
