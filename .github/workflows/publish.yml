      # (dependency install plus the pack dry-run). the setup node registry
      # of this lane leaves the github registry redirect in the runner temp
      # npmrc the NPM_CONFIG_USERCONFIG env points at, and bun honors it:
      # the scope would resolve against npm.pkg.github.com with no token
      # and the frozen install would 403 on the saddle engine package. the
      # empty userconfig answers the project npmrc instead, so the install
      # resolves the public family mirror the registry lanes publish; the
      # publish steps below keep the registry-url configuration untouched.
      - name: install dependencies
        env:
          NPM_CONFIG_USERCONFIG: ""
        run: cd devthink && bun install --frozen-lockfile --ignore-scripts
      - name: build the distribution set
        run: cd devthink && node build.ts
      - name: package dry-run
        run: cd devthink && npm run pack:check
      - name: align the github package scope on the staged manifest
        # the 2.0.16 fix of the badly built package: the scope rides the
        # STAGED manifest the tarball packs (never the repository root
        # manifest the 2.0.15 lane published raw — the registry answered
        # the source tree, unbuilt); the staged package.json regenerates
        # from the repository manifest at build time, so the scope edit
        # lands after the build and the packed tarball carries it.
        shell: bash
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd devthink
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("distpackage/package.json","utf8")); p.name="@"+process.env.GITHUB_REPOSITORY_OWNER+"/devthink"; fs.writeFileSync("distpackage/package.json", JSON.stringify(p,null,2)+"\n");'
