name: build extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to package; empty uses the latest release
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  detect-extension-source:
    name: Detect extension source
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.extension.outputs.present }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - id: extension
        shell: bash
        run: |
          if test -f extension/manifest.json; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  package:
    needs: detect-extension-source
    if: needs.detect-extension-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0

      # the package validator, inlined from the retired composite action
      # (full deterministic gates plus the pack dry-run).
      - name: install dependencies
        run: npm ci
      - name: run full deterministic gates
        run: npm run check && npm run formatcheck && npm test
      - name: package dry-run
        run: npm run pack:check

      - name: build extension
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile
          VITE_BASE_PATH=./ pnpm --dir web build
          rm -rf build/extension
          mkdir -p build/extension
          cp extension/manifest.json build/extension/manifest.json
          node -e 'const fs=require("node:fs"); const path="build/extension/manifest.json"; const manifest=JSON.parse(fs.readFileSync(path,"utf8")); manifest.version=process.env.RELEASE_VERSION; fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);'
          cp -R web/dist/public/. build/extension/

      - name: create zip
        run: |
          cd build/extension
          zip -qr "../../devthink.extension.${{ steps.releaseversion.outputs.version }}.zip" .

      - name: upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink.extension.${{ steps.releaseversion.outputs.version }}
          path: devthink.extension.${{ steps.releaseversion.outputs.version }}.zip
          if-no-files-found: error

      - name: attach release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
          ASSET: devthink.extension.${{ steps.releaseversion.outputs.version }}.zip
        run: gh release upload "$RELEASE_TAG" "$ASSET" --clobber
