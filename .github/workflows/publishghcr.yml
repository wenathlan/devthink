name: publish ghcr

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["DevThink Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing DevThink tag to publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # the event-scoped group (the saddle publish lane pattern, Regra 52):
  # the release published, workflow_run and dispatch firings are distinct
  # lanes that never cancel one another - a ref-only group would land the
  # workflow_run publication firing in the same lane as an in-flight push
  # run and could kill it, leaving cancelled legs on the board. The
  # event-scoped group keeps every firing side by side; cancel-in-progress
  # stays false so no publish leg is ever cancelled mid-push.
  group: publish-ghcr-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  image: ghcr.io/${{ github.repository_owner }}/devthink
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  publish:
    # the conclusion guard (the saddle family pattern, Regra 56b): the
    # workflow_run dual-trigger fires on EVERY completion of the DevThink
    # Release workflow - a FAILED release run must never reach the heavy
    # container lane. Only a successful completion whose triggering event
    # was the version-bump push or the maintenance ladder dispatch (the two
    # events the release workflow really runs on) publishes.
    if: >-
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    # the arm64 leg of the multi arch push runs the whole container
    # validation chain interpreted through qemu with the scaled timeouts
    # the Dockerfile sets, so the publish carries the headroom the
    # emulated leg needs.
    timeout-minutes: 120
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.2
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: login ghcr
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: setup qemu
        # multi-arch emulation for the non-native architectures of the
        # four-arch index (the family union surface the saddle publish lane
        # established): amd64, arm64, ppc64le and s390x. the explicit
        # platforms list is the family pin — only the emulated legs install
        # their binfmt handlers.
        uses: docker/setup-qemu-action@v4.3.0
        with:
          platforms: linux/arm64,linux/ppc64le,linux/s390x
      - name: setup buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: check published image state
        # the idempotent publish: a version tag is immutable content, so a
        # re-run over an already published four-architecture index skips the
        # build and the push and only re-verifies the published image; a
        # missing or partial index (a failed previous run) rebuilds and
        # completes the push.
        id: published
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          image_ref="${image}:${version}"
          if docker buildx imagetools inspect --raw "${image_ref}" >/dev/null 2>&1; then
            arches="$(docker buildx imagetools inspect --raw "${image_ref}" | jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')"
            if [ "${arches}" = "amd64,arm64,ppc64le,s390x" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "the image ${image_ref} is already published with all four architectures; the publish is idempotent."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "the image ${image_ref} exists without the four-architecture surface; the publish completes it." >&2
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: resolve image tags
        # version tags only: a stable channel alias never rides the image
        # (the version tag is the immutable coordinate an operator pins).
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          {
            echo "version=${version}"
            echo 'tags<<EOF'
            echo "${image}:${version}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: build image for security scan
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          # the runner stage is the explicit target: the single-binary
          # stages of the same file stay behind their own --target
          target: runtime
          load: true
          platforms: linux/amd64
          tags: devthink:scan-${{ steps.release.outputs.version }}
          build-args: |
            DEVTHINK_VERSION=${{ steps.release.outputs.version }}
            DEVTHINK_REVISION=${{ steps.release.outputs.revision }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/devthink-buildcache
            type=gha
      - name: scan container image
        if: steps.published.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devthink:scan-${{ steps.release.outputs.version }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: scan container image best practices
        # the dockle gate (the container best-practices complement the
        # trivy gate above answers nothing about: trivy reports what is
        # INSIDE the image, dockle lints HOW the image is built - the
        # merged repository carried only the trivy half and the audit
        # flagged the missing family lane, every container the family
        # published went through dockle before the merge). it scans the
        # same locally loaded amd64 scan image the trivy gate uses and
        # fails the publish on FATAL findings - a container that
        # violates the build doctrine never reaches the registry.
        if: steps.published.outputs.skip != 'true'
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: devthink:scan-${{ steps.release.outputs.version }}
          # only FATAL findings fail the gate; WARN items are reported.
          exit-code: "1"
          exit-level: FATAL
          # the accept-key list whitelists every ENV/ARG key the runtime
          # stage declares plus the smoke-boot loop variables and the
          # node slim base layer internals the CIS-DI-0010 heuristic
          # misreads as credential holders (runnerpid and waited are the
          # smoke-boot loop's process id and retry counter; the seven
          # node-layer entries - dpkgArch, ARCH, OPENSSL_ARCH, GNUPGHOME,
          # --strip-components, /, and the apt autoremove knob - all come
          # from the official node image's install RUN: its architecture
          # probe, the case-arm architecture mappings, the gpg temp home,
          # the tar extraction flag and the apt cleanup option; the
          # --chown entry answers the buildkit COPY --chown history lines
          # of the runtime stage - the site, the cli and the http bundles
          # copy owned by the non-root uid 10000, the flag token rides the
          # layer history, and the heuristic splits --chown=10000:10000
          # into a var/value pair whose value is the ownership pair, the
          # same class as the gateway lineage's --strip-components accept;
          # none are
          # secrets, and the scanner only reports the first unaccepted
          # match per layer, so the list must cover them all). the
          # smoke-boot poll and the healthcheck need no entries: their
          # expressions carry no '=' character, and the heuristic only
          # reports tokens it can split on '=' (the arrow-callback
          # spelling r=>{...} put one there once and failed this gate in
          # the gateway family, which silently skipped the trivy legs
          # below it - the reason the devthink runner spells every
          # callback function(r){}). the remaining entries are the
          # runtime knobs, the build args and the OCI labels - no secret
          # material anywhere.
          accept-key: NODE_ENV,DEVTHINK_HTTP_BIND,DEVTHINK_HTTP_PORT,DEVTHINK_RELAY_PATH,DEVTHINK_MCP_BIND,DEVTHINK_MCP_PORT,DEVTHINK_MCP_PATH,DEVTHINK_MEMORY_ENGINE,DEVTHINK_PLATFORM,DEVTHINK_CDN_URL,NODE_IMAGE,DEVTHINK_VERSION,DEVTHINK_REVISION,PATH,NODE_VERSION,runnerpid,waited,dpkgArch,ARCH,OPENSSL_ARCH,GNUPGHOME,--strip-components,--chown,/,APT::AutoRemove::RecommendsImportant,org.opencontainers.image.title,org.opencontainers.image.description,org.opencontainers.image.documentation,org.opencontainers.image.version,org.opencontainers.image.licenses,org.opencontainers.image.source,org.opencontainers.image.revision
      - name: build and push image with attestations
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            DEVTHINK_VERSION=${{ steps.release.outputs.version }}
            DEVTHINK_REVISION=${{ steps.release.outputs.revision }}
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
          provenance: mode=max
          sbom: true
          # the registry buildcache of the container lane: the multi arch
          # validation layers reuse across releases through the versioned
          # buildcache image (mode=max caches the intermediate stages too,
          # so the dependency and the build check layers of the next
          # release start warm).
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/devthink-buildcache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/devthink-buildcache,mode=max
      - name: verify published image index and smoke test the runner
        # the smoke test runs the published image with the absorbed compose
        # hardening (read-only, cap-drop ALL, no-new-privileges, network
        # isolation, the tmpfs scratch), waits for the image HEALTHCHECK to
        # report the runner healthy and probes the /healthz endpoint that
        # reports every surface live - an image that cannot serve never
        # counts as published. the index assertion carries the four-arch
        # family surface (amd64, arm64, ppc64le, s390x) the push above
        # ships.
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${image}:${{ steps.release.outputs.version }}"
          docker buildx imagetools inspect --raw "${image_ref}" | jq -e '
            [
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ]
            | sort
            | . == ["amd64", "arm64", "ppc64le", "s390x"]
          '
          docker pull --quiet --platform linux/amd64 "${image_ref}"
          actual_version="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "${actual_version}" = "${{ steps.release.outputs.version }}"
          docker run -d --name devthink-smoke --platform linux/amd64 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --network none --tmpfs /tmp:size=512m,mode=1777 \
            "${image_ref}"
          trap 'docker rm -f devthink-smoke >/dev/null 2>&1 || true' EXIT
          healthy=""
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' devthink-smoke)"
            if [ "${status}" = "healthy" ]; then healthy="true"; break; fi
            if [ "${status}" = "unhealthy" ]; then
              echo "the published image reported an unhealthy runner:" >&2
              docker logs devthink-smoke >&2 || true
              exit 1
            fi
            sleep 2
          done
          test "${healthy}" = "true"
          docker exec devthink-smoke node -e "fetch('http://127.0.0.1:'+(process.env.DEVTHINK_HTTP_PORT||8080)+'/healthz').then(function(r){return r.json()}).then(function(body){if(body.ok!==true)process.exit(1);process.stderr.write(JSON.stringify(body)+'\n')}).catch(function(){process.exit(1)})"
          echo "the published image answered: the index carries amd64, arm64, ppc64le and s390x, the version label matches and the runner serves every surface healthy."
