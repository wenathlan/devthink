name: mobile artifacts

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["DevThink Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing DevThink tag to package.
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.release_tag || github.event.release.tag_name }}

jobs:
  detect-mobile-source:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    name: detect mobile source
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.mobile.outputs.present }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag || github.event.release.tag_name }}
      - id: mobile
        shell: bash
        run: |
          if test -f mobile/package.json && test -f mobile/capacitor.config.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: detect-mobile-source
    if: needs.detect-mobile-source.outputs.present == 'true'
    name: android development artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag || github.event.release.tag_name }}
      - id: release
        uses: ./.github/actions/releaseversion
        with:
          checkout_tag: "false"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.1
      - name: build Bun workbench and synchronize Android
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile
          cd mobile
          bun install --frozen-lockfile
          bun run build:web
          bunx cap add android
          bunx cap sync android
      - name: build Android APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:bundleDebug
      - name: collect Android artifacts
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/mobile/android
          apk="devthink.android.${VERSION}.debug.apk"
          aab="devthink.android.${VERSION}.debug.aab"
          cp "$(find mobile/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)" "build/mobile/android/${apk}"
          cp "$(find mobile/android/app/build/outputs/bundle/debug -name '*.aab' -print -quit)" "build/mobile/android/${aab}"
          sha256sum "build/mobile/android/${apk}" "build/mobile/android/${aab}" | sed 's#build/mobile/android/##' > "build/mobile/android/sha256.android.${VERSION}"
          printf '{\n  "version": "%s",\n  "platform": "android",\n  "signing": "debug",\n  "files": ["%s", "%s"]\n}\n' "$VERSION" "$apk" "$aab" > "build/mobile/android/manifest.android.${VERSION}.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink.android.${{ steps.release.outputs.version }}
          path: build/mobile/android
          if-no-files-found: error
      - name: attach Android assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/mobile/android/* --clobber

  ios-simulator:
    needs: detect-mobile-source
    if: needs.detect-mobile-source.outputs.present == 'true'
    name: iOS simulator artifact
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag || github.event.release.tag_name }}
      - id: release
        uses: ./.github/actions/releaseversion
        with:
          checkout_tag: "false"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: build Bun workbench and synchronize iOS
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile
          cd mobile
          bun install --frozen-lockfile
          bun run build:web
          bunx cap add ios
          bunx cap sync ios
      - name: build iOS simulator application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath "$RUNNER_TEMP/devthink-ios" build
      - name: collect iOS simulator artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/mobile/ios
          app="$(find "$RUNNER_TEMP/devthink-ios/Build/Products" -type d -name 'App.app' -print -quit)"
          test -n "$app"
          asset="devthink.ios.${VERSION}.simulator.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/mobile/ios/${asset}"
          shasum -a 256 "build/mobile/ios/${asset}" | sed 's#build/mobile/ios/##' > "build/mobile/ios/sha256.ios.${VERSION}"
          printf '{\n  "version": "%s",\n  "platform": "ios-simulator",\n  "signing": "not-required",\n  "files": ["%s"]\n}\n' "$VERSION" "$asset" > "build/mobile/ios/manifest.ios.${VERSION}.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink.ios.${{ steps.release.outputs.version }}
          path: build/mobile/ios
          if-no-files-found: error
      - name: attach iOS simulator assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/mobile/ios/* --clobber
