name: publish rubygems

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing DevThink tag to publish.
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  detect-ruby-source:
    name: detect Ruby source
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.ruby.outputs.present }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: ruby
        shell: bash
        run: |
          if test -f devthink.gemspec; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  publish:
    needs: detect-ruby-source
    if: needs.detect-ruby-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ruby
      - name: configure github credentials
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.gem"
          printf '%s\n' '---' ":github: Bearer ${GITHUB_TOKEN}" > "${HOME}/.gem/credentials"
          chmod 600 "${HOME}/.gem/credentials"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare temporary gem source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner
          cat > runner/devthink.rb <<'RUBY'
          # frozen_string_literal: true

          module DevThink
            VERSION = ENV.fetch("DEVTHINK_VERSION", "0.0.0")

            def self.command(*arguments)
              [ENV.fetch("DEVTHINK_BIN", "devthink"), *arguments]
            end

            def self.start(*arguments, **options)
              Process.spawn(*command(*arguments), **options)
            end
          end
          RUBY
      - name: build gem
        run: DEVTHINK_VERSION="${{ steps.release.outputs.version }}" gem build devthink.gemspec
      - name: publish package
        run: gem push devthink-*.gem --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}"
