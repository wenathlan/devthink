name: publish rubygems

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing DevThink tag to publish.
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  detect-ruby-source:
    name: detect Ruby source
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.ruby.outputs.present }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: ruby
        shell: bash
        run: |
          if test -f devthink.gemspec; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  publish:
    needs: detect-ruby-source
    if: needs.detect-ruby-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: resolve release version
        id: release
        uses: ./.github/actions/releaseversion
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
      - name: setup ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ruby
      - name: configure github credentials
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.gem"
          printf '%s\n' '---' ":github: Bearer ${GITHUB_TOKEN}" > "${HOME}/.gem/credentials"
          chmod 600 "${HOME}/.gem/credentials"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build gem
        run: DEVTHINK_VERSION="${{ steps.release.outputs.version }}" gem build devthink.gemspec
      - name: publish package
        run: gem push devthink-*.gem --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}"
