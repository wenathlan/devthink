name: publish npmjs

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["DevThink Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing DevThink tag to publish.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.release.tag_name || inputs.tag }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.22.0
      - name: resolve release version
        id: release
        uses: ./.github/actions/releaseversion
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.tag }}
      - name: validate package
        uses: ./.github/actions/validatepackage
      - name: Verify release package versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"); const expected=process.env.RELEASE_VERSION; for (const path of ["package.json", "web/package.json"]) { const actual=JSON.parse(fs.readFileSync(path,"utf8")).version; if (actual !== expected) throw new Error(`${path} is ${actual}; expected ${expected}`); }'
      - name: normalize npm token
        shell: bash
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          token="${RAW_NPM_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          if [[ -z "$token" ]]; then
            echo "NPM_TOKEN is empty" >&2
            exit 1
          fi
          printf 'NODE_AUTH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: verify npm identity
        run: npm whoami
      - name: publish public CLI package when absent
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@wenathlan/devthink@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "CLI package version already exists; skipping publish."
          else
            npm publish --access public
          fi
      - name: build static workbench package
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build
      - name: publish public workbench package when absent
        working-directory: web
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@wenathlan/devthink.web@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "Workbench package version already exists; skipping publish."
          else
            npm publish --access public
          fi
