name: publish npmjs

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["DevThink Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing DevThink tag to publish.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.22.0
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_TAG: "true"
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # the release-version resolver, inlined from the retired composite
          # action (the one-workflow-file standard: every workflow carries
          # its own steps - the .github/actions folder no longer exists).
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.1.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      # the package validator, inlined from the retired composite action
      # (dependency install plus the pack dry-run).
      - name: install dependencies
        run: npm ci
      - name: package dry-run
        run: npm run pack:check
      - name: Verify release package versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"); const expected=process.env.RELEASE_VERSION; for (const path of ["package.json", "web/package.json"]) { const actual=JSON.parse(fs.readFileSync(path,"utf8")).version; if (actual !== expected) throw new Error(`${path} is ${actual}; expected ${expected}`); }'
      - name: normalize npm token
        shell: bash
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          token="${RAW_NPM_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          if [[ -z "$token" ]]; then
            echo "NPM_TOKEN is empty" >&2
            exit 1
          fi
          printf 'NODE_AUTH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: verify npm identity
        run: npm whoami
      - name: publish public CLI package when absent
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@wenathlan/devthink@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "CLI package version already exists; skipping publish."
          else
            npm publish --access public
          fi
