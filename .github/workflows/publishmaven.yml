name: publish maven

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-maven-source:
    name: Detect Maven source
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.maven.outputs.present }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: maven
        shell: bash
        run: |
          if test -f pom.xml; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  publish:
    needs: detect-maven-source
    if: needs.detect-maven-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: resolve release version
        id: release
        uses: ./.github/actions/releaseversion
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: setup java
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '26'
          distribution: temurin
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: publish package
        run: mvn --batch-mode --settings settings.xml -Drevision="${{ steps.release.outputs.version }}" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
