name: publish maven

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing DevThink tag to publish.
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  detect-maven-source:
    name: detect Maven source
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.maven.outputs.present }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: maven
        shell: bash
        run: |
          if test -f pom.xml; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  publish:
    needs: detect-maven-source
    if: needs.detect-maven-source.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: resolve release version
        id: release
        uses: ./.github/actions/releaseversion
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
      - name: setup java
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '26'
          distribution: temurin
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: publish package
        run: mvn --batch-mode --file pom.xml --settings settings.xml -Drevision="${{ steps.release.outputs.version }}" -DaltDeploymentRepository="github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
