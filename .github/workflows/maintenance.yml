name: DevThink Maintenance

on:
  workflow_run:
    workflows: [DevThink Security]
    types: [completed]
  schedule:
    - cron: "37 4 * * 1"
    - cron: "17 3 * * *"
    # the second daily retention window (the saddle cache lane contract
    # the 2.0.18 pass restores): the twice-daily cadence keeps the gha
    # cache storage bounded inside one working day.
    - cron: "17 15 * * *"
    # the dormant-thread sweep window (the automation category pass): the
    # stale lane walks the issues and pull requests the tree stopped
    # hearing from, off-peak from the cache and ladder windows it shares
    # the file with.
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      allow_major_updates:
        description: Permit explicitly reviewed breaking updates for dependencies, Node and GitHub Actions.
        required: true
        default: false
        type: boolean
      apply_cache_cleanup:
        description: Delete qualifying caches; false only reports candidates.
        required: true
        default: false
        type: boolean
      packages:
        description: Comma separated maven package names the retire job walks (the absorbed package cleanup lane input).
        required: false
        default: com.wenathlan.extension-mcp,com.wenathlan.extension-headless,com.wenathlan.extension-cli,com.wenathlan.extension-library
        type: string
      confirm:
        description: Type healtags to confirm the registry heal (the absorbed registryheal lane input).
        required: true
        default: ""
        type: string
  issues:
    # the first-interaction lane (the automation category pass): the
    # greeting answers the first issue an author ever opens the same way
    # the pull_request_target firing below answers their first change -
    # the opened action alone, never an edit or a reopen.
    types: [opened]
  pull_request_target:
    # the absorbed labeler lane (the consolidation pass): the pull request
    # labels follow the folders the change touches, one label per family
    # application plus the infrastructure lanes the workflows live in. The
    # lane lived as its own workflow file until the maintenance grouping
    # folded it in beside the other repository-upkeep jobs.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# the automated dependency ladder of the merged repository: every run
# applies every non-breaking update available at run time (npm dependencies
# through dependency:updates, the engine recommendations through
# sync:maintenance and the versioned GitHub Actions references through
# workflow:updates), derives the next patch number of the ladder with plain
# arithmetic on package.json (the current rung plus one — never a hardcoded
# number), lands the complete bump across the metadata family (version
# stamps, re-frozen apifreeze artifact, recorded permission baseline,
# regenerated release metadata) and validates the whole chain before
# anything touches main.
#
# the landing path: the change set rides a dated automation branch (the
# same name the manual proposals used), an archive tag preserves it
# (archive/automation/<branch>), the pull request runs the full verify
# pipeline, and the squash merge lands it on main with linear history —
# the branch is deleted after the merge, and when the pipeline answers
# red the pull request is closed and its branch deleted so no rung ever
# stays open: the repository keeps exactly one long-lived branch (main)
# and the archive tags carry every automation branch the ladder ever
# created. because pushes performed with the workflow GITHUB_TOKEN never
# fire other workflows, the run creates the version tag itself and
# dispatches the release workflow on that tag explicitly, so every
# automatic bump publishes exactly the way the manual rungs always did.

#
# THE CONSOLIDATION PASS (the seventeen-to-six workflow fold): the
# emergency registry heal and the one-shot rung records lanes the
# standalone files carried ride this file as its closing jobs - the heal
# keeps its release-approval environment, its healtags confirmation and
# its registry-heal group while answering the confirmed dispatch alone,
# and the records walk keeps its dispatch-only shape. The maintain-versions
# group the workflow-level block once declared rides the ladder jobs it
# serialized (propose, cachecleanup, retire, npmtag); the stale, labeler
# and greeting lanes keep the groups of their own they always carried.

jobs:
  propose:
    # every firing runs this job for real (Regra 124: nothing skipped):
    # the old job-level window gate left the propose job skipped on the
    # board for the daily cache pass and the DevThink Security
    # completions; the window decision now lives in the first step below,
    # so out-of-window firings report an explicit no-op and stay green.
    # the ladder group (the workflow-level block the standalone file
    # carried): the dependency proposals serialize and a superseded rung
    # never cancels a walk already landing.
    concurrency:
      group: maintain-versions
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # the eleven-manifest walk of the union ladder answers ~18 minutes a
    # manifest against the live registry (~198 minutes whole beside the
    # installs and the stamping chain), so the three-hour ceiling the
    # ladder once carried killed the tenth walk every full dispatch — the
    # five-hour seat walks the whole union with the headroom the re-run
    # never needs.
    timeout-minutes: 300
    # least-privilege (the 2.0.184 scorecard closure): the pull request
    # the pull-requests write below opens is the one write the github
    # token owns — the branch, archive tag and version tag pushes and the
    # release dispatch ride the owner pat the landing step carries.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Decide whether this firing proposes a rung
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_SCHEDULE" = "37 4 * * 1" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "This firing (event ${EVENT_NAME}, schedule '${EVENT_SCHEDULE:-none}') is inside the proposal window; the ladder runs."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This firing (event ${EVENT_NAME}, schedule '${EVENT_SCHEDULE:-none}') is outside the proposal window (manual dispatch or the Monday 37 4 * * 1 pass); the dependency ladder reports a real no-op - nothing proposed, nothing skipped."
          fi
      - name: Checkout the full DevThink history
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # the credentials never persist (the 2.0.184 least-privilege
          # closure): the landing step pushes over the owner pat header
          # alone, and a persisted job token would answer a second
          # authorization header the wire refuses.
          persist-credentials: false
      - name: Set up Bun
        if: steps.window.outputs.active == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Set up Node
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # the repo-declared Node line (the family runtime doctrine,
          # Regra 54: never the mutable `node`/latest alias): the ladder
          # scripts run under the envelope the repository pins, and the
          # validation step below switches to the PROPOSED .nvmrc after
          # sync:maintenance restamps it.
          node-version-file: devthink/.nvmrc
      - name: Install root dependencies
        if: steps.window.outputs.active == 'true'
        # the ladder lanes never touch the native sqlite binding (the
        # owner-run control-plane tool that imports it lives outside every
        # built surface): the scripts stay off so the frozen install never
        # rides the prebuild mirror or the broken bunx node-gyp fallback
        # the flaky lanes hit — the prisma client the validation reads
        # generates inside build.ts itself.
        run: cd devthink && bun install --frozen-lockfile --ignore-scripts
      - name: Propose latest non-breaking direct npm dependency updates
        if: steps.window.outputs.active == 'true'
        # the family lockstep law the config parity gate owns: the
        # eleven manifests carry the same dependency union, so the
        # proposal walks every app root — the foundry gate reads the
        # manifest of the tree it runs from, and a devthink-only pass
        # reddens the parity cell the validate step walks (the sibling
        # floors drift against the refreshed devthink seats the moment
        # the registry moves). The devthink envelope keeps its manifest
        # script seat (bun run dependency:updates) while the siblings
        # answer the foundry gate directly — the same law the rung
        # stamps carry.
        run: |
          set -euo pipefail
          cd devthink && bun run dependency:updates ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../argan && node ../foundry/dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../cadria && node ../foundry/dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../cobaia && node ../foundry/dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../debonair && node ../foundry/dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../forge && node ../foundry/dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../foundry && node dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../getry && node ../foundry/dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../saddle && node ../foundry/dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../stealthhead && node ../foundry/dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
          cd ../vault && node ../foundry/dependencyupdates.ts sync ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
      - name: Update package-manager and Node engine recommendations
        if: steps.window.outputs.active == 'true'
        run: cd devthink && bun run sync:maintenance ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
      - name: Update versioned GitHub Actions references
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd devthink && bun run workflow:updates ${{ inputs.allow_major_updates && '--allow-majors' || '' }}
      - name: Restamp the family container image digests
        if: steps.window.outputs.active == 'true'
        # the scanner gate demands hash-pinned images and the container
        # doctrine keeps no hand-written hash: the ladder resolves every
        # literal runtime tag against its live registry digest and restamps
        # the family Dockerfiles, so the pins answer automation exactly the
        # way every other version stamp of the house does — the two literal
        # runtime stages carry the stamps and every ARG-driven baseline
        # keeps the tag form its build resolves.
        run: cd devthink && bun run digests:sync
      - name: Stop when no maintenance updates are available
        if: steps.window.outputs.active == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No maintenance updates are available; the ladder stays on $(node -p "require('./package.json').version")."
            echo "STOPPED=true" >> "$GITHUB_ENV"
          else
            echo "Maintenance updates detected:"
            git diff --stat
          fi
      - name: Derive the next rung of the ladder with plain arithmetic
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        id: rung
        run: |
          set -euo pipefail
          # the ladder mathematics: the next rung is the current patch
          # number plus one, derived from package.json at run time — no
          # hardcoded version lives anywhere in this workflow.
          NEXT="$(node -p "const p=require('./devthink/package.json'); const v=p.version.split('.').map(Number); v[2]+=1; v.join('.')")"
          PREVIOUS="$(node -p "require('./devthink/package.json').version")"
          test -n "$NEXT" && test "$NEXT" != "$PREVIOUS"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "The ladder moves ${PREVIOUS} -> ${NEXT} (patch arithmetic over package.json)."
      - name: Stamp the rung across the metadata family
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        env:
          NEXT: ${{ steps.rung.outputs.next }}
          PREVIOUS: ${{ steps.rung.outputs.previous }}
        run: |
          set -euo pipefail
          UPDATE_SUMMARY="$(git diff --no-color --unified=0 -- package.json devthink/package.json devthink/bun.lock devthink/.nvmrc devthink/Dockerfile .github/workflows | grep -E '^[+-][^+-]' | sed 's/^[+-]//' | sed 's/^[[:space:]]*//' | grep -v '^$' | sort -u | head -40 | sed 's/^/- /' || true)"
          NOTE="This release is the automated maintenance rung of the ladder: the DevThink \
          maintenance workflow applied every non-breaking update available at run time — the npm \
          dependency set, the engine recommendations and the versioned GitHub Actions references — \
          derived the next patch number with plain arithmetic over package.json (${PREVIOUS} plus \
          one rung), stamped it across the whole metadata family, re-froze the apifreeze artifact, \
          recorded the permission baseline and regenerated the release metadata before the pull \
          request below ran the complete verification pipeline. The updates of this rung: \
          ${UPDATE_SUMMARY}. The version stamps ${NEXT} land across the metadata family with the \
          apifreeze artifact re-frozen and the permission baseline recorded, and the ladder keeps \
          no long-lived branch behind: the automation branch of this rung squashes onto main when \
          the verification pipeline answers green — and closes with its branch deleted when it \
          answers red — so the repository keeps exactly one long-lived branch and the archive tag \
          carries the rung either way."
          NEXT="$NEXT" NOTE="$NOTE" node <<'STAMP'
          const fs = require("node:fs");
          const next = process.env.NEXT;
          const note = process.env.NOTE;
          if (!/^\d+\.\d+\.\d+$/.test(next)) throw new Error("The derived rung must be plain SemVer.");
          const pkg = JSON.parse(fs.readFileSync("devthink/package.json", "utf8"));
          if (pkg.version === next) throw new Error("The derived rung equals the current version; refusing to re-stamp.");
          const stamped = { ...pkg, version: next };
          const current = fs.readFileSync("devthink/package.json", "utf8");
          const indent = current.includes("\n  \"name\"") ? 2 : 4;
          fs.writeFileSync("devthink/package.json", JSON.stringify(stamped, null, indent) + "\n");
          const anchor = JSON.parse(fs.readFileSync("package.json", "utf8"));
          anchor.version = next;
          fs.writeFileSync("package.json", JSON.stringify(anchor, null, 2) + "\n");
          const changelog = fs.readFileSync("devthink/CHANGELOG.md", "utf8");
          if (changelog.includes(`\n## ${next}\n`)) throw new Error(`CHANGELOG.md already carries a ${next} section.`);
          const head = /^# DevThink release notes\n\n/.exec(changelog);
          if (head === null) throw new Error("CHANGELOG.md must open with the # DevThink release notes heading.");
          fs.writeFileSync("devthink/CHANGELOG.md", changelog.replace(/^# DevThink release notes\n\n/, `# DevThink release notes\n\n## ${next}\n\n${note}\n\n`));
          console.log("Stamped " + next + " into package.json and CHANGELOG.md.");
          STAMP
      - name: Synchronize the generated package and release metadata
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        run: cd devthink && bun run sync:metadata
      - name: Re-freeze the apifreeze artifact and record the permission baseline
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        # the freeze scripts live in the devthink envelope alone (the root
        # package.json carries no scripts at all): the step answers from
        # the application root the way the metadata sync beside it does —
        # the root leg answered "Script not found apifreeze:sync" and the
        # Monday window died red before any rung ever proposed. The freeze
        # reads the schemas and caps the BUILD emits (dist/schemas/*.json,
        # dist/caps/*), so the build rides inside the step before the sync
        # — the dispatch leg answered ENOENT on observation.schema.json
        # and the rung died before the PR ever opened because no artifact
        # existed between the install and the freeze.
        run: |
          set -euo pipefail
          cd devthink
          node build.ts
          bun run apifreeze:sync
          bun run permdiff:sync
      - name: Re-stamp the certification records at the derived rung
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        # the certification records stamp the release the tree builds: the
        # validation suite refuses a record that still carries the previous
        # rung (the eight-seat stamp refusal the 2029 firing answered -
        # expected 2.1.7 to be 2.1.8 on every certification seat), so the
        # ladder re-stamps every record through the records:sync pass over
        # the twelve gates (agentcert through wcag) before the validation
        # walks the suite - the same re-stamp the release commit carries
        # when a version lands by hand. The sweep seat walks FIRST: the
        # matrixverify cell of the chain reads the committed sweep record
        # and refuses a record that still stamps the previous rung, so the
        # chain order the records:sync line carries (matrixverify fourth,
        # sweep tenth) deadlocks on the first firing after every stamp -
        # the sweep sync rewrites the record the matrix reads before the
        # matrix checks it, then the full chain re-stamps the rest.
        run: cd devthink && node sweep.ts sync && bun run records:sync
      - name: Validate with the proposed Node version
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: devthink/.nvmrc
      - name: Install the proposed npm version and refresh the lockfile
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        # the npm probe reads the devthink envelope engines (the same
        # package-manager floor the verify ladder reads beside its own
        # install — the root envelope declares the caret form ^12.x the
        # >= probe never matched, and the dispatch leg died TypeError on
        # null[1] reading the root before the cd ever ran), while the
        # lockfile that must answer the updated dependency set is
        # devthink/bun.lock — the refresh installs inside the application,
        # never at the repository root (a root leg would build no lock and
        # the rung would ship a package.json its own frozen install
        # refuses). The probe itself accepts every semver constraint form
        # (>=12.2.0 <13, ^12.1.0, 12.x) so no envelope shape breaks it.
        # The family lockstep the proposal now walks answers its own lock
        # refresh: every sibling manifest the dependency gate touched
        # regenerates the lock its frozen lanes read (the ten bun locks
        # under the pinned grammar the family law carries, the saddle npm
        # lock through the package-lock-only seat), so the validate step's
        # frozen installs and every lane that answers a lock walk the
        # proposed tree whole.
        run: |
          set -euo pipefail
          cd devthink
          # the engines ride the root manifest alone (the manifestemplate
          # law): the floor probe answers one hop up, the lock refresh
          # stays inside the application where its lock lives.
          npm_version="$(node -p "const m=String(require('../package.json').engines.npm).match(/\d+(?:\.\d+)*/); if(!m) throw new Error('no npm floor'); m[0]")"
          npx --yes "npm@${npm_version}" install --global "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
          bun install --ignore-scripts
          # the family lockstep refresh: every sibling manifest the
          # proposal walked regenerates the lock its lanes read (the
          # ten bun locks, the saddle npm lock answering its own
          # package-lock-only seat — the both-blocks grammar the
          # container base install derives from stays untouched,
          # only the resolution floors move).
          cd ../argan && bun install --ignore-scripts
          cd ../cadria && bun install --ignore-scripts
          cd ../cobaia && bun install --ignore-scripts
          cd ../debonair && bun install --ignore-scripts
          cd ../forge && bun install --ignore-scripts
          cd ../foundry && bun install --ignore-scripts
          cd ../getry && bun install --ignore-scripts
          cd ../stealthhead && bun install --ignore-scripts
          cd ../vault && bun install --ignore-scripts
          cd ../saddle && bun install --ignore-scripts
          # the stale-peer fallback: the strict resolver reads the locked peer
          # states of the rungs behind (a synced manifest ahead of its lock
          # reddens on cohorts the fresh tree satisfies), so the refresh
          # first walks the locked strict pass and, when it refuses, the
          # lock retires and the strict resolver rebuilds the whole tree
          # from the manifest alone — never --legacy-peer-deps, a genuinely
          # conflicted manifest still fails hard.
          if ! npx --yes "npm@${npm_version}" install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-offline; then
            echo "::warning::the locked strict pass refused the stale peer states; the fresh strict resolution rebuilds the lock from the manifest whole"
            rm -f package-lock.json
            npx --yes "npm@${npm_version}" install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-offline
          fi
      - name: Install the gateway and saddle family dependencies
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        # the gateway family law the verify ladder carries: the
        # deterministic suite boots the getry gateway and the check the
        # validate step walks bridges ../getry/server.ts and the saddle
        # sandbox beside the devthink root — their hono runtime and the
        # sibling seats resolve from their own node_modules, and the
        # frozen pass here answers the consistency gate the refreshed
        # locks owe (the lock refresh above installs the family whole;
        # this frozen re-install proves zero drift the same way the
        # verify ladder's gateway/saddle install steps always carried
        # it, materializing exactly what the validation reads).
        run: |
          set -euo pipefail
          cd getry && bun install --frozen-lockfile --ignore-scripts
          cd ../saddle && bun install --frozen-lockfile --ignore-scripts
      - name: Validate the complete proposed update
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        # every artifact the validation walks (build.ts, the
        # distpackage the pack reads, the dist/cli.js the manifest prints)
        # lives inside the devthink application — the block answers from
        # the application root while git diff --check still sees the whole
        # repository from there.
        run: |
          set -euo pipefail
          cd devthink
          node build.ts
          bun run check
          node apifreeze.ts
          node permdiff.ts
          node release.ts check
          npm pack ./distpackage --dry-run
          bun build/cli.js manifest
          git diff --check
      - name: Land the rung on main through the archive-tagged automation branch
        if: steps.window.outputs.active == 'true' && env.STOPPED != 'true'
        env:
          # the automation branch carries workflow reference updates (the
          # versioned github actions stamps the propose job writes), and a
          # GITHUB_TOKEN can never push those — the GH013 wall refuses any
          # github app token that creates or updates a workflow file — so
          # the owner's PAT rides the whole landing (the push, the pull
          # request, the watch and the squash) whenever the secret exists;
          # the app token keeps the lane standing when it does not.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          OWNER_PAT: ${{ secrets.OWNER_PAT }}
          # least-privilege (the 2.0.184 scorecard closure): the github
          # token answers read alone now, so every git push the rung makes
          # rides the owner pat — the github token standing in when the
          # secret does not — over the single header the gitpat helper
          # below stamps.
          PUSH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          NEXT: ${{ steps.rung.outputs.next }}
        run: |
          set -euo pipefail
          BRANCH="automation/maintenance-$(date -u +%Y%m%d-%H%M%S)"
          git switch -C "$BRANCH"
          git config user.name "iakadion"
          git config user.email "ogenhoanimation01@gmail.com"
          # the whole-tree staging law: the family grew past the explicit
          # list this landing once carried — the rung now walks the eleven
          # manifests with their locks (the ten bun locks beside the
          # saddle npm lock the family refresh regenerates), the twelve
          # certification records the records:sync walk re-stamps, the
          # readiness seat the foundry root owns and the digest stamps
          # the container images carry — an explicit list missed one
          # seat each rung the family gained, and the branch shipped a
          # manifest whose own frozen install refused (the family suites
          # reddened at the install step, the config parity cell walked
          # stale floors) while the post-close switch refused on the
          # unstaged stragglers. The ignore law keeps the tree safe for
          # the whole walk: node_modules, distpackage, the databases and
          # the upload seat never stage, so -A answers exactly the rung.
          git add -A
          git commit -m "chore: land the automated maintenance rung v${NEXT}"
          # the archive tag preserves the automation branch verbatim before
          # the squash merge replaces it, so the ladder keeps its history
          # without keeping its branches.
          git tag "archive/${BRANCH}"
          # the checkout keeps persist-credentials off (the least-privilege
          # law above), so no injected http extraheader can double the one
          # below — every network call the rung makes rides the single
          # owner-pat header: the branch push, the archive tag, the main
          # fetch and the version tag push.
          PAT_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          gitpat() {
            git -c http.https://github.com/.extraheader="$PAT_HEADER" "$@"
          }
          gitpat push --force-with-lease origin "$BRANCH" "refs/tags/archive/${BRANCH}"
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "chore: land the automated maintenance rung v${NEXT}" --body "Automated rung of the DevThink dependency ladder. This pull request carries every non-breaking maintenance update available at run time (npm dependencies, engine recommendations, versioned GitHub Actions references), the next patch rung derived by arithmetic over package.json, the complete metadata restamp, the re-frozen apifreeze artifact and the recorded permission baseline. The verify pipeline below is the gate: when it answers green the rung squashes onto main, the automation branch is archived under its tag and deleted, and the release workflow is dispatched on the new version tag; when it answers red the pull request closes and the branch is deleted, so no rung ever stays open.")"
          echo "Pull request: ${PR_URL}"
          # watch the verification pipeline of the pull request to its end —
          # the squash merge only happens over a fully green run, and a red
          # run closes the pull request and deletes its branch so the
          # ladder never leaves a proposal open. The watch itself refuses
          # instantly while zero checks exist (the workflow triggers of a
          # fresh pull request take a breath to report), so the first check
          # is polled for — up to five minutes — before the watch walks.
          CHECK_WAIT=0
          until [ "$CHECK_WAIT" -ge 30 ] || gh pr checks "$BRANCH" 2>/dev/null | grep -q .; do
            sleep 10
            CHECK_WAIT=$((CHECK_WAIT + 1))
          done
          if ! gh pr checks "$BRANCH" --watch --interval 30; then
            echo "The verification pipeline failed on the automation branch; closing the rung and keeping the archive tag." >&2
            gh pr close "$BRANCH" --delete-branch
            exit 1
          fi
          # the squash merge: the base branch policy demands more than the
          # green pipeline (the required checks answered, but the merge
          # refused without privileges) — the owner pat carries the admin
          # rights the --admin flag needs, so the rung lands immediately;
          # the app token fallback arms --auto instead (the rung waits for
          # the policy to clear and the release dispatch waits with it,
          # because a tag over an unmerged main would point at nothing).
          if [ -n "$OWNER_PAT" ]; then
            gh pr merge "$BRANCH" --squash --delete-branch --admin --subject "chore: land the automated maintenance rung v${NEXT}"
          else
            if ! gh pr merge "$BRANCH" --squash --delete-branch --subject "chore: land the automated maintenance rung v${NEXT}"; then
              gh pr merge "$BRANCH" --squash --delete-branch --auto --subject "chore: land the automated maintenance rung v${NEXT}" || true
              echo "The rung waits on the base branch policy (auto-merge armed); the tag and the release dispatch wait with it." >&2
              exit 0
            fi
          fi
          # the squash merge landed on main. the pat path lets the auto-tag
          # lane of the main push cut the version tag itself: a pat merge
          # fires the main-push release run, the auto-tag job stamps the
          # fresh version over the latest tag, and the whole release chain
          # (the assemble set, the iso, the wasm, the family tarballs, the
          # attestation, the github release) answers from that one run -
          # the explicit tag push this lane once carried raced the auto-tag
          # cut (the tag landed before the main-push run resolved, the
          # auto-tag answered no bump and the tag-push run inherited the
          # skip through its needs graph, so the release shipped empty).
          # the app-token fallback keeps the explicit form: a GITHUB_TOKEN
          # merge never fires workflows, so the tag and the dispatch carry
          # the release the only way the app token can.
          gitpat fetch origin main --quiet
          MAINSHA="$(git rev-parse origin/main)"
          if [ -z "$OWNER_PAT" ]; then
            git tag -a "v${NEXT}" -m "DevThink ${NEXT}" "$MAINSHA"
            gitpat push origin "refs/tags/v${NEXT}"
            # the actions-scope dispatch rides the token the env carries
            # with a tolerant answer (the 2.0.184 closure dropped the
            # actions write the job token once held): a refusal notices
            # instead of reddening — the tag push itself wakes the release
            # ladder on the v* trigger either way.
            if ! gh workflow run release.yml --ref "v${NEXT}" -f tag="v${NEXT}"; then
              echo "::notice::the release dispatch on the tag refused (the token answers no actions write); the tag push itself wakes the release ladder."
            fi
            echo "The rung v${NEXT} landed on ${MAINSHA:0:8} and the release workflow was dispatched on the tag."
          else
            echo "The rung v${NEXT} landed on ${MAINSHA:0:8}; the auto-tag lane of the main push cuts the tag and the release chain answers whole."
          fi
  cachecleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # the maintain-versions group the ladder serializes under.
    concurrency:
      group: maintain-versions
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # the retention pass stays bounded (the family contract, the same
    # ceiling the dedicated cache retention lane carries).
    timeout-minutes: 10
    # least-privilege (the 2.0.184 scorecard closure): the cache deletes
    # below ride the owner pat, so the github token answers read alone.
    permissions:
      actions: read
      contents: read
    env:
      # least-privilege (the 2.0.184 scorecard closure): the deletes ride
      # the owner pat — the github token standing in when the secret does
      # not — and every delete answers best-effort below.
      GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_REF: refs/heads/main
      # the retention contract of the Saddle cache lane (aligned with
      # cachecleanup.yml so the two lanes never drift apart again):
      # non-default-ref caches age out after the same six hours the
      # family retention policy keeps; the schedule windows stay
      # untouched.
      NONDEFAULT_MAX_AGE_HOURS: "6"
      APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply_cache_cleanup == true }}
      # the workflow_run scope (the family retention contract restored in
      # the 2.0.18 pass - the gateway, maene, e2ugh and saddle lanes all
      # carry it): a retention firing triggered by a workflow completion
      # processes ONLY the codeql-family caches; the node, java, dotnet and
      # other families are skipped entirely - they may still be in-flight
      # reads for the verify and publish legs the completion rides beside.
      # the schedule and dispatch triggers run the full retention policy.
      WORKFLOW_RUN_SCOPED: ${{ github.event_name == 'workflow_run' }}
    steps:
      - name: Retain bounded repository caches automatically
        shell: bash
        run: |
          set -euo pipefail
          cutoff_epoch="$(date --utc --date="-${NONDEFAULT_MAX_AGE_HOURS} hours" +%s)"
          declare -A retained
          cachelimit() {
            case "$1" in
              codeql) printf '%s' 3 ;;
              node) printf '%s' 2 ;;
              dotnet|java) printf '%s' 1 ;;
              *) printf '%s' 1 ;;
            esac
          }
          cachefamily() {
            case "$1" in
              codeql-*) printf '%s' codeql ;;
              node-cache-*|Linux-node-*) printf '%s' node ;;
              Linux-dotnet*) printf '%s' dotnet ;;
              Linux-jdk*) printf '%s' java ;;
              *) printf '%s' other ;;
            esac
          }
          while IFS=$'\t' read -r cache_id accessed_at ref key; do
            test -n "$cache_id" || continue
            family="$(cachefamily "$key")"
            # the workflow_run scope: only the codeql family is eligible
            # when this firing answered a workflow completion; the other
            # families are skipped so a prompt cleanup never races a
            # still-in-flight lane that may be reading those blobs.
            if [ "${WORKFLOW_RUN_SCOPED}" = "true" ] && [ "$family" != "codeql" ]; then
              continue
            fi
            delete_reason=""
            if [ "$ref" = "$DEFAULT_REF" ]; then
              retained_count="${retained[$family]:-0}"
              if [ "$retained_count" -lt "$(cachelimit "$family")" ]; then
                retained[$family]=$((retained_count + 1))
                continue
              fi
              delete_reason="exceeds-${family}-limit-on-default-ref"
            else
              accessed_epoch="$(date --utc --date="$accessed_at" +%s)"
              if [ "$accessed_epoch" -gt "$cutoff_epoch" ]; then
                continue
              fi
              delete_reason="aged-nondefault-ref"
            fi
            printf 'candidate id=%s ref=%s family=%s reason=%s key=%s\n' "$cache_id" "$ref" "$family" "$delete_reason" "$key"
            if [ "$APPLY" = "true" ]; then
              # best-effort law (the 2.0.184 closure): a refused delete
              # (403/404, the token answering no actions write) notices
              # honestly and the loop walks on — the lane never reddens on
              # the cleanup, the seven-day cache auto-eviction the
              # backstop that keeps the storage bounded either way.
              gh api --method DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" || echo "::notice::cache id=${cache_id} refused the delete; the seven-day cache auto-eviction is the backstop."
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100&sort=last_accessed_at&direction=desc" --jq '.actions_caches[] | [.id, .last_accessed_at, .ref, .key] | @tsv')
          if [ "$APPLY" != "true" ]; then
            echo "Dry run complete; no cache was deleted."
          fi

      - name: Retain bounded registry buildcache versions
        # the GHCR cache law (the unlimited-buildcache ban the owner
        # ordered): the analysis repositories' buildcache images
        # (saddle-buildcache and e2ugh-buildcache) accumulate one version
        # per build with no ceiling — this pass keeps the newest three of
        # each and deletes the older versions through the org packages
        # api, riding the owner pat the maven retire carries (a refused
        # delete without the packages delete scope notices honestly and
        # never reddens the lane, the same best-effort law every retiring
        # write walks). the retired repository buildcache of this house
        # stays outside the loop by the 2.0.16 owner directive the
        # workflow contract pins: its build cache embeds inside the
        # workflow run, and its residual package deletion rides the
        # delete:packages scope the polar auth captures.
        shell: bash
        run: |
          set -euo pipefail
          keep=3
          for image in saddle-buildcache e2ugh-buildcache; do
            echo "::group::buildcache ${image}"
            ids="$(gh api --paginate "orgs/wenathlan/packages/container/${image}/versions?per_page=100" --jq '.[].id' 2>/dev/null || true)"
            if [ -z "${ids}" ]; then
              echo "no versions answered for ${image}; the lane walks on."
              echo "::endgroup::"
              continue
            fi
            count="$(printf '%s\n' ${ids} | wc -l)"
            echo "${image} answers ${count} versions; the retention keeps the newest ${keep}."
            if [ "${count}" -gt "${keep}" ]; then
              printf '%s\n' ${ids} | tail -n +"$((keep + 1))" | while read -r version_id; do
                test -n "${version_id}" || continue
                if gh api --method DELETE "orgs/wenathlan/packages/container/${image}/versions/${version_id}" 2>/dev/null; then
                  echo "deleted ${image} version ${version_id}"
                else
                  echo "::notice::${image} version ${version_id} refused the delete (the token answers no delete:packages); the retention walks on."
                fi
              done
            fi
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------
  # THE ABSORBED PACKAGE CLEANUP LANE (the 2.0.16 grouping pass): the
  # retire job lived as its own workflow file (DevThink Package Cleanup,
  # manual dispatch only); it carries the same correlated logic this file
  # owns - the repository maintenance surface - so it rides as a job of
  # the DevThink Maintenance workflow now, on the same manual dispatch
  # input the standalone file declared.
  retire:
    name: Retire the merged maven packages the single distribution replaced
    # the maintain-versions group the ladder serializes under.
    concurrency:
      group: maintain-versions
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # least-privilege (the 2.0.184 scorecard closure): the package deletes
    # below ride the owner pat (the same token the npm publish lanes hold
    # write:packages with), so the github token answers the version list
    # read alone — every delete below already answers best-effort (the
    # honest status echo, never a red).
    permissions:
      packages: read
    steps:
      - name: Retire the split maven coordinates the single distribution replaced
        env:
          # least-privilege (the 2.0.184 scorecard closure): the deletes
          # ride the owner pat — the github token standing in when the
          # secret does not — the way every retiring write of the house
          # now does.
          GITHUB_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          TARGETS: ${{ inputs.packages }}
        run: |
          set -u
          for target in ${TARGETS//,/ }; do
            echo "retiring ${target}"
            status=$(curl -s -o body.txt -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/maven/${target}")
            echo "package delete answered ${status}"
            if [ "${status}" != "204" ] && [ "${status}" != "404" ]; then
              cat body.txt || true
              echo "falling back to version by version retirement"
              page=1
              while :; do
                curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  "https://api.github.com/user/packages/maven/${target}/versions?per_page=100&page=${page}" > versions.json
                count=$(python3 -c "import json;d=json.load(open('versions.json'));print(len(d) if isinstance(d,list) else 0)")
                if [ "${count}" = "0" ]; then break; fi
                python3 -c "import json;d=json.load(open('versions.json'));[print(v['id']) for v in d]" | while read -r id; do
                  code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                    -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/user/packages/maven/${target}/versions/${id}")
                  echo "version ${id} of ${target} answered ${code}"
                done
                page=$((page + 1))
              done
            fi
            echo "coordinate ${target} retired or absent (the single distribution replaces it)"
          done
          echo "the single distribution com.wenathlan.devthink is the only maven coordinate"

  stale:
    # the dormant-thread lane (the automation category pass): an issue or
    # a pull request that went ninety days without a word carries no
    # signal the tree can act on, so the daily sweep marks it stale and
    # closes it fourteen quiet days later - any comment or push removes
    # the mark the moment it lands, and the exempt labels (the pinned,
    # security and planned seats the owner holds threads open with) keep
    # the deliberate threads outside the clock. The lane answers the
    # 47 5 * * * window alone, so the ladder firings and the cache passes
    # never queue behind it.
    if: github.event_name == 'schedule' && github.event.schedule == '47 5 * * *'
    name: Mark the dormant issues and pull requests stale
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # the lane's own group (the labeler pattern): a stale pass never
      # queues behind the dependency ladder the maintain-versions group
      # serializes, and a draining pass is never cancelled mid-batch.
      group: devthink-stale
      cancel-in-progress: false
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Sweep the dormant issues and pull requests
        # the exact-version pin (Regra 56a/125: one version per action in
        # every workflow, never the bare moving @v11 major tag).
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # ninety quiet days before the mark, fourteen more before the
          # close - a generous clock that never rushes a live thread.
          days-before-stale: 90
          days-before-close: 14
          # the bounded pass: at most sixty threads a day, so a backlog
          # drains over a few passes without hammering the api.
          operations-per-run: 60
          # the mark leaves the moment a thread wakes (the action
          # default, stated so the law reads whole).
          remove-stale-when-updated: true
          # a draft pull request is work in flight, never dormancy.
          exempt-draft-pr: true
          # the exempt seats: a thread the owner pins, a security report
          # the battery owns, a planned item the roadmap carries.
          exempt-issue-labels: pinned,security,planned
          exempt-pr-labels: pinned,security,planned
          stale-issue-message: >-
            this issue has gone ninety days without a reply - the
            maintenance lane marks it stale. any comment removes the mark
            at once, and fourteen more quiet days close the thread; an
            issue that still matters reopens any time, nothing is lost.
          close-issue-message: >-
            the stale window ran out: ninety quiet days, then fourteen
            more after the mark. the lane closes the thread unmanned - if
            the issue still stands, reopen it with a word and the clock
            starts clean.
          stale-pr-message: >-
            this pull request has gone ninety days without a push or a
            reply - the maintenance lane marks it stale. any commit or
            comment removes the mark at once, and fourteen more quiet
            days close the change; the branch stays yours and a reopened
            pull request rides the same verify ladder whole.
          close-pr-message: >-
            the stale window ran out: ninety quiet days, then fourteen
            more after the mark. the lane closes the change unmanned -
            the branch stays yours, and a reopened pull request runs the
            full verify ladder again.

  label:
    # the absorbed labeler lane (the consolidation pass): the pull request
    # labels follow the folders the change touches, one label per family
    # application plus the infrastructure lanes the workflows live in. The
    # job answers the pull_request_target firing alone - the maintenance
    # schedules and the security-completion chain skip it - and carries its
    # own concurrency group so a labeling pass never queues behind the
    # dependency ladder the maintain-versions group serializes.
    name: Label the pull request by the folders it touches
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: devthink-labeler-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label the pull request from the changed files
        # the label config lives inside the workflows folder beside the
        # workflow that reads it (the house rule: every workflow yaml stays
        # grouped under one folder).
        uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6.0.1
        with:
          configuration-path: .github/workflows/labeler-config.cfg

  greet:
    # the first-interaction lane (the automation category pass): the first
    # issue or the first pull request an author ever opens against the
    # tree answers one orientation comment naming the lanes the change
    # rides (the labeler that routes the folders, the verify pipeline
    # every pull request runs), so a first seat never opens onto silence.
    # The action reads the author's whole history before it speaks, so
    # the lane stays silent for every familiar seat, and it answers the
    # opened action alone - never the synchronize or reopened firings the
    # labeler lane shares the trigger with.
    if: (github.event_name == 'pull_request_target' || github.event_name == 'issues') && github.event.action == 'opened'
    name: Greet the first-time contributor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # the lane's own group (the labeler pattern): a greeting never
      # queues behind the dependency ladder the maintain-versions group
      # serializes, and a superseded firing of the same thread cancels.
      group: devthink-greet-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Greet the first issue or the first pull request
        # the exact-version pin (Regra 56a/125: one version per action in
        # every workflow, never the bare moving @v3 major tag).
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: >-
            thank you for the first issue against the devthink tree. the
            family publishes eleven applications and reads every seat -
            the more the issue names (the app, the version, the steps to
            reproduce), the faster the fix rides the ladder.
          pr_message: >-
            thank you for the first change against the devthink tree.
            the labeler has already routed the folders this pull request
            touches, and the verify pipeline - the full gate ladder of
            the family - runs on every push: a red names its gate, and
            the ladder lands only green.

  npmtag:
    # the dist-tag heal lane (the owner report of the stale latest): the
    # emergency train of the poisoned 2.1.6 line published 2.1.7 and 2.1.8
    # straight to the registry without the maene realignment the release
    # ladder carries, so every family package answers `npm install` with a
    # rung many versions behind. this lane pins latest back to the version
    # the envelopes ship - the same doctrine the publish lanes stamp, as a
    # dispatch the operator can fire any time the registry drifts.
    name: Realign the npmjs latest dist-tags of the family
    if: github.event_name == 'workflow_dispatch'
    # the maintain-versions group the ladder serializes under.
    concurrency:
      group: maintain-versions
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup node
        # the registry-url is the seat the auth ride needs: setup-node
        # writes the .npmrc that maps NODE_AUTH_TOKEN to the registry —
        # without it every dist-tag write answers E401.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: arm the npm token
        # the same graceful gate the publish lanes carry: no token, no
        # publish attempt - the lane reports and exits green.
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token="${RAW_NPM_TOKEN//$'\r'/}"
          if [ -z "${token}" ]; then
            echo "::notice::Secret NPM_TOKEN is not configured; the dist-tag heal is skipped."
            echo "NPMTAG_ARMED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf 'NODE_AUTH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo "NPMTAG_ARMED=true" >> "$GITHUB_ENV"
      - name: realign the eleven latest dist-tags
        # the realign answers the honest rung each app manifest carries
        # live at dispatch time (the dynamic rung law the registryheal
        # lane owns) — NEVER the semver-highest version the registry
        # holds: the stale 2.1.x emergency era sits semver-above the
        # current 2.0.x line forever, so a highest-version realign
        # resurrects the poisoned envelopes every dispatch (the 00:24
        # regression the heal raced) while the manifest rung keeps the
        # latest tag riding the version cascade the tree actually ships.
        # the registry check below guards the chicken-and-egg: the rung
        # the manifest names must already exist on npmjs before the tag
        # moves, and a manifest rung the registry never carried keeps its
        # seat with a notice instead of a failing write.
        if: env.NPMTAG_ARMED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for package in argan cadria cobaia debonair devthink forge foundry getry saddle stealthhead vault; do
            rung="$(node -p "require('./${package}/package.json').version" 2>/dev/null || true)"
            if [ -z "${rung}" ]; then
              echo "::notice::the ${package} manifest answers no version; its dist-tag keeps its seat."
              continue
            fi
            if ! npm view "@wenathlan/${package}@${rung}" version >/dev/null 2>&1; then
              echo "::notice::@wenathlan/${package}@${rung} answers no registry envelope yet; its dist-tag keeps its seat."
              continue
            fi
            current="$(npm view "@wenathlan/${package}" dist-tags.latest || echo absent)"
            if [ "${current}" = "${rung}" ]; then
              echo "the latest tag of ${package} already answers ${rung} — skipping"
              continue
            fi
            npm dist-tag add "@wenathlan/${package}@${rung}" latest
            echo "the latest dist-tag of ${package} moved from ${current} to ${rung} (the ${package} manifest rung)."
          done

  heal:
    # THE EMERGENCY REGISTRY LANE: the 2.1.7 envelopes the publish wave
    # stamped from the stale v2.1.7 tag (a tag cut before twenty-one rungs
    # landed on main) shipped broken tarballs — the saddle envelope declares
    # the dist entry points the package never carries, so every consumer the
    # caret range resolves answers "Cannot find module". The unpublish lane
    # the first heal carried answered E403 (the granular token that bypasses
    # two-factor authentication may never unpublish), so the heal moves the
    # latest dist-tag of every poisoned package back to the last honest rung
    # the manifests of main already resolve — the rung reads each app's own
    # package.json live at dispatch time (the dynamic rung law: the emergency
    # era froze 2.0.154 in the script and the frozen pin regressed every later
    # rung — the heal reads the synchronized manifest instead, so the honest
    # rung rides the version cascade and the lane never lags the curve). The ladder then walks the ordinary flow: the
    # maintenance rung derives the next rung, the release cuts the tag from
    # the healed main, and the publish answers envelopes the tree actually
    # builds — the fresh latest supersedes every caret range the same hour.
    #
    # The lane is dispatch-only, owner-gated through the release-approval
    # environment, and answers one idempotent pass: a dist-tag already
    # pointing at the honest rung is a green skip, never a failure.
    name: move the latest dist-tags back to the honest rungs
    # the dispatch-only seat the standalone lane owned, confirm-gated:
    # the heal answers the manual dispatch that types healtags alone -
    # the routine maintenance dispatches (the ladder, the cache passes,
    # the records) never redden the refusal step the lane carries.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'healtags'
    concurrency:
      group: registry-heal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-approval
    steps:
      - name: Refuse the accidental dispatch
        if: github.event.inputs.confirm != 'healtags'
        run: |
          echo "The confirm input must read healtags (the lane refuses to run by accident)."
          exit 1
      - name: Check out the synchronized manifests
        # the dynamic rung law: the honest rung reads the app manifests of
        # main at dispatch time, so the heal needs the working tree (the
        # pinned family checkout the release lanes carry).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Move every poisoned latest back to the honest rung, idempotently
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          heal() {
            package="$1"
            honest="$(node -p "require('./${package}/package.json').version")"
            test -n "$honest"
            echo "::group::@wenathlan/$package latest -> $honest (the ${package} manifest rung)"
            current="$(npm view "@wenathlan/$package" dist-tags.latest || echo absent)"
            if [ "$current" = "$honest" ]; then
              echo "the latest tag already answers $honest — skipping"
            else
              npm dist-tag add "@wenathlan/$package@$honest" latest
              echo "moved @wenathlan/$package latest from $current to $honest"
            fi
            echo "::endgroup::"
          }
          # the full eleven: cobaia and getry join the heal set (the report
          # loop already walked them — a heal that skips a published seat
          # leaves the poison the lane exists to clear).
          for package in argan cadria cobaia debonair devthink forge foundry getry saddle stealthhead vault; do
            heal "$package"
          done
      - name: Report the healed dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for package in argan cadria cobaia debonair devthink forge foundry getry saddle stealthhead vault; do
            latest="$(npm view "@wenathlan/$package" dist-tags.latest || echo absent)"
            echo "@wenathlan/$package latest = ${latest}"
          done

  records:
    # the one-shot rung records lane: a manual rung that lands by hand (the
    # security closure rung 2.0.182) carries the same re-stamp the automated
    # ladder performs before its pull request — the build, the re-frozen
    # apifreeze artifact, the recorded permission baseline and the twelve
    # certification records — executed on the runner the local seats cannot
    # seat (the 14,500-package tree the sandbox memory cannot hold). the lane
    # runs on the dispatched ref, commits the re-stamped records back to the
    # same ref and leaves the pull request wave to the owner's merge law.
    name: Re-stamp the certification records at the rung
    # the one-shot rung records lane stays dispatch-only (the mission
    # guard): the schedules, the security completions and the issue
    # firings of the merged file never reach the re-stamp walk.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the rung branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # the credentials never persist (the least-privilege law above):
          # the commit step pushes over an explicit owner-pat remote, and a
          # persisted job token would answer a second authorization header
          # the wire refuses.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # the repo-declared Node line (the family runtime doctrine,
          # Regra 54: never the mutable `node`/latest alias)
          node-version-file: devthink/.nvmrc

      - name: Install the locked tree
        # the ladder lanes never touch the native sqlite binding: the
        # scripts stay off so the frozen install never rides the prebuild
        # mirror or the broken bunx node-gyp fallback the flaky lanes hit
        # — the prisma client the validation reads generates inside
        # build.ts itself.
        run: cd devthink && bun install --frozen-lockfile --ignore-scripts

      - name: Build the tree the records read
        run: cd devthink && node build.ts

      - name: Re-freeze the apifreeze artifact and record the permission baseline
        run: |
          set -euo pipefail
          cd devthink
          bun run apifreeze:sync
          bun run permdiff:sync

      - name: Re-stamp the certification records at the rung
        # the sweep seat walks FIRST (the matrixverify cell of the chain
        # reads the committed sweep record and refuses a record that
        # still stamps the previous rung), then the full chain re-stamps
        # the rest — the same order the automated ladder carries.
        run: cd devthink && node sweep.ts sync && bun run records:sync

      - name: Commit the re-stamped records to the rung branch
        # least-privilege (the 2.0.184 scorecard closure): the github
        # token answers read alone now, so the push rides the owner pat
        # over the explicit authenticated remote — the github token
        # standing in when the secret does not.
        env:
          OWNER_PAT: ${{ secrets.OWNER_PAT || github.token }}
        run: |
          set -euo pipefail
          git config user.name "iakadion"
          git config user.email "iakadion@users.noreply.github.com"
          if git diff --quiet; then
            echo "the records already answer the rung — nothing to commit"
          else
            git add -A
            git commit -m "release: the 2.0.182 rung records — the certification seats answer the fresh rung whole (the build, the re-frozen apifreeze artifact, the recorded permission baseline and the twelve gate records the validation suite reads)"
            git push "https://x-access-token:${OWNER_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"${GITHUB_REF_NAME}"
          fi
