name: DevThink Labeler

# the pull request labeler of the actions catalog: the labels follow the
# folders the change touches, one label per family application plus the
# infrastructure lanes the workflows live in.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label the pull request by the folders it touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label the pull request from the changed files
        # the label config lives inside the workflows folder beside the
        # workflow that reads it (the house rule: every workflow yaml stays
        # grouped under one folder).
        uses: actions/labeler@v6.0.1
        with:
          configuration-path: .github/workflows/labeler-config.yml
