name: Family Configs

# THE CONFIG PARITY GATE OF THE FAMILY: every app root carries the standard
# set of framework configs and the biome baseline rides byte identical
# across the family, so this gate runs the parity script of the os app over
# every app folder and fails the pipeline on the first drift. the gate
# makes the standardization enforced by the build instead of by memory, and
# the identity fields of each app stay free because the script compares
# only the set presence and the byte identical files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: config parity across the family
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: run the config parity gate
        working-directory: devthink
        run: node tests/configparity.mjs
