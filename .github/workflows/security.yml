name: DevThink Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # the event-scoped group (the family concurrency doctrine, Regra 52):
  # push, pull_request, release, schedule and dispatch firings are distinct
  # lanes that run side by side - an event-scoped group keeps a superseded
  # firing of the SAME event and ref queued behind the running one without
  # ever cancelling a sibling lane (cancel-in-progress stays false).
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-24.04
    # every job carries its own ceiling (the family contract): the review
    # gate is a quick lane.
    timeout-minutes: 15
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: low

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.22.0
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.2
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install workbench dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Audit resolved workbench dependencies
        shell: bash
        run: |
          mkdir -p build/security
          set +e
          pnpm --dir web audit --audit-level=low --json > build/security/pnpm-audit.json
          status=$?
          set -e
          # The exit file records the audit verdict, never a quirk of the
          # process status: pnpm answers non-zero both for advisories at or
          # above the low gate and for transport failures whose output
          # carries no report at all, so the verdict derives from the
          # recorded json — zero only when the resolved workbench graph is
          # clean — and an unusable report keeps the gate red no matter
          # what the process answered.
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const status = Number(process.argv[1]);
            let verdict = 1;
            try {
              const report = JSON.parse(fs.readFileSync("build/security/pnpm-audit.json", "utf8"));
              const counts = report?.metadata?.vulnerabilities ?? {};
              const actionable = (counts.low ?? 0) + (counts.moderate ?? 0) + (counts.high ?? 0) + (counts.critical ?? 0);
              if (actionable > 0) {
                console.error(`The workbench audit reports ${actionable} advisories at or above the low severity gate.`);
                verdict = 1;
              } else {
                console.error(`The workbench audit reports no advisories at or above the low severity gate (pnpm status ${status}).`);
                verdict = 0;
              }
            } catch {
              console.error(`The audit report did not parse; the gate stays red (pnpm status ${status}).`);
              verdict = 1;
            }
            fs.writeFileSync("build/security/pnpm-audit.exit", `${verdict}\n`);
          ' "$status"
          printf 'pnpm audit answered status %s; the gate verdict is %s.\n' "$status" "$(cat build/security/pnpm-audit.exit)"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink.security.pnpm-audit
          path: build/security/pnpm-audit.*
          if-no-files-found: error
      - name: Enforce audit gate
        run: test "$(cat build/security/pnpm-audit.exit)" = "0"

  detect-desktop-source:
    name: Detect optional desktop source
    runs-on: ubuntu-24.04
    # the existence probe is a fast lane (checkout plus a file test).
    timeout-minutes: 10
    outputs:
      present: ${{ steps.desktop.outputs.present }}
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Detect Cargo desktop manifest
        id: desktop
        shell: bash
        run: |
          if test -f desktop/Cargo.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  rust-audit:
    needs: detect-desktop-source
    if: needs.detect-desktop-source.outputs.present == 'true'
    name: Optional desktop cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Set up Rust
        # the pinned toolchain (the family runtime doctrine, Regra 54/125:
        # never the moving `@stable` channel): the version branch is the
        # action's immutable per-release ref (verified via the GitHub
        # repository's branch list) - the lane is the optional desktop
        # audit, so the pin rides the current stable Rust release.
        uses: dtolnay/rust-toolchain@1.120
      - name: Install cargo audit
        run: cargo install cargo-audit --locked
      - name: Resolve and audit desktop graph
        shell: bash
        run: |
          mkdir -p build/security
          (cd desktop && cargo generate-lockfile && cargo audit --json) > build/security/cargo-audit.json
      - name: Upload cargo audit evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink.security.cargo-audit
          path: build/security/cargo-audit.json
          if-no-files-found: error

  osv:
    name: OSV scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      fail-on-vuln: true
      scan-args: |-
        --recursive
        ./
    permissions:
      actions: read
      contents: read
      security-events: write

  secret-scan:
    name: Verified secret scan
    runs-on: ubuntu-24.04
    # the full-history trufflehog pass is an audit lane: bounded, with the
    # headroom a deep history walk needs.
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          extra_args: --results=verified

  filesystem-scan:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-24.04
    # the trivy three-scanner lane carries the family scan ceiling (the
    # saddle container-scan family value).
    timeout-minutes: 30
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink.security.trivy
          path: trivy-results.sarif
          if-no-files-found: warn
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: trivy-results.sarif

  biome-security:
    # the saddle security-lane feature: the biome security rule group
    # (noSecrets, noGlobalEval, noDangerouslySetInnerHtml, ...) runs as its
    # own isolated gate at blocking severity, independent of the severity
    # tuning the project's own biome.json carries for the style lanes.
    name: Biome security rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BIOME_VERSION: "2.5.13"
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.2
      - name: Run biome security rule group
        shell: bash
        run: |
          set -euo pipefail
          # isolated configuration that elevates the Biome security group
          # to blocking severity, independent of the severity tuning in the
          # project's own biome.json. the overrides encode the family
          # policy adapted to the merged tree:
          #   - TypeScript/JavaScript sources are scanned at info level
          #     because the engine API legitimately declares camelCase
          #     identifiers such as secretRef and privateKeyStore that
          #     trip the noSecrets heuristic; secret material itself never
          #     lives in source files.
          #   - configuration payloads (.json, .yml, .yaml, .toml, .env)
          #     remain at blocking error severity: real secrets would land
          #     there.
          #   - the integrity hashes of every lockfile of the family (the
          #     root bun.lock, the web pnpm lock, any package-lock) answer
          #     noSecrets as candidate material and are excluded the same
          #     way saddle excludes package-lock.json.
          #   - the merged engine rides one 1.5 MiB background.ts, so the
          #     scan root lifts files.maxSize to 2 MiB: the default 1 MiB
          #     ceiling answered the grand merge's single-file engine as a
          #     warning, and --error-on-warnings promotes that size notice
          #     to a blocking failure.
          #   - web/design.html stays out of the scan root: the design
          #     reference carries inert template fragments whose inline
          #     script markup is not executable source (the house tests
          #     read the file as text), and the biome html parser answers
          #     those fragments as parse errors.
          # the css sheets stay out of the security scan (the tailwind 4
          # at-rules of web/index.css carry no secret surface and the
          # biome css parser does not gate this rule group); the built
          # trees (web/dist, distpackage) and the workbench node_modules
          # stay out of the scan root.
          mkdir -p build/security/biome
          cat > build/security/biome/biome.json <<'EOF'
          {
            "$schema": "https://biomejs.dev/schemas/2.5.13/schema.json",
            "linter": {
              "rules": {
                "security": {
                  "noSecrets": { "level": "info" }
                }
              }
            },
            "files": {
              "includes": ["**", "!**/*.css", "!**/web/dist/**", "!**/build/**", "!**/dist/**", "!**/distpackage/**", "!**/node_modules/**", "!**/web/node_modules/**", "!**/web/design.html"],
              "maxSize": 2097152
            },
            "overrides": [
              {
                "includes": ["**/*.json", "**/*.yml", "**/*.yaml", "**/*.toml", "**/.env", "**/.env.*", "!**/package-lock.json", "!**/bun.lock", "!**/web/pnpm-lock.yaml", "!**/web/package.json", "!**/package.json", "!**/deno.lock"],
                "linter": {
                  "rules": {
                    "security": {
                      "noSecrets": { "level": "error" }
                    }
                  }
                }
              }
            ]
          }
          EOF
          npx --yes "@biomejs/biome@${BIOME_VERSION}" lint \
            --only=security --error-on-warnings \
            --config-path=build/security/biome .

  license-check:
    # the gateway family license gate ported to the merged tree (the
    # e2ugh and saddle security lanes carry the same battery): the
    # repository license must exist and be non-empty (GPL-3.0-only, the
    # label the runtime image carries), and the runtime dependency tree
    # the bun lockfile pins answers the allow list — a copyleft or
    # unlicensed transitive dependency never rides the published package.
    # the list carries the permissive OSI set of the gateway lineage plus
    # the two family facts of the merged tree: the devthink package
    # itself answers GPL-3.0-only (the project license, OSI approved and
    # the label the runtime image declares), and elkjs answers EPL-2.0
    # (the graph layout engine, OSI approved with the secondary license
    # exception the eclipse foundation carries). the web workbench
    # declares no runtime dependencies (its lockfile pins the build
    # toolchain alone), so the root tree is the production surface the
    # checker walks.
    name: License compliance check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify repository license file
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s LICENSE ]; then
            echo '::error::LICENSE file is missing at the repository root; the GPL-3.0-only license is part of the release contract the runtime image label declares.'
            exit 1
          fi
          echo 'Repository license header:'
          head -3 LICENSE
      - name: Check npm dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          # Deny copyleft and unlicensed runtime dependencies: only the
          # allow list passes — the permissive OSI set of the gateway
          # lineage plus the project license itself (GPL-3.0-only) and
          # the EPL-2.0 engine the merged tree legitimately rides.
          dep_count=$(node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log(Object.keys(p.dependencies ?? {}).length)")
          if [ "$dep_count" -eq 0 ]; then
            echo 'No runtime dependencies declared; the npm license check passes trivially.'
            exit 0
          fi
          echo "Checking licenses of ${dep_count} runtime dependency tree(s):"
          # The committed bun.lock pins the tree; the production install
          # materializes exactly that surface (a lockfile-pinned install,
          # no floating resolution) so license-checker can walk it.
          bun install --frozen-lockfile --production
          npx --yes license-checker@25.0.1 --production \
            --onlyAllow="MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;CC0-1.0;CC-BY-4.0;Zlib;Python-2.0;BlueOak-1.0.0;MPL-2.0;GPL-3.0-only;EPL-2.0;(MIT OR CC0-1.0);ISC*" \
            --summary

  container-scan:
    # the saddle security-lane feature (the VM-less half): the container
    # image gates run on every push and schedule, not only at publish time -
    # build the runtime target, lint it with dockle, scan it with trivy,
    # upload the sarif report to code scanning and gate on critical
    # vulnerabilities. informational scans (continue-on-error): the
    # authoritative hard gates live in the publish ghcr lane at release
    # time; a transient scanner outage must never redden this pipeline and
    # stall the maintenance ladder that fires on this workflow's success.
    name: Container image scan (dockle and trivy)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # required to upload the Trivy SARIF report to code scanning
      security-events: write
      # the registry buildkit cache push (the shared buildcache image)
      packages: write
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Login ghcr (registry cache)
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for scanning
        # the scan stays single-platform: a loadable linux/amd64 image
        # (GitHub-hosted runners cannot load a multi-platform image into
        # the default local image store), reading the registry buildcache
        # the publish lane warms so the security scan rides the same
        # layer chain the release publishes.
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: devthink-security-scan:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/devthink-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/devthink-buildcache,mode=max
      - name: Scan image with dockle (container best practices)
        # the dockle gate of the publish lane repeated at push time over
        # the same runtime target: only FATAL findings fail the scan (WARN
        # items are reported), and the accept-key list is the publish
        # lane's own tuned list verbatim - it whitelists exactly this
        # runtime target's ENV/ARG/LABEL keys, the smoke-boot loop
        # variables and the node slim base layer internals the CIS-DI-0010
        # heuristic misreads as credential holders (none are secrets, and
        # the scanner only reports the first unaccepted match per layer).
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: devthink-security-scan:latest
          exit-code: "1"
          exit-level: FATAL
          accept-key: NODE_ENV,DEVTHINK_HTTP_BIND,DEVTHINK_HTTP_PORT,DEVTHINK_RELAY_PATH,DEVTHINK_MCP_BIND,DEVTHINK_MCP_PORT,DEVTHINK_MCP_PATH,DEVTHINK_MEMORY_ENGINE,DEVTHINK_PLATFORM,DEVTHINK_CDN_URL,NODE_IMAGE,DEVTHINK_VERSION,DEVTHINK_REVISION,PATH,NODE_VERSION,runnerpid,waited,smokebudget,dpkgArch,ARCH,OPENSSL_ARCH,GNUPGHOME,--strip-components,--chown,/,APT::AutoRemove::RecommendsImportant,org.opencontainers.image.title,org.opencontainers.image.description,org.opencontainers.image.documentation,org.opencontainers.image.version,org.opencontainers.image.licenses,org.opencontainers.image.source,org.opencontainers.image.revision
      - name: Scan image with trivy (sarif report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devthink-security-scan:latest
          format: sarif
          output: trivy-container.sarif
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload trivy report to code scanning
        # fork pull requests run with a read-only token and cannot upload.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container
      - name: Gate on critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devthink-security-scan:latest
          format: table
          severity: CRITICAL
          scanners: vuln
          ignore-unfixed: true
          # non-zero exit code fails the job when critical CVEs exist.
          exit-code: "1"

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-24.04
    # the syft bill-of-materials pass is an audit lane with its own
    # ceiling.
    timeout-minutes: 15
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7.0.1
      - name: Prepare SBOM directory
        run: mkdir -p build/security
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: build/security/devthink.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devthink.security.sbom
          path: build/security/devthink.sbom.cdx.json
          if-no-files-found: error

  cleanup:
    # the e2ugh cleanup-after-workflow contract restored from the saddle
    # security lane: when the security pipeline finishes, the gha caches IT
    # created are deleted so nothing lingers (the registry buildcache
    # stays - it is the durable layer chain the next runs rebuild from).
    needs: [container-scan, sbom]
    if: always() && github.event_name == 'push'
    name: Clean this run's caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete the caches this pipeline created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          deleted=0
          while IFS=$'\t' read -r cache_id cache_key; do
            test -n "$cache_id" || continue
            if gh api --method DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" 2>/dev/null; then
              deleted=$((deleted + 1))
              echo "deleted cache id=${cache_id} key=${cache_key}"
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | startswith("buildkit")) | [.id, .key] | @tsv')
          echo "run ${RUN_ID} cleanup: deleted ${deleted} buildkit gha caches."
