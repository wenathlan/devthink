name: DevThink Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-24.04
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install workbench dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Audit resolved workbench dependencies
        shell: bash
        run: |
          mkdir -p build/security
          set +e
          pnpm --dir web audit --audit-level=low --json > build/security/pnpm-audit.json
          status=$?
          set -e
          printf '%s\n' "$status" > build/security/pnpm-audit.exit
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devthink.security.pnpm-audit
          path: build/security/pnpm-audit.*
          if-no-files-found: error
      - name: Enforce audit gate
        run: test "$(cat build/security/pnpm-audit.exit)" = "0"

  detect-desktop-source:
    name: Detect optional desktop source
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.desktop.outputs.present }}
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7
      - name: Detect Cargo desktop manifest
        id: desktop
        shell: bash
        run: |
          if test -f desktop/Cargo.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  rust-audit:
    needs: detect-desktop-source
    if: needs.detect-desktop-source.outputs.present == 'true'
    name: Optional desktop cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo audit
        run: cargo install cargo-audit --locked
      - name: Resolve and audit desktop graph
        shell: bash
        run: |
          mkdir -p build/security
          (cd desktop && cargo generate-lockfile && cargo audit --json) > build/security/cargo-audit.json
      - name: Upload cargo audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devthink.security.cargo-audit
          path: build/security/cargo-audit.json
          if-no-files-found: error

  osv:
    name: OSV scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    with:
      fail-on-vuln: true
      scan-args: |-
        --recursive
        ./
    permissions:
      actions: read
      contents: read
      security-events: write

  secret-scan:
    name: Verified secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --results=verified

  filesystem-scan:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@v7
      - name: Prepare SBOM directory
        run: mkdir -p build/security
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.20.5
        with:
          path: .
          format: cyclonedx-json
          output-file: build/security/devthink.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: devthink.security.sbom
          path: build/security/devthink.sbom.cdx.json
          if-no-files-found: error
