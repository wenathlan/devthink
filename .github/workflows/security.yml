name: DevThink Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    # the monday 03:17 window the security battery and the scorecard lane
    # share (the merged file dedupes the two cron entries the standalone
    # files declared for the same minute)
    - cron: "17 3 * * 1"
    # the wednesday 04:25 window the absorbed codeql lane keeps (off-peak
    # from the monday battery)
    - cron: "25 4 * * 3"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # the event-scoped group (the family concurrency doctrine, Regra 52):
  # push, pull_request, release, schedule and dispatch firings are distinct
  # lanes that run side by side - an event-scoped group keeps a superseded
  # firing of the SAME event and ref queued behind the running one without
  # ever cancelling a sibling lane (cancel-in-progress stays false).
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-24.04
    # every job carries its own ceiling (the family contract): the review
    # gate is a quick lane.
    timeout-minutes: 15
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # the documented upstream-blocked seat the osv battery carries
          # in its own grammar: the picomatch ReDoS advisory
          # (GHSA-fc5q-39xc-vjpf / CVE-2026-112366) has no fixed release
          # upstream today — the vulnerable range spans every rung through
          # 4.0.7, the latest the registry carries — so every tree the
          # eleven bun locks resolve stays inside the range no matter the
          # bump. the row retires the moment upstream ships a patched rung
          # (the same unfreeze law the osv-scanner.toml row documents).
          allow-ghsas: GHSA-fc5q-39xc-vjpf

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # THE PACKAGEMANAGER LAW (the 2026-11-18 cure): the version input
        # stays empty so the packageManager stamp the root manifest carries
        # is the single source of truth - the immutable tag envelopes (the
        # 2.0.185 rung cut before the pnpm ladder walked) and the main head
        # both answer their own stamp without the multiple-versions conflict
        # the action-setup refused (version input vs packageManager key).
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: devthink/bun.lock
      - name: Set up bun
        # the devthink application pins bun (packageManager bun@1.4.2), so the
        # install rides bun directly and the frozen bun.lock governs the graph.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install workbench dependencies
        run: cd devthink && bun install --frozen-lockfile --ignore-scripts
      - name: Audit resolved workbench dependencies
        shell: bash
        run: |
          mkdir -p build/security auditwork
          # the audit resolves the dependency graph in a neutral folder: the
          # devthink application pins bun as its package manager and pnpm
          # refuses to answer audit inside a project pinned to another
          # manager, so the manifest travels to the audit folder with the
          # manager pin stripped and pnpm resolves and audits there — the
          # audited dependency ranges stay the workbench manifest's own.
          # the workbench overrides travel with it: pnpm 10+ reads the
          # overrides from pnpm-workspace.yaml alone (the manifest's pnpm
          # section is no longer read), so they materialize as the workspace
          # file of the audit folder and the audited graph resolves the same
          # patched versions the frozen bun.lock pins.
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("devthink/package.json", "utf8"));
            delete manifest.packageManager;
            fs.writeFileSync("auditwork/package.json", JSON.stringify(manifest, null, 2) + "\n");
            const overrides = manifest.overrides ?? {};
            // the override union the manifestemplate wave stamps carries
            // the @-scoped names (@grpc/grpc-js and its seats) and the @
            // sign is a reserved YAML indicator a bare key may never open
            // with — every name materializes as a quoted key, and the one
            // object-valued seat (the xcode uuid pin) answers in the
            // scoped "parent>child" selector form the pnpm workspace
            // schema reads, so the audit folder stays valid YAML the same
            // way the manifest itself stays valid JSON under its quoting.
            const lines = Object.keys(overrides).map(function (name) {
              const value = overrides[name];
              if (value !== null && typeof value === "object") {
                // the object-valued seat (the xcode uuid pin) answers in
                // the scoped selector form the pnpm workspace schema reads —
                // the "parent>child" key carries the same meaning the npm
                // nested override block stamps, and the string scalar the
                // schema demands stays the value both forms pin.
                return Object.keys(value).map(function (key) {
                  return "  " + JSON.stringify(name + ">" + key) + ": " + JSON.stringify(value[key]);
                }).join("\n");
              }
              return "  " + JSON.stringify(name) + ": " + JSON.stringify(value);
            }).filter(function (line) { return line.length > 0; });
            // the dedupe law the family mirror answers: two override
            // seats that expand to the same workspace key (the literal
            // selector form and the object form of one pin) would fold
            // into a duplicated yaml mapping the resolver refuses, so
            // the generator keeps one seat per key — the last write
            // wins exactly the way the manifest merge intends.
            const seated = new Map();
            for (const line of lines) {
              const key = line.slice(0, line.indexOf(":"));
              seated.set(key, line);
            }
            fs.writeFileSync("auditwork/pnpm-workspace.yaml", "overrides:\n" + [...seated.values()].join("\n") + "\n");
          '
          pnpm --dir auditwork install --lockfile-only
          set +e
          pnpm --dir auditwork audit --audit-level=low --json > build/security/pnpm-audit.json
          status=$?
          set -e
          # The exit file records the audit verdict, never a quirk of the
          # process status: pnpm answers non-zero both for advisories at or
          # above the low gate and for transport failures whose output
          # carries no report at all, so the verdict derives from the
          # recorded json — zero only when the resolved workbench graph is
          # clean — and an unusable report keeps the gate red no matter
          # what the process answered.
          # the single quotes guard the JS template literals of the node
          # program from shell expansion; the dollar braces belong to JS.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const status = Number(process.argv[1]);
            let verdict = 1;
            try {
              const report = JSON.parse(fs.readFileSync("build/security/pnpm-audit.json", "utf8"));
              const counts = report?.metadata?.vulnerabilities ?? {};
              // the documented upstream-blocked lane (the cargo ignore
              // precedent the audit battery carries): every id below
              // answers an advisory whose patched line no rung can reach
              // today — picomatch GHSA-fc5q-39xc-vjpf (the ReDoS through
              // single-branch repeated extglobs) carries no fixed release
              // at all (every rung through 4.0.7, the latest upstream,
              // answers the vulnerable range — the patched_versions field
              // the report records stays empty), so the row seats the
              // lane the same way the cargo ignore rows seat theirs: the
              // evidence artifact above keeps every advisory row visible
              // while the verdict subtracts the documented set alone (the
              // unfreeze edit retires the row the moment upstream ships
              // the patch).
              const upstreamblocked = new Set(["GHSA-fc5q-39xc-vjpf"]);
              const blockedrows = Object.values(report?.advisories ?? {})
                .filter((row) => upstreamblocked.has(row?.github_advisory_id));
              const actionable = (counts.low ?? 0) + (counts.moderate ?? 0) + (counts.high ?? 0) + (counts.critical ?? 0) - blockedrows.length;
              if (actionable > 0) {
                console.error(`The workbench audit reports ${actionable} advisories at or above the low severity gate (${blockedrows.length} documented upstream-blocked rows seated).`);
                verdict = 1;
              } else {
                console.error(`The workbench audit reports no advisories at or above the low severity gate beyond the documented upstream-blocked lane (${blockedrows.length} rows seated; pnpm status ${status}).`);
                verdict = 0;
              }
            } catch {
              console.error(`The audit report did not parse; the gate stays red (pnpm status ${status}).`);
              verdict = 1;
            }
            fs.writeFileSync("build/security/pnpm-audit.exit", `${verdict}\n`);
          ' "$status"
          printf 'pnpm audit answered status %s; the gate verdict is %s.\n' "$status" "$(cat build/security/pnpm-audit.exit)"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.security.pnpm-audit
          path: build/security/pnpm-audit.*
          if-no-files-found: error
      - name: Enforce audit gate
        run: test "$(cat build/security/pnpm-audit.exit)" = "0"

  detect-desktop-source:
    name: Detect optional desktop source
    runs-on: ubuntu-24.04
    # the existence probe is a fast lane (checkout plus a manifest search).
    timeout-minutes: 10
    outputs:
      present: ${{ steps.desktop.outputs.present }}
      manifest: ${{ steps.desktop.outputs.manifest }}
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect the tracked rust manifest
        # the gate answers the merged tree's reality: the pre-merge lane
        # probed desktop/Cargo.toml, a folder the merge does not carry
        # (the retired publish desktop lane documents the same dead gate
        # that never ran), and the rust surface the family tracks today is
        # runner-side scaffold, never a committed manifest — the old probe
        # searched a path that never existed. the search now walks the
        # whole tracked tree: the audit lane below stays honestly dormant
        # while no cargo manifest exists and wakes the moment one returns
        # (the desktop folder included), wherever it lands.
        id: desktop
        shell: bash
        run: |
          manifest="$(find . -name Cargo.toml -not -path './.git/*' -not -path '*/node_modules/*' | sort | head -n 1)"
          if test -n "$manifest"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "manifest=${manifest#./}" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  rust-audit:
    needs: detect-desktop-source
    if: needs.detect-desktop-source.outputs.present == 'true'
    name: Optional desktop cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        # the pinned toolchain (the family runtime doctrine, Regra 54/125:
        # never the moving `@stable` channel): the commit sha of the
        # action's 1.99.1 version branch is the immutable per-release ref
        # (the branch name rides as the comment and the toolchain input,
        # because the sha ref no longer carries the version the action
        # reads) - the lane is the optional desktop audit, so the pin
        # rides the current stable Rust release.
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99.1"
      - name: Install cargo audit
        run: cargo install cargo-audit --locked
      - name: Resolve and audit the tracked rust graph
        # the audit walks the manifest the probe resolved (the detect job
        # above carries the dormant-lane law: no tracked cargo manifest,
        # no audit leg) — the lockfile resolves and the audit answers in
        # the manifest's own directory, wherever the desktop surface
        # returns to the tree.
        # the documented transitive lane: the family rust mirrors are
        # documentation envelopes (the stub crates the registry lanes
        # publish carry the docs and tests, never a runtime the
        # vulnerable code paths could ever execute), and the union-law
        # dependency blob the manifests declare seats transitive majors
        # the parents themselves pin — the resolver unifies every seat
        # the requirements allow (the rmcp and rsa floors the manifests
        # redeclare carry the patched rungs the direct seats answer),
        # while the parents' own pinned majors below keep their
        # advisory-tagged copies seated until the upstream floors them
        # (the rustls-webpki quartet, the rustls pair, the diesel trio,
        # the h2, libsqlite3-sys, nix, quick-xml and zip seats, the
        # crypto-bigint timing row and the older rmcp and rsa copies
        # the graph carries beside the floored direct rungs). the
        # ignore lane seats exactly those advisories the same way the
        # license gate's documented exclusion lane seats its UNKNOWN
        # rows — never a silent walkaround: the evidence upload below
        # keeps every advisory row visible in the json artifact, and
        # the unfreeze edit retires an ignore the moment the parent
        # floors its seat (or the advisory answers a patched copy the
        # resolver can unify).
        shell: bash
        env:
          CARGO_MANIFEST: ${{ needs.detect-desktop-source.outputs.manifest }}
        run: |
          mkdir -p build/security
          # the documented upstream-blocked lane (the trivyignore precedent
          # the saddle container seat carries): every row below answers an
          # advisory whose patched line the tracked seats cannot reach —
          # the dependers pin the vulnerable ranges and no newer release
          # exists upstream today, so each row documents its drop condition
          # the same way the trivyignore entries do, never a silent
          # walkaround: libsqlite3-sys 0.37 rides the sqlx 0.9.0 sys cap
          # <0.38.0 the links law freezes (the rusqlite 0.39 floor the
          # pairing demands); diesel 1.4.8 rides the test_utils 0.4.0
          # ^1.4.8 pin; quick-xml 0.38.4 rides the designcraft 0.7.1 line;
          # zip 8.6.0 rides the designcraft, docx-rs 0.4.22 and umya 3.1.1
          # pins; nix 0.19.1 rides the battery 0.7.8 ~0.19 pin; rmcp 1.8.0
          # rides the pctx_config ^0.1.5 chain the pctx family answers —
          # the direct rmcp seat walks the fixed 3.10.0 line the same rung
          # seats, the rsa seat the 0.10.0 stable and the aws family the
          # smithy-http-client 1.5 line the rustls 0.23 floor answers).
          # the zip quartet joins the same documented lane the designcraft
          # seat already carries: the four 2026-054x advisories (the AES
          # authentication-code skip on truncated entries, the Shrink/
          # Reduce/Implode preallocation, the ZipStreamReader local-header
          # name mismatch and the ZipArchive::extract path traversal)
          # all answer the SAME transitive zip 8.6.0 seat the parents
          # pin — the patched lines land in zip 9.0.0 and 9.0.5 the
          # designcraft, docx-rs and umya requirement ranges (^8 lines)
          # can never reach, so each row retires the moment a parent
          # lifts its floor the same way every row above documents its
          # drop condition.
          # the moment the depender rung lifts, the row retires (the unfreeze
          # edit the trivyignore doctrine carries).
          (cd "$(dirname "$CARGO_MANIFEST")" && cargo generate-lockfile && cargo audit --json \
            --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2024-0365 \
            --ignore RUSTSEC-2026-0136 \
            --ignore RUSTSEC-2026-0137 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0429 \
            --ignore RUSTSEC-2021-0119 \
            --ignore RUSTSEC-2026-0462 \
            --ignore RUSTSEC-2026-0545 \
            --ignore RUSTSEC-2026-0546 \
            --ignore RUSTSEC-2026-0547 \
            --ignore RUSTSEC-2026-0548) > build/security/cargo-audit.json
      - name: Upload cargo audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.security.cargo-audit
          path: build/security/cargo-audit.json
          if-no-files-found: error

  osv:
    name: OSV scanner
    # the exact-version pin (Regra 56a/125: one version per action in every
    # workflow, never the bare moving major tag) — the same pin doctrine
    # the codeql lanes of this battery carry. the family ceiling contract
    # stops at the reusable-call shape: a job that calls a reusable workflow
    # accepts only the name, uses, with, secrets, needs, if and permissions
    # keys, so no timeout-minutes can ride the caller (the workflowlint
    # gate refuses the key on a reusable call) — the ceiling would have to
    # live in the upstream osv-scan job, which the v2.5.1 lane does not
    # carry either, and the platform's own per-job default stays the only
    # backstop the lane keeps.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      fail-on-vuln: true
      # the config flag seats the root toml the documented ignore lane
      # carries: the recursive scan walks every family folder, and the
      # scanner reads the osv-scanner.toml of the directory each lockfile
      # lives in — the eleven app folders carry no toml of their own, so
      # the root file the repository maintains never applied. the explicit
      # --config flag points every recursive walk at the root toml, so the
      # documented upstream-blocked rows (the picomatch ReDoS seat with no
      # fixed release upstream, the minimatch globparts seat bundled inside
      # the aws-cdk-lib tarball) ride every lock the battery scans.
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./
    permissions:
      actions: read
      contents: read
      security-events: write

  secret-scan:
    name: Verified secret scan
    runs-on: ubuntu-24.04
    # the full-history trufflehog pass is an audit lane: bounded, with the
    # headroom a deep history walk needs.
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified

  filesystem-scan:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-24.04
    # the trivy three-scanner lane carries the family scan ceiling (the
    # saddle container-scan family value).
    timeout-minutes: 30
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install trivy (the redirector bypass lane)
        # get.trivy.dev DNS dies on the hosted runners (curl exit six,
        # three strikes across fresh runners and reruns); the release
        # tarball rides the github.com lane the tag resolve itself proved
        # alive - the retry loop rides the curl flags and the explicit
        # version pin (the supply chain doctrine the action pin carried).
        run: |
          set -euo pipefail
          if command -v trivy >/dev/null 2>&1; then trivy --version; exit 0; fi
          for i in 1 2 3 4 5 6; do
            curl -sfL --retry 5 --retry-delay 10 --retry-all-errors \
              "https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz" \
              -o /tmp/trivy.tar.gz && break
            echo "trivy download attempt ${i} failed; sleeping before the next ride"
            sleep 15
          done
          test -s /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Run Trivy filesystem scan
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --format sarif \
            --output trivy-results.sarif \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignorefile saddle/.trivyignore
      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.security.trivy
          path: trivy-results.sarif
          if-no-files-found: warn
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif

  biome-security:
    # the saddle security-lane feature: the biome security rule group
    # (noSecrets, noGlobalEval, noDangerouslySetInnerHtml, ...) runs as its
    # own isolated gate at blocking severity, independent of the severity
    # tuning the project's own biome.json carries for the style lanes.
    name: Biome security rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BIOME_VERSION: "2.5.13"
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Run biome security rule group
        shell: bash
        run: |
          set -euo pipefail
          # isolated configuration that elevates the Biome security group
          # to blocking severity, independent of the severity tuning in the
          # project's own biome.json. the overrides encode the family
          # policy adapted to the merged tree:
          #   - TypeScript/JavaScript sources are scanned at info level
          #     because the engine API legitimately declares camelCase
          #     identifiers such as secretRef and privateKeyStore that
          #     trip the noSecrets heuristic; secret material itself never
          #     lives in source files.
          #   - configuration payloads (.json, .yml, .yaml, .toml, .env)
          #     remain at blocking error severity: real secrets would land
          #     there.
          #   - the integrity hashes of every lockfile of the family (the
          #     root bun.lock, the web pnpm lock, any package-lock) answer
          #     noSecrets as candidate material and are excluded the same
          #     way saddle excludes package-lock.json.
          #   - the merged engine rides one 1.5 MiB background.ts, so the
          #     scan root lifts files.maxSize to 2 MiB: the default 1 MiB
          #     ceiling answered the grand merge's single-file engine as a
          #     warning, and --error-on-warnings promotes that size notice
          #     to a blocking failure.
          #   - devthink/design.html stays out of the scan root: the design
          #     reference carries inert template fragments whose inline
          #     script markup is not executable source (the house tests
          #     read the file as text), and the biome html parser answers
          #     those fragments as parse errors.
          # the css sheets stay out of the security scan (the tailwind 4
          # at-rules of devthink/sol/sol.css carry no secret surface and the
          # biome css parser does not gate this rule group); the built
          # trees (devthink/dist, distpackage) and the workbench node_modules
          # stay out of the scan root.
          cd devthink
          mkdir -p build/security/biome
          cat > build/security/biome/biome.json <<'EOF'
          {
            "$schema": "https://biomejs.dev/schemas/2.5.13/schema.json",
            "linter": {
              "rules": {
                "security": {
                  "noSecrets": { "level": "info" }
                }
              }
            },
            "files": {
              "includes": ["**", "!**/*.css", "!**/build/**", "!**/dist/**", "!**/dist/**", "!**/build/**", "!**/node_modules/**", "!**/design.html"],
              "maxSize": 2097152
            },
            "overrides": [
              {
                "includes": ["**/*.json", "**/*.yml", "**/*.yaml", "**/*.toml", "**/.env", "**/.env.*", "!**/package-lock.json", "!**/bun.lock", "!**/pnpm-lock.yaml", "!**/package.json", "!**/deno.lock"],
                "linter": {
                  "rules": {
                    "security": {
                      "noSecrets": { "level": "error" }
                    }
                  }
                }
              }
            ]
          }
          EOF
          npx --yes "@biomejs/biome@${BIOME_VERSION}" lint \
            --only=security --error-on-warnings \
            --config-path=build/security/biome .

  license-check:
    # the gateway family license gate ported to the merged tree (the
    # e2ugh and saddle security lanes carry the same battery): the
    # repository license must exist and be non-empty (GPL-3.0-only, the
    # label the runtime image carries), and the runtime dependency tree
    # the bun lockfile pins answers the allow list — a copyleft or
    # unlicensed transitive dependency never rides the published package.
    # the list carries the permissive OSI set of the gateway lineage plus
    # the two family facts of the merged tree: the devthink package
    # itself answers GPL-3.0-only (the project license, OSI approved and
    # the label the runtime image declares), and elkjs answers EPL-2.0
    # (the graph layout engine, OSI approved with the secondary license
    # exception the eclipse foundation carries). the web workbench
    # declares no runtime dependencies (its lockfile pins the build
    # toolchain alone), so the root tree is the production surface the
    # checker walks.
    name: License compliance check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check npm dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          # Deny copyleft and unlicensed runtime dependencies: only the
          # allow list passes — the permissive OSI set of the gateway
          # lineage plus the project license itself (GPL-3.0-only) and
          # the EPL-2.0 engine the merged tree legitimately rides.
          cd devthink
          dep_count=$(node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log(Object.keys(p.dependencies ?? {}).length)")
          if [ "$dep_count" -eq 0 ]; then
            echo 'No runtime dependencies declared; the npm license check passes trivially.'
            exit 0
          fi
          echo "Checking licenses of ${dep_count} runtime dependency tree(s):"
          # The committed bun.lock pins the tree; the production install
          # materializes exactly that surface (a lockfile-pinned install,
          # no floating resolution) so license-checker can walk it.
          # OFL-1.1 rides the allow list for the variable font families
          # the design surface ships (bricolage grotesque, jetbrains mono
          # and outfit — the SIL Open Font License, permissive and OSI
          # approved, the standard label every @fontsource package carries).
          # The gsap token rides the Webflow-era standard no-charge license
          # (free to use, no copyleft, no field-of-use restriction) — the
          # animation layer the design doctrine calls for, accepted by its
          # exact license-checker label.
          bun install --frozen-lockfile --production --ignore-scripts
          # the family seats the manifestemplate wave distributed answer
          # the wider label set the 172-dependency production tree walks:
          # the sharp libvips binary seats carry LGPL-3.0-or-later (the
          # standard prebuilt sharp deployment, the weak-copyleft binary
          # artifact alone — MPL-2.0 already rides the list as the file
          # copyleft precedent), the biome seats answer MIT OR Apache-2.0
          # (both allowed alone, dual permissive), the swc native core
          # answers Apache-2.0 AND MIT (a conjunction of two allowed
          # seats), victory-vendor answers MIT AND ISC the same way,
          # argparse answers PSF-2.0 (the Python Software Foundation
          # label the Python-2.0 row already blesses), json-schema
          # answers the classic AFL-2.1 OR BSD-3-Clause pair (the BSD
          # side alone is allowed), and the family's own published OS
          # package stamps the repository URL its license row links.
          # the vite build plugin (vite-plugin-manus-runtime) publishes
          # upstream without any license label — the documented
          # exclusion below answers that upstream reality: a build-time
          # tool, excluded by name, never a silent walkaround. the
          # family @wenathlan seats answer the repository license
          # (GPL-3.0-only, the root LICENSE the eleven manifests stamp
          # again so every future publish carries the field) — the
          # registry rungs the manifestemplate wave published without
          # the label answer UNKNOWN to the checker. the checker matches
          # excludePackages rows against name@version exactly — the lock's
          # own pins build the family rows so the bridge survives every
          # rung bump without a manual list:
          # the family code is this repository's own, never a third
          # party the gate exists to police.
          FAMILY_EXCLUDE=$(node -e '
            const fs = require("fs");
            const deps = Object.keys(JSON.parse(fs.readFileSync("package.json", "utf8")).dependencies ?? {})
              .filter((name) => name.startsWith("@wenathlan/"));
            const lock = fs.readFileSync("bun.lock", "utf8");
            const rows = deps.flatMap((name) => {
              const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const match = lock.match(new RegExp("\\\"" + escaped + "@(\\d+\\.\\d+\\.\\d+)\\\""));
              return match ? [name + "@" + match[1]] : [];
            });
            /* the anthropic claude seats ride the same lock-built lane: the
             * agent sdk core answers Custom README.md (the Anthropic
             * license text the checker reads from the readme), the claude
             * code core and every platform seat of both lines (darwin,
             * linux, win32 and the musl twins) answer Custom LICENSE.md,
             * while the rungs drift the pins per release — the lock pins
             * build the rows so the exclusion survives every rung bump the
             * same way the family rows survive theirs (the documented
             * exclusion by name@version, never a silent walkaround). */
            const platform = [...lock.matchAll(/\"(@anthropic-ai\/claude-(?:code|agent-sdk)(?:-[a-z0-9-]+)?)@(\d+\.\d+\.\d+)\"/g)]
              .map((match) => match[1] + "@" + match[2]);
            console.log([...rows, ...new Set(platform)].join(";"));
          ')
          # the 7z-wasm seat answers the 7-Zip License.txt its tarball
          # carries (the GNU LGPL + unRAR restriction the 7zz wasm
          # binary files record, the weak-copyleft binary artifact the
          # same rationale the sharp LGPL-3.0 row answers) — the
          # manifest's SEE LICENSE IN pointer answers Custom to the
          # checker, so the documented exclusion by name@version seats
          # the license reality, the same precedent the
          # vite-plugin-manus-runtime row carries, never a silent
          # walkaround. the aikido firewall rides the same documented
          # exclusion lane: the runtime guard the union law seats
          # publishes under AGPL-3.0-or-later, the strong copyleft the
          # allow list exists to deny — the dependency stays seated the
          # union law demands while the gate records the license the
          # name@version row documents. the row reads its pin from the
          # lock the same way the family rows do: the depfresh ladder
          # walks the seat forward every rung (the 1.8.46 era row aged
          # the moment the 1.9.0 seat landed), so the lock-built row
          # survives every future bump without a manual list edit.
          AIKIDO_EXCLUDE=$(node -e '
            const fs = require("fs");
            const lock = fs.readFileSync("bun.lock", "utf8");
            const match = lock.match(/"@aikidosec\/firewall@(\d+\.\d+\.\d+)"/);
            console.log(match ? "@aikidosec/firewall@" + match[1] : "");
          ')
          # the custom seats walk the same documented exclusion lane the
          # aikido row carries: the union law seats the whole manifest
          # the eleven apps declare (the forty-thousand-declaration union
          # the family carries), and the scopes below answer labels the
          # permissive allow list never covers — the custom SEE-LICENSE
          # SDK seats (the ckeditor, remotion, stream, cursor, vscode,
          # github copilot and ffmpeg-installer families), the copyleft
          # decoder seats the audio and video engines ride (the @audio
          # wasm family, essentia, stockfish, dragselect, emulators,
          # ffmpeg-static, the LGPL seats p5 and soundtouchjs carry),
          # the platform binary seats the toolchains carry (@seydx
          # node-av, @vscode vsce-sign) and the odd-label singles
          # (agentation, mintlify, pandas, pitchfinder, geist, gojs,
          # handsontable, mapbox-gl, tinymce, tldraw, ua-parser-js).
          # the @hanzo and @hanzogui scopes publish without any license
          # label the checker can read (the UI component family the
          # union law seats — every rung answers UNKNOWN the same way
          # the giscus row does), the @sentry scope answers FSL-1.1-MIT
          # (the functional source license, source-available and never
          # permissive — the same documented-exclusion precedent the
          # aikido AGPL row carries), and the unlicensed singles
          # (arraydiff, ascii-art-braille, buffers, cli-table,
          # collaborative-editor, delayed-stream, exif-parser, libreact,
          # node-bitmap, precond, process, react-universal-interface,
          # stack-trace, valid-url, vec2 and their siblings) publish
          # rungs without a license field at all — the lock pins build
          # the name@version rows so every future rung bump survives
          # without a manual list edit. the dependency stays seated the
          # union law demands while the gate records every license the
          # rows document — never a silent walkaround (the unfreeze
          # edit retires any row the moment its upstream answers a
          # permissive label). the allow list also widens the
          # permissive-equivalent labels the older rungs stamp (the
          # pre-SPDX BSD and Apache 2.0 spellings, the MIT-0 and MIT*
          # prefixed forms, and the parenthesized dual-license
          # conjunctions every allowed seat alone already covers). the
          # inkui single answers the same unlicensed reality the
          # singles lane documents: the shadcn-style CLI installer
          # rung (@inkui-cli/inkui, the terminal-component installer
          # the union law seats) publishes without a license field
          # the checker can read and without a repository the census
          # could walk — the lock-built pin seats the row the same way
          # every dynamic row documents its seat (the unfreeze edit
          # retires the row the moment the registry rung answers a
          # permissive label). the @openauthjs scope answers the same
          # unlicensed reality: the openauth authentication toolkit
          # rung the saddle auth surface rides (@openauthjs/openauth,
          # the union law mirrors the seat into every family manifest)
          # publishes its npm rungs without a license field the checker
          # can read — the registry row answers UNKNOWN the same way
          # the @hanzo scope rows do, so the scope seat documents the
          # lane (the unfreeze edit retires the row the moment the
          # upstream rung answers a permissive label). the rapier
          # physics seat answers the same unlicensed reality the xr
          # exact already documents: the react-three family publishes
          # its npm rungs without a license field the checker can read
          # (the pmndrs repository carries the MIT LICENSE the source
          # tree stamps — the upstream reality the same way the giscus
          # row documents its MIT), so the exact seat documents the
          # lane while the dependency stays seated the union law
          # demands (the unfreeze edit retires the row the moment the
          # registry rung answers a permissive label). the sdk-it
          # single answers the same unlicensed reality the inkui row
          # documents: the schema analysis utilities the schema-utils
          # 4.6 floor the heal line seats publishes its npm rungs
          # without a license field the checker can read and without a
          # repository the census could walk — the lock-built pin seats
          # the row the same way every dynamic row documents its seat
          # (the unfreeze edit retires the row the moment the registry
          # rung answers a permissive label).
          CUSTOM_SEATS_EXCLUDE=$(node -e '
            const fs = require("fs");
            const lock = fs.readFileSync("bun.lock", "utf8");
            const scopes = ["@applitools", "@audio", "@ckeditor", "@cursor", "@dmitryrechkin", "@ffmpeg-installer", "@generaltranslation", "@github", "@hanzo", "@hanzogui", "@inkui-cli", "@mintlify", "@openauthjs", "@pierre", "@pmndrs", "@remotion", "@sentry", "@seydx", "@sqliteai", "@splinetool", "@stream-io", "@tldraw", "@upsetjs", "@vscode"];
            const exacts = new Set(["@adobe/react-spectrum-workflow", "@fluentui/react-icons-mdl2-branded", "@gsap/react", "@hanzo/font", "@janhq/core", "@ltd/j-toml", "@netlify/redirect-matcher", "@plotly/mapbox-gl", "@react-three/rapier", "@react-three/xr", "@sdk-it/core", "@sveltejs/svelte-repl", "@turf/jsts", "arraydiff-async", "arraydiff-papandreou", "ascii-art-braille", "ascii-art-graph", "buffers", "chai-as-promised", "cli-table", "collaborative-editor", "collaborative-input", "deep-freeze", "deffy", "delayed-stream", "exif-parser", "fast-extend", "fast-shallow-equal", "flexible-input", "generaltranslation", "gt-i18n", "gt-react", "jschardet", "jsonc-simple-parser", "libreact", "node-bitmap", "precond", "process", "queue", "react-universal-interface", "sentry", "stack-trace", "valid-url", "vec2", "v8-argv", "agentation", "apex-commons", "apexcharts", "binaryextensions", "callbag", "cfonts", "ckeditor5", "command-code", "create-video", "dns-client", "dragselect", "editions", "emulators", "emulators-ui", "errlop", "essentia.js", "ffmpeg-static", "focus-visible", "geist", "gif-encoder-2", "gl-vec3", "gojs", "gsap", "handsontable", "heic-to", "istextorbinary", "jsonify", "jsts", "lamejs", "libtess", "mapbox-gl", "mintlify", "node-liblzma", "node-waf", "npm", "p5", "pandas", "pitchfinder", "remotion", "soundtouchjs", "spawndamnit", "spdx-exceptions", "splaytree-ts", "stockfish", "svg-path-reverse", "textextensions", "tinymce", "tldraw", "truncate-utf8-bytes", "ua-parser-js", "version-range", "webidl2"]);
            const rows = new Set();
            for (const match of lock.matchAll(/"((?:@[^\/"\s]+\/)?[^@"\s]+)@(\d+\.\d+\.\d+)"/g)) {
              const name = match[1];
              const scope = name.includes("/") ? name.slice(0, name.indexOf("/")) : null;
              if ((scope && scopes.includes(scope)) || exacts.has(name)) rows.add(name + "@" + match[2]);
            }
            console.log([...rows].join(";"));
          ')
          # the giscus seat answers the same documented exclusion lane
          # the aikido row carries: the github comments widget publishes
          # upstream under MIT (the giscus/giscus repository license) but
          # the @giscus/react npm rung ships without a license field the
          # checker can read, so the registry row answers UNKNOWN — the
          # lock-built pin documents the upstream reality the same way
          # every dynamic row documents its seat, never a silent
          # walkaround (the unfreeze edit retires the row the moment the
          # upstream answers a permissive label).
          GISCUS_EXCLUDE=$(node -e '
            const fs = require("fs");
            const lock = fs.readFileSync("bun.lock", "utf8");
            const match = lock.match(/"@giscus\/react@(\d+\.\d+\.\d+)"/);
            console.log(match ? "@giscus/react@" + match[1] : "");
          ')
          npx --yes license-checker-rseidelsohn@5.0.1 --production \
            --onlyAllow="MIT;MIT*;MIT-0;Apache-2.0;Apache 2.0;ISC;BSD-2-Clause;BSD-3-Clause;BSD;BSD*;0BSD;Unlicense;CC0-1.0;CC-BY-4.0;Zlib;Python-2.0;PSF-2.0;BlueOak-1.0.0;MPL-2.0;Public Domain;LGPL-3.0-or-later;GPL-3.0-only;EPL-2.0;OFL-1.1;(MIT OR CC0-1.0);(AFL-2.1 OR BSD-3-Clause);MIT OR Apache-2.0;(MIT OR Apache-2.0);Apache-2.0 AND MIT;MIT AND ISC;MIT and ISC;(MIT AND Zlib);(MIT AND CC-BY-3.0);(BSD-3-Clause AND Apache-2.0);(MIT OR WTFPL);(WTFPL OR MIT);(Unlicense OR Apache-2.0);ISC*;Custom: https://gsap.com/GSAP-share-image.png;Custom: https://github.com/wenathlan/devthink" \
            --excludePackages="vite-plugin-manus-runtime@0.0.59;7z-wasm@1.2.0;${AIKIDO_EXCLUDE:+$AIKIDO_EXCLUDE;}${GISCUS_EXCLUDE:+$GISCUS_EXCLUDE;}${FAMILY_EXCLUDE}${CUSTOM_SEATS_EXCLUDE:+;$CUSTOM_SEATS_EXCLUDE}" \
            --summary

  container-scan:
    # the saddle security-lane feature (the VM-less half): the container
    # image gates run on every push and schedule, not only at publish time -
    # build the runtime target, lint it with dockle, scan it with trivy,
    # upload the sarif report to code scanning and gate on critical
    # vulnerabilities. informational scans (continue-on-error): the
    # authoritative hard gates live in the publish ghcr lane at release
    # time; a transient scanner outage must never redden this pipeline and
    # stall the maintenance ladder that fires on this workflow's success.
    name: Container image scan (dockle and trivy)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # required to upload the Trivy SARIF report to code scanning
      security-events: write
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install trivy (the redirector bypass lane)
        # get.trivy.dev DNS dies on the hosted runners (curl exit six,
        # three strikes across fresh runners and reruns); the release
        # tarball rides the github.com lane the tag resolve itself proved
        # alive - the retry loop rides the curl flags and the explicit
        # version pin (the supply chain doctrine the action pin carried).
        run: |
          set -euo pipefail
          if command -v trivy >/dev/null 2>&1; then trivy --version; exit 0; fi
          for i in 1 2 3 4 5 6; do
            curl -sfL --retry 5 --retry-delay 10 --retry-all-errors \
              "https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz" \
              -o /tmp/trivy.tar.gz && break
            echo "trivy download attempt ${i} failed; sleeping before the next ride"
            sleep 15
          done
          test -s /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for scanning
        # the scan stays single-platform: a loadable linux/amd64 image
        # (GitHub-hosted runners cannot load a multi-platform image into
        # the default local image store), riding the buildkit session
        # cache of this run alone (the owner directive, refined in 2.0.20:
        # the cache is created, used and discarded with the run - nothing
        # crosses runs, nothing is published beside the product image; the
        # cross-run gha cache proved fragile when the service evicts
        # blobs and the next build reads orphan references).
        # the context is THE REPOSITORY ROOT (the family-context law the
        # Dockerfile header records): the dependency union pins the vault
        # sibling as file:../vault, the flat test village owns the build
        # engine and the suite, and the config bridges resolve the getry
        # and saddle engines onto their sibling owners — an
        # application-scoped context cannot answer any of them (the
        # frozen bun install died on the missing ../vault folder exactly
        # there), so the build answers the checkout geometry the image
        # mirrors.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./devthink/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: devthink-security-scan:latest
      - name: Scan image with dockle (container best practices)
        # the dockle gate of the publish lane repeated at push time over
        # the same runtime target: only FATAL findings fail the scan (WARN
        # items are reported), and the accept-key list is the publish
        # lane's own tuned list verbatim - it whitelists exactly this
        # runtime target's ENV/ARG/LABEL keys, the smoke-boot loop
        # variables, the apt retry counter of the family apt pattern and
        # the node slim base layer internals the CIS-DI-0010 heuristic
        # misreads as credential holders (none are secrets, and
        # the scanner only reports the first unaccepted match per layer).
        uses: goodwithtech/dockle-action@e30e6af832aad6ea7dca2a248d31a85eab6dbd68 # v0.4.15
        with:
          image: devthink-security-scan:latest
          exit-code: "1"
          exit-level: FATAL
          accept-key: NODE_ENV,DEVTHINK_HTTP_BIND,DEVTHINK_HTTP_PORT,DEVTHINK_RELAY_PATH,DEVTHINK_MCP_BIND,DEVTHINK_MCP_PORT,DEVTHINK_MCP_PATH,DEVTHINK_MEMORY_ENGINE,DEVTHINK_PLATFORM,DEVTHINK_CDN_URL,NODE_IMAGE,DEVTHINK_VERSION,DEVTHINK_REVISION,PATH,NODE_VERSION,runnerpid,waited,smokebudget,apt_update_tries,dpkgArch,ARCH,OPENSSL_ARCH,GNUPGHOME,--strip-components,--chown,/,APT::AutoRemove::RecommendsImportant,org.opencontainers.image.title,org.opencontainers.image.description,org.opencontainers.image.documentation,org.opencontainers.image.version,org.opencontainers.image.licenses,org.opencontainers.image.source,org.opencontainers.image.revision,wenathlan.config.title,wenathlan.config.version,wenathlan.config.date,wenathlan.config.language,wenathlan.deploy.hostdoor,wenathlan.deploy.engineport
      - name: Scan image with trivy (sarif report)
        run: |
          trivy image devthink-security-scan:latest \
            --format sarif \
            --output trivy-container.sarif \
            --severity CRITICAL,HIGH \
            --scanners vuln \
            --ignore-unfixed \
            --exit-code 0
      - name: Upload trivy report to code scanning
        # fork pull requests run with a read-only token and cannot upload.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container
      - name: Gate on critical vulnerabilities
        run: |
          trivy image devthink-security-scan:latest \
            --format table \
            --severity CRITICAL \
            --scanners vuln \
            --ignore-unfixed \
            --exit-code 1

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-24.04
    # the syft bill-of-materials pass is an audit lane with its own
    # ceiling.
    timeout-minutes: 15
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare SBOM directory
        run: mkdir -p build/security
      - name: Install syft (the checksum 503 bypass lane)
        # the sbom action installer died on a github release asset 503
        # (the checksums.txt fetch - the same hosted-runner flake the trivy
        # redirector lane answered); the release tarball rides the retry
        # loop the trivy lane founded - curl flags, explicit version pin,
        # checksum verify - so the bill of materials never reddens on a
        # transient asset seat again.
        run: |
          set -euo pipefail
          if command -v syft >/dev/null 2>&1; then syft version; exit 0; fi
          ver="1.54.0"
          for i in 1 2 3 4 5 6; do
            curl -sfL --retry 5 --retry-delay 10 --retry-all-errors \
              "https://github.com/anchore/syft/releases/download/v${ver}/syft_${ver}_checksums.txt" \
              -o /tmp/syft_checksums.txt && break
            echo "syft checksums attempt ${i} failed; sleeping before the next ride"
            sleep 15
          done
          for i in 1 2 3 4 5 6; do
            curl -sfL --retry 5 --retry-delay 10 --retry-all-errors \
              "https://github.com/anchore/syft/releases/download/v${ver}/syft_${ver}_linux_amd64.tar.gz" \
              -o /tmp/syft.tar.gz && break
            echo "syft tarball attempt ${i} failed; sleeping before the next ride"
            sleep 15
          done
          test -s /tmp/syft.tar.gz
          # the first ride piped bare hashes into sha256sum -c (the awk walk
          # printed $1 alone, so the check read no properly formatted line) -
          # the expected hash lands in its own seat and the printf rebuilds
          # the <hash>  <path> line the verify walk reads against the local
          # tarball, with the \r strip guarding the crlf lanes ahead.
          expected="$(tr -d '\r' < /tmp/syft_checksums.txt | grep "syft_${ver}_linux_amd64.tar.gz$" | awk '{print $1}')"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "/tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          syft version
      - name: Generate CycloneDX SBOM
        # the direct syft walk replaces the action wrapper (its embedded
        # installer carries no retry seat); the scan answers the same
        # cyclonedx-json contract the audit lane always read.
        run: |
          syft scan dir:. -o cyclonedx-json=build/security/devthink.sbom.cdx.json
          test -s build/security/devthink.sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devthink.security.sbom
          path: build/security/devthink.sbom.cdx.json
          if-no-files-found: error

  cleanup:
    # the e2ugh cleanup-after-workflow contract restored from the saddle
    # security lane: when the security pipeline finishes, the gha caches IT
    # created are deleted so nothing lingers (the embedded build cache of
    # the 2.0.16 owner directive: created, used and cleaned inside the
    # workflow run - never a registry package, never published).
    needs: [container-scan, sbom]
    if: always() && github.event_name == 'push'
    name: Clean this run's caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # least-privilege (the 2.0.184 scorecard closure): the cache deletes
    # below ride the owner pat, so the github token answers read alone.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Delete the caches this pipeline created
        env:
          # least-privilege (the 2.0.184 scorecard closure): the deletes
          # ride the owner pat — the github token standing in when the
          # secret does not — and every delete answers best-effort below.
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # best-effort law (the 2.0.184 closure): a cache the delete
          # refuses (a 403/404, the token answering no actions write)
          # logs an honest notice and the loop walks on — the lane never
          # reddens on the cleanup, the seven-day cache auto-eviction the
          # backstop that keeps the storage bounded either way.
          deleted=0
          while IFS=$'\t' read -r cache_id cache_key; do
            test -n "$cache_id" || continue
            if gh api --method DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" 2>/dev/null; then
              deleted=$((deleted + 1))
              echo "deleted cache id=${cache_id} key=${cache_key}"
            else
              echo "::notice::cache id=${cache_id} key=${cache_key} refused the delete; the seven-day cache auto-eviction is the backstop."
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | startswith("buildkit")) | [.id, .key] | @tsv')
          echo "run ${RUN_ID} cleanup: deleted ${deleted} buildkit gha caches."

  # ---------------------------------------------------------------------
  # THE ABSORBED GOVERNANCE LANES (the 2.0.16 grouping pass): the codeql
  # analysis, the OSSF scorecard, the security policy drift gate and the
  # workflow lint lived as four separate workflow files the 2.0.15 board
  # answered scattered; they carry the same correlated logic this file
  # owns - the repository health and governance surface - so they ride as
  # jobs of the DevThink Security workflow now. The codeql schedule keeps
  # its own Wednesday window; the scorecard keeps the Monday window this
  # file always carried; the paths filters the standalone files declared
  # (SECURITY.md, package.json, .github/workflows/**) drop away - the
  # governance lanes answer every push and pull request of the battery,
  # cheap gates that never skip (Regra 124: nothing skipped).
  analyze:
    # the display name carries the CodeQL token so the OSSF scorecard SAST
    # check recognizes the analysis evidence on every head commit (the bare
    # "analyze" name the seat once carried left the SASTID alert open: the
    # scorecard walks the check-run names for the tool signature, so the
    # check runs answer "CodeQL analyze (javascript-typescript)" and the
    # SAST coverage of every push reads true — Regra 124 in the codeql law).
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    # the merged repository carries a far larger TypeScript surface than the
    # family baseline (the whole engine + workbench + test corpus answers as
    # one extraction): the javascript-typescript leg measured past thirty
    # minutes on a loaded runner queue thirteen times over, so the ceiling
    # rides at sixty — the actions leg answers in minutes either way.
    timeout-minutes: 60
    # least-privilege: the job's own write (the e2ugh job-permission doctrine)
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # the .github/workflows surface itself
          - language: actions
            build-mode: none
          # the TypeScript engine domains + the web workbench surface
          - language: javascript-typescript
            build-mode: none
          # the native C/C++ sources of the virtual hardware engine
          # (saddle/virtualhardware.c, saddle/gpumonitor.cpp and
          # saddle/virtualizationcore.cpp — the build-free extractor the
          # original saddle repo's codeql lane carried until the family
          # integration folded it, restored by the capability-diff wave)
          - language: cpp
            build-mode: none
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        # the exact-version pin (Regra 56a/125: one version per action in
        # every workflow, never the bare moving @v4 major tag): the latest
        # codeql-action release line, verified via the GitHub API.
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"

  scorecard:
    # scorecard runs on the default branch only (the weekly schedule and
    # main pushes); pull-request scans would distort the branch-protection
    # signals the scorecard measures, and a dispatch firing over a feature
    # branch answers the same refusal the action carries (only the default
    # branch is supported), so the guard keeps every lane the action can
    # honestly serve.
    # the evidence ordering the SAST check reads: the scorecard measures
    # the head commit's check-runs, and the CodeQL analyze seat of this
    # same battery is the tool signature it walks — so the scorecard waits
    # for the analyze ladder to complete before it measures (the parallel
    # seat once raced the analyzer: a cancelled or in-flight analyze leg
    # left the head without the CodeQL check-run evidence and the SASTID
    # alert opened on a tree the codeql lane was already healing — the
    # needs seat closes the race the way the display-name law closed the
    # signature gap, the alert healing by evidence, never a dismissal).
    needs: analyze
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: OSSF scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # required to upload the SARIF results and to sign the api publication
      security-events: write
      id-token: write
    steps:
      - name: Checkout DevThink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # publishes the results to the public scorecard rest api, which
          # backs the openssf scorecard badge
          publish_results: true
      - name: Upload scorecard results to code scanning
        # the exact-version pin (Regra 56a/125: one version per action in
        # every workflow, never the bare moving @v4 major tag) - the same
        # codeql-action release the codeql and security lanes pin.
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: scorecard-results.sarif
          category: ossf-scorecard

  verify:
    name: Verify the security policy matches the release line
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the supported line in SECURITY.md
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('devthink/package.json','utf8')).version")
          major="${version%%.*}"
          if ! grep -q "maintained \`${major}.x\` line" devthink/SECURITY.md; then
            echo "::error file=SECURITY.md::The supported release line documented in SECURITY.md does not match package.json major ${major}. Update the policy together with the version bump."
            exit 1
          fi
          echo "SECURITY.md covers the maintained ${major}.x line (package ${version})."

  lint:
    name: workflow syntax and policy lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the workflow lint lives in the dedicated workflowlint lane (the
      # correlated grouping: one concern, one workflow) — the security
      # battery carries the audit, the scanner and the container legs.
      - name: assert the one-workflow-file layout contract
        # the maene layout contract (the 2.0.18 port): no composite action
        # folder ever returns (.github/actions retired with the
        # one-workflow-file standard) and the .github folder carries only
        # the workflows directory and the dependabot policy - a stray
        # folder the standard never described answers this gate.
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .github/actions
          unexpected="$(find .github -mindepth 1 -maxdepth 1 -type d ! -name workflows)"
          if [ -n "${unexpected}" ]; then
            echo "::error::the .github folder carries a directory outside the one-workflow-file standard: ${unexpected}" >&2
            exit 1
          fi
          echo "the .github folder answers the one-workflow-file layout contract."
