version: 2

# The Dependabot policy of the DevThink monorepo.
#
# The version-update pull requests stay closed (open-pull-requests-limit: 0):
# the maintenance ladder of maintenance.yml owns the weekly non-breaking
# update rung (npm dependencies through the dependency updates lane of
# foundry/dependencyupdates.ts and the versioned action references through
# the action tag update lane of devthink/workflow.ts),
# so Dependabot version-update PRs would collide with that ladder. Dependabot
# security updates are not subject to the limit, so the vulnerable-dependency
# fix PRs and the security-tab alerts keep answering for every manifest below.
#
# The entries cover every manifest of the monorepo: the pre-merge /web entry
# pointed at a directory the grand merge retired (no web/ folder exists in
# this tree - the static workbench lives in devthink/), so the coverage walks
# the eleven real application roots. The ten roots that commit bun.lock alone
# (devthink and the nine family applications - the union wave retired their
# pnpm locks, the frozen installs ride the bun resolution) answer the bun
# ecosystem the updater requires for a bun.lock-managed manifest, the saddle
# engine answers npm beside its committed package-lock.json, and the envelope
# root stays the no-op npm entry.
updates:
  # The monorepo envelope manifest (no runtime dependencies): a no-op entry
  # kept so the root package.json stays tracked.
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  # The DevThink OS application (bun.lock and pnpm-lock.yaml committed).
  - package-ecosystem: bun
    directory: /devthink
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  # The nine family applications (pnpm-lock.yaml and bun.lock committed).
  - package-ecosystem: bun
    directory: /argan
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /cadria
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /debonair
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /forge
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /foundry
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /stealthhead
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /vault
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /getry
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /cobaia
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  # The saddle engine (package-lock.json and bun.lock committed).
  - package-ecosystem: npm
    directory: /saddle
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  # The workflow family of .github/workflows (version-tag references the
  # maintenance ladder tracks through the action tag update lane of
  # devthink/workflow.ts).
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  # The docker image coverage of the family (the audit rescue of the lost
  # seat: the eleven application Dockerfiles walked uncovered since the
  # first consolidation folded the docker entry away - the base image
  # references the container lanes pin need the update watch the rest of
  # the manifests answer).
  - package-ecosystem: docker
    directory: /devthink
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /argan
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /cadria
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /debonair
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /forge
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /foundry
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /stealthhead
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /vault
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /getry
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /cobaia
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /saddle
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
