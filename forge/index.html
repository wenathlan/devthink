<!doctype html>
<!-- web entry of the theme -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      /* the typed-URL law: the address typed straight at this app's subpath
         lands INSIDE the os — the boot redirects to the os panel with the
         arrive handoff before anything paints (the power clip then opens
         the app window, the same window the desktop double click opens);
         ?independent keeps this presentation site and the embedded boots
         (self != top) never redirect */
      (function () {
        try {
          if (window.self !== window.top) return;
          if (/[?&]independent\b/.test(window.location.search)) return;
          var os = new URL("../panel", window.location.href);
          os.searchParams.set("arrive", "forge");
          window.location.replace(os.href);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="forge is the CI and build application of the DevThink OS: a sandbox runner surface that registers runners, records run logs and reports outcomes over https." />
    <meta name="theme-color" content="#202020" />
    <link rel="icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./Sol/sol.css" />
    <title>forge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./App.tsx"></script>
  </body>
</html>
