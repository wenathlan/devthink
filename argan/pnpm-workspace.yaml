# the pnpm settings live here since pnpm 12 (the package.json pnpm field is
# no longer read): the build scripts the dependency tree may run, every
# other script stays ignored.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - cpu-features
  - esbuild
  - prisma
  - protobufjs
  - ssh2
  - workerd
