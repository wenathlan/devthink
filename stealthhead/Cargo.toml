# stealthhead — the rust version envelope crate of the family (the cargo channel).
# The crate carries the version constant the metadata lockstep stamps (the
# stealthhead.java precedent: the registry lanes reference it, never compile it
# locally), the lane builds with `cargo package --no-verify --allow-dirty`
# and stamps the version before building.
[package]
name = "wenathlan-stealthhead"
version = "2.0.170"
edition = "2021"
description = "The FPS game platform — only game logics (match, ranking, weapons, world); the versawase and audio engines ride the published library"
license = "GPL-3.0-only"
repository = "https://github.com/wenathlan/devthink"
authors = ["wenathlan"]

[lib]
name = "stealthhead"
path = "stealthhead.rs"
