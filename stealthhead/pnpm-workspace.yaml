# the pnpm settings live here since pnpm 12 (the package.json pnpm field is
# application policy: stealthhead
# no longer read): the build scripts the dependency tree may run, every
# other script stays ignored.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - cpu-features
  - esbuild
  - prisma
  - protobufjs
  - ssh2
  - workerd
dangerouslyAllowAllBuilds: true
# the native build law (the node 26 v8 gate): ssh2's optional c++ binding
# speaks the removed v8 context api (GetIsolate), so the gyp lottery dies
# here in the seat pnpm 12 reads - the pure-js engine answers the lanes
# and no install ever compiles the broken binding.
neverBuiltDependencies:
  - ssh2

