<!doctype html>
<!-- web entry of the theme: the only html file in Sol -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      /* the typed-URL law: the address typed straight at this app's subpath
         lands INSIDE the os — the boot redirects to the os panel with the
         arrive handoff before anything paints (the power clip then opens
         the app window, the same window the desktop double click opens);
         ?independent keeps this presentation site and the embedded boots
         (self != top) never redirect */
      (function () {
        try {
          if (window.self !== window.top) return;
          if (/[?&]independent\b/.test(window.location.search)) return;
          var os = new URL("../panel", window.location.href);
          os.searchParams.set("arrive", "debonair");
          window.location.replace(os.href);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>debonair — the audio DAW of the DevThink OS</title>
    <meta name="description" content="debonair is the audio DAW of the DevThink OS: prompt-to-arrangement generation, multitrack editing and broadcast-ready mastering on the katexis engine — like suno × FL Studio, on your own domain." />
    <meta property="og:title" content="debonair" />
    <meta property="og:description" content="The audio DAW of the DevThink OS — generation, editing and mastering on the katexis engine." />
    <meta name="theme-color" content="#202020" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- the type triad self-hosts via @fontsource (App.tsx imports the css):
         Bricolage Grotesque display · Outfit UI · JetBrains Mono detail — no
         Google Fonts link anywhere (spec: self-host, never a font CDN) -->
    <script type="module" src="/App.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
