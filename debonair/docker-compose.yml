# debonair docker-compose — the two-service deploy of the studio face: the
# static theme served by the debonair-face nginx door beside the /api/* proxy lane
# that carries every platform call to the debonair engine. until this file the
# app rode the registry image alone: no compose seated the pair, and every
# /api call of the face answered the away rehearsal. this file wires the
# pair the vault compose law standardizes:
#
#   debonair-engine  the debonair site container the publish lane builds from the staged
#           family context (the app nested under app/ with the cadria, saddle
#           and vault siblings the ownership and copy laws carry): the built
#           theme behind the unprivileged nginx, EXPOSE 8080, the wget listen
#           probe the image carries
#   debonair-face  the nginx surface: the family conf (nginx-face.conf) mounted over
#           the default conf — the resolver law, the security header law,
#           the gzip and cache law, the /api/* proxy lane to the engine,
#           the spa rewrite as try_files, host 8084 published on 8080.
#
# the engine image is the one the registry lane publishes (ghcr.io/wenathlan/debonair:<version>
# — the publish matrix); the publish matrix builds the same image from the staged family context (the app nested under app/ with the cadria, saddle and vault siblings the ownership and copy laws carry):
#
#   rm -rf familybuildctx && mkdir -p familybuildctx/app
#   cp -a debonair/. familybuildctx/app/
#   cp -a vault/. familybuildctx/vault/ && rm -rf familybuildctx/vault/node_modules
#   docker build -f debonair/Dockerfile familybuildctx
#
# the /api lane carries the platform calls same-origin: the face proxies
# them to the debonair container, and the data lanes the browser contract
# demands ride the configured gateway base the build stamps (the https law
# the modules carry).

services:
  debonair-engine:
    image: "ghcr.io/wenathlan/debonair:{DEBONAIR_VERSION:-2.0.166}"
    # the engine never publishes a port by default: the face proxies it on
    # the private compose network (the vault precedent). uncomment to serve
    # the engine lane directly behind your own door:
    # ports:
    #   - "3214:8080"
    # the healthcheck rides the image (wget -qO- http://127.0.0.1:8080/ —
    # the listen probe the site container carries): the face gates on it below.
    init: true
    restart: unless-stopped

  debonair-face:
    image: "ghcr.io/wenathlan/debonair:{DEBONAIR_VERSION:-2.0.166}"
    volumes:
      # the family conf over the default site conf: the resolver law, the
      # security headers, the gzip and cache law, the /api proxy lane.
      - ./nginx-face.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # the face starts only when the engine health lane answered — the
      # proxy upstream is live before the first /api/* call arrives.
      debonair-engine:
        condition: service_healthy
    ports:
      # the public door: host 8084 → the unprivileged nginx on 8080.
      # remap freely ("8085:8080") when another service owns the host.
      - "8084:8080"
    restart: unless-stopped
