[build]
  command = "pnpm build"
  # the family build law: the hashed bundles land flat at the application
  # root, so the publish lane mounts the root the ten siblings ride (the
  # faun seal answers on the http surface — the headers file below refuses
  # the database faces and no runtime store ever rides the build tree).
  publish = "."

[build.environment]
  NODE_VERSION = "26.8.2"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
