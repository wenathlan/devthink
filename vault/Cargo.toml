# vault — the rust version envelope crate of the family (the cargo channel).
# The crate carries the version constant the metadata lockstep stamps (the
# vault.java precedent: the registry lanes reference it, never compile it
# locally), the lane builds with `cargo package --no-verify --allow-dirty`
# and stamps the version before building.
[package]
name = "wenathlan-vault"
version = "2.0.176"
edition = "2021"
description = "The supabase clone — the self-hosted database, auth and storage surface"
license = "GPL-3.0-only"
repository = "https://github.com/wenathlan/devthink"
authors = ["wenathlan"]

[lib]
name = "vault"
path = "vault.rs"
