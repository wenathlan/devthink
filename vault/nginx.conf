# vault face — the nginx surface of the storage container pair.
# the static SPA (the product face the vite build staged) served beside the
# /api/* proxy lane that carries every storage call to the engine
# service. until this conf the container served the SPA alone — the
# engine never rode production, and every storage call of the face
# answered the away rehearsal.
#
# the resolver is the docker embedded dns (127.0.0.11) — the vault face law
# the family standardizes: the engine hostname resolves at request time, so
# this container starts even while the engine recovers and keeps answering
# after an engine recreation changes its address (an upstream block would
# pin the address at config load and die with the first engine restart).

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # the staged SPA surface (the shell, the hashed bundles, the fonts,
    # the icons and the crawler files the face-build stage copied).
    root /usr/share/nginx/html;
    index index.html;

    # the security header set the netlify _headers file declares — one
    # header law across every deploy surface of the family.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # the transport law: the text faces ride compressed, the proxied
    # answers included (gzip_proxied any — the engine lanes compress the
    # same way).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml text/webmanifest;

    # the api lane — every /api/* call rides the engine upstream (the
    # compose `engine` service, port 8080): the ^~ law keeps the lane
    # ahead of every regex block below (a hashed asset pattern never steals
    # an api path), the token headers (authorization, x-vault-token) and
    # the deposit headers (x-project-id, x-object-path, x-object-mime)
    # pass verbatim, the raw bodies ride un-sized (client_max_body_size 0 —
    # the quota gate of the engine is the only ceiling a deposit answers),
    # and the generous read window covers the verified reads and the sweeps
    # of large ledgers.
    location ^~ /api/ {
        set $vault_engine http://engine:8080;
        proxy_pass $vault_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # the faun block of the face lane (the vault law the family rides): a
    # database face inside the staged tree (a stray store, a committed
    # backup) answers 403 — the raw database never ships over the face,
    # the data flows through /api only (the engine's own static lane
    # carries the same refusal).
    location ~* \.(db|sqlite|sqlite3)(-wal|-shm|-journal)?$ {
        return 403;
    }

    # the root-emit seal: the staged tree carries the sources beside the
    # built faces (the family root-emit law), so the faces the platform
    # lanes never publish answer the refusal here — the engine sources,
    # the manifests and the lockfiles never leave the tree.
    location ~* \.(ts|tsx|mts|cts|sql|prisma|lock|gemspec|csproj|java|go|kts|jsonc|json|toml|xml)(-wal|-shm|-journal)?$ {
        return 403;
    }

    # the dotfile seal: the environment faces (.env, the editor seats)
    # never answer over the face.
    location ~* /\. {
        return 403;
    }

    # the tree seal: the source homes the build never assembles refuse the
    # same way (the modules, the suites, the docs, the sol sources).
    location ~* ^/(node_modules|tests|docs|sol)(/|$) {
        return 403;
    }

    # the hashed-asset cache law: the bundles the build stamps carry the
    # content hash in the name, so the long lease is honest — the security
    # header set repeats inside the lease the way the nginx inheritance law
    # demands (an add_header at the location level would drop the server set).
    location ~* \.(js|css|svg|woff2?|png|jpg|jpeg|webp|avif|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # the SPA rewrite the vercel/netlify configs declare: every deep link
    # serves the shell, the router resolves it (the former nginx
    # container had no fallback — a deep link answered 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
