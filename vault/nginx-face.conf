# vault face — the nginx surface of the storage container pair: the
# static SPA (the product face the vite build staged) served beside the
# /api/* proxy lane that carries every storage call to the engine
# service. until this conf the container served the SPA alone — the
# engine never rode production, and every storage call of the face
# answered the away rehearsal.
#
# the resolver is the docker embedded dns (127.0.0.11): the engine
# hostname resolves at request time, so this container starts even while
# the engine recovers and keeps answering after an engine recreation
# changes its address (an upstream block would pin the address at config
# load and die with the first engine restart).

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # the staged SPA surface (the shell, the hashed bundles, the fonts,
    # the icons and the crawler files the face-build stage copied).
    root /usr/share/nginx/html;
    index index.html;

    # the security header set the netlify _headers file declares — one
    # header law across every deploy surface of the family.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # the api lane — every /api/* call rides the engine upstream (the
    # compose `engine` service, port 8080): the token headers
    # (authorization, x-vault-token) and the deposit headers
    # (x-project-id, x-object-path, x-object-mime) pass verbatim, the
    # raw bodies ride un-sized (client_max_body_size 0 — the quota gate
    # of the engine is the only ceiling a deposit answers), and the
    # generous read window covers the verified reads and the sweeps of
    # large ledgers.
    location /api/ {
        set $vault_engine http://engine:8080;
        proxy_pass $vault_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # the SPA rewrite the vercel/netlify configs declare: every deep
    # link serves the shell, the router resolves it (the former nginx
    # container had no fallback — a deep link answered 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
