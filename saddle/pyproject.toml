# saddle — the python adapter envelope of the family (the pypi channel).
# Ships the same envelope the gem face packs: the license, the readme, the
# changelog and the SaddleCli adapter.
# Built by the publish lane with `python -m build` (PEP 517); the version
# rides the SADDLE_VERSION environment the metadata lockstep stamps — the
# pyproject table cannot fetch an environment the gemspec reads, so the
# static version below is the fallback the lane sed-stamps before building.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wenathlan-saddle"
version = "2.0.172"
authors = [{name = "wenathlan"}]
description = "Binary computing engine that turns distributed storage into a publishable working set, carrying the merged virtual-hardware engine CLI process adapter (explicit local invocations, no shell, no credentials, no host hardware)"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.11"

# The envelope carries no python code — the empty package list keeps the
# build honest while the MANIFEST.in packs the envelope files.
[tool.setuptools]
packages = []
