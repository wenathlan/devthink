# saddle — the rust version envelope crate of the family (the cargo channel).
# The crate carries the version constant the metadata lockstep stamps (the
# Saddle.java precedent: the registry lanes reference it, never compile it
# locally), the lane builds with `cargo package --no-verify --allow-dirty`
# and stamps the version before building.
[package]
name = "wenathlan-saddle"
version = "2.0.170"
edition = "2021"
description = "Binary computing engine that turns distributed storage into a publishable working set, carrying the merged virtual-hardware engine CLI process adapter (explicit local invocations, no shell, no credentials, no host hardware)"
license = "GPL-3.0-only"
repository = "https://github.com/wenathlan/saddle"
authors = ["wenathlan"]

[lib]
name = "saddle"
path = "saddle.rs"
