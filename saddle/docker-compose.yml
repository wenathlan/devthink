# saddle docker-compose — the two-service deploy of the sandbox engine face: the
# static theme served by the saddle-face nginx door beside the /api/* proxy lane
# that carries every platform call to the saddle engine. until this file the
# app rode the registry image alone: no compose seated the pair, and every
# /api call of the face answered the away rehearsal. this file wires the
# pair the vault compose law standardizes:
#
#   saddle-engine  the sandbox engine (node webserver.ts — the /api/v1 contract the
#           webserver answers: health, the spec catalogs, the sandbox lanes),
#           the sqlite state home on the named volume, one process on
#           SADDLE_PORT
#   saddle-face  the nginx surface: the family conf (nginx.conf) mounted over
#           the default conf — the resolver law, the security header law,
#           the gzip and cache law, the /api/* proxy lane to the engine,
#           the spa rewrite as try_files, host 8089 published on 8080.
#
# the engine builds from the repository root context (the saddle Dockerfile reads saddle/ nested with the vault sibling — the engine-ownership law). boot the pair from this directory:
#
#   docker compose up -d --build
#
# the /api lane carries the platform calls same-origin to the engine; the
# state home rides the named volume (the saddledata seat under /app/data — the sqlite truth survives every redeploy).
# remap the host port freely when another service owns the host.

services:
  saddle-engine:
    build:
      context: ..
      dockerfile: saddle/Dockerfile
      target: base
      args:
        SADDLE_VERSION: "{SADDLE_VERSION:-2.0.166}"
    image: "ghcr.io/wenathlan/saddle-engine:{SADDLE_VERSION:-2.0.166}"
    environment:
      SADDLE_PORT: "8080"
      SADDLE_HOST: "0.0.0.0"
      SADDLE_DB: "/app/data/saddle.db"
    volumes:
      - saddledata:/app/data
    # the engine never publishes a port by default: the face proxies it on
    # the private compose network (the vault precedent). uncomment to serve
    # the engine lane directly behind your own door:
    # ports:
    #   - "3219:8080"
    # the healthcheck rides the image (node fetch /api/v1/health — the
    # public health route the webserver answers, j.ok must be true): the
    # face gates on it below.
    init: true
    restart: unless-stopped

  saddle-face:
    image: "nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6"
    volumes:
      # the family conf over the default site conf: the resolver law, the
      # security headers, the gzip and cache law, the /api proxy lane.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # the staged static build: the web build the operator runs stages the
      # hashed bundles at the application root (the family root-emit law —
      # run the saddle web build before compose up); the conf seals the
      # source faces the platform lanes never publish.
      - ./:/usr/share/nginx/html:ro
    depends_on:
      # the face starts only when the engine health lane answered — the
      # proxy upstream is live before the first /api/* call arrives.
      saddle-engine:
        condition: service_healthy
    ports:
      # the public door: host 8089 → the unprivileged nginx on 8080.
      # remap freely ("8090:8080") when another service owns the host.
      - "8089:8080"
    restart: unless-stopped

volumes:
  # the state home of the sandbox engine (mounted at /app/data): the sqlite
  # store lives here, surviving every redeploy of both services.
  saddledata:
