name: saddle web pages

on:
  push:
    branches: [main]
    paths:
      - "Sol/**"
      - "*.ts"
      - "*.tsx"
      - "*.html"
      - "*.css"
      - "*.json"
      - "*.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: configure pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: check web
        run: npm run web:check
      - name: normalize pages base path
        shell: bash
        env:
          CONFIGURED_BASE_PATH: ${{ vars.SADDLE_PAGES_BASE_PATH || steps.pages.outputs.base_path || format('/{0}/', github.event.repository.name) }}
        run: |
          set -euo pipefail
          base_path="${CONFIGURED_BASE_PATH}"
          [[ "${base_path}" == /* ]] || base_path="/${base_path}"
          [[ "${base_path}" == */ ]] || base_path="${base_path}/"
          echo "VITE_BASE_PATH=${base_path}" >> "${GITHUB_ENV}"
      - name: build web
        run: npm run web:build:pages
      - name: stage the delivered web surface
        # the build answers straight at the application root: the staging
        # copies the entry, the fallback and the hashed bundles out of the
        # root by type, and the sources never reach the artifact.
        run: |
          set -euo pipefail
          mkdir -p build/pages
          cp index.html build/pages/
          cp 404.html build/pages/ 2>/dev/null || cp index.html build/pages/404.html
          for kind in js css webmanifest xml txt svg png ico woff woff2; do
            cp *.${kind} build/pages/ 2>/dev/null || true
          done
          touch build/pages/.nojekyll
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
