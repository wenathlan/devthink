<!doctype html>
<!-- web entry of the Sol theme (the only html of the theme) -->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      /* the typed-URL law: the address typed straight at this app's subpath
         lands INSIDE the os — the boot redirects to the os panel with the
         arrive handoff before anything paints (the power clip then opens
         the app window, the same window the desktop double click opens);
         ?independent keeps this presentation site and the embedded boots
         (self != top) never redirect */
      (function () {
        try {
          if (window.self !== window.top) return;
          if (/[?&]independent\b/.test(window.location.search)) return;
          var os = new URL("../panel", window.location.href);
          os.searchParams.set("arrive", "saddle");
          window.location.replace(os.href);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>saddle — the sandbox engine of the family</title>
    <meta name="description" content="Saddle turns distributed storage into publishable computational memory: one line declares the sandbox, the engine boots it." />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the trylle foundation faces: Inter rides the reading and the UI body,
         Geist Mono rides the micro-labels and the terminal surfaces
         (display=swap, never FOUT-blocked) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Geist+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./App.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
