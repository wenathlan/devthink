<footer><p class="muted">The relay sees metadata only — plan text and statuses cross the bridge while page content never leaves the browser without the explicit consent flag. No telemetry is collected.</p></footer></main>
<script>
/* Devthink chatbridge of the 1.1.82 site integration family: pure vanilla script, no build step, no framework and no telemetry.
   The static site speaks the servercontract over one websocket to the relay url the visitor typed: the pairing code exchanges
   for a session token that authenticates every frame, the chat task text crosses as reviewed text while page content never
   rides a frame, the plan proposals render as review cards and every decision returns to the extension review gate — the site
   never executes an action because the extension stays the only executor. */

(function () {
  "use strict";
  var relaykey = "devthinkrelayurl";
  var state = { socket: null, sessionid: "", token: "", memberid: "site-" + Math.random().toString(36).slice(2, 8), sequence: 0, heartbeat: null, cards: [], rows: [], manifest: { servercontract: 1 } };
  var relayurlinput = document.getElementById("relayurl");
  var pairingcodeinput = document.getElementById("pairingcode");
  var heartbeatinput = document.getElementById("heartbeatms");
  var statusline = document.getElementById("bridgestatus");
  var chatlog = document.getElementById("chatlog");
  var chatinput = document.getElementById("chatinput");
  var reviewcards = document.getElementById("reviewcards");

  function readmanifest() {
    var node = document.getElementById("devthink-sitemanifest");
    if (node === null) return;
    try { state.manifest = JSON.parse(node.textContent); } catch (error) { void error; }
  }

  function statuslabel(label) { if (statusline !== null) statusline.textContent = "Bridge: " + label + "."; }

  function opid() { state.sequence += 1; return "op-" + state.memberid + "-" + state.sequence; }

  function frame(operation, body) {
    return JSON.stringify({ version: state.manifest.servercontract, op: operation, opid: opid(), ...(state.sessionid !== "" ? { sessionid: state.sessionid } : {}), ...(state.token !== "" ? { token: state.token } : {}), at: Date.now(), ...(body !== undefined ? { body: body } : {}) });
  }

  function sendframe(operation, body) {
    if (state.socket === null || state.socket.readyState !== 1) { statuslabel("offline, the frame waits for the socket"); return false; }
    state.socket.send(frame(operation, body));
    return true;
  }

  function postevent(kind, stream, payload) { return sendframe("eventpost", { kind: kind, stream: stream, payload: payload }); }

  function renderchat() {
    if (chatlog === null) return;
    chatlog.replaceChildren();
    for (var index = 0; index < state.rows.length; index += 1) {
      var row = state.rows[index];
      var line = document.createElement("p");
      line.className = row.mine ? "chatrow mine" : "chatrow";
      line.textContent = row.from + ": " + row.text;
      chatlog.append(line);
    }
  }

  function rendercards() {
    if (reviewcards === null) return;
    reviewcards.replaceChildren();
    if (state.cards.length === 0) { reviewcards.textContent = "No plan proposal yet; review cards render here and every decision returns to the extension review gate."; return; }
    for (var index = 0; index < state.cards.length; index += 1) {
      var card = state.cards[index];
      var block = document.createElement("article");
      block.className = "reviewcard";
      var title = document.createElement("h3");
      title.textContent = card.title;
      block.append(title);
      var steps = document.createElement("ul");
      for (var stepindex = 0; stepindex < card.steps.length; stepindex += 1) {
        var step = card.steps[stepindex];
        var item = document.createElement("li");
        item.textContent = step.id + ": " + step.kind + " on " + step.origin + (step.sensitive === true ? " (sensitive)" : "");
        steps.append(item);
      }
      block.append(steps);
      var controls = document.createElement("div");
      controls.className = "actions";
      var decisions = [["approved", "Approve"], ["changes", "Request changes"], ["refused", "Refuse"]];
      for (var decisionindex = 0; decisionindex < decisions.length; decisionindex += 1) {
        var pair = decisions[decisionindex];
        var button = document.createElement("button");
        button.type = "button";
        button.className = pair[0] === "approved" ? "" : "secondary";
        button.textContent = pair[1];
        button.addEventListener("click", decide(card, pair[0]));
        controls.append(button);
      }
      block.append(controls);
      reviewcards.append(block);
    }
  }

  function decide(card, decision) {
    return function () {
      var payload = { proposalid: card.proposalid, decision: decision, by: "site reviewer" };
      if (postevent("planreview", "review", payload)) {
        for (var index = 0; index < state.cards.length; index += 1) if (state.cards[index].proposalid === card.proposalid) state.cards.splice(index, 1);
        rendercards();
        statuslabel("connected, the " + decision + " decision returned to the extension review gate");
      }
    };
  }

  function handleframe(textframe) {
    var envelope;
    try { envelope = JSON.parse(textframe); } catch (error) { void error; return; }
    if (envelope.op === "sessionjoin" || envelope.op === "sessioncreate") {
      if (envelope.body !== undefined) {
        if (typeof envelope.body.sessionid === "string" && envelope.body.sessionid !== "") state.sessionid = envelope.body.sessionid;
        if (typeof envelope.body.token === "string" && envelope.body.token !== "") state.token = envelope.body.token;
      }
      statuslabel("connected and paired on the session " + state.sessionid);
      startheartbeat();
      return;
    }
    if (envelope.op === "eventpost" && envelope.body !== undefined) {
      var body = envelope.body;
      if (body.kind === "chat" && body.payload !== undefined) {
        state.rows.push({ from: String(body.payload.from || "extension"), text: String(body.payload.text || ""), mine: false });
        if (state.rows.length > 60) state.rows.shift();
        renderchat();
      }
      if (body.kind === "planproposal" && body.payload !== undefined) {
        var card = { proposalid: String(body.payload.proposalid || ""), title: String(body.payload.title || ""), steps: Array.isArray(body.payload.steps) ? body.payload.steps : [] };
        if (card.proposalid !== "" && card.title !== "") { state.cards.push(card); rendercards(); }
      }
    }
  }

  function startheartbeat() {
    stopheartbeat();
    var raw = heartbeatinput !== null ? heartbeatinput.value.trim() : "";
    if (raw === "" || !Number.isFinite(Number(raw)) || Number(raw) <= 0) return;
    var interval = Number(raw);
    state.heartbeat = setInterval(function () { postevent("progress", "heartbeat", { stepid: "heartbeat", status: "alive" }); }, interval);
  }

  function stopheartbeat() { if (state.heartbeat !== null) { clearInterval(state.heartbeat); state.heartbeat = null; } }

  function connect() {
    var url = relayurlinput !== null ? relayurlinput.value.trim() : "";
    var code = pairingcodeinput !== null ? pairingcodeinput.value.trim() : "";
    if (url === "") { statuslabel("offline, the relay url is always yours to type"); return; }
    if (code === "") { statuslabel("offline, the pairing code comes from the extension options"); return; }
    if (url.indexOf("wss://") !== 0 && url.indexOf("ws://") !== 0) { statuslabel("offline, the relay url rides wss"); return; }
    try { window.localStorage.setItem(relaykey, url); } catch (error) { void error; }
    statuslabel("connecting to the relay");
    var socket = new WebSocket(url);
    state.socket = socket;
    socket.onopen = function () {
      var joinid = opid();
      var body = { role: "site", memberid: state.memberid, capabilities: state.manifest.capabilities, pairingcode: code };
      socket.send(JSON.stringify({ version: state.manifest.servercontract, op: "sessionjoin", opid: joinid, at: Date.now(), body: body }));
      statuslabel("authenticating the pairing code");
    };
    socket.onmessage = function (event) { handleframe(String(event.data)); };
    socket.onclose = function () {
      state.socket = null;
      stopheartbeat();
      statuslabel(state.sessionid !== "" ? "paired, socket offline" : "offline");
    };
    socket.onerror = function () { statuslabel("offline, the relay socket failed"); };
  }

  function disconnect() {
    stopheartbeat();
    if (state.socket !== null) { try { state.socket.close(1000); } catch (error) { void error; } state.socket = null; }
    statuslabel("offline");
  }

  function sendchat() {
    var text = chatinput !== null ? chatinput.value.trim() : "";
    if (text === "") return;
    if (postevent("chat", "chat", { text: text, from: state.memberid })) {
      state.rows.push({ from: state.memberid, text: text, mine: true });
      if (state.rows.length > 60) state.rows.shift();
      renderchat();
      if (chatinput !== null) chatinput.value = "";
    }
  }

  var connectbutton = document.getElementById("connect");
  if (connectbutton !== null) connectbutton.addEventListener("click", connect);
  var disconnectbutton = document.getElementById("disconnect");
  if (disconnectbutton !== null) disconnectbutton.addEventListener("click", disconnect);
  var chatsendbutton = document.getElementById("chatsend");
  if (chatsendbutton !== null) chatsendbutton.addEventListener("click", sendchat);
  if (chatinput !== null) chatinput.addEventListener("keydown", function (event) { if (event.key === "Enter") sendchat(); });
  if (heartbeatinput !== null) heartbeatinput.addEventListener("change", function () { if (state.socket !== null && state.socket.readyState === 1) startheartbeat(); });

  readmanifest();
  try {
    var stored = window.localStorage.getItem(relaykey);
    if (stored !== null && stored !== "" && relayurlinput !== null) relayurlinput.value = stored;
  } catch (error) { void error; }
})();

</script>
</template>

<section><h2>Native host bridge</h2><div class="panel"><label for="nativehostname">Native host name (the manifest registers it; always your choice)</label><input id="nativehostname" type="text" placeholder="com.your-domain.devthink" autocomplete="off"><label for="nativeprofiledir">User profile directory the installer writes into</label><input id="nativeprofiledir" type="text" placeholder="/home/you/.config/chromium-profile" autocomplete="off"><label for="nativeinstallconsent">Consent to the host registration (the scope explains before any write)</label><input id="nativeinstallconsent" type="checkbox"><label for="nativetransportconsent">Consent to the first native host attach</label><input id="nativetransportconsent" type="checkbox"><label for="nativereadconsent">Read call class consent</label><input id="nativereadconsent" type="checkbox"><label for="nativeinteractionconsent">Interaction call class consent</label><input id="nativeinteractionconsent" type="checkbox"><label for="nativesensitiveconsent">Sensitive call class consent</label><input id="nativesensitiveconsent" type="checkbox"><label for="nativeosdialogconsent">Os dialog surface consent (its own grant, never a class grant)</label><input id="nativeosdialogconsent" type="checkbox"><label for="nativenotificationconsent">Notification surface consent (its own grant, never a class grant)</label><input id="nativenotificationconsent" type="checkbox"><label for="nativeidlewindow">Idle window (ms, empty never expires a wsbridge session)</label><input id="nativeidlewindow" type="number" min="1" placeholder="no idle window"><label for="nativeheartbeatinterval">Heartbeat interval (ms, empty sends no heartbeat frames)</label><input id="nativeheartbeatinterval" type="number" min="1" placeholder="no heartbeat"><label for="nativecallratelimit">Rate cap per session (calls, empty stays unbounded)</label><input id="nativecallratelimit" type="number" min="1" placeholder="no cap"><label for="nativecallratewindow">Rate window (ms)</label><input id="nativecallratewindow" type="number" min="1" placeholder="no window"><button id="nativesettings">Save native bridge options</button><div class="actions"><button id="nativeinstall" class="secondary">Record install consent</button><button id="nativeuninstall" class="secondary">Revoke install consent</button><button id="nativeattach" class="secondary">Attach native port</button><button id="nativedetach" class="secondary">Detach</button><button id="nativediagnostics" class="secondary">Diagnostics</button><button id="nativekill" class="danger">Kill switch</button><button id="nativeescape" class="danger">Escape hatch</button></div><div id="nativebanner" class="bannercard" hidden></div><p id="nativestatusline" class="muted">Native bridge: nothing installed, the transport stays deny by default.</p></div></section>
<section><h2>Model provider gateways</h2><div class="panel"><div id="gatewayproviderlist"></div><label for="gatewaykind">Provider adapter</label><select id="gatewaykind" aria-label="Provider adapter"><option value="openaicompat">openaicompat (chat completions shape)</option><option value="anthropicgateway">anthropicgateway (messages shape)</option><option value="geminigateway">geminigateway (generate content shape)</option><option value="ollamalocal">ollamalocal (localhost runtime)</option></select><label for="gatewayid">Provider id</label><input id="gatewayid" type="text" placeholder="my-gateway" autocomplete="off"><label for="gatewaybase">Base url (always your choice, empty leaves the ollama localhost default)</label><input id="gatewaybase" type="text" placeholder="https://your-gateway.example" autocomplete="off"><label for="gatewayprefix">Path prefix for gateway deployments (optional)</label><input id="gatewayprefix" type="text" placeholder="team-namespace" autocomplete="off"><label for="gatewaykey">Api key (stores behind the vault seam with your consent)</label><input id="gatewaykey" type="password" placeholder="key material never persists in settings" autocomplete="off"><button id="gatewaycreate">Add provider gateway (starts disabled)</button><p id="gatewaynote" class="muted">No provider endpoint is contacted unless you configured one; every remote provider ships with an empty base url and the ollamalocal adapter alone defaults to the localhost machine.</p></div></section><section><h2>Syncbridge</h2><div class="panel"><div id="syncproviderlist"></div><label for="syncprovider">Provider</label><select id="syncprovider" aria-label="Syncbridge provider"><option value="file">File provider</option><option value="web">Web provider stub</option></select><label for="syncendpoint">User configured endpoint</label><input id="syncendpoint" type="text" placeholder="registry url or file label"><button id="synccreate">Add hook (starts opted out)</button><div id="syncconflicts"></div></div></section>

<template data-surface="transparencypage">
<main>
<h1>Devthink transparency</h1>
<p>Every active grant with its grant date, every permission with its consuming surface, every stored data kind with its location and its purge and export links, the active consent sessions with their expiry, the audit trail integrity check result, every allowed external sender and the permdiff of each installed update — with a revoke action beside every listed grant. The page runs entirely offline and issues no external request; the secretvault manages labels only and no surface ever displays or exports a secret value.</p>

<template data-surface="sandbox">
<script>
/** The sandbox frame host: this page runs under the manifest sandbox key with no extension privileges, so the untrusted markup it renders never touches extension surfaces; scripts and event handlers are already stripped before arrival and the inner iframe stays fully sandboxed. */
window.addEventListener("message", event => {
  const data = event.data || {};
  if (data.channel !== "devthinksandbox" || data.type !== "render") return;
  var nonce = data.nonce;
  var frame = document.getElementById("devthinksandboxframe");
  if (frame) frame.remove();
  frame = document.createElement("iframe");
  frame.id = "devthinksandboxframe";
  frame.setAttribute("sandbox", "");
  frame.setAttribute("aria-hidden", "true");
  frame.style.display = "none";
  frame.srcdoc = "<!doctype html><html><body>" + data.markup + "
</template>
<template data-surface="offscreen">
<script type="module" src="offscreen.js"></script>
</template>
<script>
/* The surface switcher of the one devthink design: the page carries every surface of the interface as inert templates and activates one at a time from the location hash, so the same file serves the deployed web, the extension builds and the android shell. The site surface runs its inline chatbridge wiring, while the extension surfaces render as design previews on the open web because their compiled behavior ships with the extension alone. */
(function () {
  "use strict";
  var nav = document.getElementById("surfacenav");
  var live = document.getElementById("surfacelive");
  var surfaces = ["site", "popup", "sidepanel", "dashboardpage", "optionspage", "transparencypage"];
  function markactive(name) {
    if (!nav) return;
    var links = nav.querySelectorAll("button");
    for (var index = 0; index < links.length; index += 1) {
      var active = links[index].getAttribute("data-surface") === name;
      links[index].className = active ? "" : "secondary";
    }
  }
  function activatesurface(name) {
    var template = document.querySelector('template[data-surface="' + name + '"]');
    if (!template) return;
    live.innerHTML = "";
    live.appendChild(template.content.cloneNode(true));
    var scripts = Array.prototype.slice.call(live.querySelectorAll("script"));
    for (var index = 0; index < scripts.length; index += 1) {
      var original = scripts[index];
      if (original.getAttribute("src")) continue; /* the compiled surface scripts ship inside the extension; the open web renders the design */
      var replacement = document.createElement("script");
      var kind = original.getAttribute("type");
      if (kind) replacement.setAttribute("type", kind);
      replacement.textContent = original.textContent;
      original.parentNode.replaceChild(replacement, original);
    }
    markactive(name);
  }
  function switchsurface(name) {
    if (surfaces.indexOf(name) < 0) name = "site";
    if (location.hash !== "#" + name) { location.hash = "#" + name; return; }
    activatesurface(name);
  }
  if (nav) {
    for (var index = 0; index < surfaces.length; index += 1) {
      var name = surfaces[index];
      var link = document.createElement("button");
      link.setAttribute("data-surface", name);
      link.textContent = name;
      link.addEventListener("click", function () { switchsurface(this.getAttribute("data-surface")); });
      nav.appendChild(link);
    }
  }
  var initial = (location.hash || "#site").slice(1);
  if (surfaces.indexOf(initial) < 0) initial = "site";
  activatesurface(initial);
  window.addEventListener("hashchange", function () { activatesurface((location.hash || "#site").slice(1)); });
})();
</script>
