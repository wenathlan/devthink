# netlify deploy manifest for the gateway web interface
# lives inside web/ next to the interface it deploys — the folder is
# the deploy-ready unit (same rule as vercel.json and capacitor.config.ts)

[build]
  command = "cd .. && bun install && bun run db:generate && bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/api/*"
  [headers.values]
    access-control-allow-origin = "*"
    access-control-allow-methods = "GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS"
    access-control-allow-headers = "content-type,authorization,x-token,x-chat-id,x-user-id,x-session-id,x-request-id,x-thinking-level,x-model,accept"
    access-control-max-age = "86400"
    cache-control = "no-cache, no-transform"
    x-accel-buffering = "no"
